[item-name]
paranoidal-warp-drive=BnL Jump™ warp drive
paranoidal-warp-charge=Warp charge

[item-description]
paranoidal-warp-drive=Moves the space platform to another warp sector: from a sector gate or home orbit to the gate of another sector or home. Built only on a platform, one per platform. A jump: 1 warp charge, 30 seconds of spin-up, 10 MW.
paranoidal-warp-charge=One charge, one jump of the warp drive. Made at the factory and sent to the ship by rocket: 10 per rocket. The BnL warranty does not cover the destination.

[entity-name]
paranoidal-warp-drive=BnL Jump™ warp drive
space-platform-hub=Bridge of the Axiom-7

[entity-description]
paranoidal-warp-drive=Moves the space platform to another warp sector: from a sector gate or home orbit to the gate of another sector or home. Built only on a platform, one per platform. A jump: 1 warp charge, 30 seconds of spin-up, 10 MW. The destination is chosen in the drive's window.
space-platform-hub=The core of the space platform — what is left of the bridge of the starliner Axiom-7. Receives items from home orbit and sends them to cargo landing pads. Send a [item=space-platform-starter-pack] into space to create it. The BnL logo cannot be removed: the licence agreement says so.

[recipe-name]
paranoidal-warp-jump=Warp jump

[technology-name]
paranoidal-warp-drive=Warp drive

[technology-description]
paranoidal-warp-drive=The BnL Jump™ warp drive, warp charges and three warp sectors: BnL™ Coverage Zone, BnL Fleet Necropolis and Cut-off for Non-payment Zone. Inside a sector the platform flies under its own power; between sectors and home it jumps.

