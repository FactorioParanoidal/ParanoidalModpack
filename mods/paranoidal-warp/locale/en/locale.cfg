[mod-name]
paranoidal-warp=Paranoidal Warp

[mod-description]
paranoidal-warp=The warp odyssey of the Space Age branch, stage 2: the ship flies and jumps.\n\n— Three warp sectors: BnL™ Coverage Zone, BnL Fleet Necropolis, Cut-off for Non-payment Zone. Each has a gate and two points with short routes of a few minutes of flight, its own sky, sun and asteroids.\n— The BnL Jump™ warp drive moves the platform from a sector gate or home orbit to the gate of another sector: 1 warp charge, 30 seconds of spin-up, 10 MW.\n— The platform hub is the bridge of the Axiom-7 with the BnL logo.\n\nDoes nothing without Space Age.

