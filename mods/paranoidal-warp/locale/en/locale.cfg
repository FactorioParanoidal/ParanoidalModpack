[technology-description]
paranoidal-warp-drive=The BnL Jump™ warp drive, warp charges and three warp sectors: BnL™ Coverage Zone, BnL Fleet Necropolis and Cut-off for Non-payment Zone. Inside a sector the platform flies under its own power; between sectors and home it jumps.
paranoidal-warp-comfort-field=The Comfort™ field generator: without it demons of the sins of consumption climb on deck in the warp sectors. The BnL subscription renews automatically, bills come for the warp years of every jump.
paranoidal-warp-void-shield=The void shield: the last line against asteroids the turrets did not shoot down.

