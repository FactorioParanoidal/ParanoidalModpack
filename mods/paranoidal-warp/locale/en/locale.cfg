[space-location-description]
paranoidal-warp-coverage-gate=Warp jump point. A calm sector: sun as in home orbit, many asteroid chunks, a few small asteroids. BnL ads come in loud and clear — they cannot be switched off.
paranoidal-warp-coverage-buoy=A BnL ad buoy in the Coverage Zone, reached under the ship's own power from the gate. It announces day and night that Earth is waiting for you.
paranoidal-warp-coverage-feedback=The feedback desk of the Coverage Zone, reached under the ship's own power. All feedback is reviewed within 700 years.
paranoidal-warp-necropolis-gate=Warp jump point. Wrecks of other BnL starliners: more metal, medium and big asteroids — turrets needed. Half the sun of home orbit. Every starliner here is still listed "en route on schedule".
paranoidal-warp-necropolis-wrecks=The debris field of the BnL Fleet Necropolis, reached under the ship's own power. The debris is still BnL copyright.
paranoidal-warp-necropolis-hangar=The hangar of cancelled cruises in the BnL Fleet Necropolis, reached under the ship's own power. The cruises were cancelled, the subscriptions were not.
paranoidal-warp-cutoff-gate=Warp jump point. No sun: BnL switched it off for non-payment of the subscription. Solar panels give no power — reactors needed. Carbonic and oxide asteroids.
paranoidal-warp-cutoff-collection=The collection office of the Cut-off Zone, reached under the ship's own power. No sun. The debt keeps growing in the dark.
paranoidal-warp-cutoff-tariff=The dark tariff of the Cut-off Zone, reached under the ship's own power. No sun. Darkness is included in the tariff free of charge.

