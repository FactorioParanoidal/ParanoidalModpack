[item-description]
paranoidal-warp-drive=Moves the space platform to another warp sector: from a sector gate or home orbit to the gate of another sector or home. Built only on a platform, one per platform. A jump: 1 warp charge, 30 seconds of spin-up, 10 MW.
paranoidal-warp-charge=One charge, one jump of the warp drive. Made at the factory and sent to the ship by rocket: 10 per rocket. The BnL warranty does not cover the destination.
paranoidal-warp-comfort-field=Shields the ship from the warp while it has power: 5 MW. A weak field means cracks in the dome and demons on deck. One per platform, built only on a platform.
paranoidal-warp-void-shield=Bursts asteroids that reach the ship with its stored energy: 100 MJ, charged at 5 MW. Several shields add up. Built only on a platform.

[entity-name]
paranoidal-warp-drive=BnL Jump™ warp drive
space-platform-hub=Bridge of the Axiom-7
paranoidal-warp-comfort-field=Comfort™ field generator
paranoidal-warp-void-shield=Void shield

[entity-description]
paranoidal-warp-drive=Moves the space platform to another warp sector: from a sector gate or home orbit to the gate of another sector or home. Built only on a platform, one per platform. A jump: 1 warp charge, 30 seconds of spin-up, 10 MW. The destination is chosen in the drive's window.
space-platform-hub=The core of the space platform — what is left of the bridge of the starliner Axiom-7. Receives items from home orbit and sends them to cargo landing pads. Send a [item=space-platform-starter-pack] into space to create it. The BnL logo cannot be removed: the licence agreement says so.
paranoidal-warp-comfort-field=The Comfort™ field shields the ship from the warp while it has power. Officially it runs on the passengers' attention to ads, unofficially on 5 MW. The weaker the field, the more cracks in the dome and the more often demons of the sins of consumption climb on deck; those already aboard stay until killed. BnL subscription: a bill in goods for the warp years of every jump, the bridge pays by itself from its storage, due in 15 minutes; every overdue bill takes 30% off the field. Outside the warp sectors the generator switches itself off. One per platform, built only on a platform.
paranoidal-warp-void-shield=Asteroids that reach the ship burst on the shield; it also takes asteroid hits off buildings. It spends its stored energy: small asteroid 2.5 MJ, medium 10 MJ, big 50 MJ. Stores 100 MJ, charges at 5 MW, never gives energy back; several shields add up. An empty shield lets asteroids hit the hull and break the foundation. Turrets are still needed: the shield is the last line. Asteroid chunks for the collectors pass through.

