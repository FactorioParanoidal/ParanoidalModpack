[mod-name]
paranoidal-warp=Paranoidal Warp

[mod-description]
paranoidal-warp=The warp odyssey of the Space Age branch: the ship flies, jumps and holds out.\n\n— Three warp sectors: BnL™ Coverage Zone, BnL Fleet Necropolis, Cut-off for Non-payment Zone. Each has a gate and two points with short routes of a few minutes of flight, its own sky, sun and asteroids.\n— The BnL Jump™ warp drive moves the platform from a sector gate or home orbit to the gate of another sector: 1 warp charge, 30 seconds of spin-up, 10 MW.\n— Warp years: every jump adds years to the expedition, a chronometer "En route" over the bridge, letters from home.\n— The Comfort™ field generator (5 MW) shields the ship in the warp. BnL subscription: a bill for the years of every jump, paid in goods from the bridge; an overdue bill weakens the field. A weak field means cracks in the dome and demons of the four sins of consumption on deck.\n— The void shield bursts incoming asteroids with its stored energy; without it hits reach the hull and break the foundation.\n— Red alert: light, siren and AUTO messages while demons are aboard or after a breach.\n— The platform hub is the bridge of the Axiom-7 with the BnL logo.\n\nDoes nothing without Space Age.

