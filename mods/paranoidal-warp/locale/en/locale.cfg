demon-description-rage=Sin of consumption: Sale Rage — 700 years of running to the till. Fast and furious, hits up close.
demon-description-fineprint=Sin of consumption: Fine Print — "blue is the new red". Spits from afar and stays behind.
demon-description-garbage=Sin of consumption: the Garbage that buried Earth got a will of its own. Slow and very tough.
demon-description-excess=Sin of consumption: Eternal Excess — always more than needed. Frail, very fast, comes in twice as big crowds.
field-none=Ship "__1__": in the warp without a Comfort™ field. Demons may appear on deck. Subscribe with the Comfort™ field research.
field-weak=Ship "__1__": the Comfort™ field dropped to __2__%. For technical reasons demons may appear on deck. BnL apologises for the inconvenience.
field-restored=Ship "__1__": the Comfort™ field is restored. Demons already aboard are not covered by the subscription — remove them yourself.
demons-rage=Ship "__1__": demons of Sale Rage broke onto the deck (__2__). They run at any discount — that is, at your buildings.
demons-fineprint=Ship "__1__": demons of Fine Print broke onto the deck (__2__). They spit terms and conditions from afar.
demons-garbage=Ship "__1__": demons of Garbage broke onto the deck (__2__). Slow, but hard to take out.
demons-excess=Ship "__1__": demons of Eternal Excess broke onto the deck (__2__). Frail, fast, and always more than needed.
shield-empty=Ship "__1__": the void shield is drained — asteroids hit the hull. It recharges by itself if there is power.
breach=Ship "__1__": hull breach, foundation tiles lost: __2__. Patch it with foundation; repair packs in the bridge repair what is damaged.
alert-demons=[color=red]Red alert[/color] — ship "__1__": demons on deck.
alert-breach=[color=red]Red alert[/color] — ship "__1__": hull breach.
alert-hit=[color=red]Red alert[/color] — ship "__1__": an asteroid hit past the shield.
alert-off=Ship "__1__": alert over. Thank you for your patience and for choosing Buy n Large!
chronometer=En route: __1__ __plural_for_parameter__1__{1=year|rest=years}__
years-jump=Ship "__1__": the jump took __2__ __plural_for_parameter__2__{1=year|rest=years}__ of warp. The expedition has been en route __3__ __plural_for_parameter__3__{1=year|rest=years}__. Earth is still waiting for you!
bill=Ship "__1__": BnL bill for the Comfort™ field subscription — __2__ __plural_for_parameter__2__{1=year|rest=years}__ of warp: __3__ × __4__ __5__. The bridge takes the goods from its storage by itself, due in __6__ minutes. Unpaid, the subscription is suspended and the field weakens.
bill-paid=Ship "__1__": the bill for __3__ __plural_for_parameter__3__{1=year|rest=years}__ (__2__) is paid. Thank you for choosing Buy n Large!
bill-overdue=Ship "__1__": BnL bill overdue, __2__ × __3__ __4__ missing. Subscription suspended: the Comfort™ field is at most __5__%. No late fees — demons instead.
subscription-restored=Ship "__1__": overdue bills paid, the Comfort™ field subscription is restored. BnL appreciates your payment discipline.
bill-line=BnL bill: __1__ × __2__, due in __3__ min (bills: __4__)
bill-line-overdue=BnL bill overdue: __1__ × __2__ — field at most __3__% (bills: __4__)
bill-none=No BnL bills. Suspicious.
letter-40=[color=yellow]Letter from home[/color] (en route 40 years): "Your factory has been listed as a BnL architectural monument. A viewing fee applies. You, as the owner, pay double."
letter-100=[color=yellow]Letter from home[/color] (en route 100 years): "Congratulations on a century of your Comfort™ field subscription! Our gift: 0.01% off for the next hundred years."
letter-200=[color=yellow]Letter from home[/color] (en route 200 years): "The insurer BnL Life & Crash has reviewed your case №A113-7. A decision will be made within 700 years. 500 to go."
letter-300=[color=yellow]Letter from home[/color] (en route 300 years): "The BnL ad beacon reports: Earth is still waiting for you! No return provided*. *See directive A113."
letter-500=[color=yellow]Letter from home[/color] (en route 500 years): "BnL Compliance reminds you: a course for Earth violates directive A113. Your case has been opened. Review period: 700 years."
letter-700=[color=yellow]Letter from home[/color] (en route 700 years): "Congratulations! Your five-year cruise has now lasted exactly as long as the Axiom's. BnL thanks you for your loyalty and renews your subscription automatically."
