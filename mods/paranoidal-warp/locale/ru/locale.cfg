[space-location-description]
paranoidal-warp-coverage-gate=Точка варп-прыжка. Спокойный сектор: солнце как на орбите дома, много кусков астероидов, изредка мелкие астероиды. Реклама BnL ловится без помех — выключить её нельзя.
paranoidal-warp-coverage-buoy=Рекламный буй BnL в Зоне покрытия: сюда долетают своим ходом от врат. Буй круглосуточно сообщает, что Земля ждёт вас.
paranoidal-warp-coverage-feedback=Пункт приёма отзывов в Зоне покрытия: сюда долетают своим ходом. Все отзывы рассматриваются в течение 700 лет.
paranoidal-warp-necropolis-gate=Точка варп-прыжка. Обломки других лайнеров BnL: больше металла, средние и крупные астероиды — нужны турели. Солнце вдвое слабее, чем у дома. Все лайнеры здесь до сих пор числятся «в пути по расписанию».
paranoidal-warp-necropolis-wrecks=Поле обломков в Некрополе флота BnL: сюда долетают своим ходом. Обломки по-прежнему защищены авторским правом BnL.
paranoidal-warp-necropolis-hangar=Ангар списанных круизов в Некрополе флота BnL: сюда долетают своим ходом. Круизы списаны, подписки — нет.
paranoidal-warp-cutoff-gate=Точка варп-прыжка. Солнца нет: BnL отключил его за неуплату подписки. Солнечные панели не дают энергии — нужны реакторы. Углеродные и оксидные астероиды.
paranoidal-warp-cutoff-collection=Пункт взыскания в Зоне отключения: сюда долетают своим ходом. Солнца нет. Задолженность растёт и в темноте.
paranoidal-warp-cutoff-tariff=Тёмный тариф в Зоне отключения: сюда долетают своим ходом. Солнца нет. Темнота входит в тариф бесплатно.

