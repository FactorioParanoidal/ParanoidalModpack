[technology-name]
paranoidal-warp-drive=Варп-двигатель
paranoidal-warp-comfort-field=Поле Комфорт™
paranoidal-warp-void-shield=Пустотный щит

[technology-description]
paranoidal-warp-drive=Варп-двигатель «Прыжок BnL™», варп-заряды и три сектора варпа: Зона покрытия BnL™, Некрополь флота BnL и Зона отключения за неуплату. Внутри сектора платформа летает своим ходом, между секторами и домом — прыгает.
paranoidal-warp-comfort-field=Генератор поля Комфорт™: без него в секторах варпа на палубу лезут демоны грехов потребления. Подписка BnL продлевается автоматически, счета — за годы варпа каждого прыжка.
paranoidal-warp-void-shield=Пустотный щит: последний рубеж против астероидов, которых турели не успели сбить.

