[mod-name]
paranoidal-warp=Paranoidal Warp (Варп Параноидал)

[mod-description]
paranoidal-warp=Варп-одиссея ветки Space Age: корабль летает, прыгает и держит оборону.\n\n— Три сектора варпа: Зона покрытия BnL™, Некрополь флота BnL, Зона отключения за неуплату. В каждом врата и две точки, между ними короткие маршруты на несколько минут полёта, своё небо, солнце и астероиды.\n— Варп-двигатель «Прыжок BnL™» переносит платформу от врат сектора или с орбиты дома к вратам другого сектора: 1 варп-заряд, 30 секунд раскрутки, 10 МВт.\n— Годы Варпа: каждый прыжок прибавляет экспедиции годы, над мостиком хронометр «В пути», из дома приходят письма.\n— Генератор поля Комфорт™ (5 МВт) ограждает корабль в варпе. Подписка BnL: за годы каждого прыжка — счёт, оплата товаром из мостика; просроченный счёт ослабляет поле. Слабое поле — трещины в куполе и демоны четырёх грехов потребления на палубе.\n— Пустотный щит разбивает подлетевшие астероиды за счёт запаса энергии; без него удары идут в корпус и пробивают фундамент.\n— Красная тревога: свет, сирена и сообщения АВТО, пока на палубе демоны или после пробоины.\n— Хаб платформы — мостик «Аксиомы-7» с логотипом BnL.\n\nБез Космической эпохи ничего не делает.

