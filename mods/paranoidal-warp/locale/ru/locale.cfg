letter-100=[color=yellow]Письмо из дома[/color] (в пути 100 лет): «Поздравляем со столетием подписки на поле Комфорт™! В подарок — скидка 0,01% на следующие сто лет».
letter-200=[color=yellow]Письмо из дома[/color] (в пути 200 лет): «Страховая компания «BnL Life & Crash» рассмотрела ваше дело №A113-7. Решение будет принято в течение 700 лет. Осталось 500».
letter-300=[color=yellow]Письмо из дома[/color] (в пути 300 лет): «Рекламный маяк BnL сообщает: Земля по-прежнему ждёт вас! Возврат не предусмотрен*. *См. директиву A113».
letter-500=[color=yellow]Письмо из дома[/color] (в пути 500 лет): «Отдел соответствия BnL напоминает: курс на Землю нарушает директиву A113. Ваше дело принято к рассмотрению. Срок рассмотрения — 700 лет».
letter-700=[color=yellow]Письмо из дома[/color] (в пути 700 лет): «Поздравляем! Ваш пятилетний круиз длится ровно столько же, сколько круиз «Аксиомы». BnL благодарит за верность и продлевает подписку автоматически».
