bill=Корабль «__1__»: счёт BnL за подписку на поле Комфорт™ — __2__ __plural_for_parameter__2__{ends in 11,ends in 12,ends in 13,ends in 14=лет|ends in 1=год|ends in 2,ends in 3,ends in 4=года|rest=лет}__ варпа: __3__ × __4__ __5__. Мостик спишет товар со своего склада сам, срок __6__ минут. Не оплатите — подписка будет приостановлена, поле ослабнет.
