paranoidal-warp-drive=Варп-двигатель «Прыжок BnL™»
paranoidal-warp-charge=Варп-заряд
paranoidal-warp-comfort-field=Генератор поля Комфорт™
paranoidal-warp-void-shield=Пустотный щит

[item-description]
paranoidal-warp-drive=Переносит космическую платформу в другой сектор варпа: от врат сектора или с орбиты дома — к вратам другого сектора или домой. Строится только на платформе, один на платформу. Прыжок: 1 варп-заряд, 30 секунд раскрутки, 10 МВт.
paranoidal-warp-charge=Один заряд — один прыжок варп-двигателя. Делается на заводе и доставляется на корабль ракетой: 10 штук в одной ракете. Гарантия BnL не распространяется на пункт назначения.
paranoidal-warp-comfort-field=Ограждает корабль от варпа, пока ему хватает энергии: 5 МВт. Слабое поле — трещины в куполе и демоны на палубе. Один на платформу, строится только на платформе.
paranoidal-warp-void-shield=Разбивает подлетевшие к кораблю астероиды за счёт запаса энергии: 100 МДж, заряд 5 МВт. Несколько щитов складывают запас. Строится только на платформе.

[entity-name]
paranoidal-warp-drive=Варп-двигатель «Прыжок BnL™»
space-platform-hub=Мостик «Аксиомы-7»
paranoidal-warp-comfort-field=Генератор поля Комфорт™
paranoidal-warp-void-shield=Пустотный щит

[entity-description]
paranoidal-warp-drive=Переносит космическую платформу в другой сектор варпа: от врат сектора или с орбиты дома — к вратам другого сектора или домой. Строится только на платформе, один на платформу. Прыжок: 1 варп-заряд, 30 секунд раскрутки, 10 МВт. Куда прыгать, выбирается в окне двигателя.
space-platform-hub=Ядро космической платформы — то, что осталось от мостика лайнера «Аксиома-7». Получает предметы с орбиты дома и отправляет их на грузовые посадочные площадки. Отправьте в космос [item=space-platform-starter-pack], чтобы создать его. Логотип BnL снять нельзя: так написано в лицензионном соглашении.
paranoidal-warp-comfort-field=Поле Комфорт™ ограждает корабль от варпа, пока ему хватает энергии. Официально поле питается вниманием пассажиров к рекламе, неофициально — 5 МВт. Чем слабее поле, тем больше трещин в куполе и тем чаще на палубу лезут демоны грехов потребления; уже поднявшиеся на борт остаются, пока их не перебьют. Подписка BnL: за годы варпа каждого прыжка — счёт товаром, мостик платит сам из своего склада, срок 15 минут; каждый просроченный счёт отнимает у поля 30% силы. Вне секторов варпа генератор выключается сам. Один на платформу, строится только на платформе.
paranoidal-warp-void-shield=Подлетевшие к кораблю астероиды разбиваются о щит, удары по зданиям он тоже гасит. Тратит запас энергии: малый астероид — 2,5 МДж, средний — 10 МДж, крупный — 50 МДж. Запас 100 МДж, заряд 5 МВт, в сеть энергию не отдаёт; несколько щитов складывают запас. Пустой щит — астероиды бьют в корпус и пробивают фундамент. Турели всё равно нужны: щит — последний рубеж. Куски астероидов для сборщиков проходят сквозь щит.

