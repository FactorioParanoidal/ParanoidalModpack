[item-name]
paranoidal-warp-drive=Варп-двигатель «Прыжок BnL™»
paranoidal-warp-charge=Варп-заряд

[item-description]
paranoidal-warp-drive=Переносит космическую платформу в другой сектор варпа: от врат сектора или с орбиты дома — к вратам другого сектора или домой. Строится только на платформе, один на платформу. Прыжок: 1 варп-заряд, 30 секунд раскрутки, 10 МВт.
paranoidal-warp-charge=Один заряд — один прыжок варп-двигателя. Делается на заводе и доставляется на корабль ракетой: 10 штук в одной ракете. Гарантия BnL не распространяется на пункт назначения.

[entity-name]
paranoidal-warp-drive=Варп-двигатель «Прыжок BnL™»
space-platform-hub=Мостик «Аксиомы-7»

[entity-description]
paranoidal-warp-drive=Переносит космическую платформу в другой сектор варпа: от врат сектора или с орбиты дома — к вратам другого сектора или домой. Строится только на платформе, один на платформу. Прыжок: 1 варп-заряд, 30 секунд раскрутки, 10 МВт. Куда прыгать, выбирается в окне двигателя.
space-platform-hub=Ядро космической платформы — то, что осталось от мостика лайнера «Аксиома-7». Получает предметы с орбиты дома и отправляет их на грузовые посадочные площадки. Отправьте в космос [item=space-platform-starter-pack], чтобы создать его. Логотип BnL снять нельзя: так написано в лицензионном соглашении.

[recipe-name]
paranoidal-warp-jump=Варп-прыжок

[technology-name]
paranoidal-warp-drive=Варп-двигатель

[technology-description]
paranoidal-warp-drive=Варп-двигатель «Прыжок BnL™», варп-заряды и три сектора варпа: Зона покрытия BnL™, Некрополь флота BnL и Зона отключения за неуплату. Внутри сектора платформа летает своим ходом, между секторами и домом — прыгает.

[paranoidal-warp]
window-title=Варп-прыжок
here=Корабль сейчас: __1__
here-flight=Корабль в полёте
targets=Куда прыгнуть:
