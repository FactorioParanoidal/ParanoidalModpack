demon-description-rage=Грех потребления: Ярость распродаж — 700 лет бега к кассе. Быстрый и злой, бьёт вблизи.
demon-description-fineprint=Грех потребления: Мелкий шрифт — «синий — новый красный». Плюётся издалека и держится позади.
demon-description-garbage=Грех потребления: Мусор, похоронивший Землю, обрёл волю. Медленный и очень живучий.
demon-description-excess=Грех потребления: Вечное излишество — всего всегда больше, чем нужно. Хилый, очень быстрый, приходит вдвое большими толпами.
field-none=Корабль «__1__»: в варпе без поля Комфорт™. На палубе возможны демоны. Подписка оформляется в исследовании «Поле Комфорт™».
field-weak=Корабль «__1__»: поле Комфорт™ ослабло до __2__%. По техническим причинам на палубе возможны демоны. BnL приносит извинения за неудобства.
field-restored=Корабль «__1__»: поле Комфорт™ восстановлено. Демоны, уже поднявшиеся на борт, в подписку не входят — убирайте самостоятельно.
demons-rage=Корабль «__1__»: на палубу прорвались демоны Ярости распродаж (__2__). Бегут на любую скидку — то есть на ваши здания.
demons-fineprint=Корабль «__1__»: на палубу прорвались демоны Мелкого шрифта (__2__). Плюются условиями договора издалека.
demons-garbage=Корабль «__1__»: на палубу прорвались демоны Мусора (__2__). Медленные, но их почти не вынести.
demons-excess=Корабль «__1__»: на палубу прорвались демоны Вечного излишества (__2__). Хилые, быстрые, и их всегда больше, чем нужно.
shield-empty=Корабль «__1__»: пустотный щит исчерпан — астероиды бьют в корпус. Щит зарядится сам, если хватит энергии.
breach=Корабль «__1__»: пробоина в корпусе, плиток фундамента потеряно: __2__. Заделайте фундаментом; ремкомплекты в мостике чинят повреждённое.
