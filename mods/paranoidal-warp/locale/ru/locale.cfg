auto-10=[color=acid]АВТО:[/color] 10 секунд до прыжка. Просим пассажиров не покидать ховеркресла.
auto-3=[color=acid]АВТО:[/color] 3… 2… 1… Спасибо, что выбираете Buy n Large!
auto-arrived=[color=acid]АВТО:[/color] прыжок выполнен — «__1__». Добро пожаловать! Сектор входит в вашу подписку*.
auto-home=[color=acid]АВТО:[/color] прыжок выполнен — орбита дома. Напоминаю: директива A113 запрещает возвращаться на Землю. Сюда — пожалуйста.
auto-cancel-moved=[color=acid]АВТО:[/color] корабль сдвинулся с места — прыжок отменён. Раскрутка сохранена.
auto-cancel-player=[color=acid]АВТО:[/color] прыжок отменён по просьбе пассажира. Раскрутка сохранена, заряд не возвращается.
jump-failed=Прыжок не удался: __1__
