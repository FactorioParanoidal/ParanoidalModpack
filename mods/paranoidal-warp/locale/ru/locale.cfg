jump-tooltip=Тратит 1 варп-заряд и 300 МДж (10 МВт 30 секунд). Пока двигатель раскручивается, платформа стоит на месте.
cancel=Отмена
cancel-tooltip=Остановить раскрутку. Заряд уже потрачен: следующий прыжок продолжит раскрутку без нового заряда.
status-ready=Готов к прыжку.
status-ready-resume=Раскрутка уже на __1__%: прыжок продолжится без нового заряда.
status-no-target=Выберите, куда прыгнуть.
status-no-charge=Нет варп-заряда: доставьте его ракетой и положите в двигатель.
status-in-flight=Корабль в полёте: прыгать можно только от врат сектора или с орбиты дома.
status-not-jump-point=Прыгать можно только от врат сектора или с орбиты дома.
status-not-platform=Варп-двигатель работает только на космической платформе.
status-spinning=Раскрутка: до прыжка __1__ с.
status-low-power=Не хватает энергии, раскрутка идёт медленнее: до прыжка __1__ с.
one-per-platform=На этой платформе уже есть варп-двигатель — второй убран.
