autodeconstruct-err-specific=[autodeconstruct|__1__] Ошибка: __2__
autodeconstruct-err-pipe-name=[autodeconstruct] Ошибка: Неверная настройка. Не удаётся найти трубу с названием "__1__".

autodeconstruct-notify=[autodeconstruct] Уведомление: __1__
autodeconstruct-debug=[autodeconstruct.__1__] Отладка: __2__

[mod-setting-name]
autodeconstruct-remove-target=[item=steel-chest] Также помечать выходные сундуки для разборки
autodeconstruct-remove-fluid-drills=[img=utility/fluid_icon] Также удалять буры, использующие жидкости
autodeconstruct-remove-wired=[item=electric-mining-drill] Также удалять буры, подключенные к логической сети
autodeconstruct-build-pipes=[item=pipe] Создавать трубы при удалении буров, использующих жидкости
autodeconstruct-pipe-name=[item=pipe] Список приоритетов типов труб
autodeconstruct-preserve-inserter-chains=Не удалять буры с манипуляторами, извлекающими из них топливо
autodeconstruct-blacklist=Игнорировать эти буры, сундуки и конвейеры
autodeconstruct-ore-blacklist=Resource entities to ignore
autodeconstruct-remove-beacons=[item=beacon] Также помечать неиспользуемые маяки для разборки
autodeconstruct-remove-belts=[item=transport-belt] Также помечать неиспользуемые конвейеры для разборки
autodeconstruct-remove-wired-belts=[item=transport-belt] [item=green-wire] Также удалять конвейеры, подключённые к логической сети
autodeconstruct-remove-tiles=Также помечать покрытие под объектами для разборки

[mod-setting-description]
autodeconstruct-blacklist=Запрещает Auto Deconstruct помечать перечисленные типы объектов для сноса, включая буры, сундуки, конвейеры и маяки. Нужны внутренние имена объектов, например electric-mining-drill; разделители — пробел, запятая или точка с запятой.
autodeconstruct-pipe-name=[item=pipe] Внутренние имена обычных труб через запятую, в порядке предпочтения при замене истощённого бура. Выбирается первая труба, совместимая со всеми подключениями и поверхностью. Если ни один вариант из списка не подходит, мод пробует другие доступные типы труб.
autodeconstruct-ore-blacklist=Ресурсы из этого списка при истощении не запускают проверку Auto Deconstruct. Введите внутренние имена ресурсов; разделители — пробел, запятая или точка с запятой. Это не общий запрет сноса буров: их можно проверить после истощения другого ресурса рядом.


