[mod-setting-description]
autodeconstruct-build-pipes=[item=pipe] При разборке истощённого бура мод создаёт призраки труб у найденных подключений — планы для восстановления соединений с соседними объектами. Это не готовые трубы: нужны несколько подходящих подключений, а призраки ещё предстоит построить.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
autodeconstruct-preserve-inserter-chains=[item=burner-mining-drill] Если манипулятор забирает предметы из топливного бура, мод пропускает этот бур вместо заказа на разборку. Так сохраняется такая цепочка, но сам истощённый бур остаётся на месте.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
autodeconstruct-remove-beacons=[item=beacon] Разрешает пометить маяки истощённого бура, если у них не осталось других получателей эффекта, ещё не помеченных для разборки. Даже простаивающая, но не помеченная машина сохраняет маяк. Сам снос выполняют роботы или игрок.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
autodeconstruct-remove-belts=[item=transport-belt] Мод может пометить для разборки безопасные, больше не используемые участки конвейерной сети, включая подземные конвейеры и разделители. Обычно он ждёт, пока участки опустеют, но по тайм-ауту может пометить оставшиеся участки, даже если на них ещё есть предметы; фактический снос выполняют роботы или игрок.\n[color=#9cdcfe]По умолчанию: флажок снят. Общая настройка карты.[/color]
autodeconstruct-remove-fluid-drills=[item=electric-mining-drill] Разрешает помечать для разборки истощённые буры с жидкостным хранилищем, например подачей кислоты. При выключении такие буры сохраняются. Остальные проверки действуют; восстановление труб требует отдельного включения и подходящего типа трубы.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
autodeconstruct-remove-target=[item=steel-chest] Разрешает пометить вместе с истощённым буром его выходной сундук, если другие неразбираемые объекты больше не направляют в него продукцию. Это заказ на разборку роботами или игроком, не мгновенное удаление сундука.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
autodeconstruct-remove-tiles=[item=concrete] Разрешает также помечать покрытие под разбираемыми объектами для снятия роботами или игроком. Если под жидкостным буром созданы призраки труб, покрытие под этим буром не помечается, чтобы не разрушить новые планы.\n[color=#9cdcfe]По умолчанию: флажок снят. Общая настройка карты.[/color]
autodeconstruct-remove-wired=[item=electric-mining-drill] Включение позволяет обычным проверкам AutoDeconstruct не пропускать бур только из-за подключения к красной или зелёной логической сети. Остальные проверки, включая истощение ресурса и сохранение цепочки манипуляторов, остаются.\n[color=#9cdcfe]По умолчанию: флажок снят. Общая настройка карты.[/color]
autodeconstruct-remove-wired-belts=[item=transport-belt] Разрешает помечать для сноса неиспользуемые конвейеры с логическим управлением, в том числе подключённые проводами. Без флажка такие участки защищены от этой уборки. Остальные проверки использования конвейера сохраняются.\n[color=#9cdcfe]По умолчанию: флажок снят. Общая настройка карты.[/color]
