[mod-setting-name]
autodeconstruct-remove-target=Also mark output chests for deconstruction
autodeconstruct-remove-fluid-drills=Also remove drills that are using fluids
autodeconstruct-remove-wired=Also remove drills that are connected to a circuit network
autodeconstruct-build-pipes=Create pipes when removing drills that are using fluids
autodeconstruct-pipe-name=Pipe type priority list
autodeconstruct-preserve-inserter-chains=Do not remove drills with inserters extracting fuel from them
autodeconstruct-blacklist=Drills, chests and belts to ignore
autodeconstruct-ore-blacklist=Resource entities to ignore
autodeconstruct-remove-beacons=Also mark unused beacons for deconstruction
autodeconstruct-remove-belts=Also mark unused belts for deconstruction
autodeconstruct-remove-wired-belts=Also remove belts that are connected to a circuit network
autodeconstruct-remove-tiles=Also mark tiles under entities for deconstruction

[mod-setting-description]
autodeconstruct-blacklist=Prevents Auto Deconstruct from marking the listed entity types for removal, including drills, chests, belts and beacons. Use internal entity names, such as electric-mining-drill; separate them with spaces, commas or semicolons.
autodeconstruct-pipe-name=[item=pipe] Internal names of ordinary pipes, comma-separated in preference order for replacing a depleted drill. The first pipe compatible with every connection and the surface is chosen. If no listed pipe fits, the mod tries other available pipe types.
autodeconstruct-ore-blacklist=Depleting a resource in this list does not trigger an Auto Deconstruct check. Enter internal resource names separated by spaces, commas or semicolons. This does not protect every drill mining that resource: depletion of another nearby resource may still trigger a check.
