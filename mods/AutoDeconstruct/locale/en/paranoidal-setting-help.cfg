[mod-setting-description]
autodeconstruct-build-pipes=[item=pipe] When an exhausted drill is marked for deconstruction, the mod creates pipe ghosts at discovered connections to help restore links to nearby entities. These are plans, not finished pipes; multiple suitable connections are required, and the ghosts still need to be built.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
autodeconstruct-preserve-inserter-chains=[item=burner-mining-drill] If an inserter picks items up from a burner drill, the mod skips that drill instead of ordering it for deconstruction. This preserves that chain, but leaves the exhausted drill in place.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
autodeconstruct-remove-beacons=[item=beacon] Allows an exhausted drill’s beacons to be marked if they have no other effect receivers not already marked for deconstruction. Even an idle, unmarked machine keeps the beacon protected. Robots or the player perform the actual removal.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
autodeconstruct-remove-belts=[item=transport-belt] The mod can mark safe, unused parts of a belt network for deconstruction, including underground belts and splitters. It usually waits for belts to empty, but after a timeout it may mark the remaining belts even if they still carry items; robots or the player perform the actual removal.\n[color=#9cdcfe]Default: checkbox unchecked. Shared map setting.[/color]
autodeconstruct-remove-fluid-drills=[item=electric-mining-drill] Allows exhausted drills with fluid storage, such as an acid input, to be marked for deconstruction. When off, such drills are kept. Other safeguards remain; pipe restoration needs its own setting and a compatible pipe type.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
autodeconstruct-remove-target=[item=steel-chest] Allows an exhausted drill’s output chest to be marked when no other non-deconstructing entities still direct output into it. This orders robots or the player to deconstruct the chest; it is not immediate deletion.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
autodeconstruct-remove-tiles=[item=concrete] Also allows flooring beneath deconstructed entities to be marked for removal by robots or the player. If pipe ghosts are created beneath a fluid drill, that drill’s flooring is not marked, to avoid destroying the new plans.\n[color=#9cdcfe]Default: checkbox unchecked. Shared map setting.[/color]
autodeconstruct-remove-wired=[item=electric-mining-drill] Enabling this lets AutoDeconstruct’s usual checks consider a drill connected to the red or green circuit network instead of skipping it for that reason. Other checks, including resource depletion and inserter-chain preservation, still apply.\n[color=#9cdcfe]Default: checkbox unchecked. Shared map setting.[/color]
autodeconstruct-remove-wired-belts=[item=transport-belt] Allows automatic cleanup of unused belts with control behavior, including circuit-connected belts. When off, they are protected from this cleanup; when on, the remaining belt-network usage checks still apply.\n[color=#9cdcfe]Default: checkbox unchecked. Shared map setting.[/color]
