<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="0.55" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#9a9a9a"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="0.5" stop-color="#d4d4d4"/>
      <stop offset="1" stop-color="#8e8e8e"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a7a7a"/>
      <stop offset="0.45" stop-color="#555555"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </linearGradient>
  </defs>

  <!-- Тень на земле -->
  <ellipse cx="32" cy="55.5" rx="27" ry="4.5" fill="#000" opacity="0.35"/>

  <!-- Совок, воткнутый в горку: рисуется до песка, чтобы кончик скрылся -->
  <g transform="translate(38 27) rotate(25) scale(1.2)" stroke="#262626" stroke-width="1.4" stroke-linejoin="round">
    <rect x="-3.6" y="-22" width="7.2" height="11" rx="3.6" fill="url(#grip)"/>
    <rect x="-1.6" y="-20" width="1.6" height="7" rx="0.8" fill="#9a9a9a" stroke="none"/>
    <rect x="-2" y="-11.5" width="4" height="6" fill="#b5b5b5"/>
    <path d="M -8.5 -6 L 8.5 -6 Q 9.5 6 0 17 Q -9.5 6 -8.5 -6 Z" fill="url(#blade)"/>
    <path d="M 0 -4 L 0 12" stroke="#8a8a8a" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Горка песка -->
  <path d="M 5 55 C 9 44 15 36 24 33 C 29 31.5 35 31.5 40 33 C 49 36 55 44 59 55 Q 32 59.5 5 55 Z"
        fill="url(#sand)" stroke="#262626" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Затенённый склон -->
  <path d="M 44 35.5 C 51 40 55.5 47 57.6 54.3 Q 52 55.6 45.5 56.2 C 47.5 49 47 41 44 35.5 Z" fill="#000" opacity="0.18"/>
  <!-- Блик на гребне -->
  <path d="M 13 45 C 17 39 22 35.6 28 34.6" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Песчинки -->
  <g fill="#8a8a8a">
    <circle cx="20" cy="45" r="1.3"/>
    <circle cx="27" cy="40" r="1.1"/>
    <circle cx="33" cy="47" r="1.4"/>
    <circle cx="40" cy="41" r="1.1"/>
    <circle cx="25" cy="51" r="1.2"/>
    <circle cx="44" cy="50" r="1.3"/>
    <circle cx="14" cy="51.5" r="1"/>
    <circle cx="36" cy="53" r="1"/>
  </g>
</svg>
