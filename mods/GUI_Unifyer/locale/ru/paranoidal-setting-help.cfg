gu_button_WideChests_merge-chest-button=[item=WideChests_merge-chest-selector] Показывает на верхней панели кнопку объединителя сундуков, если её предоставляет включённый мод. Выключение скрывает только эту кнопку, а не отключает соответствующий мод и его механику.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
