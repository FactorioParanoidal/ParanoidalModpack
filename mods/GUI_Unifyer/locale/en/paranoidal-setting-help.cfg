[mod-setting-description]
gu_button_WideChests_merge-chest-button=[item=WideChests_merge-chest-selector] Shows the top-panel button for the chest merger when its enabled mod provides that button. Turning this off only hides the button; it does not disable the corresponding mod or its mechanics.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
