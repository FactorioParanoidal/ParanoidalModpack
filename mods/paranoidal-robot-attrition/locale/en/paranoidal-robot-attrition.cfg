[mod-name]
paranoidal-robot-attrition=Paranoidal Robot Attrition

[mod-description]
paranoidal-robot-attrition=Busy logistic networks occasionally lose a logistic robot. The more busy, fast and loaded the robots, the more crashes; robots waiting in a charging queue crash 10 times as often as flying ones. A crashed robot leaves a wreck with its cargo and a wreck item that can be repaired; flammable cargo burns, explosive cargo detonates. Research, tougher robots and better quality lower the risk, storms raise it. The roboport window shows the traffic of its network.

