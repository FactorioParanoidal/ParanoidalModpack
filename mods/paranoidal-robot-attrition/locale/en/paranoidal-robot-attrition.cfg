[technology-description]
pra-swarm-safety=Crashing logistic robots neither explode nor set flammable cargo on fire in logistic networks with up to 500 busy logistic robots per researched level. Explosive cargo always detonates. The crash rate stays the same.
pra-swarm-dispatch=Robots keep formation like the robots of BnL starliners follow the lines on the floor, only in the air. Each level lowers the logistic robot crash rate by 15% (levels multiply: all 5 give ×0.44).

