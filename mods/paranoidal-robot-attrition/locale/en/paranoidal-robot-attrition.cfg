[tips-and-tricks-item-description]
pra-intro=[font=default-bold]Busy logistic robots crash now and then.[/font] Crashes happen in logistic networks with more than 50 busy logistic robots: the more busy robots, the faster and the more loaded they are, the more often. The cargo is not lost: it stays in the wreck, and construction robots pick it up. So robots are best for valuable items, while ore over long distances goes by train.\n\nIn the animation the network first has 40 robots and no crashes; after 60 more are added, more than 50 are busy and now and then one robot crashes, and construction robots take the wreck to storage. Crashes in the animation are much more frequent than in the game.
pra-congestion=A robot waiting in a charging queue at a roboport crashes 10 times as often as a flying one. Build roboports with a margin where robots crowd. The roboport window shows the "Air traffic" panel on its right: busy robots, the charging queue and the expected crashes per hour. "BnL LongCharge™" batteries let robots fly longer between charges, so the queues get shorter.\n\nIn the animation there are two identical networks. The upper one has one roboport: robots with empty batteries wait to charge in a queue, the load of the network is several times higher and there are more crashes. The lower one has four roboports and no queue.
pra-wreck=A crashed robot leaves a wreck item of its tier. Wreck + 2 repair packs of the same tier, in an assembling machine or by hand, give the robot back with a 75% chance. The repair recipe is unlocked together with the robot recipe. Wrecks are always of normal quality.\n\nIn the animation construction robots take the wrecks to storage, an inserter feeds them to an assembling machine with the repair recipe, and a repaired robot goes back into the roboport.
pra-cargo=A falling robot explodes and damages everything around it. Flammable cargo (fuel of 10 MJ and more, flamethrower ammo) sets the ground on fire. Explosive cargo (explosives, rockets, shells, grenades, mines) always detonates, much stronger, and half of it, rounded up, is lost (a single item is lost entirely). Do not fly explosives over your factory.\n\nIn the animation the robots carry ordinary, flammable and explosive cargo over a belt in turn. The rings show the damage: a robot crash deals 75 at the centre and 5 at 3.5 tiles, a cargo detonation 265 at the centre and 10 at 5.5 tiles.
pra-reliability=Swarm dispatch 1–5: each level −15% crash rate. Swarm safety: no explosion or fire in networks with up to 500 busy robots per level. Higher-tier robots (more health) and robots of better quality crash less. Robot speed research raises the risk. In a storm (wind above 80% power) there are more crashes, up to three times as many.\n\nIn the animation, on the left, robots crash with an explosion until Swarm safety is researched and without one after its first level. On the right: the crash rate by Swarm dispatch level and wind strength, and the crash chance of robots of different tiers and quality.

