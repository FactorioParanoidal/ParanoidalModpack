[mod-setting-description]
pra-crash-factor=Multiplier of the logistic robot crash rate. Crashes happen in logistic networks with more than 50 busy logistic robots; more often with long charging queues and with fast, loaded robots. 0 turns crashes off.
pra-dangerous-cargo=On a robot crash, flammable cargo—chemical fuel of at least 10 MJ and flamethrower ammo—can ignite the ground. Swarm safety suppresses that ignition in covered networks. Explosive cargo (explosives, rockets, shells, grenades and mines) still detonates under that protection, losing half the cargo rounded up. Turning this off disables dangerous-cargo effects, not crashes themselves.
pra-crash-alerts=Alerts point to your force’s robot wrecks. Ordinary crashes are limited to one alert per 5 minutes for each force and surface. Cargo detonation and fire have separate limits of one alert per 30 seconds for each hazard, force and surface.
pra-roboport-panel=Show the traffic of the network and the expected crash rate next to the roboport window.

