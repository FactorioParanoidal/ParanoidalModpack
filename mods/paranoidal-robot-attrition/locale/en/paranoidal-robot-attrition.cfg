pra-crash-factor=Multiplier of the logistic robot crash rate. Crashes happen in logistic networks with more than 50 busy logistic robots; more often with long charging queues and with fast, loaded robots. 0 turns crashes off.
pra-dangerous-cargo=Flammable cargo (fuel of 10 MJ and more, flamethrower ammo) sets the ground on fire when its robot crashes; explosive cargo (explosives, rockets, shells, grenades, mines) detonates and half of it, rounded up, is lost.
pra-crash-alerts=At most once in 5 minutes per surface; the alert leads to the wreck.
pra-roboport-panel=Show the traffic of the network and the expected crash rate next to the roboport window.

