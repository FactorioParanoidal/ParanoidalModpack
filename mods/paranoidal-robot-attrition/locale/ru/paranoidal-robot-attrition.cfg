[mod-setting-description]
pra-crash-factor=Множитель частоты аварий транспортных дронов. Аварии бывают в логистических сетях, где занято больше 50 транспортных дронов; чаще — при длинных очередях на зарядку, у быстрых и нагруженных дронов. 0 — без аварий.
pra-dangerous-cargo=Горючий груз (топливо от 10 МДж, огнемётные боеприпасы) при крушении дрона поджигает землю; взрывчатый (взрывчатка, ракеты, снаряды, гранаты, мины) детонирует, и половина его (с округлением вверх) теряется.
pra-crash-alerts=Не чаще раза в 5 минут на поверхность; оповещение ведёт к обломкам.
pra-roboport-panel=Показывать рядом с окном робопорта загрузку сети и ожидаемое число аварий.

