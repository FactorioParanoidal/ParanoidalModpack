[tips-and-tricks-item-name]
pra-intro=Износ дронов
pra-congestion=Пробки у робопортов
pra-wreck=Обломки и ремонт
pra-cargo=Опасный груз
pra-reliability=Надёжный рой

[tips-and-tricks-item-description]
pra-intro=[font=default-bold]Перегруженные транспортные дроны иногда разбиваются.[/font] Аварии бывают в логистической сети, где занято больше 50 транспортных дронов: чем больше занятых, чем они быстрее и чем больше несут, тем чаще. Груз не теряется: он остаётся в обломках, и строительные дроны их подберут. Поэтому дронами выгодно возить дорогие предметы, а руду на большие расстояния — поездами.\n\nВ анимации в сети сначала 40 дронов, и аварий нет; когда добавляют ещё 60, занятых становится больше 50 и время от времени один дрон разбивается, а строительные дроны отвозят обломки на склад. Аварии в анимации намного чаще, чем в игре.
pra-congestion=Дрон, ждущий зарядки в очереди у робопорта, падает в 10 раз чаще летящего. Ставьте робопорты с запасом там, где дроны толпятся. Справа от окна робопорта — панель «Воздушное движение»: занятые дроны, очередь на зарядку и ожидаемое число аварий в час. «Аккумуляторы BnL Долгий Заряд™» продлевают полёт без зарядки — очереди становятся короче.\n\nВ анимации две одинаковые сети. У верхней один робопорт: дроны с пустыми батареями ждут зарядки в очереди, нагрузка сети в несколько раз выше, и аварий больше. У нижней четыре робопорта, и очереди нет.
pra-wreck=Разбившийся дрон оставляет обломки своего уровня. Обломки и 2 ремкомплекта того же уровня в сборочном автомате или вручную возвращают дрон с вероятностью 75%. Рецепт ремонта открывается вместе с рецептом дрона. Обломки всегда обычного качества.\n\nВ анимации строительные дроны отвозят обломки на склад, манипулятор подаёт их в сборочный автомат с рецептом ремонта, а починенный дрон возвращается в робопорт.
pra-cargo=Падая, дрон взрывается и повреждает всё вокруг. Горючий груз (топливо от 10 МДж, огнемётные боеприпасы) поджигает землю. Взрывчатый груз (взрывчатка, ракеты, снаряды, гранаты, мины) детонирует всегда — намного сильнее, — и половина груза (с округлением вверх, одиночный предмет — целиком) теряется. Не возите взрывчатку дронами над заводом.\n\nВ анимации дроны по очереди везут над конвейером обычный, горючий и взрывчатый груз. Круги показывают урон: взрыв дрона — 75 в центре и 5 на 3,5 клетки, детонация груза — 265 в центре и 10 на 5,5 клетки.
pra-reliability=«Диспетчеризация роя» 1–5: каждый уровень −15% к частоте аварий. «Безопасность роя»: без взрыва и пожара в сетях до 500 занятых дронов за уровень. Дроны старших уровней (у них больше здоровья) и лучшего качества падают реже. Исследования скорости дронов повышают риск. В бурю (ветер выше 80% мощности) аварий больше — до трёх раз.\n\nВ анимации слева дроны падают со взрывом, пока «Безопасность роя» не изучена, и без взрыва после её первого уровня. Справа — частота аварий по уровням «Диспетчеризации роя» и силе ветра и шанс разбиться у дронов разных уровней и качества.

