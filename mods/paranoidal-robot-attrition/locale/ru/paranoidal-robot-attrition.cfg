[mod-name]
paranoidal-robot-attrition=Paranoidal Robot Attrition (Износ дронов)

[mod-description]
paranoidal-robot-attrition=Перегруженные транспортные дроны иногда разбиваются.\n\n— Аварии бывают в логистической сети, где занято больше 50 транспортных дронов. Чем больше занятых дронов, чем они быстрее и чем больше несут, тем чаще. Дроны в очереди на зарядку падают в 10 раз чаще летящих — ставьте робопорты с запасом.\n— Разбившийся дрон оставляет обломки: в них его груз и «обломки дрона», которые подберут строительные дроны. Обломки и 2 ремкомплекта того же уровня возвращают дрон с вероятностью 75%.\n— Падение сопровождается взрывом; горючий груз поджигает землю, взрывчатый детонирует всегда, и половина его (с округлением вверх) теряется.\n— «Диспетчеризация роя» 1–5 снижает частоту аварий, «Безопасность роя» убирает взрыв и пожар в сетях до 500 занятых дронов за уровень. Дроны старших уровней и лучшего качества падают реже, в бурю — чаще. Строительные дроны не разбиваются.\n— Справа от окна робопорта — панель «Воздушное движение» с загрузкой сети и ожидаемым числом аварий; о падении предупреждает оповещение.\n\nЧастота настраивается в настройках модов на вкладке «Карта» (0 — без аварий).\n\nСобственный мод сборки Paranoidal.

