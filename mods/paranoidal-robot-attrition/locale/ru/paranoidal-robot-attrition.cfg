[tips-and-tricks-item-name]
pra-intro=Износ дронов
pra-congestion=Пробки у робопортов
pra-wreck=Обломки и ремонт
pra-cargo=Опасный груз
pra-reliability=Надёжный рой

[tips-and-tricks-item-description]
pra-intro=[font=default-bold]Перегруженные транспортные дроны иногда разбиваются.[/font] Аварии бывают в логистической сети, где занято больше 50 транспортных дронов: чем больше занятых, чем они быстрее и чем больше несут, тем чаще. Груз не теряется: он остаётся в обломках, и строительные дроны их подберут. Поэтому дронами выгодно возить дорогие предметы, а руду на большие расстояния — поездами.
pra-congestion=Дрон, ждущий зарядки в очереди у робопорта, падает в 10 раз чаще летящего. Ставьте робопорты с запасом там, где дроны толпятся. Справа от окна робопорта — панель «Воздушное движение»: занятые дроны, очередь на зарядку и ожидаемое число аварий в час. «Аккумуляторы BnL Долгий Заряд™» продлевают полёт без зарядки — очереди становятся короче.
pra-wreck=Разбившийся дрон оставляет обломки своего уровня. Обломки и 2 ремкомплекта того же уровня в сборочном автомате или вручную возвращают дрон с вероятностью 75%. Рецепт ремонта открывается вместе с рецептом дрона. Обломки всегда обычного качества.
pra-cargo=Падая, дрон взрывается и повреждает всё вокруг. Горючий груз (топливо от 10 МДж, огнемётные боеприпасы) поджигает землю. Взрывчатый груз (взрывчатка, ракеты, снаряды, гранаты, мины) детонирует всегда — намного сильнее, — и половина груза (с округлением вверх, одиночный предмет — целиком) теряется. Не возите взрывчатку дронами над заводом.
pra-reliability=«Диспетчеризация роя» 1–5: каждый уровень −15% к частоте аварий. «Безопасность роя»: без взрыва и пожара в сетях до 500 занятых дронов за уровень. Дроны старших уровней (у них больше здоровья) и лучшего качества падают реже. Исследования скорости дронов повышают риск. В бурю (ветер выше 80% мощности) аварий больше — до трёх раз.
