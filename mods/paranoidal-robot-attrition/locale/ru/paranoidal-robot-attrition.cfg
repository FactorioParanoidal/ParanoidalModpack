[technology-description]
pra-swarm-safety=Разбившиеся транспортные дроны не взрываются и не поджигают горючий груз в логистических сетях, где занято не больше 500 транспортных дронов за каждый изученный уровень. Взрывчатый груз детонирует всегда. Частота аварий не меняется.
pra-swarm-dispatch=Дроны держат строй, как роботы на звездолётах BnL — по линиям на полу, только в воздухе. Каждый уровень снижает частоту аварий транспортных дронов на 15% (уровни перемножаются: все 5 — ×0,44).

[modifier-description]
pra-swarm-safety=Без взрыва и пожара при крушении в сетях до +__1__ занятых транспортных дронов
pra-swarm-dispatch=Частота аварий транспортных дронов −__1__%
pra-speed-risk=Риск аварий транспортных дронов растёт вместе с их скоростью

