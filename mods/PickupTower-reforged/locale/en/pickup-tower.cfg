[mod-name]
PickupTower-reforged=Pickup Tower Reforged

[mod-description]
PickupTower-reforged=Pickup towers collect items lying on the ground around them.\n\nA tower takes everything in its square — loot from enemies, items dropped by destroyed buildings or fallen off belts — into its chest. The chest is a passive provider: logistic robots or inserters take the items. Four tiers (I–IV): higher tiers have a larger radius, and tower quality enlarges it further. A circuit signal limits what and how much is collected. Rewritten Schall Pickup Tower.

