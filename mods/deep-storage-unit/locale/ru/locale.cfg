[mod-name]
deep-storage-unit=Хранилище материопамяти

[mod-description]
deep-storage-unit=Альтернатива складам. Предметы преобразуются в информацию и хранятся в материопамяти. Одно хранилище материопамяти вмещает неограниченное количество одного предмета одного качества. Чем больше хранится, тем больше энергии требует хранилище материопамяти!

[entity-name]
memory-unit=Хранилище материопамяти
memory-unit-combinator=Комбинатор хранилища материопамяти

[entity-description]
memory-unit=Хранит в материопамяти неограниченное количество одного предмета одного качества. При нехватке питания предметы не переносятся между буфером и материопамятью.\nНельзя хранить портящиеся предметы и предметы с содержимым или данными: броню, технику, чертежи, упакованные хранилища.\nПри разрушении всё содержимое теряется.
memory-unit-combinator=Передаёт в логическую сеть количество предметов в хранилище материопамяти. Сигнал не может превышать 2,1 млрд.

[technology-name]
memory-unit=Хранилище материопамяти

[technology-description]
memory-unit=Хранит в материопамяти неограниченное количество одного предмета одного качества.

[item-name]
memory-unit-with-tags=Хранилище материопамяти (упакованное)

[item-description]
memory-unit-with-tags=Хранилище материопамяти с содержимым.\nСодержит __1__ [item=__2__,quality=__3__]

[mod-setting-name]
memory-unit-power-usage=Энергопотребление материопамяти

[mod-setting-description]
memory-unit-power-usage=Множитель энергопотребления хранилищ и ёмкостей материопамяти. Формула: [font=default-small](1 МВт + ceil(количество / размер стака) ^ 0,35 × множитель) × коэффициент качества[/font]\nДля жидкостей размер стака равен 1000.\nКоэффициент качества: 1 у обычного качества, по параболе снижается до 0,2 у высшего.\nПо умолчанию в Paranoidal: 480 кВт.

[entity-status]
no-input-item=Пусто
cannot-store=Нельзя хранить портящийся предмет __1__
cannot-store-data=Нельзя хранить __1__: в материопамяти потеряется содержимое или данные. Заберите предмет.
output-only=Только выдача: __1__ больше нельзя хранить в материопамяти

[mod-gui]
bulk-insert=[font=default-semibold][color=255,230,192]Положить[/color][/font]\n__CONTROL_LEFT_CLICK__, чтобы положить стак.\n__CONTROL_RIGHT_CLICK__, чтобы скинуть все стаки из инвентаря.
bulk-extract=[font=default-semibold][color=255,230,192]Забрать[/color][/font]\n__CONTROL_LEFT_CLICK__, чтобы забрать стак.\n__CONTROL_RIGHT_CLICK__, чтобы набить стаками инвентарь.
no-input-item=Это хранилище материопамяти ничего не хранит. Нажмите сюда с предметом в руке, чтобы назначить его хранилищу.
reset-filter=[font=default-semibold][color=255,230,192]Сбросить[/color][/font]\nОтвязать пустое хранилище материопамяти от предмета, чтобы хранить в нём другой.
migrated-item=__1__ × __2__: предмет удалён при обновлении. Хранилище материопамяти теперь пусто.
exact-amount=Точно: __1__
quality-power-discount=Качество снижает энергопотребление на __1__%

