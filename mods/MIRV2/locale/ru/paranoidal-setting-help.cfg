[mod-setting-description]
mirv-auto-launch=[item=atomic-bomb] Разрешает оставшейся на орбите пусковой установке M.I.R.V. автоматически выбирать подходящие артиллерийские цели в радиусе стрельбы. При выключении автоматический огонь запрещён; это не настройка автоматического запуска ракетной шахты.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
mirv-pollution-on-detonation=[item=atomic-bomb] Добавляет загрязнение при взрыве M.I.R.V.: 666 единиц распределяются по точкам вокруг взрыва. Выключение убирает этот дополнительный выброс, но не ядерный урон и разрушения.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
