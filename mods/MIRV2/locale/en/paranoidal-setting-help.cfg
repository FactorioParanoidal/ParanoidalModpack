[mod-setting-description]
mirv-auto-launch=[item=atomic-bomb] Allows the orbiting M.I.R.V. launcher to automatically engage valid artillery targets within its firing range. When off, automatic firing is disabled; this does not automate rocket-silo launches.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
mirv-pollution-on-detonation=[item=atomic-bomb] Adds pollution when an M.I.R.V. warhead detonates: 666 units are spread around the blast. Disabling removes this additional emission, not the nuclear damage or destruction.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
