paranoidal-wolframite=Wolframite
paranoidal-refractory-beam=Refractory beam
paranoidal-pobedit=Pobedit
paranoidal-ice-silver=Ice silver
paranoidal-ancient-debris=Ancient debris

[item-description]
paranoidal-wolframite=Ore of Vulcanus. A separate material: the home tungsten ore does not replace it.
paranoidal-refractory-beam=Refractory metal of Vulcanus for its buildings and science. The home tungsten plate does not replace it.
paranoidal-pobedit=Superhard alloy of Vulcanus. The home tungsten carbide does not replace it.
paranoidal-ice-silver=Light metal of Aquilo made from lithium. The home lithium plate does not replace it.
paranoidal-ancient-debris=Debris of ancient machines on Fulgora. The recycler takes it apart into parts and holmium ore. The scrap of the crash site is another item.

