paranoidal-wolframite=Wolframite
paranoidal-ancient-debris=Ancient debris
paranoidal-stone-outcrop=Stone outcrops

[entity-description]
paranoidal-stone-outcrop=Stone outcrops of Gleba, they give ordinary stone.

