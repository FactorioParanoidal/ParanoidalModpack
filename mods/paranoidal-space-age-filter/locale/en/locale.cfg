[mod-name]
paranoidal-space-age-filter=Paranoidal Space Age Filter

[mod-description]
paranoidal-space-age-filter=Space Age for Paranoidal: the classic build up to the rocket, the planets after it.\n\n— The other mods of the build do not see the expansion and work as without it.\n— The expansion's changes to the base game are undone: up to the rocket technologies, recipes and items are the same as without it.\n— After the rocket: space platforms, the planets Vulcanus, Fulgora, Gleba and Aquilo and the third-party planets of the build (Secretas, Frozeta and Moshine). Victory — reach the solar system edge.\n— Every planet has its own materials: wolframite, refractory beams and pobedit of Vulcanus, ancient debris of Fulgora, ice silver and cryogas of Aquilo are not replaced by the home tungsten, lithium, ammonia and scrap.\n— Space science is made on a platform from asteroids, there is no satellite.\n\nDoes nothing without Space Age.

