[mod-name]
paranoidal-space-age-filter=Paranoidal Space Age Filter

[mod-description]
paranoidal-space-age-filter=Space Age only for the space platforms of Paranoidal.\n\n— The other mods of the build do not see the expansion and work as without it.\n— The expansion's changes to the base game are undone: technologies, recipes and items are the same as without it.\n— The platforms stay: the rocket silo sends cargo to them, space science is made on a platform from asteroids, there is no satellite.\n— The planets and their technologies are hidden.\n\nDoes nothing without Space Age.
