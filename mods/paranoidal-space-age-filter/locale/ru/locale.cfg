[mod-name]
paranoidal-space-age-filter=Paranoidal Space Age Filter (Фильтр Космической эпохи Параноидал)

[mod-description]
paranoidal-space-age-filter=Космическая эпоха только для космических платформ Paranoidal.\n\n— Остальные моды сборки не замечают дополнение и работают как без него.\n— Изменения дополнения в обычной игре отменены: исследования, рецепты и предметы такие же, как без него.\n— Остаются платформы: ракетная шахта отправляет грузы на них, космическая наука делается на платформе из астероидов, спутника нет.\n— Планеты и их исследования скрыты.\n\nБез Космической эпохи ничего не делает.
