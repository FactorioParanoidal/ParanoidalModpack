[mod-name]
paranoidal-space-age-filter=Paranoidal Space Age Filter (Фильтр Космической эпохи Параноидал)

[mod-description]
paranoidal-space-age-filter=Космическая эпоха для Paranoidal: до ракеты — классическая сборка, после неё — планеты.\n\n— Остальные моды сборки не замечают дополнение и работают как без него.\n— Изменения дополнения в обычной игре отменены: до ракеты исследования, рецепты и предметы такие же, как без него.\n— После ракеты: космические платформы, планеты Вулкан, Фульгора, Глеба и Аквило и сторонние планеты сборки (Секрета, Фрозета, Мошайн, Мулуна и Мараксис). Граница солнечной системы, для которой нужны все планеты, завершает главу 1; истинный финал — Ковчег на Разрушенной планете (мод Paranoidal True Ending).\n— У каждой планеты свои материалы: вольфрамит, тугоплавкую балку и победит Вулкана, древние обломки Фульгоры, ледяное серебро и криогаз Аквило не заменяют домашние вольфрам, литий, аммиак и металлолом.\n— Космическая наука делается на платформе из астероидов, спутника нет.\n\nБез Космической эпохи ничего не делает.

