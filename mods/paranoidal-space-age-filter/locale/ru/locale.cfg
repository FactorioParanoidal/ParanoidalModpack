paranoidal-pobedit=Сверхтвёрдый сплав Вулкана. Домашний карбид вольфрама его не заменяет.
paranoidal-ice-silver=Лёгкий металл Аквило из лития. Домашняя литиевая плита его не заменяет.
paranoidal-ancient-debris=Обломки древней техники Фульгоры. В переработчике разбираются на детали и гольмиевую руду. Металлолом с места крушения — другой предмет.

