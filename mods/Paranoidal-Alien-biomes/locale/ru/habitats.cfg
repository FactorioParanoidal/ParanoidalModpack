[ab-habitats]
wetland-floor=Корневой покров низины
wetland-understory=Подлесок влажной низины
root-colony=Светящаяся корневая колония
root-colony-description=Колония мелких организмов среди корней во влажной низине. Её слабое свечение становится заметным в темноте. Не размножается как дерево; при расчистке даёт обычную древесину.
crater-centre=Выветренный центр кратера
crater-floor=Тёмные отложения кратера
crater-rim=Отложения кратерного вала
crater-ejecta=Покров ударных выбросов
impact-breccia=Ударная брекчия
impact-breccia-description=Раздробленная порода в древнем месте падения. Осмотритесь: вокруг могут сохраниться вал и россыпь обломков. Содержит обычный камень, а не гарантированную залежь руды.
outcrop=Минеральное обнажение: __1__
outcrop-description=Почвенно-климатические условия этой области благоприятны для ресурса «__1__». Это геологический признак, а не детектор залежей: другие ресурсы тоже возможны, а наличие месторождения здесь не гарантировано. При добыче обнажение даёт обычный камень.
fragments=Минеральная корка: __1__
inactive-outcrop=Минеральное обнажение
inactive-fragments=Минеральная корка
inactive-outcrop-description=Геологическое предпочтение ресурсов отключено или соответствующий ресурс недоступен. Обнажение содержит обычный камень.
margin-grass=Травяной край низины
margin-rosettes=Розетки влажной опушки
dry-shrubs=Кустики сухой кромки
dry-rosettes=Розетки сухой кромки
silt-ground=След влажного грунта
silt-grains=Поверхностный нанос

[shortcut-name]
ab-habitat-fieldbook=Полевой блокнот

[mod-setting-name]
ab-habitat-seasonal-sounds=Тихие сезонные звуки у корневых колоний

[mod-setting-description]
ab-habitat-seasonal-sounds=Редкие личные звуковые акценты при приближении или осмотре колонии на Наувисе, не чаще одного раза в 45 секунд. Сезон берётся из NightBrightness. Не меняет календарь, яркость и обычные звуки леса; при отключённом календаре акцентов нет.

[ab-fieldbook]
title=Полевой блокнот
close=Закрыть
instructions=Подойдите к корневой колонии, обнажению или брекчии и нажмите «Осмотреть место». Записи личные. Ни наград, ни обязательных исследований.
observe=Осмотреть место
observe-tooltip=Записать выделенную колонию или камень в пределах 12 тайлов. Если ничего подходящего не выделено — осмотреть ближайший объект в этом радиусе. Руду и неоткрытую местность блокнот не ищет.
refresh=Обновить
summary=Наблюдаемых разновидностей: __1__. Записей: __2__/__3__.
page=Страница __1__/__2__
previous=Назад
next=Далее
empty=Записей пока нет. Найдите корневую колонию, минеральное обнажение или ударную брекчию, подойдите ближе и осмотрите место.
no-anchor=В пределах 12 тайлов нет колонии, обнажения или брекчии.
row=__1__\n__2__: __3__, __4__
visits=Осмотров с интервалом от минуты: __1__. Первая/последняя запись: __2__/__3__ мин. игры.
season=Сезон последнего осмотра: __1__.
season-none=нет данных календаря
season-spring=весна
season-summer=лето
season-fall=осень
season-winter=зима
clearing=Вблизи одного из осмотренных здесь объектов отмечено удаление дерева. Это след события, не оценка состояния всего леса.
anchor-removed=Ранее осмотренный здесь камень или колония были удалены. Запись о месте сохранена.
industry=При осмотре в пределах 32 тайлов замечено ваше производство. Его нынешнее наличие блокнот не отслеживает.
sector-note=Одна запись на разновидность в секторе 128×128 тайлов. Координаты — последнего осмотренного объекта, не центра участка. Повторный осмотр в течение минуты не увеличивает счётчик. Старейшие по осмотру записи вытесняются: до 128 личных и до 512 на всю карту; список встреченных разновидностей сохраняется.
missing-anchor=Прежний природный объект
