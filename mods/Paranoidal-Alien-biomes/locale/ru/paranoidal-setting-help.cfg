[mod-setting-description]
alien-biomes-include-coastal-shallows=[fluid=water] Разрешает мелководные полосы вдоль берегов. По такому мелководью можно идти, но медленнее, чем по суше; оно не делает всю воду проходимой. Реки и внутренние заболоченные мелководья включаются отдельно.\n[color=#9cdcfe]По умолчанию: включено. После перезапуска игры.[/color]
alien-biomes-include-dirt-aubergine=[img=utility/nature_icon] Разрешает генерацию грунта указанного цвета. Выключение исключает соответствующие покрытия из набора мода, а не просто перекрашивает их. Лучше выбрать настройку до создания мира: при загрузке старого сохранения она тоже меняет набор доступных покрытий.\n[color=#9cdcfe]По умолчанию: включено. После перезапуска игры.[/color]
