alien-biomes-include-inland-shallows=[fluid=water] Разрешает заболоченные мелководья во влажных участках суши. Они замедляют ходьбу, но проходимы пешком; это не обычные глубокие озёра. Прибрежное мелководье и реки регулируются отдельно.\n[color=#9cdcfe]По умолчанию: включено. После перезапуска игры.[/color]
alien-biomes-include-rivers=[fluid=water] Разрешает генератору создавать речные полосы мелководья. Они проходимы пешком, но замедляют движение; настройка не превращает всю глубокую воду в броды. Наличие и форма рек зависят также от генерации местности.\n[color=#9cdcfe]По умолчанию: выключено. После перезапуска игры.[/color]
