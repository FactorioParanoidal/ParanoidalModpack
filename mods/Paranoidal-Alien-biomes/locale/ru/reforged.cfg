[mod-setting-name]
alien-biomes-reforged-atlas=Память под графику ландшафта
alien-biomes-reforged-geology=Геология по цвету почвы

[mod-setting-description]
alien-biomes-reforged-atlas=Оба режима используют одну общую текстуру на семейство почв и одинаковые цвета.\nОбычно: все варианты тайлов, декоративов и деревьев.\nЭкономно: для видеокарт с малым объёмом памяти. Без вариантов тайлов 4×4 и с половиной вариантов 2×2, треть форм декалей, похожие виды деревьев с общей графикой, половина вариантов деревьев, без карт нормалей деревьев. Переключать можно и на существующей карте — меняется только внешний вид.
alien-biomes-reforged-geology=Удваивает относительный вес выбора руд, подходящих к цвету почвы; это не прямое удвоение итоговой вероятности. Соответствия: сапфирит — на синих и фиолетовых, живолит — на кремовых, жёлтых и светло-коричневых, стиратит — на зелёной, оливковой и бирюзовой траве, кротиний — на серых и белых, рубит — на красных, пыльно-розовых и оранжевых, бобмоний — на коричневых и бежевых, уголь — на чёрных, нефть, газ и разломы — на вулканической земле. Не запрещает руды на других почвах; стартовые месторождения не меняются. Работает с Resource Spawner Overhaul и влияет на руды в новых чанках; уже созданные месторождения не переразмещаются.

[string-mod-setting]
alien-biomes-reforged-atlas-normal=Обычно
alien-biomes-reforged-atlas-economy=Экономно
