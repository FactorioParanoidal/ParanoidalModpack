[mod-setting-description]
alien-biomes-terrain-scale=Aumente ou diminua o tamanho do bioma. Valores mais baixos criam biomas menores e mais frequentes. O padrão é 100.
alien-biomes-temperature-low=Os extremos de temperatura mais baixos do planeta. Diminua para adicionar mais neve congelada e gelo. Aumente para tornar as áreas congeladas menos comuns ou impossíveis. O padrão é -50.
alien-biomes-temperature-high=Os extremos de temperatura mais elevados do planeta. Aumente para adicionar mais áreas vulcânicas. Diminua para tornar as áreas vulcânicas menos comuns ou impossíveis. O padrão é 150.
alien-biomes-humidity-low=Os extremos de umidade mais baixos do planeta. Diminua para adicionar mais sobremesa. Aumente para tornar as áreas desérticas menos comuns ou impossíveis. O padrão é 0.
alien-biomes-humidity-high=Os extremos de umidade mais elevados do planeta. Aumente para adicionar mais áreas de grama. Diminua para tornar as áreas de grama menos comuns ou impossíveis. O padrão é 100.
alien-biomes-aux-low=Os extremos mais baixos de variação de cor do planeta. Diminua para adicionar mais cores verdes / marrons / castanhas. Aumente para tornar as cores verdes / marrons / castanhas menos comuns. O padrão é 0.
alien-biomes-aux-high=Os extremos de maior variação de cor do planeta. Aumente para adicionar mais cores azul / roxo / vermelho. Diminua para tornar as cores azul / roxo / vermelho menos comuns. O padrão é 100.
alien-biomes-disable-vegetation=Se habilitado, todos os terrenos gramados, árvores e plantas decorativas serão removidos (a menos que sejam adicionados por um mod diferente). Isso permite que você simule um planeta morto, lua ou asteróide.
alien-biomes-remove-obsolete-tiles=Alien Biomes substitui muitos dos blocos do jogo base. Os blocos obsoletos podem ser removidos para liberar espaços de blocos adicionais para que mais mods que adicionem blocos possam ser usados (há um limite de 255 blocos). Fazer isso pode causar problemas com outros mods que exigem esses blocos do jogo base.
alien-biomes-reduced-tiles=Variantes de Blocos Reduzidas
tile-speed-reduction=Alguns blocos (como terreno vulcânico quente) diminuem a velocidade do jogador. Reduzir este número significa que o terreno vai diminuir menos.

