[mod-setting-description]
alien-biomes-terrain-scale=バイオームのサイズを増加または減少させます。低い値では、より小さい、より頻繁なバイオームを作成します。デフォルトは100です。
alien-biomes-temperature-low=惑星の低温の下限を凍った雪や氷を増やすために減少させます。増加させると、凍結した地域が少なくなるか、出来なくなります。デフォルトは-50です。
alien-biomes-temperature-high=惑星の高温の上限を火山地帯を増やすために増やします。減少させると、火山地帯が少なくなるか、出来なくなります。デフォルトは150です。
alien-biomes-humidity-low=惑星の湿度下限を表す。 この値を小さくすると、砂漠の地形がより強調されます。 この値を大きくすると、砂漠の地形は通常より小さくなるか、出来なくなります。 初期値は0です。
alien-biomes-humidity-high=惑星の湿度上限を表す。 この値を大きくすると、より多くの草が追加されます。 この値を小さくすると、草が通常より落ちるか、出来なくなります。 初期値は100です。
alien-biomes-aux-low=惑星の色彩多様性の下限を表します。減少させると、緑 / 茶 / 黄褐色の色が増えます。増加させると、緑色 / 茶色 / 黄褐色の色が少なくなります。デフォルトは 0 です。
alien-biomes-aux-high=惑星の色彩多様性の上限を表します。増加させると、青/紫/赤の色が増えます。減少させると青/紫/赤の色が少なくなります。デフォルトは100です。
alien-biomes-disable-vegetation=有効にすると、草地の地形、木、植物系の装飾はすべて削除されます（別のMODで追加された場合を除く）。これにより、死んだ惑星、衛星、または小惑星をシミュレートすることができます。
alien-biomes-remove-obsolete-tiles=Alien Biomesは多くのバニラタイルを置き換えます。廃止されたタイルを削除することで、タイルを追加するMODをより多く使用できるように、20個の追加のタイルスロットを解放できます（255個のタイルの制限があります）。そうすることで、それらのバニラタイルを必要とする他のMODで問題が発生する可能性があります。
alien-biomes-reduced-tiles=タイルのバリエーションの削減
tile-speed-reduction=タイルの中には（高温の火山地形など）プレイヤーの移動速度を低下させるものがあります。この数値を減らすと、地形による移動速度低下が少なくなります。
