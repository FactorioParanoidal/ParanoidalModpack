[mod-setting-name]
alien-biomes-reforged-atlas=Terrain graphics memory
alien-biomes-reforged-geology=Geology by soil colour

[mod-setting-description]
alien-biomes-reforged-atlas=Both modes use one shared texture per terrain family and identical tints.\nNormal: all tile, decorative and tree variants.\nEconomy: for graphics cards with little memory. No 4×4 and half of the 2×2 tile variants, a third of the decal shapes, similar tree species share graphics, half of the tree variants, no tree normal maps. Safe to switch on an existing map (only the look changes).
alien-biomes-reforged-geology=Ores are twice as likely in regions whose soil has a matching colour: sapphirite on blue and purple soils, jivolite on cream, yellow and tan, stiratite on green, olive and turquoise grass, crotinnium on grey and white, rubyte on red, dusty rose and orange, bobmonium on brown and beige, coal on black, oil, gas and fissures on volcanic ground. No ore disappears anywhere; the starting area is unchanged. Works with Resource Spawner Overhaul and affects only regions generated after the change.

