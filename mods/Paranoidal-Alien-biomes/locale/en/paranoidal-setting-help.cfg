alien-biomes-include-inland-shallows=[fluid=water] Allows inland wetland shallows in moist terrain. They slow walking but can be crossed on foot, unlike ordinary deep lakes. Coastal shallows and rivers are controlled separately.\n[color=#9cdcfe]Default: enabled. Requires a game restart.[/color]
alien-biomes-include-rivers=[fluid=water] Allows the generator to create river-shaped bands of shallow water. They are walkable but slow movement; this does not turn all deep water into fords. River presence and shape also depend on terrain generation.\n[color=#9cdcfe]Default: disabled. Requires a game restart.[/color]
