[mod-setting-description]
alien-biomes-include-coastal-shallows=[fluid=water] Allows shallow-water bands along coastlines. This shallow water is walkable but slows movement; deep water does not become walkable. Rivers and inland wetland shallows have separate settings.\n[color=#9cdcfe]Default: enabled. Requires a game restart.[/color]
alien-biomes-include-dirt-aubergine=[img=utility/nature_icon] Allows generation of dirt terrain of this color. Disabling excludes these tiles from the mod’s terrain set rather than simply recoloring them. Choose before creating a world: the available tile set also changes when loading an existing save.\n[color=#9cdcfe]Default: enabled. Requires a game restart.[/color]
