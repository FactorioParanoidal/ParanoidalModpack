[mod-setting-description]
ab-habitat-seasonal-sounds=Occasional personal sound accents when approaching or examining a colony on Nauvis, at most once per 45 seconds. Seasons come from NightBrightness. Does not change the calendar, brightness or ordinary forest ambience; no accents play when the calendar is disabled.

[ab-fieldbook]
title=Field notebook
close=Close
instructions=Approach a root colony, outcrop or impact breccia and choose Examine site. Records are personal. No rewards or mandatory research.
observe=Examine site
observe-tooltip=Record a selected colony or rock within 12 tiles. With no suitable selection, examine the nearest object in that radius. The notebook does not search for ore or unexplored terrain.
refresh=Refresh
summary=Varieties observed: __1__. Records: __2__/__3__.
page=Page __1__/__2__
previous=Previous
next=Next
empty=No records yet. Find a root colony, mineral outcrop or impact breccia, approach it and examine the site.
no-anchor=No colony, outcrop or impact breccia within 12 tiles.
row=__1__\n__2__: __3__, __4__
visits=Examinations at least a minute apart: __1__. First/last record: __2__/__3__ min. played.
season=Season at the last examination: __1__.
season-none=no calendar data
season-spring=spring
season-summer=summer
season-fall=autumn
season-winter=winter
clearing=A tree was removed near an object examined here. This records an event, not the condition of the entire forest.
anchor-removed=A previously examined rock or colony here was removed. The site record remains.
industry=Your production was observed within 32 tiles during an examination. The notebook does not track its current presence.
sector-note=One record per variety in a 128×128-tile sector. Coordinates identify the last examined object, not the site's centre. Re-examining within a minute does not increase the count. Least recently examined records are evicted: up to 128 per player and 512 globally; the list of varieties encountered is retained.
missing-anchor=Former natural object
