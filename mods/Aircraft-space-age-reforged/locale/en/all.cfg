[mod-setting-description]
aircraft-sound-setting=Use jet engine sounds instead of car engine sounds.
aircraft-hardmode=Reduces damage resistance for all standard, carbon-fiber and airborne aircraft.
aircraft-belt-immunity=Belts do not move aircraft.
helicopter-tech=Requires Advanced aerodynamics before helicopter research. Only affects HelicopterRevival; enabled by default.
heli-equipment-grid=Allows aircraft equipment in the existing HelicopterRevival equipment grid without replacing or resizing it. Enabled by default.
non-combat-mode=Disables research of Gunships, Jets, Flying fortress and their carbon-fiber variants. Existing aircraft are not removed. Cargo planes remain armed.
inserter-immunity=Prevents automatic item insertion and removal, except for burner refuelling. Applies to all aircraft variants.
lock-surfaces-space-age=Requires pressure of at least 700 hPa and gravity of at most 20 m/s² when placing aircraft. Only affects Space Age.
carbon-fiber-aircraft=Adds Space Age aircraft with half the mass, health and fuel consumption, including airborne variants. Cargo capacity and equipment grids are unchanged.
disable-tank-controls=Use steering with a turning radius instead of tank controls.
fuel-consumption-multiplier=Multiplies aircraft fuel consumption while compensating engine efficiency to preserve nominal thrust. Default: 10. Allowed range: 0.1–100.
aircraft-change-vanilla-tech-tree=Requires Cargo planes before the rocket silo and Afterburner before space platform thrusters.
