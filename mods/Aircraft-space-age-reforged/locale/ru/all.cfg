[mod-setting-description]
aircraft-sound-setting=Использовать звуки реактивного двигателя вместо автомобильных.
aircraft-hardmode=Снижает сопротивления урону у обычных, углепластиковых и летающих вариантов самолётов.
aircraft-belt-immunity=Конвейеры не перемещают самолёты.
helicopter-tech=Для исследования вертолётов требуется Продвинутая аэродинамика. Действует только с HelicopterRevival; включено по умолчанию.
heli-equipment-grid=Разрешает авиационное оборудование в существующей сетке HelicopterRevival, не заменяя и не увеличивая её. Включено по умолчанию.
non-combat-mode=Отключает исследование боевых самолётов, реактивных самолётов, летающей крепости и их углепластиковых версий. Уже существующие самолёты не удаляются. Грузовые самолёты остаются вооружёнными.
inserter-immunity=Запрещает автоматическую загрузку и выгрузку предметов, кроме заправки топливом. Действует на все варианты самолётов.
lock-surfaces-space-age=Для размещения самолёта нужны давление не ниже 700 гПа и гравитация не выше 20 м/с². Действует только с Space Age.
carbon-fiber-aircraft=Добавляет самолёты Space Age с вдвое меньшими массой, запасом здоровья и расходом топлива, в том числе в полёте. Вместимость и сетки оборудования не меняются.
disable-tank-controls=Управление с радиусом поворота вместо танкового управления.
fuel-consumption-multiplier=Умножает расход топлива самолётов. Эффективность двигателя компенсируется для сохранения номинальной тяги. По умолчанию: 10. Допустимый диапазон: 0,1–100.
aircraft-change-vanilla-tech-tree=Для ракетной шахты потребуются Грузовые самолёты, а для двигателей космической платформы — Форсажная камера.
