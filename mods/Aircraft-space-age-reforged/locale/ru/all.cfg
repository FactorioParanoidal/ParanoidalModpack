[mod-name]
Aircraft-space-age-reforged=Aircraft Reforged (Переработанная авиация)

[mod-description]
Aircraft-space-age-reforged=Четыре самолёта для разведки, перевозки грузов и боя. Есть авиационные энергощиты, форсажные камеры и специальные боеприпасы, включая напалм. При включённом Space Age доступны углепластиковые версии самолётов. Необязательный AircraftRealism добавляет взлёт и посадку; без него самолёты перемещаются как техника без столкновений. У грузового самолёта нет сетки оборудования.

