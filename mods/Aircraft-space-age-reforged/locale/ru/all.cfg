high-explosive-cannon-shells=Усиленные разрывные снаряды с большой зоной взрыва.
afterburner=Электрическое оборудование, повышающее ускорение самолётов.
aircraft-energy-shield=Электрические щиты для авиационных сеток оборудования.
napalm=Долго горящее топливо для огнемётов, установленных на технике.
gunships-carbon-fiber=Боевые самолёты с вдвое меньшими массой, запасом здоровья и расходом топлива. Вместимость и сетка оборудования не меняются.
jets-carbon-fiber=Реактивные самолёты с вдвое меньшими массой, запасом здоровья и расходом топлива. Вместимость и сетка оборудования не меняются.
cargo-planes-carbon-fiber=Грузовые самолёты с вдвое меньшими массой, запасом здоровья и расходом топлива. Вместимость не меняется; сетки оборудования по-прежнему нет.
flying-fortress-carbon-fiber=Летающие крепости с вдвое меньшими массой, запасом здоровья и расходом топлива. Вместимость и сетка оборудования не меняются.

