cargo-plane=Транспортный самолёт с большим грузовым отсеком, пулемётом малой дальности и без сетки оборудования.
jet=Быстрый самолёт с пулемётом, ракетницей и напалмовым огнемётом.
flying-fortress=Тяжёлый боевой самолёт с пулемётом, ракетницей, орудием и большой сеткой оборудования.
napalm=Долго горящее топливо для огнемётов, установленных на технике.
aircraft-afterburner=Увеличивает ускорение самолёта. Требует электроэнергии из сетки оборудования.
aircraft-energy-shield=Авиационный энергощит. Восстановление щита расходует электроэнергию.

