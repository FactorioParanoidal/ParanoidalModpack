[mod-setting-description]
bpsb-bonus-inventory-slots=[img=utility/character_inventory_slots_bonus_modifier_icon] Добавляет указанное число слотов к инвентарю в песочнице сверх обычных бонусов вашей команды. В обычном мире дополнительные слоты от этой настройки не выдаются. 0 убирает только эту добавку.\n[color=#9cdcfe]По умолчанию: 30. Диапазон: 0–300. Общая настройка карты.[/color]
bpsb-custom-lab-tiles=[item=concrete] Заменяет изображение и цвет на карте двух лабораторных покрытий, используемых в песочнице. Это оформление пола, а не изменение скорости ходьбы, производства или отдельная настройка поглощения загрязнения.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
bpsb-god-building=[item=construction-robot] В песочнице сразу размещает постройки по призракам (планам строительства), выполняет заявки на предметы и приказы разборки или улучшения без ожидания строительных роботов. Выключите, если нужно оставить такие приказы для проверки обычной стройки. Действует только в песочнице и сохраняет её запреты на отдельные объекты.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
