[tips-and-tricks-item-description]
bpsb-intro-introduction=Добро пожаловать в мод Песочница проектировщика!\n\nОн позволяет вам использовать некоторые функции редактора и  режима бога, не покидая текущую игру, в лабораторных условиях.\n\nЛучшие способы добавить или взять чертежи из песочниц — это копирование и вставка, а также использование вашей библиотеки чертежей. Иногда вы также можете "перетащить" чертеж внутрь или наружу, просто держа его в курсоре.\n\nЧтобы попасть в свою первую песочницу, используйте сочетание клавиш __CONTROL__bpsb-toggle-gui-sb-toggle-shortcut__ или нажмите кнопку переключения в панели быстрого доступа. Используйте этот же метод для выхода из песочницы.
bpsb-intro-multiple-sandboxes=Пока вы в песочнице, на экране есть её окно. Первое, что в нём видно, — выбор песочницы:\n\nМоя личная Песочница — лабораторная песочница только для вас.\nПесочница союзников — ещё одна лабораторная песочница, общая для всей вашей команды.\n\nЕсли изоляция не полная, эти песочницы, в том числе песочницы товарищей по команде, можно открыть и из удалённого просмотра.
bpsb-intro-reset-v2=Ещё в окне песочницы есть кнопка «Очистить». Она полностью очищает текущую песочницу, если хотите начать заново. В песочнице союзников помните о других: очистка затронет всех.\n\nНа схеме — красная кнопка окна песочницы: она убирает всё построенное и ставит вас в центр. Своя песочница затрагивает только вас, песочница союзников — всех, кто в ней. В мультиплеере настройка «Разрешить очистку только админам» оставляет эту кнопку в песочнице союзников только админам.
bpsb-intro-surface-properties=Это окно настраивает отдельную песочницу. Например, можно зафиксировать время суток или электрифицировать пол, чтобы не ставить столбы.\n\nЕсли вы играете в Space Age или с необычными модами, у некоторых объектов и рецептов есть условия поверхности: без них объект не строится, а рецепт нельзя выбрать. Здесь можно выбрать преднастройку по настоящей локации или задать параметры вручную. Преднастройки могут содержать скрытые, но важные отличия в свойствах, поэтому сначала выберите самую близкую преднастройку, а потом меняйте параметры.
bpsb-intro-sandbox-force=При полной изоляции в песочнице вас на самом деле переносят в другую команду, очень похожую на вашу (без изоляции этого не происходит). В песочнице у вас больше прав, и так они надёжно отделены от обычной игры.\n\nПоэтому вы больше не «владеете» объектами настоящего мира — поездами, платформами, турелями — и не получаете оповещений, если их повреждают или уничтожают. Позаботьтесь об обороне базы заранее или почаще возвращайтесь, чтобы не застать беду.\n\nВ зависимости от настроек мода эта команда либо повторяет ваши изученные технологии, либо сразу знает все. В первом случае прогресс отдельной технологии не обновляется в реальном времени, но очередь исследований синхронизирована.\n\nКоманда песочницы построена на вашей, поэтому при смене команды у вас будут другие песочницы союзников, а личную песочницу может понадобиться очистить (вы больше ничем в ней не владеете).\n\nНа схеме — на базе оповещения вашей команды доходят до вас; в песочнице вы в её команде, оповещение не приходит, и атакованную турель вы увидите, только когда вернётесь. Исследования двух команд синхронизируются.
bpsb-intro-new-recipes-v2=В песочнице вам доступны новые рецепты и инструменты для экспериментов.\n\nВо-первых, включены скрытые погрузчики Factorio, если их ещё не включил другой мод. Для тех же испытаний включены бесконечные аккумулятор, сундук и труба, тепловой интерфейс и бесконечный грузовой вагон: используйте их как условные входы и выходы, чтобы проверить свои схемы.\n\nДалее, в окне песочницы есть поле «Сущности:». Выберите объект и получите планировщик: выделение (__CONTROL__select-for-blueprint__) создаёт выбранное в области, обратное выделение (__CONTROL__reverse-select__) удаляет. Поле «Плитки:» даёт планировщик попроще: он меняет плитки пола, а обратное выделение (__CONTROL__reverse-select__) возвращает лабораторный пол.\n\nНаконец, в песочнице предметы крафтятся мгновенно и сразу в курсор: всё, что вы создаёте щелчком, готово к использованию. Это заменяет то, что было в курсоре, поэтому можно просто нажать __CONTROL__open-character-gui__, щёлкнуть рецепт, __CONTROL__confirm-gui__, строить дальше и повторять. Это настраивается для каждого игрока.\n\nНа схеме — бесконечные объекты и испытательный стенд (бесконечный вход, ваш проект, бесконечный выход); планировщик сущностей создаёт или удаляет их (обратное выделение), планировщик плиток кладёт плитку или возвращает лабораторный пол; щелчок по рецепту кладёт предмет сразу в курсор.
bpsb-intro-god-mode=Если изоляции нет, при входе в песочницу вы смотрите на неё через удалённый просмотр, а открыть её можно и щелчком из удалённого просмотра. Большую часть работы роботов в таких песочницах выполняет скрипт, так что обычно это удобно.\n\nПри полной изоляции вы становитесь «богом» и управляете напрямую. Ваше тело остаётся там, где вы его оставили (осторожно!), а вы свободно летаете по песочнице. Инвентарь бога сохраняется и отделён от инвентаря вашего персонажа. Войти так можно не всегда: мод должен безопасно отделить вас от тела и потом вернуть.\n\nНа схеме слева — без изоляции вы остаётесь в своём теле и смотрите через удалённый просмотр, а строит скрипт вместо роботов; справа — при полной изоляции тело остаётся на базе, а вы летаете богом с отдельным инвентарём.
bpsb-intro-auto-building=В песочнице призраки построек заполняются автоматически — ждать строительных роботов не нужно. Улучшение и снос тоже выполняются без их участия.\n\nБольшие чертежи могут обрабатываться постепенно. Скорость автоматических действий можно изменить в настройках мода. Ручной снос здесь тоже ускорен.\n\nПроверяйте идеи спокойно: ошибиться в песочнице дешевле, чем потом объяснять всей базе, что это был прототип.
bpsb-factorissimo-introduction=Песочницы совместимы с Paranoidal Factorissimo 4: он основан на форке notnotmelon и даёт нужные для этого API.\n\nВ основном фабрики внутри песочниц получают те же удобства, что и сама песочница: например, автоматическое заполнение призраков и быстрый крафт работают и внутри фабрик Factorissimo. Но есть неизбежные ограничения.\n\nФабрики хранятся на общей поверхности, поэтому некоторые функции, действующие на всю поверхность, внутри них отключены: в фабриках нельзя менять яркость и нельзя их очистить. Кроме того, сохранять ваше невидимое тело здесь слишком сложно, поэтому, находясь в фабрике внутри песочницы, нельзя выйти из песочницы или перейти в другую — сначала выйдите из фабрики.\n\nНа схеме — в фабрике внутри песочницы призраки строятся, а крафт идёт в курсор; время суток и очистка там не работают, а чтобы выйти из песочницы или сменить её, сначала выйдите из фабрики.

[messages]
universe-of-sandboxes-intro=Добро пожаловать во Вселенную Песочниц! Каждая планета будет плиткой лаборатории, но в остальном будет иметь все свои обычные свойства.\nИспользуйте редактор, чтобы кардинально изменять ландшафт, если вам это нужно. Выход из редактора переключит вас в режим бога.\nКогда вы используете удаленный просмотр чтобы увидеть другую поверхность, а затем выходите из него, Factorio поместит вас на эту поверхность. Используйте это, чтобы взаимодействовать более напрямую и без ограничений на покрытие радаром.
blueprint-in-cursor-from-library=В вашем курсоре был чертёж, но Factorio неправильно описывает его как недействительный. Это, скорее всего, связано с тем, что он в данный момент находится в Библиотеке чертежей (известная ошибка в Factorio).
character-lost=[img=utility/warning_icon] К сожалению, ваш предыдущий персонаж был полностью утерян, и вам нужно начать заново.
choose-first-associated-character=[img=utility/warning_icon] У вас есть несколько связанных персонажей, но песочница не знает, какой из них вы хотите выбрать, поэтому она выберет первого, которого может найти.
god-inventory-almost-full=[img=utility/warning_icon] Ваш инвентарь почти полон. Пожалуйста, выбросьте некоторые предметы.
factorissimo-cannot-change-sandbox=[img=utility/warning_icon] Вы находитесь внутри фабрики, поэтому не можете сменить песочницу.
sandbox-force-changed-while-in-sandbox=Ваша сила изменилась, и вы были удалены из песочницы, в которой вам больше не разрешено находиться.
sandbox-entrace-from-unsupported-controller=[img=utility/warning_icon] Вы вошли в песочницу необычным способом, используя неподдерживаемое управление. Теперь вы остались наедине с собой.
sandbox-exiting-without-known-entrace=[img=utility/warning_icon] Похоже, вы вошли в песочницу не обычным способом, она не знает откуда вы пришли. Происходящее дальше может быть неожиданным.
sandbox-unsafe-to-close-remote-view=Вы используете удалённый обзор, который нельзя безопасно закрыть и поэтому не можете войти в песочницу. Сначала вернитесь к своему персонажу.

sandbox-unsafe-to-replace-controller=Ваш текущий персонаж/управление нестабилен, поэтому вы не можете войти в песочницу
sandbox-unsafe-to-replace-controller-watching-a-cutscene=просмотр кат-сцены
sandbox-unsafe-to-replace-controller-using-a-jetpack=используете реактивный ранец
sandbox-unsafe-to-replace-controller-using-the-editor=используете редактор
sandbox-unsafe-to-replace-controller-controller-stashed=основное управление убрано
sandbox-unsafe-to-replace-controller-riding-a-rocket=летите в ракете
sandbox-unsafe-to-replace-controller-remote-view-while-not-physical=физическое управление не является физическим персонажем при использовании удалённого обзора
sandbox-unsafe-to-replace-controller-remote-view-while-driving=вождение при удалённом обзоре
sandbox-unsafe-to-replace-controller-riding-a-platform=летите на платформе
