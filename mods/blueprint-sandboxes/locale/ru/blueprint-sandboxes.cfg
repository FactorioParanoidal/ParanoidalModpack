bpsb-toggle-gui-reset-button-only-admins=Очистка доступна только админам (настройка мода)
bpsb-toggle-gui-allow-all-technology=То же, что настройка карты «Разблокировать все технологии в Песочнице». Действует на все Песочницы. Выключение снова синхронизирует технологии с основной силой.
bpsb-toggle-gui-allow-all-technology-only-admins=В мультиплеере эту настройку карты меняют только админы
bpsb-toggle-gui-allow-all-technology-no-isolation=Работает только при полной изоляции Песочниц (настройка карты «Изоляция»)
bpsb-toggle-gui-surface-props-button=Изменить свойства поверхности, чтобы разблокировать некоторые рецепты и условия
bpsb-toggle-gui-entity-selection-planner-generator=Создавайте сущности в выбранной области. __CONTROL__reverse-select__, чтобы уничтожить их. __CONTROL__select-for-cancel-deconstruct__, чтобы создать или уничтожить больше.
bpsb-toggle-gui-tile-selection-planner-generator=Примените эту плитку к выбранной области. __CONTROL__reverse-select__, чтобы вернуться к лабораторным плиткам.

bpsb-surface-props-gui=У некоторых сущностей и рецептов есть условия для создания и строительства. Выбери другую локацию как преднастройку/образец или настрой вручную.

bpsb-surface-props-gui-property-preset-drop-down=Выбери преднастройку из стандартных.
bpsb-surface-props-gui-property-preset-reset=Применить эту преднастройку ещё раз
bpsb-surface-props-gui-property-ignore-conditions=Будет ли Factorio пытаться игнорировать условия огнраничивающие постройки/рецепты. Он не может избежать определенных ограничений, таких как постройка сборщиков молний.

