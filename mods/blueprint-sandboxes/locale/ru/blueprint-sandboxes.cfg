[mod-name]
blueprint-sandboxes=Blueprint Sandboxes (Песочницы для чертежей)

[mod-description]
blueprint-sandboxes=Песочницы для чертежей: отдельные творческие поверхности, где можно проектировать и испытывать без ресурсов.\n\n— Shift+B или кнопка на панели — перейти в песочницу и обратно; ваш персонаж и инвентарь на основной карте остаются нетронутыми.\n— В песочнице постройки ставятся мгновенно и бесплатно, можно получать предметы, есть планировщик добавления, сброс и настройки поверхности (день и ночь, условия).\n— Сделанное можно сохранить чертежом и перенести на основную карту.\n\nВ сборке песочница полностью изолирована: внутри вы играете за отдельную силу со своей статистикой, а опыт ролевой системы и вехи основной игры там не начисляются.

