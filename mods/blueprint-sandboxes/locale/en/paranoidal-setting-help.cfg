[mod-setting-description]
bpsb-bonus-inventory-slots=[img=utility/character_inventory_slots_bonus_modifier_icon] Adds this many sandbox-force inventory slots on top of the main force’s inventory bonus. It does not grant extra slots in the ordinary world. A value of 0 removes only this additional bonus.\n[color=#9cdcfe]Default: 30. Range: 0–300. Shared map setting.[/color]
bpsb-custom-lab-tiles=[item=concrete] Replaces the graphics and map colors of the two laboratory tiles used by the sandbox. This changes floor appearance, not walking speed or production; pollution absorption has its own setting.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
bpsb-god-building=[item=construction-robot] In the sandbox, allows ghosts, item requests, deconstruction and upgrade orders to be handled without waiting for construction robots. Disable it to leave such orders for testing ordinary construction. It applies only inside sandboxes and keeps their object restrictions.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
