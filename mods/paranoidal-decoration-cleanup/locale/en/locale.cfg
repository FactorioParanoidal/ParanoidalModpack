[mod-name]
paranoidal-decoration-cleanup=Paranoidal Decoration Cleanup

[mod-description]
paranoidal-decoration-cleanup=Decorations for Paranoidal: placing any floor tile that removes decorations removes all of them, building an entity removes the decorations under it, and the map generator places fewer decorations (startup multiplier) and no decorative rocks. With Paranoidal Droid M-O in the game, floors and buildings leave the cleaning to M-O (startup setting, on by default). Replaces Clean Floor, Realistic Decoration Cleanup and UnPollock.

[mod-setting-name]
unpollock-decorative-rate=Decorative rate
unpollock-fake-rocks=Fake rocks
paranoidal-decoration-cleanup-droid-m-o=Leave the cleaning to M-O

[mod-setting-description]
unpollock-decorative-rate=Decorative frequency, as a multiplier to vanilla. Minimum 0, maximum 1. Default 0.7. Affects new map areas only.
unpollock-fake-rocks=Which non-mineable decorative rocks to exclude from newly generated map areas: keep retains them; by-control matches the rocks generation control and its dependent expressions; by-order matches an order string containing [rock]; by-name matches a separate rock or rocks word in the name. Order matching is generally convenient but may miss modded rocks. Existing decorations and ordinary mineable rocks are not removed.
paranoidal-decoration-cleanup-droid-m-o=When Paranoidal Droid M-O is in the game, floor tiles remove only their own share of the decorations, as in the base game (15 % on stone path, 25 % on concrete), and buildings only those they stand on; M-O cleans the rest. Off: floors and buildings clear them all, as without M-O. Map generation is the same either way.

[string-mod-setting]
unpollock-fake-rocks-keep=Keep fake rocks
unpollock-fake-rocks-by-order=Order string contains "[rock]"
unpollock-fake-rocks-by-control=Uses "rocks" planet control
unpollock-fake-rocks-by-name=Name contains "rock" or "rocks"
