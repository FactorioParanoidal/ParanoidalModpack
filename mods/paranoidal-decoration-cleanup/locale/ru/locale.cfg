[mod-name]
paranoidal-decoration-cleanup=Paranoidal Decoration Cleanup (Очистка декораций Параноидал)

[mod-description]
paranoidal-decoration-cleanup=Убирает декорации — траву, кусты, цветы, мелкие камни — там, где вы строите, и делает их реже на карте.\n\n— Покрытие (бетон, кирпич, плитка) убирает с клетки все декорации, а не часть.\n— Постройка убирает декорации под собой и чуть вокруг — как в жизни: дом или дорогу не строят поверх кустов.\n— На новых участках карты декораций меньше (настройка «Плотность декораций», по умолчанию 0,7 от обычной), а декоративных камней нет.\n\nВлияет только на внешний вид. Заменяет Clean Floor, Realistic Decoration Cleanup и UnPollock.

[mod-setting-name]
unpollock-decorative-rate=Плотность декораций
unpollock-fake-rocks=Декоративные камни

[mod-setting-description]
unpollock-decorative-rate=Частота появления декораций относительно ванили. Минимум 0, максимум 1. По умолчанию 0,7. Действует только на новые участки карты.
unpollock-fake-rocks=Декоративные камни, не являющиеся физическими объектами, которые нужно исключить из генерации карты.\n\nРекомендуется выбирать по строке сортировки: она объединяет камни в редакторе, но может не охватывать камни из модов.\n\nВ Factorio 2.0 выбор по параметру генерации планеты действует только на камни типа Наувиса и может затронуть другие декоративные объекты, предназначенные для размещения рядом с камнями.

[string-mod-setting]
unpollock-fake-rocks-keep=Оставить декоративные камни
unpollock-fake-rocks-by-order=Строка сортировки содержит «[rock]»
unpollock-fake-rocks-by-control=По параметру генерации планеты «rocks»
unpollock-fake-rocks-by-name=Имя содержит «rock» или «rocks»
