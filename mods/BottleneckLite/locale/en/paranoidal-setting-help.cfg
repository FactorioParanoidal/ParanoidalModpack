[mod-setting-description]
bnl-color-disabled=[img=utility/notification] Indicator color for when the machine is disabled. Check its enable conditions, including circuit-network control.\n[color=#9cdcfe]Requires a game restart.[/color]
bnl-color-full_output=[item=steel-chest] Indicator color for when output is full. Check product removal or output-fluid drainage.\n[color=#9cdcfe]Requires a game restart.[/color]
bnl-color-idle=[item=assembling-machine-2] Indicator color for when the machine is idle. This is the general idle color; input shortages, power problems and other named causes have separate colors.\n[color=#9cdcfe]Requires a game restart.[/color]
bnl-color-insufficient_input=[item=inserter] Indicator color for when input resources are insufficient. Check the items and fluids supplied for the current recipe.\n[color=#9cdcfe]Requires a game restart.[/color]
bnl-color-low_power=[item=accumulator] Indicator color for when the machine receives too little power. Unlike no power, supply is present but insufficient; check network production and demand.\n[color=#9cdcfe]Requires a game restart.[/color]
bnl-color-no_minable_resources=[item=electric-mining-drill] Indicator color for when a drill has no resources left to mine. Unlike an assembler input shortage, this concerns the deposit in the drill’s mining area.\n[color=#9cdcfe]Requires a game restart.[/color]
bnl-color-no_power=[item=small-electric-pole] Indicator color for when the machine has no power. For electric machines, check their network connection and power generation.\n[color=#9cdcfe]Requires a game restart.[/color]
bnl-color-working=[item=assembling-machine-2] Indicator color for when the machine is working. This displays the current working state; it does not grant a speed bonus.\n[color=#9cdcfe]Requires a game restart.[/color]
bnl-enable=[item=assembling-machine-2] Adds colored status indicators to assembling machines, furnaces and rocket silos; drills have a separate switch. Colors show operation, idling and common stoppage causes. Disabling hides indicators without stopping production.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
bnl-indicator-size=[item=assembling-machine-2] Chooses machine status-indicator size, from tiny to huge. Larger indicators are easier to see when zoomed out; smaller ones obscure less of the building. Size does not change machine operation or status colors.\n[color=#9cdcfe]Default: Small. Requires a game restart.[/color]
