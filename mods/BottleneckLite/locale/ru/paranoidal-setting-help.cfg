[mod-setting-description]
bnl-color-disabled=[img=utility/notification] Цвет индикатора для состояния «машина отключена». Проверьте условия включения, в том числе управление логической сетью.\n[color=#9cdcfe]После перезапуска игры.[/color]
bnl-color-full_output=[item=steel-chest] Цвет индикатора для состояния «выход заполнен». Проверьте вывоз готовой продукции или отвод выходной жидкости.\n[color=#9cdcfe]После перезапуска игры.[/color]
bnl-color-idle=[item=assembling-machine-2] Цвет индикатора для состояния «машина простаивает». Это основной цвет простоя; для нехватки сырья, энергии и других выделенных причин предусмотрены отдельные цвета.\n[color=#9cdcfe]После перезапуска игры.[/color]
bnl-color-insufficient_input=[item=inserter] Цвет индикатора для состояния «не хватает входных ресурсов». Проверьте подачу нужных предметов и жидкостей для текущего рецепта.\n[color=#9cdcfe]После перезапуска игры.[/color]
bnl-color-low_power=[item=accumulator] Цвет индикатора для состояния «энергии поступает недостаточно». Отличается от полного отсутствия питания: проверьте мощность и нагрузку энергосети.\n[color=#9cdcfe]После перезапуска игры.[/color]
bnl-color-no_minable_resources=[item=electric-mining-drill] Цвет индикатора для состояния «буру больше нечего добывать». Отличается от нехватки ингредиентов сборочного автомата; проверьте месторождение под буром.\n[color=#9cdcfe]После перезапуска игры.[/color]
bnl-color-no_power=[item=small-electric-pole] Цвет индикатора для состояния «машина не получает питание». Для электрических машин проверьте соединение с сетью и наличие генерации.\n[color=#9cdcfe]После перезапуска игры.[/color]
bnl-color-working=[item=assembling-machine-2] Цвет индикатора для состояния «машина работает». Это цвет текущего рабочего состояния, а не дополнительный бонус к скорости.\n[color=#9cdcfe]После перезапуска игры.[/color]
bnl-enable=[item=assembling-machine-2] Добавляет цветные индикаторы состояния на сборочные автоматы, печи и ракетные шахты; буры включаются отдельным флажком. По цвету видно работу, простой и основные причины остановки. Выключение убирает индикацию, не останавливая производство.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
bnl-indicator-size=[item=assembling-machine-2] Выбирает размер цветного индикатора состояния машины — от крошечного до огромного. Больший удобнее различать при отдалении камеры, меньший меньше закрывает постройки. На работу машин и цвета состояний размер не влияет.\n[color=#9cdcfe]По умолчанию: Маленький. После перезапуска игры.[/color]
