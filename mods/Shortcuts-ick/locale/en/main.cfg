ick-prepare-uninstall=Prepare a startup setting change or uninstallation of the [color=yellow]"Shortcuts for 2.0"[/color] mod.


[mod-setting-description]
artillery-toggle=[item=artillery-turret][item=artillery-wagon] Selects the artillery on/off tool targets: both types, artillery wagons only, or stationary artillery turrets only. Disabled removes the button and tool, not the artillery itself.
autogen-color=Select color

ick-compatibility-mode=Removes research requirements from the environment planner, artillery toggle and rail-block visualization shortcuts. Use this if another mod removes or replaces their unlock technologies. It does not remove other research requirements.
ick-tags=Choose whether you want tags, icons or nothing in front of the names of shortcuts added by this mod.\n\nIn the settings menu the tags will always be visible.

ick-prepare-uninstall=[img=utility/danger_icon] Before removing the mod or disabling its equipment toggles, restore disabled equipment to its normal form. Only armor currently worn by all players is processed: equip the armor containing the affected equipment first.\n\nuninstall — restore all three types;\nactive-defense-equipment — restore __1__;\nbelt-immunity-equipment — restore __2__;\nnight-vision-equipment — restore __3__.\n\nEnter the command and apply the setting in a loaded game, then save. Only then change startup settings or remove the mod. Any remaining disabled equipment will disappear when its prototypes are removed.


