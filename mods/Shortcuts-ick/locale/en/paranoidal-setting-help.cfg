[mod-setting-description]
active-defense-equipment=[item=personal-laser-defense-equipment] Adds a toggle for personal laser defense in the armor grid: use it to disable installed modules or enable them again. This setting adds the shortcut; it does not disable equipment automatically.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
belt-immunity-equipment=[item=belt-immunity-equipment] Adds a toggle for installed belt-immunity equipment: use it to disable the equipment or enable it again. This setting adds the shortcut; it does not disable equipment automatically.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
big-zoom=[img=utility/search] Adds the “Zoom out” shortcut button; using it applies the zoom value from your per-player zoom-limit setting. The global “Enable Zoom out of world” setting must be enabled for the button to work.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
disable-flare=[img=utility/danger_icon] Enables the emergency locator beacon: using it posts the player’s name and GPS coordinates in their force’s chat. When this setting is off, using the beacon displays a message that the feature is disabled.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
disable-zoom=[img=utility/search] Allows the “Zoom out” shortcut to apply the value from your per-player zoom-limit setting. If this setting is off, using the shortcut displays a disabled message.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
draw-grid=[img=utility/equipment_grid] Adds a “Grid” button: the first press displays a square grid, and the next removes it. Separate grid settings control its center and line properties.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
driver-is-gunner=[item=submachine-gun] Adds a “driver is gunner” toggle for the car or Spidertron you are driving. It changes the mode for that vehicle only, not for all vehicles.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
environment-killer-cliff=[entity=cliff] Includes cliffs in the environment deconstruction planner. The checkbox removes nothing by itself: use the shortcut to get the planner, then select an area for construction robots. Turning it off excludes this category from the filter.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
environment-killer-fish=[item=raw-fish] Includes fish in the environment deconstruction planner. The checkbox removes nothing by itself: use the shortcut to get the planner, then select an area for construction robots. Turning it off excludes this category from the filter.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
environment-killer-item=[img=utility/item_editor_icon] Includes items on the ground in the environment deconstruction planner. The checkbox removes nothing by itself: use the shortcut to get the planner, then select an area for construction robots. Turning it off excludes this category from the filter.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
environment-killer-rocks=[entity=big-rock] Includes natural rocks in the environment deconstruction planner. The checkbox removes nothing by itself: use the shortcut to get the planner, then select an area for construction robots. Turning it off excludes this category from the filter.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
environment-killer-trees=[entity=tree-01] Includes trees in the environment deconstruction planner. The checkbox removes nothing by itself: use the shortcut to get the planner, then select an area for construction robots. Turning it off excludes this category from the filter.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
flashlight-toggle=[item=small-lamp] Adds a character flashlight toggle: use it to turn the flashlight off or on. The player must have a character for it to work.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
grid-chunk-align=[img=utility/equipment_grid] Chooses the center when the grid is drawn: grid alignment snaps it to the primary-grid spacing, while player alignment uses your current position. The choice is applied when the grid is created.\n[color=#9cdcfe]Default: Map center. Personal setting.[/color]
grid-chunk-line-width=[img=utility/equipment_grid] Sets primary-grid line width in map pixels (32 pixels per tile). A value of 0 hides these lines, leaving secondary thin lines if enabled.\n[color=#9cdcfe]Default: 5. Range: 0–32. Personal setting.[/color]
grid-chunk-size=[img=utility/equipment_grid] Sets the spacing in tiles between primary grid lines; the same spacing is used to align the grid center. The minimum is 1 tile.\n[color=#9cdcfe]Default: 32. Range: at least 1. Personal setting.[/color]
grid-ground=[img=utility/equipment_grid] Chooses whether grid lines are drawn on the ground beneath buildings or above objects. This only affects display and is applied when the grid is created.\n[color=#9cdcfe]Default: On the ground. Personal setting.[/color]
grid-line-width=[img=utility/equipment_grid] Sets thin secondary-grid line width in map pixels (32 pixels per tile). A value of 0 hides these lines without changing their spacing.\n[color=#9cdcfe]Default: 0.25. Range: 0–32. Personal setting.[/color]
grid-radius=[img=utility/equipment_grid] Sets how far the grid extends from its center in each direction, in map tiles. The center is the player or, if selected, the chunk center.\n[color=#9cdcfe]Default: 128. Range: at least 1. Personal setting.[/color]
grid-step=[img=utility/equipment_grid] Sets the spacing between secondary grid lines in map tiles. A larger value draws them less often.\n[color=#9cdcfe]Default: 1. Range: at least 1. Personal setting.[/color]
minimap=[img=utility/map] Enable this to add a minimap toggle button. Pressing it shows or hides the minimap; this setting does not set its initial state.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
night-vision-equipment=[item=night-vision-equipment] Enable this to add a button for toggling night-vision equipment in worn armor. The button disables or re-enables installed equipment; it does not grant any.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
player-trash-not-requested=[img=utility/trash] Enable this to add a button for toggling the personal logistics Trash unrequested option. When on, items without matching personal requests are marked as trash.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
rail-block-visualization-toggle=[item=rail-signal] Enable this to add a button for showing rail blocks. It toggles their on-screen visualization; the button becomes available after Railway is researched.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
signal-flare=[img=utility/danger_icon] Enable this to add an emergency beacon button. Pressing it sends your force a message with the player’s name and GPS coordinates; the beacon must also be enabled by its runtime-global setting.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
targeting-with-gunner=[item=spidertron] Enable this to add a Spidertron button for the automatic-targeting-with-gunner mode. It toggles that targeting option; this setting does not enable targeting by itself.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
targeting-without-gunner=[item=spidertron] Enable this to add a Spidertron button for the automatic-targeting-without-gunner mode. It toggles that targeting option; it is a separate button, not mutually exclusive with the with-gunner mode.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
toggle-personal-logistic-requests=[item=logistic-robot] Enable this to add a button for toggling personal logistic requests. Pressing it enables or disables those requests; this setting adds the button rather than enabling logistics itself.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
train-mode-toggle=[item=locomotive] Enable this to add a button for toggling a train’s manual mode. It switches the current train between manual control and following its schedule.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
tree-killer=[item=deconstruction-planner] Enable this to add a button that puts the environment deconstruction planner in the cursor if it can be cleared. Its filters use the targets selected in per-player settings, such as trees, rocks, cliffs, fish, or items on the ground; use the planner on the map to mark them for deconstruction.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
vehicle-logistic-requests=[item=logistic-robot] Enable this to add a vehicle button for toggling its logistic requests. The button enables or disables that vehicle’s requester point without changing the requests themselves.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
vehicle-logistics-while-moving=[item=logistic-robot] Enable this to add a vehicle button for allowing logistics while moving. It toggles the vehicle’s corresponding option; this setting adds the button but does not enable the mode itself.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
vehicle-trash-not-requested=[img=utility/trash] Enable this to add a vehicle button for toggling the Trash unrequested option. When on, items in the vehicle without matching requests are marked as trash.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
zoom-level=[img=utility/search] Sets the zoom factor used when the zoom-out button changes the player’s view; it is not a distance in tiles. A smaller factor zooms farther out; the runtime-global zoom option must also permit the action.\n[color=#9cdcfe]Default: 0.2. Range: 0.032–20. Personal setting.[/color]
