[mod-setting-description]
active-defense-equipment=[item=personal-laser-defense-equipment] Добавляет переключатель для персональной лазерной защиты в сетке брони: нажатие выключает установленные модули или включает их обратно. Настройка добавляет кнопку, а не отключает оборудование автоматически.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
belt-immunity-equipment=[item=belt-immunity-equipment] Добавляет переключатель для установленного оборудования иммунитета к конвейерам: нажатие выключает его или включает обратно. Настройка добавляет кнопку, а не отключает оборудование автоматически.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
big-zoom=[img=utility/search] Добавляет кнопку «Уменьшить масштаб»: при нажатии применяется значение масштаба из личной настройки предела. Для работы кнопки глобальная настройка «Включить Уменьшить масштаб» должна быть включена.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
disable-flare=[img=utility/danger_icon] Включает аварийный маяк: при нажатии он отправляет в чат вашей команды имя игрока и GPS-координаты. Если выключить настройку, вместо сигнала появится сообщение, что функция отключена.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
disable-zoom=[img=utility/search] Разрешает кнопке «Уменьшить масштаб» применять значение из личной настройки предела масштаба. Если настройка выключена, нажатие кнопки сообщает, что функция недоступна.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
draw-grid=[img=utility/equipment_grid] Добавляет кнопку «Сетка»: первое нажатие показывает квадратную сетку, повторное убирает её. Центр и параметры линий задаются отдельными настройками сетки.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
driver-is-gunner=[item=submachine-gun] Добавляет переключатель режима «водитель — стрелок» для управляемого автомобиля или паукотрон. Он меняет этот режим только у текущего транспорта, а не у всех машин.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
environment-killer-cliff=[entity=cliff] Добавляет утёсы в цели плана сноса окружающей среды. Сам флажок ничего не удаляет: вызовите планировщик кнопкой, затем выделите область для разборки строительными роботами. Выключение исключает эту категорию из фильтра.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
environment-killer-fish=[item=raw-fish] Добавляет рыбу в цели плана сноса окружающей среды. Сам флажок ничего не удаляет: вызовите планировщик кнопкой, затем выделите область для разборки строительными роботами. Выключение исключает эту категорию из фильтра.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
environment-killer-item=[img=utility/item_editor_icon] Добавляет предметы на земле в цели плана сноса окружающей среды. Сам флажок ничего не удаляет: вызовите планировщик кнопкой, затем выделите область для разборки строительными роботами. Выключение исключает эту категорию из фильтра.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
environment-killer-rocks=[entity=big-rock] Добавляет природные камни в цели плана сноса окружающей среды. Сам флажок ничего не удаляет: вызовите планировщик кнопкой, затем выделите область для разборки строительными роботами. Выключение исключает эту категорию из фильтра.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
environment-killer-trees=[entity=tree-01] Добавляет деревья в цели плана сноса окружающей среды. Сам флажок ничего не удаляет: вызовите планировщик кнопкой, затем выделите область для разборки строительными роботами. Выключение исключает эту категорию из фильтра.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
flashlight-toggle=[item=small-lamp] Добавляет переключатель фонаря персонажа: нажатие выключает или включает фонарь. Для действия у игрока должен быть персонаж.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
grid-chunk-align=[img=utility/equipment_grid] Выбирает центр при показе сетки: привязка к основной сетке выравнивает его по её шагу, привязка к игроку использует текущую позицию игрока. Выбор применяется при создании рисунка сетки.\n[color=#9cdcfe]По умолчанию: Центр карты. Только для вас.[/color]
grid-chunk-line-width=[img=utility/equipment_grid] Задаёт толщину основных линий сетки в пикселях карты (32 пикселя на клетку). 0 скрывает эти линии, оставляя дополнительные тонкие линии, если они включены.\n[color=#9cdcfe]По умолчанию: 5. Диапазон: 0–32. Только для вас.[/color]
grid-chunk-size=[img=utility/equipment_grid] Задаёт расстояние в клетках между основными линиями сетки; этот же шаг используется для привязки центра к сетке. Минимальное значение — 1 клетка.\n[color=#9cdcfe]По умолчанию: 32. Диапазон: от 1. Только для вас.[/color]
grid-ground=[img=utility/equipment_grid] Выбирает, где показывать линии сетки: на земле под постройками или поверх объектов. Это только отображение; выбор применяется при создании рисунка сетки.\n[color=#9cdcfe]По умолчанию: На земле. Только для вас.[/color]
grid-line-width=[img=utility/equipment_grid] Задаёт толщину тонких линий дополнительной сетки в пикселях карты (32 пикселя на клетку). 0 скрывает эти линии, не меняя расстояние между ними.\n[color=#9cdcfe]По умолчанию: 0,25. Диапазон: 0–32. Только для вас.[/color]
grid-radius=[img=utility/equipment_grid] Задаёт, насколько далеко от центра сетка простирается в каждом направлении, в клетках карты. Центром служит игрок или, при соответствующем выборе, центр чанка.\n[color=#9cdcfe]По умолчанию: 128. Диапазон: от 1. Только для вас.[/color]
grid-step=[img=utility/equipment_grid] Задаёт интервал между линиями дополнительной сетки в клетках карты. Большее значение рисует линии реже.\n[color=#9cdcfe]По умолчанию: 1. Диапазон: от 1. Только для вас.[/color]
minimap=[img=utility/map] Отметьте, чтобы добавить кнопку переключения миникарты. Нажатие кнопки показывает или скрывает миникарту; сама настройка не задаёт её исходное состояние.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
night-vision-equipment=[item=night-vision-equipment] Отметьте, чтобы добавить кнопку переключения приборов ночного видения в надетой броне. Кнопка отключает или снова включает установленное оборудование, но не выдаёт его.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
player-trash-not-requested=[img=utility/trash] Отметьте, чтобы добавить кнопку переключения параметра «Незапрошенное — в мусор» для личной логистики. Когда он включён, предметы, не соответствующие личным запросам, помечаются как мусор.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
rail-block-visualization-toggle=[item=rail-signal] Отметьте, чтобы добавить кнопку отображения блоков железной дороги. Она переключает визуализацию на экране; кнопка становится доступна после исследования железной дороги.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
signal-flare=[img=utility/danger_icon] Отметьте, чтобы добавить кнопку экстренного маяка. При нажатии она отправляет вашей команде сообщение с именем игрока и его координатами GPS; для этого маяк должен быть разрешён глобальной настройкой.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
targeting-with-gunner=[item=spidertron] Добавляет кнопку, разрешающую или запрещающую Паукотрону автоматически выбирать цели для оружия, когда в нём есть стрелок. Кнопка не переключает режим для противоположного случая.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
targeting-without-gunner=[item=spidertron] Добавляет кнопку, разрешающую или запрещающую Паукотрону автоматически выбирать цели для оружия, когда стрелка в нём нет. Кнопка не переключает режим для противоположного случая.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
toggle-personal-logistic-requests=[item=logistic-robot] Отметьте, чтобы добавить кнопку переключения личных логистических запросов. Нажатие включает или отключает выполнение этих запросов; сама настройка добавляет кнопку, а не включает логистику.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
train-mode-toggle=[item=locomotive] Отметьте, чтобы добавить кнопку переключения ручного режима поезда. Она переключает весь текущий поезд между ручным управлением и движением по расписанию.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
tree-killer=[item=deconstruction-planner] Добавляет кнопку выдачи плана сноса окружения. План попадёт на курсор, если находящийся там предмет можно убрать. В личных настройках выберите цели — деревья, камни, утёсы, рыбу или предметы на земле; затем выделите планом область, чтобы отметить их для разборки.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
vehicle-logistic-requests=[item=logistic-robot] Отметьте, чтобы добавить в транспорт кнопку переключения его логистических запросов. Кнопка разрешает или приостанавливает выполнение запросов этого транспорта, не меняя их список.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
vehicle-logistics-while-moving=[item=logistic-robot] Отметьте, чтобы добавить в транспорт кнопку разрешения логистики во время движения. Она переключает соответствующий параметр транспорта; сама настройка лишь добавляет кнопку, а не включает этот режим.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
vehicle-trash-not-requested=[img=utility/trash] Отметьте, чтобы добавить в транспорт кнопку переключения параметра «Незапрошенное — в мусор». Когда он включён, предметы в транспорте, не соответствующие его запросам, помечаются как мусор.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
zoom-level=[img=utility/search] Задаёт коэффициент масштаба, до которого кнопка отдаления переводит вид игрока; это не расстояние в клетках. Чем меньше коэффициент, тем дальше отдалён вид; для применения также должна быть разрешена глобальная настройка масштабирования.\n[color=#9cdcfe]По умолчанию: 0,2. Диапазон: 0,032–20. Только для вас.[/color]
