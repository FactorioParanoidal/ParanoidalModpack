[tips-and-tricks-item-description]
fmf-auto-join=Sąsiadujące [entity=duct-small] zostaną automatycznie połączone w [entity=duct].\nSąsiadujące [entity=duct] zostaną automatycznie połączone w [entity=duct-long].\nFunkcję tę można wyłączyć w ustawieniach modów — w takim przypadku dostępne będą formuły na [entity=duct] i [entity=duct-long].
fmf-endpoints=Ze względu na swój rozmiar, zwykłe rury nie mogą łączyć się bezpośrednio z kanałami. Płyny muszą wpływać do sieci kanałów przez [entity=duct-intake] i wypływać przez [entity=duct-exhaust]. Do każdego punktu początkowego/końcowego można podłączyć do sześciu rur, co pozwala na uzyskanie wysokiej przepustowości.
fmf-introduction=Kanały umożliwiają transport ogromnych ilości płynów na duże odległości.
fmf-non-return-duct=Obiekt [entity=non-return-duct] pozwala na wymuszenie przepływu płynu w jednym kierunku. Powszechne przypadki użycia to: konieczność odizolowania obszaru produkcyjnego, nadanie priorytetu niektórym gałęziom produkcji lub utrzymanie ciśnienia na dużych odległościach.

