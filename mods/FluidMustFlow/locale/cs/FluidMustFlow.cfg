[tips-and-tricks-item-description]
fmf-auto-join=Propojené [entity=duct-small] se automaticky spojí do [entity=duct].\nPropojené [entita=duct]s se automaticky spojí do [entity =duct-long]s.\nTato funkce může být zakázána v nastavení módu, v takovém případě budou k dispozici recepty na [entity=duct] a [entity=duct-long].
fmf-endpoints=Díky velké velikosti se wolframového potrubí nemůže přímo spojit s běžným normálním potrubí. Kapaliny musí vstoupit do wolframového potrubí přes [entity=duct-intake] a následně opustit přes [entity=duct-exhaust]. Ke koncovému bodu lze připojit až šest trubek.
fmf-introduction=Wolframové potrubí dokáže přepravit velké množství kapalin na dlouhé vzdálenosti.
fmf-non-return-duct=[entity=non-return-duct] povolí průtok kapalin pouze jedním směrem. Lze využít pro oddělení rozvodů kapalin, upřednostnění určité výroby nebo pro zvýšení tlaku v potrubí na velké vzdálenosti.

