[mod-setting-description]
show-max-underground-distance-icon=[item=underground-belt] Выбирает вид метки максимальной дальности соединения подземного конвейера или трубы: толстая, тонкая либо маленькая. Меняется только рисунок подсказки на карте, не дальность соединения.\n[color=#9cdcfe]По умолчанию: Толстая. После перезапуска игры.[/color]
