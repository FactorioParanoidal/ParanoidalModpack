[tips-and-tricks-item-description]
zzz-defects=[font=default-bold]Defects[/font] are five quality grades [font=default-bold]below normal[/font]. Early in the game almost every new building or product comes out defective until you research "Quality control".\n\n[font=default-bold]Grades[/font] (the animation shows identical assembling machines of each grade making gears):\n[img=quality/ic-defect-5] −5 Defective — 33% of the useful stats, machine energy ×3\n[img=quality/ic-defect-4] −4 Flawed — 47%, energy ×2.14\n[img=quality/ic-defect-3] −3 Poor — 60%, energy ×1.67\n[img=quality/ic-defect-2] −2 Unsatisfactory — 73%, energy ×1.36\n[img=quality/ic-defect-1] −1 Substandard — 87%, energy ×1.15\n[img=quality/normal] 0 Normal — 100%, energy ×1\nThe number of black dots on the icon is the size of the penalty.\n\n[font=default-bold]What a defect makes worse[/font]: health, speed of machines, furnaces and inserters, lab speed, inventory size, accumulator and fluid wagon capacity, robot energy, durability of tools and repair packs, pole coverage and wire reach, drills. Defective machines also use more energy. Belt speed and underground belt length are [font=default-bold]not[/font] reduced.\n\n[font=default-bold]Key points[/font]:\n• Only [font=default-bold]finished products[/font] of the red-science era get defects. Materials never do.\n• "Quality control 1–10" research reduces defects. At level 10 no new defects appear, and only then can green science be researched.\n• Existing defects do not go away by themselves — the [font=default-bold]refinement workshop[/font] fixes them.\n\nNext sections: where defects come from, research, defective ingredients, defective buildings, the workshop and its modes, production modes, the control post, the panel and signals.
zzz-defects-origin=[font=default-bold]What gets defects[/font]\n• [font=default-bold]Finished products[/font]: buildings, armor, capsules, repair packs, lab science packs.\n• [font=default-bold]Never defective[/font]: materials (raw resources, ore, plates, parts, intermediates, pipes, tiles, rails); belts, underground belts, splitters and loaders; weapons, ammo and turrets; modules; armor and vehicle equipment; vehicles; roboports; combinators, rail signals and stops; valves, beacons, heat pipes, reactors, wind turbines.\n• [font=default-bold]Everything that can only be made after green science[/font] has no defects: defects exist only in the red-science era.\n\n[font=default-bold]When a defect is rolled[/font]\n• [font=default-bold]Handcrafting[/font] — every new finished item gets its own grade. Intermediates that the game queued by itself (for example the furnace for a drill) are not rolled: they go straight into the next craft. Cancelling such a craft does not avoid the roll — returned items are rolled too.\n• [font=default-bold]Machines[/font] — the grade is decided shortly before each operation ends.\n• The grade is random, by the distribution of the current control level. At level 0: −5 — 90%, −4 — 9%, −3 — 0.9%, −2 — 0.09%, −1 — 0.009%, normal — 0.0009%. The animation shows a machine making iron chests at level 0.\n\n[font=default-bold]Production losses[/font]\nSeparately from defects, an operation can end without any result. Chance = initial percent from the map settings × (10 − control level) / 10. The default initial percent is 0%: losses are off. If enabled, they apply to handcrafting, machines, drills and mining; a separate map setting protects finished products while crafting.
zzz-defects-research=[img=technology/ic-defect-control-1] [font=default-bold]"Quality control 1–10"[/font] costs 10, 20, … 100 red packs (550 in total) and needs no other research.\n\n• [font=default-bold]Every two levels[/font] remove the worst possible grade: after level 2 there is no more −5, after level 4 no more −4, and so on. Odd levels shift the distribution halfway.\n• Level 8: −1 — 90.9%, normal — 9.1%. Level 9: −1 — 45.5%, normal — 54.5%.\n• [font=default-bold]Level 10[/font]: no new defects and no losses.\n• "Quality control 10" is required for the [font=default-bold]logistic (green) science pack[/font] and for quality modules: green science cannot be researched until defects are beaten.\n• Research [font=default-bold]does not fix[/font] items that are already defective — the refinement workshop does.\n• The chain barely moves enemy evolution: all 10 levels together count as one ordinary technology (plus the packs).\n\n[font=default-bold]Tip[/font]: research quality control as early as possible — every level immediately makes new buildings better.\n\nThe animation shows the grade distribution of a new product at every level from 0 to 10.
zzz-defects-ingredients=[font=default-bold]A recipe takes ingredients of one quality only.[/font] All item ingredients of one craft must be of the same grade: a −3 pole and a normal lamp cannot go into one recipe (right side of the animation). The recipe quality is chosen in the machine window next to the recipe.\n\n[font=default-bold]The result is not better than the ingredients.[/font] Some recipes use only finished products (for example pole + lamp → lighted pole). From −3 ingredients the product is −3 at best: neither a new roll, nor the Flawless mode, nor quality modules, nor "Quality control 10" improve it, and the defect roll can make it worse. Only the refinement workshop fixes such a defect.\n\n[font=default-bold]Products without defects[/font] (belts, modules, everything after green science and others) come out normal even from defective ingredients.\n\n[font=default-bold]Trap[/font]: products without defects are always normal, so a recipe that mixes them with defect-capable finished products accepts only normal ones. Defective ones must be refined in the workshop first.\n\n[font=default-bold]Materials[/font] (plates, gears, circuits, pipes etc.) are never defective, so defects never block part recipes.
zzz-defects-buildings=What changes in defective buildings (grade multiplier: −5 — 33%, −1 — 87%):\n• [font=default-bold]Assembling machines and furnaces[/font] work slower and use more energy (−5: speed 33%, energy ×3).\n• [font=default-bold]Inserters[/font] are slower; [font=default-bold]chests and inventories[/font] are smaller; [font=default-bold]labs[/font] research slower; [font=default-bold]accumulators and fluid wagons[/font] hold less. Every defective building has less health.\n• [font=default-bold]Poles[/font] (in the animation): at −5 the supply area side is 1 tile smaller (radius −0.5), wires reach 1 tile less; −4…−1 get a share of the penalty.\n• [font=default-bold]Drills and pumpjacks[/font] are slower, pollute more and deplete the patch faster: −1 — 200% of the normal drain, −2 — 300%, −3 — 400%, −4 — 500%, −5 — 600%. This does not depend on the control level. The real drain is in the drill tooltip, line "Resource drain (by quality)".\n• [font=default-bold]Belts[/font] are not slowed; belts, underground belts and splitters never get defects.\n\nDefective buildings are perfectly usable — just worse. Replace them with normal ones as you refine.
zzz-defects-workshop=[item=ic-refine-workshop] The [font=default-bold]refinement workshop[/font] improves defective products. Recipe: burner assembling machine + 10 repair packs + 5 basic circuit boards; unlocked by "Burner mechanics". Size 3×3, needs electricity.\n\n[font=default-bold]How to use it[/font]\n• Put the product into the product slot and repair packs into the pack slots (inserters sort them by themselves). No recipe needs to be chosen.\n• The workshop drains the [font=default-bold]durability of the packs[/font] gradually, like a lab drains science. Pack II gives twice the resource, a defective pack less.\n• Without packs or electricity the attempt waits and continues from the same point.\n• It does not accept armor with equipment slots, vehicles and items with their own inventory.\n\n[font=default-bold]An attempt[/font] — one per item; after it the item always leaves:\n• 90% — one grade better, plus 10% for every further grade;\n• 10% — unchanged. The item never gets worse and is never lost.\nExample for −5: −4 — 81%, −3 — 8.1%, unchanged — 10%. The workshop never goes above normal. For another attempt feed the item again (in the animation — around the loop).\n\n[font=default-bold]Attempt cost[/font] does not depend on the grade, only on the product: 2.5 basic packs × S × H, 4 s per pack. S by the number of science pack kinds of the earliest research of the product (0–1 → 0.2; 2 → 1; 3–4 → 3; 5–6 → 8; 7+ → 20); H = √(health / 300) within 0.5…3. Examples: inserter — 0.33 packs, assembling machine I — 0.5. The exact cost is in the quality-control panel → "Check an item".\n\n[font=default-bold]Normal and positive quality[/font]: a normal item passes at once and for free; a positive one passes unchanged, and with "Reset positive quality to standard" it becomes normal without packs.
zzz-defects-workshop-modes=The refinement mode is chosen in the "Refinement" panel to the right of the workshop window. An attempt uses [font=default-bold]the same packs[/font] and the same power — only time and result change:\n• [font=default-bold]I. Normal[/font] — time ×1, 90% one grade up (sometimes more), 10% unchanged.\n• [font=default-bold]II. Precise[/font] — time ×5, always +2 grades.\n• [font=default-bold]III. Flawless[/font] — time ×20, always straight to normal.\n\n[font=default-bold]Which one[/font] (in the animation every workshop refines −5 to normal):\n• Normal — 5.1 attempts on average: fastest in time, but the most packs.\n• Precise — exactly 3 attempts (−5 → −3 → −1 → 0): fewer packs, three times the time.\n• Flawless — 1 attempt: [font=default-bold]the fewest packs[/font], but the longest.\nShort of packs — Flawless; short of workshops and time — Normal.\n\nA new mode applies from the next attempt. The mode is copied with the workshop settings (Shift+RMB / Shift+LMB, blueprints).
zzz-defects-production-modes=Assembling machines and furnaces that make items get a [font=default-bold]"Production mode"[/font] panel to the right of the machine window:\n• [font=default-bold]I. Normal[/font] — no changes.\n• [font=default-bold]II. Precise[/font] — operation 5 times longer, average power ×5 (energy per operation ×25). Defects as with 4 more control levels, losses 10 times rarer, quality modules as 3 rolls.\n• [font=default-bold]III. Flawless[/font] — operation 20 times longer, power ×20 (energy per operation ×400). New products without defects (from defective ingredients — their grade), no losses, quality modules as 10 rolls.\n\nIn the animation three machines work at control level 0: Normal gives almost only −5, Precise mostly −3, Flawless only normal.\n\n[font=default-bold]When it helps[/font]: important early buildings (labs, drills, assembling machines) can be made in Flawless mode — slowly, but normal right away. Cheap mass products are better made fast and refined in the workshop.\n\n• Extra power comes from the network; burner machines burn more fuel. A power shortage slows the operation.\n• A new mode applies from the next operation. The mode is shown in alt mode and copied by blueprints.\n• There are no modes for the rocket silo, drills, labs, the workshop, the post and machines that make only fluids.
zzz-defects-post=[item=ic-control-post] The [font=default-bold]control post[/font] accepts a batch by order and sorts products into three outputs by itself. Recipe: burner assembling machine + 3 inserters + 5 basic circuit boards ("Burner mechanics"). No electricity needed.\n\n[font=default-bold]Order[/font] (post window): product; requirement "strictly normal" or "at least" a chosen quality; amount; "repeat" checkbox. Buttons: start, pause, cancel.\n\n[font=default-bold]Outputs[/font]:\n• [color=0.5,1,0.5]forward[/color] — good products of the order (counted);\n• [color=1,0.85,0.3]left[/color] — to refinement: defects, and with "strictly normal" also positive quality;\n• [color=0.8,0.8,0.8]right[/color] — other: other items and the surplus above the order.\nThe post puts products onto a belt, into a chest or a building in front of the output. Output arrows rotate with the rotate key while hovering the post — the building itself does not turn.\n\n[font=default-bold]Typical layout[/font] (in the animation): production → post → left to the workshop → back to the post input. Defects go around the loop until they are normal, good products collect in front.\n\nThe workshop and the post send circuit signals and accept commands ("Circuit network signals and commands" checkbox in their windows).
zzz-defects-panel=The panel opens with the shortcut bar button or __CONTROL__ic-quality-panel__.\n\n• [font=default-bold]Production[/font] — control level, defect distribution now and after the next level, loss chance (if losses are enabled), operation counters, machines that are not handled and why. [font=default-bold]"Check an item"[/font] — whether an item can be defective and what its refinement costs.\n• [font=default-bold]Refinement[/font] — all workshops with state and pack stock (button shows the workshop on the map), attempt statistics, cost forecast for a chosen item and grade, notifications.\n• [font=default-bold]Batch control[/font] — all posts with order and progress.\n\n[font=default-bold]Signals[/font]: workshop — working, progress, grade, pack resource, no packs, no item, output full; post — running, required, accepted, remaining, waiting for refinement, order done, batches. [font=default-bold]Commands[/font] by wire: "Start" (post), "Pause", "Stop".\n\nEvery player can switch notifications off: workshop waits for packs longer than 5 seconds; batch done.\n\nAfter "Quality control 10" the panel and windows stop talking about defects and losses — only what is needed to refine old defects stays.
zzz-quality=[font=default-bold]Quality[/font] is the grades [font=default-bold]above normal[/font]. There are more than forty of them, up to the last one, "extreme". All grades are unlocked from the start.\n\n[font=default-bold]What quality gives[/font]: every building has more health, and every type has its own bonus — machine and inserter speed, inventory size, pole coverage and wire reach, capacity, range and more. The higher the grade, the bigger the bonus. Exact values are in the item tooltip or in Factoriopedia when hovering the [img=quality_info] icon. The animation shows a small pole and an assembling machine II of the first three grades.\n\n[font=default-bold]Where quality comes from[/font]:\n• [font=default-bold]quality modules[/font] in machines — the main source;\n• [font=default-bold]ingredient quality[/font]: a recipe of a chosen quality makes a result of the same quality, and modules can raise it further;\n• [font=default-bold]recycling[/font] with quality modules.\n\n[font=default-bold]When[/font]: quality modules unlock after "Quality control 10" and the logistic (green) science pack. Before that everything new is normal or defective.\n\n[font=default-bold]Quality for all production[/font] (startup setting, on): quality modules work in every assembling machine, furnace and drill with module slots, and raw resources, ore, parts and intermediates can get quality too. They still never get defects.
zzz-quality-modules=[item=quality-module] [item=quality-module-2] [item=quality-module-3] [item=bob-quality-module-4] [item=bob-quality-module-5] [font=default-bold]Quality modules 1–5[/font] give "Quality: +1…+5%", each slows the machine down by 20%.\n\n• They fit any machine with module slots: assembling machines II and higher, furnaces and drills with slots, recyclers 2–4.\n• The effects of all modules in a machine add up. Without modules no positive quality appears.\n• Modules slow the machine down, so quality pays off best for expensive products, where every lucky craft is worth a lot.\n\n[font=default-bold]How the chance works[/font]: the effect in the module tooltip is not the chance yet. Upgrade chance per craft = effect × 10 × the [font=default-bold]upgrade chance[/font] of the ingredient quality. Normal has 0.204, so a "+1%" module gives 2.04%, and two "+3%" modules (in the animation) give 12.24%.\n\nThe module tooltip itself shows the ready chances for every grade: lines "Normal→…: …".\n\nIn the animation the engine itself makes the gears: on the right — how many gears of each grade really came out and how many were expected.
zzz-quality-ladder=Every quality has an [font=default-bold]upgrade chance[/font] — how easy it is to rise from it to the next grade:\n• Normal — 0.204; the first positive grade — 0.200; the next — 0.196; then every grade 0.004 less.\n• So [font=default-bold]the first upgrade is the easiest[/font], and every next one is a bit harder.\n\n[font=default-bold]How the roll goes[/font]:\n1. With the chance "effect × 10 × upgrade chance of the ingredients" the result rises one grade.\n2. Then the game rolls again with the upgrade chance of the grade reached (about 20%), and so on. So sometimes the result jumps 2–3 grades at once.\n\nThe table in the animation: for every ingredient grade — the upgrade chance and the probability that the result stays or rises by 1, 2, 3 or more grades. Module sets change: 1 × module 1, 4 × module 1, 4 × module 3, 4 × module 5.\n\n[font=default-bold]Example[/font]: 4 × module 3 (effect +12%), normal ingredients: upgrade 24.5%; about 4 of 5 upgrades are one grade, about 1 of 5 two or more.
zzz-quality-ingredients=[font=default-bold]A recipe of a chosen quality[/font]: the quality is chosen in the machine window next to the recipe. The machine takes ingredients of that quality only and makes a result of the same quality (in the animation: normal, first and second grade plates → gears of the same quality). Quality modules can raise the result further — the roll starts from the ingredient quality.\n\n• All item ingredients of one craft must be of [font=default-bold]one quality[/font]. Fluids have no quality.\n• Quality carries through the chain: good plates make good gears, good gears make good products. Modules at every step can raise it further.\n• A quality item does not fit a normal-quality recipe. Unwanted positive quality can be reset in the refinement workshop ("Reset positive quality to standard") or recycled.\n\nA product from defective ingredients is not better than their grade — see "Defective ingredients".
zzz-quality-recycling=[item=recycler-1] [item=recycler-2] [item=recycler-3] [item=recycler] [font=default-bold]Recyclers 1–4[/font] take a product apart and return [font=default-bold]25%[/font] of its item ingredients on average (fluids are not returned). Raw resources, alloys and chemistry products recycle into themselves, also with 25%.\n\n• The result is [font=default-bold]not worse than the quality[/font] of the product, and quality modules in the recycler can raise it. Module slots: Recycler 1 — none, 2 — two, 3 — three, 4 — four.\n• A [font=default-bold]defective[/font] product recycles into normal components — another way to get rid of defects, but an expensive one: 75% is lost.\n• [font=default-bold]Quality loop[/font]: product → recycler with modules → components → product again. Normal components go back into crafting, upgraded ones into a separate line. Every round loses 75% of the material but gives a new quality roll.\n\nIn the animation Recycler 4 with quality modules 3 takes normal iron chests apart: on the right — the iron plates received, by quality.
zzz-quality-modes=Production modes (panel to the right of the machine window, see "Defects and refinement" → "Production modes") also boost quality modules:\n• [font=default-bold]I. Normal[/font] — one roll.\n• [font=default-bold]II. Precise[/font] — as 3 independent rolls; operation 5 times longer, power ×5.\n• [font=default-bold]III. Flawless[/font] — as 10 rolls; operation 20 times longer, power ×20.\nUpgrade chance = 1 − (1 − p)^rolls, where p is the normal chance of the modules. For example with p = 10%: 10% → 27% → 65%.\n\n[font=default-bold]Important[/font] (in the animation): the chance per operation grows, but there are 5 and 20 times fewer operations, so there are [font=default-bold]fewer upgrades per minute[/font]. Modes pay off when ingredients are expensive, not time: the same ingredients give more quality products.\n\nWithout quality modules the modes give no positive quality.
zzz-quality-tools=• [font=default-bold]Quality module tooltip[/font]: "Quality: +X%" is the module effect; the lines below ("Normal→…: …") are the ready upgrade chance for ingredients of every grade.\n• [font=default-bold]Machine window[/font]: the production mode panel shows the module chance of this machine in all three modes.\n• [font=default-bold]Factoriopedia[/font] (__CONTROL__open-factoriopedia__): the [img=quality_info] icon in the tooltip — hover it to see the values for every quality.\n• [font=default-bold]Helmod[/font]: the gem button in the main window title opens "Quality Probability". Choose a module, its quality, the module amount, the bonus probability and the machine mode — the table shows for every ingredient grade the chance that the result stays or rises by 1, 2, 3 or more grades. The Helmod planner computes products by quality with the same rules.\n• The "Chances and the ladder" animation in this section shows the same on examples.

