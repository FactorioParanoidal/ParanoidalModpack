[paranoidal-victory]
message=[font=default-bold]Congratulations! You won: the rocket is in space.[/font]\n\nEngineer #7 of the Axiom-6 lived here for 6666 days and almost fixed the car. On the same planet, you built a rocket.\n\nBuy n Large does not recognise the victory: it does not service, insure or approve third-party rockets.\n\nYou can keep playing on this map as long as you like. What else to do:
bullet-1=Launch a mining shuttle: it brings back ore from the asteroids.
bullet-2=Build an orbital fabricator and a ground fabricator station.
bullet-3=Send a solar collector into orbit: the orbital power receiver gives a steady 1000 MW.
bullet-4=Research infinite technologies and unlock achievements.
final=Thank you for playing.\nThe Paranoidal team
