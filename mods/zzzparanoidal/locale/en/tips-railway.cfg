[tips-and-tricks-item-description]
zzz-railway=[font=default-bold]The railway in Paranoidal[/font] comes earlier and is stricter than in the base game. The scheme shows the progression: wooden rails → normal rails → better locomotives → electric and maglev locomotives; the numbers are the top speed in km/h.\n\n[font=default-bold]Main differences[/font]:\n• The first railway is [item=scrap-rail] __ITEM__scrap-rail__, already with red science ([technology=JunkTrain_tech] "Basic locomotives").\n• Normal [item=rail] __ITEM__rail__ need concrete and green science ([technology=railway] "Railway").\n• Wagons are smaller: [entity=cargo-wagon] __ENTITY__cargo-wagon__ — 20 slots, [entity=fluid-wagon] __ENTITY__fluid-wagon__ — 25,000.\n• Locomotives burn fuel with 20–45% efficiency: they use 2–5 times more fuel.\n• Train speed is the [font=default-bold]average[/font] top speed of its locomotives times the fuel bonus; wagons do not limit it.\n• Heavy cargo slows acceleration, and trains slow down in curves.\n• Quality matters: top-tier locomotives get up to ×5 power and ×2 speed, wagons up to ×8 slots.\n\nNext: wooden rails, signals, crossings, stations, rolling stock, fuel, heavy trains, multiple units, electric locomotives, elevated rails, control. Automatic deliveries are in the "Cybersyn train network" section.
zzz-railway-wood=[technology=JunkTrain_tech] "Basic locomotives" (20 red packs) unlocks [item=scrap-rail] __ITEM__scrap-rail__, [entity=yir_usl] __ENTITY__yir_usl__ and [entity=yir_us_cargo] __ENTITY__yir_us_cargo__. Then [technology=automated-scrap-rail-transportation] "Basic rail automation" gives a primitive train stop and signals, and [technology=scrap-fluid-handling] "Basic fluid wagons" gives the 5,000 [entity=yir_us_fluid] __ENTITY__yir_us_fluid__ and [entity=scrap-fluid-pump] __ENTITY__scrap-fluid-pump__.\n\n[font=default-bold]Wooden rails break at speed.[/font] While a train runs faster than 80 km/h, every wooden rail under it gathers 1 damage per km/h above 80 (checked every 20 ticks); the damage lands when the train leaves the rail. Straight rails have 50 health, curved ones 100. The [entity=yir_usl] MK0 runs at 54 km/h and does not hurt them, while a [entity=locomotive] __ENTITY__locomotive__ at full speed (259 km/h) breaks them in one pass. In the animation the MK0 runs on top and a fast locomotive below.\n\n• MK0 wagons are short and small: the cargo one has 10 slots.\n• Robots place primitive stops and signals only on wooden rails; on normal rails they are removed and the item is returned. By hand you can place them anywhere.\n• [font=default-bold]Moving to normal rails[/font] (after "Railway"): the recipe "2 wooden rails + 6 concrete → 2 rails", and the upgrade planner replaces laid wooden rails with normal ones and the primitive stop and signals with normal ones (their replacement recipes come with "Automated rail transportation").\n• Replace the rails first, then run fast locomotives.
zzz-railway-signals=A [entity=rail-signal] __ENTITY__rail-signal__ splits the track into [font=default-bold]blocks[/font]. A block holds one train only: the signal at the entry of an occupied block is [color=1,0.35,0.35]red[/color], and the next train waits in front of it. [color=0.45,1,0.45]Green[/color] — the block is free, [color=1,0.85,0.3]yellow[/color] — the block is already promised to an approaching train.\n\nIn the animation the front train unloads at a station and the following trains wait at red signals. The coloured strips under the track are the blocks: green is free, red is occupied.\n\n• Place signals on the [font=default-bold]right side[/font] of the direction of travel. A track with signals on one side only is one-way: a train will not pass a signal that faces away from it.\n• Two-way traffic needs signals on both sides, but two one-way tracks are simpler and faster.\n• Make blocks at least as long as your trains, otherwise a long train occupies two blocks.\n• Without signals the whole connected railway is one block: two trains on it wait for each other.\n• Primitive signals work the same way.
zzz-railway-chain=A [entity=rail-chain-signal] __ENTITY__rail-chain-signal__ lets a train pass only if the way [font=default-bold]behind the next block[/font] is free too — up to the next normal signal. Put it [font=default-bold]in front of a crossing or a junction[/font] and a normal signal right after it.\n\nIn the animation a horizontal train stands at a station right after the crossing. The next one waits at the chain signal before the crossing, and vertical trains pass freely. With a normal signal it would drive onto the crossing, stop there and block both roads.\n\n[font=default-bold]Rule[/font]: chain signals at the entry of a crossing and inside it, normal signals at the exit. The block after the exit must hold the whole train.\n\n• [color=0.45,1,0.45]Green[/color] — free up to the exit; [color=1,0.35,0.35]red[/color] — the exit is occupied; [color=0.4,0.65,1]blue[/color] — at a junction some exits are free and some are not: the train decides by its route.\n• The primitive chain signal works the same way.
zzz-railway-stations=A [entity=train-stop] __ENTITY__train-stop__ is placed on the right side of the rail in the direction of travel; a train stops with its leading locomotive at the stop.\n\nThe [font=default-bold]schedule[/font] is set in the train window: a list of stations and wait conditions ("Full cargo", "Empty cargo", "Time", "Inactivity", signals and more). A train follows its schedule in automatic mode.\n\nIn the animation a train with locomotives at both ends carries ore: inserters load the wagon at the left stop and unload it at the right one. Such a shuttle runs back and forth on one track without a turning loop.\n\n• [font=default-bold]Same names[/font]: several stops with one name are one destination; a train goes to the nearest available one.\n• The [font=default-bold]train limit[/font] in the stop window is how many trains may head to it at once. Others wait until a place frees up. With limits many stops of one name work without jams.\n• The circuit network can enable and disable a stop, set its limit and read the train cargo.\n• A locomotive facing backwards does not pull the train forward — in a shuttle the one facing the direction of travel pulls (see "Multiple unit locomotives").
zzz-railway-rolling-stock=The scheme shows each locomotive's [color=0.4,0.7,1]speed[/color] (km/h), [color=1,0.65,0.25]power[/color] (kW) and [color=0.6,0.9,0.35]efficiency[/color]; on the right — cargo wagon capacity (slots).\n\n• [entity=yir_usl] __ENTITY__yir_usl__ — 54 km/h, 200 kW, 20% efficiency.\n• [entity=locomotive] __ENTITY__locomotive__ — 259 km/h, 800 kW, 25%.\n• [entity=bob-locomotive-2] __ENTITY__bob-locomotive-2__ — 367 km/h, 1,100 kW, 30%; [entity=bob-locomotive-3] __ENTITY__bob-locomotive-3__ — 432 km/h, 1,350 kW, 35% ([technology=bob-railway-2] "Railway" 2 and 3).\n• [entity=bob-armoured-locomotive] Armoured locomotives 1–3 — 216, 324 and 346 km/h, 5,000–12,500 health and a big equipment grid, but heavier ([technology=bob-armoured-railway] "Armoured railway").\n• [entity=bet-locomotive] __ENTITY__bet-locomotive__ — 432 km/h, 1,000 kW, 40%, on batteries; [entity=hiend_loco] __ENTITY__hiend_loco__ — 432 km/h, 1,800 kW, 45%.\n\n[font=default-bold]Wagons[/font]: [entity=cargo-wagon] cargo — 20 slots (half of the base game), MK2 — 40, MK3 — 60; armoured — 40, 60 and 80; maglev — 60; MK0 — 10. Fluid wagons — 25,000, 37,500 and 50,000, MK0 — 5,000.\n\n• [entity=flamethrower-wagon] __ENTITY__flamethrower-wagon__ ([technology=flamethrower-wagon] "Flamethrower wagon") is a 5,000 fluid wagon with two flamethrower turrets that fire its fluid.\n• Bob's wagons have an equipment grid for shields, batteries and other vehicle equipment.\n• A slow locomotive slows down the whole train: the speed is the average of the locomotives.
zzz-railway-fuel=Locomotives of the build burn fuel with 20–45% efficiency (100% in the base game), so they use 2–5 times more coal. Better fuel pays off: more energy per slot, and it speeds the train up.\n\nThe scheme shows each fuel's [color=1,0.65,0.25]acceleration[/color] and [color=0.4,0.7,1]top speed[/color] multipliers:\n• [item=coal] coal, wood and other ordinary fuel — ×1 and ×1;\n• [item=solid-fuel] — ×1.1 and ×1.05; [item=angels-pellet-coke] — ×1.1 and ×1.2;\n• [item=rocket-fuel] — ×1.2 and ×1: faster acceleration, but [font=default-bold]no higher speed[/font];\n• [item=bob-enriched-fuel] — ×1.5 and ×1.1; [item=high-octane-enriched-fuel] — ×1.9 and ×1.3 — the best speed multiplier;\n• [item=nuclear-fuel] — ×2 and ×1.25; [item=clowns-turbonuclear-fuel] — ×2.5 and ×1.25;\n• electric locomotive batteries [item=bet-fuel-1-full] MK1–MK4 — acceleration ×1.5 / 2 / 2.5 / 3.5, speed ×1 / 1.5 / 2 / 3.\n\n• The multiplier comes from the fuel burning right now: keep one kind of fuel in a locomotive.\n• [technology=braking-force-1] "Braking force" shortens braking — trains can run closer.
zzz-railway-overload=Cargo makes a train heavier. Acceleration is multiplied by train weight / (train weight + cargo weight): a full cargo slot weighs 150, one unit of fluid 0.12. A full normal cargo wagon (20 slots = 3,000) weighs four times its empty weight (1,000). The scheme: a locomotive with an empty wagon accelerates at 100%, with a full one at 50%, with three full ones at 36%; on the right — the speed in a curve.\n\n• Acceleration never drops below 10% of the empty train. When cargo hits this minimum, a "Train overloaded" alert appears.\n• [font=default-bold]In curves[/font] a train runs at no more than half its top speed, in manual mode too.\n• The "Train load" panel is to the right of the train window; the [font=default-bold]/otsr[/font] command prints the same for the train under the cursor.\n• What helps: more locomotives, multiple units, fuel with an acceleration bonus, straight tracks without needless curves.
zzz-railway-mu=A locomotive facing backwards does not pull the train forward. [technology=multiple-unit-train-control] "Multiple unit train control" (after "Automated rail transportation") enables [font=default-bold]multiple units[/font]: two locomotives of the same type and quality, coupled back to back and facing opposite ways, pull together — the one facing the direction of travel gets ×2 power. The scheme: without a pair one pulls, with a pair both do.\n\n• [technology=adv-multiple-unit-train-control] "Wireless multiple unit train control" pairs locomotives anywhere in the train, also across wagons: locomotives at both ends make a shuttle that pulls at full power both ways.\n• Fuel and burnt fuel in a train with multiple units are balanced every 5 seconds.\n• In alt mode the locomotives show "MU +100%" or why there is no pair.\n• A locomotive is turned into a multiple unit only while the train stands still.
zzz-railway-electric=[technology=bet-tech] "Battery-electric railway" unlocks the [entity=bet-locomotive] __ENTITY__bet-locomotive__, the [entity=bet-charger-1] __ENTITY__bet-charger-1__ and the train battery pack. The electric locomotive burns no fuel: a [item=bet-fuel-1-full] charged pack goes into its fuel slot, and the discharged one drops into the burnt fuel slot.\n\nThe scheme shows the cycle: the charger turns a [item=bet-fuel-1-empty] discharged pack into a charged one using electricity → an inserter puts it into the locomotive at a station → the discharged pack goes back to charging.\n\n• Chargers 1, 2 and 3: speed 1, 5 and 25, power 2, 10 and 50 MW. Low-priority chargers take only spare power — handy with solar panels and accumulators.\n• Packs MK2–MK4 ([technology=bet-fuel-2] "Train battery pack") accelerate faster and reach higher speeds — see "Fuel and speed".\n• When the locomotive is picked up, the burning pack comes back discharged: the charge is lost.\n• [technology=hiend_train] "Maglev trains" (1000 packs of six kinds): the [entity=hiend_loco] __ENTITY__hiend_loco__, a maglev cargo wagon and fluid wagon, and charger 4 (speed 50, 100 MW).
zzz-railway-elevated=[technology=elevated-rail] "Elevated rail" comes earlier in this build: after "Railway", with red and green science. A [entity=rail-ramp] __ENTITY__rail-ramp__ lifts the track onto a viaduct, and [entity=rail-support] supports hold it. Viaducts pass over ground tracks, belts and buildings — junctions without crossings.\n\nThe scheme shows how many tiles of viaduct each support tier holds:\n• [entity=rail-support] __ENTITY__rail-support__ — 11 tiles, 1,000 health (20 concrete + 10 steel);\n• [entity=paranoidal-rail-support-2] __ENTITY__paranoidal-rail-support-2__ ([technology=paranoidal-rail-support-2] "Reinforced rail supports", blue science) — 16 tiles, 2,000;\n• [entity=paranoidal-rail-support-3] __ENTITY__paranoidal-rail-support-3__ ([technology=paranoidal-rail-support-3] "Bridge rail supports", production science) — 24 tiles, 4,000;\n• a ramp — 9 tiles. Supports are upgraded with the upgrade planner: I → II → III.\n\n[technology=paranoidal-rail-support-power] "Rail support cabling" hides a pole in every support: the wire between supports reaches 22, 32 and 48 tiles by support tier. The cable [font=default-bold]carries[/font] power along the viaduct but does not power buildings around it.
zzz-railway-control=• __CONTROL__tms-toggle__ with the cursor on a train switches it between manual and automatic mode. Without a train under the cursor this key (or the shortcut bar button after "Automated rail transportation") gives a selection tool: select trains and their mode is switched. With the "No Toggling" setting a normal selection sets automatic mode and a Shift selection sets manual mode.\n• In manual mode a train ignores its schedule: the player in the locomotive drives it. In automatic mode the player in the train is a passenger.\n• __CONTROL__toggle-rail-layer__ — with the rail planner, switches whether the track ends on the ground or on a viaduct.\n• The stop window shows the train limit and the stop signals; from the train window you can send it to a stop or to a temporary stop.

