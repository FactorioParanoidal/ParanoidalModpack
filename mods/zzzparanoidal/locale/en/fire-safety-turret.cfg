[entity-description]
pd-fire-safety-turret=Connect water by pipe. While the turret has water, nothing catches fire or cooks off in the whole circle of __1__ tiles: ammunition, turrets, chests, tanks and pipes with flammable fluids. Fires on the ground are put out. Does not attack enemies, uses 5 water per second.
pd-fire-safety-turret-mk2=Connect water by pipe. While the turret has water, nothing catches fire or cooks off in the whole circle of __1__ tiles: ammunition, turrets, chests, tanks and pipes with flammable fluids. Fires on the ground are put out. Does not attack enemies, uses 10 water per second.
