[mod-setting-name]
paranoidal-turret-deploy-delay=Turret deployment time, s
paranoidal-artillery-deploy-delay=Artillery deployment time, s
paranoidal-turret-deploy-indicator=Show turret deployment ring

[mod-setting-description]
paranoidal-turret-deploy-delay=A newly built turret (by hand, robots, nanobots or scripts) does not fire for this many seconds. It can already be loaded with ammo, and enemies can already attack it. Turrets that were already working are not affected. 0 turns the delay off.
paranoidal-artillery-deploy-delay=The same for artillery turrets. 0 turns the delay off.
paranoidal-turret-deploy-indicator=An orange ring around a deploying turret: its segments go out one by one, and the turret opens fire when the ring is gone.

[paranoidal-turret-deploy]
status=Deploying
