[technology-description]
paranoidal-module-components-1=The module lab, cases, contacts, boards and tier I processors for crafting ordinary modules of levels 1–2. The module lab researches specialized branches using module processors and other components instead of ordinary science packs. Finished modules are unlocked by separate technologies.
paranoidal-module-components-2=Tier II boards and processors for crafting ordinary modules of levels 3–5. Finished modules are researched in their respective specialized branches.
paranoidal-module-components-3=Tier III boards and processors for crafting ordinary modules of levels 6–8. Boards of this tier require platinum wire. Finished modules are researched in their respective specialized branches.
