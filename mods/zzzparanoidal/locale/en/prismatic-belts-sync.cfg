[mod-setting-name]
paranoidal-bob-basic-belt-64-frames=Basic belt: 64-frame animation

[mod-setting-description]
paranoidal-bob-basic-belt-64-frames=Prismatic Belts. Off (default): the basic transport belt, its underground belt, splitter and loaders use the 16-frame animation, like the yellow belt. On: the 64-frame turbo animation used before (a separate 8192×2560 sheet: 80 MiB when expanded to RGBA8, before compression and overhead). Requires a restart.
