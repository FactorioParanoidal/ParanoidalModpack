[mod-setting-name]
paranoidal-miniloader-energy-multiplier=Loader energy multiplier
paranoidal-loader-auto-connect=Automatically connect loaders

[mod-setting-description]
paranoidal-miniloader-energy-multiplier=Scales both energy per item and idle drain of Paranoidal electric loaders. Default: 4; range: 0.01–100. Full-belt consumption is shown in each loader's tooltip. Requires a restart.
paranoidal-loader-auto-connect=Automatically selects the input/output orientation of newly built electric loaders using adjacent belts and containers. Also applies to robot construction, cloning and script-raised construction events. Does not rearrange existing loaders.

