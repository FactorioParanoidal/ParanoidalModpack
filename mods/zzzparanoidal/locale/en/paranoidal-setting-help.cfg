[mod-setting-description]
baa-arrow-scale=[img=utility/indication_arrow] Changes the size of the interface arrow used to point toward alerts. Larger values make the arrow larger; 0 makes it invisible. Alert icons and the causes of alerts are unchanged.\n[color=#9cdcfe]Default: 0.2. Range: 0–1. Requires a game restart.[/color]
baa-arrow-tint=[img=utility/color_picker] Sets the alert-direction arrow’s HEX color: FF9F1C is orange and FFFFFF is white. A fourth pair sets opacity: FFFFFF80 is translucent white. Use hexadecimal digits only; a leading # is optional.\n[color=#9cdcfe]Default: FF9F1C. Requires a game restart.[/color]
