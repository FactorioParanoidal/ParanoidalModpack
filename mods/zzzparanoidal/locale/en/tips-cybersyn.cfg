[tips-and-tricks-item-description]
zzz-cybersyn=The [font=default-bold]Cybersyn train network[/font] (Project Cybersyn mod) decides by itself which train carries what, from where and to where. You do not write any schedules.\n\nIf you know logistic robots, it works the same way:\n• a [font=default-bold]requester station[/font] is a requester chest;\n• a [font=default-bold]provider station[/font] is a passive provider chest;\n• a [font=default-bold]depot[/font] is a roboport, where trains wait for work;\n• [font=default-bold]trains[/font] are the robots.\n\nResearch [technology=cybersyn-train-network] "Cybersyn train network". It unlocks the [item=cybersyn-combinator] __ITEM__cybersyn-combinator__ and the [item=cybersyn-constant-combinator] __ITEM__cybersyn-constant-combinator__.\n\nThe smallest network is one depot, one provider station, one requester station and a fueled train. In the animation all of it really works: the mod drives the train, and its status is shown above the locomotive.\n\nThe next entries explain how to build each station, how the threshold works, networks, refueling and what to do when trains do not move.
zzz-cybersyn-controller=Everything is controlled by the [item=cybersyn-combinator] [font=default-bold]__ITEM__cybersyn-combinator__[/font]. Place it [font=default-bold]right next to a train stop[/font], at most one tile away, diagonally is fine. A combinator placed farther away does not add the stop to the network.\n\nThe mode is chosen in the combinator window. In alt mode (__CONTROL__show-info__) it shows a letter:\n• [font=default-bold]D — Depot.[/font] Trains wait here for orders.\n• [font=default-bold]S — Station.[/font] Provides and/or requests cargo.\n• [font=default-bold]R — Refueler.[/font] Trains stop here for fuel.\n• [font=default-bold]C — Station control.[/font] A second combinator at the same station: own thresholds for single cargos; its output shows what is already on the way.\n• [font=default-bold]W — Wagon control.[/font] Placed by the rail next to a wagon, for advanced stations.\n\nD and S are enough for a simple network.\n\nThe color of the letter S shows the station state:\n• [color=0.4,0.7,1]blue S[/color] — waiting;\n• [color=0.4,1,0.4]green >[/color] — a train is on its way;\n• [color=1,0.4,0.4]red S[/color] — a request could not be served (see "When trains do not move").\n\nThe stop name matters only for depots (see "Depot").
zzz-cybersyn-depot=[font=default-bold]Building a depot[/font]\n1. Place a train stop and a __ITEM__cybersyn-combinator__ in "Depot" mode next to it.\n2. Build a train, fuel it and give it a one-line schedule: this depot. Any wait condition will do.\n3. The train arrives at the depot and joins the network. The mod rewrites its schedule and sends it from then on.\n\n[font=default-bold]Important[/font]\n• A train must arrive at the depot [font=default-bold]empty[/font]. A train with cargo stays in the depot, does not join the network, and the mod raises an alert. Unload it and send it to the depot again (the right train in the animation).\n• A train takes its network from the depot combinator when it arrives. If you change the depot network, the train learns about it on its next visit.\n• Give all depots of a network the same name and set their stops to a limit of 1 train. Do not give ordinary stops that name, or a train may "return to the depot" at the wrong place.\n\n[font=default-bold]Depot settings[/font]\n• "Depot bypass" (on): a train that finished an order may take a new one right away, without visiting the depot.\n• "Require same depot" (off): while it is off, the train returns to any free depot with the same name.
zzz-cybersyn-provider=A [font=default-bold]provider station[/font] gives cargo to the network.\n\n1. At the stop, along the wagon place, put inserters and chests. The inserters load from the chests [font=default-bold]into the wagon[/font].\n2. Place a __ITEM__cybersyn-combinator__ in "Station" mode next to the stop.\n3. Connect the chests by wire to the combinator [font=default-bold]input[/font].\n\nChests report their contents to the wire by themselves. A [font=default-bold]positive[/font] signal on the input means "I can give this".\n\nIn the combinator window set the switch to "Provide only", so the station never starts requesting.\n\nWhen a train arrives, the combinator [font=default-bold]output[/font] shows its order with a minus sign: what to load and how much. The train waits until the whole order is loaded and then goes to the requester station.\n\nA station provides cargo only if it has at least the request threshold (see "Request threshold").
zzz-cybersyn-requester=A [font=default-bold]requester station[/font] asks the network for cargo.\n\n1. At the stop, inserters unload the wagon into chests.\n2. A __ITEM__cybersyn-combinator__ in "Station" mode, switch set to "Request only".\n3. The chests are wired to the combinator input.\n4. A combinator with the request is wired there too: a cargo with a [font=default-bold]negative[/font] amount, how much you want to keep in stock, for example [item=iron-ore] −8000.\n\nThe signals add up on the input: a request of −8000 and 6500 in the chests give −1500, so 1500 is missing. When the missing amount reaches the [font=default-bold]request threshold[/font] (2000 by default), the network calls a train. While the train is on its way, the mod counts it and does not send a second train for the same cargo.\n\nThe [item=cybersyn-constant-combinator] [font=default-bold]__ITEM__cybersyn-constant-combinator__[/font] is handy for the request: a constant combinator with separate fields for threshold, priority, locked slots and network masks, amounts can be entered in stacks. An ordinary constant combinator works too.\n\nA train leaves a requester station only when its wagons are empty. Keep room in the storage for at least two full trains.
zzz-cybersyn-threshold=[virtual-signal=cybersyn-request-threshold] The [font=default-bold]request threshold[/font] is the smallest delivery. It is set with this signal on the input of the requester station combinator. Without the signal the map setting applies, [font=default-bold]2000[/font] by default.\n\nA delivery is created only when all three hold:\n• the requester station misses [font=default-bold]at least the threshold[/font];\n• a provider station has [font=default-bold]at least the threshold[/font];\n• a free train has [font=default-bold]at least the threshold of capacity[/font].\n\nSo the threshold must not exceed the train capacity. A cargo wagon of this modpack has 20 slots: 4000 iron ore (stack 200) or 8000 plates (stack 400). With a larger threshold no train ever goes, and the station letter S turns red.\n\nA large threshold means fewer trips but bigger storage; a small one means half-empty trains.\n\n• The "Stack thresholds" checkbox of the combinator counts the threshold in stacks instead of items.\n• [virtual-signal=cybersyn-fluid-request-threshold] is a separate threshold for fluids.\n• A threshold for a single cargo is set by a "Station control" combinator.
zzz-cybersyn-delivery=What the network does, step by step (the animation highlights the steps as the train goes):\n\n1. [font=default-bold]Polling.[/font] About 30 times per second the mod reads the station inputs: what is in stock, what is requested. Deliveries already on their way are taken into account.\n2. [font=default-bold]A pair.[/font] For each cargo it looks for a requester missing at least the threshold and a provider having at least the threshold. Of several requesters the one with the higher priority wins, on equal priority the one waiting longest. Of several providers the one with the higher priority, on equal priority the closest to the requester.\n3. [font=default-bold]A train.[/font] A free train of the same network with at least the threshold of capacity, allowed at both stations; the one closest to the provider is taken.\n4. [font=default-bold]Loading.[/font] The order is the missing amount, but no more than the provider has and the train can hold. The train waits until the whole order is loaded.\n5. [font=default-bold]Unloading.[/font] At the requester the train waits until its wagons are empty.\n6. [font=default-bold]Done.[/font] The train is free: it may take a new order right away (depot bypass), visit a refueler or return to the depot.\n\nThe mod writes the train schedule itself, do not touch it. Trains drive to a rail point at the stop, so the stop window shows a train only once it has arrived.
zzz-cybersyn-bypass=[font=default-bold]Depot bypass[/font] is on for depots by default.\n\nA train that unloaded at a requester counts as free already on its way to the depot. If a new order appears meanwhile, the mod may give it to this train, which then goes straight to the provider without visiting the depot.\n\nTrains run empty less, tracks are less busy and fewer spare trains are needed in depots.\n\nThe bypass works only if the train has more fuel than the fuel threshold (map setting, 50% by default). Otherwise it first goes to a refueler or to the depot.\n\nIn the animation ore is used fast, and the train takes new orders on the way again and again. The counter shows how many orders were taken without visiting the depot.\n\nTurn it off with the "Depot bypass" checkbox of the depot combinator.
zzz-cybersyn-refuel=You do not have to bring fuel to every depot: build a shared [font=default-bold]refueler[/font].\n1. Place a stop and a __ITEM__cybersyn-combinator__ in "Refueler" mode next to it.\n2. Put fuel inserters where the [font=default-bold]locomotive[/font] stops. They must not reach cargo wagons, or the wagons fill up with coal. The mod checks this and does not send a train whose wagons would stop next to the inserters.\n\nAfter each delivery the mod checks the fuel. If it is below the [font=default-bold]fuel threshold[/font] (map setting, 50% by default), the train visits the nearest refueler of its network, waits until the inserters are done and takes orders again.\n\nWithout a refueler a train low on fuel returns to the depot, and the depot has to refuel it.\n\nLike stations, refuelers use the network, priority and the train limit of the stop.\n\nThe locomotive of this modpack burns chemical fuel and has 3 fuel slots.
zzz-cybersyn-networks=The network is the signal in the [font=default-bold]"Network"[/font] field of the combinator window, [virtual-signal=signal-A] by default. Stations, depots and refuelers of different networks never share trains or cargo.\n\n[font=default-bold]Example: trains of different length.[/font] Short stations are built for "locomotive + wagon", long ones for two wagons.\n• Short depots, providers and requesters use network [virtual-signal=signal-A].\n• Long ones use network [virtual-signal=signal-B].\nThe short train waits in depot A and runs only between A stations, the long one only between B stations.\n\nA train takes its network from the depot it waits in. Any virtual signal can be a network except [virtual-signal=signal-everything], [virtual-signal=signal-anything] and the mod's own signals.\n\nWith the network [virtual-signal=signal-each] a station is in several networks at once: every virtual signal on its input becomes one of its networks (see "Sub-networks and masks").
zzz-cybersyn-masks=Advanced. If the combinator input gets a signal [font=default-bold]of the same letter as its network[/font], the value of that signal becomes a [font=default-bold]sub-network mask[/font]. Each of the 32 bits is one sub-network.\n\nStations and a train work together if their masks share at least one bit (bitwise AND is not zero):\n• 1 (0001) and 5 (0101): common bit 1, a delivery is possible;\n• 5 (0101) and 4 (0100): common bit 4, possible;\n• 1 (0001) and 4 (0100): no common bit, not possible.\n\nWithout such a signal the mask is −1 (all bits): the station is in every sub-network of its network.\n\nIf you do not want to count bits, pick two values and use them across the base: [font=default-bold]−1[/font] (all sub-networks) and [font=default-bold]1[/font] (the first one).\n\nThe [item=cybersyn-constant-combinator] __ITEM__cybersyn-constant-combinator__ has a mask field with an encoder where bits are toggled by buttons.\n\nIn the network [virtual-signal=signal-each] every virtual signal on the input is a separate network, and its value is the mask in that network.
zzz-cybersyn-priority=[virtual-signal=cybersyn-priority] [font=default-bold]Priority[/font] is a signal on the combinator input, any integer, negative too. 0 by default. The higher, the earlier.\n• [font=default-bold]Requester stations:[/font] a station with a lower priority gets nothing until stations with a higher one are served.\n• [font=default-bold]Provider stations:[/font] cargo is taken first from the one with the higher priority.\n• [font=default-bold]Depots:[/font] trains from the depot with the higher priority are sent first.\n• [font=default-bold]Refuelers:[/font] a train goes to the one with the higher priority.\n\nOn equal priority requesters are served [font=default-bold]in turn[/font] (the station waiting longest first), and the closest provider is chosen.\n\n[font=default-bold]Do not change the priority in the train stop window[/font], keep 50. The mod drives trains to the right stop by coordinates, and another priority leads them astray. The mod warns about it, and /cybersyn-fix-priorities resets all stops to 50.\n\nA "Station control" combinator sets a second priority for single cargos of the station.
zzz-cybersyn-allow-list=The [font=default-bold]"Automatic allow-list"[/font] (a station combinator checkbox, on by default) keeps away trains the station cannot serve.\n\nThe mod looks where inserters, loaders and pumps stand along the track and lets in only trains whose [font=default-bold]every wagon[/font] stops next to them. A train must fit [font=default-bold]both[/font] stations of a delivery.\n\nIn the animation inserters stand only at the first wagon. The "locomotive + wagon" train is allowed, the train with two wagons is not: nobody would unload its second wagon.\n\nA short train is still allowed at a long station. If the network has trains of different length, put them into different networks (see "Networks").\n\nThe list is built when the combinator is placed and updated when inserters and rails are built nearby. The "Refresh allow-list" button in the combinator window recalculates it by hand.\n\nThe mod respects the [font=default-bold]train limit[/font] of the train stop: no more trains go to a station at once than its limit, which saves stackers in front of stations.
zzz-cybersyn-fluids=Fluids travel like items, only in [item=fluid-wagon] fluid wagons.\n• [font=default-bold]Pumps[/font] stand where the fluid wagon stops, with tanks behind them. At the provider they pump into the wagon, at the requester out of it.\n• The tanks are wired to the combinator input. The request is a negative amount of fluid, for example [fluid=crude-oil] −50000.\n• Fluids can have their own threshold [virtual-signal=cybersyn-fluid-request-threshold]; without it the general request threshold applies.\n• A train carries [font=default-bold]only one fluid[/font] per trip.\n• A fluid wagon of this modpack holds 25 000; the threshold must not be larger.\n• Pumps count for the allow-list: the fluid wagon must stop next to the pumps.\n• [virtual-signal=cybersyn-reserved-fluid-capacity] keeps free volume in the wagon, needed when station pipes are shared by several fluids.\n\nIn the animation the pumps are real, while the tanks are shown as numbers on constant combinators.
zzz-cybersyn-multi=A station may provide several cargos, and a train may carry them in one trip. If a requester needs several cargos that one provider has, the mod joins them into one order and trims it to the wagon slots.\n\n[virtual-signal=cybersyn-locked-slots] [font=default-bold]Locked slots[/font] (a signal at the provider) keep that many slots of every wagon empty. Without them inserters may overfill a wagon with one cargo and leave no room for another.\n\nFor precise loading:\n• [font=default-bold]"Inactivity condition"[/font] of the station combinator: the train does not leave until the inserters are done;\n• [font=default-bold]"Circuit condition"[/font]: the train waits for [virtual-signal=signal-check] above 0 from the stop (enable "Send to train" at the stop);\n• [font=default-bold]W, "Wagon control"[/font], at every wagon: its output is the order of exactly this wagon, the wagon slots are filtered in order, and "Bar unfiltered slots" closes the rest.\n\nThis is how "universal" stations providing any set of cargos are built. It is an advanced topic: one cargo per station is enough to start.
zzz-cybersyn-station-control=[font=default-bold]C, "Station control"[/font], is a second __ITEM__cybersyn-combinator__ at an already working station. It gives the station one more input and output.\n\n[font=default-bold]Input[/font]\n• A cargo signal sets an [font=default-bold]own threshold[/font] for that cargo, for example [item=iron-ore] 1000. Other cargos of the station follow the general threshold.\n• [virtual-signal=cybersyn-priority] on this input is a priority only for the cargos listed here.\n• At a provider station such a threshold works as a flush: if it has more than the threshold, the cargo goes with the first matching request. Handy to empty an old mine.\n\n[font=default-bold]Output[/font]\n• All created and unfinished deliveries of the station: plus is coming to the station, minus will be taken from it.\n• [virtual-signal=signal-T] — how many trains are coming to the station or standing at it ("Enable train count" checkbox).\n\n"Manual inventory control" is for several stations sharing one storage: you then keep track of cargo on the way yourself by feeding the C output to the station input.
zzz-cybersyn-problems=[font=default-bold]Trains do not move? Check in order.[/font]\n• Is the combinator right next to the stop? /cybersyn-find-problems shows combinators placed too far away and other mistakes.\n• Was the station just built? The mod connects it after 20 seconds.\n• Is there a train in the depot? Is it empty, fueled, and did it arrive by its schedule?\n• Do the depot and both stations use the same network?\n• Does the requester miss and the provider have at least the threshold?\n• [font=default-bold]Is the threshold not larger than the train capacity?[/font] In the animation the threshold is 9000 with a capacity of 4000: the letter S is red and the train waits. Set to 2000, the train goes.\n• Does the train fit the allow-list of both stations?\n• Is the train limit of the stop not used up?\n\n[font=default-bold]Mod alerts[/font] (an icon at the station or the train): no train in the network, no train has enough capacity, no train matches the allow-list, a train is held in the depot with cargo, a train is stuck (10 minutes after dispatch), a station or depot is broken.\n\nThe [font=default-bold]Cybersyn manager[/font] is a window with all stations, trains, cargo on the way and alerts. Open it with the shortcut bar button or __CONTROL__cybersyn-toggle-gui__.\n\nThe mod never sends a train with leftover cargo: unload it by hand and send it to the depot again.

