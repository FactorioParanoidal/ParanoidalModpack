[tips-and-tricks-item-description]
zzz-cybersyn=The Cybersyn train network (Project Cybersyn mod) decides by itself which train carries what, from where and to where. You write no schedules.\n\n[font=default-bold]Quick start[/font] (the animation builds the network the same way):\n1. Research [technology=cybersyn-train-network] "Cybersyn train network".\n2. [font=default-bold]Depot.[/font] A train stop with an [item=cybersyn-combinator] __ITEM__cybersyn-combinator__ in "Depot" mode next to it. An empty fueled train whose schedule says "go to the depot" arrives and joins the network.\n3. [font=default-bold]Provider.[/font] A stop, chests and inserters loading into the wagon. The chests are wired to the input of a combinator in "Station" mode.\n4. [font=default-bold]Requester.[/font] The same, but the inserters unload the wagon. A [item=cybersyn-constant-combinator] __ITEM__cybersyn-constant-combinator__ with a negative cargo amount, for example [item=iron-ore] -8000, is wired to the combinator input too.\n5. Bring [font=default-bold]power[/font] to the combinators. After 20 seconds the network connects the stations and starts delivering.\n\nIf you know logistic robots: a requester station works like a requester chest, a provider station like a passive provider chest, a depot like a roboport and trains like robots.
zzz-cybersyn-controller=The [item=cybersyn-combinator] __ITEM__cybersyn-combinator__ connects a train stop to the network.\n• Place it right next to the stop, at most 1 tile away, diagonally is fine.\n• [font=default-bold]It needs power.[/font] Without power it does not see the storage, and trains stand still without any warning.\n• A stop has at most one combinator of each mode.\n\nThe mode is chosen in the combinator window; the letter on its screen shows the mode:\n• [font=default-bold]D, "Depot":[/font] trains wait here for orders.\n• [font=default-bold]S, "Station":[/font] provides and requests cargo.\n• [font=default-bold]R, "Refueler":[/font] trains stop here for fuel.\n• [font=default-bold]C, "Station control"[/font] and [font=default-bold]W, "Wagon control":[/font] for advanced stations, see "Advanced".\n\nThe color of the letter S shows the station state:\n• [color=0.4,0.7,1]blue S[/color]: waiting;\n• [color=0.4,1,0.4]green >[/color]: a train is assigned;\n• [color=1,0.4,0.4]red S[/color]: the request cannot be served right now, see "When trains do not move".
zzz-cybersyn-depot=[font=default-bold]Building a depot[/font]\n1. A train stop with a __ITEM__cybersyn-combinator__ in "Depot" mode next to it.\n2. An empty fueled train whose schedule has one line: this depot.\n3. The train arrives at the depot and joins the network. From then on the mod writes its schedule.\n\n[font=default-bold]Rules[/font]\n• A train with cargo does not join: it stays in the depot and the mod raises an alert. Unload it and send it to the depot again (the right train in the animation).\n• A train takes its network from the depot combinator when it arrives.\n• Give all depots of a network one name and a limit of 1 train on each of their stops. Do not give ordinary stops that name.\n\n[font=default-bold]Combinator checkboxes[/font]\n• "Depot bypass", on: a train takes a new order on the way without visiting the depot.\n• "Require same depot", off: a train returns to any free depot with the same name.
zzz-cybersyn-provider=A provider station gives cargo to the network.\n1. Chests and inserters along the wagon place, loading [font=default-bold]into the wagon[/font].\n2. A __ITEM__cybersyn-combinator__ in "Station" mode next to the stop, switch set to "Provide only".\n3. The chests are wired to the combinator [font=default-bold]input[/font].\n\nChests report their contents to the wire by themselves. Plus on the input means "I can give this".\n\nWhen a train arrives, the combinator [font=default-bold]output[/font] shows its order with a minus sign: what to load and how much. The train waits until the whole order is loaded.\n\nCargo is provided only if there is at least the request threshold of it.
zzz-cybersyn-requester=A requester station asks the network for cargo.\n1. Inserters along the wagon place unload the wagon into chests.\n2. A __ITEM__cybersyn-combinator__ in "Station" mode, switch set to "Request only".\n3. Wired to the combinator input: the chests and a [item=cybersyn-constant-combinator] __ITEM__cybersyn-constant-combinator__ with the [font=default-bold]request[/font], a cargo with a minus sign: how much to keep in stock.\n\nThe signals add up on the input. A request of -8000 and 6500 in the chests give -1500: 1500 is missing. When the missing amount reaches the request threshold, the network calls a train.\n\nThe mod counts cargo on the way. A second train goes only if, with the first train's cargo, at least the threshold is still missing.\n\n• A train leaves when its wagons are empty. Keep room in the storage for at least two full trains.\n• Quality counts. Better plates or defective buildings are a separate cargo for the network: they do not fill a request for normal ones.\n• The Cybersyn constant combinator has fields for threshold, priority and masks, and amounts can be set in stacks. An ordinary constant combinator works too.
zzz-cybersyn-threshold=[virtual-signal=cybersyn-request-threshold] The [font=default-bold]request threshold[/font] sets the smallest delivery. It is a signal on the input of the requester station combinator. Without it the map setting applies: 2000.\n\nA delivery is created when:\n• the requester misses at least the threshold;\n• a provider has at least the threshold;\n• a free train has at least the threshold of capacity.\n\n[font=default-bold]The threshold must not exceed the train capacity[/font], otherwise no train ever goes. The ordinary cargo wagon of this modpack holds 20 stacks: 4000 ore (stack 200) or 8000 plates (stack 400). Bob's wagons have more slots.\n\nA large threshold: fewer trips, but bigger storage. A small one: half-empty trains.\n\n• The "Stack thresholds" checkbox counts the threshold in stacks.\n• [virtual-signal=cybersyn-fluid-request-threshold]: a separate threshold for fluids.
zzz-cybersyn-delivery=About 30 times per second the network polls the stations and for every cargo picks a requester, a provider and a train.\n• [font=default-bold]Requester:[/font] the highest priority. On equal priority the one that waited longest, so cargo is shared in turn.\n• [font=default-bold]Provider:[/font] the highest priority, on equal priority the closest to the requester.\n• [font=default-bold]Train:[/font] free, same network, at least the threshold of capacity, allowed at both stations. Among those: the highest depot priority first, then the largest capacity, then the closest to the provider.\n\nThe order equals the missing amount, but no more than the provider has and the train holds.\n\n[virtual-signal=cybersyn-priority] [font=default-bold]Priority[/font] is set with this signal on the combinator input. 0 by default, negative values are allowed. Stations, depots and refuelers have it.\n\nPriority decides who is served first when several stations wait for cargo. In the animation there is one train and two requests. While requester 1 with priority 1 still misses cargo, the train serves only it. On equal priorities it serves them in turn. The station that did not get the train shows a red S: no free train.\n\n[font=default-bold]Do not change the priority in the train stop window[/font], keep 50. The mod drives trains by coordinates, and another priority leads them astray. /cybersyn-fix-priorities resets all stops to 50.
zzz-cybersyn-bypass=After unloading the train is free, and the mod decides where it goes.\n\n[font=default-bold]Depot bypass[/font] (a depot combinator checkbox, on). A free train is available for orders already on its way to the depot. When an order appears, the train goes straight to the provider and skips the depot. Fewer empty trips, fewer spare trains.\n\n[font=default-bold]Refueling.[/font] With less than half of its fuel (map setting "Fuel threshold"), a train first visits the nearest refueler of its network and only then takes orders.\n1. A stop and a __ITEM__cybersyn-combinator__ in "Refueler" mode.\n2. Fuel inserters where the [font=default-bold]locomotive[/font] stops. They must not reach cargo wagons: the mod does not send such a train to the refueler.\n\nWithout a refueler a train low on fuel goes to the depot, and the depot has to refuel it.\n\nIn the animation the train comes back almost without fuel every other time. Then it refuels; the other times it takes a new order right away.
zzz-cybersyn-networks=The [font=default-bold]network[/font] is the signal in the "Network" field of the combinator window, [virtual-signal=signal-A] by default. Stations, depots and refuelers of different networks share neither trains nor cargo. A train takes the network of its depot.\n\nThe usual case: trains of different length. Stations for one-wagon trains and their depot use network [virtual-signal=signal-A], stations for two-wagon trains use [virtual-signal=signal-B]. Short trains run only between A stations, long ones only between B stations.\n\nAny virtual signal can be a network except [virtual-signal=signal-everything], [virtual-signal=signal-anything] and the mod's own signals.\n\n[font=default-bold]Sub-networks[/font], advanced. If the combinator input gets a signal of the same letter as its network, the value becomes a mask: each of its 32 bits is a sub-network. A delivery is possible if the masks share a bit: 1 and 5 can, 5 and 4 can, 1 and 4 cannot. Without such a signal the mask is -1, all sub-networks. If you do not want to count bits, use only -1 and 1.\n\nThe network [virtual-signal=signal-each] puts a station into several networks at once: every virtual signal on the input becomes one of its networks, and its value the mask.
zzz-cybersyn-allow-list=The [font=default-bold]"Automatic allow-list"[/font] checkbox of the station combinator (on) keeps away trains the station cannot serve. The mod looks where inserters, loaders and pumps stand along the track and allows a train only if every wagon stops next to them. A train must fit both stations of a delivery.\n\nIn the animation inserters stand only at the first wagon: the one-wagon train is allowed, the two-wagon train is not.\n\nA short train may use a long station. If the network has trains of different length, put them into different networks (see "Networks and sub-networks").\n\nThe list is updated when inserters and rails are built nearby. The "Refresh allow-list" button in the combinator window recalculates it by hand.\n\nThe mod respects the [font=default-bold]train limit[/font] of the train stop: no more trains go to a station at once than its limit, so stackers in front of stations are optional.
zzz-cybersyn-fluids=Fluids travel like items, only in [item=fluid-wagon] fluid wagons.\n• Pumps stand where the fluid wagon stops, with tanks behind them. At the provider they pump into the wagon, at the requester out of it.\n• The tanks are wired to the combinator input. The request is a fluid with a minus sign, for example [fluid=crude-oil] -50000.\n• [virtual-signal=cybersyn-fluid-request-threshold] sets the fluid threshold; without it the general threshold applies.\n• The ordinary fluid wagon of this modpack holds 25 000; the threshold must not be larger.\n• A train carries only one fluid per trip.\n• Pumps count for the allow-list: the fluid wagon must stop next to them.\n\nIn the animation the pumps are real, while the tank contents are shown as numbers.
zzz-cybersyn-multi=[font=default-bold]Several cargos in one train.[/font] If a requester needs several cargos that one provider has, the mod joins them into one order and trims it to the wagon slots. To keep inserters from filling a wagon with one cargo:\n• [virtual-signal=cybersyn-locked-slots] at the provider keeps that many slots of every wagon empty;\n• the "Inactivity condition" checkbox: the train waits until the inserters are done;\n• the "Circuit condition" checkbox: the train waits for [virtual-signal=signal-check] above 0 from the stop (enable "Send to train" at the stop).\n\n[font=default-bold]W, "Wagon control"[/font], stands by the rail next to a wagon. Its output is the order of exactly this wagon, and the wagon slots are filtered in order. This is how stations that load any set of cargos precisely are built.\n\n[font=default-bold]C, "Station control"[/font], is a second combinator at the station.\n• Input: a cargo signal sets an own threshold for it, [virtual-signal=cybersyn-priority] sets an own priority for the listed cargos. At a provider an own threshold sends the cargo away with the first request: handy to empty an old mine.\n• Output: all deliveries on the way (plus is coming to the station, minus will be taken) and [virtual-signal=signal-T], the number of trains coming.
zzz-cybersyn-problems=[font=default-bold]Trains do not move? Check in order.[/font]\n1. Do the combinators have power?\n2. Is the combinator right next to the stop? /cybersyn-find-problems finds distant combinators and other mistakes.\n3. Is the station older than 20 seconds? The mod connects new ones with a delay.\n4. Is there an empty fueled train in the depot that arrived there by its schedule?\n5. Do the depot and both stations share a network?\n6. Does the requester miss and the provider have at least the threshold? Does the cargo quality match?\n7. [font=default-bold]Is the threshold not larger than the train capacity?[/font] In the animation the threshold is 9000 with a capacity of 4000: the letter S is red and the train waits. Set to 2000, the train goes.\n8. Does the train fit the allow-list of both stations, and is the train limit of the stop not used up?\n\n[font=default-bold]Mod alerts[/font] (an icon at the station or train) name the reason: no train in the network, not enough capacity, the train is not on the allow-list, a train with cargo is held in the depot, a train is stuck (10 minutes after dispatch).\n\nThe [font=default-bold]Cybersyn manager[/font] (shortcut bar button or __CONTROL__cybersyn-toggle-gui__) shows all stations, trains, cargo on the way and alerts.\n\nThe mod never sends a train with leftover cargo: unload it and send it to the depot again.

