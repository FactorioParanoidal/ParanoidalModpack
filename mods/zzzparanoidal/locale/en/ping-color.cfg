[mod-setting-description]
paranoidal-ping-mark=A map ping or a location link ([gps=…]) sent to the ordinary chat gets a ring and the player's name in that player's color on the map, so pings of different players can be told apart. The ping icon itself does not change. /shout and /whisper are not marked.
paranoidal-ping-duration=How long a mark stays on the map.
paranoidal-ping-per-player=How many marks of one player stay on the map at once. A new ping removes that player's oldest mark.
paranoidal-ping-visibility=Own team — only the team of the player who pinged (the same people who see the chat message). Everyone — all teams.
paranoidal-ping-color-source=Player color — the color of the character and their buildings. Chat color — the color of the player's name in the chat.
paranoidal-ping-opacity=1 — opaque, 0.1 — almost transparent. Applies to the ring and the name.
paranoidal-ping-blink=The mark blinks with this interval. 0 — no blinking. Game alerts use 0.5.
paranoidal-ping-world=Also draw the mark in the normal game view, not only on the map.
paranoidal-ping-ring=A ring in the player's color around the ping.
paranoidal-ping-ring-radius=The ring is drawn in tiles, so it gets smaller on screen when the map is zoomed out.
paranoidal-ping-ring-width=Line width in pixels at full zoom (32 per tile).
paranoidal-ping-ring-fill=Fills the circle with the player's color. 0 — no fill.
paranoidal-ping-name=The player's name in their color above the ring.
paranoidal-ping-name-scale=Name text scale.
paranoidal-ping-name-fixed-size=On — the name stays the same size on screen at any zoom. Off — it is drawn in tiles like the ring.
paranoidal-ping-name-offset=Distance between the top of the ring and the name. Negative values move the name down.
paranoidal-ping-name-font=Font of the name.
paranoidal-ping-name-message=Show the message text after the name, without tags, up to 50 characters.
paranoidal-ping-show=Your own setting: whether you see the colored marks of pings. Applies to new pings.

