[tips-and-tricks-description]

start=\n\n[color=255,0,0][font=default-bold] Welcome to FACTORIO PARANOIDAL[/font][/color]\n\n This is a hardcore and very interesting megapack for [font=default-bold]Factorio[/font].\n About 200 hand-tuned mods are tightly woven together here into an amazing game.\n \n  This section will show the most important tips and hints for surviving in PARANOIDAL.\n They unlock gradually as you play and will teach you a lot of useful things. \n If you have questions, suggestions or bug reports, feel free to contact us on our Discord server.
no-update=Do not update the mods of the pack yourself: it breaks the adaptation!\nThe pack is tuned by hand to work correctly.\nIf you change mod settings, the consequences are on you: misbehaving mods, broken compatibility and a pack that does not work.\nThe pack broke and does not work? Delete the whole mods folder and download the pack again from GitHub.
