[mod-setting-description]
paranoidal-ping-mark=Пинг карты или ссылка на место ([gps=…]) в обычном чате получает на карте кольцо и ник цветом игрока, чтобы различать пинги разных игроков. Сам значок пинга не меняется. /shout и /whisper не отмечаются.
paranoidal-ping-duration=Сколько метка держится на карте.
paranoidal-ping-per-player=Сколько меток одного игрока одновременно остаётся на карте. Новый пинг убирает самую старую метку этого игрока.
paranoidal-ping-visibility=Своя команда — только команда пингующего (те же, кто видит сообщение в чате). Все — все команды.
paranoidal-ping-color-source=Цвет игрока — цвет персонажа и его построек. Цвет чата — цвет ника игрока в чате.
paranoidal-ping-opacity=1 — непрозрачно, 0,1 — почти прозрачно. Действует на кольцо и ник.
paranoidal-ping-blink=Метка мигает с этим интервалом. 0 — без мигания. У игровых оповещений 0,5.
paranoidal-ping-world=Рисовать метку и в обычном игровом виде, а не только на карте.
paranoidal-ping-ring=Кольцо цветом игрока вокруг пинга.
paranoidal-ping-ring-radius=Кольцо рисуется в клетках, поэтому при отдалении карты оно уменьшается на экране.
paranoidal-ping-ring-width=Толщина линии в пикселях при полном приближении (32 на клетку).
paranoidal-ping-ring-fill=Заливает круг цветом игрока. 0 — без заливки.
paranoidal-ping-name=Ник игрока его цветом над кольцом.
paranoidal-ping-name-scale=Масштаб текста ника.
paranoidal-ping-name-fixed-size=Вкл — ник одного размера на экране при любом зуме. Выкл — рисуется в клетках, как кольцо.
paranoidal-ping-name-offset=Расстояние от верха кольца до ника. Отрицательное значение опускает ник.
paranoidal-ping-name-font=Шрифт ника.
paranoidal-ping-name-message=Показывать после ника текст сообщения без тегов, до 50 символов.
paranoidal-ping-show=Ваша личная настройка: видеть ли цветные метки пингов. Действует на новые пинги.

