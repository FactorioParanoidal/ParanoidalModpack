[mod-setting-name]
paranoidal-bob-basic-belt-64-frames=[item=transport-belt] Базовая лента: анимация 64 кадра

[mod-setting-description]
paranoidal-bob-basic-belt-64-frames=Prismatic Belts. Выключено (по умолчанию): базовая транспортная лента, её подземка, разделитель и погрузчики используют анимацию из 16 кадров, как жёлтая лента. Включено: прежняя турбо-анимация из 64 кадров (отдельный лист 8192×2560: 80 МиБ при развёртке в RGBA8, без учёта сжатия и накладных расходов). Требует перезапуска.
