[mod-setting-name]
paranoidal-bob-basic-belt-64-frames=Базовая лента: анимация 64 кадра

[mod-setting-description]
paranoidal-bob-basic-belt-64-frames=Prismatic Belts. Выключено (по умолчанию): базовая транспортная лента, её подземка, разделитель и погрузчики используют анимацию из 16 кадров, как жёлтая лента. Включено: прежняя турбо-анимация из 64 кадров (отдельный лист 80 МиБ без сжатия в видеопамяти). Требует перезапуска.
