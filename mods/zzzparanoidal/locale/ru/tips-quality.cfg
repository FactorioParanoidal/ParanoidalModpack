[tips-and-tricks-item-description]
zzz-defects=[font=default-bold]Брак[/font] — пять ступеней качества [font=default-bold]ниже обычного[/font]. В начале игры почти каждое новое здание или изделие выходит бракованным, пока вы не изучите «Контроль качества».\n\n[font=default-bold]Ступени[/font] (в анимации — одинаковые сборочные автоматы разных ступеней делают шестерни):\n[img=quality/ic-defect-5] −5 Бракованное — 33% полезных характеристик, энергия машин ×3\n[img=quality/ic-defect-4] −4 Дефектное — 47%, энергия ×2,14\n[img=quality/ic-defect-3] −3 Низкокачественное — 60%, энергия ×1,67\n[img=quality/ic-defect-2] −2 Неудовлетворительное — 73%, энергия ×1,36\n[img=quality/ic-defect-1] −1 Нестандартное — 87%, энергия ×1,15\n[img=quality/normal] 0 Обычное — 100%, энергия ×1\nЧисло чёрных точек на значке — величина штрафа.\n\n[font=default-bold]Что ухудшает брак[/font]: здоровье, скорость машин, печей и манипуляторов, скорость лабораторий, размер инвентарей, ёмкость аккумуляторов и цистерн, энергию роботов, прочность инструментов и ремонтных наборов, покрытие и провода столбов, работу буров. Бракованные машины ещё и тратят больше энергии. Скорость лент и дальность подземных лент брак [font=default-bold]не[/font] снижает.\n\n[font=default-bold]Главное[/font]:\n• Брак получают только [font=default-bold]готовые изделия[/font] эпохи красной науки. Материалы — никогда.\n• Брак уменьшают исследования «Контроль качества 1–10». На 10-м уровне новый брак больше не появляется, и только после него можно изучить зелёную науку.\n• Уже сделанный брак сам не исчезает — его исправляет [font=default-bold]мастерская доводки[/font].\n\nДальше по разделам: откуда берётся брак, исследования, брак ингредиентов, бракованные здания, мастерская и её режимы, режимы производства, контрольный пост, панель и сигналы.
zzz-defects-origin=[font=default-bold]Что получает брак[/font]\n• [font=default-bold]Готовые изделия[/font]: здания, броня, капсулы, ремонтные наборы, научные пакеты лабораторий.\n• [font=default-bold]Никогда не получают брак[/font]: материалы (сырьё, руда, пластины, детали, промежуточные продукты, трубы, покрытия, рельсы); ленты, подземные ленты, разделители и погрузчики; оружие, боеприпасы и турели; модули; оборудование брони и техники; техника; робопорты; комбинаторы, ж/д-сигналы и станции; клапаны, маяки, тепловые трубы, реакторы, ветряки.\n• [font=default-bold]Всё, что можно сделать только после зелёной науки[/font], — без брака: брак существует только в эпохе красной науки.\n\n[font=default-bold]Когда бросается брак[/font]\n• [font=default-bold]Ручной крафт[/font] — каждый новый готовый предмет получает свою ступень. Промежуточные изделия, которые игра сама добавила в очередь (например, печь для бура), не бракуются: они сразу уходят в следующий крафт. Отмена такого крафта брак не обходит — вернувшиеся предметы тоже получают бросок.\n• [font=default-bold]Машины[/font] — ступень решается незадолго до конца каждой операции.\n• Ступень выпадает случайно по распределению текущего уровня контроля. На уровне 0: −5 — 90%, −4 — 9%, −3 — 0,9%, −2 — 0,09%, −1 — 0,009%, обычное — 0,0009%. В анимации автомат делает железные сундуки на уровне 0.\n\n[font=default-bold]Потери производства[/font]\nОтдельно от брака операция может закончиться вообще без результата. Шанс = начальный процент из настроек карты × (10 − уровень контроля) / 10. По умолчанию начальный процент 0% — потери выключены. Если их включить, они действуют на ручной крафт, машины, буры и добычу; готовые изделия при крафте защищает отдельная настройка карты.
zzz-defects-research=[img=technology/ic-defect-control-1] [font=default-bold]Исследования «Контроль качества 1–10»[/font] стоят 10, 20, … 100 красных пакетов (550 всего) и не требуют других исследований.\n\n• [font=default-bold]Каждые два уровня[/font] убирают худшую возможную ступень: после 2-го уровня −5 больше не выпадает, после 4-го — −4 и так далее. Нечётные уровни сдвигают распределение наполовину.\n• Уровень 8: −1 — 90,9%, обычное — 9,1%. Уровень 9: −1 — 45,5%, обычное — 54,5%.\n• [font=default-bold]Уровень 10[/font]: новый брак и потери больше не назначаются.\n• «Контроль качества 10» обязателен для [font=default-bold]логистического (зелёного) исследовательского пакета[/font] и для модулей качества: зелёную науку нельзя изучить, пока брак не побеждён.\n• Исследования [font=default-bold]не исправляют[/font] уже сделанные бракованные предметы — для них нужна мастерская доводки.\n• Эволюцию врагов цепочка почти не двигает: все 10 уровней вместе — как одна обычная технология (плюс вклад пакетов).\n\n[font=default-bold]Совет[/font]: изучайте контроль качества как можно раньше — каждый уровень сразу делает новые здания лучше.\n\nВ анимации — распределение ступеней у нового изделия на каждом уровне от 0 до 10.
zzz-defects-ingredients=[font=default-bold]Рецепт принимает ингредиенты только одного качества.[/font] Все предметы-ингредиенты одного крафта должны быть одной ступени: столб −3 и обычную лампу в один рецепт не положить (в анимации справа). Качество рецепта выбирается в окне машины рядом с рецептом.\n\n[font=default-bold]Результат не лучше ингредиентов.[/font] Некоторые рецепты собираются только из готовых изделий (например, столб + лампа → столб с подсветкой). Из ингредиентов −3 выйдет изделие не лучше −3: ни новый бросок, ни режим «Эталонный», ни модули качества, ни «Контроль качества 10» его не улучшат, а бросок брака может сделать ещё хуже. Такой брак исправляет только мастерская доводки.\n\n[font=default-bold]Изделия без брака[/font] (ленты, модули, всё после зелёной науки и другие) выходят обычными даже из бракованных ингредиентов.\n\n[font=default-bold]Ловушка[/font]: изделия без брака всегда обычные, поэтому рецепт, где они смешаны с бракованными готовыми изделиями, примет только обычные. Бракованные придётся сначала довести в мастерской.\n\n[font=default-bold]Материалы[/font] (пластины, шестерни, платы, трубы и т. п.) брака не бывают, поэтому рецепты деталей брак не блокирует.
zzz-defects-buildings=Что меняется у бракованных зданий (множитель ступени: −5 — 33%, −1 — 87%):\n• [font=default-bold]Сборочные автоматы и печи[/font] работают медленнее и тратят больше энергии (−5: скорость 33%, энергия ×3).\n• [font=default-bold]Манипуляторы[/font] медленнее; [font=default-bold]сундуки и инвентари[/font] меньше; [font=default-bold]лаборатории[/font] исследуют медленнее; [font=default-bold]аккумуляторы и цистерны[/font] вмещают меньше. У любого бракованного здания меньше здоровья.\n• [font=default-bold]Столбы[/font] (в анимации): у −5 сторона зоны покрытия меньше на 1 клетку (радиус — на 0,5), провод короче на 1 клетку; −4…−1 получают долю штрафа.\n• [font=default-bold]Буры и качалки[/font] медленнее, сильнее загрязняют и истощают залежь быстрее: −1 — 200% обычного расхода, −2 — 300%, −3 — 400%, −4 — 500%, −5 — 600%. Это не зависит от уровня контроля. Настоящий расход — в подсказке бура, строка «Расход месторождения (от качества)».\n• [font=default-bold]Ленты[/font] не замедляются; сами ленты, подземные ленты и разделители брака не получают.\n\nБракованными зданиями вполне можно пользоваться — они просто хуже. Заменяйте их обычными по мере доводки.
zzz-defects-workshop=[item=ic-refine-workshop] [font=default-bold]Мастерская доводки[/font] улучшает бракованные изделия. Рецепт: твердотопливный сборочный автомат + 10 ремонтных наборов + 5 базовых плат; открывается исследованием «Твердотопливная механизация». Размер 3×3, нужно электричество.\n\n[font=default-bold]Как пользоваться[/font]\n• Положите изделие в слот изделия, ремонтные наборы — в слоты наборов (манипуляторы раскладывают сами). Рецепт выбирать не нужно.\n• Мастерская расходует [font=default-bold]прочность наборов[/font] постепенно, как лаборатория науку. Набор II даёт вдвое больше ресурса, бракованный набор — меньше.\n• Без наборов или без электричества попытка ждёт и продолжается с того же места.\n• Не принимает броню со слотами оборудования, технику и предметы со своим инвентарём.\n\n[font=default-bold]Попытка[/font] — одна на изделие, после неё изделие всегда выходит наружу:\n• 90% — на ступень лучше, и ещё по 10% на каждую следующую;\n• 10% — без изменений. Хуже изделие не становится и не пропадает.\nПример для −5: −4 — 81%, −3 — 8,1%, без изменений — 10%. Выше обычного мастерская не поднимает. Для следующей попытки изделие подают снова (в анимации — по кругу).\n\n[font=default-bold]Стоимость попытки[/font] не зависит от ступени, только от изделия: 2,5 базовых набора × S × H, по 4 с на набор. S — по числу видов науки самого раннего исследования изделия (0–1 → 0,2; 2 → 1; 3–4 → 3; 5–6 → 8; 7+ → 20); H = √(здоровье / 300) в пределах 0,5…3. Например: манипулятор — 0,33 набора, сборочный автомат I — 0,5. Точную стоимость показывает панель контроля качества → «Проверить предмет».\n\n[font=default-bold]Обычное и положительное качество[/font]: обычное изделие проходит сразу и бесплатно; положительное — без изменений, а с флажком «Сбрасывать положительное качество до обычного» становится обычным без наборов.
zzz-defects-workshop-modes=Режим доводки выбирается в панели «Доводка» справа от окна мастерской. Наборов за попытку уходит [font=default-bold]столько же[/font], мощность та же — меняются только время и результат:\n• [font=default-bold]I. Обычный[/font] — время ×1, 90% на ступень выше (иногда больше), 10% без изменений.\n• [font=default-bold]II. Точный[/font] — время ×5, гарантированно +2 ступени.\n• [font=default-bold]III. Эталонный[/font] — время ×20, гарантированно сразу обычное качество.\n\n[font=default-bold]Что выбрать[/font] (в анимации каждая мастерская доводит −5 до обычного):\n• Обычный — в среднем 5,1 попытки: быстрее всего по времени, но больше всего наборов.\n• Точный — ровно 3 попытки (−5 → −3 → −1 → 0): наборов меньше, времени втрое больше.\n• Эталонный — 1 попытка: [font=default-bold]меньше всего наборов[/font], но дольше всего.\nМало наборов — эталонный; мало мастерских и времени — обычный.\n\nНовый режим действует со следующей попытки. Режим копируется вместе с настройками мастерской (Shift+ПКМ / Shift+ЛКМ, чертежи).
zzz-defects-production-modes=Сборочные автоматы и печи, которые делают предметы, получают панель [font=default-bold]«Режим производства»[/font] справа от окна машины:\n• [font=default-bold]I. Обычный[/font] — без изменений.\n• [font=default-bold]II. Точный[/font] — операция в 5 раз дольше, средняя мощность ×5 (энергия на операцию ×25). Брак — как при контроле на 4 уровня выше, потери в 10 раз реже, модули качества — как 3 броска.\n• [font=default-bold]III. Эталонный[/font] — операция в 20 раз дольше, мощность ×20 (энергия на операцию ×400). Новые изделия без брака (из бракованных ингредиентов — их ступень), без потерь, модули качества — как 10 бросков.\n\nВ анимации три автомата работают на уровне контроля 0: обычный режим даёт почти только −5, точный — в основном −3, эталонный — только обычное.\n\n[font=default-bold]Когда полезно[/font]: важные здания в начале игры (лаборатории, буры, сборочные автоматы) можно делать в эталонном режиме — медленно, но сразу обычными. Массовые дешёвые изделия выгоднее делать быстро и доводить в мастерской.\n\n• Дополнительная мощность берётся из сети; твердотопливные машины тратят больше топлива. Нехватка энергии замедляет операцию.\n• Новый режим действует со следующей операции. Режим виден в режиме подробной информации (Alt) и копируется чертежами.\n• Режимов нет у ракетной шахты, буров, лабораторий, мастерской, поста и у машин, которые делают только жидкости.
zzz-defects-post=[item=ic-control-post] [font=default-bold]Контрольный пост[/font] принимает партию по заказу и сам раскладывает изделия на три выхода. Рецепт: твердотопливный сборочный автомат + 3 манипулятора + 5 базовых плат («Твердотопливная механизация»). Электричество не нужно.\n\n[font=default-bold]Заказ[/font] (в окне поста): изделие; требование «строго обычное» или «не ниже» выбранного качества; количество; флажок «повторять». Кнопки: запустить, пауза, отменить.\n\n[font=default-bold]Выходы[/font]:\n• [color=0.5,1,0.5]вперёд[/color] — годные изделия заказа (считаются);\n• [color=1,0.85,0.3]влево[/color] — на доводку: брак, а при «строго обычном» ещё и положительное качество;\n• [color=0.8,0.8,0.8]вправо[/color] — прочее: другие предметы и излишек сверх заказа.\nПост сам кладёт изделия на ленту, в сундук или в здание перед выходом. Стрелки выходов поворачиваются клавишей поворота при наведении на пост — само здание не поворачивается.\n\n[font=default-bold]Типичная схема[/font] (в анимации): производство → пост → влево мастерская → обратно на вход поста. Брак ходит по кругу, пока не станет обычным, а годное копится впереди.\n\nМастерская и пост выдают сигналы в логическую сеть и принимают команды (флажок «Сигналы и команды логической сети» в их окнах).
zzz-defects-panel=Панель открывается ярлыком на панели быстрого доступа или клавишей __CONTROL__ic-quality-panel__.\n\n• [font=default-bold]Производство[/font] — уровень контроля, распределение брака сейчас и после следующего уровня, шанс потерь (если они включены), счётчики операций, машины вне обработки с причиной. [font=default-bold]«Проверить предмет»[/font] — получает ли предмет брак и сколько стоит его доводка.\n• [font=default-bold]Доводка[/font] — все мастерские с состоянием и запасом наборов (кнопка показывает мастерскую на карте), статистика попыток, прогноз затрат для выбранного предмета и ступени, оповещения.\n• [font=default-bold]Контроль партий[/font] — все посты с заказом и прогрессом.\n\n[font=default-bold]Сигналы[/font]: мастерская — работает, прогресс, ступень, ресурс наборов, нет наборов, нет изделия, выход заполнен; пост — выполняется, требуется, принято, осталось, ожидает доводки, заказ выполнен, партий. [font=default-bold]Команды[/font] по проводам: «Запустить» (пост), «Пауза», «Остановиться».\n\nОповещения отключаются каждым игроком отдельно: мастерская ждёт наборы дольше 5 секунд; выполнена партия.\n\nПосле «Контроля качества 10» панель и окна перестают говорить о браке и потерях — остаются сведения, нужные для доводки старого брака.
zzz-quality=[font=default-bold]Качество[/font] — ступени [font=default-bold]выше обычного[/font]. Их больше сорока: Хорошее, Добротное, Надёжное, Отличное, Необычное и так далее до Божественного. Все ступени открыты с начала игры.\n\n[font=default-bold]Что даёт качество[/font]: у любого здания больше здоровья, и у каждого типа свой бонус — скорость машин и манипуляторов, размер инвентаря, покрытие и провода столбов, ёмкость, дальность и другое. Чем выше ступень, тем больше бонус. Точные значения — в подсказке предмета или в Факториопедии при наведении на значок [img=quality_info]. В анимации — малый столб и сборочный автомат II трёх первых ступеней.\n\n[font=default-bold]Откуда берётся качество[/font]:\n• [font=default-bold]модули качества[/font] в машинах — главный источник;\n• [font=default-bold]качество ингредиентов[/font]: рецепт выбранного качества делает результат того же качества, а модули могут поднять его выше;\n• [font=default-bold]переработка[/font] с модулями качества.\n\n[font=default-bold]Когда[/font]: модули качества открываются после «Контроля качества 10» и логистического (зелёного) исследовательского пакета. До этого всё новое — обычное или бракованное.\n\n[font=default-bold]Качество для всего производства[/font] (стартовая настройка, включена): модули качества работают во всех сборочных автоматах, печах и бурах со слотами модулей, а сырьё, руда, детали и промежуточные продукты тоже могут получать качество. Брака у них при этом не бывает никогда.
zzz-quality-modules=[item=quality-module] [item=quality-module-2] [item=quality-module-3] [item=bob-quality-module-4] [item=bob-quality-module-5] [font=default-bold]Модули качества 1–5[/font] дают «Качество: +1…+5%», каждый снижает скорость машины на 20%.\n\n• Ставятся в любую машину со слотами модулей: сборочные автоматы II и выше, печи и буры со слотами, переработчики 2–4.\n• Эффекты всех модулей в машине складываются. Без модулей положительное качество не появляется.\n• Модули тормозят машину, поэтому качество выгоднее для дорогих изделий, где каждое удачное изделие стоит много.\n\n[font=default-bold]Как считается шанс[/font]: эффект из подсказки модуля — ещё не шанс. Шанс повышения за крафт = эффект × 10 × [font=default-bold]шанс перехода[/font] качества ингредиентов. У обычного качества шанс перехода 0,204, поэтому модуль «+1%» даёт 2,04%, а два модуля «+3%» (в анимации) — 12,24%.\n\nПодсказка модуля сама показывает готовые шансы для каждой ступени: строки «Обычное→Хорошее: …», «Хорошее→Добротное: …».\n\nВ анимации шестерни делает сам движок: справа — сколько шестерней каждой ступени вышло на самом деле и сколько ожидалось по расчёту.
zzz-quality-ladder=[font=default-bold]Шанс перехода[/font] есть у каждого качества — это то, насколько легко подняться с него на следующую ступень:\n• Обычное — 0,204; Хорошее — 0,200; Добротное — 0,196; дальше каждая ступень на 0,004 меньше.\n• Поэтому [font=default-bold]первое повышение самое лёгкое[/font], а каждое следующее чуть труднее.\n\n[font=default-bold]Как идёт бросок[/font]:\n1. С шансом «эффект × 10 × шанс перехода ингредиентов» результат поднимается на ступень.\n2. После этого игра бросает ещё раз с шансом перехода уже достигнутой ступени (около 20%), и так далее. Поэтому иногда результат перескакивает сразу на 2–3 ступени.\n\nТаблица в анимации: для каждой ступени ингредиентов — шанс перехода и вероятность, что результат останется прежним или поднимется на 1, на 2, на 3 и больше ступеней. Наборы модулей сменяются: 1 × модуль 1, 4 × модуль 1, 4 × модуль 3, 4 × модуль 5.\n\n[font=default-bold]Пример[/font]: 4 × модуль 3 (эффект +12%), обычные ингредиенты: повышение 24,5%; из них около 4 из 5 — на одну ступень, около 1 из 5 — сразу на две и больше.
zzz-quality-ingredients=[font=default-bold]Рецепт выбранного качества[/font]: в окне машины рядом с рецептом выбирается качество. Машина берёт ингредиенты только этого качества и делает результат того же качества (в анимации: обычные, хорошие и добротные пластины → шестерни того же качества). Модули качества могут поднять результат ещё выше — бросок начинается от качества ингредиентов.\n\n• Все предметы-ингредиенты одного крафта должны быть [font=default-bold]одного качества[/font]. Жидкости качества не имеют.\n• Качество сохраняется по цепочке: из хороших пластин выйдут хорошие шестерни, из хороших шестерней — хорошие изделия. Модули на каждом звене цепочки могут поднять его ещё.\n• Качественный предмет не годится для рецепта обычного качества. Лишнее положительное качество можно сбросить в мастерской доводки (флажок «Сбрасывать положительное качество до обычного») или переработать.\n\nИзделие из бракованных ингредиентов не лучше их ступени — см. «Брак ингредиентов».
zzz-quality-recycling=[item=recycler-1] [item=recycler-2] [item=recycler-3] [item=recycler] [font=default-bold]Переработчики 1–4[/font] разбирают изделие обратно и возвращают в среднем [font=default-bold]25%[/font] ингредиентов-предметов (жидкости не возвращаются). Сырьё, сплавы и продукты химии перерабатываются сами в себя — тоже с возвратом 25%.\n\n• Результат [font=default-bold]не хуже качества[/font] исходного изделия, а модули качества в переработчике могут его поднять. Слоты модулей: Переработчик 1 — нет, 2 — два, 3 — три, 4 — четыре.\n• [font=default-bold]Бракованное[/font] изделие при переработке даёт обычные компоненты — ещё один способ избавиться от брака, но дорогой: теряется 75%.\n• [font=default-bold]Цикл качества[/font]: изделие → переработчик с модулями → компоненты → снова изделие. Обычные компоненты снова идут в крафт, улучшенные — в отдельную линию. Каждый круг теряет 75% материала, зато даёт новый бросок качества.\n\nВ анимации Переработчик 4 с модулями качества 3 разбирает обычные железные сундуки: справа — полученные железные пластины по качеству.
zzz-quality-modes=Режимы производства (панель справа от окна машины, подробнее — «Брак и доводка» → «Режимы производства») усиливают и модули качества:\n• [font=default-bold]I. Обычный[/font] — один бросок.\n• [font=default-bold]II. Точный[/font] — как 3 независимых броска; операция в 5 раз дольше, мощность ×5.\n• [font=default-bold]III. Эталонный[/font] — как 10 бросков; операция в 20 раз дольше, мощность ×20.\nШанс повышения = 1 − (1 − p)^броски, где p — обычный шанс модулей. Например, при p = 10%: 10% → 27% → 65%.\n\n[font=default-bold]Важно[/font] (в анимации): шанс за одну операцию растёт, но операций становится в 5 и 20 раз меньше, поэтому [font=default-bold]повышений в минуту меньше[/font]. Режимы выгодны, когда дороги ингредиенты, а не время: из того же количества ингредиентов выходит больше качественных изделий.\n\nБез модулей качества режимы положительного качества не дают.
zzz-quality-tools=• [font=default-bold]Подсказка модуля качества[/font]: «Качество: +X%» — эффект модуля; ниже строки «Обычное→Хорошее: …», «Хорошее→Добротное: …» — готовый шанс повышения для ингредиентов каждой ступени.\n• [font=default-bold]Окно машины[/font]: панель режима производства показывает шанс модулей этой машины во всех трёх режимах.\n• [font=default-bold]Факториопедия[/font] (__CONTROL__open-factoriopedia__): значок [img=quality_info] в подсказке — наведите на него, чтобы увидеть значения для каждого качества.\n• [font=default-bold]Helmod[/font]: кнопка с драгоценным камнем в заголовке главного окна открывает «Вероятность качества». Выберите модуль, его качество, число модулей, дополнительную вероятность и режим машины — таблица покажет для каждой ступени ингредиентов, с каким шансом результат останется, поднимется на 1, 2 или 3 и больше ступеней. Планировщик Helmod считает выход изделий по качеству по тем же правилам.\n• Анимация «Шансы и лесенка» в этом разделе показывает то же на примерах.

