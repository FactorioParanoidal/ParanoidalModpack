[mod-setting-description]
paranoidal-disable-vanilla-evolution=Принудительно выключает стандартную эволюцию жуков при создании карты. Будет действовать только эволюция по исследованиям.
stone-path-concrete=Включает замену стандартной графики на графику из мода Concretexture
white-stone=Белая графика каменной дорожки. Действует, только если выключено «Включить: Новое покрытие для кирпича».
white-concrete=Белая графика бетона.
no-clouds=Убирает тени облаков.
no-decor=Убирает траву, кусты, мелкие камни и грязь при генерации карты и вокруг гнёзд.
fitolamps=Включает освещение фитолампами в теплицах и биофермах (только графические изменения).
res_loc_1=Включает замену стандартной графики на графику из мода Yuoki (только графические изменения).
res_loc_2=Включает замену стандартной графики на графику из мода Yuoki (только графические изменения).
res_loc_3=Включает замену стандартной графики на графику из мода Yuoki (только графические изменения).
res_loc_e=Включает замену стандартной графики на графику из мода Yuoki (только графические изменения).
wire=Включает замену стандартной графики на графику из мода ThickerLines
copper_wire=Включает замену стандартной графики на графику из мода ThickerLines
paranoidal-wire-visibility-copper=Делает медные провода между столбами полупрозрачными или невидимыми (только графика). Любое значение кроме 100% убирает тень всех проводов.
paranoidal-wire-visibility-red=Делает красные логические провода полупрозрачными или невидимыми (только графика). Любое значение кроме 100% убирает тень всех проводов.
paranoidal-wire-visibility-green=Делает зелёные логические провода полупрозрачными или невидимыми (только графика). Любое значение кроме 100% убирает тень всех проводов.
paranoidal-comb-graphics=Что берётся из мода comb (BiusArt) для арифметического, сравнивающего и постоянного комбинаторов: иконки (инвентарь, меню крафта, исследование логических сетей) и/или вид построек на земле. Остальное остаётся как без comb. Только графика.
item-drop=Разрушенные сундуки высыпают содержимое
newbie_resourse=НЕ РЕКОМЕНДУЕТСЯ отключать если вы новичок в Paranoidal
zzz-settings=Эта галочка ничего не включает, это подсказка. Часть настроек других модов спрятана двумя модами: «PARANOIDAL: скрыть настройки баланса» и «PARANOIDAL: скрыть косметику». Чтобы увидеть настройки, выключите нужный мод в списке модов. Ваши значения при этом не меняются.

