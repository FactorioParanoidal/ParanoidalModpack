[technology-description]
paranoidal-module-components-1=Лаборатория модулей, корпуса, контакты, платы и процессоры I для изготовления обычных модулей уровней 1–2. Лаборатория модулей исследует специализированные ветки, расходуя модульные процессоры и другие детали вместо обычных научных пакетов. Готовые модули открываются отдельными исследованиями.
paranoidal-module-components-2=Платы и процессоры II для изготовления обычных модулей уровней 3–5. Исследования готовых модулей продолжаются в соответствующих специализированных ветках.
paranoidal-module-components-3=Платы и процессоры III для изготовления обычных модулей уровней 6–8. Для плат этого уровня необходима платиновая проволока. Исследования готовых модулей продолжаются в соответствующих специализированных ветках.
