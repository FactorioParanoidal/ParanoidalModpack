[mod-setting-name]
paranoidal-debug-chat=Отладка: технические сообщения в чате

[mod-setting-description]
paranoidal-debug-chat=Показывать в чате внутренние ошибки и служебные отчёты модов сборки. По умолчанию они записываются только в журнал Factorio. Не меняет поведение модов и не отключает обычные предупреждения об опасности.
