[paranoidal-flame]
turret-description=Принимает перечисленные горючие жидкости. Множитель урона зависит от топливной ценности; струя, горение и подпитка очагов используют штатную механику. Сроки горения общие для всех топлив.
fluid-profile=Огнемёт: множитель штатного урона ×__1__. Общие сроки: горение цели __2__ с; начальный очаг __3__ с, предел при подпитке __4__ с. До исследований и сопротивлений.
removed-gas=Из внутренних буферов огнемётов удалено неподходящее топливо: __1__ ед. в __2__ турелях. Жидкость в трубах сохранена.

[mod-setting-name]
paranoidal-flamethrower-fuels=Огнемёты: баланс жидкого топлива

[mod-setting-description]
paranoidal-flamethrower-fuels=Применяет явный список жидких топлив и множители урона из их топливной ценности. Боевые эффекты остаются штатными. Выключение возвращает исходные допуск и множители сборки. Требуется перезапуск игры.
