[tips-and-tricks-item-description]
zzz-cybersyn=[font=default-bold]Диспетчерская сеть поездов[/font] (мод Project Cybersyn) сама решает, какой поезд, откуда и куда повезёт груз. Расписания писать не нужно.\n\nЕсли вы знакомы с логистическими роботами, всё устроено так же:\n• [font=default-bold]станция запроса[/font] — как сундук запроса;\n• [font=default-bold]станция снабжения[/font] — как пассивный сундук снабжения;\n• [font=default-bold]депо[/font] — как робопорт: здесь поезда ждут работы;\n• [font=default-bold]поезда[/font] — как роботы.\n\nНужно изучить [technology=cybersyn-train-network] «Диспетчерская сеть поездов». Исследование открывает [item=cybersyn-combinator] __ITEM__cybersyn-combinator__ и [item=cybersyn-constant-combinator] __ITEM__cybersyn-constant-combinator__.\n\nМинимальная сеть: одно депо, одна станция снабжения, одна станция запроса и заправленный поезд. В анимации всё это работает по-настоящему: поезд ведёт сам мод, а над локомотивом виден его статус.\n\nДальше по пунктам: как построить каждую станцию, как работает порог, сети, заправка и что делать, если поезда стоят.
zzz-cybersyn-controller=Всё управление идёт через [item=cybersyn-combinator] [font=default-bold]__ITEM__cybersyn-combinator__[/font]. Он ставится [font=default-bold]вплотную к ж/д остановке[/font], не дальше одной клетки, можно по диагонали. Поставленный дальше контроллер станцию в сеть не добавит.\n\nРежим выбирается в окне контроллера. В режиме alt (__CONTROL__show-info__) на нём видна буква:\n• [font=default-bold]D — Депо.[/font] Здесь поезда ждут заказов.\n• [font=default-bold]S — Станция.[/font] Отдаёт и/или просит грузы.\n• [font=default-bold]R — Заправка.[/font] Сюда поезда заезжают за топливом.\n• [font=default-bold]C — Управление станцией.[/font] Второй контроллер у той же станции: свои пороги для отдельных грузов, на выходе видно, что уже едет.\n• [font=default-bold]W — Управление вагоном.[/font] Ставится у рельса напротив вагона, нужен для сложных станций.\n\nДля простой сети хватает D и S.\n\nЦвет буквы S показывает состояние станции:\n• [color=0.4,0.7,1]синяя S[/color] — ждёт;\n• [color=0.4,1,0.4]зелёная >[/color] — к станции едет поезд;\n• [color=1,0.4,0.4]красная S[/color] — заявку выполнить не удалось (см. «Если поезда не едут»).\n\nИмя остановки важно только у депо (см. «Депо»).
zzz-cybersyn-depot=[font=default-bold]Как построить депо[/font]\n1. Поставьте ж/д остановку и рядом __ITEM__cybersyn-combinator__ в режиме «Депо».\n2. Соберите поезд, заправьте его и дайте ему расписание из одной строки — этого депо. Условие ожидания любое.\n3. Поезд приедет в депо и войдёт в сеть. Мод сам перепишет ему расписание и дальше будет отправлять его сам.\n\n[font=default-bold]Важно[/font]\n• В депо поезд должен приехать [font=default-bold]пустым[/font]. Поезд с грузом остаётся в депо, в сеть не входит, а мод выдаёт тревогу. Разгрузите его и снова отправьте в депо (в анимации это правый поезд).\n• Сеть поезд получает от контроллера депо в момент приезда. Если поменять сеть у депо, поезд узнает об этом при следующем заезде.\n• Удобно давать всем депо одной сети одно имя и ставить на их остановках лимит в 1 поезд. Обычные остановки так не называйте, иначе поезд может «вернуться в депо» не туда.\n\n[font=default-bold]Настройки депо[/font]\n• «Обход депо» (включено): поезд, закончивший заказ, может сразу взять новый, не заезжая в депо.\n• «Прикреплять поезд к депо» (выключено): пока флажок снят, поезд возвращается в любое свободное депо с тем же именем.
zzz-cybersyn-provider=[font=default-bold]Станция снабжения[/font] отдаёт грузы в сеть.\n\n1. У остановки, напротив места вагона, поставьте манипуляторы и сундуки. Манипуляторы грузят из сундуков [font=default-bold]в вагон[/font].\n2. Рядом с остановкой поставьте __ITEM__cybersyn-combinator__ в режиме «Станция».\n3. Соедините сундуки проводом с [font=default-bold]входом[/font] контроллера.\n\nСундуки сами сообщают в провод, что в них лежит. [font=default-bold]Положительный[/font] сигнал на входе означает «это я могу отдать».\n\nВ окне контроллера переведите переключатель в положение «Только снабжение»: тогда станция ничего не начнёт просить.\n\nКогда приезжает поезд, на [font=default-bold]выходе[/font] контроллера появляется его заказ со знаком минус: что и сколько погрузить. Поезд стоит, пока в вагоны не погрузят весь заказ, и потом едет на станцию запроса.\n\nСтанция отдаёт груз, только если его не меньше порога запроса (см. «Порог запроса»).
zzz-cybersyn-requester=[font=default-bold]Станция запроса[/font] просит грузы из сети.\n\n1. У остановки — манипуляторы, которые разгружают вагон в сундуки.\n2. __ITEM__cybersyn-combinator__ в режиме «Станция», переключатель «Только запрос».\n3. Сундуки соединены проводом со входом контроллера.\n4. Туда же подключён комбинатор с заявкой: груз с [font=default-bold]отрицательным[/font] числом. Это сколько вы хотите держать на складе, например [item=iron-ore] −8000.\n\nНа входе сигналы складываются: заявка −8000 и 6500 в сундуках дают −1500, то есть не хватает 1500. Как только нехватка дорастёт до [font=default-bold]порога запроса[/font] (по умолчанию 2000), сеть вызовет поезд. Пока поезд едет, мод это учитывает и второй поезд за тем же грузом не шлёт.\n\nДля заявки удобен [item=cybersyn-constant-combinator] [font=default-bold]__ITEM__cybersyn-constant-combinator__[/font]. Это постоянный комбинатор с отдельными полями для порога, приоритета, заблокированных слотов и сетевых масок, количество можно вводить в пачках. Обычный постоянный комбинатор тоже подойдёт.\n\nСо станции запроса поезд уезжает, только когда вагоны пусты. Оставьте на складе место хотя бы под два полных поезда.
zzz-cybersyn-threshold=[virtual-signal=cybersyn-request-threshold] [font=default-bold]Порог запроса[/font] — наименьший размер доставки. Он задаётся этим сигналом на входе контроллера станции запроса. Если сигнала нет, действует настройка карты, по умолчанию [font=default-bold]2000[/font].\n\nДоставка назначается, только если выполнены все три условия:\n• станции запроса не хватает [font=default-bold]не меньше порога[/font];\n• у станции снабжения есть [font=default-bold]не меньше порога[/font];\n• есть свободный поезд [font=default-bold]вместимостью не меньше порога[/font].\n\nПоэтому порог не должен превышать вместимость поезда. Грузовой вагон в сборке — 20 ячеек: железной руды (пачка 200) в него помещается 4000, пластин (пачка 400) — 8000. Если порог больше, поезд не поедет никогда, а буква S станции покраснеет.\n\nБольшой порог — реже рейсы, но нужны склады побольше. Маленький — поезда ездят полупустыми.\n\n• Флажок «Порог в ячейках» в контроллере: порог считается в пачках, а не в штуках.\n• [virtual-signal=cybersyn-fluid-request-threshold] — отдельный порог для жидкостей.\n• Порог для отдельного груза задаёт контроллер «Управление станцией».
zzz-cybersyn-delivery=Что делает сеть, по шагам (в анимации шаги подсвечиваются по ходу поезда):\n\n1. [font=default-bold]Опрос.[/font] Около 30 раз в секунду мод читает входы станций: что лежит на складах, что просят. Доставки, которые уже в пути, учитываются.\n2. [font=default-bold]Пара.[/font] Для каждого груза ищется станция запроса, где не хватает не меньше порога, и станция снабжения, где груза не меньше порога. Из нескольких запросов выбирается тот, у кого выше приоритет, а при равных — тот, кто дольше ждёт. Из нескольких снабжений — с высшим приоритетом, а при равных ближайшее к запросу.\n3. [font=default-bold]Поезд.[/font] Подходит свободный поезд той же сети, вместимостью не меньше порога и разрешённый на обеих станциях. Из таких берётся ближайший к снабжению.\n4. [font=default-bold]Погрузка.[/font] Заказ — сколько не хватает, но не больше, чем есть на снабжении и влезет в поезд. Поезд стоит, пока не погрузит весь заказ.\n5. [font=default-bold]Разгрузка.[/font] На станции запроса поезд стоит, пока вагоны не опустеют.\n6. [font=default-bold]Готово.[/font] Поезд свободен: может сразу взять новый заказ (обход депо), заехать на заправку или вернуться в депо.\n\nРасписание поезда мод пишет сам, трогать его не нужно. К станции поезд едет по точке на рельсе, поэтому в окне остановки он появляется, только когда уже приехал.
zzz-cybersyn-bypass=[font=default-bold]Обход депо[/font] у депо включён по умолчанию.\n\nПоезд, разгрузившийся на станции запроса, считается свободным уже по дороге в депо. Если в это время появится новый заказ, мод может отдать его этому поезду, и тот поедет прямо на снабжение, не заезжая в депо.\n\nПоезда меньше ездят порожняком, на путях свободнее, а запасных поездов в депо нужно меньше.\n\nОбход работает, только если топлива у поезда больше топливного порога (настройка карты, по умолчанию 50%). Если меньше, поезд сначала едет на заправку или в депо.\n\nВ анимации руду расходуют быстро, и поезд раз за разом берёт новые заказы прямо с дороги. Счётчик показывает, сколько заказов взято без заезда в депо.\n\nОтключается флажком «Обход депо» в окне контроллера депо.
zzz-cybersyn-refuel=Возить топливо в каждое депо не обязательно: можно построить общую [font=default-bold]заправку[/font].\n1. Поставьте остановку и рядом __ITEM__cybersyn-combinator__ в режиме «Заправка».\n2. Манипуляторы с топливом ставьте там, где встаёт [font=default-bold]локомотив[/font]. До грузовых вагонов они доставать не должны, иначе вагоны забьются углём. Мод проверяет это сам и не пустит на заправку поезд, вагоны которого окажутся напротив манипуляторов.\n\nПосле каждой доставки мод смотрит на топливо. Если его меньше [font=default-bold]топливного порога[/font] (настройка карты, по умолчанию 50%), поезд заезжает на ближайшую заправку своей сети, ждёт, пока манипуляторы закончат, и снова берёт заказы.\n\nЕсли заправки нет, поезд с малым запасом топлива возвращается в депо, и тогда заправлять его должно депо.\n\nУ заправки, как у станций, действуют сеть, приоритет и лимит поездов остановки.\n\nЛокомотив в сборке жжёт химическое топливо, у него 3 ячейки.
zzz-cybersyn-networks=Сеть задаётся сигналом в поле [font=default-bold]«Сеть»[/font] окна контроллера, по умолчанию у всех [virtual-signal=signal-A]. Станции, депо и заправки разных сетей никогда не делят ни поезда, ни грузы.\n\n[font=default-bold]Пример: поезда разной длины.[/font] Короткие станции рассчитаны на поезд «локомотив + вагон», длинные — на два вагона.\n• Короткие депо, снабжение и запрос — сеть [virtual-signal=signal-A].\n• Длинные — сеть [virtual-signal=signal-B].\nКороткий поезд стоит в депо A и ездит только между станциями A, длинный — только между станциями B.\n\nСеть поезд получает от депо, в котором стоит. В качестве сети годится любой виртуальный сигнал, кроме [virtual-signal=signal-everything], [virtual-signal=signal-anything] и сигналов самого мода.\n\nЕсли выбрать сеть [virtual-signal=signal-each], станция будет сразу в нескольких сетях: каждый виртуальный сигнал на её входе станет её сетью (см. «Подсети и маски»).
zzz-cybersyn-masks=Для продвинутых. Если подать на вход контроллера сигнал [font=default-bold]той же буквы, что и его сеть[/font], число этого сигнала станет [font=default-bold]маской подсетей[/font]. Каждый из 32 битов числа — одна подсеть.\n\nСтанции и поезд работают вместе, если их маски совпадают хотя бы в одном бите (побитовое И не равно нулю):\n• 1 (0001) и 5 (0101): общий бит 1, доставка возможна;\n• 5 (0101) и 4 (0100): общий бит 4, возможна;\n• 1 (0001) и 4 (0100): общих битов нет, нельзя.\n\nБез такого сигнала маска равна −1 (все биты): станция во всех подсетях своей сети.\n\nЕсли считать биты не хочется, возьмите два значения и придерживайтесь их по всей базе: [font=default-bold]−1[/font] (все подсети) и [font=default-bold]1[/font] (первая подсеть).\n\nУ [item=cybersyn-constant-combinator] __ITEM__cybersyn-constant-combinator__ есть поле масок с кодировщиком, где биты включаются кнопками.\n\nВ сети [virtual-signal=signal-each] каждый виртуальный сигнал на входе — отдельная сеть, а его число — маска в этой сети.
zzz-cybersyn-priority=[virtual-signal=cybersyn-priority] [font=default-bold]Приоритет[/font] — сигнал на входе контроллера, любое целое число, можно отрицательное. По умолчанию 0. Чем больше число, тем раньше.\n• [font=default-bold]Станции запроса:[/font] станции с меньшим приоритетом груз не отдаётся, пока не обслужены станции с большим.\n• [font=default-bold]Станции снабжения:[/font] груз берётся сначала с той, где приоритет выше.\n• [font=default-bold]Депо:[/font] сначала отправляются поезда из депо с высшим приоритетом.\n• [font=default-bold]Заправки:[/font] поезд едет на ту, где приоритет выше.\n\nПри равном приоритете запросы обслуживаются [font=default-bold]по очереди[/font] (раньше та станция, которой дольше ничего не привозили), а снабжение выбирается ближайшее.\n\n[font=default-bold]Не меняйте приоритет в окне самой ж/д остановки[/font], оставьте 50. Мод ведёт поезда к нужной остановке по координатам, и другой приоритет уводит их не туда. Мод предупредит об этом, а команда /cybersyn-fix-priorities вернёт всем остановкам 50.\n\nКонтроллер «Управление станцией» задаёт второй приоритет для отдельных грузов станции.
zzz-cybersyn-allow-list=[font=default-bold]«Авто-список разрешенных поездов»[/font] (флажок в контроллере станции, включён по умолчанию) не пускает на станцию поезда, которые она не сможет обслужить.\n\nМод смотрит, где вдоль путей стоят манипуляторы, погрузчики и насосы, и пускает только поезда, у которых [font=default-bold]каждый вагон[/font] встаёт напротив них. Поезд должен подходить [font=default-bold]обеим[/font] станциям доставки.\n\nВ анимации манипуляторы стоят только у первого вагона. Поезд «локомотив + вагон» разрешён, поезд с двумя вагонами — нет: второй вагон некому разгрузить.\n\nКороткий поезд при этом допускается и на длинную станцию. Если в сети есть поезда разной длины, разведите их по разным сетям (см. «Сети»).\n\nСписок составляется при постройке контроллера и обновляется, когда рядом строят манипуляторы и рельсы. Кнопка «Обновить список разрешенных поездов» в окне контроллера пересчитывает его вручную.\n\n[font=default-bold]Лимит поездов[/font] ж/д остановки мод соблюдает: к станции одновременно едет не больше поездов, чем указано в лимите. Так можно обойтись без накопителей перед станцией.
zzz-cybersyn-fluids=Жидкости возятся так же, как предметы, только в [item=fluid-wagon] цистернах.\n• Напротив места цистерны ставятся [font=default-bold]насосы[/font], за ними баки. На снабжении насосы качают в цистерну, на запросе — из неё.\n• Баки соединяются проводом со входом контроллера. Заявка — отрицательное количество жидкости, например [fluid=crude-oil] −50000.\n• Для жидкостей можно задать отдельный порог [virtual-signal=cybersyn-fluid-request-threshold]. Без него действует общий порог запроса.\n• За один рейс поезд везёт [font=default-bold]только одну жидкость[/font].\n• Цистерна в сборке вмещает 25 000, порог должен быть не больше.\n• Насосы учитываются в списке разрешённых поездов: цистерна должна вставать напротив насосов.\n• [virtual-signal=cybersyn-reserved-fluid-capacity] оставляет в цистерне свободный объём. Это нужно, если трубы станции общие для нескольких жидкостей.\n\nВ анимации насосы настоящие, а баки показаны числами на постоянных комбинаторах.
zzz-cybersyn-multi=Станция может отдавать сразу несколько грузов, а поезд — везти их за один рейс. Если станции запроса нужны несколько грузов, которые есть на одном снабжении, мод объединяет их в один заказ и урезает его под ячейки вагонов.\n\n[virtual-signal=cybersyn-locked-slots] [font=default-bold]Заблокированные слоты[/font] (сигнал на станции снабжения) оставляют в каждом вагоне столько ячеек пустыми. Без них манипуляторы могут с запасом забить вагон одним грузом, и для другого места не останется.\n\nДля точной погрузки:\n• [font=default-bold]«Условие бездействия»[/font] в контроллере станции: поезд не уедет, пока манипуляторы не закончат;\n• [font=default-bold]«Состояние сети»[/font]: поезд ждёт от остановки сигнала [virtual-signal=signal-check] больше 0 (у остановки включите «Отослать в поезд»);\n• [font=default-bold]W, «Управление вагоном»[/font], у каждого вагона: на выходе заказ именно этого вагона, ячейки вагона фильтруются по порядку, а «Исключать нефильтрованные слоты» закрывает остальные.\n\nТак строят «универсальные» станции, которые отдают любой набор грузов. Это уже продвинутый уровень, для начала хватит одного груза на станцию.
zzz-cybersyn-station-control=[font=default-bold]C, «Управление станцией»[/font], — второй __ITEM__cybersyn-combinator__ у уже работающей станции. Он даёт ей ещё один вход и выход.\n\n[font=default-bold]Вход[/font]\n• Сигнал груза задаёт [font=default-bold]свой порог[/font] для этого груза, например [item=iron-ore] 1000. Остальные грузы станции подчиняются общему порогу.\n• [virtual-signal=cybersyn-priority] на этом входе — приоритет только для перечисленных здесь грузов.\n• На станции снабжения такой порог работает как сброс: если груза больше порога, он уходит с первым же подходящим запросом. Удобно, чтобы вывезти всё со старой шахты.\n\n[font=default-bold]Выход[/font]\n• Все назначенные и ещё не законченные доставки станции: плюс — едет к станции, минус — заберут со станции.\n• [virtual-signal=signal-T] — сколько поездов сейчас едет к станции или стоит на ней (флажок «Подсчёт поездов»).\n\n«Ручное управление инвентарём» нужно для нескольких станций с общим складом: учёт грузов в пути вы тогда ведёте сами, подавая выход C на вход станции.
zzz-cybersyn-problems=[font=default-bold]Поезда не едут? Проверьте по порядку.[/font]\n• Контроллер стоит вплотную к остановке? Команда /cybersyn-find-problems покажет контроллеры, стоящие слишком далеко, и другие ошибки.\n• Станция только что построена? Мод подключает её через 20 секунд.\n• В депо есть поезд? Он пустой, заправлен и приехал в депо по своему расписанию?\n• У депо и обеих станций одна и та же сеть?\n• Нехватка на запросе и запас на снабжении не меньше порога?\n• [font=default-bold]Порог не больше вместимости поезда?[/font] В анимации порог 9000 при вместимости 4000: буква S красная, поезд стоит. Порог поменяли на 2000 — поезд поехал.\n• Поезд подходит под список разрешённых поездов обеих станций?\n• Лимит поездов остановки не исчерпан?\n\n[font=default-bold]Тревоги мода[/font] (значок у станции или поезда): в сети нет поезда, ни у одного поезда не хватает вместимости, поезд не подходит под список разрешённых, поезд задержан в депо с грузом, поезд застрял (10 минут после назначения), сломаны станция или депо.\n\n[font=default-bold]«Диспетчерская»[/font] — окно со всеми станциями, поездами, грузами в пути и тревогами. Открывается ярлыком на панели быстрого доступа или клавишей __CONTROL__cybersyn-toggle-gui__.\n\nПоезд с остатками груза мод никуда не отправит: разгрузите его вручную и снова отправьте в депо.

