[tips-and-tricks-item-description]
zzz-cybersyn=Диспетчерская сеть (мод Project Cybersyn) сама решает, какой поезд, откуда и куда повезёт груз. Расписания писать не нужно.\n\n[font=default-bold]Быстрый старт[/font] (так же сеть собирается в анимации):\n1. Изучите [technology=cybersyn-train-network] «Диспетчерская сеть поездов».\n2. [font=default-bold]Депо.[/font] Ж/д остановка, рядом [item=cybersyn-combinator] __ITEM__cybersyn-combinator__ в режиме «Депо». Пустой заправленный поезд с расписанием «ехать в депо» приедет и войдёт в сеть.\n3. [font=default-bold]Снабжение.[/font] Остановка, сундуки и манипуляторы, которые грузят в вагон. Сундуки проводом подключены ко входу контроллера в режиме «Станция».\n4. [font=default-bold]Запрос.[/font] То же, но манипуляторы разгружают вагон. Ко входу контроллера подключён ещё [item=cybersyn-constant-combinator] __ITEM__cybersyn-constant-combinator__ с грузом со знаком минус, например [item=iron-ore] -8000.\n5. Подведите к контроллерам [font=default-bold]электричество[/font]. Через 20 секунд сеть подключит станции и начнёт возить.\n\nЕсли знакомы логистические роботы: станция запроса работает как сундук запроса, станция снабжения как пассивный сундук снабжения, депо как робопорт, поезда как роботы.
zzz-cybersyn-controller=[item=cybersyn-combinator] __ITEM__cybersyn-combinator__ подключает ж/д остановку к сети.\n• Ставится вплотную к остановке, не дальше 1 клетки, можно по диагонали.\n• [font=default-bold]Нужно электричество.[/font] Без питания контроллер не видит склад, и поезда стоят без всяких предупреждений.\n• У одной остановки не больше одного контроллера каждого режима.\n\nРежим выбирается в окне контроллера, буква на его экране показывает режим:\n• [font=default-bold]D, «Депо»:[/font] здесь поезда ждут заказов.\n• [font=default-bold]S, «Станция»:[/font] отдаёт и просит грузы.\n• [font=default-bold]R, «Заправка»:[/font] сюда поезда заезжают за топливом.\n• [font=default-bold]C, «Управление станцией»[/font] и [font=default-bold]W, «Управление вагоном»:[/font] для сложных станций, см. «Для опытных».\n\nЦвет буквы S показывает состояние станции:\n• [color=0.4,0.7,1]синяя S[/color]: ждёт;\n• [color=0.4,1,0.4]зелёная >[/color]: к ней назначен поезд;\n• [color=1,0.4,0.4]красная S[/color]: заявку сейчас выполнить нельзя, см. «Если поезда не едут».
zzz-cybersyn-depot=[font=default-bold]Как построить[/font]\n1. Ж/д остановка, рядом __ITEM__cybersyn-combinator__ в режиме «Депо».\n2. Поезд пустой и заправленный, в его расписании одна строка: это депо.\n3. Поезд приезжает в депо и входит в сеть. Дальше расписание ему пишет мод.\n\n[font=default-bold]Правила[/font]\n• Поезд с грузом в сеть не войдёт: он останется в депо, а мод поднимет тревогу. Разгрузите его и снова отправьте в депо (правый поезд в анимации).\n• Сеть поезд берёт из контроллера депо в момент приезда.\n• Удобно дать всем депо сети одно имя и лимит 1 поезд на каждой их остановке. Обычные остановки так не называйте.\n\n[font=default-bold]Флажки контроллера[/font]\n• «Обход депо», включён: поезд берёт новый заказ по дороге, не заезжая в депо.\n• «Прикреплять поезд к депо», выключен: поезд возвращается в любое свободное депо с тем же именем.
zzz-cybersyn-provider=Станция снабжения отдаёт груз в сеть.\n1. У места вагона сундуки и манипуляторы, которые грузят [font=default-bold]в вагон[/font].\n2. Рядом с остановкой __ITEM__cybersyn-combinator__ в режиме «Станция», переключатель «Только снабжение».\n3. Сундуки проводом подключены ко [font=default-bold]входу[/font] контроллера.\n\nСундуки сами сообщают в провод, что в них лежит. Плюс на входе значит «могу отдать».\n\nКогда приезжает поезд, на [font=default-bold]выходе[/font] контроллера появляется его заказ со знаком минус: что и сколько погрузить. Поезд стоит, пока не погрузит весь заказ.\n\nГруз отдаётся, только если его не меньше порога запроса.
zzz-cybersyn-requester=Станция запроса просит груз из сети.\n1. У места вагона манипуляторы, которые разгружают вагон в сундуки.\n2. __ITEM__cybersyn-combinator__ в режиме «Станция», переключатель «Только запрос».\n3. Ко входу контроллера проводом подключены сундуки и [item=cybersyn-constant-combinator] __ITEM__cybersyn-constant-combinator__ с [font=default-bold]заявкой[/font]: груз со знаком минус, сколько держать на складе.\n\nНа входе сигналы складываются. Заявка -8000 и 6500 в сундуках дают -1500, то есть не хватает 1500. Когда нехватка дорастёт до порога запроса, сеть вызовет поезд.\n\nГруз в пути мод учитывает. Второй поезд поедет, только если и с грузом первого не хватает не меньше порога.\n\n• Поезд уезжает, когда вагоны пусты. Оставляйте на складе место хотя бы под два полных поезда.\n• Качество учитывается. Хорошие пластины или бракованные здания для сети отдельный груз: заявку на обычные они не закроют.\n• В комбинаторе заявок есть поля для порога, приоритета и масок, количество можно задать в пачках. Обычный постоянный комбинатор тоже подойдёт.
zzz-cybersyn-threshold=[virtual-signal=cybersyn-request-threshold] [font=default-bold]Порог запроса[/font] задаёт наименьший размер доставки. Это сигнал на входе контроллера станции запроса. Без него действует настройка карты: 2000.\n\nДоставка назначается, когда:\n• станции запроса не хватает не меньше порога;\n• у станции снабжения есть не меньше порога;\n• у свободного поезда вместимость не меньше порога.\n\n[font=default-bold]Порог не должен быть больше вместимости поезда[/font], иначе поезд не поедет никогда. Обычный грузовой вагон в сборке вмещает 20 пачек: 4000 руды (пачка 200) или 8000 пластин (пачка 400). У вагонов Боба ячеек больше.\n\nБольшой порог: рейсы реже, но склады нужны больше. Маленький: поезда ездят полупустыми.\n\n• Флажок «Порог в ячейках»: порог считается в пачках.\n• [virtual-signal=cybersyn-fluid-request-threshold]: отдельный порог для жидкостей.
zzz-cybersyn-delivery=Около 30 раз в секунду сеть опрашивает станции и для каждого груза подбирает запрос, снабжение и поезд.\n• [font=default-bold]Запрос:[/font] с высшим приоритетом. При равных тот, кому дольше ничего не привозили, поэтому грузы делятся по очереди.\n• [font=default-bold]Снабжение:[/font] с высшим приоритетом, при равных ближайшее к запросу.\n• [font=default-bold]Поезд:[/font] свободный, той же сети, вместимостью не меньше порога, разрешённый на обеих станциях. Из таких сначала с высшим приоритетом депо, потом самый вместительный, потом ближайший к снабжению.\n\nЗаказ равен нехватке, но не больше запаса снабжения и вместимости поезда.\n\n[virtual-signal=cybersyn-priority] [font=default-bold]Приоритет[/font] задаётся этим сигналом на входе контроллера. По умолчанию 0, можно и отрицательный. Он есть у станций, депо и заправок.\n\nПриоритет решает, кому везти первым, когда груза ждут несколько станций. В анимации поезд один, а заявок две. Пока запросу 1 с приоритетом 1 не хватает груза, поезд возит только ему. При равных приоритетах возит по очереди. У станции, которой поезд не достался, буква S красная: свободного поезда нет.\n\n[font=default-bold]Не меняйте приоритет в окне самой ж/д остановки[/font], оставьте 50. Мод ведёт поезда по координатам, и другой приоритет уводит их не туда. Команда /cybersyn-fix-priorities вернёт всем остановкам 50.
zzz-cybersyn-bypass=После разгрузки поезд свободен, и мод решает, куда ему ехать.\n\n[font=default-bold]Обход депо[/font] (флажок контроллера депо, включён). Свободный поезд доступен для заказов уже по дороге в депо. Появился заказ: поезд сразу едет на снабжение и в депо не заезжает. Меньше порожних рейсов, нужно меньше запасных поездов.\n\n[font=default-bold]Заправка.[/font] Если топлива меньше половины (настройка карты «Топливный порог»), поезд сначала заезжает на ближайшую заправку своей сети и только потом берёт заказы.\n1. Остановка и __ITEM__cybersyn-combinator__ в режиме «Заправка».\n2. Манипуляторы с топливом там, где встаёт [font=default-bold]локомотив[/font]. До грузовых вагонов они доставать не должны: такой поезд мод на заправку не пустит.\n\nНет заправки: поезд с малым запасом топлива едет в депо, и заправлять его нужно там.\n\nВ анимации поезд через раз возвращается почти без топлива. Тогда он заправляется, в остальные разы сразу берёт новый заказ.
zzz-cybersyn-networks=[font=default-bold]Сеть[/font] задаётся сигналом в поле «Сеть» окна контроллера, по умолчанию [virtual-signal=signal-A]. Станции, депо и заправки разных сетей не делят ни поезда, ни грузы. Поезд получает сеть от своего депо.\n\nОбычный случай: поезда разной длины. Станции под поезд с одним вагоном и их депо в сети [virtual-signal=signal-A], под поезд с двумя вагонами в сети [virtual-signal=signal-B]. Короткие поезда ездят только по станциям A, длинные только по B.\n\nСетью может быть любой виртуальный сигнал, кроме [virtual-signal=signal-everything], [virtual-signal=signal-anything] и сигналов самого мода.\n\n[font=default-bold]Подсети[/font], для опытных. Если на вход контроллера подать сигнал той же буквы, что и его сеть, число станет маской: каждый из 32 битов означает подсеть. Доставка возможна, если у масок есть общий бит: 1 и 5 можно, 5 и 4 можно, 1 и 4 нельзя. Без такого сигнала маска -1, все подсети. Не хотите считать биты: используйте только -1 и 1.\n\nСеть [virtual-signal=signal-each] включает станцию в несколько сетей сразу: каждый виртуальный сигнал на входе становится её сетью, а его число маской.
zzz-cybersyn-allow-list=Флажок [font=default-bold]«Авто-список разрешенных поездов»[/font] у контроллера станции (включён) не пускает поезда, которые станция не обслужит. Мод смотрит, где у путей стоят манипуляторы, погрузчики и насосы, и разрешает поезд, только если напротив них встаёт каждый его вагон. Поезд должен подходить обеим станциям доставки.\n\nВ анимации манипуляторы стоят только у первого вагона: поезд с одним вагоном разрешён, с двумя нет.\n\nКороткий поезд на длинную станцию допускается. Если в сети поезда разной длины, разведите их по разным сетям (см. «Сети и подсети»).\n\nСписок обновляется, когда рядом строят манипуляторы и рельсы. Кнопка «Обновить список разрешенных поездов» в окне контроллера пересчитает его вручную.\n\n[font=default-bold]Лимит поездов[/font] ж/д остановки мод соблюдает: больше поездов, чем в лимите, к станции одновременно не поедет. Накопители перед станциями можно не строить.
zzz-cybersyn-fluids=Жидкости возят так же, как предметы, только в [item=fluid-wagon] цистернах.\n• У места цистерны стоят насосы, за ними баки. На снабжении насосы качают в цистерну, на запросе из неё.\n• Баки подключены проводом ко входу контроллера. Заявка: жидкость со знаком минус, например [fluid=crude-oil] -50000.\n• Порог для жидкостей задаёт [virtual-signal=cybersyn-fluid-request-threshold], без него действует общий порог.\n• Обычная цистерна в сборке вмещает 25 000, порог должен быть не больше.\n• За рейс поезд везёт только одну жидкость.\n• Насосы входят в список разрешённых поездов: цистерна должна вставать напротив них.\n\nВ анимации насосы настоящие, а запасы баков показаны числами.
zzz-cybersyn-multi=[font=default-bold]Несколько грузов в одном поезде.[/font] Если станции запроса нужны разные грузы, которые есть на одном снабжении, мод собирает их в один заказ и урезает под ячейки вагонов. Чтобы манипуляторы не забили вагон одним грузом:\n• [virtual-signal=cybersyn-locked-slots] на снабжении оставляет в каждом вагоне столько ячеек пустыми;\n• флажок «Условие бездействия»: поезд ждёт, пока манипуляторы закончат;\n• флажок «Состояние сети»: поезд ждёт от остановки [virtual-signal=signal-check] больше 0 (у остановки включите «Отослать в поезд»).\n\n[font=default-bold]W, «Управление вагоном»[/font], ставится у рельса напротив вагона. На его выходе заказ именно этого вагона, а ячейки вагона фильтруются по порядку. Так строят станции, которые точно грузят любой набор грузов.\n\n[font=default-bold]C, «Управление станцией»[/font], второй контроллер у станции.\n• Вход: сигнал груза задаёт для него свой порог, [virtual-signal=cybersyn-priority] задаёт свой приоритет перечисленным грузам. На снабжении свой порог вывозит груз с первым же запросом: так удобно опустошить старую шахту.\n• Выход: все доставки в пути (плюс едет к станции, минус заберут) и [virtual-signal=signal-T], число поездов к станции.
zzz-cybersyn-problems=[font=default-bold]Поезда не едут? Проверьте по порядку.[/font]\n1. Есть ли у контроллеров электричество?\n2. Контроллер стоит вплотную к остановке? Команда /cybersyn-find-problems найдёт далёкие контроллеры и другие ошибки.\n3. Станции больше 20 секунд? Новую мод подключает не сразу.\n4. В депо есть пустой заправленный поезд, который приехал туда по расписанию?\n5. У депо и обеих станций одна сеть?\n6. Нехватка на запросе и запас на снабжении не меньше порога? Совпадает качество груза?\n7. [font=default-bold]Порог не больше вместимости поезда?[/font] В анимации порог 9000 при вместимости 4000: буква S красная, поезд стоит. Порог исправили на 2000, и поезд поехал.\n8. Поезд проходит список разрешённых обеих станций, а лимит поездов остановки не исчерпан?\n\n[font=default-bold]Тревоги мода[/font] (значок у станции или поезда) называют причину: в сети нет поезда, мала вместимость, поезд не в списке разрешённых, поезд с грузом задержан в депо, поезд застрял (10 минут после отправки).\n\n[font=default-bold]«Диспетчерская»[/font] (ярлык на панели или __CONTROL__cybersyn-toggle-gui__) показывает все станции, поезда, грузы в пути и тревоги.\n\nПоезд с остатками груза мод не отправит: разгрузите его и снова отправьте в депо.

