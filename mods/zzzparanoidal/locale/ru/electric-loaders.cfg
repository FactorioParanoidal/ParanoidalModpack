[mod-setting-description]
paranoidal-miniloader-energy-multiplier=Масштабирует расход энергии на предмет и простой электрических погрузчиков Paranoidal. По умолчанию: 4; диапазон: 0,01–100. Расход при полной ленте указан в подсказке каждого погрузчика. Требует перезапуска.
paranoidal-loader-auto-connect=Автоматически выбирает ориентацию входа/выхода новых электрических погрузчиков по соседним лентам и контейнерам. Действует также при строительстве роботами и скриптовом строительстве с событиями; клонированные погрузчики сохраняют свою ориентацию. Уже установленные погрузчики не перестраивает.

