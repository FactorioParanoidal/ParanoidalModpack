[tips-and-tricks-item-description]
zzz-railway=[font=default-bold]Железная дорога в Paranoidal[/font] появляется раньше и устроена строже, чем в обычной игре. На схеме — путь развития: деревянные рельсы → обычные → улучшенные локомотивы → электровозы и маглев; числа — максимальная скорость в км/ч.\n\n[font=default-bold]Главные отличия[/font]:\n• Первая дорога — [item=scrap-rail] __ITEM__scrap-rail__, уже на красной науке ([technology=JunkTrain_tech] «Простейшие паровозы»).\n• Обычные [item=rail] __ITEM__rail__ требуют бетон и зелёную науку ([technology=railway] «Железные дороги»).\n• Вагоны меньше обычного: [entity=cargo-wagon] __ENTITY__cargo-wagon__ — 20 ячеек, [entity=fluid-wagon] __ENTITY__fluid-wagon__ — 25 000.\n• У локомотивов КПД 20–45%: топлива уходит в 2–5 раз больше.\n• Скорость поезда — [font=default-bold]средняя[/font] скорость его локомотивов с учётом топлива; вагоны её не ограничивают.\n• Тяжёлый груз замедляет разгон, а в поворотах поезд сбрасывает скорость.\n• Качество заметно: у локомотивов высших ступеней мощность до ×5 и скорость до ×2, у вагонов ячеек до ×8.\n\nДальше: деревянные рельсы, светофоры, перекрёстки, станции, подвижной состав, топливо, тяжёлые составы, спарка, электровозы, надземные рельсы, управление. Автоматические доставки — раздел «Диспетчерская сеть поездов».
zzz-railway-wood=[technology=JunkTrain_tech] «Простейшие паровозы» (20 красных пакетов) открывают [item=scrap-rail] __ITEM__scrap-rail__, [entity=yir_usl] __ENTITY__yir_usl__ и [entity=yir_us_cargo] __ENTITY__yir_us_cargo__. Затем [technology=automated-scrap-rail-transportation] «Простейшая автоматика» даёт примитивные станцию и светофоры, а [technology=scrap-fluid-handling] «Простейшие цистерны» — [entity=yir_us_fluid] __ENTITY__yir_us_fluid__ на 5 000 и [entity=scrap-fluid-pump] __ENTITY__scrap-fluid-pump__.\n\n[font=default-bold]Деревянные рельсы ломаются от скорости.[/font] Пока поезд едет быстрее 80 км/ч, каждый деревянный рельс под ним копит 1 единицу урона за каждый км/ч сверх 80 (проверка раз в 20 тиков); урон приходит, когда поезд рельс покидает. У прямых рельсов 50 здоровья, у изогнутых — 100. [entity=yir_usl] МК0 ездит 54 км/ч и рельсы не портит, а [entity=locomotive] __ENTITY__locomotive__ на полном ходу (259 км/ч) ломает их за один проезд. В анимации сверху едет МК0, снизу — разогнанный локомотив.\n\n• Вагоны МК0 короткие и вмещают мало: грузовой — 10 ячеек.\n• Примитивные станцию и светофоры роботы ставят только на деревянные рельсы; на обычных рельсах их убирают и возвращают предмет. Вручную ставить можно куда угодно.\n• [font=default-bold]Переход на обычные рельсы[/font] (после «Железных дорог»): рецепт «2 деревянных рельса + 6 бетона → 2 рельса», планировщик улучшений заменяет уложенные деревянные рельсы обычными, а примитивные станцию и светофоры — обычными (их рецепты замены открывает «Автоматизация железных дорог»).\n• Сначала замените рельсы, потом пускайте быстрые локомотивы.
zzz-railway-signals=[entity=rail-signal] __ENTITY__rail-signal__ делит путь на [font=default-bold]блоки[/font]. В блоке может быть только один поезд: светофор на входе в занятый блок горит [color=1,0.35,0.35]красным[/color], и следующий поезд ждёт перед ним. [color=0.45,1,0.45]Зелёный[/color] — блок свободен, [color=1,0.85,0.3]жёлтый[/color] — блок уже обещан подъезжающему поезду.\n\nВ анимации передний поезд разгружается на станции, а следующие ждут у красных светофоров. Цветные полосы под путём — блоки: зелёная — свободен, красная — занят.\n\n• Светофор ставится [font=default-bold]справа[/font] по ходу движения. Путь со светофорами только с одной стороны — односторонний: поезд не поедет мимо светофора, который стоит к нему спиной.\n• Для движения в обе стороны нужны светофоры с обеих сторон пути, но проще и быстрее — две односторонние колеи.\n• Делайте блоки не короче поезда, иначе длинный поезд займёт сразу два блока.\n• Без светофоров вся связанная дорога — один блок: два поезда на ней будут ждать друг друга.\n• Примитивные светофоры работают так же.
zzz-railway-chain=[entity=rail-chain-signal] __ENTITY__rail-chain-signal__ пропускает поезд, только если свободен и путь [font=default-bold]за следующим блоком[/font] — до ближайшего обычного светофора. Ставьте его [font=default-bold]перед перекрёстком или развилкой[/font], а обычный светофор — сразу за ними.\n\nВ анимации горизонтальный поезд стоит на станции сразу за перекрёстком. Следующий ждёт у проходного светофора перед перекрёстком, и вертикальные поезда спокойно проезжают. С обычным светофором он заехал бы на перекрёсток, встал там и перекрыл обе дороги.\n\n[font=default-bold]Правило[/font]: на входе в перекрёсток и внутри него — проходные светофоры, на выходе — обычные. Блок за выходом должен вмещать поезд целиком.\n\n• [color=0.45,1,0.45]Зелёный[/color] — путь свободен до выхода; [color=1,0.35,0.35]красный[/color] — выход занят; [color=0.4,0.65,1]синий[/color] — на развилке одни выходы свободны, другие заняты: поезд решит по своему маршруту.\n• Примитивный проходной светофор работает так же.
zzz-railway-stations=[entity=train-stop] __ENTITY__train-stop__ ставится справа от рельса по ходу движения; поезд останавливается так, чтобы его головной локомотив стоял у станции.\n\n[font=default-bold]Расписание[/font] задаётся в окне поезда: список станций и условия ожидания («Полный груз», «Пустой груз», «Время», «Бездействие», сигналы и другие). По расписанию поезд ездит в автоматическом режиме.\n\nВ анимации поезд с локомотивами на обоих концах возит руду: на левой станции манипуляторы загружают вагон, на правой — разгружают. Такой «челнок» ездит туда и обратно по одному пути без разворотного кольца.\n\n• [font=default-bold]Одинаковые имена[/font]: несколько станций с одним именем — один пункт назначения; поезд едет к ближайшей доступной.\n• [font=default-bold]Лимит поездов[/font] в окне станции — сколько поездов может одновременно ехать к ней. Остальные ждут, пока не освободится место. С лимитами много станций с одним именем работают без пробок.\n• Логическая сеть может включать и выключать станцию, задавать её лимит и читать груз поезда.\n• Локомотив, развёрнутый назад, поезд вперёд не тянет — в челноке тянет тот, что смотрит по ходу (см. «Спарка локомотивов»).
zzz-railway-rolling-stock=На схеме для каждого локомотива — [color=0.4,0.7,1]скорость[/color] (км/ч), [color=1,0.65,0.25]мощность[/color] (кВт) и [color=0.6,0.9,0.35]КПД[/color]; справа — вместимость грузовых вагонов (ячейки).\n\n• [entity=yir_usl] __ENTITY__yir_usl__ — 54 км/ч, 200 кВт, КПД 20%.\n• [entity=locomotive] __ENTITY__locomotive__ — 259 км/ч, 800 кВт, КПД 25%.\n• [entity=bob-locomotive-2] __ENTITY__bob-locomotive-2__ — 367 км/ч, 1 100 кВт, 30%; [entity=bob-locomotive-3] __ENTITY__bob-locomotive-3__ — 432 км/ч, 1 350 кВт, 35% ([technology=bob-railway-2] «Подвижной состав» 2 и 3).\n• [entity=bob-armoured-locomotive] Бронированные локомотивы 1–3 — 216, 324 и 346 км/ч, 5 000–12 500 здоровья и большая сетка оборудования, но они тяжелее ([technology=bob-armoured-railway] «Бронированный подвижной состав»).\n• [entity=bet-locomotive] __ENTITY__bet-locomotive__ — 432 км/ч, 1 000 кВт, 40%, на аккумуляторах; [entity=hiend_loco] __ENTITY__hiend_loco__ — 432 км/ч, 1 800 кВт, 45%.\n\n[font=default-bold]Вагоны[/font]: [entity=cargo-wagon] грузовой — 20 ячеек (вдвое меньше, чем в обычной игре), MK2 — 40, MK3 — 60; бронированные — 40, 60 и 80; на магнитной подушке — 60; МК0 — 10. Цистерны — 25 000, 37 500 и 50 000, МК0 — 5 000.\n\n• [entity=flamethrower-wagon] __ENTITY__flamethrower-wagon__ ([technology=flamethrower-wagon] «Огнемётный вагон») — цистерна на 5 000 с двумя огнемётными турелями, которые стреляют её жидкостью.\n• У вагонов Bob есть сетка оборудования — для щитов, батарей и другого оборудования техники.\n• Медленный локомотив в составе тормозит весь поезд: скорость — среднее по локомотивам.
zzz-railway-fuel=Локомотивы сборки сжигают топливо с КПД 20–45% (в обычной игре — 100%), поэтому угля уходит в 2–5 раз больше. Хорошее топливо выгоднее: в нём больше энергии на ячейку, и оно ускоряет поезд.\n\nНа схеме для каждого топлива — множитель [color=1,0.65,0.25]разгона[/color] и [color=0.4,0.7,1]максимальной скорости[/color]:\n• [item=coal] уголь, древесина и прочее обычное топливо — ×1 и ×1;\n• [item=solid-fuel] — ×1,1 и ×1,05; [item=angels-pellet-coke] — ×1,1 и ×1,2;\n• [item=rocket-fuel] — ×1,2 и ×1: разгон быстрее, но [font=default-bold]скорость не выше[/font];\n• [item=bob-enriched-fuel] — ×1,5 и ×1,1; [item=high-octane-enriched-fuel] — ×1,9 и ×1,3 — лучший множитель скорости;\n• [item=nuclear-fuel] — ×2 и ×1,25; [item=clowns-turbonuclear-fuel] — ×2,5 и ×1,25;\n• аккумуляторы электровоза [item=bet-fuel-1-full] MK1–MK4 — разгон ×1,5 / 2 / 2,5 / 3,5, скорость ×1 / 1,5 / 2 / 3.\n\n• Множитель берётся от топлива, которое горит сейчас: держите в локомотиве один вид топлива.\n• [technology=braking-force-1] «Сила торможения» укорачивает торможение — поезда ходят плотнее.
zzz-railway-overload=Груз утяжеляет поезд. Разгон умножается на вес состава / (вес состава + вес груза): полная ячейка груза весит 150, единица жидкости — 0,12. Полный обычный грузовой вагон (20 ячеек = 3 000) весит вчетверо больше пустого (1 000). На схеме: локомотив с пустым вагоном — разгон 100%, с полным — 50%, с тремя полными — 36%; справа — скорость в повороте.\n\n• Разгон не падает ниже 10% от пустого состава. Если груз упирается в этот минимум, приходит тревога «Поезд перегружен».\n• [font=default-bold]В поворотах[/font] поезд едет не быстрее половины своей максимальной скорости, в ручном режиме тоже.\n• Справа от окна поезда — панель «Нагрузка поезда»; команда [font=default-bold]/otsr[/font] пишет то же для поезда под курсором.\n• Помогает: больше локомотивов, спарка, топливо с множителем разгона, прямые пути без лишних поворотов.
zzz-railway-mu=Локомотив, развёрнутый назад, поезд вперёд не тянет. [technology=multiple-unit-train-control] «Система многих единиц» (после «Автоматизации железных дорог») включает [font=default-bold]спарку[/font]: два локомотива одного типа и качества, сцепленные вплотную и развёрнутые в разные стороны, тянут вместе — тот, что смотрит по ходу, получает мощность ×2. На схеме: без спарки тянет один, со спаркой — оба.\n\n• [technology=adv-multiple-unit-train-control] «Беспроводная система многих единиц» собирает пары в любом месте состава, в том числе через вагоны: локомотивы на двух концах поезда — челнок, который тянет в обе стороны в полную силу.\n• Топливо и отработанное топливо в составе со спаркой выравниваются раз в 5 секунд.\n• В режиме подробной информации (Alt) над локомотивами видно «спарка +100%» или почему пары нет.\n• Локомотив перестраивается в спарку, только когда поезд стоит.
zzz-railway-electric=[technology=bet-tech] «Аккумуляторные электровозы» открывают [entity=bet-locomotive] __ENTITY__bet-locomotive__, [entity=bet-charger-1] __ENTITY__bet-charger-1__ и аккумуляторный блок поезда. Электровоз не жжёт топливо: в его топливную ячейку кладут [item=bet-fuel-1-full] заряженный блок, а разряженный выпадает в ячейку отработанного топлива.\n\nНа схеме — круговорот: зарядное устройство за электричество превращает [item=bet-fuel-1-empty] разряженный блок в заряженный → манипулятор кладёт его в электровоз на станции → разряженный блок возвращается на зарядку.\n\n• Зарядные устройства 1, 2 и 3: скорость 1, 5 и 25, потребление 2, 10 и 50 МВт. Устройства с низким приоритетом берут только излишки энергии — удобно от солнечных панелей и аккумуляторов.\n• Блоки MK2–MK4 ([technology=bet-fuel-2] «Улучшенные АКБ электровоза») быстрее разгоняют и разгоняют до большей скорости — см. «Топливо и скорость».\n• При разборке электровоза горящий блок возвращается разряженным: заряд теряется.\n• [technology=hiend_train] «Поезда на магнитной подушке» (1000 пакетов шести видов): [entity=hiend_loco] __ENTITY__hiend_loco__, грузовой вагон и цистерна на магнитной подушке и зарядное устройство 4 (скорость 50, 100 МВт).
zzz-railway-elevated=[technology=elevated-rail] «Надземные рельсы» в сборке открываются раньше обычного: после «Железных дорог», на красной и зелёной науке. [entity=rail-ramp] __ENTITY__rail-ramp__ поднимает путь на эстакаду, [entity=rail-support] опоры её держат. Эстакада проходит над наземными путями, конвейерами и зданиями — так строят развязки без пересечений.\n\nНа схеме — сколько клеток эстакады держит опора каждого уровня:\n• [entity=rail-support] __ENTITY__rail-support__ — 11 клеток, 1 000 здоровья (20 бетона + 10 стали);\n• [entity=paranoidal-rail-support-2] __ENTITY__paranoidal-rail-support-2__ ([technology=paranoidal-rail-support-2] «Усиленные опоры для рельсов», синяя наука) — 16 клеток, 2 000;\n• [entity=paranoidal-rail-support-3] __ENTITY__paranoidal-rail-support-3__ ([technology=paranoidal-rail-support-3] «Мостовые опоры для рельсов», производственная наука) — 24 клетки, 4 000;\n• пандус — 9 клеток. Опоры улучшаются планировщиком улучшений: I → II → III.\n\n[technology=paranoidal-rail-support-power] «Кабель в опорах для рельсов» прячет в каждую опору столб: провод между опорами тянется на 22, 32 и 48 клеток по уровню опоры. Кабель [font=default-bold]передаёт[/font] энергию вдоль эстакады, но здания вокруг не питает.
zzz-railway-control=• __CONTROL__tms-toggle__ с курсором на поезде переключает его между ручным и автоматическим режимом. Без поезда под курсором эта клавиша (или кнопка на панели быстрого доступа после «Автоматизации железных дорог») даёт инструмент выделения: выделите поезда, и их режим переключится. С настройкой «Задавать режим вместо переключения» обычное выделение ставит автоматический режим, а выделение с Shift — ручной.\n• В ручном режиме поезд не следует расписанию: им управляет игрок в локомотиве. В автоматическом игрок в поезде — пассажир.\n• __CONTROL__toggle-rail-layer__ — с планировщиком рельсов переключает, заканчивается путь на земле или на эстакаде.\n• Окно станции показывает лимит поездов и её сигналы; из окна поезда можно отправить его к станции или к временной остановке.

