[paranoidal-victory]
message=[font=default-bold]Поздравляем! Вы победили: ракета ушла в космос.[/font]\n\nИнженер №7 с «Аксиомы-6» прожил здесь 6666 дней и почти починил машину. Вы на той же планете построили ракету.\n\nBuy n Large победу не признаёт: ракеты сторонних производителей она не обслуживает, не страхует и не одобряет.\n\nИграть на этой карте можно сколько угодно. Чем ещё заняться:
bullet-1=Запустить добывающий шаттл: он привозит руду с астероидов.
bullet-2=Собрать орбитальный фабрикатор и наземную фабрикаторную станцию.
bullet-3=Отправить на орбиту солнечный коллектор: наземный ресивер мощности постоянно даёт 1000 МВт.
bullet-4=Изучать бесконечные исследования и открывать достижения.
final=Спасибо за игру.\nКоманда Paranoidal
