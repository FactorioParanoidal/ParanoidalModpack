paranoidal-turret-deploy-delay=Время развёртывания турелей, с
paranoidal-artillery-deploy-delay=Время развёртывания артиллерии, с
paranoidal-turret-deploy-indicator=Показывать кольцо развёртывания турели

[mod-setting-description]
paranoidal-turret-deploy-delay=Только что построенная турель (руками, роботами, наноботами или скриптом) столько секунд не стреляет. Заряжать её уже можно, и враги её уже атакуют. На уже работавшие турели не влияет. 0 — без задержки.
paranoidal-artillery-deploy-delay=То же для артиллерийских турелей. 0 — без задержки.
paranoidal-turret-deploy-indicator=Оранжевое кольцо вокруг разворачивающейся турели: его части гаснут по очереди, а когда кольцо исчезнет, турель открывает огонь.

