[mod-setting-description]
baa-arrow-scale=[img=utility/indication_arrow] Меняет размер указательной стрелки, которую интерфейс использует для наведения на предупреждения. Чем больше число, тем крупнее стрелка; 0 делает её невидимой. Значки предупреждений и причины их появления не меняются.\n[color=#9cdcfe]По умолчанию: 0,2. Диапазон: 0–1. После перезапуска игры.[/color]
baa-arrow-tint=[img=utility/color_picker] Задаёт цвет указательной стрелки предупреждений в HEX: например FF9F1C — оранжевый, FFFFFF — белый. Чтобы задать прозрачность, добавьте в конец ещё две цифры: FFFFFF80 — полупрозрачный белый. Вводите только шестнадцатеричные цифры; знак # необязателен.\n[color=#9cdcfe]По умолчанию: FF9F1C. После перезапуска игры.[/color]
