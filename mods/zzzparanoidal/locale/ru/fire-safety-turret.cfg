pd-fire-safety-turret=Пожарная турель
pd-fire-safety-turret-mk2=Пожарная турель МК-2

[entity-description]
pd-fire-safety-turret=Подключите воду по трубе. Пока в турели есть вода, во всём круге радиусом __1__ клеток ничего не загорается и не детонирует: боеприпасы, турели, ящики, резервуары и трубы с горючим. Струями воды турель тушит огонь и кислоту на земле, рассеивает облака врагов и снимает кислоту, горение и замедление с игрока, техники и построек. Врагов не атакует. Расход воды: __2__ в секунду в дежурном режиме и __3__ в секунду, пока есть что тушить; при нехватке воды струй меньше.
pd-fire-safety-turret-mk2=Подключите воду по трубе. Пока в турели есть вода, во всём круге радиусом __1__ клеток ничего не загорается и не детонирует: боеприпасы, турели, ящики, резервуары и трубы с горючим. Струями воды турель тушит огонь и кислоту на земле, рассеивает облака врагов и снимает кислоту, горение и замедление с игрока, техники и построек. Врагов не атакует. Расход воды: __2__ в секунду в дежурном режиме и __3__ в секунду, пока есть что тушить; при нехватке воды струй меньше.
