pd-fire-safety-turret=Пожарная турель
pd-fire-safety-turret-mk2=Пожарная турель МК-2

[entity-description]
pd-fire-safety-turret=Подключите воду по трубе. Пока в турели есть вода, во всём круге радиусом __1__ клеток ничего не загорается и не детонирует: боеприпасы, турели, ящики, резервуары и трубы с горючим. Огонь на земле гаснет. Врагов не атакует, расходует 5 воды в секунду.
pd-fire-safety-turret-mk2=Подключите воду по трубе. Пока в турели есть вода, во всём круге радиусом __1__ клеток ничего не загорается и не детонирует: боеприпасы, турели, ящики, резервуары и трубы с горючим. Огонь на земле гаснет. Врагов не атакует, расходует 10 воды в секунду.
