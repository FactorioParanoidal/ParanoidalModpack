[item-description]
droid-rifle=Дешевая легкая пехота с дальнобойной, но медленной винтовкой. Сильна числом.
droid-smg=Бронированная пехота с пистолетом-пулеметом.
droid-rocket=Бронированный дроид с ракетной установкой: медленные мощные выстрелы издалека. Хорош против червей и крупных врагов.
droid-flame=Огнеметный дроид в жаростойком титановом корпусе. Осторожнее рядом с деревьями.
terminator=Самый сильный дроид: два лазера на шасси силовой брони.
defender-unit=Звено роботов-защитников, которое остается в армии.
distractor-unit=Звено роботов-приманок, которое остается в армии.
destroyer-unit=Звено роботов-разрушителей, которое остается в армии.
droid-assembling-machine=Разворачивает дроидов: выберите тип дроида рецептом и загрузите дроидов. Они появляются со стороны выхода (поверните, чтобы выбрать сторону) и собираются в отряды. Набрав нужную численность, отряд выходит на охоту, а поредев — возвращается сюда.
droid-guard-station=Разворачивает гарнизон, который держится у поста и восполняет потери. Численность задается в окне поста.
droid-counter=Константный комбинатор, выводящий количество развернутых дроидов каждого типа.
loot-chest=Отряды собирают инопланетные артефакты вокруг себя и телепортируют их в этот сундук.\nОдин на силу.
droid-selection-tool=Рамка по отряду — выбрать его.\nShift + рамка — выбранный отряд атакует с движением туда.\nПКМ рамкой — подобрать дроидов.

