[mod-setting-description]
robotarmy-qrf-distance=Отряды в пределах этого числа тайлов от разрушенного здания своей силы идут туда, вступают в бой и возвращаются на прежнее место. 0 отключает отряд быстрого реагирования.
robotarmy-qrf-vehicles=Уничтожение транспорта (машины, танки, паукотроны, поезда) поднимает отряд быстрого реагирования.
robotarmy-qrf-walls=Уничтожение стен, ворот и простых сущностей с владельцем поднимает отряд быстрого реагирования.
robotarmy-qrf-alerts=Показывать оповещение, когда отряды выдвигаются (не чаще раза в 10 секунд).
robotarmy-targeting-mode=Ближайший враг: атаковать ближайшего врага.\nЗащита сборщика: атаковать врага, ближайшего к ближайшему сборщику дроидов.\nЗачистка радиуса: сначала очистить 500 тайлов вокруг ближайшего сборщика дроидов, затем охотиться.
robotarmy-teleport-stuck=Дроиды, отбившиеся от отряда, телепортируются к нему, если рядом нет игрока, который это увидит.
robotarmy-squad-messages=Оповещения об отрядах без сборщика для отступления и о застрявших отрядах; сообщение в чат о гибели отряда.
robotarmy-debug=Записывает решения отрядов в factorio-current.log.
robotarmy-loot-chest=Добавляет армейский сундук с добычей: отряды собирают предметы, в имени которых есть «artifact» (например, инопланетные артефакты Bob's Enemies), и складывают их в него.
robotarmy-disable-acid-splash-damage=Кислотные лужи червей и плевак на земле не наносят урон. Действует на все сущности, не только на дроидов.
robotarmy-health-scale=Умножает здоровье всех дроидов.
robotarmy-damage-scale=Умножает базовый урон всех дроидов.

