[item-description]
droid-rifle=Дешевая легкая пехота с дальнобойной, но медленной винтовкой. Сильна числом.
droid-scout=Быстрый легкий дроид с радаром: открывает карту на два чанка вокруг себя и далеко видит. Слабое оружие.
droid-sniper=Дроид со снайперской винтовкой: дальность 28, медленные мощные выстрелы. Хрупкий — держите его за линией фронта.
droid-miner=Дроид с винтовкой, который ставит мины там, где воюет: рецепт развертывания загружает 10 мин; одна мина за каждые 5 секунд боя, не рядом с другой миной.
droid-smg=Бронированная пехота с пистолетом-пулеметом.
droid-repair=Бронированный дроид поддержки: чинит дроидов своего отряда (15 здоровья в секунду каждый, делится между поврежденными). Легкое оружие.
droid-laser=Бронированный дроид с лазерной винтовкой: большая дальность, ровный лазерный огонь.
droid-tesla=Цепная молния: каждый выстрел перескакивает еще на четырех врагов вокруг цели. Хорош против стай мелких кусак.
droid-rocket=Бронированный дроид с ракетной установкой: медленные мощные выстрелы издалека; ракета бьет всех врагов в 2 тайлах от места попадания.
droid-poison=Издалека бросает ядовитые капсулы в скопления врагов. Облако вредит только тем, кто дышит, — не дроидам. Себе под ноги не бросает.
droid-flame=Огнеметный дроид в жаростойком титановом корпусе. Осторожнее рядом с деревьями.
droid-heavy=Медленный бронированный танк со скорострельным тяжелым пулеметом. Принимает удар на себя.
terminator=Самый сильный дроид: два лазера на шасси силовой брони.
terminator-plasma=Терминатор, перестроенный вокруг плазменной турели: плазменные заряды бьют и врагов вокруг цели.
defender-unit=Звено роботов-защитников, которое остается в армии.
distractor-unit=Звено роботов-приманок, которое остается в армии.
destroyer-unit=Звено роботов-разрушителей, которое остается в армии.
droid-assembling-machine=Разворачивает дроидов: выберите тип дроида рецептом и загрузите дроидов. Они появляются со стороны выхода (поверните, чтобы выбрать сторону) или собираются у точки сбора, заданной в окне машины, и образуют отряды. Набрав нужную численность, отряд выходит на охоту, а поредев — возвращается сюда; отдыхающие отряды здесь чинятся. Управляется сетью проводов.
droid-guard-station=Разворачивает гарнизон, который держится у поста, восполняет потери и чинится здесь. Численность задается в окне поста. Управляется сетью проводов.
droid-counter=Константный комбинатор, выводящий дроидов силы (каждый тип — сигналом своего предмета-дроида, всех вместе — сигналом «Дроидов в строю»), отряды на охоте, в бою, на сборе, отозванные и в патруле, дроидов, ждущих развертывания, и тревогу. Откройте его, чтобы увидеть, что означает каждый сигнал.
loot-chest=Отряды собирают инопланетные артефакты вокруг себя и телепортируют их в этот сундук.\nОдин на силу.
droid-selection-tool=Рамка по отряду — выбрать его.\nShift + рамка — выбранный отряд атакует с движением туда.\nПКМ рамкой — подобрать дроидов.\nShift + ПКМ рамкой — объединить отряды выделенных дроидов.
robotarmy-drop-pod=Перевозит отряд до 32 дроидов вместе со званиями, убийствами, качеством и здоровьем. Погрузка: кнопка «Погрузить» у отряда в окне «Армия дроидов» (отряд не дальше 30 тайлов, пустой контейнер в инвентаре). Поставьте контейнер на землю: через 3 секунды он откроется, и отряд займет место высадки. Контейнер, разрушенный до открытия, теряет отряд; пустой контейнер можно снова забрать.

