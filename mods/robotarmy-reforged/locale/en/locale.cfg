[mod-setting-description]
robotarmy-qrf-distance=Squads within this many tiles of a destroyed building of their force go there, fight, and return to where they were. 0 turns the quick reaction force off.
robotarmy-qrf-vehicles=Destroyed vehicles (cars, tanks, spidertrons, trains) call the quick reaction force.
robotarmy-qrf-walls=Destroyed walls, gates and other script-owned simple entities call the quick reaction force.
robotarmy-qrf-alerts=Show an alert when squads respond (at most every 10 seconds).
robotarmy-targeting-mode=Nearest enemy: attack the closest enemy.\nDefend assembler: attack the enemy closest to the nearest droid assembler.\nKeep radius clear: first clear 500 tiles around the nearest droid assembler, then hunt.
robotarmy-teleport-stuck=Droids that got separated from their squad are teleported back to it when no player is near enough to see it.
robotarmy-repair-at-base=Percent of max health per second restored to squads resting at a droid assembler and to garrisons at their guard station. 0 turns it off.
robotarmy-squad-messages=Alerts about squads without an assembler to retreat to and stuck squads; a chat message when a squad is lost.
robotarmy-debug=Writes squad decisions into factorio-current.log.
robotarmy-loot-chest=Adds the army loot chest: squads collect items whose name contains "artifact" (for example alien artifacts of Bob's Enemies) and put them into it.
robotarmy-disable-acid-splash-damage=Ground acid puddles of worms and spitters deal no damage. Affects every entity, not only droids.
robotarmy-health-scale=Multiplies the health of every droid.
robotarmy-damage-scale=Multiplies the base damage of every droid.

