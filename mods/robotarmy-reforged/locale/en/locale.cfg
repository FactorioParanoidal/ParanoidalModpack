[item-description]
droid-rifle=Cheap light infantry with a long range, slow firing rifle. Good in numbers.
droid-scout=Fast light droid with a radar: charts the map two chunks around it and sees far. Weak gun.
droid-sniper=Sniper rifle droid: range 28, slow heavy shots. Fragile; keep it behind the line.
droid-miner=Rifle droid that lays land mines where it fights: the deploy recipe loads 10 land mines; one mine every 5 seconds of battle, not next to another mine.
droid-smg=Armoured infantry with a submachine gun.
droid-repair=Armoured support droid: repairs the droids of its squad (15 health per second each, shared among the damaged ones). Light gun.
droid-laser=Armoured droid with a laser rifle: long range, steady laser fire.
droid-tesla=Chain lightning: every shot jumps to up to four more enemies around the target. Good against swarms of small biters.
droid-rocket=Armoured droid with a rocket launcher: slow, strong shots from afar; a rocket hits every enemy within 2 tiles of the impact.
droid-poison=Throws poison capsules at groups of enemies from afar. The cloud only hurts what breathes, not droids. It cannot throw at its feet.
droid-flame=Flamethrower droid with a heat resistant titanium hull. Careful near trees.
droid-heavy=Slow armoured tank with a rapid heavy machine gun. Takes the hits for the squad.
terminator=The strongest droid: twin lasers on a power armour chassis.
terminator-plasma=A terminator rebuilt around a plasma turret: plasma bolts that also hit the enemies around the target.
defender-unit=A wing of defender robots that stays with your army.
distractor-unit=A wing of distractor robots that stays with your army.
destroyer-unit=A wing of destroyer robots that stays with your army.
droid-assembling-machine=Deploys droids: choose the droid type as recipe and insert droid items. Droids appear on the output side (rotate to choose it) or gather at the rally point set in the machine window, and form squads. Squads hunt once they are big enough and come back here when they get too small; resting squads are repaired here. Can be controlled by the circuit network.
droid-guard-station=Deploys a garrison that stays at the station, replaces its losses and is repaired there. The garrison size is set in the station window. Can be controlled by the circuit network.
droid-counter=Constant combinator that outputs the droids of the force (every type as the signal of its droid item, all of them as "Droids alive"), the squads hunting, fighting, gathering, recalled and patrolling, the droids waiting to deploy and the alarm. Open it to see what every signal means.
loot-chest=Squads collect alien artifacts around them and teleport them into this chest.\nOnly one per force.
droid-selection-tool=Drag over a squad: pick it.\nShift + drag: the picked squad attack-moves there.\nRight-drag: pick up droids.\nShift + right-drag: merge the squads of the selected droids.
robotarmy-drop-pod=Carries a squad of up to 32 droids with their ranks, kills, quality and health. Load: "Load" button of a squad in the Droid army window (the squad within 30 tiles, an empty pod in the inventory). Place it on the ground: after 3 seconds it opens and the squad holds the landing site. A pod destroyed before it opens loses its squad; the empty pod can be picked up again.

