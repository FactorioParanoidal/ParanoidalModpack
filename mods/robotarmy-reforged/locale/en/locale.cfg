[item-description]
droid-rifle=Cheap light infantry with a long range, slow firing rifle. Good in numbers.
droid-smg=Armoured infantry with a submachine gun.
droid-rocket=Armoured droid with a rocket launcher: slow, strong shots from afar. Good against worms and big enemies.
droid-flame=Flamethrower droid with a heat resistant titanium hull. Careful near trees.
terminator=The strongest droid: twin lasers on a power armour chassis.
defender-unit=A wing of defender robots that stays with your army.
distractor-unit=A wing of distractor robots that stays with your army.
destroyer-unit=A wing of destroyer robots that stays with your army.
droid-assembling-machine=Deploys droids: choose the droid type as recipe and insert droid items. Droids appear on the output side (rotate to choose it) and form squads. Squads hunt once they are big enough and come back here when they get too small.
droid-guard-station=Deploys a garrison that stays at the station and replaces its losses. The garrison size is set in the station window.
droid-counter=Constant combinator that outputs the number of deployed droids of each type.
loot-chest=Squads collect alien artifacts around them and teleport them into this chest.\nOnly one per force.
droid-selection-tool=Drag over a squad: pick it.\nShift + drag: the picked squad attack-moves there.\nRight-drag: pick up droids.

