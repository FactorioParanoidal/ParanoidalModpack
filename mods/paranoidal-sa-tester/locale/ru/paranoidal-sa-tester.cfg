[mod-name]
paranoidal-sa-tester=Paranoidal SA Tester (Панель тестера Space Age)

[mod-description]
paranoidal-sa-tester=Панель тестера ветки Space Age: команда /sa-test, Ctrl+Shift+T или кнопка на панели быстрых действий.\n\n— Прохождение: исследовать до любой точки после ракеты вместе со всем нужным, показать, чего не хватает и каким действием изучается технология.\n— Планеты: открыть полёты, отправиться на любую планету, посмотреть на неё с карты; создавать, переносить и снабжать платформы, пускать куски астероидов и налёт астероидов.\n— Предметы: любой предмет любого качества, бесконечные сундуки и трубы, наборы каждой планеты и платформы.\n— Режимы: мгновенный крафт, бессмертие, быстрый бег, длинные руки, вечный день, энергия без проводов, скорость игры, враги, разведка, площадки на лаве, воде и в космосе.\n— Проверки: что под курсором и почему не работает, где делается рецепт, свойства поверхности, ресурсы вокруг, отчёт об ошибке в файл.\n\nНовых предметов и рецептов не добавляет. Выключается настройкой карты.

