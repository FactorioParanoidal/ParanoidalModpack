[mod-name]
paranoidal-sa-tester=Paranoidal SA Tester

[mod-description]
paranoidal-sa-tester=Tester panel of the Space Age branch: /sa-test, Ctrl+Shift+T or the shortcut bar button.\n\n— Playthrough: research up to any point after the rocket with everything it needs, see what is missing and which action researches a technology.\n— Planets: unlock travel, go to any planet, look at it on the map; create, move and supply platforms, send asteroid chunks and an asteroid strike.\n— Items: any item of any quality, infinite chests and pipes, kits of every planet and of the platform.\n— Modes: instant crafting, immortality, fast running, long reach, eternal day, power without wires, game speed, enemies, charting, pads on lava, water and in space.\n— Checks: what is under the cursor and why it does not work, where a recipe is made, surface properties, resources around, a bug report file.\n\nAdds no items or recipes. Can be switched off in the map settings.

[controls]
paranoidal-sa-tester-toggle=Open the Space Age tester panel

[shortcut-name]
paranoidal-sa-tester=Space Age tester panel

[mod-setting-name]
paranoidal-sa-tester-enabled=Tester panel available

[mod-setting-description]
paranoidal-sa-tester-enabled=The /sa-test command, __CONTROL__paranoidal-sa-tester-toggle__ and the shortcut bar button open the tester panel for every player. Untick to make the panel unusable in this game.

