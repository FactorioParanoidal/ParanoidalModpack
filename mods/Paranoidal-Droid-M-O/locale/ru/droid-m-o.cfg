[mod-setting-description]
droid-m-o-graphics=Как выглядит Д-ОК: своя модель или его голова на исходном шасси Sweepbot.
droid-m-o-tracks=Инженер, автомобиль или паукотрон после грунта оставляет грязные следы на покрытии, если на этой поверхности есть станция Д-ОК его силы. Выключение запрещает новые следы, но не удаляет старые и не отключает сам учёт грязи на инженере.
droid-m-o-chase-players=Д-ОК может догнать и отчистить подключённого инженера без машины, стоящего на покрытии в пределах 16 клеток от станции. Требуется грязь не ниже 40 из 100 — эквивалент грязи от 10 клеток грунта. Станции должно хватать заряда на путь туда и обратно, а игрок не должен быть уже целью другой станции.
droid-m-o-scanner-texts=Надписи над тем, что Д-ОК нашёл и убрал: «ЧУЖЕРОДНЫЙ ЗАГРЯЗНИТЕЛЬ», «ВСЁ ЧИСТО», что ушло в сундук.
droid-m-o-voice=[entity=droid-m-o] Голос Д-ОК и звук его сирены, для вас. Шум машины (щётка, ролик, зарядка) остаётся.

[string-mod-setting]
droid-m-o-graphics-own=Своя модель Д-ОК
droid-m-o-graphics-overlay=Голова Д-ОК на шасси Sweepbot
