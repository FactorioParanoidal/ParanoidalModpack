[mod-name]
Paranoidal-Droid-M-O=Paranoidal Droid M-O (Дроид Д-ОК)

[mod-description]
Paranoidal-Droid-M-O=Д-ОК — дезинфектор, очиститель корпуса со звёздных лайнеров BnL — теперь на ваших покрытиях. Со своей зарядной станции он выслеживает любой чужеродный загрязнитель: траву и сор, грязные следы инженера, предметы на полу, останки, мелкие обломки (их он разбирает на несколько деталей). Самих грязных инженеров тоже отчищает. Основан на Sweepbot от Klaudia.

[entity-name]
droid-m-o=Д-ОК
droid-m-o-dock=Станция Д-ОК
droid-m-o-contaminant=Чужеродный загрязнитель

[entity-description]
droid-m-o=Дезинфектор, Очиститель Корпуса. Директива: найти чужеродный загрязнитель и уничтожить. Ездит только по покрытиям. На покрытии чистит декорации и грязные следы, рядом с ним — ещё предметы на земле, останки и мелкие обломки. Обломок разбирает за несколько взмахов щётки, 1 деталь за 2 взмаха; детали и предметы везёт на станцию в баке. Инженера, наследившего на покрытии рядом со станцией, отчищает лично.
droid-m-o-dock=Заряжает Д-ОК от электросети. Один Д-ОК в комплекте; если его потерять, через 1 минуту станция соберёт нового. Порт ставится на покрытие. Сундук вплотную к станции принимает всё, что Д-ОК привёз в баке (4 ячейки). BnL напоминает: наши роботы никогда не покидают свою полосу. Почти никогда.

