[technology-description]
droid-m-o=Робот-уборщик BnL со звёздных лайнеров. Чистит покрытия вокруг своей станции и разбирает обломки на детали. «Чистота — услуга BnL. Грязь — ваша личная ответственность».
droid-m-o-battery=С аккумулятором побольше Д-ОК дольше убирает и дальше отъезжает от станции.
droid-m-o-charging=Станции быстрее заряжают своего Д-ОК.

