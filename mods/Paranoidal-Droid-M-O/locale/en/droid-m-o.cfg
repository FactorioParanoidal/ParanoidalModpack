[mod-setting-description]
droid-m-o-graphics=How M-O looks: his own model, or his head on the original Sweepbot chassis.
droid-m-o-tracks=An engineer, car or spidertron coming off the ground leaves muddy prints on paving when a same-force M-O dock exists on that surface. Off prevents new prints, but does not remove old ones or disable the engineer's dirt tracking.
droid-m-o-chase-players=M-O may chase and clean a connected engineer on foot standing on paving within 16 tiles of the dock. Requires at least 40/100 dirt, equivalent to dirt from 10 ground tiles. The dock needs enough battery for the round trip, and another dock must not already have claimed the player.
droid-m-o-scanner-texts=Labels over what M-O finds and cleans: "FOREIGN CONTAMINANT", "ALL CLEAN", what went into a chest.
droid-m-o-voice=M-O's voice and the sound of his siren, for you. Machine noises (brush, roller, charging) stay.

[string-mod-setting]
droid-m-o-graphics-own=M-O's own model
droid-m-o-graphics-overlay=M-O's head on the Sweepbot chassis
