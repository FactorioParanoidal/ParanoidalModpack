[mod-name]
Paranoidal-Droid-M-O=Paranoidal Droid M-O

[mod-description]
Paranoidal-Droid-M-O=M-O, the Microbe Obliterator of the BnL starliners, on your paved floors: from his charging station he hunts every foreign contaminant on the paving — grass and grit, muddy prints the engineer brings in, items on the floor, remains, small wreck debris, which he breaks down for a few parts — and scrubs dirty engineers themselves. Built on Klaudia's Sweepbot.

[entity-name]
droid-m-o=M-O
droid-m-o-dock=M-O station
droid-m-o-contaminant=Foreign contaminant

[entity-description]
droid-m-o=Microbe Obliterator. Directive: find foreign contaminants and obliterate them. Drives only on paved floors. Cleans decoratives and muddy prints on the paving; next to it, items on the ground, remains and small wreck debris too. A piece of debris takes several strokes and gives 1 part every 2 strokes; parts and items ride home in his bin. Any engineer who tracks dirt onto the paving near his station gets scrubbed.
droid-m-o-dock=Charges an M-O from the electric network; one M-O included, and a new one is built 1 minute after he is lost. The port has to be on a paved floor. A chest touching the station takes everything M-O brings home in his bin (4 slots). BnL reminds you: our robots never leave their line. Almost never.

