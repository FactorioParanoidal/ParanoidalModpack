[mod-setting-description]
rsc-fill-concrete=[item=concrete] Автоматически укладывает вокруг шахты бетон и декоративное покрытие при переходе на этапы 4 и 6. Эти плитки не берутся из инвентаря, но бетон для самих строительных рецептов по-прежнему нужен. Запрет укладки плит имеет приоритет.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
rsc-only-in-alt-mode=[item=rocket-silo] Полоса прогресса незавершённой площадки видна только при включённом Alt-режиме. На работу стройки эта настройка не влияет.\n[color=#9cdcfe]По умолчанию: флажок снят. Общая настройка карты.[/color]
rsc-st-dont-place-tiles=[item=concrete] Запрещает моду укладывать плиты вокруг строительных площадок, включая бетон и декоративное покрытие. Это не отключает сами этапы стройки и не меняет требуемые материалы.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
rsc-st-not-removable-silo=[item=rocket-silo] Запрещает разбирать готовую шахту после завершения этапов. Промежуточные площадки регулируются отдельной настройкой.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
rsc-st-not-removable-site=[item=rocket-silo] Запрещает разбирать промежуточные площадки, пока мод ведёт стройку по этапам. Для готовой шахты предусмотрена отдельная настройка.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
rsc-st-work-for-insert-material=[item=rocket-silo] Число выполнений строительного рецепта на каждом этапе укладки материалов. Каждый цикл потребляет ингредиенты и электричество, поэтому большее число увеличивает не только длительность, но и суммарный расход материалов. Это не количество ручных действий игрока.\n[color=#9cdcfe]По умолчанию: 100. Диапазон: 10–99999. После перезапуска игры.[/color]
rsc-st-work-for-remove-stone=[item=stone] Число выполнений рецепта на каждом этапе выемки породы перед переходом дальше. Площадке нужны электричество и свободный выход для извлечённой породы. Больше число — дольше выемка и больше добытой породы; это не число ручных щелчков.\n[color=#9cdcfe]По умолчанию: 500. Диапазон: 10–99999. После перезапуска игры.[/color]
