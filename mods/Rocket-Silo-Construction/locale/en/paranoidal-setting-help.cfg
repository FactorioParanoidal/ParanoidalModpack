[mod-setting-description]
rsc-fill-concrete=[item=concrete] Automatically lays concrete and decorative flooring around the silo on transitions to stages 4 and 6. These floor tiles are not taken from inventory, but construction recipes still require their own concrete. The separate tile-placement ban takes priority.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
rsc-only-in-alt-mode=[item=rocket-silo] The progress bar for an unfinished site is shown only while Alt mode is enabled. This setting does not affect construction.\n[color=#9cdcfe]Default: checkbox unchecked. Shared map setting.[/color]
rsc-st-dont-place-tiles=[item=concrete] Prevents the mod from laying tiles around construction sites, including concrete and decorative flooring. It does not disable construction stages or change their required materials.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
rsc-st-not-removable-silo=[item=rocket-silo] Prevents the finished silo from being deconstructed after its construction stages are complete. Intermediate sites are controlled by a separate setting.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
rsc-st-not-removable-site=[item=rocket-silo] Prevents intermediate construction sites from being deconstructed while the mod advances the build through its stages. The finished silo has a separate setting.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
rsc-st-work-for-insert-material=[item=rocket-silo] Construction-recipe executions required on each material-placement stage. Every cycle consumes ingredients and electricity, so higher values increase both duration and total material cost. This does not count manual player actions.\n[color=#9cdcfe]Default: 100. Range: 10–99999. Requires a game restart.[/color]
rsc-st-work-for-remove-stone=[item=stone] Recipe executions required on each excavation stage before advancing. The site needs electricity and room to output excavated material. Higher values mean longer excavation and more material; this is not a count of manual clicks.\n[color=#9cdcfe]Default: 500. Range: 10–99999. Requires a game restart.[/color]
