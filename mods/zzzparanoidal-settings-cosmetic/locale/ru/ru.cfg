[mod-name]
zzzparanoidal-settings-cosmetic=PARANOIDAL: hide cosmetic settings (ПАРАНОИДАЛ: скрыть косметические настройки)

[mod-description]
zzzparanoidal-settings-cosmetic=Прячет стартовые настройки других модов, которые меняют только внешний вид: цвета, звуки, значки, свет, рескины, — чтобы список настроек не был таким огромным.\n\nСпрятанные настройки продолжают работать с сохранёнными значениями — мод их не меняет. Чтобы увидеть и изменить их, выключите этот мод, поменяйте настройки и включите снова.
