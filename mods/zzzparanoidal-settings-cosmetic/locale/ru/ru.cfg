[mod-name]
zzzparanoidal-settings-cosmetic=PARANOIDAL: скрыть косметику

[mod-description]
zzzparanoidal-settings-cosmetic=Прячет стартовые настройки других модов, которые меняют только внешний вид: цвета, звуки, иконки, свет, рескины. Чтобы их увидеть, выключите этот мод. Ваши значения не меняются.
