[mod-name]
KingsTurret-Shields=King's Turret Shields (Щиты турелей)

[mod-description]
KingsTurret-Shields=Генераторы щита для турелей. Генератор защищает турели своей силы в радиусе одним общим энергетическим щитом, который заряжается от электросети: удар, который уничтожил бы турель, поглощается, остальной урон чинится за счёт щита. Сам себя генератор не защищает. Выключатель для турелей — на панели быстрого доступа. Команды: /kts-stats, /kts-rebuild.

[mod-setting-name]
kts-energy-per-hp=Энергия на единицу щита (кДж)
kts-base-shield=Базовая прочность щита на долю турели
kts-base-recharge=Базовая зарядка на долю турели (единиц в секунду)
kts-idle-drain=Потребление в покое (% прочности, кВт)
kts-research=Щиты требуют исследования
kts-size-steps=Уровней ёмкости на ×10
kts-rate-steps=Уровней зарядки на ×10
kts-max-level=Максимальный уровень исследований
kts-generator-radius=Радиус генератора (клеток)
kts-generator-share=Долей турели в одном генераторе
kts-animated-effect=Анимированный эффект попадания

[mod-setting-description]
kts-energy-per-hp=Сколько энергии щит тратит на одну единицу починенного или поглощённого урона и сколько берёт из сети на одну единицу зарядки.
kts-base-shield=Прочность щита одной доли турели до исследований ёмкости. В генераторе столько долей, сколько задано ниже.
kts-base-recharge=Зарядка одной доли турели до исследований зарядки.
kts-idle-drain=Постоянное потребление каждого генератора. 10 означает: щит на 1000 единиц потребляет 100 кВт.
kts-research=Выключено: все силы, кроме врагов, сразу могут строить генераторы без технологий, с базовыми значениями.
kts-size-steps=Сколько уровней ёмкости увеличивают прочность в 10 раз.
kts-rate-steps=Сколько уровней зарядки увеличивают зарядку в 10 раз.
kts-max-level=Наивысший уровень обеих технологий улучшения. Каждая пара уровней — отдельная скрытая сущность, всего (N+1)².
kts-generator-radius=Генератор защищает турели, центр которых не дальше этого расстояния от его центра.
kts-generator-share=У генератора прочность, зарядка и потребление стольких долей турели.
kts-animated-effect=Выключено: простая вспышка вместо анимированной сферы, когда удар поглощён.

[technology-name]
turret-shields-base=Генератор щита турелей
turret-shields-size=Ёмкость генераторов щита
turret-shields-speed=Зарядка генераторов щита

[technology-description]
turret-shields-base=Здание, которое защищает турели вашей силы в своём радиусе одним энергетическим щитом, заряжаемым от электросети. Открывает выключатель для турелей на панели быстрого доступа.
turret-shields-size=Увеличивает прочность щита всех генераторов.
turret-shields-speed=Ускоряет зарядку всех генераторов щита.

[modifier-description]
turret-shields-size=Ёмкость генераторов щита увеличена
turret-shields-speed=Зарядка генераторов щита ускорена

[entity-name]
kts-shield-generator=Генератор щита турелей
kts-shield-buffer=Генератор щита турелей (энергия)

[entity-description]
kts-shield-generator=Защищает турели вашей силы в радиусе __1__ клеток: удар, который уничтожил бы турель, поглощается, остальной урон чинится за счёт щита. Сам себя не защищает. За турель под несколькими генераторами платит самый заряженный. Нужно электричество.
kts-shield-buffer=Скрытый энергетический буфер генератора щита турелей.

[item-name]
kts-shield-generator=Генератор щита турелей
kts-shield-toggle=Выключатель щитов турелей

[item-description]
kts-shield-toggle=Выделите турели, чтобы снять с них защиту генераторов щита.\nЗажмите Shift, чтобы вернуть щиты выбранным турелям.

[shortcut-name]
kts-shield-toggle=Выключатель щитов турелей

[shortcut-description]
kts-shield-toggle=Выделите турели, чтобы снять с них защиту генераторов щита.\nЗажмите Shift, чтобы вернуть щиты выбранным турелям.

[kts]
command-stats=Параметры генераторов щита вашей силы: прочность, зарядка, потребление, радиус и количество.
command-rebuild=Админ: пересобирает все генераторы щита (их энергетические буферы и список защищаемых турелей).
stats-off=Генераторы щита турелей у вашей силы не исследованы.
stats=Генератор щита: __1__ ед., зарядка __2__ ед./с, потребление в покое __3__ кВт, при зарядке до __4__ кВт, радиус __5__ клеток. Генераторов: __6__, защищено турелей: __7__, запас __8__ ед. Уровни: ёмкость __9__, зарядка __10__. Поглощено ударов: __11__, починок: __12__.
admin-only=Эту команду может использовать только администратор.
rebuilt=Генераторы щита пересобраны: генераторов __1__, защищаемых турелей __2__.
