[mod-name]
KingsTurret-Shields=King's Turret Shields

[mod-description]
KingsTurret-Shields=Shield generators for turrets. A generator protects the turrets of its force within its radius with one shared energy shield charged by the electric network: a hit that would destroy a turret is absorbed, other damage is repaired from the shield. The generator does not protect itself. Turret toggle: shortcut bar. Commands: /kts-stats, /kts-rebuild.

[mod-setting-name]
kts-energy-per-hp=Energy per shield point (kJ)
kts-base-shield=Base shield points per turret share
kts-base-recharge=Base recharge per turret share (points per second)
kts-idle-drain=Idle drain (% of shield points, kW)
kts-research=Shields need research
kts-size-steps=Capacity levels per ×10
kts-rate-steps=Recharge levels per ×10
kts-max-level=Maximum research level
kts-generator-radius=Generator radius (tiles)
kts-generator-share=Turret shares per generator
kts-animated-effect=Animated hit effect

[mod-setting-description]
kts-energy-per-hp=Energy that one point of repaired or absorbed damage takes from the shield, and that one point of recharge takes from the network.
kts-base-shield=Shield points of one turret share before any capacity research. A generator holds as many shares as set below.
kts-base-recharge=Recharge of one turret share before any recharge research.
kts-idle-drain=Constant draw of every generator. 10 means: a shield of 1000 points draws 100 kW.
kts-research=Off: every force except enemies can build generators at once, without technologies, with base values.
kts-size-steps=Number of capacity levels that multiply the shield points by 10.
kts-rate-steps=Number of recharge levels that multiply the recharge by 10.
kts-max-level=Highest level of both upgrade technologies. Every pair of levels is a separate hidden entity, (N+1)² in total.
kts-generator-radius=A generator protects the turrets whose centre is within this distance of its centre.
kts-generator-share=A generator has the shield points, recharge and drain of this many turret shares.
kts-animated-effect=Off: a plain flash instead of the animated bubble when a hit is absorbed.

[technology-name]
turret-shields-base=Turret shield generator
turret-shields-size=Shield generator capacity
turret-shields-speed=Shield generator recharge

[technology-description]
turret-shields-base=A building that protects the turrets of your force in its radius with one energy shield charged by the electric network. Unlocks the turret toggle in the shortcut bar.
turret-shields-size=Increases the shield points of all shield generators.
turret-shields-speed=Increases the recharge of all shield generators.

[modifier-description]
turret-shields-size=Shield generator capacity increased
turret-shields-speed=Shield generator recharge increased

[entity-name]
kts-shield-generator=Turret shield generator
kts-shield-buffer=Turret shield generator (energy)

[entity-description]
kts-shield-generator=Protects the turrets of your force within __1__ tiles: a hit that would destroy a turret is absorbed, other damage is repaired from the shield. Does not protect itself. A turret covered by several generators is paid for by the one with the most charge. Needs electricity.
kts-shield-buffer=Hidden energy buffer of a turret shield generator.

[item-name]
kts-shield-generator=Turret shield generator
kts-shield-toggle=Turret shield toggle

[item-description]
kts-shield-toggle=Select turrets to take them out of the protection of shield generators.\nHold Shift to give the shields back to the selected turrets.

[shortcut-name]
kts-shield-toggle=Turret shield toggle

[shortcut-description]
kts-shield-toggle=Select turrets to take them out of the protection of shield generators.\nHold Shift to give the shields back to the selected turrets.

[kts]
command-stats=Shield generator values of your force: points, recharge, power, radius and counts.
command-rebuild=Admin: rebuilds all shield generators (their energy buffers and the list of protected turrets).
stats-off=Turret shield generators are not researched for your force.
stats=Shield generator: __1__ points, recharge __2__ points/s, idle drain __3__ kW, recharge draw up to __4__ kW, radius __5__ tiles. Generators: __6__, protected turrets: __7__, stored __8__ points. Levels: capacity __9__, recharge __10__. Absorbed hits: __11__, repairs: __12__.
admin-only=Only an admin can use this command.
rebuilt=Shield generators rebuilt: __1__ generators, __2__ protected turrets.
