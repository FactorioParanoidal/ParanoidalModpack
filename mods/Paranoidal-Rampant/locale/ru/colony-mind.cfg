[mod-setting-name]
rampantFixed--colonyMind=Разум колонии: наблюдение
rampantFixed--colonyOrders=Разум колонии: разрешить приказы

[mod-setting-description]
rampantFixed--colonyMind=Сравнивает два фронта по донесениям наземных отрядов. В /rampantAIReport видно, какую задачу колония предпочла для уже оплаченного отряда и почему. Без отдельного разрешения колония только наблюдает. Требует тяжёлых моделей ИИ; не работает при классическом поведении.
rampantFixed--colonyOrders=Позволяет назначить замеченную уцелевшую постройку целью штатного штурмового отряда после сбора. Новые волны не создаются. Требует включённого наблюдения и тяжёлых моделей; не действует в классическом режиме.

[rampant-colony]
current-mode=Текущий режим разума колонии: __1__. Ниже — накопленные счётчики по режимам.
mode-off=Не действует
mode-unknown=Не зафиксирован
choice-authority=№__1__, режим при сборе на тике __2__: __3__.
mobile-crossed=второй фронт прикрывала машина; затем машину той же модели встретили у рейда, а на втором фронте два отряда уничтожили по постройке
mobile-sites=Замысел №__1__, встречи с машинами: второй фронт — №__2__ на тике __3__; район рейда — №__4__ на тике __5__. Исходную позицию защитника видел боец №__6__. При сборе: машина у рейда №__7__, свидетели у рейда и на втором фронте №__8__ / №__9__.
mobile-trace=Замысел №__1__: машину №__2__ встретили на втором фронте на тике __3__, у рейда — на тике __4__. При сборе машину и постройку подтвердили бойцы №__5__ / №__6__.
mobile-guard=Замысел №__1__: при сборе боец №__2__ заметил защитника №__3__ у постройки №__4__.
mobile-path=Замысел №__1__, чанк ожидаемого штатного хода: __2__, __3__; чанк замеченного защитника: __4__, __5__.
status-shift-off-route=оставлена штатная задача: свидетель не подтвердил защитника на единственном ожидаемом штатном ходе
status-shift-unconfirmed=оставлена штатная задача: при сборе не удалось подтвердить одновременно машину у рейда и неприкрытую постройку на втором фронте
funnel=__1__ (первый учтённый приказ: тик __2__). Рейдовых приказов штатным наземным отрядам: __3__ после отбора → начато наблюдений: __4__ → дано рекомендаций: __5__ → найдена живая цель: __6__ → вовремя собран отряд: __7__ → можно назначить цель: __8__.
ground-issued=Наземных рейдовых приказов до отбора: __1__ с момента добавления счётчика. Если приказы разрешены, сюда входят и назначения самой колонии.
ground-selected=Случаев выбора цели для тактики «налёт» при формировании отряда: __1__ с момента добавления счётчика. Это не приказ атаковать.
funnel-shadow=Только наблюдение
funnel-command=Приказы разрешены
funnel-before=Наблюдение не начато: __1__.
funnel-during=Наблюдение не дало рекомендации: __1__.
funnel-after=Рекомендация не дошла до назначения: __1__.
funnel-count=__1__: __2__
funnel-busy=колония уже ведёт другую операцию
funnel-fronts=нет двух свежих фронтов одной силы
funnel-unmatched=цель рейда потеряна или не на известном фронте
funnel-probe=повтор того же отряда либо второй фронт вне подтверждённой дальности
funnel-response=за время наблюдения не отмечен мобильный ответ на рейд
funnel-witnesses=после мобильного ответа не хватило независимых свидетелей на втором фронте
funnel-redirect=второй фронт прикрыт, последующий успех рейда на первом не подтверждён
window-closed=условия операции изменились
command-result=Разум колонии, замысел №__1__ (тик __2__): __3__. Причина: __4__. Ранее подтверждено совпадений: __5__/2. Исполнение см. в журнале.
history=№__1__, решение на тике __2__: __3__. __4__. Оставшаяся цель №__5__ (замечена __6__). Свободных штурмовых отрядов / всех штатных: __7__/__8__. Исполнитель №__9__, приказ на тике __10__. Итог: __11__; тик __12__, потери исполнителя до исхода: __13__. __14__.
sources=Рейд №__1__ с тика __2__, мобильный ответ: __3__; свидетели второго фронта (отряд @ тик): __4__ @ __5__, __6__ @ __7__; оборона на втором фронте: __8__ @ __9__, ответный успех рейда: __10__
costs=Рейд: потери до приказа — __1__, от противника за время наблюдения — __2__, исходный состав — __3__. Цена формирования рейда / исполнителя: __4__/__5__ очков
operation-cost=№__1__: отрядов-участников — __2__ (без повторов). Известная цена их формирования — __3__ очков; отрядов с неизвестной ценой — __4__. Потери от противника со вступления каждого отряда в операцию — __5__. Из них у исполнителя вне целевого чанка / в нём после приказа атаковать — __6__/__7__. До вступления в операцию уже отмечено потерь: __8__ (не входят в её итог).
loss-scope=№__1__: подтверждённые потери на фронтах или у замеченных целей — __2__; потери свидетелей в отдельном удалённом бою — __3__; прочие потери или место боя не подтверждено — __4__. При оценке повтора исключены только потери свидетелей в удалённом бою.
operation-regroup=№__1__: бойцов при сборе — __2__. Подкрепление с момента выбора исполнителя: бойцов — __3__, отрядов — __4__ (последний — №__5__). Этот исход не служит основанием повторить задачу исходным составом.
operation-memory=№__1__: сопоставимое назначение №__2__ (оценка __3__); оценка после нынешнего исхода: __4__ (−1 — не повторять, 0 — вывод неясен, +1 — есть подтверждение; прочерк — оценки нет).
status-keep-task=оставлена штатная задача: сходный отряд здесь был отбит, и с тех пор изменений обороны не замечено
choice=№__1__, сравнение на тике __2__. Ближайший штатный ход: __3__ (чанк __4__, __5__). Фронт рейда: __6__; второй фронт: __7__. Выбор: __8__. Тик уничтожения постройки рейдом после ответа мобильной обороны: __9__.
choice-cover=№__1__, дополнительные донесения об обороне (отряд @ тик). На фронте рейда до рекомендации: __2__ @ __3__. После рекомендации на фронте рейда: __4__ @ __5__, на втором фронте: __6__ @ __7__.
choice-option=№__1__: __2__ (вес постройки — __3__, замечено турелей — __4__, длина подхода в чанках — __5__, прежняя оценка — __6__ из записи №__7__)
rail-visits=№__1__, постройка №__2__ рядом со станцией №__3__. Донесения с земли (отряд @ тик): поезд стоит — __4__ @ __5__; вагон отошёл, остановившегося поезда у станции нет — __6__ @ __7__; поезд снова остановился — __8__ @ __9__.
rail-tie=№__1__: по остальным признакам цели равноценны. Выбор определили повторные остановки поездов на станции №__2__. Это не свидетельство погрузки или разгрузки.
rail-incomplete=№__1__: часть событий движения поездов пропущена; станции не учитывались при выборе.
status-stop-lost=станция, определившая выбор при равенстве целей, потеряна до приказа атаковать постройку
choice-unsupported=нет подтверждения в текущих донесениях
choice-pending=проверка не завершена
choice-feasible=подходит замеченная постройка
job-unchecked=сравнения не было: раньше сработало ограничение назначения
job-unknown=не удалось надёжно оценить в пределах проверки
job-local=на одном из возможных ближайших ходов уже есть известные постройки
job-move=движение по запаху; на возможных ближайших шагах построек не отмечено
job-idle=здесь нет запаха для движения
pick-first=продолжить на фронте рейда
pick-second=назначить второй фронт
pick-ordinary=сохранить штатную задачу
status-unknown-task=оставлена штатная задача: ближайший ход нельзя надёжно оценить
kept-hit=№__1__: штатный отряд №__2__ уничтожил постройку №__3__ в точке (__4__, __5__) на тике __6__. Это не приказ и не победа «Разума колонии».
kept-unconfirmed=№__1__: для штатного отряда №__2__ не подтверждено уничтожение постройки на сравниваемых площадках или на намеченном шаге за время наблюдения (до тика __3__). Это не поражение.
status-local-task=оставлена штатная задача: ближайший ход уже может вывести к известным постройкам
status-no-edge=оставлена штатная задача: ни у одного фронта нет явного преимущества перед другим
status-choice-budget=оставлена штатная задача: оба подхода не укладываются в общий предел проверки
status-no-route=по известным чанкам наземный подход не подтверждён
status-repeat-repulse=два недавних наземных рейда из этого района отбиты у цели
status-cancelled=план отменён
status-no-target=не осталось подходящей замеченной цели
status-await-slot=ожидание штатного отряда
status-gathering=идёт сбор
status-no-slot=подходящий штатный отряд не появился вовремя
status-no-group=не собралась подходящая наземная группа
status-target-lost=цель исчезла либо сведения о ней устарели
status-out-of-range=собранный отряд слишком далеко
status-new-cover=новые сведения об обороне
status-missing-reports=часть донесений пропущена
status-occupied=цель другого рейда ещё закреплена
status-would-send=проверено в наблюдении, приказ не выдан
status-approach=отряд направляется к цели
status-route-changed=подтверждённый обход больше недоступен; приказ атаковать здание не выдан
route-evidence=Замысел №__1__, здание №__2__: наземные отряды №__5__ (тик __6__) и №__7__ (тик __8__) теряли бойцов на подходе в чанке (__3__, __4__). Это не отпор у здания.
route-side=Отряд-свидетель №__1__ находится на фланге в чанке (__2__, __3__). Длина проверенного обхода: __4__ шагов.
air-forecast=Замысел №__1__: у звена №__2__ с тика __3__ есть приказ бить по району, в котором находится цель №__4__. Равноценный наземный вариант — цель №__5__. Это прогноз: приказы звена и наземного отряда не меняются.
status-issued=отдан приказ атаковать постройку
status-achieved=назначенную цель уничтожил исполнитель
status-repelled=отряд отбит у цели
status-approach-losses=потери до приказа атаковать постройку
status-unconfirmed=результат не подтверждён
status-expired=время операции истекло
status-closed=операция закрыта настройками или условиями атаки
raid-ref=Рейдер №__1__ (выбор на тике __2__, __3__).
raid-building=здание №__1__
raid-area=район в чанке с началом (__1__, __2__)
raid-steps=Сбор: тик __1__; первый приказ идти к цели: __2__; __3__.
raid-at=__1__ на тике __2__
raid-unknown=выдача рейдового приказа или завершение задачи не зафиксированы
raid-issued=выдан рейдовый приказ
raid-closed=цель снята до рейдового приказа
raid-retreat=выдан приказ отступать до рейдового приказа
raid-ended=отряд завершил действие до рейдового приказа
raid-recheck=перепроверка отклонила цель до рейдового приказа
raid-no-step=при повторной попытке не найден шаг к цели до рейдового приказа
raid-expired=истёк срок задачи по району до рейдового приказа
route-loss=Потери на подходе: отряд потерял бойца вне целевого чанка. Эта потеря не считается отпором у цели.
inactive=Разум колонии: наблюдение приостановлено условиями атаки или настройками ИИ.
waiting=Разум колонии: свежие донесения с фронтов: __1__/2. Ожидание следующего подходящего рейда.
pending=Разум колонии, замысел №__1__: рейд на фронте __2__, возможный резерв для фронта __3__. Совпадения в прошлых рейдах (мобильная оборона здесь, потери построек там): __4__/2. Отряды, подтвердившие успех на втором фронте: __5__/__6__. Срок: тик __7__.
result=Разум колонии, замысел №__1__ (тик __2__): __3__. Причина: __4__. До этого мобильный ответ совпадал с успехом на другом фронте: __5__/2. Это прогноз, не приказ.
strike=направить резерв на фронт __1__
redirect=перенести резерв на фронт рейда (__1__)
cancel=оставить резерв на месте
timeout=не хватило подтверждений до конца разведки
no-reserve=не хватает очков или свободного места для отряда
incomplete=при большом числе боёв часть донесений с этой поверхности пропущена
both-guarded=отряды встретили оборону на обоих фронтах
probe-contact=на втором фронте обнаружена оборона, а рейд после этого уничтожил значимую постройку на первом
second-contact=после ответа мобильной обороны на рейд другие отряды подтвердили уничтожение построек на втором фронте
