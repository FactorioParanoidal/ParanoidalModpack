[mod-setting-description]
rampantFixed--showPlanetAISettings=[entity=big-biter] Открывает окно Rampant с настройками ИИ по планетам: режим ИИ, мирный период и минимальная эволюция. Доступно администратору или игроку из списка отладчиков Rampant. Это вход в отдельное окно, а не мгновенное включение ИИ на всех планетах; закрытие окна сбрасывает флажок.\n[color=#9cdcfe]По умолчанию: флажок снят. Только для вас.[/color]
