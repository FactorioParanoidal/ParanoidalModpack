[mod-setting-description]
rampantFixed--allowExternalControl=Allow other mods not only to read Rampant's data, but also to set its value. Obsolete. External control is always allowed starting from version 1.8.3.
rampantFixed--unitAndSpawnerFadeTime=The time in seconds for how long biter corpses stay around
rampantFixed--oldRedEnemyMapColor=Reverts the enemy map color to the vanilla enemy map color
rampantFixed--unitSpawnerBreath=Now unit spawners (nests) breath air so they are affected by things like poison capsules
rampantFixed--attackWaveGenerationThresholdMax=The total score that a chunk must reach in order for an attack wave to spawn. DOES NOT affect vanilla biters waves. Scaling linearly with evolution factor (starting threshold @ 0.0 evolution)
rampantFixed--attackWaveGenerationThresholdMin=The total score that a chunk must reach in order for an attack wave to spawn. DOES NOT affect vanilla biters waves. Scaling linearly with evolution factor (ending threshold @ 100.0 evolution)
rampantFixed--attackWaveMaxSize=Sets the maximum for the evolution-based part of Rampant’s wave-size calculation. The result also accounts for raid nests and retribution, has a minimum of 2 and can be overridden by external control; this is not an unconditional cap on every squad. The evolution threshold for reaching it is configured separately. Does not affect vanilla waves.
rampantFixed--attackWaveMaxSizeEvoPercent=Planning-evolution percentage at which the evolution-based wave-size term reaches the configured maximum. Lower values reach it earlier. Aggressive Start can raise planning evolution above actual evolution; final size also accounts for raid nests and retribution.
rampantFixed--nauvisMinEvo=While evolution is below this value, Rampant biters on Nauvis do not attack. The same value is set in the planet AI window (RFx button); they are kept in sync.
rampantFixed--agressiveStart=Sets a Rampant AI planning evolution floor: 10% at the map’s start, rising to 30% after one game hour. Higher actual evolution is used instead. Affects AI calculations, including wave size and action points, without raising the enemy force’s actual evolution.
rampantFixed--safeBuildings=Master switch for the safe-building rules below. Only eligible selected objects are protected, not the whole base. Older eligible objects may first be destroyed; Rampant’s relevant handler then attempts to recreate them as indestructible. Scrap rails, signals and train stops are excluded. Big poles have a separate list; neighboring poles and lamps that form a barrier are not protected.
rampantFixed--safeBuildings-straightRail=Make rails and related infrastructure safe from biters. Wooden rails, primitive signals and train stops are always vulnerable.
rampantFixed--safeBuildings-bigElectricPoles=Which big electric poles (tiers 1-4, also the lighted ones) are invulnerable to enemies. Applies to poles built after the setting is changed. Wooden and other poles are always vulnerable. A pole standing right next to another big pole or lamp is not protected: such a row would be a wall that enemies can neither pass nor destroy.
rampantFixed--safeBuildings-lamps=Make lamps safe from biters. A lamp standing right next to another lamp or big pole is not protected.
rampantFixed--safeBuildings-trainStops=Make train stops safe from biters
rampantFixed--permanentNocturnal=Toggling this will cause Rampant attack waves to spawn at night. Works better with the clockwork mod or a mod that extends night.
rampantFixed--allowDaytimePlayerHunting=Allows biters to hunt the player at all times
rampantFixed--allowDaytimeNonRampantActions=Prevents Rampant from cancelling the gathering of ordinary, non-script-driven enemy groups during the AI truce state or daylight under nocturnal AI. With this off, those groups are removed in those conditions. Other spawning and attack conditions still apply.
rampantFixed--aiPointsScaler=Multiplier for Rampant AI’s periodic action-point gain (0–100). Gains also depend on elapsed time, nests, planning evolution and AI state, rather than a fixed amount per cycle. 1 is the normal scale; higher values grant more points. 0 stops this accrual but does not erase stored points or disable the AI.
rampantFixed--aiDifficulty=Hard - default level. Lite - for a more comfortable game. The response to the player's actions is weaker, attacks are less frequent
rampantFixed--aiPointsPrintSpendingToChat=Print a message to chat whenever Rampant spends points. Includes GPS coordinates. Keep disabled for the hardest Rampant experience. Heads up: can fill up chat quickly during busy battles!
rampantFixed--aiPointsPrintGainsToChat=Print a message to chat whenever Rampant gains points. Does not show passive point generation. Keep disabled for the hardest Rampant experience. Heads up: can fill up chat quickly during busy battles!
rampantFixed--addWallResistanceAcid=For walls and gates already having positive acid-percent resistance, raises acid resistance to at least 60% and poison resistance to at least 75%. Raises flat explosion-damage reduction to at least 30 for walls and 40 for gates. Leaves objects without existing positive acid resistance untouched and does not lower stronger protection.
rampantFixed--removeBloodParticles=The blood particles that are created when biters are being killed can cause UPS spikes, this removes them.
rampantFixed--fireSafety-flamethrower=Adds direct fire damage to the handheld flamethrower and removes the stream’s native direct ground-fire creation. Keeps a modified burning sticker; its associated tree fire deals zero damage. This is not a complete ban on fires or immunity to fire damage.
rampantFixed--flamethrowerTurretsRebalance=Reduces attack speed while maintaining overall damage. In the case of the Arsenal Rampant flamethrower, it removes very significant lags
rampantFixed--rampantArsenalRebalance=Acid and poison sticker damage will be dealt less often, but stronger. Significantly reduces late game lag when using poison and acid
rampantFixed--enableSwarm=This reduces the size of the unit collision_mask causing them to reduce pathing collisions and smooth out the attacks
rampantFixed--attack-warning=Shows a message warning players that an attack wave is incoming
rampantFixed--newEnemies=Adds news enemies that will be dispersed over the world. This increases the RAM requirements. With 1 variation for each biter, worm, and nest and 5 tiers expect upto a 2GB RAM increase. With 20 variations and 10 tiers set expect up to 9GB RAM increase. Variations add randominess to each tier of biter, worms, or nests. Tiers are the power level of the biters.
rampantFixed--allowOtherEnemies=Reserves part of the territory for other enemies according to the selected side for Rampant’s new factions. Does not add other mods’ enemies by itself. Disabling it removes this territorial restriction; replacement of other nests still follows separate compatibility rules. The choice is stored when new-faction placement is first initialized in the save; later changes to this setting are ignored.
rampantFixed--newEnemiesSide=Selects the side relative to the map origin where Rampant’s new factions may appear when other enemies are allowed. Mixed mode selects locations randomly rather than restricting them to one side. The choice is stored when new-faction placement is first initialized in the save; later changes to this setting are ignored.
rampantFixed--newEnemyVariations=Only for compatibility with Rampant. All new objects will be as if the number of options is equal to 1
rampantFixed--tierStart=Starting strength endpoint for new enemies (1–10), not the number of generated tiers. There are always 10 tiers with parameters spanning the starting and ending endpoints. Health also depends on the faction and separate setting multipliers.
rampantFixed--tierEnd=Ending strength endpoint for new enemies (1–10), not the number of generated tiers. There are always 10 tiers with parameters spanning the starting and ending endpoints. Health also depends on the faction and separate setting multipliers.
rampantFixed--tierByEvolutionOnly=On: the tier of the nests (which factions they take: laser, electric, suicide... from 17% evolution, and so on) grows with the evolution and the distance from the map centre only, not with the game time. On loading a save, nests above that tier are brought down to it: their factions not allowed yet are replaced at once by allowed ones (living units stay). Off: the tier also grows with the game time, by one per interval determined by the end-tier setting, up to tier 3. With end tier 10, the interval is about 13.6 game hours.
rampantFixed--allowLongRangeImmunity=Some factions can't be killed from long range. Fire and acid damage ignore this immunity. Disabling the setting may make these factions too weak
rampantFixed--longRangeImmunity_efficiency=100% - immune to damage from Range N+. 10% - will take 90% damage
rampantFixed--allowOneshotProtection=Enables overdamage protection for Rampant units that support it; efficiency is configured separately. Fire and acid are normally excluded for ordinary units, but events with original damage above 200 still pass the handler’s filter. This is not general invulnerability or a guaranteed hit count before death. Champions and bosses use separate damage handling.
rampantFixed--oneshotProtection_efficiency=100% - taken damage cant exceed overdamage threshold. 10% - overdamage will reduced 10% 
rampantFixed--buildingsImmuneToElectic=Nests and worms do not take electrical damage

rampantFixed--classicBehavior=Turns off the learning AI of this build and returns the behaviour of Rampant 2.02.14: no tactics (flanking, probes, feints, raids on weak spots, sappers, counter-battery, pincers, ambushes, sabotage), no retreats, no learning from outcomes, no adaptation of mutations to the damage that kills the nests, flyers walk with the ground squads. Optimizations and bug fixes stay. Can be switched in a running game.
rampantFixed--champions=Champion spawn attempts are normally scheduled 7–11 minutes apart, boss attempts 50–70 minutes apart; a living-unit limit or failed attempt can delay an arrival. An eligible nest supplies the local unit kind; a super-hive can serve as a lair. Without a super-hive, each ordinary boss attempt has an independent 25% chance, not a guaranteed every-fourth schedule. A champion is selected up to one strength step above the local unit and a boss up to two, as far as the nest’s unit set permits; Rampant tiers are capped at 10. A champion is a little bigger and half as fast, with a coloured glow and silver star; a boss is much bigger, with a glow and gold star. Health is at least ×10 / ×50 the local unit’s health and no lower than the building-level floor at spawn time: 500 / 5000 at the start, then increasing by a separate table unaffected by the hive-health multiplier. Both seek a strong defensive area, or a valuable base area if that information is unavailable. Below 35% health, both retreat towards a nest to heal, taking four times less damage under a glowing shield; after their first full recovery they receive a name and return. A fallen one drops one large artifact of its colour, or the generic artifact if the coloured item is absent and the generic item is available. Its corpse glows for 3 minutes. Biters only below 10% evolution, biters and spitters from 10%, available flyers too from 30%. Off stops new spawns and kills existing champions and bosses.
rampantFixed--superHives=Rarely a nest placed by Rampant becomes a super-hive, from the start of the game: with a 50% chance within 40 tiles of ore or oil, elsewhere rarely and more often with evolution; never close to the map centre early, to player buildings or to another super-hive; the limit per surface grows with evolution. A hive may also grow into one. 10000-270000 health (3 times the hive of its level), regenerates 60-120 per second, much bigger than a hive and marked by a blue aura and ring, heals the nests and worms around it, breeds stronger units, is the lair of the champions (an hour boss always, a champion in half of the cases leaves from it; without a super-hive near the target only 1 of 4 hour bosses comes) and changes its faction and level with its base. When it falls: a brood, artifacts, AI points and an avenger (a champion, a boss for level 7 and above). Off: no new ones appear, living ones stay.
rampantFixed--heavyBehavior=Tactics and scripts that cost more CPU: pincers (two squads wait for each other), ambushes on routes of players and trains, sabotage of poles, pipes and belts outside turret cover, and the older scripts - underground attacks (only if enabled by their own setting), enrage and bridgeheads. Off: only the cheap models work.
rampantFixed--enableMigration=Enables Rampant AI migration and expansion of enemy territory. Requires enemy expansion enabled in map settings. [color=orange]Warning![/color] This makes the game harder: enemies can occupy new areas and approach your base. It does not set a fixed deadline for a siege.
rampantFixed--printAIStateChanges=Gives you information in the game chat about Rampant's AI state. Messages are displayed for each surface. Disable for the hardest Rampant experience.
rampantFixed--debugTemperament=Prints to chat AI temperament information that controls AI state rolls. This is used for debugging.
rampantFixed--max-evo-dist=The higher the value, the greater the distance from the center for the appearance of strong factions

rampantFixed--enableShrinkNestsAndWorms=Reduce the collision box size of nests and worms by 50%. May cause overlapping entities due to the collision box being smaller than the entity graphic.
rampantFixed--attackWaveGenerationUsePlayerProximity=Lets player proximity raise Rampant nest activeness when player pheromones in their chunk exceed the separate threshold. This is an additional activeness condition, not a wave-size bonus. Does not affect vanilla attack waves.
rampantFixed--attackPlayerThreshold=Player-pheromone threshold in a chunk containing nests. With player proximity enabled, a value strictly above this threshold raises nest activeness. Higher thresholds reduce player-proximity influence; crossing it is not an immediate attack command.

rampantFixed--unkillableLogisticRobots=This will make logistic bots immune to all damage
rampantFixed--unkillableConstructionRobots=This will make construction bots immune to all damage

rampantFixed--unitBiterHealthScaler=[entity=small-biter] Multiplier for maximum health of Rampant biters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitBiterSpeedScaler=[entity=small-biter] Multiplier for movement speed of Rampant biters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitBiterDamageScaler=[entity=small-biter] Multiplier for damage of Rampant biters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitBiterRangeScaler=[entity=small-biter] Multiplier for attack range of Rampant biters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitBiterHealingScaler=[entity=small-biter] Multiplier for passive health regeneration of Rampant biters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitSpitterHealthScaler=[entity=small-spitter] Multiplier for maximum health of Rampant spitters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitSpitterSpeedScaler=[entity=small-spitter] Multiplier for movement speed of Rampant spitters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitSpitterDamageScaler=[entity=small-spitter] Multiplier for damage of Rampant spitters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitSpitterRangeScaler=[entity=small-spitter] Multiplier for attack range of Rampant spitters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitSpitterHealingScaler=[entity=small-spitter] Multiplier for passive health regeneration of Rampant spitters. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitDroneHealthScaler=Multiplier for maximum health of Rampant enemy drones. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage. These are Spawner and Wasp combat drones, not player robots.
rampantFixed--unitDroneSpeedScaler=Multiplier for movement speed of Rampant enemy drones. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage. These are Spawner and Wasp combat drones, not player robots.
rampantFixed--unitDroneDamageScaler=Multiplier for damage of Rampant enemy drones. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage. These are Spawner and Wasp combat drones, not player robots.
rampantFixed--unitDroneRangeScaler=Multiplier for attack range of Rampant enemy drones. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage. These are Spawner and Wasp combat drones, not player robots.
rampantFixed--unitDroneHealingScaler=Multiplier for passive health regeneration of Rampant enemy drones. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage. These are Spawner and Wasp combat drones, not player robots.
rampantFixed--unitWormHealthScaler=[entity=small-worm-turret] Multiplier for maximum health of Rampant worms. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitWormDamageScaler=[entity=small-worm-turret] Multiplier for damage of Rampant worms. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitWormRangeScaler=[entity=small-worm-turret] Multiplier for attack range of Rampant worms. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitWormHealingScaler=[entity=small-worm-turret] Multiplier for passive health regeneration of Rampant worms. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitSpawnerHealthScaler=[entity=biter-spawner] Multiplier for maximum health of Rampant biter and spitter nests. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitSpawnerOwnedScaler=[entity=biter-spawner] Multiplies how many living units one Rampant nest can sustain. A value of 1 keeps its original limit. This is not a lifetime limit on all units ever spawned.
rampantFixed--unitSpawnerSpawnScaler=[entity=biter-spawner] Multiplies the nearby-friendly-unit threshold at which a Rampant nest stops producing more units. A value of 1 keeps the original threshold. This is not a batch size.
rampantFixed--unitSpawnerRespawnScaler=[entity=biter-spawner] Multiplier for the delay between unit spawns from Rampant biter and spitter nests. A value of 1 leaves the delay unchanged; above 1 spawns are less frequent, below 1 more frequent. It is not a direct spawn-rate multiplier.
rampantFixed--unitSpawnerHealingScaler=[entity=biter-spawner] Multiplier for passive health regeneration of Rampant biter and spitter nests. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitHiveHealthScaler=[entity=biter-spawner] Multiplier for maximum health of Rampant hives and super-hives. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitHiveHealingScaler=[entity=biter-spawner] Multiplier for passive health regeneration of Rampant hives and super-hives. A value of 1 leaves it unchanged, 2 doubles it and 0.5 halves it; this is a factor, not a percentage.
rampantFixed--unitHiveRespawnScaler=[entity=biter-spawner] Multiplier for the delay between unit spawns from Rampant hives and super-hives. A value of 1 leaves the delay unchanged; above 1 spawns are less frequent, below 1 more frequent. It is not a direct spawn-rate multiplier.

rampantFixed--raidAIToggle=Toggles the ai raiding parties distant nests
rampantFixed--siegeAIToggle=Allows the Siege variant of Rampant settler squads: outside the Siege state it has a 10% selection chance. If the AI is already in the Siege state, that variant is selected even with this checkbox off. Formation and settlement still depend on other AI conditions; settling directly beneath walls is not guaranteed.
rampantFixed--siegeMinDistance=Sieges can't settle closer than the specified number of chunks from military buildings
rampantFixed--undergroundAttack=Allows eligible Rampant ground squads to burrow with heavy AI enabled; ordinary routes depend on the separate probability and pathing conditions. Separately, losing a unit to artillery or sufficiently distant fire can make the surviving squad dig in independently of that probability. Flying or rabid squads and squads containing spiders do not use this retaliation path.
rampantFixed--undergroundAttackProbability=Base chance of an ordinary underground route at 80% evolution and above, expressed as a fraction (0.1 = 10%). The calculation is zero through 40% and rises linearly between 40% and 80%; results below 0.001 in that interval are zeroed. After the first nonzero chance, the code retains a minimum of 0.0001 (0.01%) even if the calculation later falls to zero. Requires underground attacks and heavy AI on an eligible surface. Retaliatory digging after distant or artillery fire does not use this probability.
rampantFixed--demolisherAttack_AdditionalTime=These minutes will be added to the calculated standard interval

rampantFixed--laserEnemy=Laser biters and spitters: laser immunity, major electric resistance, minor fire and acid resistance, and minor physical weakness. This faction tests whether your defences can deal physical damage. Overdamage protection depends on Rampant’s general settings rather than guaranteeing a fixed percentage of maximum health per hit.
rampantFixed--waspEnemy=Wasp Biter Faction, Spitter only units and each spitter spits small drones.
rampantFixed--spawnerEnemy=Spawner faction: nests produce spitters that lay eggs which hatch into biters. Spitter long-range protection applies beyond 30 tiles and depends on Rampant’s general protection settings. Flamethrower and artillery installations use separate handling.
rampantFixed--trollEnemy=Regenerative biters with high regeneration and health, poison immunity, major explosive resistance and minor physical resistance. Weak to fire and slow-moving. Protection against large hits depends on Rampant’s general settings; there is no unconditional 20%-of-health damage cap.
rampantFixed--fastEnemy=Fast biters and spitters with high movement speed and minor explosive and acid resistance. Long-range protection thresholds are more than 20 tiles for biters and more than 25 for spitters; its effect depends on Rampant’s general protection settings. Flamethrower and artillery installations use separate handling. This faction threatens unprotected long-range defences.
rampantFixed--infernoEnemy=Inferno Biter Faction, Only Spitters that spit flaming acid that burns everything. Extreme resistance to Acid & Fire, Minor weakness to poison. Major weakness to laser
rampantFixed--nuclearEnemy=Nuclear faction: fast, low-health biters that explode like an atomic bomb when attacking. Major fire and acid resistance and major explosive weakness. Overdamage protection depends on Rampant’s general settings and does not guarantee that they always require at least five hits to die.
rampantFixed--electricEnemy=Electric Biter Faction, Only Biters with a short range attack that hits multiple entities in a line. Major resistance to Electric, Minor resistance to Laser.
rampantFixed--fireEnemy=Fire Biter Faction, Major resistance to Acid. Fire immunity. Laser weakness. Fire stream atack.
rampantFixed--ArachnidsEnemy=They look like spiders (if the Arachnids mod is installed). Vulnerable to physical damage (x2). Upon death, eggs are left, from which, after 5 seconds, a new biter will hatch. Eggs are vulnerable to physical damage. The task of the faction is to force the player to spend ammo.
rampantFixed--flyers=Flying biters of every faction that has biters, except kamikaze and nuclear. The first level and the share are set by the two settings below. Compared to the faction biter of the same level: health x1.5, damage x1.3, speed x1.15, they join attacks three times less often. They fly over walls, water and cliffs, land to bite and take off again. Every turret can hit them. Nests produce no flyers below 10% evolution. With the learning AI (unless classic behaviour is on) flyers leave the ground squads and form flights of their own: they fly over water to weak spots of the base, hit and run and come back from another side.
rampantFixed--flyersFirstTier=Unit level from which biter nests and hives produce flyers (1-10). The unit level follows evolution. With end tier 10, approximate evolution of the first flyers in biter nests (hives: one step earlier):\nValues below are fractions of evolution: 0.15 = 15%.\n1 - from 10% evolution (never earlier, at any level)\n2 - ~0.15\n3 - ~0.27\n4 - ~0.38\n5 - ~0.47\n6 - ~0.65\n7 - ~0.74\n8 - ~0.8\n9 - ~0.85\n10 - ~0.91\nFlyers have 1.5x the health and 1.3x the damage of the biter of the same level, so an early start makes the early game noticeably harder.
rampantFixed--flyersSpawnShare=Share of the units produced by biter nests and hives that are flyers, from the level set above. 0.12 = 12% (about one in eight). Biters and spitters share the rest as usual. Reasonable: 0.05 (rare) - 0.2 (often), allowed 0.01-0.9.
rampantFixed--suicideEnemy=Suicide faction: fast biters with very low health that explode when attacking, without harming allies with their blast. Minor poison resistance, major fire and acid resistance, and major explosive weakness. Long-range protection beyond 18 tiles and overdamage protection depend on Rampant’s general settings; flamethrower and artillery installations use separate handling.
rampantFixed--physicalEnemy=Armored Biter Faction, Only Biters. Major resistance to physical, Major resistance to explosive, Minor resistance to Fire. Minor Weakness to Electric and Laser. Overdamage protection 2 (50% max hp dmg)
rampantFixed--acidEnemy=Acid Biter Faction, Immune to Acid, Minor resistance to Poison.
rampantFixed--energyThiefEnemy=Energy-thief biter faction with major electric and laser resistance and minor explosive resistance. Destroying eligible powered structures creates draining crystals. These can deprive your base of power and put the game at risk.
rampantFixed--poisonEnemy=Poison Biter Faction, Only Biters. On death creates a cloud that heals biters and hurts player objects. Major resistance to Poison, Minor resistance to Fire.Minor weakness to Laser, Electric.
rampantFixed--JuggernautEnemy=Slowly, big biters with extreme physical, acid and fire resists. Cloud atack, healing allies and harming enemies. This is a dps-check of your laser defence


rampantFixed--disableCollidingProjectiles=Biter projectiles no longer collide with other biters, worms or nests. Everything else still collides with biter projectiles.
rampantFixed--enableFullMapScan=This setting causes the game map to slowly be scanned for entities created or destroyed outside of the factorio event system. (If a mod isnt using script_raised_built or script_raised_destroyed this will cause Rampant to still eventually be consistent with the game map)

rampantFixed--enableFadeTime=Applies the separate fade-duration setting to biter, spitter, worm, spawner and hive corpses. Spawner-spawn effect corpses receive a one-second lifetime. When disabled, this patch leaves the original corpse lifetimes unchanged.

rampantFixed--maxNumberOfBuilders=More builders requires more UPS.
rampantFixed--maxNumberOfSquads=More squads requires more UPS.
rampantFixed--settlementsProbability=Default value = 0.4 (40% settle, 60% atack). Only for migrate/siege mode. Does not affect regular settlements
rampantFixed--vengenceProbabilityPercent=Scales the chance of rallying vengeance squads after eligible enemy losses. 0.04 gives the normal multiplier of 1; 0 makes this threshold zero. It is not a fixed 4% chance after every death: the result depends on planning evolution, the vengeance chain, the chunk timer and surface state.
rampantFixed--chainVengenceCoefficient=Reduces the chance of subsequent vengeance squads: the rally threshold is multiplied by this coefficient raised to the vengeance counter. At 0.6, a full counter step leaves 60% of the previous chance. Destroying enemy structures and long-range shelling can reset the reduction; ordinary AI attacks gradually relax it. On Hard difficulty with enough points, the counter grows in half-steps, reducing the penalty.
rampantFixed--showAdminMenu=Shows Rampant’s administration-menu button at the top of the screen for an administrator or an authorized debug user. The player normally has administrator rights in single-player. The menu can replace enemies with vanilla ones and select surfaces/planets for Rampant to ignore.
rampantFixed--showSquadAlert=Show Rampant AI squads alert (debug)

[description]
rampantFixed--EnemySettings1_1_9=Rampant Fixed: since version 1.1.9, a mixed settlement of rampant and other enemies is available (see startup settings). Only in the new game.
rampantFixed--EnemySettings1_1_10=Rampant Fixed: since version 1.1.10 it is possible to replace the nests of new enemies with standard ones. This can be useful if you want to continue the game without new enemies or remove the mod without losing nests (player settings- "Show dialog to disable new enemies"). Singleplayer game or "admin" players only
rampantFixed--enableShootingAlerts=Rampant Fixed: It is recommended to find a way to enable notifications for turrets firing. Without this, you risk missing attacks 
rampantFixed--disableNewEnemies_text=Nests are replaced on all planets. They will not be returned
rampantFixed--msg-ask-disableNewEnemies=Replacing the nests of new enemies with standard ones. It may take time on large maps. Start a replacement?
rampantFixed--button_disableNewEnemies_disable=Yes (may take some time)
rampantFixed--button_disableNewEnemies_cancel=Cancel
rampantFixed--msg_replaceNewEnemiesNests=Replacement of nests is completed. Nests processed:__1__ . If desired, the mod can be removed. 
rampantFixed--K2_SE_CMO_incompatibilityWarning=A combination of mods K2+SE + combat-mechanics-overhaul was found.  In this combination, the mod settings <combat-mechanics-overhaul>: Spitter/worm spit blockable "[font=heading-1][color=red] incorrectly converts the attacks of [/color][/font] fire and infernal factions. If they are enabled, then enable an alternative attack (Rampant Fixed setting: Projectiles: replace steam attacks with blockable projectiles)
rampantFixed--undergroundAttackWarning=Warning: __1__: biters learned underground attacks!  A hard surface (movement speed 150+) will delay the digging process for a minute,
rampantFixed--undergroundAttackWarning2=reduce biter movement speed for 5 sec, notify about an attempt to dig or pass (if in the radar coverage area)
rampantFixed--firstUndergroundAttackWarning=First underground attack detected (next attacks will come without warning)
rampantFixed--undergroundAttackDigoutWarning=Warning: Digging attempt detected. The hard surface will hold it for 1 minute
rampantFixed--undergroundAttackDetectedWarning=Underground attack detected!
rampantFixed--aiReportCommand=Shows what the Rampant AI has learned on your surface: tactic values, streaks, known targets
rampantFixed--squadDetectedWarning=Rampant AI squad detected. Squad size: __1__
rampantFixed--demolisherAttackDetectedWarning=Atacking Demolisher detected
 
rampantFixed--championHourWarning=You hear a strange sound in the distance...
rampantFixed--superHiveFallen=A super-hive has fallen. The swarm wants revenge!
rampantFixed--superHiveDescription=Heart of a nest: huge health and fast regeneration, heals the nests and worms around it every 5 seconds, breeds stronger units and calls the swarm from afar. Champions near it leave from it and come back to it to heal. When it falls it releases a brood one level up and drops alien artifacts, and the swarm takes revenge.
rampantFixed--JuggernautAlert=The ground under the nests has grown harder. Something down there is growing a shell that neither bullet nor flame can pierce.
rampantFixed--flyersWarning=Evolution __1__%. The local fauna spends a long time staring at the sky. With enthusiasm.
rampantFixed--flyersAlert=[color=red]Evolution __1__%. They have learned to fly. The lake around your base was a good idea. Was.[/color]

rampantFixed--demolisherNote1=[color=red]__1__:Demolisher attack. Once attack and leave alive, he will come again and again.[/color] By destroying him, you delay the moment of attack of another demolisher.
rampantFixed--demolisherNote2=When attacks begin, in 20% of cases a complete copy of the existing demolisher attacks. In other cases, a mutation occurs. Only Space Age demolisher mutate.
rampantFixed--demolisherNote3=With __1__% evolution, mutation into a medium demolisher is possible. With __2__% - into a large one. If you can't kill it - feed it.
rampantFixed--demolisherNotFeeded=__1__: The demolisher is full and does not react to food.
rampantFixed--demolisherFeeded_Hunger=The demolisher seems sated and isn't interested in your buildings for now. Please don't count that as a diplomatic victory.
rampantFixed--demolisherFeeded_noHunger=The demolisher seems sated and isn't interested in your buildings for now. Please don't count that as a diplomatic victory.
rampantFixed--demolisherFeared=__1__: You scared the demolishers and they will come to you only in __2__ minutes

