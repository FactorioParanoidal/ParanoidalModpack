[mod-setting-name]
rampantFixed--colonyMind=Colony Mind: observation
rampantFixed--colonyOrders=Colony Mind: allow orders

[mod-setting-description]
rampantFixed--colonyMind=Compares two fronts using reports from ground squads. Use /rampantAIReport to see which task the colony preferred for an already paid squad and why. Without separate permission the colony only observes. Requires heavy AI models; inactive in classic behaviour.
rampantFixed--colonyOrders=Allow one ordinary, paid assault to target a surviving observed building after gathering. Does not create additional waves. Requires observation and heavy AI; inactive in classic behaviour.

