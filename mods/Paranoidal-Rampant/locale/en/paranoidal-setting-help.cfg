[mod-setting-description]
rampantFixed--showPlanetAISettings=[entity=big-biter] Opens Rampant’s per-planet AI settings window for AI mode, peace period and minimum evolution. Access requires an administrator or an allowed debugger. This opens a separate window rather than immediately enabling AI everywhere; closing it clears the checkbox.\n[color=#9cdcfe]Default: checkbox unchecked. Personal setting.[/color]
