[mod-setting-description]
tpr-tolerance=Chunk pollution the body tolerates without protection. Above it intoxication grows, below it falls. Each level of Smog protection research adds 10 %. Default 150.
tpr-hud=Auto: shown while you are intoxicated or stand in polluted air above the tolerable level. Always / never.
tpr-auto-equip=When a mask or armor without an equipment grid is worn out by the smog, the best protection from the inventory is put on: highest filtration first, then most filter resource left.
tpr-sounds=An alarm when intoxication starts to damage you; sounds of a filter refill and of worn-out protection.
tpr-respawn-respirator=Simplified survival: a new body gets a respirator in the armor slot (or in the inventory if the slot is taken).

