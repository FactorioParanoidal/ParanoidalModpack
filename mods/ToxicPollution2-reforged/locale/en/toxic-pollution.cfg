[tips-and-tricks-item-description]
tpr-smog=Pollution poisons whoever breathes it. The body tolerates __1__ pollution in a chunk (every level of Smog protection research: +10 %). Breathe more and intoxication grows, the faster the thicker the smog; breathe less and it falls.\n\n• From __2__ % intoxication the smog damages your health: up to __3__ % of max health per second at 100 %.\n• Damage only while you breathe smog: leave it or put on protection and the damage stops at once. Intoxication then falls by 1–5 % per second, faster in cleaner air.\n• Protection filters a share of the smog: [img=item/respirator] respirator 50 %, [img=item/tpr-gas-mask] gas mask 80 %, armor by its "Toxins" resistance, breathing modules in the armor grid, closed vehicles. Layers add up: what one lets through, the next filters.\n• Safe pollution = tolerable ÷ (1 − filtration). The panel shows it.\n\nBnL calls this air "fresh"™.
tpr-smog-protection=Protection spends its [font=default-bold]filter resource[/font] only in air above the tolerable level, in proportion to what it filters.\n\n• Items with an equipment grid are never destroyed: with the filters exhausted they simply stop filtering. A mask or armor without a grid is destroyed; with "Put on spare protection" the best protection from the inventory is put on.\n__1__\n• Breathing modules: [img=item/tpr-filter-module] 50 % at 40 kW, [img=item/tpr-closed-breathing] 100 % at 200 kW. Only the best module works, energy is spent only in smog. A module cleans the air before the armor, so the armor's filters last longer.\n• Vehicles: car 40 %, tank and aircraft 85 %, train 75 % (armoured 90 %), spidertron 95 %.\n• [img=item/respirator] and [img=item/tpr-gas-mask] also stop 90 % of poison gas (capsules, clouds) at the cost of their resource.\n• Within __2__ tiles of a working air filter, farm or greenhouse intoxication falls twice as fast.
tpr-smog-refill=• Refill: when a whole [img=item/__1__] fits into the worn item (or less than a quarter is left), one air filter from the inventory adds __3__ resource and a [img=item/__2__] comes back. The respirator is disposable.
tpr-smog-hud=The panel on the left appears in smog and while you are intoxicated: the intoxication bar, what you inhale against the tolerable level, the safe level, filtration by layers, the resource and the air filters in the inventory, and the trend: when the damage starts or when you will be clean.\n\nAlerts (one at a time): [img=virtual-signal/tpr-alert-smog] intoxication grows, [img=virtual-signal/tpr-alert-filters] protection filters exhausted, [img=virtual-signal/tpr-alert-danger] the smog damages you. Command [font=default-bold]/toxic[/font] prints your state, [font=default-bold]/toxic kills[/font] the deaths from smog.
tpr-smog-sensor=Put the signal [img=virtual-signal/tpr-pollution] into a constant combinator: once a second it outputs the pollution of the chunk where the combinator stands. Only slots that hold the signal are written; remove it and the combinator is an ordinary one again.\n\nUse it to switch air filters on, close gates or light a warning lamp.
tpr-smog-sos=1. [font=default-bold]Leave the smog[/font]: the damage stops at once, intoxication starts to fall.\n2. Put on [img=item/respirator] or [img=item/tpr-gas-mask]: with protection the same smog may become tolerable (the panel shows the safe level).\n3. Keep spare masks and air filters in the inventory.\n4. Research Smog protection: the body tolerates more, filters last longer.\n5. Breathe near air filters, farms and greenhouses: intoxication falls twice as fast.\n6. Pollute less: filters, trees, cleaner machines.
