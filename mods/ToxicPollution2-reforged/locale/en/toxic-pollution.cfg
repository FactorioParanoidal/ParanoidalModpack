[tips-and-tricks-item-description]
tpr-smog=Pollution poisons whoever breathes it unprotected. The body tolerates __1__ pollution in a chunk (every level of Smog protection research: +10 %).\n\n• [font=default-bold]While anything is worn in the armor slot[/font] (a respirator, a gas mask, any armor) the smog does not poison you: the protection resource takes the whole hit. You cannot die of smog in protection until its resource is spent.\n• Without protection (or with the resource spent) intoxication grows, the faster the thicker the smog. From __2__ % the smog damages your health: up to __3__ % of max health per second at 100 %.\n• Damage only while you breathe smog unprotected: leave it or put on protection and the damage stops at once; intoxication falls by 1–5 % per second.\n\nBnL calls this air "fresh"™.
tpr-smog-protection=Protection spends its [font=default-bold]resource[/font] only in air above the tolerable level, the faster the thicker the smog. The "Toxins" resistance is endurance: at 50 % the resource wears half as fast, at 80 % five times slower. At pollution 500 without research: respirator ~6 min, light armor ~10 min, gas mask ~30 min, heavy ~35 min, modular ~1.3 h, power ~3 h, power MK2 ~5 h.\n\n• Items with an equipment grid are never destroyed: with the resource exhausted they simply stop protecting. A mask or armor without a grid is destroyed; with "Put on spare protection" the one that will last longest is put on.\n__1__\n• Breathing modules in the armor grid clean the air before the armor: [img=item/tpr-filter-module] 50 % at 40 kW, [img=item/tpr-closed-breathing] 100 % at 200 kW. Only the best module works, energy is spent only in smog.\n• A vehicle cabin cleans the air too: car 40 %, tank and aircraft 85 %, train 75 % (armoured 90 %), spidertron 95 %.\n• [img=item/respirator] and [img=item/tpr-gas-mask] also stop 90 % of poison gas (capsules, clouds) at the cost of their resource.\n• Within __2__ tiles of a working air filter, farm or greenhouse intoxication falls twice as fast.
tpr-smog-refill=• Refill: when a whole [img=item/__1__] fits into the worn item (or less than a quarter is left), one air filter from the inventory adds __3__ resource and a [img=item/__2__] comes back. The respirator is disposable.
tpr-smog-sensor=Put the signal [img=virtual-signal/tpr-pollution] into a constant combinator: once a second it outputs the pollution of the chunk where the combinator stands. Only slots that hold the signal are written; remove it and the combinator is an ordinary one again.\n\nUse it to switch air filters on, close gates or light a warning lamp.
tpr-smog-sos=1. [font=default-bold]Put anything into the armor slot[/font], even a respirator: the damage stops at once while the protection has resource.\n2. Or leave the smog: the damage stops, intoxication falls.\n3. Keep spare masks, armor and air filters in the inventory: worn-out protection is replaced by itself.\n4. Research Smog protection: the body tolerates more, protection lasts longer.\n5. Breathe near air filters, farms and greenhouses: intoxication falls twice as fast.\n6. Pollute less: filters, trees, cleaner machines.
tpr-smog-settings=Mod settings (Settings → Mod settings → Per player):
tpr-smog-alerts=An alert appears only when something changes sharply and stays about 10 seconds: you entered smog; the smog got twice as thick; the protection resource fell below 25 % and below 10 %; the protection wore out or was replaced; damage started (this one stays while the damage lasts).\n\nHover it: the intoxication bar, pollution against the tolerable level, vehicle and module filters, the protection resource and how long it lasts, spare air filters and the trend.\n\nIcons: [img=virtual-signal/tpr-alert-smog] smog, [img=virtual-signal/tpr-alert-filters] protection low or gone, [img=virtual-signal/tpr-alert-danger] the smog damages you. Command [font=default-bold]/toxic[/font] prints the same state to the chat, [font=default-bold]/toxic kills[/font] the deaths from smog.

