[mod-setting-description]
tpr-tolerance=Chunk pollution the body tolerates without protection. Above it intoxication grows without protection and worn protection wears out; below it nothing is spent. Each level of Smog protection research adds 10 %. Default 150.
tpr-auto-equip=When the smog wears out a mask or armor without an equipment grid, the protection from the inventory that will last longest is put on.
tpr-sounds=A sound when a smog alert appears and when damage starts; sounds of a filter refill and of worn-out protection.
tpr-respawn-respirator=Simplified survival: a new body gets a respirator in the armor slot (or in the inventory if the slot is taken).

