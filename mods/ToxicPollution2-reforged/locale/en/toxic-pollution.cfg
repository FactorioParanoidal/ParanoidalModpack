[item-description]
respirator=Cloth, charcoal and hope. Filters 50 % of the smog and 90 % of poison gas; disposable: when the filter resource is spent, the respirator is gone. BnL calls this air "fresh"™.
tpr-gas-mask=The very model Shelby Forthright wore in his farewell video. Filters 80 % of the smog and 90 % of poison gas. Refilled with air filters from the inventory; without them it wears out like a respirator.
tpr-filter-module=Armor equipment. Filters 50 % of the smog before it reaches the armor, so the armor's own filters last longer. Spends 40 kW only in polluted air; without charge it does not filter. Only the best breathing module in the grid works. BnL Fresh Air™ — no subscription required (yet).
tpr-closed-breathing=Armor equipment: starliner life support in a backpack. The Axiom-7 breathed the same air for 700 years — now so do you. Filters 100 % of the smog while charged; spends 200 kW only in polluted air.

