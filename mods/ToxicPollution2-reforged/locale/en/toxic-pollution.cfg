[item-name]
respirator=Respirator
tpr-gas-mask=Gas mask
tpr-filter-module=Filter module
tpr-closed-breathing=Closed-loop breathing module

[item-description]
respirator=Cloth, charcoal and hope. While worn, the smog does not poison you: the protection resource takes the hit (resistance 50 %); it also stops 90 % of poison gas. Disposable: when the resource is spent, the respirator is gone. BnL calls this air "fresh"™.
tpr-gas-mask=The very model Shelby Forthright wore in his farewell video. While worn, the smog does not poison you; resistance 80 %: the resource wears five times slower than on armor without resistance. Stops 90 % of poison gas. Refilled with air filters from the inventory.
tpr-filter-module=Armor equipment. Filters 50 % of the smog before it reaches the armor, so the armor resource wears slower. Spends 40 kW only in polluted air; without charge it does not filter. Only the best breathing module in the grid works. BnL Fresh Air™ — no subscription required (yet).
tpr-closed-breathing=Armor equipment: starliner life support in a backpack. The Axiom-7 breathed the same air for 700 years — now so do you. Filters 100 % of the smog while charged: the armor does not wear at all. Spends 200 kW only in polluted air.

[equipment-name]
tpr-filter-module=Filter module
tpr-closed-breathing=Closed-loop breathing module

[equipment-description]
tpr-filter-module=Filters 50 % of the smog before it reaches the armor: the armor resource wears slower. Spends 40 kW only in polluted air; without charge it does not filter. Only the best breathing module in the grid works.
tpr-closed-breathing=Filters 100 % of the smog while charged: the armor does not wear. Spends 200 kW only in polluted air. Only the best breathing module in the grid works.

