[tpr-air]
environment=[font=default-bold]Air at the viewing position[/font]: __1__ · pollutant __2__ · chunk pollution __3__. This is not necessarily the character's location.
none=none
unknown=not measured
age=__1__ s ago
enabled=enabled
disabled=disabled
solar=Pollution component of the surface-wide solar multiplier: __1__% remaining; occlusion __4__. Applied __2__; last complete queue cycle __3__. Seasons and rain are separate factors. This is not individual panel shading.
curve=Shared smog/solar curve: min __1__, max __2__, exponent __3__; reduction __4__. Opacity, layer and see-through affect appearance only. A disappearing cloud does not remove pollution.
solar-unavailable=Solar calculation status unavailable or not yet measured; no clean-air conclusion can be drawn.
machine=Selected __1__: script gate __2__ · sampled pollution __3__ (__4__) · native status: __5__.
gate-on=permits operation
gate-off=waiting for pollution
thresholds=Gate starts above __1__, stops at __2__ or below; between them it retains its state. Permission is not proof of purification: power, circuit condition, recipe, consumables and output space still matter.
machine-unavailable=Selected CW machine is untracked or its location/sample is not current; no operation claim is available.
