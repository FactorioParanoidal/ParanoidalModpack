[tpr-air]
environment=[font=default-bold]Воздух в точке просмотра[/font]: __1__ · загрязнитель __2__ · загрязнение чанка __3__. Это не обязательно местоположение персонажа.
none=нет
unknown=не измерено
age=__1__ с назад
enabled=включена
disabled=выключена
solar=Компонент загрязнения в общем солнечном коэффициенте поверхности: осталось __1__%; окклюзия __4__. Применён __2__; последний полный цикл очереди — __3__. Сезон и дождь — отдельные множители. Это не индивидуальное затенение панелей.
curve=Общая кривая смога и солнца: минимум __1__, максимум __2__, показатель __3__; ослабление __4__. Непрозрачность, слой и прозрачность возле важных объектов меняют только изображение. Исчезновение облака не удаляет загрязнение.
solar-unavailable=Состояние солнечного расчёта недоступно или ещё не измерено; это не свидетельство чистого воздуха.
machine=Выбран __1__: автоматика __2__ · измеренное загрязнение __3__ (__4__) · фактический статус: __5__.
gate-on=разрешает работу
gate-off=ждёт загрязнения
thresholds=Автоматика включается выше __1__, выключается при __2__ и ниже; между порогами сохраняет состояние. Разрешение не доказывает очистку: важны питание, условие схемы, рецепт, расходники и свободный выход.
machine-unavailable=Выбранная машина CW не учтена либо её привязка/измерение устарели; утверждать её работу нельзя.
