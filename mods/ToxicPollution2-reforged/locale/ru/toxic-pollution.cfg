[item-description]
respirator=Ткань, уголь и надежда. Фильтрует 50% смога и 90% ядовитого газа; одноразовый: когда ресурс фильтров кончается, респиратор пропадает. BnL называет этот воздух «свежим»™.
tpr-gas-mask=Та самая модель, в которой Шелби Форсрайт записывал прощальное видео. Фильтрует 80% смога и 90% ядовитого газа. Пополняется воздушными фильтрами из инвентаря; без них изнашивается, как респиратор.
tpr-filter-module=Оборудование брони. Фильтрует 50% смога до брони, поэтому собственные фильтры брони живут дольше. Тратит 40 кВт только в загрязнённом воздухе; без заряда не фильтрует. В сетке работает только лучший дыхательный модуль. BnL Fresh Air™ — подписка не требуется (пока).
tpr-closed-breathing=Оборудование брони: система жизнеобеспечения лайнера в рюкзаке. «Аксиома-7» 700 лет дышала одним и тем же воздухом — теперь и ты. Фильтрует 100% смога, пока есть заряд; тратит 200 кВт только в загрязнённом воздухе.

[equipment-name]
tpr-filter-module=Фильтр-модуль
tpr-closed-breathing=Модуль замкнутого дыхания

[equipment-description]
tpr-filter-module=Фильтрует 50% смога до брони. Тратит 40 кВт только в загрязнённом воздухе; без заряда не фильтрует. В сетке работает только лучший дыхательный модуль.
tpr-closed-breathing=Фильтрует 100% смога, пока есть заряд. Тратит 200 кВт только в загрязнённом воздухе. В сетке работает только лучший дыхательный модуль.

