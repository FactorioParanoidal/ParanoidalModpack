[tips-and-tricks-item-name]
tpr-smog=Токсичный смог
tpr-smog-protection=Защита и фильтры
tpr-smog-sensor=Датчик загрязнения
tpr-smog-sos=Смог меня убивает
tpr-smog-settings=Настройки
tpr-smog-alerts=Предупреждения

[tips-and-tricks-item-description]
tpr-smog=Загрязнение отравляет того, кто дышит им без защиты. Организм переносит __1__ загрязнения в чанке (каждый уровень исследования «Защита от смога»: +10%).\n\n• [font=default-bold]Пока в слоте брони что-то надето[/font] — респиратор, противогаз, любая броня — смог не отравляет: весь удар принимает ресурс защиты. Умереть от смога в защите нельзя, пока ресурс не кончился.\n• Без защиты (или когда ресурс кончился) интоксикация растёт, тем быстрее, чем гуще смог. С __2__% смог наносит урон здоровью: до __3__% максимального здоровья в секунду при 100%.\n• Урон только пока дышишь смогом без защиты: вышел или надел защиту — урон сразу прекращается, интоксикация спадает на 1–5% в секунду.\n\nBnL называет этот воздух «свежим»™.
tpr-smog-protection=Защита тратит [font=default-bold]ресурс[/font] только в воздухе грязнее допустимого: тем быстрее, чем гуще смог. Сопротивление «Токсины» — стойкость: при 50% ресурс тратится вдвое медленнее, при 80% — впятеро. При загрязнении 500 без исследований: респиратор ~6 мин, лёгкая броня ~10 мин, противогаз ~30 мин, тяжёлая ~35 мин, модульная ~1,3 ч, силовая ~3 ч, силовая MK2 ~5 ч.\n\n• Броня с сеткой оборудования не разрушается: когда ресурс исчерпан, она просто перестаёт защищать. Маска или броня без сетки разрушается; с настройкой «Надевать запасную защиту» надевается та, что прослужит дольше.\n__1__\n• Дыхательные модули в сетке брони чистят воздух до брони: [img=item/tpr-filter-module] 50% за 40 кВт, [img=item/tpr-closed-breathing] 100% за 200 кВт. Работает только лучший модуль, энергию он тратит только в смоге.\n• Кабина транспорта тоже чистит воздух: машина 40%, танк и самолёт 85%, поезд 75% (бронированный 90%), паук 95%.\n• [img=item/respirator] и [img=item/tpr-gas-mask] задерживают и 90% ядовитого газа (капсулы, облака) за счёт своего ресурса.\n• В радиусе __2__ клеток от работающего воздушного фильтра, фермы или теплицы интоксикация спадает вдвое быстрее.
tpr-smog-refill=• Пополнение: когда в надетую защиту помещается целый [img=item/__1__] (или осталось меньше четверти), один воздушный фильтр из инвентаря добавляет __3__ ресурса, а взамен возвращается [img=item/__2__]. Респиратор одноразовый.
tpr-smog-sensor=Поставь сигнал [img=virtual-signal/tpr-pollution] в постоянный комбинатор: раз в секунду он выдаёт загрязнение чанка, где стоит комбинатор. Пишутся только ячейки с этим сигналом; убери сигнал — и комбинатор снова обычный.\n\nМожно включать воздушные фильтры, закрывать ворота или зажигать сигнальную лампу.
tpr-smog-sos=1. [font=default-bold]Надень что-нибудь в слот брони[/font] — хоть респиратор: урон сразу прекращается, пока у защиты есть ресурс.\n2. Или уйди из смога: урон прекращается, интоксикация спадает.\n3. Держи в инвентаре запасные маски, броню и воздушные фильтры: изношенная защита заменится сама.\n4. Исследуй «Защиту от смога»: организм переносит больше, защита служит дольше.\n5. Дыши рядом с воздушными фильтрами, фермами и теплицами: интоксикация спадает вдвое быстрее.\n6. Загрязняй меньше: фильтры, деревья, чистые машины.
tpr-smog-settings=Настройки мода (Настройки → Настройки модов → Игрок):
tpr-smog-alerts=Предупреждение появляется, только когда что-то резко меняется, и держится около 10 секунд: вошёл в смог; смог стал вдвое гуще; ресурс защиты упал ниже 25% и ниже 10%; защита износилась или заменена; начался урон — это предупреждение держится, пока идёт урон.\n\nНаведи на него: там шкала интоксикации, загрязнение против допустимого, фильтры транспорта и модуля, ресурс защиты и на сколько его хватит, запас воздушных фильтров и прогноз.\n\nЗначки: [img=virtual-signal/tpr-alert-smog] смог, [img=virtual-signal/tpr-alert-filters] защита на исходе или кончилась, [img=virtual-signal/tpr-alert-danger] смог наносит урон. Команда [font=default-bold]/toxic[/font] печатает то же состояние в чат, [font=default-bold]/toxic kills[/font] — смерти от смога.

