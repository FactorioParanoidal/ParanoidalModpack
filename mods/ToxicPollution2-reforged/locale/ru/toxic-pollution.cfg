[mod-setting-description]
tpr-tolerance=Загрязнение чанка, которое организм переносит без защиты. Выше него интоксикация растёт, ниже — спадает. Каждый уровень исследования «Защита от смога» добавляет 10%. По умолчанию 150.
tpr-hud=Авто: видна, пока есть интоксикация или вокруг загрязнение выше допустимого. Всегда / никогда.
tpr-auto-equip=Когда смог изнашивает маску или броню без сетки оборудования, надевается лучшая защита из инвентаря: сначала по фильтрации, затем по остатку ресурса фильтров.
tpr-sounds=Тревога, когда интоксикация начинает наносить урон; звуки замены фильтра и износа защиты.
tpr-respawn-respirator=Упрощённое выживание: новое тело получает респиратор в слот брони (или в инвентарь, если слот занят).

