[tips-and-tricks-item-name]
tpr-smog=Токсичный смог
tpr-smog-protection=Защита и фильтры
tpr-smog-sensor=Датчик загрязнения
tpr-smog-sos=Смог меня убивает
tpr-smog-settings=Настройки
tpr-smog-alerts=Предупреждения

[tips-and-tricks-item-description]
tpr-smog=Загрязнение отравляет того, кто дышит им без защиты. Организм переносит __1__ загрязнения в чанке (каждый уровень исследования «Защита от смога»: +10%).\n\n• [font=default-bold]Пока в слоте брони что-то надето[/font] — респиратор, противогаз, любая броня — смог не отравляет: весь удар принимает ресурс защиты. Умереть от смога в защите нельзя, пока ресурс не кончился.\n• Без защиты (или когда ресурс кончился) интоксикация растёт, тем быстрее, чем гуще смог. С __2__% смог наносит урон здоровью: до __3__% максимального здоровья в секунду при 100%.\n• Урон только пока дышишь смогом без защиты: вышел или надел защиту — урон сразу прекращается, интоксикация спадает на 1–5% в секунду.\n\nBnL называет этот воздух «свежим»™.
tpr-smog-protection=Защита тратит [font=default-bold]ресурс[/font] только в воздухе грязнее допустимого: тем быстрее, чем гуще смог. Сопротивление «Токсины» — стойкость: при 50% ресурс тратится вдвое медленнее, при 80% — впятеро. Любая броня служит втрое дольше масок. При загрязнении 500 без исследований: респиратор ~6 мин, противогаз ~30 мин, лёгкая броня ~30 мин, тяжёлая ~1,7 ч, модульная ~4 ч, силовая ~9 ч, силовая MK2 ~16 ч.\n\n• Броня с сеткой оборудования не разрушается: когда ресурс исчерпан, она просто перестаёт защищать. Маска или броня без сетки разрушается; на её место встаёт следующая из пачки в слоте, а с настройкой «Надевать запасную защиту» — та из инвентаря, что прослужит дольше.\n__1__\n• Дыхательные модули в сетке брони чистят воздух до брони: [img=item/tpr-filter-module] 50% за 40 кВт, [img=item/tpr-closed-breathing] 100% за 200 кВт. Работает только лучший модуль, энергию он тратит только в смоге.\n• Кабина транспорта тоже чистит воздух: машина 40%, танк и самолёт 85%, поезд 75% (бронированный 90%), паук 95%.\n• [img=item/respirator] и [img=item/tpr-gas-mask] задерживают и 90% ядовитого газа (капсулы, облака) за счёт своего ресурса.\n• В радиусе __2__ клеток от работающей машины, поглощающей загрязнение, интоксикация спадает вдвое быстрее, но только когда вдыхаемый воздух уже переносим. Бонус восстановления не делает всю область чистой.
tpr-smog-refill=• Пополнение: когда в надетую защиту помещается целый [img=item/__1__] (или осталось не больше четверти), один фильтр из инвентаря добавляет до __3__ ресурса, не выше максимума предмета. Взамен возвращается [img=item/__2__] того же качества; при полном инвентаре он выпадает на землю. Респиратор одноразовый. Исчерпанная броня с сеткой восстанавливается на очередном штатном обновлении после появления фильтра, даже в чистом воздухе.\n• Одни и те же свежие фильтры нужны очистителям CW и личной защите. Собирай использованные и регенерируй их; запас фильтров не равен гарантированному времени защиты.
tpr-smog-sensor=Поставь сигнал [img=virtual-signal/tpr-pollution] в постоянный комбинатор: раз в секунду он выдаёт целую часть загрязнения собственного чанка, а не процент личной опасности. Пишутся только ячейки с этим сигналом; убери сигнал — и комбинатор снова обычный.\n\nПример: подключи сигнал к условию включения очистителя, подведи свежие фильтры и электричество, отводи использованные фильтры. Собственный порог CW и условие схемы действуют вместе: разрешение одного не обходит запрет другого. CW включается выше 10 и выключается при 1 и ниже; между порогами сохраняет предыдущее разрешение. Разрешение не доказывает работу: проверь питание, рецепт, фильтры и свободный выход.\n\nВыбери машину CW и введи /toxic air, чтобы увидеть её автоматику и фактический статус.
tpr-smog-sos=1. [font=default-bold]Надень что-нибудь в слот брони[/font] — хоть респиратор: урон сразу прекращается, пока у защиты есть ресурс.\n2. Или уйди из смога: урон прекращается, интоксикация спадает.\n3. Держи в инвентаре запасные маски, броню и воздушные фильтры: изношенная защита заменится сама.\n4. Исследуй «Защиту от смога»: организм переносит больше, защита служит дольше.\n5. Восстанавливайся возле работающего поглотителя загрязнения: интоксикация спадает вдвое быстрее, но только когда вдыхаемый воздух уже переносим.\n6. Загрязняй меньше: фильтры, деревья, чистые машины.
tpr-smog-settings=Настройки мода (Настройки → Настройки модов → Игрок):
tpr-smog-alerts=• [img=virtual-signal/tpr-alert-filters] «Защиты от ядовитого смога нет!» висит, пока ты дышишь смогом без защиты.\n• [img=virtual-signal/tpr-alert-filters] Один раз, с коротким звуком: последняя защита (в пачке и в инвентаре замены нет) на 5% или до урона меньше минуты. Пока на смену есть следующая маска или броня, о каждой износившейся не предупреждает.\n• [img=virtual-signal/tpr-alert-danger] Смог наносит урон — висит, пока идёт урон.\n• [img=virtual-signal/tpr-alert-smog] На 10 секунд: вошёл в смог в защите или смог стал вдвое гуще.\n\nНаведи на предупреждение: там шкала интоксикации, загрязнение против допустимого, фильтры транспорта и модуля, ресурс защиты и на сколько его хватит, запас воздушных фильтров. Команда [font=default-bold]/toxic[/font] печатает то же состояние в чат, [font=default-bold]/toxic kills[/font] — смерти от смога.

