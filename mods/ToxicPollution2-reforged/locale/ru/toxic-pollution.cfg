[tips-and-tricks-item-name]
tpr-smog=Токсичный смог
tpr-smog-protection=Защита и фильтры
tpr-smog-hud=Панель и предупреждения
tpr-smog-sensor=Датчик загрязнения
tpr-smog-sos=Смог меня убивает
tpr-smog-settings=Настройки

[tips-and-tricks-item-description]
tpr-smog=Загрязнение отравляет того, кто им дышит. Организм переносит __1__ загрязнения в чанке (каждый уровень исследования «Защита от смога»: +10%). Вдыхаешь больше — интоксикация растёт, тем быстрее, чем гуще смог; меньше — спадает.\n\n• С __2__% интоксикации смог наносит урон здоровью: до __3__% максимального здоровья в секунду при 100%.\n• Урон только пока дышишь смогом: вышел или надел защиту — урон сразу прекращается. Интоксикация затем спадает на 1–5% в секунду, тем быстрее, чем чище воздух.\n• Защита фильтрует долю смога: [img=item/respirator] респиратор 50%, [img=item/tpr-gas-mask] противогаз 80%, броня — по сопротивлению «Токсины», дыхательные модули в сетке брони, закрытый транспорт. Слои складываются: что пропустил один, фильтрует следующий.\n• Безопасное загрязнение = допустимое ÷ (1 − фильтрация). Панель показывает его.\n\nBnL называет этот воздух «свежим»™.
tpr-smog-protection=Защита тратит [font=default-bold]ресурс фильтров[/font] только в воздухе выше допустимого и пропорционально тому, что отфильтровала.\n\n• Предметы с сеткой оборудования не разрушаются: когда фильтры исчерпаны, они просто перестают фильтровать. Маска или броня без сетки разрушается; с настройкой «Надевать запасную защиту» надевается лучшая защита из инвентаря.\n__1__\n• Дыхательные модули: [img=item/tpr-filter-module] 50% за 40 кВт, [img=item/tpr-closed-breathing] 100% за 200 кВт. Работает только лучший модуль, энергию он тратит только в смоге. Модуль чистит воздух до брони, поэтому фильтры брони служат дольше.\n• Транспорт: машина 40%, танк и самолёт 85%, поезд 75% (бронированный 90%), паук 95%.\n• [img=item/respirator] и [img=item/tpr-gas-mask] задерживают и 90% ядовитого газа (капсулы, облака) за счёт своего ресурса.\n• В радиусе __2__ клеток от работающего воздушного фильтра, фермы или теплицы интоксикация спадает вдвое быстрее.
tpr-smog-refill=• Пополнение: когда в надетую защиту помещается целый [img=item/__1__] (или осталось меньше четверти), один воздушный фильтр из инвентаря добавляет __3__ ресурса, а взамен возвращается [img=item/__2__]. Респиратор одноразовый.
tpr-smog-hud=Панель слева появляется в смоге и пока есть интоксикация: шкала интоксикации, сколько вдыхаешь против допустимого, безопасный уровень, фильтрация по слоям, ресурс и воздушные фильтры в инвентаре, а также прогноз: когда начнётся урон или когда очистишься.\n\nПредупреждения (по одному): [img=virtual-signal/tpr-alert-smog] интоксикация растёт, [img=virtual-signal/tpr-alert-filters] фильтры защиты исчерпаны, [img=virtual-signal/tpr-alert-danger] смог наносит урон. Команда [font=default-bold]/toxic[/font] печатает твоё состояние, [font=default-bold]/toxic kills[/font] — смерти от смога.
tpr-smog-sensor=Поставь сигнал [img=virtual-signal/tpr-pollution] в постоянный комбинатор: раз в секунду он выдаёт загрязнение чанка, где стоит комбинатор. Пишутся только ячейки с этим сигналом; убери сигнал — и комбинатор снова обычный.\n\nМожно включать воздушные фильтры, закрывать ворота или зажигать сигнальную лампу.
tpr-smog-sos=1. [font=default-bold]Уйди из смога[/font]: урон сразу прекращается, интоксикация начинает спадать.\n2. Надень [img=item/respirator] или [img=item/tpr-gas-mask]: с защитой тот же смог может стать терпимым (панель показывает безопасный уровень).\n3. Держи в инвентаре запасные маски и воздушные фильтры.\n4. Исследуй «Защиту от смога»: организм переносит больше, фильтры служат дольше.\n5. Дыши рядом с воздушными фильтрами, фермами и теплицами: интоксикация спадает вдвое быстрее.\n6. Загрязняй меньше: фильтры, деревья, чистые машины.
tpr-smog-settings=Настройки мода (Настройки → Настройки модов → Игрок):
