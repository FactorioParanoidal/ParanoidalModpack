[item-name]
respirator=Респиратор
tpr-gas-mask=Противогаз
tpr-filter-module=Фильтр-модуль
tpr-closed-breathing=Модуль замкнутого дыхания

[item-description]
respirator=Ткань, уголь и надежда. Пока надет, смог не отравляет: удар принимает ресурс защиты (стойкость 50%); ещё он задерживает 90% ядовитого газа. Одноразовый: ресурс кончился — респиратор пропал. BnL называет этот воздух «свежим»™.
tpr-gas-mask=Та самая модель, в которой Шелби Форсрайт записывал прощальное видео. Пока надет, смог не отравляет; стойкость 80%: ресурс тратится впятеро медленнее, чем у брони без стойкости. Задерживает 90% ядовитого газа. Пополняется воздушными фильтрами из инвентаря.
tpr-filter-module=Оборудование брони. Фильтрует 50% смога до брони, поэтому ресурс брони тратится медленнее. Тратит 40 кВт только в загрязнённом воздухе; без заряда не фильтрует. В сетке работает только лучший дыхательный модуль. BnL Fresh Air™ — подписка не требуется (пока).
tpr-closed-breathing=Оборудование брони: система жизнеобеспечения лайнера в рюкзаке. «Аксиома-7» 700 лет дышала одним и тем же воздухом — теперь и ты. Фильтрует 100% смога, пока есть заряд: броня не тратится совсем. Тратит 200 кВт только в загрязнённом воздухе.

[equipment-name]
tpr-filter-module=Фильтр-модуль
tpr-closed-breathing=Модуль замкнутого дыхания

[equipment-description]
tpr-filter-module=Фильтрует 50% смога до брони: ресурс брони тратится медленнее. Тратит 40 кВт только в загрязнённом воздухе; без заряда не фильтрует. В сетке работает только лучший дыхательный модуль.
tpr-closed-breathing=Фильтрует 100% смога, пока есть заряд: броня не тратится. Тратит 200 кВт только в загрязнённом воздухе. В сетке работает только лучший дыхательный модуль.

