[mod-setting-description]
tpr-tolerance=Загрязнение чанка, которое организм переносит без защиты. Выше него без защиты интоксикация растёт, а надетая защита изнашивается; при нём и ниже смог не вызывает износа. Заправка исчерпанной брони с сеткой всё равно может потратить фильтр. Каждый уровень исследования «Защита от смога» добавляет 10%. По умолчанию 150.
tpr-auto-equip=Когда смог изнашивает маску или броню без сетки оборудования, на её место встаёт следующая из пачки, а затем та защита из инвентаря, которой хватит дольше всех. Замена проходит молча: предупреждение звучит, только когда кончается последняя защита.
tpr-sounds=Звук при появлении предупреждения о смоге и при начале урона; звуки замены фильтра и износа защиты.
tpr-respawn-respirator=Упрощённое выживание: новое тело получает респиратор в слот брони (или в инвентарь, если слот занят).

