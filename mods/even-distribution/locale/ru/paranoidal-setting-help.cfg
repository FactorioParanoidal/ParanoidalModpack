[mod-setting-description]
disable-distribute=[item=inserter] Включённый флажок запрещает всем игрокам равномерное распределение предметов протягиванием Ctrl+щелчок из Even Distribution. Выключенный флажок разрешает функцию, но каждый игрок по-прежнему может настроить её для себя. Обычная передача предметов Factorio не отключается.\n[color=#9cdcfe]По умолчанию: флажок снят. Общая настройка карты.[/color]
disable-inventory-cleanup=[img=utility/trash] Включённый флажок запрещает всем игрокам очистку инвентаря горячей клавишей Even Distribution. Это функция раскладки лишних предметов по подходящим объектам, а не их уничтожение. Выключенный флажок снимает общий запрет; личные настройки сохраняются.\n[color=#9cdcfe]По умолчанию: флажок снят. Общая настройка карты.[/color]
global-max-inventory-cleanup-range=[item=inserter] Общий верхний предел радиуса раскладки лишних предметов при очистке инвентаря, в клетках. Реальный радиус не превысит ни этого значения, ни личной настройки и доступной дальности игрока. Большое число само по себе не даёт бесконечной дальности.\n[color=#9cdcfe]По умолчанию: 100. Диапазон: от 0. Общая настройка карты.[/color]
info=[img=utility/expand] Информационная строка: личные параметры Even Distribution находятся в его панели рядом с открытым инвентарём. Здесь остаются общие ограничения карты. Этот флажок не включает и не выключает сам мод.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
