[mod-setting-description]
disable-distribute=[item=inserter] When checked, disables Even Distribution’s Ctrl-click-and-drag balancing for every player. Unchecked allows the feature, subject to each player’s own settings. Ordinary Factorio item transfer remains available.\n[color=#9cdcfe]Default: checkbox unchecked. Shared map setting.[/color]
disable-inventory-cleanup=[img=utility/trash] When checked, disables the Even Distribution inventory-cleanup hotkey for all players. Cleanup places surplus items into suitable entities rather than destroying them. Unchecked removes this global ban; personal settings still apply.\n[color=#9cdcfe]Default: checkbox unchecked. Shared map setting.[/color]
global-max-inventory-cleanup-range=[item=inserter] Global upper limit on inventory-cleanup item placement range, in tiles. Actual range is limited by this value, the player’s own setting and their available reach. A large number alone does not grant unlimited reach.\n[color=#9cdcfe]Default: 100. Range: at least 0. Shared map setting.[/color]
info=[img=utility/expand] Information only: personal Even Distribution options are in its panel beside your open inventory. Global map restrictions remain here. This checkbox is not an on/off switch for the mod.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
