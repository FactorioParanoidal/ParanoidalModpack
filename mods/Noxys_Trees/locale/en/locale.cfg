[mod-setting-description]
Noxys_Trees-tree_dying_factor=[entity=tree-01] Sets the tree-fire death factor from 0 to 1. A value of 0 leaves the fire’s original parameter unchanged; it does not disable forest fires. This does not control pollution or overcrowding deaths.
Noxys_Trees-tree_fire_spread_speed_factor=[entity=tree-01] Multiplier for fire spreading between trees: 1 keeps the original delays and 2 halves them. Higher values spread fire faster; values below 1 slow it down. This does not change pollution deaths.
Noxys_Trees-emission_multiplier=[entity=tree-01] Multiplier for trees’ configured pollution absorption: 1 keeps it, 2 doubles it and 0 zeros it. A negative value turns absorption into pollution emission. This changes tree properties, not their growth frequency.
Noxys_Trees-collision_multiplier=[entity=tree-01] Multiplier for tree collision-box dimensions: 1 keeps the size supplied by other mods; below 1 makes trees less obstructive, above 1 increases the obstruction. Spacing for new trees is configured separately.
Noxys_Trees-enabled=[entity=tree-01] Enables Noxys Trees growth, spreading, death, revival and floor degradation. Turning it off stops this processing, but does not undo startup changes to fires, tree collision or pollution absorption.
Noxys_Trees-debug=[img=utility/notification] Prints statistics for tree growth, death, revival and floor degradation to chat. Noxys Trees processing and this checkbox must both be enabled; report timing is configured separately.
Noxys_Trees-debug-interval=[img=utility/clock] Minimum gap between debug reports, in game ticks: 60 ticks = 1 second. Reports require both mod processing and debugging to be enabled.
Noxys_Trees-degrade-tiles=[item=concrete] Allows growth attempts to gradually degrade ordinary floors, such as concrete and stone paths, exposing soil for trees. Refined concrete and its reinforced variants have a separate protection switch: disabling this checkbox alone does not protect them.
Noxys_Trees-do-not-degrade-reinforced-tiles=[item=refined-concrete] Protects refined concrete, its hazard markings and listed colored variants from Noxys Trees degradation. It does not protect ordinary concrete or stone paths; those use the separate floor-degradation option.
Noxys_Trees-overpopulation-kills-trees=[entity=tree-01] Allows random tree-death attempts in chunks at or above the configured tree-count threshold. Turning it off stops those attempts, but does not remove the growth threshold or other causes of death.
Noxys_Trees-kill-trees-near-unwanted=[entity=tree-01] Enables death checks near enemy spawners and turrets, uranium ore and player entities, plus poor-soil and pollution deaths. Turning it off disables all these death checks, but not new-tree placement restrictions or overcrowding deaths.
Noxys_Trees-ticks-between-operations=[img=utility/clock] Interval between forest-processing operations, in game ticks: 60 ticks = 1 second. Lower values mean more growth, death checks and floor degradation, but more processing work. Due operations are executed in batches every 30 ticks.
Noxys_Trees-chunks-per-operation=[entity=tree-01] How many random chunks to check per operation on the selected surface. A chunk is 32×32 tiles. Higher values change forests and floors faster but increase work per pass; surfaces are processed in turn.
Noxys_Trees-minimum-distance-between-tree=[entity=tree-01] Base spacing between a new tree and existing trees, in tiles. The check divides it by soil fertility: fertility 0.5 requires twice this spacing. Lower values allow denser forest.
Noxys_Trees-minimum-distance-to-enemies=[entity=tree-01] Prevents new trees within this many tiles of enemy spawners and stationary turrets. With nearby-hazard deaths enabled, the same radius is used to remove existing trees near them.
Noxys_Trees-minimum-distance-to-uranium=[entity=tree-01] Radius in tiles around standard uranium ore where new trees cannot grow. With nearby-hazard deaths enabled, it also applies to existing trees. If the modpack has no uranium-ore prototype, this check is skipped.
Noxys_Trees-minimum-distance-to-player-entities=[entity=tree-01] Spacing in tiles between new trees and entities of forces that have players. A value of 0 skips this check. With nearby-hazard deaths enabled, the same radius also removes existing trees near those entities.
Noxys_Trees-minimum-distance-to-degradeable-tiles=[item=concrete] Spacing in tiles from floors that Noxys Trees classifies as degradable. Checked even when floor degradation is disabled; 0 skips the check. Large values increase processing work substantially and may cause periodic pauses.
Noxys_Trees-deaths-by-lack-of-fertility-minimum=[entity=tree-01] Below this fertility, a randomly checked tree may die; chunk occupancy is also considered. A value of 0 disables this cause of death. Requires the nearby-hazard death-check option to be enabled.
Noxys_Trees-deaths-by-pollution-bias=[entity=tree-01] Pollution sensitivity divisor: a larger positive value makes pollution deaths harder to trigger and reduces additional checks. A value of 0 disables these death checks. They also require the nearby-hazard death option; this parameter additionally affects dead-tree revival.
Noxys_Trees-trees-to-grow-per-chunk-percentage=[entity=tree-01] Fraction of the chunk’s tree count used to choose growth attempts: 1 + the tree count times this fraction, rounded up. For 200 trees and 0.01 this gives 3 attempts, not 3 guaranteed new trees. It also affects the number of nearby-hazard death checks.
Noxys_Trees-maximum-trees-per-chunk=[entity=tree-01] At or above this tree count, Noxys Trees skips growth in the 32×32 chunk. Dead trees count too. Removing excess trees requires the separate overcrowding-death option; this is not an instant hard cap on the forest.
Noxys_Trees-expansion-distance=[entity=tree-01] Controls spreading distance from the parent tree, in tiles along each coordinate. A new position is chosen randomly in a square area, not a circle of this radius. Larger values widen the search area; other growth restrictions still apply.
Noxys_Trees-surfaces=[entity=tree-01] Surface names or numeric indices separated by commas or semicolons, without extra spaces. Noxys Trees processes forests and floors only there. If no entry is found, it falls back to surface 1; this option does not create surfaces.
Noxys_Trees-trees-grow-on-landfill=[item=landfill] Allows Noxys Trees to spread trees onto landfill by assigning it fertility 0.5; other growth checks remain. Reload the save after switching it back off: the script does not reset the previously assigned landfill fertility in the current session.
