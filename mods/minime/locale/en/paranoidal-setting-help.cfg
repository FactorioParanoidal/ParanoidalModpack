[mod-setting-description]
minime_close-gui-on-selection=[img=utility/close] Automatically closes Minime’s character-selection window after choosing a character. When off, the window stays open for further browsing; selection works either way.\n[color=#9cdcfe]Default: checkbox unchecked. Personal setting.[/color]
minime_scale-reach_resource_distance=[img=utility/character_resource_reach_distance_modifier_icon] Multiplies a character’s manual resource-mining reach by their Minime scale factor. Smaller characters reach less far and larger ones farther. This does not scale mining-drill range or general building reach.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
minime_scale-tool-attack-distance=[img=utility/character_reach_distance_modifier_icon] Scales the character’s melee reach with their Minime size. Shrinking reduces reach and enlarging increases it; this does not extend bullet or other ranged-weapon range.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
minime_toggle-gui-with=[img=utility/player_force_icon] Chooses how to open Minime’s character selector: a separate top-panel button or a shortcut-bar button. Switching hides the other entry point; character selection itself stays enabled.\n[color=#9cdcfe]Default: Button. Personal setting.[/color]
