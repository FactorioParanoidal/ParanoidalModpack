[mod-setting-description]
minime_close-gui-on-selection=[img=utility/close] После выбора нового персонажа автоматически закрывает окно выбора внешности Minime. Если выключить, окно остаётся открытым для дальнейшего просмотра; сам выбор персонажа работает в обоих случаях.\n[color=#9cdcfe]По умолчанию: флажок снят. Только для вас.[/color]
minime_scale-reach_resource_distance=[img=utility/character_resource_reach_distance_modifier_icon] Умножает дальность ручной добычи ресурса у персонажа на коэффициент его масштаба Minime. Уменьшенный персонаж достаёт ближе, увеличенный — дальше. Это не масштаб дальности электрических буров и не общий радиус строительства.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
minime_scale-tool-attack-distance=[img=utility/character_reach_distance_modifier_icon] Масштабирует дальность ближней атаки персонажа вместе с его размером Minime. Уменьшение делает досягаемость короче, увеличение — длиннее; дальность пуль и другого дальнобойного оружия этой настройкой не увеличивается.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
minime_toggle-gui-with=[img=utility/player_force_icon] Выбирает способ открытия окна выбора персонажа Minime: отдельная кнопка в верхней панели или кнопка на панели быстрого доступа. При смене варианта прежняя кнопка скрывается. Сам выбор внешности не отключается.\n[color=#9cdcfe]По умолчанию: Кнопка. Только для вас.[/color]
