[mod-setting-name]
__RITEG__autodeconstruct-health-threshold=Threshold
__RITEG__heating=Heat the buildings around

[mod-setting-description]
__RITEG__autodeconstruct-health-threshold=Threshold value in percentage for autodeconstruct. When the the RITEG health falls below the threshold it will be marked for autodeconstruct by bot. Valid values: [0,90], where 0 means never.
__RITEG__heating=Only with a mod that brings the freezing mechanic, Space Age for example. The RITEG then works as a heat source of about 100 degrees for the buildings and heat pipes that touch it, warm enough against the frost and too cold for a heat exchanger. It costs no fuel, so turn it off if that is too much.
