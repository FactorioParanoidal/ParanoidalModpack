[mod-setting-description]
angels-enable-hide-void=[img=utility/trash] Скрывает рецепты утилизации Angels из списка ручного изготовления, чтобы они не загромождали меню. Сами рецепты не удаляются: утилизация в соответствующих установках остаётся доступной.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
angels-starting-resource-base=[item=iron-ore] Базовый параметр стартовых ресурсов, зарезервированный Angels; в текущем коде он помечен как неиспользуемый. Не путайте его с богатством и размером месторождений в настройках генерации карты.\n[color=#9cdcfe]По умолчанию: 40000. Диапазон: 10000–1000000. После перезапуска игры.[/color]
