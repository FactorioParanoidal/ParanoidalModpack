[mod-setting-description]
angels-enable-hide-void=[img=utility/trash] Hides Angels’ disposal recipes from the hand-crafting list to reduce clutter. The recipes are not removed; compatible disposal machines can still use them.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
angels-starting-resource-base=[item=iron-ore] A starting-resource base value reserved by Angels; the current code marks it as unused. Do not confuse it with deposit richness and size in map-generation settings.\n[color=#9cdcfe]Default: 40000. Range: 10000–1000000. Requires a game restart.[/color]
