[mod-setting-description]
ritnmods-bl-01=1 = vanilla / 5 = max
ritnmods-bl-03=0 = vanilla / 5 = max
ritnmods-bl-04=0 = vanilla / 5 = max
lepp_light_size_factor=Factor applied on top of scaling with wire distance.\nSet to 0 to use the equivalent of a small lamp on every pole.
inlaid-lamps-extended-light_size=Size of white light of inlaid lamps when not connected (1-100, default: 40). The 2x2 lamp gets twice as much.
