[mod-name]
paranoidal-lighting=Paranoidal Lighting

[mod-description]
paranoidal-lighting=Lighting for Paranoidal: 2x2 large, copper, electric copper and floor lamps, inlaid lamps (1x1 and 2x2) you can walk and drive over, lighted copies of every electric pole with a lamp inside, and larger status lights on mining drills, train stops and power switches. Replaces Larger Lamps 2.0, Inlaid Lamps Extended, Lighted Electric Poles + and BIG LIGHT.

