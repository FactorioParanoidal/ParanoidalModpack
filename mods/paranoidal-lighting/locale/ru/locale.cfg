[mod-name]
paranoidal-lighting=Paranoidal Lighting (Освещение Параноидал)

[mod-description]
paranoidal-lighting=Освещение для сборки Paranoidal.\n\n— Большие лампы 2×2 с широким мягким светом: большая (электрическая, подключается к сети сигналов), медная (сжигает твёрдое топливо — свет до появления электричества), электрическая медная и напольная — светящаяся плитка, по которой можно ходить и ездить.\n— Встроенные лампы 1×1 и 2×2, утопленные в пол: по ним можно ходить и ездить, они подключаются к сети сигналов и меняют цвет, как обычные лампы.\n— Освещённая копия («… с лампой») каждого электрического столба сборки, включая столбы других модов: свет растёт с дальностью проводов, лампа внутри столба потребляет энергию, как обычная.\n— Крупнее огни состояния у буров, остановок поезда и переключателей питания; размер и цвет задаются в настройках.\n\nЗаменяет моды «Larger Lamps 2.0», «Inlaid Lamps Extended», «Lighted Electric Poles +» и «BIG LIGHT».

