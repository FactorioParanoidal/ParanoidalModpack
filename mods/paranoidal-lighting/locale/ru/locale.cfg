ritnmods-bl-03=0 = как в обычной игре / 5 = максимум
ritnmods-bl-04=0 = как в обычной игре / 5 = максимум
lepp_light_size_factor=Множитель, применяемый дополнительно к масштабированию по дальности проводов.\nПри значении 0 каждый столб освещает область как маленькая лампа.
inlaid-lamps-extended-light_size=Размер белого света встроенных ламп без подключения к логической сети (1-100, по умолчанию: 40). У лампы 2×2 — вдвое больше.
