[mod-name]
MultipleUnitTrainControl-reforged=Multiple Unit Train Control Reforged

[mod-description]
MultipleUnitTrainControl-reforged=Locomotives of the same type facing opposite directions work as an MU pair: the one facing the way of travel pulls for both. Alt mode shows the pairs over the locomotives.

[mutc]
mu-name=__1__ (MU)
mu-description=MU pair: pulls for both locomotives of the pair in either direction.
label-pair=MU +__1__%
label-single=no pair
label-single-quality=no pair: other quality
label-single-apart=no pair: wagons between
label-single-type=no pair: other type
replace-failed=MU: locomotive "__1__" could not be rebuilt and was dropped on the ground with its contents: [gps=__2__,__3__,__4__]

[technology-name]
multiple-unit-train-control=Multiple unit train control
adv-multiple-unit-train-control=Wireless multiple unit train control

[technology-description]
multiple-unit-train-control=Two locomotives of the same type coupled to each other and facing opposite directions work as a pair: the one facing the way of travel pulls for both, +100% traction for the pair. Locomotives of a pair share fuel.
adv-multiple-unit-train-control=Locomotives form pairs anywhere in the train, also across wagons, and the whole train shares fuel.

[modifier-description]
mutc-basic=Pairs of coupled locomotives facing opposite directions
mutc-wireless=Pairs anywhere in the train

[mod-setting-name]
mutc-mode=MU pairs
mutc-share-fuel=Shared fuel in MU trains
mutc-show-labels=MU labels in alt mode

[mod-setting-description]
mutc-mode=By research: the two technologies unlock pairs of coupled locomotives and pairs anywhere in the train.\nAlways: pairs anywhere in the train without research, the technologies are hidden.\nOff: every MU locomotive becomes a normal one again (use before removing the mod).
mutc-share-fuel=Linked locomotives of a train with an MU pair even out their fuel and burnt results (empty batteries) every 5 seconds.
mutc-show-labels=Show "MU +100%" over paired locomotives and "no pair" over locomotives of a two-way train that pull in one direction only.

[string-mod-setting]
mutc-mode-research=By research
mutc-mode-always=Always
mutc-mode-off=Off
