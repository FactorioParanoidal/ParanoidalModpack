label-single-quality=без пары: другое качество
label-single-apart=без пары: между ними вагоны
label-single-type=без пары: другой тип
replace-failed=Спарка: локомотив «__1__» не удалось пересоздать, он и его содержимое выложены на землю: [gps=__2__,__3__,__4__]

[technology-name]
multiple-unit-train-control=Система многих единиц
adv-multiple-unit-train-control=Беспроводная система многих единиц

[technology-description]
multiple-unit-train-control=Два локомотива одного типа, сцепленные друг с другом и развёрнутые в разные стороны, работают в спарке: тот, что смотрит по ходу движения, тянет за двоих — +100% тяги для пары. Локомотивы спарки делят топливо.
adv-multiple-unit-train-control=Спарки собираются в любом месте состава, в том числе через вагоны, и топливо делит весь состав.

[modifier-description]
mutc-basic=Спарка сцепленных локомотивов, развёрнутых в разные стороны
mutc-wireless=Спарка в любом месте состава

[mod-setting-name]
mutc-mode=Спарка локомотивов
mutc-share-fuel=[img=utility/fuel_icon] Общее топливо в составах со спаркой
mutc-show-labels=Метки спарки в режиме Alt

[mod-setting-description]
mutc-mode=По исследованию — базовая технология разрешает пары в группе соседних локомотивов без вагонов между ними, беспроводная — в любом месте состава. Всегда — второй режим без исследований. Выключено — возврат MU-локомотивов к обычным; перед удалением мода дождитесь замены всех. Замены выполняются только на безопасно остановленных составах; движущиеся и занятые диспетчерской поезда могут ждать.
mutc-share-fuel=Выравнивает топливо и отработанные предметы (например, пустые аккумуляторы) между связанными локомотивами состава с MU-парой. Обмениваются только локомотивы с одинаковыми категориями топлива; качество предметов сохраняется. Проверка идёт каждую секунду порциями, полный обход связанных поездов обычно укладывается в пять секунд.
mutc-show-labels=Показывать «спарка +100%» над локомотивами в спарке и «без пары» над локомотивами двустороннего состава, которые тянут только в одну сторону. Метки видны в режиме подробной информации (Alt), только игрокам своей силы с включённым этим флажком.

[string-mod-setting]
mutc-mode-research=По исследованию
mutc-mode-always=Всегда
mutc-mode-off=Выключено
