[mod-name]
MultipleUnitTrainControl-reforged=Система многих единиц (Reforged)

[mod-description]
MultipleUnitTrainControl-reforged=Локомотивы одного типа, развёрнутые в разные стороны, работают в спарке: тот, что смотрит по ходу движения, тянет за двоих. В режиме Alt над локомотивами видно, кто в спарке.

[mutc]
mu-name=__1__ (спарка)
mu-description=Спарка: тянет за оба локомотива пары в любом направлении.
label-pair=спарка +__1__%
label-single=без пары
label-single-quality=без пары: другое качество
label-single-apart=без пары: между ними вагоны
label-single-type=без пары: другой тип
replace-failed=Спарка: локомотив «__1__» не удалось пересоздать, он и его содержимое выложены на землю: [gps=__2__,__3__,__4__]

[technology-name]
multiple-unit-train-control=Система многих единиц
adv-multiple-unit-train-control=Беспроводная система многих единиц

[technology-description]
multiple-unit-train-control=Два локомотива одного типа, сцепленные друг с другом и развёрнутые в разные стороны, работают в спарке: тот, что смотрит по ходу движения, тянет за двоих — +100% тяги для пары. Локомотивы спарки делят топливо.
adv-multiple-unit-train-control=Спарки собираются в любом месте состава, в том числе через вагоны, и топливо делит весь состав.

[modifier-description]
mutc-basic=Спарка сцепленных локомотивов, развёрнутых в разные стороны
mutc-wireless=Спарка в любом месте состава

[mod-setting-name]
mutc-mode=Спарка локомотивов
mutc-share-fuel=Общее топливо в составах со спаркой
mutc-show-labels=Метки спарки в режиме Alt

[mod-setting-description]
mutc-mode=По исследованию: две технологии открывают спарку сцепленных локомотивов и спарку в любом месте состава.\nВсегда: спарка в любом месте состава без исследований, технологии скрыты.\nВыключено: все локомотивы спарки снова становятся обычными (так делают перед удалением мода).
mutc-share-fuel=Связанные локомотивы состава со спаркой каждые 5 секунд выравнивают топливо и отработанное топливо (пустые аккумуляторы).
mutc-show-labels=Показывать «спарка +100%» над локомотивами в спарке и «без пары» над локомотивами двустороннего состава, которые тянут только в одну сторону.

[string-mod-setting]
mutc-mode-research=По исследованию
mutc-mode-always=Всегда
mutc-mode-off=Выключено
