[mod-name]
MultipleUnitTrainControl-reforged=Multiple Unit Train Control Reforged (Спаренные локомотивы — переработанные)

[mod-description]
MultipleUnitTrainControl-reforged=Спаренные локомотивы: в составах «туда-обратно» тянут все локомотивы, а не только те, что смотрят по ходу.\n\n— Пара локомотивов одного типа, развёрнутых в разные стороны, работает в спарке: тот, что смотрит по ходу, тянет за двоих (+100% тяги для пары).\n— Базовая технология — для сцепленных друг с другом локомотивов, беспроводная — для локомотивов в любом месте состава.\n— Локомотивы в спарке делят топливо между собой.\n— В режиме Alt над локомотивами видно «спарка +100%» или почему пары нет (другое качество, вагоны между ними, другой тип).\n\nПереписанный Multiple Unit Train Control (robot256) для сборки Paranoidal.

