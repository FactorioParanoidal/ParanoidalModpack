[mod-setting-description]
paranoidal-sound-weapons=Источник этого звука. По умолчанию — immersive-sounds2, как в сборке до объединения. Не меняет боевые характеристики.\nВыбор гранаты не меняет другие взрывы; выбор пулемёта автомобиля не меняет отдельные звуки танка. Копии базового оружия могут наследовать выбранный звук. Требуется перезапуск игры.
paranoidal-sound-trains=Источник этого железнодорожного звука. По умолчанию — newtrainsfx2, как в сборке до объединения. Двери, остановка двигателя и дополнительный скрежет тормозов остаются от immersive-sounds2.\nВыбор стука действует отдельно на локомотив и грузовой вагон; у цистерны и артиллерийского вагона сохраняется newtrainsfx2. Производные прототипы могут наследовать выбор; собственные звуки других модов не заменяются принудительно. Требуется перезапуск игры.

