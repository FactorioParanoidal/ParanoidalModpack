[mod-setting-description]
paranoidal-sound-weapons=Source of this sound. Defaults to immersive-sounds2, as in the modpack before the merge. Does not change combat statistics.\nThe grenade choice does not change other explosions; the car machine gun choice does not change the tank's separate sounds. Copies of base weapons may inherit the selected sound. Requires restarting the game.
paranoidal-sound-trains=Source of this railway sound. Defaults to newtrainsfx2, as in the modpack before the merge. Doors, engine shutdown and the separate brake squeal remain from immersive-sounds2.\nClatter is selected independently for the locomotive and cargo wagon; fluid and artillery wagons retain newtrainsfx2. Derived prototypes may inherit the selection; other mods' own sounds are not forcibly overwritten. Requires restarting the game.

