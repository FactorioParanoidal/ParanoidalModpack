[entity-description]
ppd-transformer-40=Connects the main grid to a district. The tall brown bushing on the left is the input: run a wire to it from a main grid pole. The short grey one on the right is the output: wire it to the district poles. When the district draws 36-44 MW, the transformer gives it 6 % more energy than it takes.
ppd-transformer-80=Connects the main grid to a district. The tall brown bushing on the left is the input: run a wire to it from a main grid pole. The short grey one on the right is the output: wire it to the district poles. When the district draws 72-88 MW, the transformer gives it 8 % more energy than it takes.
ppd-transformer-160=Connects the main grid to a district. The tall brown bushing on the left is the input: run a wire to it from a main grid pole. The short grey one on the right is the output: wire it to the district poles. When the district draws 144-176 MW, the transformer gives it 10 % more energy than it takes.
ppd-transformer-320=Connects the main grid to a district. The tall brown bushing on the left is the input: run a wire to it from a main grid pole. The short grey one on the right is the output: wire it to the district poles. When the district draws 288-352 MW, the transformer gives it 12 % more energy than it takes.
ppd-pole-in=Wire from the main grid goes here.
ppd-pole-out=Wire to the district poles goes from here.
ppd-load-bank=Wastes energy so that the district load does not drop below the green zone. 0 to 10 MW. Pays off only when the district is a little short of the zone.
ppd-power-meter=Shows the satisfaction of the network it stands in and puts signals E, G, M, U, C on the circuit network: consumption, production, possible production, satisfaction and accumulator charge. Works in any network, not only in districts.

