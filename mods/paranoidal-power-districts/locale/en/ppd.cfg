[ppd-advice]
bypass="__1__": transformer input and output are in one network. Press "Find wire" and cut the connection or open the power switch.
loop="__1__": transformers pass energy around in a circle. Remove the transformer that feeds the main grid from the district.
converter="__1__": a boiler turns district electricity into steam. Move it to the main grid.
noinput="__1__": no energy at the input. Wire the input to the main grid or add power plants.
limit="__1__" asks for more than the __2__ limit. Use a bigger transformer or add a second one with its output into this district.
off-auto="__1__" switched off by automation. It switches on by itself when the main grid has spare power.
off-manual="__1__" switched off by hand.
off-circuit="__1__" switched off by a circuit condition.
under="__1__": __2__ short of the green zone.
over="__1__": __2__ above the green zone.
fit="__1__" draws __2__: __3__ fits.
no-fit="__1__" draws __2__, which fits no nominal. Add __3__ of load and use __4__, or split the district.
bank-yes="__1__": a load bank in Auto mode adds __2__ and brings the bonus.
bank-no="__1__": a load bank does not pay off here, it needs at least __2__ % load.
jumpy="__1__": the load jumps by __2__ % within 5 minutes. Add accumulators to the district or a load bank.
near-top="__1__" is at the top of the zone: __2__ %. One more machine takes it out of the zone.
reserve-noinput="__1__": the reserve transformer has no power at its input.
nowire-in="__1__": run a wire from a main grid pole to the tall bushing on the left.
nowire-out="__1__": run a wire from the short bushing on the right to the district poles.
boost="__1__" runs on boost: it asks for more than the limit __2__. In a minute the transformer goes back to the limit; add a second one or a bigger one.
tap="__1__": tap __2__ puts the district into the green zone.

