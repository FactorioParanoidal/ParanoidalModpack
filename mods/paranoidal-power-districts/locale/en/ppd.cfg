[mod-setting-description]
ppd-bonus-multiplier=1.0 gives the bonuses from the description: 6, 8, 10 and 12 %. 0 removes the bonus; priorities and automation stay.
ppd-zone-half-width=10 means the zone is 90-110 % of the nominal. Fine regulation adds 5 and 10 to this number.
ppd-update-period=60 ticks (1 second) by default. More means less script work, but larger transformer buffers and slower automation.
ppd-default-messages=Which alerts new transformers send. Each transformer can change it in its settings.
ppd-shed-threshold=Load shedding switches districts off when the main grid satisfaction stays below this threshold for 3 seconds. Can be changed in the Dispatcher.
ppd-alt-labels=Load and bonus over each transformer in the status colour.
ppd-zone-sound=A short sound when a district leaves the green zone.

