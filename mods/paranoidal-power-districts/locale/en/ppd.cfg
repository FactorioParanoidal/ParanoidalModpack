[technology-description]
ppd-transformers=Split the base into districts. A transformer with a matching load gives its district more energy than it takes from the main grid. Unlocks T-40 and the Dispatcher.
ppd-transformers-2=T-80 for 72-88 MW districts.
ppd-transformers-3=T-160 for large factories.
ppd-transformers-4=T-320 for whole blocks.
ppd-load-banks=Top up a district load to the green zone.
ppd-power-automation=Load shedding on power shortage, staged restore and reserve transformers.
ppd-efficiency=Bonus of all transformers ×1.1 per level.
ppd-regulation=Green zone 5 % wider on each side.
ppd-taps=A tap shifts the transformer's nominal by 10 % per step, with its green zone and limit. Set in the transformer window.
ppd-auto-taps=The transformer changes its tap by itself when the district stays out of the green zone for half a minute. At most once per 30 seconds.
ppd-amorphous-cores=Idle draw of all transformers is 60 % lower.
ppd-overload=When a district asks for more than the limit, the transformer gives up to 150 % of its nominal for up to 60 seconds, then rests for 5 minutes.
ppd-metering=The power meter shows the state of any network and puts its numbers on the circuit network.

