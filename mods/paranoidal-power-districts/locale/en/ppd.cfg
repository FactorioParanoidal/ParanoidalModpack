[mod-name]
paranoidal-power-districts=Paranoidal: Power Districts

[mod-description]
paranoidal-power-districts=Transformers T-40...T-320 split the base into districts. When a district draws 90-110 % of the nominal, the transformer gives it 6-12 % more energy than it takes. Priorities, load shedding, reserve, load bank, circuit signals and a Dispatcher window. The ordinary grid works as before.

