[tips-and-tricks-item-name]
ppd-districts=Power districts
ppd-green-zone=Green zone
ppd-matching=Choosing a transformer
ppd-smoothing=Smoothing the load
ppd-priorities=Priorities and automation

[tips-and-tricks-item-description]
ppd-districts=A transformer splits the grid into the main grid and a district. The tall brown bushing on the left is the input: wire it to the main grid. The short grey one on the right is the output to the district poles. While a bushing has no wire, a plug icon blinks above it. The ordinary grid works as before; transformers are for saving energy.\n\nNew poles do not wire themselves to a transformer: connect it by hand. Blueprints and copy-paste keep the bushing wires.
ppd-green-zone=The bonus works while the district draws 90-110 % of the nominal on a 30 second average. Watch the gauge in the transformer window or the lamp on the front: green means the district is in the zone.
ppd-matching=A 52 MW load fits no nominal. Add machines, split the district or put two transformers with outputs into one district: their nominals add up.
ppd-smoothing=Accumulators in a district fill the gaps: their charging counts as load. A load bank tops up the rest. Transformer circuit signals help to switch extra machines off at peaks.
ppd-priorities=Important districts get power first, secondary ones only take the surplus. After Power automation, on a shortage districts are switched off one by one and back on one by one.

