[mod-name]
paranoidal-power-districts=Paranoidal: Power Districts (Paranoidal: регулируемые районы)

[mod-description]
paranoidal-power-districts=Трансформаторы Т-40…Т-320 делят базу на районы. Если район берёт 90–110 % номинала, трансформатор отдаёт ему на 6–12 % больше энергии, чем забирает. Приоритеты, разгрузка при нехватке энергии, резерв, Нагрузочный блок, сигналы логической сети и Диспетчерская. Обычная сеть работает как раньше.

