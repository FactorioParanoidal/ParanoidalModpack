[ppd-advice]
bypass=«__1__»: вход и выход трансформатора в одной сети. Нажмите «Найти провод» и перережьте соединение или разомкните Выключатель питания.
loop=«__1__»: трансформаторы передают энергию по кругу. Уберите трансформатор, который питает общую сеть из района.
converter=«__1__»: котёл превращает электричество района в пар. Перенесите его в общую сеть.
noinput=«__1__»: на вход не приходит энергия. Подключите вход к общей сети или добавьте электростанций.
limit=«__1__» просит больше предела __2__. Поставьте трансформатор мощнее или добавьте второй с выходом в этот район.
off-auto=«__1__» отключён автоматикой. Он включится сам, когда в общей сети появится запас.
off-manual=«__1__» отключён вручную.
off-circuit=«__1__» отключён условием логической сети.
under=«__1__»: до зелёной зоны не хватает __2__.
over=«__1__»: лишние __2__ сверх зелёной зоны.
fit=«__1__» берёт __2__: подойдёт __3__.
no-fit=«__1__» берёт __2__, это не попадает ни в один номинал. Добавьте __3__ нагрузки и поставьте __4__ или разделите район.
bank-yes=«__1__»: Нагрузочный блок в режиме «Авто» добавит __2__ и даст бонус.
bank-no=«__1__»: Нагрузочный блок здесь невыгоден, он окупается от __2__ % загрузки.
jumpy=«__1__»: за 5 минут загрузка скачет на __2__ %. Поставьте Аккумуляторные блоки в районе или Нагрузочный блок.
near-top=«__1__» у верхней границы зоны: __2__ %. Ещё одна машина выведет район из зоны.
reserve-noinput=«__1__»: у резервного трансформатора нет питания на входе.
nowire-in=«__1__»: протяните провод от столба общей сети к высокому изолятору слева.
nowire-out=«__1__»: протяните провод от низкого изолятора справа к столбам района.
boost=«__1__» работает на форсаже: просит больше предела __2__. Через минуту трансформатор вернётся к пределу, поставьте второй или мощнее.
tap=«__1__»: отпайка __2__ выведет район в зелёную зону.

