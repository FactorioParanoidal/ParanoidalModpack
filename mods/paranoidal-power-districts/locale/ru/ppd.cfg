[entity-description]
ppd-transformer-40=Соединяет общую сеть с районом. Высокий коричневый изолятор слева — вход: проведите к нему провод от столба общей сети. Низкий серый справа — выход: от него провод идёт к столбам района. Если район берёт 36–44 МВт, трансформатор отдаёт ему на 6 % больше энергии, чем забирает.
ppd-transformer-80=Соединяет общую сеть с районом. Высокий коричневый изолятор слева — вход: проведите к нему провод от столба общей сети. Низкий серый справа — выход: от него провод идёт к столбам района. Если район берёт 72–88 МВт, трансформатор отдаёт ему на 8 % больше энергии, чем забирает.
ppd-transformer-160=Соединяет общую сеть с районом. Высокий коричневый изолятор слева — вход: проведите к нему провод от столба общей сети. Низкий серый справа — выход: от него провод идёт к столбам района. Если район берёт 144–176 МВт, трансформатор отдаёт ему на 10 % больше энергии, чем забирает.
ppd-transformer-320=Соединяет общую сеть с районом. Высокий коричневый изолятор слева — вход: проведите к нему провод от столба общей сети. Низкий серый справа — выход: от него провод идёт к столбам района. Если район берёт 288–352 МВт, трансформатор отдаёт ему на 12 % больше энергии, чем забирает.
ppd-pole-in=Сюда подключается провод от общей сети.
ppd-pole-out=Отсюда провод идёт к столбам района.
ppd-load-bank=Тратит энергию впустую, чтобы нагрузка района не опускалась ниже зелёной зоны. От 0 до 10 МВт. Выгоден, только когда до зоны не хватает немного.
ppd-power-meter=Показывает обеспеченность сети, в которой стоит, и выдаёт в логическую сеть сигналы E, G, M, U, C: потребление, выработку, возможную выработку, обеспеченность и заряд аккумуляторов. Работает в любой сети, не только в районе.

