[technology-description]
ppd-transformers=Делите базу на районы. Трансформатор с подходящей нагрузкой отдаёт району больше энергии, чем берёт из общей сети. Открывает Т-40 и Диспетчерскую.
ppd-transformers-2=Т-80 для районов на 72–88 МВт.
ppd-transformers-3=Т-160 для больших цехов.
ppd-transformers-4=Т-320 для целых кварталов.
ppd-load-banks=Добирают нагрузку района до зелёной зоны.
ppd-power-automation=Разгрузка при нехватке энергии, автовключение по одному району и резервные трансформаторы.
ppd-efficiency=Бонус всех трансформаторов ×1,1 за уровень.
ppd-regulation=Зелёная зона шире на 5 % с каждой стороны.
ppd-taps=Отпайка сдвигает номинал трансформатора на 10 % за шаг, а вместе с ним зелёную зону и предел. Настраивается в окне трансформатора.
ppd-auto-taps=Трансформатор сам переключает отпайку, если район полминуты держится вне зелёной зоны. Не чаще раза в 30 секунд.
ppd-amorphous-cores=Холостой ход всех трансформаторов меньше на 60 %.
ppd-overload=Когда район просит больше предела, трансформатор до 60 секунд отдаёт до 150 % номинала, потом 5 минут отдыхает.
ppd-metering=Электросчётчик показывает состояние любой сети и выдаёт её цифры в логическую сеть.

