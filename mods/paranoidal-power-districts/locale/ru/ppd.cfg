[mod-setting-description]
ppd-bonus-multiplier=1,0 значит бонусы как в описании: 6, 8, 10 и 12 %. 0 убирает бонус, остаются приоритеты и автоматика.
ppd-zone-half-width=10 значит зона 90–110 % номинала. «Точная регулировка» добавляет к этому числу 5 и 10.
ppd-update-period=60 тиков (1 секунда) по умолчанию. Больше значит меньше работы скрипта, но буферы трансформаторов растут, а автоматика реагирует медленнее.
ppd-default-messages=Какие оповещения получают новые трансформаторы. У каждого трансформатора это можно поменять в его настройках.
ppd-shed-threshold=Разгрузка отключает районы, если обеспеченность общей сети ниже этого порога дольше 3 секунд. Меняется в Диспетчерской.
ppd-alt-labels=Над каждым трансформатором загрузка и бонус цветом статуса.
ppd-zone-sound=Короткий сигнал при выходе района из зелёной зоны.

