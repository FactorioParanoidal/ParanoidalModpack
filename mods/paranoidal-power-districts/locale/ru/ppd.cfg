ppd-smoothing=Сглаживание нагрузки
ppd-priorities=Приоритеты и автоматика

[tips-and-tricks-item-description]
ppd-districts=Трансформатор делит электросеть на общую сеть и район. Высокий коричневый изолятор слева — вход: проведите к нему провод от общей сети. Низкий серый справа — выход к столбам района. Пока провода нет, над изолятором мигает значок вилки. Обычная сеть работает как раньше; трансформатор нужен, если хотите экономить.\n\nНовые столбы не тянут провода к трансформатору сами: подключайте его вручную. Чертёж и копирование сохраняют провода к изоляторам.
ppd-green-zone=Бонус идёт, пока район в среднем за 30 секунд берёт 90–110 % номинала. Следите за шкалой в окне трансформатора или за лампой на корпусе: зелёная — район в зоне.
ppd-matching=Нагрузка 52 МВт не попадает ни в один номинал. Добавьте машин, разделите район или поставьте два трансформатора с выходом в один район: их номиналы складываются.
ppd-smoothing=Аккумуляторные блоки в районе заполняют провалы: их зарядка считается нагрузкой. Нагрузочный блок добирает недостающее. Сигналы трансформатора в логической сети помогают выключать лишнее на пиках.
ppd-priorities=Важные районы питаются первыми, второстепенные получают только излишки. После исследования «Автоматика энергосистемы» при нехватке энергии районы отключаются по очереди и включаются обратно по одному.

