[mod-name]
zzzparanoidal-settings=PARANOIDAL: hide balance settings (ПАРАНОИДАЛ: скрыть настройки баланса)

[mod-description]
zzzparanoidal-settings=Прячет стартовые настройки других модов, которые меняют баланс и прогрессию сборки, — чтобы случайно не сломать задуманную игру.\n\nСпрятанные настройки продолжают работать с сохранёнными значениями — мод их не меняет. Чтобы увидеть и изменить их, выключите этот мод, поменяйте настройки и включите снова.
