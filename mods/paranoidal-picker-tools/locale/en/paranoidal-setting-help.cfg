[mod-setting-description]
yemtositemcount-disable-artillery-remote=[item=artillery-targeting-remote] Hides the held-item inventory counter while holding an artillery remote. With this off, the counter may also appear for that remote; artillery controls and ammunition amounts are unchanged.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
yemtositemcount-disable-blueprint-items=[item=deconstruction-planner] Hides the counter for deconstruction and upgrade planners. It does not disable ordinary blueprint counts: those separately show how many copies your main-inventory items can build.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
yemtositemcount-disable-mod=[item=steel-chest] Disables only the on-screen counter for held-item stock and buildable blueprint copies. Other Picker Tools features, including entity movement, keep working. Uncheck to restore the counter.\n[color=#9cdcfe]Default: checkbox unchecked. Personal setting.[/color]
yemtositemcount-number-format=[item=steel-chest] Chooses how the counter writes numbers: full digits, grouped thousands or abbreviated k, M and larger suffixes. For example, 1 247 is exact while 1.2k is shortened. Only display formatting changes; items are not rounded away or removed.\n[color=#9cdcfe]Default: 1,247. Personal setting.[/color]
