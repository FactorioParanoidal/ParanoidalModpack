[mod-name]
paranoidal-picker-tools=Paranoidal Picker Tools

[mod-description]
paranoidal-picker-tools=Building and inventory tools in one mod.\n\n- Planner menu and planner cycling, planner zapper, tape measure.\n- Count of the held item; for a blueprint, how many times it can be built.\n- Reverse a whole belt (Alt+R).\n- Belt brush: lines, corners and balancers of the chosen width from the belt in hand (Ctrl+Shift+= / Ctrl+Shift+-, Alt+C, Alt+B).\n- Move and rotate placed entities together with their wires (Shift+arrows).\n- Chest sorting, chest contents mover, chest limits, quality scrolling of the held item (Ctrl+Shift+wheel), automatic ghost revival, searchlight and more.\n\nMerges Picker Extended Reborn, Yemto's Item Count, Belt Reverser 2.0, Belt Brush (Reforged) and Even Pickier Dollies.
