[mod-name]
paranoidal-picker-tools=Paranoidal Picker Tools (Инструменты пикера)

[mod-description]
paranoidal-picker-tools=Набор удобств для строительства и инвентаря в одном моде.\n\n— Меню планировщиков и быстрое переключение между ними, удаление планировщика из руки, рулетка.\n— Счётчик предметов в руке; для чертежа — сколько раз его хватит построить.\n— Разворот конвейера целиком (Alt+R).\n— Кисть конвейеров: линии, углы и балансиры нужной ширины из конвейера в руке (Ctrl+Shift+= и Ctrl+Shift+−, Alt+C, Alt+B).\n— Сдвиг и поворот построенных объектов вместе с проводами (Shift+стрелки).\n— Автосортировка, перенос содержимого и ограничение сундуков, прокрутка качества предмета в руке (Ctrl+Shift+колесо), автовосстановление призраков, фонарь персонажа и другое.\n\nОбъединяет Picker Extended Reborn, Yemto's Item Count, Belt Reverser 2.0, Belt Brush (Reforged) и Even Pickier Dollies.
