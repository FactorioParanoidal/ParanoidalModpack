[mod-setting-description]
yemtositemcount-disable-artillery-remote=[item=artillery-targeting-remote] Прячет счётчик запаса предметов при удержании пульта артиллерии. При выключении счётчик может показываться и для пульта; управление артиллерией и количество снарядов настройка не меняет.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
yemtositemcount-disable-blueprint-items=[item=deconstruction-planner] Прячет счётчик для планов сноса и улучшения. Это не отключение счёта обычных чертежей: для них мод отдельно показывает, на сколько полных построек по чертежу хватает предметов в основном инвентаре.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
yemtositemcount-disable-mod=[item=steel-chest] Выключает только экранный счётчик запаса удерживаемого предмета и доступных копий чертежа. Остальные инструменты Picker Tools, включая перемещение объектов, продолжают работать. Чтобы вернуть счётчик, снимите флажок.\n[color=#9cdcfe]По умолчанию: флажок снят. Только для вас.[/color]
yemtositemcount-number-format=[item=steel-chest] Выбирает запись чисел в счётчике: полное число, разделение тысяч или сокращения k, M и далее. Например, 1 247 показывает точное количество, а 1,2k — укороченное. Это только формат отображения, предметы не округляются и не исчезают.\n[color=#9cdcfe]По умолчанию: 1,247. Только для вас.[/color]
