[technology-description]
research-efficiency=BnL head office has extended Directive 99-99 "Cost optimization" to the labs: they work slower, but every science pack now covers more research.\nEach level: research productivity +1%, lab speed lower (exact value in the effects). Every stage opens after its level of lab research speed, so the total speed bonus never goes below zero.\nThe savings will be added to your bonus.* *Bonuses are cancelled by the same directive.
worker-robot-battery=Worker robot battery capacity +10% per level.\nBnL guarantees the charge lasts the whole five-year cruise.* *The return date of the cruise is set by Directive A113.
