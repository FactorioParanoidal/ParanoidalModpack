paranoidal-upgrade-tech=PARANOIDAL: Upgrade Tech (ПАРАНОИДАЛ: технологии улучшений)

[mod-description]
paranoidal-upgrade-tech=Технологии-улучшения из Beta 8 вместо All-infinit-tech: умеренные бонусы, за которые приходится платить.\n\n— «Директива 99-99: экономная наука», 20 уровней: продуктивность исследований +1 % за уровень, но лаборатории работают медленнее (от −6 до −12 % скорости за уровень). Каждая ступень открывается после своего уровня «Скорости лабораторий», поэтому общий бонус скорости не уходит в минус.\n— «Аккумуляторы BnL Долгий Заряд™»: ёмкость батарей рабочих дронов +10 % за уровень — 11 уровней от синей до жёлтой науки, после космической науки бесконечные, каждый следующий вдвое дороже.\n— Бесконечные «Продуктивность добычи» и «Количество следующих за персонажем дронов» дорожают вдвое с каждым уровнем, как в Beta 8.\n\nНесовместим с All-infinit-tech, InfiniteTech и efficient-research.

[technology-name]
research-efficiency=Директива 99-99: экономная наука
worker-robot-battery=Аккумуляторы BnL Долгий Заряд™

[technology-description]
research-efficiency=Головной офис BnL распространил директиву 99-99 «Оптимизация издержек» на лаборатории: работают медленнее, зато каждый научный пакет идёт на большее число исследований.\nКаждый уровень: продуктивность исследований +1 %, скорость лабораторий ниже (точное значение — в эффектах). Каждая ступень открывается после своего уровня «Скорости лабораторий», поэтому общий бонус скорости не уходит в минус.\nСэкономленное будет начислено вам в премию.* *Премии отменены той же директивой.
worker-robot-battery=Ёмкость аккумуляторов рабочих дронов +10 % за уровень.\nBnL гарантирует: заряда хватит на весь пятилетний круиз.* *Дата возвращения из круиза определяется директивой A113.
