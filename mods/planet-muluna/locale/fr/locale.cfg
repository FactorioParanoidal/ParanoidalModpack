[technology-description]
space-science-pack=Production du [item=space-science-pack] sur [planet=muluna].
muluna-anorthite-processing=Production d'aluminium à partir de [item=anorthite-chunk], pouvant être utilisé comme [item=rocket-fuel] et comme source alternative de [item=copper-cable].
muluna-advanced-stone-processing=Utilisation d'un [item=crusher] pour traiter [item=stone] avec une productivité accrue.
interstellar-science-pack=Technologies pour explorer plus loin dans l'espace.
muluna-nanofoamed-polymers=Débloqué en débloquant n'importe quels __1__ packs de science planétaires de la liste suivante :
muluna-helium-enrichment=Le retraitement de l'hélium nous permet d'explorer des technologies exotiques.
advanced-space-science-pack=Permet la production de [item=space-science-pack] dans l'espace.
space-chest-muluna=Un coffre pouvant stocker un petit tampon d'objets hors de la soute d'un vaisseau.
muluna-cycling-steam-turbine=Une machine à vapeur plus efficiente qui permet à une aprtie de la vapeur consommée de se condenser en eau pour pouvoir être chauffée à nouveau. Préfère de la vapeur de qualité.
#Note for localisers: quality here is a thermodynamics joke. If the joke doesn't translate to your language, don't include it. https://en.wikipedia.org/wiki/Vapor_quality
muluna-oxygen=Si nous voulons brûler quoi que ce soit ici, nous allons devoir produire notre propre oxygène.
muluna-wood-cultivation=Culture du [item=wood] dans [entity=chemical-plant]. Facile à mettre en place, mais lent. Consomme [fluid=carbon-dioxide] et produit [fluid=oxygen].
muluna-greenhouses=Serres dédiées pouvant produire [item=wood] et [fluid=oxygen] bien plus rapidement que [entity=chemical-plant], mais elles doivent être ensemencées avec [item=muluna-sapling] avant de pouvoir être utilisées.
muluna-gas-venting=Même si [item=wood] est un excellent puits de carbone, il ne suffit pas à maintenir une centrale énergétique stable. Dans les situations d'urgence, il faut évacuer le gaz en excès pour éviter une perte de courant.
muluna-fertilized-greenhouses=Les nutriments de [planet=gleba] nous permettent d'améliorer le rendement en [item=wood] dans [entity=muluna-greenhouse-wood].
muluna-fertilized-greenhouses-vulcanus=La fluorocétone de [planet=aquilo] nous permet de faire pousser des arbres sur n'importe quelle surface et augmente encore les rendements en [item=wood] dans [entity=muluna-greenhouse-wood].
asteroid-productivity=Meilleure productivité du broyage d'astéroïde sur les plateformes spatiales et sur [planet=muluna].
asteroid-reprocessing=Retraite les impuretés des astéroïdes pour obtenir un meilleur équilibre de ressources sur les plateformes spatiales et sur [planet=muluna].
advanced-asteroid-processing=Obtenez une plus grande variété de ressources à partir des astéroïdes sur les plateformes spatiales et sur [planet=muluna].
muluna-space-telescope=Données astronomiques extraites de la planète pulvérisée.


[technology-effect]
contributes-to-discovery=Vous amène un peu plus près de découvrir [technology=__1__]__2__, ce qui requiert __3__ technologies similaires.


