[entity-description]
muluna-satellite-radar=Agit comme un radar avec une portée illimitée, cartographiant la vue distante des joueurs sur les planètes autour desquelles le radar satellitaire orbite. Ne consomme de l'énergie qu'avec l'usage. Les radars de meilleure qualité cartographient plus de tuiles et consomment moins d'énergie par tuile.
muluna-greenhouse=Doit être ensemencé avec une culture spécifique dans une machine d'assemblage avant de pouvoir être placé.
low-density-space-platform-foundation=Deux fois plus solide et moitié moins dense qu'une fondation de plateforme spatiale standard.
muluna-microcellular-plastic=Plastique contenant des milliards de trous microscopiques. Présente des particularités inhabituelles.
muluna-diffused-plastic=Plastique enrichi avec du dioxyde de carbone. Ce dioxyde de carbone ne restera pas dans le plastique pour très longtemps, surtout sans des techniques de fabrication avancées. Des métaux plus durs ou de meilleures usines chimiques pourraient être la voie vers un taux d'échec moindre.
muluna-advanced-boiler=Une chaudière capable de fonctionner en environnement dépourvu d'oxygène tel que [planet=muluna] et sur des plateformes spatiales.
space-boiler-legacy=Chaudière obsolète qui a été remplacée par [item=muluna-advanced-boiler]. Minez celle-ci pour en recevoir un exemplaire.
space-heating-tower=Une tour de chauffage caable de fonctionner en environnement dépourvu d'oxygène tel que [planet=muluna] et sur des plateformes spatiales
muluna-cycling-steam-turbine=Une machine à vapeur plus efficace qui permet à une plus grande quantité de vapeur de se recondenser en eau pour pouvoir être chauffée à nouveau. Préfère de la vapeur de plus haute qualité.\n[fluid=steam] Température max: 500 °C\n[fluid=cooled-steam] température: 100 °C
muluna-rocket-buggy=Une voiture plus grande et rapide armée avec un lance-roquette et une grille d'équipement.
muluna-vacuum-heating-tower=Produit de la chaleur à partir de carburants chimiques avec une efficacité encore supérieure. Peut être utilisée sur toutes les surfaces, mais consomme [fluid=oxygen] et produit [fluid=carbon-dioxide].
muluna-telescope-combinator=Observe l'Univers, obtenant des inforamtions sur les alentours du téléscope.\nSur les planètes:\n[img=quality.normal]: Catalogue de toutes les plateformes spatiales en orbite\n[img=quality.uncommon]: État de chaque plateforme spatiale en orbite\n[img=quality.rare]: Si(2) ou si non(1) chaque plateforme en orbite peut partir\nSur les plateformes:\n[img=virtual-signal.signal-I]:Catalogue de plateformes spatiales\n[img=virtual-signal.signal-X]:Si sur une connexion spatiale, la position actuelle sur la connexion\n[img=virtual-signal.signal-L]:Si sur une connexion spatiale, la longueur totale de la connexion\nLe téléscope émet également un signal pour chaque astéroïde etourant la plateforme. Sous-composant de [entity=muluna-telescope].
muluna-telescope=Observe l'Univers, générant des données astronomiques. Produit plus de données dans des lieux plus exotiques. Génère également des signaux de réseau via [entity=muluna-telescope-combinator]. Seul un téléscope peut être placé par planète, mais il n'y a pas de limite sur les plateformes spatiales.
muluna-crusher=Un broyeur alimenté par un moteur électrique. Broie les objets avec une meilleure efficacité énergétique.


