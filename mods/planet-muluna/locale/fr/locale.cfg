[mod-name]
planet-muluna=○🌐Muluna, Lune de Nauvis


[mod-description]
planet-muluna=○🌐Explorez la lune de Nauvis, Muluna, avec son industrie fondée sur le broyage, et faites votre premier pas dans l'espace. Découvrez de nouveaux usages pour les broyeurs, qui fonctionnent dorénavant sur toutes les surfaces. Utilisez le pack de science d'exploration pour améliorer vos plateformes spatiales et vous aventurer encore plus profondément dans l'espace.


[space-location-name]
muluna=Muluna


[space-location-description]
muluna=Le plus grand satellite naturel de Nauvis. La surface est dépourvue de vie, mais riche en métaux et minéraux. Le cuivre n'est pas aisément accessible, mais l'aluminium peut en servir d'ersatz pour la plupart des usages. Les plantes poussent difficilement ici.


