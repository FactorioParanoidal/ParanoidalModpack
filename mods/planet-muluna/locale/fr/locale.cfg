[tips-and-tricks-item-description]
muluna-briefing=[planet=muluna] est une étendue infinie de roches grises. Les météorites sont abondantes à la surface, et riches en métaux, carburant et eau, mais obtenir ces ressources nécessite d'abord de concasser les météorites dans [entity=crusher].\n[entity=metallic-asteroid-chunk]: Principale source de [item=iron-ore]. [entity=carbonic-asteroid-chunk]: Principale source de carburant chimique sous la forme de [item=carbon].\n[entity=oxide-asteroid-chunk]: Principale source de [fluid=water]. [entity=anorthite-chunk]: Source alternative de [item=copper-cable] et [item=rocket-fuel].\nLe carburant ne peut pas être brûlé sans une source artificielle de [fluid=oxygen]. Les produits pétroliers ne peuvent pas être produits ici sans des technologies bien au-delà de nos connaissances actuelles.
space-science=En débloquant [item=interstellar-science-pack], il devient possible de produire [item=space-science-pack] sur des plateformes spatiales en utilisant des morceaux d'astéroïdes.
