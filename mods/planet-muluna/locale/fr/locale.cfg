muluna-regolith-digging=Placez une foreuse n'importe où sur [planet=muluna] sans ressources à proximité pour commencer à forer le régolithe. Débarassez-vous de la pierre concassée non désirée soit en l'enfouissant dans le sol lunaire avec un bras robotisé soit en le plaçant comme une tuile. D'autres objets indésirables peuvent également être enfouis de la même façon.


