[entity-description]
muluna-data-assembler=Сборочный автомат с портами данных: заполняет и разряжает ячейки данных и собирает [item=interstellar-science-pack]. Данные подводятся кабелем данных к портам по бокам.
muluna-burner-roboport=Робопорт, который заправляет роботов топливом и окислителем вместо электричества — роботы летают и без атмосферы.\nСм. также: [entity=muluna-burner-roboport-roboport]
muluna-burner-roboport-roboport=Часть робопорта [entity=muluna-burner-roboport]
muluna-telescope-combinator-no-quality=Смотрит во вселенную и собирает сведения об окрестностях телескопа.\nНа планетах: номер каждой космической платформы на орбите\nНа платформах:\n[img=virtual-signal.signal-I]: номер космической платформы\n[img=virtual-signal.signal-X]: на космическом маршруте — текущая позиция на нём\n[img=virtual-signal.signal-L]: на космическом маршруте — его длина\nТелескоп также выдаёт сигнал на каждый астероид вокруг платформы. Часть [entity=muluna-telescope].

[entity-factoriopedia-description]
muluna-telescope-combinator=Смотрит во вселенную и собирает сведения об окрестностях телескопа.\nНа планетах:\n[img=quality.normal]: номер каждой космической платформы на орбите\n[img=quality.uncommon]: состояние каждой платформы на орбите\n      [font=default-bold]1[/font]: ждёт стартовый набор.\n      [font=default-bold]2[/font]: стартовый набор запрошен у логистической сети.\n      [font=default-bold]3[/font]: стартовый набор в пути.\n      [font=default-bold]4[/font]: следует по маршруту.\n      [font=default-bold]5[/font]: платформа готова покинуть планету и не принимает доставки.\n      [font=default-bold]6[/font]: в расписании нет станций.\n      [font=default-bold]7[/font]: нет пути.\n      [font=default-bold]8[/font]: ждёт на станции\n      [font=default-bold]9[/font]: на паузе\n[img=quality.rare]: может ли (2) или не может (1) каждая платформа на орбите улететь\nНа платформах:\n[img=virtual-signal.signal-I]: номер космической платформы\n[img=virtual-signal.signal-X]: на космическом маршруте — текущая позиция на нём\n[img=virtual-signal.signal-L]: на космическом маршруте — его длина\nТелескоп также выдаёт сигнал на каждый астероид вокруг платформы. Часть [entity=muluna-telescope].
muluna-telescope-combinator-no-quality=Смотрит во вселенную и собирает сведения об окрестностях телескопа.\nНа планетах: номер каждой космической платформы на орбите\nНа платформах:\n[img=virtual-signal.signal-I]: номер космической платформы\n[img=virtual-signal.signal-X]: на космическом маршруте — текущая позиция на нём\n[img=virtual-signal.signal-L]: на космическом маршруте — его длина\nТелескоп также выдаёт сигнал на каждый астероид вокруг платформы. Часть [entity=muluna-telescope].

