[technology-description]
yuoki-mechanical-force=Двигатели сжигают твёрдое или жидкое топливо и дают механическую силу (MF): со смазкой, на воде или всухую. Силовые валы несут MF к генераторам, ковка на MF экономит сталь на Т-металле. Электричество не нужно, но двигатели дымят.
yuoki-mechanical-force-2=Экономичный и более чистый газовый двигатель и средний генератор. MF как ресурс: воздухоочиститель Fatmice вымывает загрязнение из воздуха, малый электромотор превращает электричество в MF.
yuoki-materials=Центрифугирование трёх разных сверхчистых руд даёт куски N4 (УниКомпозит) и F7 (Энергоминерал). Дробление, плавка и формовка; фабрикатор C1 для деталей Юоки.
yuoki-electronics=Платы, чипы M68K и I286, проводник и катушки, рамы машин, фабрикатор Y2.
yuoki-archaeology=Копка грязи и её промывка: древние информационные осколки, чистые железо и медь, загрязнённая грязь и топливо; инструментальные и буровые головки и их ремонт.
yuoki-transmutation=Реструктор Cimota: руды, шлак, осколки и отходы сдаются в УК-A2 (УниКомпозит).
yuoki-smelting=Плавильня «Франк и Пеппе» и зарядник Зайдона: теплоаккумулирующие блоки и быстрая плавка пластин и стали из чистых металлов.
yuoki-crystallization=Промывочная эмульсия с затравкой из ценной пыли, кристальная пыль и кристаллическая затравка. Затравка в центрифуге 2 и выше даёт 5 кусков вместо 3.
yuoki-chemistry=Газ Фрумитал-R из угольной пыли и компоста, гидротин, катализаторы и жидкое топливо.
yuoki-accumulators=Компенсатор потока Mk4: 50 МДж, 8 МВт.
yuoki-agronomy=Каркасная ферма: кукуруза и вугарный тростник из культур Angels, сахар, целлюлоза, компост, растительное масло и синтетическая древесина. Кукурузу Юоки и Angels можно менять друг на друга.
yuoki-research-center=Исследовательский центр и знаки науки из исследовательских пакетов.
yuoki-alien-technology=Атомно-квантовый композер и инопланетный инфузор: трансмутированный УК-A2, квантрин, кристаллы Лачнана и информационные кристаллы.
yuoki-fabrication-3=Самый быстрый фабрикатор Юоки.
yuoki-catalytic-centrifuging=Затравка и катализатор — кристалл Лачнана (возвращается с вероятностью 90 %) — дают в центрифуге 3 восемь кусков.
yuoki-accumulators-2=Аккумулятор AQE (200 МДж, 20 МВт) и квантриновый аккумулятор (600 МДж, 40 МВт).
yuoki-aeet=Передача энергии на очень большую площадь.
yuoki-solar=Коллекторы потока Sol-Ray: 1,5 и 3 МВт, одинаково днём и ночью.
yuoki-heavy-mf=MF в больших объёмах для машин и ферм Юоки: большой и огромный MF-генераторы, перегреватель, турбина «пар → MF», TMFW-Gen-50 и средний электромотор.
yuoki-obninsk=Термоядерное топливо MX, Обнинский реактор и турбина Ренсуира.
yuoki-genetics=ДНК-сплайсер, клеточное ранчо и гидра-ферма: омтринит, веротин и органическое железо из ДНК-линий; зола уноса из воздухоочистителя и сточные воды Angels кормят фермы.
yuoki-rheinsberg=Пар до 1000 °C для турбины TMFW-TUR-72; квантриновый реактор.
yuoki-reputation=Древний монумент медленно приносит репутацию.
yuoki-trade=Врата «Лайка» и торговый узел: экспорт товаров Юоки за знаки торговца, обмен знаков на репутацию, покупка ДНК.
yuoki-transmutation-2=УК-A2 обратно в руды и ресурсы. Каждая перегонка требует лицензии — знаков торговца и заряженного F-C.
yuoki-food-trade=Ледогенератор, упаковка и консервы; экспорт продуктов приносит знаки торговца, УК-A2, квантрин и репутацию.
yuoki-mastercraft=Мастерская промывочная машина и подземный бур за знаки техника и природы.
yuoki-ultimates=Трофеи культов наживы, науки и природы.
yuoki-armor=Стандартный рабочий защитный костюм YI и костюм мастера-техника.
yuoki-armor-2=Костюм мастера YI и ходоки.
yuoki-defense=Тяжёлый пулемёт, скорострельная пушка и лазерная турель сильнее лучших турелей Bob; силовое поле Vitduo.
yuoki-defense-2=Плазменная и огнесмесевая турели с боеприпасами; лазерная крепость D-ZTT.
yuoki-repair=Ремнаборы сильнее ремнабора Bob 5.
yuoki-repair-2=Лучший ремнабор.
yuoki-solar-dish=Солнечная тарелка с двигателем Стирлинга и тепловым аккумулятором: 30 кВт днём и ночью из стали, шестерён, кабеля и схем.
