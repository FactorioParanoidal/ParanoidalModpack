[item-description]
y_steinmehl=Нужна для промывочной эмульсии.
y_crystal_dust=Нужна для выращивания кристаллов.
y_mox2fuelsplited=Ослабленное топливо MX-C, безопасное для химических топок.
y_structure_electric=Внутри кабель! И это всё?
yi_armor_gray=Защищает лучше. Теперь вам спокойнее.
yi_armor_red=Красный привлекает кусак, но вы — могучий символ силы и бесстрашия.
yi_armor_gold=Шедевр ручной работы и символ могучей индустриализации.
yi_walker_a=Не позволяйте мощи управлять вами…
yi_walker_c=Смерть приносит покой. Боевая броня YI T1, созданная для планетарной обороны и торговых войн.
y_greensign=Теперь вы официально чудак-натуралист.
ypfw_trader_sign=Каждая сделка укрепляет вашу репутацию надёжного партнёра.
y_rwtechsign=Награда за сложное строительство или производство.
ye_science_blue=Знак науки из ниоткуда. Продолжайте заниматься наукой — может, однажды вам официально выдадут белый халат.
y_drillhead=Буровая головка — копает больше, лучше и быстрее.
y_drillhead_broken=Ой, сломалась. Это не я! Может, ещё можно починить?
y_toolhead=Это швейцарский нож — правда, не острый.
y_toolhead_broken=Кто-то сломал мой швейцарский нож — теперь ему нужны любовь и ремонт.
y_block_heat=Содержит огромное количество тепла.
y_block_cold=Сейчас холодный, но может долго хранить тепло — огромное количество… нет, «огромное» даже мало сказано.
y_gauge=Аналоговый манометр. Аналоговый = без электричества = надёжнее.
y-dirtwasher=Промойте материалы и посмотрите, что получится.
y-dirt=Куча грязи с окаменелостями или чем-то полезным.
y-pure-copper=Чистая медь.
y-pure-iron=Чистое железо.
y-c_mud=Загрязнённая грязь.
y-dry_mud=Прессованный шар сухой грязи.
y-notfall-generator-s2=Обычный генератор — второй приоритет, энергия по запросу.
y_ammo_case=Для особых и сложных в обращении боеприпасов.
y_ammo_plasma=Благодаря стандартизации YI подходит ко всему человеческому плазменному оружию.
y_ammo_flame=Картридж с твёрдой горючей смесью кислоты, топлива и липкой жидкости. Горит адски. НЕ ВСКРЫВАТЬ: воспламеняется на воздухе.
y-toxic-dust=Токсичная и ядовитая. Ни в коем случае не вдыхать.
y-conductive-wire-1=Лучше медного провода.
y-conductive-coil-1=Не знаю, что это, но звучит хорошо. Пусть эта штука вас удивит.
y-battery-single-use1=Просто пустой элемент батареи.
y-battery-single-use2=Элемент батареи, заряженный парой джоулей.
y-battery-single-use3=Собранные элементы батареи для разных нужд.
y-atomic-quantum-composer=Вы не понимаете, как это работает, но оно работает — и это всё, что вам нужно… пока планета не развалится.
y-chip-1=Чип для простых операций.
y-chip-2=Чип для обычных операций.
y-repair-durotal=Ремонтирует быстрее и служит дольше.
y-repair-krakon=Лучший ремонтный набор, который можно сделать.
y_repair_quantrinum=Если что-то сломано, этот инструмент это починит.
y-wall-forcefield=Днём батареи заряжаются — этого хватает, чтобы силовое поле работало всегда.
y-crystal2=Эти осколки нужно исследовать и объединить.
y-quantrinum=Материал, возникший при неизвестных обстоятельствах.
y-crystal-cnd=Использует эффект Лачнана, чтобы сливать атомные ядра и перестраивать их в новые атомные структуры.
y-raw-fuelnium=Неупакованное инопланетное топливо. Опасно. Хотите светиться — просто съешьте… может, станете следующим Халком или Суперменом.
y-fuel-reactor=В оболочке эта энергия должна быть безопасна в обращении — для Обнинска и как компонент.
y-res1=Кусок синего материала — вещества галактического масштаба с разными классами качества. Похоже, это класс N-4 (C37/ZRF-4A/E). Не встречается на поверхности: получается переработкой.
y-res2=Кусок заряженного материала — чаще всего его называют фуэлниум-C или F7. Сырой, требует очистки. Не встречается на поверхности: получается переработкой.
y-atomic-constructor=Никто не понимает эту инопланетную технологию перестройки атомов, но она работает! Иногда!
y-ups-flywheel-b=Медленно заряжается, но разряжается очень быстро. Работает, пока в него поступает энергия.
y-unicomp-a2=Синтетический универсальный композит класса A2. Бесконечные возможности для перестройки. Очень высокая ценность.
y-richdust=Пыль с кучками руды.
y-infused-uca2=Трансмутированный и перезаряженный.
y-infused-mud=Насыщенная и заряженная.
y-fuel-cell-c=Неизвестная конструкция, но пригодна к использованию. Приобретается через врата «Лайка».
y-coal-dust=Уголь, перемолотый в пыль. Не вдыхать.
y-mixed-fuel=Твёрдый блок смешанного топлива.
