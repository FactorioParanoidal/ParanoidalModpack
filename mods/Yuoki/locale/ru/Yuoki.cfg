[entity-description]
y_trockner=Перерабатывает богатую эмульсию.
y_hppump=Закачивает эмульсию под землю, чтобы вымывать минералы.
y_crystalizer=Выращивает минеральные кристаллы.
y_mixer_emu=Смешивает промывочную эмульсию.
ye_science_ultimate=Сила — в знании!
y_trade_ultimate=Прибыль выше совести! Совесть ведёт к банкротству.
y_obninsk_mc=Первая промышленная АЭС, перестроенная и улучшенная. Навстречу светлому будущему!
y_mc_dirtwasher=Промывает руду и грязь, отбирая полезные материалы.
y_mc_underground_drill=Под поверхностью можно найти богатые залежи… на некоторых планетах… вам повезло?
y_smelter=Новые достижения в плавке.
y_charger=Метод тепловой зарядки, разработанный Томасом Л. Зайдоном.
y-dirtwasher=Промойте материалы и посмотрите, что получится.
y-obninsk-reactor=Посвящён первому гражданскому ядерному реактору (30 МВт тепловой, 5 МВт чистой электрической мощности). Разумеется, у нас улучшенная версия. Итоговая электрическая мощность зависит от генератора.
y-notfall-generator-s2=Обычный генератор — второй приоритет, энергия по запросу.
y_turret_gun1f12=Только грубая сила отобьёт атаки чужих — никакой пощады!
y_turret_gun2f12=Двуствольная, с высокой скорострельностью благодаря гидромеханической системе Модлина, открытой в старой загадке механики жидкостей.
y_turret_laser22f12=Последние верные силы бегут на крейсере «Эйзенштейн», чтобы предупредить Империю. Они стоят до конца против любого врага — человека или нет. Каждая пушка собрана из небольшого куска корабля.
y_turret_plasma=Плазма — сама по себе загадка. Может, импульсный лазерный усилитель? Неважно. Она убивает чужих — это главное.
y_turret_flame=Очистим нечисть праведным огнём! Стоп, кто-то заказывал стейк на гриле? Вот он, свежеобжаренный, прямо за стеной! Внимание: пироманы любят огонь и не отличают вас от чужих.
y-weapon-ztt=Оружие мгновенного переноса «Йорген». Йорген первым испытал путешествие во времени… неудачно. Но он создал это оружие и продолжает исследовать время.
y-wall-forcefield=Названа в честь украинского учёного. Отражает урон. Полученная кинетическая энергия (урон) подзаряжает поле, но структура ядра не умеет самовосстанавливаться.
y-atomic-quantum-composer=Вы не понимаете, как это работает, но оно работает — и это всё, что вам нужно… пока планета не развалится.
y-accumulator-m-t2=Понимание квантрина позволяет делать аккумуляторы компактнее — средняя версия.
y-accumulator-b-t2=Понимание квантрина позволяет делать аккумуляторы компактнее — большая версия.
y-accumulator-b-tx=Аккумулятор на атомно-квантовом эффекте — теперь с меньшей взрывоопасностью! Никаких чёрных дыр и скачков гравитации. Наверное. Безопасно, только если вы в другой галактике. ;)
y_compensator_25=Док: «Марти, скажи… а поток умеет летать?»
y-obninsk-turbine=Эффект Ренсуира позволяет добиться сверхбыстрого внутреннего вращения, не доходя до точки разрушения.
y-underground-drill=Для добычи ценной пыли.
y-ups-flywheel-b=Медленно заряжается, но разряжается очень быстро. Работает, пока в него поступает энергия.
y-atomic-constructor=Никто не понимает эту инопланетную технологию перестройки атомов, но она работает! Иногда!
y-alien-infuser=Для трансмутации материи.
y-accumulator-crystal-m=Кристаллический аккумулятор большой ёмкости для поздней игры.
y-stargate=Названы в честь первой и самой известной собаки в космосе. Покойся с миром, Лайка, мы тебя не забудем.
y-seg=Только MF! Милый маленький электрогенератор. Почти влезает в рюкзак.
y-seg-p=Только MF! Основной приоритет выработки, уступает солнечным панелям.
y-beg=Только MF! Больше обычного во всём.
y-heg=Только MF! Для огромных электрических нагрузок.
y-stirling-solar-dish=Выше КПД за счёт концентрированного солнечного тепла.
y-fame-gen=Благодаря вам… загляните на 34-ю страницу форума Yuoki Industries — в кольце 40 огней.
y-substation-h=Площадная передача энергии — энергия прямо из розетки.
y_crusher2=Берегите руки — раздавленными уже не поработаешь. (Превращает материалы в пыль.)
y_formpress2=Прессует пыль в формы. Женских форм пока нет — извините! (Делает гранулы и блоки.)
y_maintance_workshop=Здесь суровые мужики делают суровую работу… или просто курят и пьют пиво. (Ремонтирует вещи.)
y_alien_solar=Ненавижу уродливые солнечные фермы (идея родилась на стриме TheBruteMan, февраль 2016).
y_alien_solar2=Всё ещё ненавижу уродливые солнечные фермы — так что больше значит лучше, правда?

