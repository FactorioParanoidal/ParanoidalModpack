[entity-description]
ye_mfheatmotor_m=Производит MF средней температуры из электричества — годится для резервных систем.
ye_emotor_m=Превращает электричество в горячую механическую силу: 3,5 МВт → 4 MF/с (96 %) для машин и ферм Юоки.
ye_trade_node=Упрощает торговлю для обеих сторон.
ye_pool=Гидры? По-моему, вы сошли с ума.
ye_green_ultimate=Медленно заражает вас зелёными мыслями — противоположность культам Техника и Науки.
ye_icemaker=Изобретено MantisShrimps (вчера).
ye_dnasplicer=Разрезает ДНК и показывает, что внутри.
ye_fassembly1=Быстрее производство, но есть минусы.
ye_fassembly_sp=Иногда нужно что-то особенное.
ye_fassembly2=Ещё быстрее, умеет процессы с жидкостями.
yie_science_blue_gen=Исследует целыми днями без результата.
y-sfe=Сжигает твёрдое топливо и превращает воду в механическую силу: со смазкой (95 % энергии топлива), только на воде (83 %) или всухую (71 %). Электричество не нужно.
y-ffe=Сжигает любое жидкое или газовое топливо (центральная труба, проходная) и даёт механическую силу в тех же трёх режимах, что двигатель на твёрдом топливе, но вдвое быстрее: со смазкой 90 %, на воде 78 %, всухую 67 % энергии топлива. Электричество не нужно.
ye_gasmotor=Улучшенный топливный двигатель: такой же мощный, как жидкотопливный, но 95 / 83 / 71 % энергии топлива и вдвое меньше выхлопа. Сжигает любое жидкое или газовое топливо. Электричество не нужно.
y-1stirling-engine=Отлично снабжает энергией автономные аванпосты в пустыне или глуши без воды.
y-electric-air-heater=Вымывает загрязнение из воздуха водой. Работает на механической силе: один малый электромотор питает один очиститель. Зола уноса конденсируется в топливные блоки, их можно сжечь.
y-quantrinum-reactor=Если выйдет из строя — уничтожит вашу планету.
y-emotor-s=Превращает электричество в горячую механическую силу: 350 кВт → 0,4 MF/с (96 %). Хватает на один воздухоочиститель.
ye_farm=Каркасная? Вы доверяете инопланетным растениям?
ye_rheinsberg=Ещё один большой котёл.
ye_sturbine=Достаточно силы даёт только высокотемпературный пар.
ye_overheater=Вода заходит, пар выходит… Нужна вода на входе выше 95 °C.
ye_tfmw_generator-s=Хотите энергии? Станете независимы.
ye_tfmw_turbine-s=Максимальная мощность — на паре до 1000 °C (Райнсберг).

