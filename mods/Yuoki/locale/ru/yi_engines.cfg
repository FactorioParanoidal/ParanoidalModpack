[mod-setting-description]
j_fatmice_behaviour=[img=item/y-electric-air-heater]Двигатель циклический Fatmice\nМногие считают его ОЧЕНЬ имбовым.\n\n[color=green]Включено[/color]\n- Пониженная эффективность\n- Нужен [img=item/j-airfilter]фильтр\n(фильтр тоже придётся чистить!)\n\n[color=yellow](По умолчанию: выключено)[/color]
j_factories_behaviour=Переработка фабрик Yuoki [img=item/ye_fassembly1][img=item/ye_fassembly2][img=item/ye_fassembly_sp]\nС модом сборочных машин Bob фабрики Yuoki бессмысленны.\nВариант [color=green]Сбалансировано[/color] делает фабрику P3 вашей машиной конца игры!\n\n[color=green]No Changes[/color]\n- Никаких изменений.\n\n[color=green]Balanced[/color]\n- Больше слотов модулей.\n- Рецепты сложнее.\n[color=gray]Учитываются другие загруженные моды, например Bob.[/color]\n\n[color=green]Overpowered[/color]\n- Намного больше слотов модулей.\n- Рецепты без изменений.\n\n[color=yellow](По умолчанию: No Changes)[/color]
j_special_sheet_metal_behaviour=[img=item/ye_buechsenblech] Специальный листовой металл (рецепт)\n- [img=item/ye_verotin]Веротин больше не нужен.\n\nНо и сам рецепт изменён!\n\n[color=yellow](По умолчанию: включено)[/color]

