[tips-and-tricks-item-description]
yuoki-intro=[font=default-large-bold][color=255,200,120]Yuoki Industries — продолжение вашей сборки[/color][/font]\nЮоки не начинает игру заново: он начинается там, где у Angels и Bob заканчиваются привычные цепочки, и превращает ваши самые технологичные продукты в инопланетные материалы, трансмутацию, биологию, торговлю с другими мирами, новую энергетику, оружие и броню.\n\n[font=default-bold][color=255,200,120]Дорожная карта (картинка)[/color][/font]\n• [color=130,230,130]Зелёная наука[/color] — [item=y-stirling-solar-dish] солнечный двигатель Стирлинга.\n• [color=100,190,255]Синяя наука[/color] — [fluid=y-mechanical-force] механическая сила: двигатели, валы, генераторы.\n• [color=200,150,255]Производственная наука[/color] — вход в Юоки: [item=y-res1][item=y-res2] материалы N4 и F7, фабрикаторы, археология, трансмутация, кристаллизация, агрономия, плавка.\n• [color=255,215,80]Утилитарная наука[/color] — квантрин, генетика, поздняя энергетика, торговля, оборона, первый костюм YI.\n• [color=255,90,90]Инопланетная наука Bob[/color] — старшие костюмы и ходоки YI поверх силовой брони Bob MK3–MK5.\n\n[font=default-bold][color=255,90,90]Пять правил, которые стоит запомнить[/color][/font]\n1. [font=default-bold]Руды Юоки на карте нет.[/font] Всё делается из продуктов сборки.\n2. [font=default-bold]Всё открывается исследованиями[/font] — и эти советы тоже: новый совет появляется вместе со своей технологией.\n3. [font=default-bold]Детали Юоки делают только фабрикаторы[/font] [item=ye_fassembly1][item=ye_fassembly2][item=ye_fassembly_sp].\n4. [font=default-bold]Валюты[/font] (знаки, репутация, УК-A2) [color=255,90,90]без качества и без переработки[/color].\n5. [font=default-bold]MF не разливается в бочки[/font] — бочка не хранит температуру.\n\n[font=default-bold][color=255,200,120]Цвета в советах[/color][/font]\n[color=255,170,60]MF[/color]  ·  [color=100,190,255]электричество[/color]  ·  [color=255,110,80]топливо и тепло[/color]  ·  [color=130,230,130]выгода[/color]  ·  [color=255,215,80]валюты[/color]  ·  [color=200,150,255]инопланетное[/color]  ·  [color=255,90,90]запрет[/color]
yuoki-solar-dish=[font=default-large-bold][color=130,230,130]Солнечный двигатель Стирлинга[/color][/font]\n[item=y-stirling-solar-dish] — зеркальная тарелка фокусирует солнце на двигатель Стирлинга, а тепловой аккумулятор крутит его ночью. Поэтому он даёт [color=255,170,60][font=default-bold]30 кВт днём и ночью[/font][/color].\n\n[font=default-bold][color=255,200,120]Сравнение с солнечной панелью (картинка)[/color][/font]\n• [item=solar-panel] панель: [color=255,220,80]60 кВт[/color] в полдень, [color=255,90,90]0 ночью[/color], в среднем около 42 кВт, и для ночи нужны [item=accumulator] аккумуляторы.\n• [item=y-stirling-solar-dish] тарелка: ровные [color=255,170,60]30 кВт[/color] на площади 2×2, [color=130,230,130]аккумуляторы не нужны[/color].\n\n[font=default-bold][color=255,200,120]Зачем[/color][/font]\nМаленькие удалённые посты — радары, турели, насосы — питаются без поля аккумуляторов. Собирается из того, что уже есть: [item=steel-plate] сталь, [item=iron-gear-wheel] шестерни, [item=copper-cable] кабель, [item=electronic-circuit] схемы, [item=pipe] трубы.
yuoki-mf=[font=default-large-bold][color=255,170,60]Механическая сила (MF)[/color][/font]\n[fluid=y-mechanical-force] [font=default-bold]MF[/font] — рабочая жидкость под давлением. Двигатель сжигает топливо и нагревает её, по валам она уходит к генератору, тот забирает тепло и даёт электричество. Как пар, только намного плотнее.\n\n[font=default-bold][color=255,170,60]Цифры, на которых всё держится[/color][/font]\n• Двигатели выдают MF ровно [color=255,170,60][font=default-bold]150 °C[/font][/color]. Одна единица несёт [color=255,170,60][font=default-bold]840 кДж[/font][/color].\n• Пар Bob при 465 °C несёт [color=210,210,230]90 кДж[/color] — в 9 раз меньше. Поэтому MF-станции компактные.\n• [item=y-seg] малый генератор берёт 4 MF/с → [color=100,190,255][font=default-bold]3,2 МВт[/font][/color] (95 %). [item=y-meg-s] средний — 8 MF/с → [color=100,190,255]6,4 МВт[/color].\n• Один [item=y-sfe] твердотопливный двигатель кормит ровно один малый генератор.\n\n[font=default-bold][color=255,170,60]Валы[/color][/font]\n[item=y-mftrans-shaft] силовой вал — это труба для MF. [item=y-mftrans-shaft-ground] подземный вал перекрывает [font=default-bold]25 клеток[/font]. Делаются из [item=yie_hard_metals] Т-металла.\n\n[font=default-bold][color=255,90,90]Запреты и тонкости[/color][/font]\n• [item=barrel] [color=255,90,90]MF не разливается в бочки[/color]: бочка сохраняет количество, но не температуру — энергия пропала бы.\n• Машины-потребители принимают только [color=130,230,130]MF от 150 °C[/color]. Холодной MF нет.\n• Генераторы MF берут не горячее 150 °C. Горячая MF 400 °C из паровой турбины Юоки — только для TMFW-Gen-50.\n• Модули и маяки на рецепты MF [color=255,90,90]не действуют[/color]: иначе получался вечный двигатель.
yuoki-mf-engines=[font=default-large-bold][color=255,170,60]Двигатели MF: три машины, три режима[/color][/font]\nВсе двигатели сами сжигают топливо и [color=130,230,130][font=default-bold]не требуют электричества[/font][/color] — их можно ставить там, где сети ещё нет.\n\n[font=default-bold][color=255,200,120]Машины (картинка: строки)[/color][/font]\n• [item=y-sfe] [font=default-bold]Твердотопливный[/font] — любое твёрдое топливо [item=coal][item=solid-fuel], [color=255,110,80]3 МВт[/color], дым [color=175,135,95]60/мин[/color].\n• [item=y-ffe] [font=default-bold]Жидкотопливный[/font] — [color=255,110,80]любая жидкость с теплотворностью[/color]: нафта, мазут, метан, этан, водород, растительное масло… [color=255,110,80]6 МВт[/color], дым зависит от жидкости.\n• [item=ye_gasmotor] [font=default-bold]Газовый[/font] — то же топливо и мощность, но [color=130,230,130]лучший КПД[/color] и вдвое меньше дыма.\n\n[font=default-bold][color=255,200,120]Режимы (картинка: столбцы)[/color][/font]\nРежим выбирается рецептом. Чем больше подаёте, тем больше MF из того же топлива:\n• [fluid=lubricant]+[fluid=water] [font=default-bold]со смазкой[/font] — [color=130,230,130]95 %[/color] (жидкотопливный 90 %): лучший режим.\n• [fluid=water] [font=default-bold]на воде[/font] — [color=255,215,80]83 %[/color] (78 %).\n• [font=default-bold]всухую[/font] — [color=255,110,80]71 %[/color] (67 %), но ничего, кроме топлива: для мест без воды.\n\n[font=default-bold][color=255,200,120]Как ставить[/color][/font]\nУ жидкотопливного и газового топливо входит по [font=default-bold]центральной трубе с севера и юга[/font] — она проходная, двигатели можно ставить цепочкой на одной магистрали. Вода и смазка — по углам, MF выходит на восток и запад. Все три двигателя заменяют друг друга быстрой заменой.\n\n[font=default-bold][color=170,170,170]Качество[/color][/font]\nДвигатель лучшего качества [color=130,230,130]мощнее[/color], но [color=255,90,90]не экономичнее[/color]: расход топлива растёт вместе со скоростью.
yuoki-mf-resource=[font=default-large-bold][color=255,170,60]MF как ресурс[/color][/font]\nMF не только для генераторов. Многие машины Юоки [font=default-bold]расходуют[/font] её как ингредиент — и это всегда настоящая энергия (840 кДж на единицу).\n\n[font=default-bold][color=100,190,255]Малый электромотор[/color][/font]\n[item=y-emotor-s] превращает электричество в горячую MF: [color=100,190,255]350 кВт[/color] → [color=255,170,60]0,4 MF/с[/color] (96 %). Удобно, когда MF нужна в одной точке, а двигатель ставить незачем.\n\n[font=default-bold][color=130,230,130]Воздухоочиститель Fatmice (левая схема)[/color][/font]\n[item=y-electric-air-heater] вымывает загрязнение водой: [color=130,230,130][font=default-bold]−150 загрязнения в минуту[/font][/color] за [color=100,190,255]200 кВт[/color] и [color=255,170,60]0,4 MF/с[/color] — как раз один малый мотор. Расходников, как у фильтров, нет.\nУловленный дым становится [item=y-pol-waste] золой уноса: 150 золы → 2 [item=y-mixed-fuel] топливных блока по [color=255,110,80]4 МДж[/color] — их можно снова сжечь. Получается [color=130,230,130]замкнутый цикл[/color]: двигатели дымят, очиститель забирает дым, зола идёт в топку. Позже зола станет кормом в генетике.\n\n[font=default-bold][color=255,170,60]Ковка Т-металла (правая схема)[/color][/font]\nВ сборщике 2+: [item=steel-plate]×3 + [item=coal]×2 + [fluid=y-mechanical-force]×2 → [item=yie_hard_metals]×2. Без MF те же 2 штуки стоят 4 стали и 6 угля. Т-металла нужно много: валы, корпуса, двигатели.\n\n[font=default-bold][color=170,170,170]Дальше[/color][/font]\nMF потребляют консервный пресс, ледогенератор, ДНК-сплайсер, зарядник Зайдона, кристаллизатор и формовочный пресс.
yuoki-materials=[font=default-large-bold][color=200,150,255]Материалы N4 и F7[/color][/font]\nДва базовых вещества Юоки. [color=255,90,90]На карте их нет[/color] — они получаются [font=default-bold]центрифугированием сверхчистых руд Angels[/font].\n\n[font=default-bold][color=255,200,120]Центрифуга: три разные руды → 3 куска[/color][/font]\n• [item=angels-ore1-pure]+[item=angels-ore5-pure]+[item=angels-ore6-pure] (сапфирит, рубит, бобмониум) → [item=y-res1][color=100,190,255][font=default-bold]×3 УниКомпозитный кусок N4[/font][/color] — строительный материал.\n• [item=angels-ore2-pure]+[item=angels-ore3-pure]+[item=angels-ore4-pure] (дживолит, стиратит, кротиниум) → [item=y-res2][color=255,170,60][font=default-bold]×3 Энергоминерал F7[/font][/color] — энергетический материал.\nПодходит любая центрифуга, 5 с. Сверхчистые руды делаются из кристаллов в сортировке Angels 4.\n\n[font=default-bold][color=255,200,120]Переработка (картинка)[/color][/font]\n• Дробилка [item=y_crusher2]: 3 куска + 200 воды → 5 измельчённых.\n• Пресс [item=y_formpress2]: измельчённый N4 → [item=y-refined-yres1] гранулы → [item=y-unicomp-raw] [font=default-bold]УниКомпозит N4[/font]; измельчённый F7 → [item=y-refined-yres2] насыщенный → [item=y-raw-fuelnium] [font=default-bold]заряженный F-C[/font] (пресс тратит немного MF).\n• Смесь измельчённых N4 и F7 (6+6) → [item=y-richdust][color=255,215,80] ×11 ценной пыли[/color] — она нужна почти везде. Из ценной пыли в печи → [item=y-orange-stuff] кракон для электроники.\n\n[font=default-bold][color=130,230,130]Совет[/color][/font]\nДержите отдельные линии для N4 и F7 и общий буфер ценной пыли: её тратят эмульсия, тепловые блоки, графит, платы.
yuoki-fabricators=[font=default-large-bold][color=200,150,255]Фабрикаторы C1, Y2, P3[/color][/font]\nУ Юоки свои заводы. [color=255,90,90][font=default-bold]Детали Юоки делаются только в них[/font][/color]: ни в сборщике, ни вручную.\n• [item=ye_fassembly1] [font=default-bold]C1[/font] — скорость 2, простые детали.\n• [item=ye_fassembly2] [font=default-bold]Y2[/font] — скорость 3, плюс сложные детали (чипы, рамы, катушки).\n• [item=ye_fassembly_sp] [font=default-bold]P3[/font] — скорость 5, самый быстрый (утилитарная наука).\nФабрикаторы больше ничего не умеют — не пытайтесь ставить их вместо сборщиков.\n\n[font=default-bold][color=100,190,255]Юоки ест вашу сборку[/color][/font]\nКаждая деталь требует [color=100,190,255][font=default-bold]один поздний продукт сборки[/font][/color]: титан, нитинол, стекловолоконную плату, процессоры, тепловую трубу 3, позолоченный кабель, изолированную катушку, кремниевую пластину, медно-вольфрамовый сплав, кобальтовые подшипники, батарею 2. Пример на картинке — [item=y-chip-2] чип I286: плата, кракон, дотзетрон и [item=bob-advanced-processing-unit] продвинутый процессор Bob.\n\n[font=default-bold][color=255,215,80]Знаки техника[/color][/font]\nМногие детали дают побочно [item=y_rwtechsign][color=255,215,80] знаки техника[/color]: чип I286, улучшенная рама, магнетрон, топливная ячейка Обнинска — по 3, прочие — по 1–2. Эти рецепты [color=255,90,90]без качества[/color].
yuoki-currencies=[font=default-large-bold][color=255,215,80]Валюты Юоки[/color][/font]\nЮоки платит и берёт плату особыми предметами. На картинке: сверху — откуда берётся, [color=255,215,80]в рамке[/color] — валюта, снизу — куда тратится.\n• [item=y_rwtechsign][color=255,215,80][font=default-bold] Знак техника[/font][/color] — побочный продукт деталей фабрикаторов. Тратится на костюмы YI, мастерские машины, репутацию.\n• [item=ypfw_trader_sign][color=255,215,80][font=default-bold] Знак торговца[/font][/color] — экспорт через врата «Лайка». Тратится на лицензии обратной трансмутации, покупку ДНК, репутацию.\n• [item=y_greensign][color=255,215,80][font=default-bold] Знак природы[/font][/color] — побочный продукт агрономии и генетики. Тратится на гидра-ферму и репутацию.\n• [item=ye_science_blue][color=255,215,80][font=default-bold] Знак науки[/font][/color] — исследовательский центр делает его из набора всех шести пакетов (включая военный). Тратится на реакторы, турбины, ДНК-линии.\n• [item=y-fame][color=255,215,80][font=default-bold] Репутация[/font][/color] — древний монумент и обмены. Нужна для врат «Лайка» и брони.\n• [item=y-unicomp-a2][color=255,215,80][font=default-bold] УниКомпозит A2[/font][/color] — реструктор Cimota из руды и отходов. Тратится на квантрин и обратную трансмутацию.\n\n[font=default-bold][color=255,90,90]Правила[/color][/font]\n• [item=quality-module] У валют [color=255,90,90]нет качества[/color]: рецепты, которые их выдают, качество не принимают.\n• [item=recycler-1] Валюты [color=255,90,90]не перерабатываются[/color].\n• Готовые изделия Юоки (машины, броня, турели) качество получают, но валюту побочно не выдают.
yuoki-archaeology=[font=default-large-bold][color=200,170,120]Археология[/color][/font]\nКопаем грязь где угодно и промываем её — так находятся вещи, которых больше нигде нет.\n\n[font=default-bold][color=255,200,120]Добыча (верхняя схема)[/color][/font]\n• [item=y-underground-drill] подземный бур копает [item=y-dirt] грязь [font=default-bold]без месторождения[/font]: 1 за 2 с, или 8 за 3 с с [item=y_drillhead] буровой головкой (головка ломается).\n• [item=y-dirtwasher] промывка: 10 грязи + 150 воды → 2 [item=stone] + [color=200,150,255]1 [item=y-crystal2] древний осколок[/color] + 150 [fluid=y-con_water] грязной воды.\n• Грязная вода → пресс → [item=y-c_mud] мокрая грязь → [item=y-dry_mud] сухая грязь → [item=y-mixed-fuel] топливные блоки или [item=y-unicomp-a2] УК-A2.\n\n[font=default-bold][color=130,230,130]Чистые металлы (левая нижняя)[/color][/font]\n[item=iron-ore]×5 + вода → [item=y-pure-iron]×3 → в печи по 2 пластины: [color=130,230,130][font=default-bold]6 пластин из 5 руды (+20 %)[/font][/color]. С [item=y_toolhead] инструментальной головкой: 15 руды → 12 чистого железа = [color=130,230,130][font=default-bold]24 пластины (+60 %)[/font][/color]. То же для меди.\n\n[font=default-bold][color=255,170,60]Ремонт головок (правая нижняя)[/color][/font]\n4 сломанные головки + [item=y-repair-durotal] дуроталевый ремнабор (возвращается) → 4 целые головки и знак техника.\n\n[font=default-bold][color=200,150,255]Зачем осколки[/color][/font]\n[item=y-crystal2] древние осколки нужны для кристаллических затравок, зарядника Зайдона, квантрина, кристаллов Лачнана и информационных кристаллов. Их источник — только промывка грязи.
yuoki-transmutation=[font=default-large-bold][color=255,215,80]Трансмутация: УниКомпозит A2[/color][/font]\n[item=y-atomic-constructor] [font=default-bold]Реструктор Cimota[/font] ([color=100,190,255]8 МВт[/color]) разбирает вещество на «универсальную» основу — [item=y-unicomp-a2][color=255,215,80][font=default-bold] УниКомпозит A2[/font][/color].\n\n[font=default-bold][color=255,200,120]Сдача (левая схема)[/color][/font]\n• [font=default-bold]100[/font] любой руды сборки (Angels, Bob, уголь, камень, уран…) → 1 УК-A2.\n• [font=default-bold]100[/font] шлака [item=angels-slag] или древних осколков → 1 УК-A2.\n• [font=default-bold]20[/font] кусков N4/F7, 30 сухой грязи, 20 ценной пыли (в прессе) → 1 УК-A2.\nКурс намеренно жёсткий: УК-A2 — это [color=255,215,80]дорогая[/color] валюта, а не способ избавиться от лишнего бесплатно.\n\n[font=default-bold][color=255,200,120]Зачем[/color][/font]\nУК-A2 идёт в [item=y-quantrinum] квантрин, [item=y-infused-uca2] трансмутированный УК-A2, тепловые и атомные рецепты. Позже, с технологией «Обратная трансмутация», из него снова можно получить руду (правая схема) — [color=255,90,90]с большой потерей[/color].\n\n[font=default-bold][color=170,170,170]Настройка[/color][/font]\nСтартовая настройка «Жидкости → УК-A2» (по умолчанию выключена) разрешает сдавать нефтепродукты и смазку: 500 единиц за 1 УК-A2.
yuoki-crystallization=[font=default-large-bold][color=200,150,255]Кристаллизация: больше кусков из той же руды[/color][/font]\nКристаллическая затравка в центрифуге 2+ даёт [color=130,230,130][font=default-bold]5 кусков вместо 3[/font][/color] из тех же трёх сверхчистых руд.\n\n[font=default-bold][color=255,200,120]Цепочка затравки (верхняя схема)[/color][/font]\n1. [item=stone-brick] кирпич → дробилка → [item=y_steinmehl] ×8 каменной муки.\n2. Смеситель [item=y_mixer_emu]: 4 муки + [item=y-richdust] ценная пыль + 200 воды → 100 [fluid=y_emulsion] эмульсии.\n3. Насос высокого давления [item=y_hppump] → [fluid=y_richemulsion] богатая эмульсия.\n4. Сушилка [item=y_trockner]: 50 богатой эмульсии → [item=y_crystal_dust]×2 кристальной пыли.\n5. Кристаллизатор [item=y_crystalizer]: 4 пыли + [color=255,170,60]10 MF[/color] → [item=y-crystal-seed] затравка.\n\n[font=default-bold][color=255,200,120]Три рецепта затравки (нижняя схема)[/color][/font]\n• 4 кристальной пыли;  • 2 пыли + 4 [item=y-crystal2] древних осколка;  • 2 пыли + 10 [item=angels-crystal-dust] кристальной пыли Angels. Выбирайте то, чего у вас больше.\n\n[font=default-bold][color=130,230,130]Итог[/color][/font]\nОдин кирпич даёт много затравок, а каждая затравка — [color=130,230,130]+2 куска[/color]. Машины дорогие, но окупаются на больших потоках руды.
yuoki-smelting=[font=default-large-bold][color=255,110,80]Плавильня «Франк и Пеппе»[/color][/font]\nБыстрая плавка на [font=default-bold]теплоаккумулирующих блоках[/font]: тепло запасают в зарядке, а плавят там, где удобно.\n\n[font=default-bold][color=255,200,120]Цикл блоков (картинка)[/color][/font]\n1. [item=y_block_cold] холодные блоки делает пресс из заряженного F-C, конструкционных элементов и ценной пыли.\n2. [item=y_charger] Зарядник Зайдона: 10 холодных + 1 ценная пыль + [color=255,170,60][font=default-bold]20 MF[/font][/color] → 10 [item=y_block_heat] горячих.\n3. [item=y_smelter] Плавильня: 9 [item=y-pure-iron] чистого железа + 1 горячий блок + вода → [color=130,230,130][font=default-bold]18 пластин[/font][/color] за 3 с, плюс шлак. [color=110,170,255]Холодный блок возвращается[/color] — отправьте его обратно в зарядник.\nСталь: 14 чистого железа + блок → 6 стали. Медь — так же, как железо.\n\n[font=default-bold][color=130,230,130]Зачем[/color][/font]\nОдна плавильня заменяет ряд печей, а чистые металлы из археологии дают больше пластин, чем руда.
yuoki-storage=[font=default-large-bold][color=100,190,255]Накопители Юоки[/color][/font]\nТри ступени, каждая сильнее накопителей сборки своей стадии (картинка: ёмкость [color=100,190,255]МДж[/color] и мощность [color=255,170,60]МВт[/color]):\n• [item=y_compensator_25] [font=default-bold]Компенсатор потока Mk4[/font] 2×2 — [color=100,190,255]50 МДж[/color], [color=255,170,60]8 МВт[/color]. Собирается из быстрого аккумулятора Bob 2.\n• [item=y-accumulator-b-tx] [font=default-bold]Аккумулятор AQE[/font] 3×3 — [color=100,190,255]200 МДж[/color], [color=255,170,60]20 МВт[/color] (квантовые накопители).\n• [item=y-accumulator-crystal-m] [font=default-bold]Квантриновый[/font] 3×3 — [color=100,190,255]600 МДж[/color], [color=255,170,60]40 МВт[/color]: [color=130,230,130]самый ёмкий накопитель сборки[/color].\nДля сравнения серым: быстрый аккумулятор Bob 3 — 64 МДж / 15 МВт, био-аккумулятор — 300 МДж / 25 МВт.\n\n[font=default-bold][color=130,230,130]Где пригодятся[/color][/font]\nПики лазерных турелей F12+ и крепости D-ZTT, ночная солнечная энергетика, буфер для реакторов. Компенсатор нужен ещё и как деталь монумента репутации и крепости D-ZTT.
yuoki-agronomy=[font=default-large-bold][color=170,230,100]Агрономия[/color][/font]\nСвоё сельское хозяйство Юоки. Это [color=170,230,100]единственный источник биоматериалов[/color] мода и источник знаков природы.\n\n[font=default-bold][color=255,200,120]Дорогой вход[/color][/font]\nПервые семена: 20 [item=angels-solid-corn] кукурузы Angels + 10 [item=angels-solid-fertilizer] удобрения + 1 [item=production-science-pack] → [item=ye_seed_a]. Дальше семена делаются из своей кукурузы: [color=130,230,130]20 → 1[/color].\n\n[font=default-bold][color=255,200,120]Ферма (верхняя схема)[/color][/font]\n[item=ye_farm] Каркасная ферма: 1 семя + 500 воды → [color=170,230,100][font=default-bold]500 кукурузы[/font][/color] за 300 с. С шламом из генетики — 600 за 200 с. Вугарный тростник [item=ye_corn_b]: 300 за 420 с.\n\n[font=default-bold][color=170,230,100]Что делать с урожаем[/color][/font]\n• [fluid=ye_cornoil] [font=default-bold]Растительное масло[/font] (пресс, нужна MF): [color=255,110,80]топливо[/color] для жидкотопливного и газового двигателей или 30 → 10 [fluid=lubricant] смазки.\n• [item=ye_sugar] вугар-сахар (30 тростника → 3), [item=ye_celluose] трифитан → [item=wood] синтетическая древесина, компост в органическую пыль.\n• Обмен с Angels (нижняя схема): 10 кукурузы Юоки → 4 Angels, 4 Angels → 8 Юоки — [color=255,90,90]с потерей в обе стороны[/color].\n\n[font=default-bold][color=130,230,130]Совет[/color][/font]\nСтавьте фермы рано: кукуруза, вугар и масло понадобятся генетике, консервам и ранчо.
yuoki-alien=[font=default-large-bold][color=200,150,255]Квантрин и инопланетные технологии[/color][/font]\nСердце поздней части Юоки — [item=y-quantrinum][color=200,150,255][font=default-bold] квантрин[/font][/color].\n\n[font=default-bold][color=255,200,120]Инфузор (верхняя схема слева)[/color][/font]\n[item=y-alien-infuser]: 1 [item=y-unicomp-a2] УК-A2 за 60 с → [item=y-infused-uca2] трансмутированный УК-A2 + [color=255,215,80]2 знака техника[/color].\n\n[font=default-bold][color=255,200,120]Квантрин (верхняя схема справа)[/color][/font]\nАтомно-квантовый композер [item=y-atomic-quantum-composer]: 15 УК-A2 + 12 заряженного F-C + 12 УниКомпозита N4 + 8 древних осколков → [color=200,150,255][font=default-bold]2 квантрина[/font][/color] + знак науки.\n\n[font=default-bold][color=255,200,120]Кристалл Лачнана и цепочка заряда (нижняя схема)[/color][/font]\n• [item=y-crystal-cnd][color=255,215,80] Кристалл Лачнана[/color] — катализатор: чистое железо, шлак, УК-A2 и осколки.\n• Инфузия: квантрин + кристалл Лачнана + 5 УК-A2 → [item=y_quantrinum_infused] трансмутированный квантрин.\n• [item=y-quantrinum-charge] Нестабильный квантрин (×2) горит в [item=y-quantrinum-reactor] квантриновом реакторе: [color=255,170,60][font=default-bold]300 MF при 400 °C[/font][/color] за штуку (≈700 МДж).\n\n[font=default-bold][color=255,200,120]Куда дальше[/color][/font]\nОтсюда открываются каталитическое центрифугирование, квантовые накопители, Sol-Ray, фабрикатор P3, Обнинский реактор, ремнабор Квантрин-R, репутация и торговля.
yuoki-catalysis=[font=default-large-bold][color=200,150,255]Каталитическое центрифугирование[/color][/font]\nВершина добычи N4 и F7. Картинка — лестница выхода из одной тройки сверхчистых руд:\n• [item=centrifuge] любая центрифуга — [font=default-bold]3 куска[/font].\n• [item=bob-centrifuge-2] центрифуга 2 + [item=y-crystal-seed] затравка — [color=130,230,130][font=default-bold]5 кусков[/font][/color].\n• [item=bob-centrifuge-3] центрифуга 3 + затравка + [item=y-crystal-cnd] кристалл Лачнана — [color=200,150,255][font=default-bold]8 кусков[/font][/color].\n\n[font=default-bold][color=255,215,80]Катализатор возвращается[/color][/font]\nКристалл Лачнана [color=255,215,80]возвращается с вероятностью 90 %[/color]: в среднем один кристалл на 10 циклов. Затравка расходуется каждый раз — кристаллизация должна работать постоянно.\n\n[font=default-bold][color=130,230,130]Выгода[/color][/font]\nТе же сверхчистые руды дают [color=130,230,130]в 2,7 раза больше[/color] материала, чем простая центрифуга.
yuoki-genetics=[font=default-large-bold][color=170,230,100]Генетика: ДНК, ранчо, гидра-ферма[/color][/font]\nБиология Юоки замыкает отходы сборки в полезные материалы.\n\n[font=default-bold][color=255,200,120]ДНК[/color][/font]\nПервая [item=ye_dna] ДНК — из 20 производственных и 10 химических пакетов или покупка за 2000 знаков торговца. Дальше [item=ye_dnasplicer] ДНК-сплайсер размножает её из мяса, крови, MF и био-токена Angels и выводит линии: омтринит, веротин, органическое железо.\n\n[font=default-bold][color=255,200,120]Клеточное ранчо (картинка)[/color][/font]\n[item=ye_meatfarm] растит существ по линии ДНК, выход за цикл:\n• Базовая линия: кукуруза + вугар + вода → [item=ye_rawmeat] мясо, [fluid=ye_blood] кровь, [fluid=ye_slurry] шлам.\n• Омтринит: + [item=y-pol-waste][color=175,135,95] зола уноса[/color], семена, масло → [item=ye_omtrinit][color=200,150,255] омтринит[/color] — [font=default-bold]нужен «Райнсбергу»[/font] (96 штук).\n• Веротин: субстратин + нефть → [item=ye_verotin] веротин и метан.\n• Органическое железо: Т-металл + смазка + [item=angels-slag] шлак → [item=ye_organic_metall] → в печи по [color=130,230,130]7 чистого железа[/color].\n\n[font=default-bold][color=130,230,130]Субстратин и гидра-ферма[/color][/font]\n[item=ye_substrat] Субстратин растёт на грязной воде или на [fluid=angels-water-yellow-waste][color=130,230,130] жёлтой сточной воде Angels[/color]. [item=ye_pool] Гидра-ферма делает из крови шлам, а шлам удобряет фермы (600 кукурузы вместо 500) или идёт в газ.\n\n[font=default-bold][color=130,230,130]Замкнутые циклы[/color][/font]\nДым двигателей → зола → корм; шлак и сточные воды Angels → материалы; шлам → удобрение. Отходы становятся сырьём.
yuoki-late-energy=[font=default-large-bold][color=255,110,80]Поздняя энергетика[/color][/font]\n\n[font=default-bold][color=255,170,60]Тяжёлая MF[/color][/font]\nБольшие объёмы MF для заводов и ферм Юоки: [item=ye_emotor_m] средний мотор ([color=100,190,255]3,5 МВт[/color] → 4 MF/с), [item=ye_overheater] перегреватель (пар 500 °C), [item=ye_sturbine] турбина «пар → MF» (MF 400 °C), [item=ye_tfmw_generator-s] TMFW-Gen-50 (≈[color=100,190,255]50 МВт[/color] из MF 400 °C), большой и огромный генераторы.\nКак электростанция тяжёлая MF уступает котлам Bob — её задача кормить машины Юоки.\n\n[font=default-bold][color=255,110,80]Атом Юоки (верхняя схема)[/color][/font]\n• [item=y-obninsk-reactor] [font=default-bold]Обнинский реактор[/font]: топливо MX → MF прямо из воды ([color=255,170,60]≈42 МВт[/color]) и переработка [item=y_mox2mixed] смеси MX-C из урана в [item=y_mox2fuel] топливо на 7 ГДж.\n• [item=ye_rheinsberg] [font=default-bold]ВВЭР-210 «Райнсберг»[/font]: [color=255,110,80]75 МВт[/color], пар до [color=255,110,80][font=default-bold]1000 °C[/font][/color] — 380 пара/с ровно на одну [item=ye_tfmw_turbine-s] турбину TMFW-TUR-72 [color=100,190,255][font=default-bold]72 МВт[/font][/color] (97 %).\nДля «Райнсберга» нужны 96 омтринита из генетики и 64 смеси MX-C из Обнинска — цель, ради которой развивают и биологию, и атом.\n\n[font=default-bold][color=170,170,170]Картинка: выход машин[/color][/font]\nПолосы — мощность одной машины в МВт.
yuoki-sol-ray=[font=default-large-bold][color=200,150,255]Коллекторы потока Sol-Ray[/color][/font]\nОни ловят не солнечный свет, а [color=200,150,255][font=default-bold]инопланетный поток[/font][/color] — поэтому [color=130,230,130]работают одинаково днём и ночью[/color].\n• [item=y_alien_solar] Крошечный 7×7 — [color=200,150,255][font=default-bold]1,5 МВт[/font][/color] круглосуточно.\n• [item=y_alien_solar2] Малый 9×9 — [color=200,150,255][font=default-bold]3 МВт[/font][/color] круглосуточно.\n\n[font=default-bold][color=255,200,120]Сравнение (картинка)[/color][/font]\nБольшая панель Bob 3 даёт в пике больше на клетку, но ночью — ноль, и ей нужно поле аккумуляторов. Sol-Ray [color=130,230,130]не требует накопителей[/color]: поставил — и ровная мощность.
yuoki-trade=[font=default-large-bold][color=255,215,80]Репутация и врата «Лайка»[/color][/font]\n\n[font=default-bold][color=255,200,120]Репутация (левая схема)[/color][/font]\n[item=y-fame-gen] [font=default-bold]Древний монумент[/font] медленно приносит [item=y-fame][color=255,215,80] репутацию[/color]: 1 даром за 1800 с или за 25 знаков техника за 900 с.\nПозже репутацию можно выменять на вратах: 2000 знаков техника, 1000 знаков торговца, 200 знаков природы или 100 знаков науки → 1.\nДля постройки [item=y-stargate] врат «Лайка» нужно [color=255,215,80][font=default-bold]10 репутации[/font][/color].\n\n[font=default-bold][color=130,230,130]Экспорт (правая схема)[/color][/font]\nВрата и [item=ye_trade_node] торговый узел продают товары другим мирам за [item=ypfw_trader_sign][color=255,215,80] знаки торговца[/color]:\n• 20 [item=y-orange-stuff] кракона → 40;  • 10 [item=y-chip-2] чипов I286 → 120;  • 5 [item=y-fuel-reactor] ячеек Обнинска → 60;\n• еда (с технологией «Холодовая цепь»): 4 [item=ye_buechse_gelb] → 400, 2 [item=ye_buechse_white] → 800.\n\n[font=default-bold][color=255,200,120]На что тратить[/color][/font]\nЛицензии обратной трансмутации (5 знаков), покупка ДНК (2000), обмен на репутацию, великий символ наживы (50 000).
yuoki-reverse-transmutation=[font=default-large-bold][color=200,150,255]Обратная трансмутация[/color][/font]\nРеструктор Cimota умеет и обратное: из [item=y-unicomp-a2] УК-A2 — любую руду сборки.\n\n[font=default-bold][color=255,215,80]Лицензия (правая схема)[/color][/font]\nКаждая перегонка: 1 УК-A2 + [color=255,215,80]5 знаков торговца[/color] + [color=255,215,80]1 заряженный F-C[/color] → [font=default-bold]10 руды[/font] (уран — 6) за 10 с.\n\n[font=default-bold][color=255,90,90]Цена[/color][/font]\nСдали 100 руды → получили 1 УК-A2 → вернули 10 руды. [color=255,90,90][font=default-bold]Потеря 90 %[/font][/color] плюс лицензия. Это не переработка, а [color=130,230,130]поздний источник редкой руды[/color] там, где её нет: уран, торий, вольфрам, руды Bob и Angels.
yuoki-food-trade=[font=default-large-bold][color=110,170,255]Холодовая цепь и экспорт еды[/color][/font]\nЕду из генетики и агрономии продают другим мирам — главный источник знаков торговца.\n\n[font=default-bold][color=255,200,120]Лёд и тара (картинка)[/color][/font]\n[item=ye_icemaker] Ледогенератор: 20 пустых [item=ye_ice_container_empty] контейнеров + [color=255,170,60]8 MF[/color] + 400 воды → 20 заполненных. Упаковка мяса [color=110,170,255]возвращает пустой контейнер[/color] — замкните его обратно.\n• [item=ye_package_c_meat] Зифрут-стейки: заполненный контейнер + 7 жареного мяса + пустая упаковка.\n• Консервы: пресс делает 12 пустых банок из Т-металла и MF; [item=ye_buechse_gelb] кукурузные и [item=ye_buechse_white] «Ассорти» — в машине обработки жидкостей.\n\n[font=default-bold][color=255,215,80]Экспорт[/color][/font]\n• 4 кукурузных консервы → 400 знаков торговца + 1 УК-A2;  • 2 «Ассорти» → 800 + 4 УК-A2.\n• 4 упаковки сырого мяса → 4 УК-A2 + ДНК;  • 20 упаковок стейков → 1 [item=y-quantrinum] квантрин.\n• Тринит-Ом → знаки и репутация;  • В-Р-Т-Н → трансмутированный УК-A2;  • 10 бочек крови → репутация (бочки возвращаются).
yuoki-defense=[font=default-large-bold][color=255,90,90]Оборона F12+[/color][/font]\nТурели Юоки — [font=default-bold]улучшенные версии лучших турелей сборки[/font]: каждая [color=255,90,90]расходует[/color] турель, которую превосходит, плюс раму машины Юоки.\n• [item=bob-gun-turret-5] → [item=y_turret_gun2f12] [font=default-bold]«Модлин»[/font] и [item=y_turret_gun1f12] [font=default-bold]«Громила»[/font].\n• [item=bob-laser-turret-5] → [item=y_turret_laser22f12] [font=default-bold]«Айзенвульф»[/font]; две лазерные 5 → [item=y-weapon-ztt] [font=default-bold]крепость D-ZTT[/font].\n• [item=bob-plasma-turret-2] → [item=y_turret_plasma] T-PLASMA;  [item=flamethrower-turret] → [item=y_turret_flame] T-CHEMIC (свои боеприпасы).\n• [item=bob-reinforced-wall] → [item=y-wall-forcefield] силовое поле Vitduo.\n\n[font=default-bold][color=130,230,130]Сила[/color][/font]\nПримерно [color=130,230,130]вдвое больше урона[/color] и здоровья, дальность +2…+6 клеток. Турели получают звания HeroTurrets, как и остальные турели сборки.
yuoki-repair=[font=default-large-bold][color=130,230,130]Ремнаборы Юоки[/color][/font]\nЦепочка ремнаборов поверх [item=bob-repair-pack-5] ремнабора Bob 5 (картинка: скорость и прочность):\n• [item=y-repair-durotal] [font=default-bold]Дуроталевый[/font] — скорость [color=130,230,130]12[/color], прочность [color=130,230,130]8000[/color]. Он же чинит буровые и инструментальные головки.\n• [item=y-repair-krakon] [font=default-bold]Airat9000[/font] — [color=255,170,60]16[/color] / [color=255,170,60]15 000[/color].\n• [item=y_repair_quantrinum] [font=default-bold]Директива Квантрин-R[/font] — [color=200,150,255]30[/color] / [color=200,150,255]30 000[/color].\nКаждый следующий собирается из предыдущего.
yuoki-armor=[font=default-large-bold][color=255,215,80]Костюмы и ходоки YI[/color][/font]\nБроня YI — [font=default-bold]улучшенные версии силовой брони сборки[/font]: каждый костюм собирается из брони своей ступени и превосходит её на шаг.\n• [item=power-armor-mk2] MK2 → [item=yi_armor_gray] [font=default-bold]рабочий костюм YI[/font] (сетка 9×9).\n• [item=bob-power-armor-mk3] Bob MK3 → [item=yi_armor_red] [font=default-bold]костюм мастера-техника[/font] (10×10).\n• [item=bob-power-armor-mk4] Bob MK4 → [item=yi_armor_gold] [font=default-bold]костюм мастера YI[/font] (11×11).\n• [item=bob-power-armor-mk5] Bob MK5 → [item=yi_walker_a] [font=default-bold]ходок T.R.[/font] (12×12) → [item=yi_walker_c] [font=default-bold]«Я — ходячая смерть»[/font] (13×13).\n\n[font=default-bold][color=130,230,130]Что даёт шаг[/color][/font]\nСетка оборудования на ступень больше, [color=130,230,130]сопротивления брони-основы +5 % и +2[/color], 5 лишних слотов инвентаря, прочность ×1,25.\n\n[font=default-bold][color=255,215,80]Цена[/color][/font]\nЗнаки техника (400…6000), репутация, трансмутированный квантрин, детали Юоки; для старших — компенсатор, AQE и квантриновый аккумулятор. Каждая ступень открывается после брони Bob своей ступени.
yuoki-ultimates=[font=default-large-bold][color=255,215,80]Великие символы господства[/color][/font]\nТрофеи культов — вершина экономики Юоки и главный сток валют (картинка):\n• [item=y_trade_ultimate] [font=default-bold]Культ наживы[/font] — 50 000 знаков торговца. Постройка сама делает знак торговца раз в 30 с.\n• [item=ye_science_ultimate] [font=default-bold]Культ науки[/font] — 30 000 знаков науки. Радар-символ.\n• [item=ye_green_ultimate] [font=default-bold]Культ природы[/font] — 60 000 знаков природы. Делает знак природы раз в 30 с или древесину раз в 5 с.\n[color=170,170,170]Это цель для тех, кто выстроил всю экономику Юоки.[/color]
