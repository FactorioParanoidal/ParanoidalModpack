[technology-description]
yuoki-mechanical-force=Engines burn solid or liquid fuel and make mechanical force (MF): with lubricant, with water or dry. Power shafts carry MF to generators; MF forging saves steel on T-Metal. No electricity needed, but the engines pollute.
yuoki-mechanical-force-2=The efficient, cleaner gas engine and the medium generator. MF as a resource: the Fatmice air scrubber washes pollution out of the air, the small electric motor turns electricity into MF.
yuoki-materials=Centrifuging three different super-pure ores gives N4 (UniComposite) and F7 (Energomineral) chunks. Crushing, smelting and forming them; the C1 fabricator for Yuoki parts.
yuoki-electronics=Chip boards, M68K and I286 chips, conductive wire and coils, machine frames, the Y2 fabricator.
yuoki-archaeology=Digging dirt and washing it for ancient data fragments, pure iron and copper, contaminated mud and fuel; tool and drill heads with their repair.
yuoki-transmutation=The Cimota Restructor: ores, slag, fragments and waste are handed in for UC-A2 (UniComposite).
yuoki-smelting=Frank & Peppe smelter and the Zaydon charger: heat storage blocks and fast plate and steel smelting from pure metals.
yuoki-crystallization=Washing emulsion seeded with rich dust, crystal dust and crystal seeds. A seed in a centrifuge 2+ gives 5 chunks instead of 3.
yuoki-chemistry=Frumital-R gas from coal dust and compost, Hydrotin, catalysts and liquid fuels.
yuoki-accumulators=Flow compensator Mk4: 50 MJ, 8 MW.
yuoki-agronomy=Framed farm: corn and vugar cane from Angels crops, sugar, cellulose, compost, vegetable oil and synthetic wood. Yuoki and Angels corn are exchangeable.
yuoki-research-center=The Research Center and science signs from science packs.
yuoki-alien-technology=Atomic Quantum Composer and Alien Infuser: transmuted UC-A2, Quantrinum, Lachnan crystals and data crystals.
yuoki-fabrication-3=The fastest Yuoki fabricator.
yuoki-catalytic-centrifuging=A crystal seed and a Lachnan crystal catalyst (returned with 90 %) give 8 chunks in a centrifuge 3.
yuoki-accumulators-2=AQE accumulator (200 MJ, 20 MW) and quantrinum accumulator (600 MJ, 40 MW).
yuoki-aeet=Area energy transmission over a very large supply area.
yuoki-solar=Sol-Ray flux collectors: 1.5 and 3 MW, the same day and night.
yuoki-heavy-mf=MF in bulk for the Yuoki machines and farms: big and huge MF generators, the overheater, the steam-to-MF turbine, TMFW-Gen-50 and the medium electric motor.
yuoki-obninsk=MX fusion fuel, the Obninsk reactor and the Rensuir turbine.
yuoki-genetics=DNA splicer, caged ranch and Hydra-Farm: Ommtrinit, Verotin and Organicum Ferrum from DNA lines; fly ash from the air scrubber and Angels waste water feed the farms.
yuoki-rheinsberg=Steam up to 1000 °C for the TMFW-TUR-72 turbine; the Quantrinum reactor.
yuoki-reputation=The Ancient Monument slowly earns reputation.
yuoki-trade=Laika-Gate and Trade Node: Yuoki goods are exported for merchant signs, signs are exchanged for reputation, DNA can be bought.
yuoki-transmutation-2=UC-A2 back into ores and resources. Every conversion needs a licence of merchant signs and a Charged F-C.
yuoki-food-trade=Ice maker, packaging and canning; food exports pay with merchant signs, UC-A2, Quantrinum and reputation.
yuoki-mastercraft=Mastercrafted washer and underground drill for techanic and nature signs.
yuoki-ultimates=The trophies of the cults of profit, science and nature.
yuoki-armor=Improves power armor MK2: 9×9 grid, the base armor's resistances +5 %.
yuoki-armor-2=Improves Bob's power armor MK3: 10×10 grid, the base armor's resistances +5 %.
yuoki-defense=Heavy machine gun, rapid-fire cannon and laser turrets above Bob's top turrets; the Vitduo force field.
yuoki-defense-2=Plasma and blaze turrets with their ammunition; the D-ZTT laser fortress.
yuoki-repair=Repair tools above Bob's repair pack 5.
yuoki-repair-2=The best repair tool.
yuoki-solar-dish=A solar dish with a Stirling engine and a heat store: 30 kW day and night from steel, gears, cable and circuits.
yuoki-armor-3=Improves Bob's power armor MK4: 11×11 grid, the base armor's resistances +5 %.
yuoki-armor-4=Walker T.R. improves Bob's power armor MK5 (12×12); I am a walking death improves the Walker T.R. (13×13).
