[tips-and-tricks-item-description]
yuoki-intro=[font=default-large-bold][color=255,200,120]Yuoki Industries continues your build[/color][/font]\nYuoki does not restart the game: it begins where the familiar Angels and Bob chains end, and turns your most advanced products into alien materials, transmutation, biology, trade with other worlds, new energy, weapons and armor.\n\n[font=default-bold][color=255,200,120]Roadmap (picture)[/color][/font]\n• [color=130,230,130]Logistic science[/color] — [item=y-stirling-solar-dish] solar Stirling dish.\n• [color=100,190,255]Chemical science[/color] — [fluid=y-mechanical-force] mechanical force: engines, shafts, generators.\n• [color=200,150,255]Production science[/color] — the way into Yuoki: [item=y-res1][item=y-res2] N4 and F7 materials, fabricators, archaeology, transmutation, crystallization, agronomy, smelting.\n• [color=255,215,80]Utility science[/color] — quantrinum, genetics, late energy, trade, defense, the first YI suit.\n• [color=255,90,90]Bob's alien science[/color] — the higher YI suits and walkers on top of Bob's power armor MK3–MK5.\n\n[font=default-bold][color=255,90,90]Five rules to remember[/color][/font]\n1. [font=default-bold]There is no Yuoki ore on the map.[/font] Everything is made from products of the build.\n2. [font=default-bold]Everything is unlocked by research[/font] — these tips too: a new tip appears with its technology.\n3. [font=default-bold]Only the fabricators make Yuoki parts[/font] [item=ye_fassembly1][item=ye_fassembly2][item=ye_fassembly_sp].\n4. [font=default-bold]Currencies[/font] (signs, reputation, UC-A2) have [color=255,90,90]no quality and no recycling[/color].\n5. [font=default-bold]MF cannot be barrelled[/font] — a barrel keeps no temperature.\n\n[font=default-bold][color=255,200,120]Colours in these tips[/color][/font]\n[color=255,170,60]MF[/color]  ·  [color=100,190,255]electricity[/color]  ·  [color=255,110,80]fuel and heat[/color]  ·  [color=130,230,130]gain[/color]  ·  [color=255,215,80]currencies[/color]  ·  [color=200,150,255]alien[/color]  ·  [color=255,90,90]not allowed[/color]
yuoki-solar-dish=[font=default-large-bold][color=130,230,130]Solar Stirling dish[/color][/font]\n[item=y-stirling-solar-dish] — a mirror dish focuses sunlight on a Stirling engine, and a heat store keeps it running at night. So it gives [color=255,170,60][font=default-bold]30 kW day and night[/font][/color].\n\n[font=default-bold][color=255,200,120]Compared with a solar panel (picture)[/color][/font]\n• [item=solar-panel] panel: [color=255,220,80]60 kW[/color] at noon, [color=255,90,90]0 at night[/color], about 42 kW on average, and it needs [item=accumulator] accumulators for the night.\n• [item=y-stirling-solar-dish] dish: a flat [color=255,170,60]30 kW[/color] on 2×2 tiles, [color=130,230,130]no accumulators needed[/color].\n\n[font=default-bold][color=255,200,120]What for[/color][/font]\nSmall remote posts — radars, turrets, pumps — run without an accumulator field. Built from what you already have: [item=steel-plate] steel, [item=iron-gear-wheel] gears, [item=copper-cable] cable, [item=electronic-circuit] circuits, [item=pipe] pipes.
yuoki-mf=[font=default-large-bold][color=255,170,60]Mechanical Force (MF)[/color][/font]\n[fluid=y-mechanical-force] [font=default-bold]MF[/font] is a pressurised working fluid. An engine burns fuel and heats it, shafts carry it to a generator, the generator takes the heat and makes electricity. Like steam, only much denser.\n\n[font=default-bold][color=255,170,60]The numbers everything rests on[/color][/font]\n• Engines output MF at exactly [color=255,170,60][font=default-bold]150 °C[/font][/color]. One unit carries [color=255,170,60][font=default-bold]840 kJ[/font][/color].\n• Bob's steam at 465 °C carries [color=210,210,230]90 kJ[/color] — 9 times less. That is why MF plants are compact.\n• [item=y-seg] small generator takes 4 MF/s → [color=100,190,255][font=default-bold]3.2 MW[/font][/color] (95 %). [item=y-meg-s] medium: 8 MF/s → [color=100,190,255]6.4 MW[/color].\n• One [item=y-sfe] solid-fuel engine feeds exactly one small generator.\n\n[font=default-bold][color=255,170,60]Shafts[/color][/font]\n[item=y-mftrans-shaft] a power shaft is a pipe for MF. [item=y-mftrans-shaft-ground] the underground shaft spans [font=default-bold]25 tiles[/font]. Made of [item=yie_hard_metals] T-Metal.\n\n[font=default-bold][color=255,90,90]Rules and details[/color][/font]\n• [item=barrel] [color=255,90,90]MF cannot be barrelled[/color]: a barrel keeps the amount but not the temperature — the energy would be lost.\n• Consuming machines accept only [color=130,230,130]MF of at least 150 °C[/color]. There is no cold MF.\n• MF generators take at most 150 °C. Hot 400 °C MF from the Yuoki steam turbine is for the TMFW-Gen-50 only.\n• Modules and beacons [color=255,90,90]do not affect[/color] MF recipes: otherwise it would be a perpetual motion machine.
yuoki-mf-engines=[font=default-large-bold][color=255,170,60]MF engines: three machines, three modes[/color][/font]\nAll engines burn their fuel themselves and [color=130,230,130][font=default-bold]need no electricity[/font][/color] — place them where there is no grid yet.\n\n[font=default-bold][color=255,200,120]Machines (picture: rows)[/color][/font]\n• [item=y-sfe] [font=default-bold]Solid-fuel[/font] — any solid fuel [item=coal][item=solid-fuel], [color=255,110,80]3 MW[/color], smoke [color=175,135,95]60/min[/color].\n• [item=y-ffe] [font=default-bold]Liquid-fuel[/font] — [color=255,110,80]any fluid with a fuel value[/color]: naphtha, fuel oil, methane, ethane, hydrogen, vegetable oil… [color=255,110,80]6 MW[/color], smoke depends on the fluid.\n• [item=ye_gasmotor] [font=default-bold]Gas[/font] — the same fuels and power, but [color=130,230,130]the best efficiency[/color] and half the smoke.\n\n[font=default-bold][color=255,200,120]Modes (picture: columns)[/color][/font]\nThe recipe selects the mode. The more you supply, the more MF from the same fuel:\n• [fluid=lubricant]+[fluid=water] [font=default-bold]with lubricant[/font] — [color=130,230,130]95 %[/color] (liquid-fuel 90 %): the best mode.\n• [fluid=water] [font=default-bold]water only[/font] — [color=255,215,80]83 %[/color] (78 %).\n• [font=default-bold]dry[/font] — [color=255,110,80]71 %[/color] (67 %), but nothing besides fuel: for places without water.\n\n[font=default-bold][color=255,200,120]How to place[/color][/font]\nLiquid and gas engines take fuel through the [font=default-bold]centre pipe on the north and south sides[/font] — it passes through, so engines can sit in a row on one main line. Water and lubricant go to the corners, MF leaves east and west. The three engines fast-replace each other.\n\n[font=default-bold][color=170,170,170]Quality[/color][/font]\nA better-quality engine is [color=130,230,130]more powerful[/color] but [color=255,90,90]not more efficient[/color]: fuel use grows with speed.
yuoki-mf-resource=[font=default-large-bold][color=255,170,60]MF as a resource[/color][/font]\nMF is not only for generators. Many Yuoki machines [font=default-bold]consume[/font] it as an ingredient — and it is always real energy (840 kJ per unit).\n\n[font=default-bold][color=100,190,255]Small electric motor[/color][/font]\n[item=y-emotor-s] turns electricity into hot MF: [color=100,190,255]350 kW[/color] → [color=255,170,60]0.4 MF/s[/color] (96 %). Handy when MF is needed at one spot and an engine is not worth it.\n\n[font=default-bold][color=130,230,130]Fatmice air scrubber (left scheme)[/color][/font]\n[item=y-electric-air-heater] washes pollution out with water: [color=130,230,130][font=default-bold]−150 pollution per minute[/font][/color] for [color=100,190,255]200 kW[/color] and [color=255,170,60]0.4 MF/s[/color] — exactly one small motor. No consumables like filters.\nCaptured smoke becomes [item=y-pol-waste] fly ash: 150 ash → 2 [item=y-mixed-fuel] fuel blocks of [color=255,110,80]4 MJ[/color] that can be burned again. A [color=130,230,130]closed loop[/color]: engines smoke, the scrubber takes the smoke, the ash goes back into the fire. Later the ash becomes feed in genetics.\n\n[font=default-bold][color=255,170,60]T-Metal forging (right scheme)[/color][/font]\nIn an assembler 2+: [item=steel-plate]×3 + [item=coal]×2 + [fluid=y-mechanical-force]×2 → [item=yie_hard_metals]×2. Without MF the same 2 cost 4 steel and 6 coal. T-Metal is needed in bulk: shafts, cases, engines.\n\n[font=default-bold][color=170,170,170]Later[/color][/font]\nMF is consumed by the can press, the ice maker, the DNA splicer, the Zeidon charger, the crystallizer and the form press.
yuoki-materials=[font=default-large-bold][color=200,150,255]N4 and F7 materials[/color][/font]\nThe two base substances of Yuoki. [color=255,90,90]They are not on the map[/color] — they come from [font=default-bold]centrifuging Angels super-pure ores[/font].\n\n[font=default-bold][color=255,200,120]Centrifuge: three different ores → 3 chunks[/color][/font]\n• [item=angels-ore1-pure]+[item=angels-ore5-pure]+[item=angels-ore6-pure] (saphirite, rubyte, bobmonium) → [item=y-res1][color=100,190,255][font=default-bold]×3 UniComp chunk N4[/font][/color] — the construction material.\n• [item=angels-ore2-pure]+[item=angels-ore3-pure]+[item=angels-ore4-pure] (jivolite, stiratite, crotinnium) → [item=y-res2][color=255,170,60][font=default-bold]×3 Energy mineral F7[/font][/color] — the energy material.\nAny centrifuge, 5 s. Super-pure ores are made from crystals in Angels sorting 4.\n\n[font=default-bold][color=255,200,120]Processing (picture)[/color][/font]\n• Crusher [item=y_crusher2]: 3 chunks + 200 water → 5 crushed.\n• Press [item=y_formpress2]: crushed N4 → [item=y-refined-yres1] granules → [item=y-unicomp-raw] [font=default-bold]UniComp N4[/font]; crushed F7 → [item=y-refined-yres2] saturated → [item=y-raw-fuelnium] [font=default-bold]charged F-C[/font] (the press uses a little MF).\n• Mixed crushed N4 and F7 (6+6) → [item=y-richdust][color=255,215,80] ×11 rich dust[/color] — needed almost everywhere. Rich dust in a furnace → [item=y-orange-stuff] krakon for electronics.\n\n[font=default-bold][color=130,230,130]Tip[/color][/font]\nKeep separate N4 and F7 lines and a shared rich dust buffer: emulsion, heat blocks, graphite and boards all use it.
yuoki-fabricators=[font=default-large-bold][color=200,150,255]Fabricators C1, Y2, P3[/color][/font]\nYuoki has its own factories. [color=255,90,90][font=default-bold]Yuoki parts are made only there[/font][/color]: not in assemblers, not by hand.\n• [item=ye_fassembly1] [font=default-bold]C1[/font] — speed 2, simple parts.\n• [item=ye_fassembly2] [font=default-bold]Y2[/font] — speed 3, plus advanced parts (chips, frames, coils).\n• [item=ye_fassembly_sp] [font=default-bold]P3[/font] — speed 5, the fastest (utility science).\nFabricators can do nothing else — do not try to use them as assemblers.\n\n[font=default-bold][color=100,190,255]Yuoki eats your build[/color][/font]\nEvery part needs [color=100,190,255][font=default-bold]one late product of the build[/font][/color]: titanium, nitinol, fibreglass board, processors, heat pipe 3, gilded cable, insulated coil, silicon wafer, copper-tungsten, cobalt bearings, battery 2. The picture shows [item=y-chip-2] the I286 chip: board, krakon, dotzetron and [item=bob-advanced-processing-unit] Bob's advanced processor.\n\n[font=default-bold][color=255,215,80]Techanic signs[/color][/font]\nMany parts also yield [item=y_rwtechsign][color=255,215,80] techanic signs[/color]: the I286 chip, the improved frame, the magnetron, the Obninsk fuel cell give 3, others 1–2. These recipes have [color=255,90,90]no quality[/color].
yuoki-currencies=[font=default-large-bold][color=255,215,80]Yuoki currencies[/color][/font]\nYuoki pays and charges with special items. In the picture: top — where it comes from, [color=255,215,80]framed[/color] — the currency, bottom — what it is spent on.\n• [item=y_rwtechsign][color=255,215,80][font=default-bold] Techanic sign[/font][/color] — by-product of fabricator parts. Spent on YI suits, mastercrafted machines, reputation.\n• [item=ypfw_trader_sign][color=255,215,80][font=default-bold] Merchant sign[/font][/color] — export through the Laika Gate. Spent on reverse-transmutation licences, buying DNA, reputation.\n• [item=y_greensign][color=255,215,80][font=default-bold] Nature sign[/font][/color] — by-product of agronomy and genetics. Spent on the hydra farm and reputation.\n• [item=ye_science_blue][color=255,215,80][font=default-bold] Science sign[/font][/color] — the research center makes it from a set of all six packs (military included). Spent on reactors, turbines, DNA lines.\n• [item=y-fame][color=255,215,80][font=default-bold] Reputation[/font][/color] — the ancient monument and exchanges. Needed for the Laika Gate and armor.\n• [item=y-unicomp-a2][color=255,215,80][font=default-bold] UniComp A2[/font][/color] — the Cimota restructor from ore and waste. Spent on quantrinum and reverse transmutation.\n\n[font=default-bold][color=255,90,90]Rules[/color][/font]\n• [item=quality-module] Currencies have [color=255,90,90]no quality[/color]: recipes that yield them take no quality.\n• [item=recycler-1] Currencies [color=255,90,90]are not recycled[/color].\n• Finished Yuoki products (machines, armor, turrets) get quality but yield no currency.
yuoki-archaeology=[font=default-large-bold][color=200,170,120]Archaeology[/color][/font]\nDig dirt anywhere and wash it — this finds things that exist nowhere else.\n\n[font=default-bold][color=255,200,120]Digging (top scheme)[/color][/font]\n• [item=y-underground-drill] the underground drill digs [item=y-dirt] dirt [font=default-bold]without a deposit[/font]: 1 per 2 s, or 8 per 3 s with a [item=y_drillhead] drill head (the head breaks).\n• [item=y-dirtwasher] washing: 10 dirt + 150 water → 2 [item=stone] + [color=200,150,255]1 [item=y-crystal2] ancient fragment[/color] + 150 [fluid=y-con_water] contaminated water.\n• Contaminated water → press → [item=y-c_mud] wet mud → [item=y-dry_mud] dry mud → [item=y-mixed-fuel] fuel blocks or [item=y-unicomp-a2] UC-A2.\n\n[font=default-bold][color=130,230,130]Pure metals (bottom left)[/color][/font]\n[item=iron-ore]×5 + water → [item=y-pure-iron]×3 → 2 plates each in a furnace: [color=130,230,130][font=default-bold]6 plates from 5 ore (+20 %)[/font][/color]. With a [item=y_toolhead] tool head: 15 ore → 12 pure iron = [color=130,230,130][font=default-bold]24 plates (+60 %)[/font][/color]. The same for copper.\n\n[font=default-bold][color=255,170,60]Head repair (bottom right)[/color][/font]\n4 broken heads + [item=y-repair-durotal] a Durotal repair kit (returned) → 4 heads and a techanic sign.\n\n[font=default-bold][color=200,150,255]What the fragments are for[/color][/font]\n[item=y-crystal2] ancient fragments are needed for crystal seeds, the Zeidon charger, quantrinum, Lachnan crystals and data crystals. Washing dirt is their only source.
yuoki-transmutation=[font=default-large-bold][color=255,215,80]Transmutation: UniComp A2[/color][/font]\n[item=y-atomic-constructor] the [font=default-bold]Cimota restructor[/font] ([color=100,190,255]8 MW[/color]) breaks matter down into a universal base — [item=y-unicomp-a2][color=255,215,80][font=default-bold] UniComp A2[/font][/color].\n\n[font=default-bold][color=255,200,120]Hand-in (left scheme)[/color][/font]\n• [font=default-bold]100[/font] of any ore of the build (Angels, Bob, coal, stone, uranium…) → 1 UC-A2.\n• [font=default-bold]100[/font] [item=angels-slag] slag or ancient fragments → 1 UC-A2.\n• [font=default-bold]20[/font] N4/F7 chunks, 30 dry mud, 20 rich dust (in the press) → 1 UC-A2.\nThe rate is harsh on purpose: UC-A2 is a [color=255,215,80]valuable[/color] currency, not a free way to get rid of surplus.\n\n[font=default-bold][color=255,200,120]What for[/color][/font]\nUC-A2 goes into [item=y-quantrinum] quantrinum, [item=y-infused-uca2] transmuted UC-A2, heat and atomic recipes. Later, with Reverse transmutation, it turns back into ore (right scheme) — [color=255,90,90]with a big loss[/color].\n\n[font=default-bold][color=170,170,170]Setting[/color][/font]\nThe startup setting "Fluids -> UC-A2" (off by default) allows handing in oil products and lubricant: 500 units per UC-A2.
yuoki-crystallization=[font=default-large-bold][color=200,150,255]Crystallization: more chunks from the same ore[/color][/font]\nA crystal seed in a centrifuge 2+ gives [color=130,230,130][font=default-bold]5 chunks instead of 3[/font][/color] from the same three super-pure ores.\n\n[font=default-bold][color=255,200,120]Seed chain (top scheme)[/color][/font]\n1. [item=stone-brick] brick → crusher → [item=y_steinmehl] ×8 stone flour.\n2. Mixer [item=y_mixer_emu]: 4 flour + [item=y-richdust] rich dust + 200 water → 100 [fluid=y_emulsion] emulsion.\n3. High-pressure pump [item=y_hppump] → [fluid=y_richemulsion] rich emulsion.\n4. Dryer [item=y_trockner]: 50 rich emulsion → [item=y_crystal_dust]×2 crystal dust.\n5. Crystallizer [item=y_crystalizer]: 4 dust + [color=255,170,60]10 MF[/color] → [item=y-crystal-seed] seed.\n\n[font=default-bold][color=255,200,120]Three seed recipes (bottom scheme)[/color][/font]\n• 4 crystal dust;  • 2 dust + 4 [item=y-crystal2] ancient fragments;  • 2 dust + 10 [item=angels-crystal-dust] Angels crystal dust. Use whatever you have more of.\n\n[font=default-bold][color=130,230,130]Result[/color][/font]\nOne brick makes many seeds, and every seed is [color=130,230,130]+2 chunks[/color]. The machines are expensive but pay off on big ore flows.
yuoki-smelting=[font=default-large-bold][color=255,110,80]Frank & Peppe smelter[/color][/font]\nFast smelting on [font=default-bold]heat storage blocks[/font]: heat is stored at the charger and used where it is convenient.\n\n[font=default-bold][color=255,200,120]Block cycle (picture)[/color][/font]\n1. [item=y_block_cold] cold blocks are pressed from charged F-C, structure elements and rich dust.\n2. [item=y_charger] Zeidon charger: 10 cold + 1 rich dust + [color=255,170,60][font=default-bold]20 MF[/font][/color] → 10 [item=y_block_heat] hot.\n3. [item=y_smelter] Smelter: 9 [item=y-pure-iron] pure iron + 1 hot block + water → [color=130,230,130][font=default-bold]18 plates[/font][/color] in 3 s, plus slag. [color=110,170,255]The cold block comes back[/color] — send it to the charger again.\nSteel: 14 pure iron + a block → 6 steel. Copper works like iron.\n\n[font=default-bold][color=130,230,130]What for[/color][/font]\nOne smelter replaces a row of furnaces, and pure metals from archaeology give more plates than ore.
yuoki-storage=[font=default-large-bold][color=100,190,255]Yuoki accumulators[/color][/font]\nThree steps, each stronger than the build's accumulators of its stage (picture: capacity [color=100,190,255]MJ[/color] and power [color=255,170,60]MW[/color]):\n• [item=y_compensator_25] [font=default-bold]Flow compensator Mk4[/font] 2×2 — [color=100,190,255]50 MJ[/color], [color=255,170,60]8 MW[/color]. Built from Bob's fast accumulator 2.\n• [item=y-accumulator-b-tx] [font=default-bold]AQE accumulator[/font] 3×3 — [color=100,190,255]200 MJ[/color], [color=255,170,60]20 MW[/color] (quantum accumulators).\n• [item=y-accumulator-crystal-m] [font=default-bold]Quantrinum[/font] 3×3 — [color=100,190,255]600 MJ[/color], [color=255,170,60]40 MW[/color]: [color=130,230,130]the largest store of the build[/color].\nFor comparison in grey: Bob's fast accumulator 3 — 64 MJ / 15 MW, the bio accumulator — 300 MJ / 25 MW.\n\n[font=default-bold][color=130,230,130]Where they help[/color][/font]\nPeaks of F12+ laser turrets and the D-ZTT fortress, solar power at night, a buffer for reactors. The compensator is also a part of the reputation monument and the D-ZTT fortress.
yuoki-agronomy=[font=default-large-bold][color=170,230,100]Agronomy[/color][/font]\nYuoki's own farming. It is [color=170,230,100]the only source of biomaterials[/color] of the mod and the source of nature signs.\n\n[font=default-bold][color=255,200,120]An expensive start[/color][/font]\nFirst seeds: 20 [item=angels-solid-corn] Angels corn + 10 [item=angels-solid-fertilizer] fertilizer + 1 [item=production-science-pack] → [item=ye_seed_a]. After that seeds come from your own corn: [color=130,230,130]20 → 1[/color].\n\n[font=default-bold][color=255,200,120]Farm (top scheme)[/color][/font]\n[item=ye_farm] Frame farm: 1 seed + 500 water → [color=170,230,100][font=default-bold]500 corn[/font][/color] in 300 s. With slurry from genetics — 600 in 200 s. Vugar cane [item=ye_corn_b]: 300 in 420 s.\n\n[font=default-bold][color=170,230,100]What to do with the harvest[/color][/font]\n• [fluid=ye_cornoil] [font=default-bold]Vegetable oil[/font] (press, needs MF): [color=255,110,80]fuel[/color] for the liquid-fuel and gas engines, or 30 → 10 [fluid=lubricant] lubricant.\n• [item=ye_sugar] vugar sugar (30 cane → 3), [item=ye_celluose] trifitan → [item=wood] synthetic wood, compost into organic dust.\n• Exchange with Angels (bottom scheme): 10 Yuoki corn → 4 Angels, 4 Angels → 8 Yuoki — [color=255,90,90]with a loss both ways[/color].\n\n[font=default-bold][color=130,230,130]Tip[/color][/font]\nPlant early: corn, vugar and oil are needed by genetics, cans and the ranch.
yuoki-alien=[font=default-large-bold][color=200,150,255]Quantrinum and alien technology[/color][/font]\nThe heart of late Yuoki is [item=y-quantrinum][color=200,150,255][font=default-bold] quantrinum[/font][/color].\n\n[font=default-bold][color=255,200,120]Infuser (top scheme, left)[/color][/font]\n[item=y-alien-infuser]: 1 [item=y-unicomp-a2] UC-A2 in 60 s → [item=y-infused-uca2] transmuted UC-A2 + [color=255,215,80]2 techanic signs[/color].\n\n[font=default-bold][color=255,200,120]Quantrinum (top scheme, right)[/color][/font]\nAtomic-quantum composer [item=y-atomic-quantum-composer]: 15 UC-A2 + 12 charged F-C + 12 UniComp N4 + 8 ancient fragments → [color=200,150,255][font=default-bold]2 quantrinum[/font][/color] + a science sign.\n\n[font=default-bold][color=255,200,120]Lachnan crystal and the charge chain (bottom scheme)[/color][/font]\n• [item=y-crystal-cnd][color=255,215,80] Lachnan crystal[/color] — a catalyst: pure iron, slag, UC-A2 and fragments.\n• Infusion: quantrinum + Lachnan crystal + 5 UC-A2 → [item=y_quantrinum_infused] transmuted quantrinum.\n• [item=y-quantrinum-charge] Unstable quantrinum (×2) burns in the [item=y-quantrinum-reactor] quantrinum reactor: [color=255,170,60][font=default-bold]300 MF at 400 °C[/font][/color] each (≈700 MJ).\n\n[font=default-bold][color=255,200,120]What comes next[/color][/font]\nThis opens catalytic centrifuging, quantum accumulators, Sol-Ray, the P3 fabricator, the Obninsk reactor, the Quantrinum-R repair tool, reputation and trade.
yuoki-catalysis=[font=default-large-bold][color=200,150,255]Catalytic centrifuging[/color][/font]\nThe top of N4 and F7 production. The picture shows the yield ladder for one set of super-pure ores:\n• [item=centrifuge] any centrifuge — [font=default-bold]3 chunks[/font].\n• [item=bob-centrifuge-2] centrifuge 2 + [item=y-crystal-seed] seed — [color=130,230,130][font=default-bold]5 chunks[/font][/color].\n• [item=bob-centrifuge-3] centrifuge 3 + seed + [item=y-crystal-cnd] Lachnan crystal — [color=200,150,255][font=default-bold]8 chunks[/font][/color].\n\n[font=default-bold][color=255,215,80]The catalyst comes back[/color][/font]\nThe Lachnan crystal [color=255,215,80]returns with 90 % probability[/color]: on average one crystal per 10 cycles. The seed is used up every time — keep crystallization running.\n\n[font=default-bold][color=130,230,130]Gain[/color][/font]\nThe same super-pure ores give [color=130,230,130]2.7 times more[/color] material than a plain centrifuge.
yuoki-genetics=[font=default-large-bold][color=170,230,100]Genetics: DNA, ranch, hydra farm[/color][/font]\nYuoki biology turns the build's waste into useful materials.\n\n[font=default-bold][color=255,200,120]DNA[/color][/font]\nThe first [item=ye_dna] DNA — from 20 production and 10 chemical packs, or bought for 2000 merchant signs. Then the [item=ye_dnasplicer] DNA splicer multiplies it from meat, blood, MF and an Angels bio token and breeds the lines: ommtrinit, verotin, organic iron.\n\n[font=default-bold][color=255,200,120]Caged ranch (picture)[/color][/font]\n[item=ye_meatfarm] grows creatures along a DNA line, output per cycle:\n• Basic line: corn + vugar + water → [item=ye_rawmeat] meat, [fluid=ye_blood] blood, [fluid=ye_slurry] slurry.\n• Ommtrinit: + [item=y-pol-waste][color=175,135,95] fly ash[/color], seeds, oil → [item=ye_omtrinit][color=200,150,255] ommtrinit[/color] — [font=default-bold]needed by the Rheinsberg[/font] (96).\n• Verotin: substratin + crude oil → [item=ye_verotin] verotin and methane.\n• Organic iron: T-Metal + lubricant + [item=angels-slag] slag → [item=ye_organic_metall] → in a furnace [color=130,230,130]7 pure iron[/color].\n\n[font=default-bold][color=130,230,130]Substratin and the hydra farm[/color][/font]\n[item=ye_substrat] Substratin grows on contaminated water or on [fluid=angels-water-yellow-waste][color=130,230,130] Angels yellow waste water[/color]. [item=ye_pool] The hydra farm turns blood into slurry, and slurry fertilizes farms (600 corn instead of 500) or goes into gas.\n\n[font=default-bold][color=130,230,130]Closed loops[/color][/font]\nEngine smoke → ash → feed; Angels slag and waste water → materials; slurry → fertilizer. Waste becomes raw material.
yuoki-late-energy=[font=default-large-bold][color=255,110,80]Late energy[/color][/font]\n\n[font=default-bold][color=255,170,60]Heavy MF[/color][/font]\nMF in bulk for Yuoki factories and farms: [item=ye_emotor_m] medium motor ([color=100,190,255]3.5 MW[/color] → 4 MF/s), [item=ye_overheater] overheater (steam 500 °C), [item=ye_sturbine] steam-to-MF turbine (MF 400 °C), [item=ye_tfmw_generator-s] TMFW-Gen-50 (≈[color=100,190,255]50 MW[/color] from 400 °C MF), big and huge generators.\nAs a power plant heavy MF is weaker than Bob's boilers — its job is to feed the Yuoki machines.\n\n[font=default-bold][color=255,110,80]Yuoki nuclear (top scheme)[/color][/font]\n• [item=y-obninsk-reactor] [font=default-bold]Obninsk reactor[/font]: MX fuel → MF straight from water ([color=255,170,60]≈42 MW[/color]) and processing of [item=y_mox2mixed] MX-C mix from uranium into [item=y_mox2fuel] 7 GJ fuel.\n• [item=ye_rheinsberg] [font=default-bold]VVER-210 Rheinsberg[/font]: [color=255,110,80]75 MW[/color], steam up to [color=255,110,80][font=default-bold]1000 °C[/font][/color] — 380 steam/s, exactly one [item=ye_tfmw_turbine-s] TMFW-TUR-72 turbine at [color=100,190,255][font=default-bold]72 MW[/font][/color] (97 %).\nThe Rheinsberg needs 96 ommtrinit from genetics and 64 MX-C mixes from Obninsk — a goal worth growing both biology and atom for.\n\n[font=default-bold][color=170,170,170]Picture: machine output[/color][/font]\nBars are the power of one machine in MW.
yuoki-sol-ray=[font=default-large-bold][color=200,150,255]Sol-Ray flux collectors[/color][/font]\nThey catch not sunlight but the [color=200,150,255][font=default-bold]alien flux[/font][/color] — so they [color=130,230,130]work the same day and night[/color].\n• [item=y_alien_solar] Tiny 7×7 — [color=200,150,255][font=default-bold]1.5 MW[/font][/color] around the clock.\n• [item=y_alien_solar2] Small 9×9 — [color=200,150,255][font=default-bold]3 MW[/font][/color] around the clock.\n\n[font=default-bold][color=255,200,120]Comparison (picture)[/color][/font]\nBob's large panel 3 gives more per tile at noon, but zero at night, and it needs an accumulator field. Sol-Ray [color=130,230,130]needs no storage[/color]: place it and get steady power.
yuoki-trade=[font=default-large-bold][color=255,215,80]Reputation and the Laika Gate[/color][/font]\n\n[font=default-bold][color=255,200,120]Reputation (left scheme)[/color][/font]\n[item=y-fame-gen] the [font=default-bold]ancient monument[/font] slowly brings [item=y-fame][color=255,215,80] reputation[/color]: 1 for free per 1800 s, or for 25 techanic signs per 900 s.\nLater reputation can be exchanged at the gate: 2000 techanic, 1000 merchant, 200 nature or 100 science signs → 1.\nBuilding the [item=y-stargate] Laika Gate needs [color=255,215,80][font=default-bold]10 reputation[/font][/color].\n\n[font=default-bold][color=130,230,130]Export (right scheme)[/color][/font]\nThe gate and the [item=ye_trade_node] trade node sell goods to other worlds for [item=ypfw_trader_sign][color=255,215,80] merchant signs[/color]:\n• 20 [item=y-orange-stuff] krakon → 40;  • 10 [item=y-chip-2] I286 chips → 120;  • 5 [item=y-fuel-reactor] Obninsk cells → 60;\n• food (with Cold chain): 4 [item=ye_buechse_gelb] → 400, 2 [item=ye_buechse_white] → 800.\n\n[font=default-bold][color=255,200,120]Spend them on[/color][/font]\nReverse-transmutation licences (5 signs), buying DNA (2000), reputation, the Symbol of profit (50 000).
yuoki-reverse-transmutation=[font=default-large-bold][color=200,150,255]Reverse transmutation[/color][/font]\nThe Cimota restructor also works backwards: any ore of the build from [item=y-unicomp-a2] UC-A2.\n\n[font=default-bold][color=255,215,80]Licence (right scheme)[/color][/font]\nEvery run: 1 UC-A2 + [color=255,215,80]5 merchant signs[/color] + [color=255,215,80]1 charged F-C[/color] → [font=default-bold]10 ore[/font] (uranium — 6) in 10 s.\n\n[font=default-bold][color=255,90,90]Price[/color][/font]\n100 ore in → 1 UC-A2 → 10 ore back. [color=255,90,90][font=default-bold]A 90 % loss[/font][/color] plus the licence. This is not recycling but [color=130,230,130]a late source of rare ore[/color] where you have none: uranium, thorium, tungsten, Bob and Angels ores.
yuoki-food-trade=[font=default-large-bold][color=110,170,255]Cold chain and food export[/color][/font]\nFood from genetics and agronomy is sold to other worlds — the main source of merchant signs.\n\n[font=default-bold][color=255,200,120]Ice and containers (picture)[/color][/font]\n[item=ye_icemaker] Ice maker: 20 empty [item=ye_ice_container_empty] containers + [color=255,170,60]8 MF[/color] + 400 water → 20 filled. Packing meat [color=110,170,255]returns the empty container[/color] — loop it back.\n• [item=ye_package_c_meat] Zyfrut steaks: a filled container + 7 cooked meat + an empty package.\n• Cans: the press makes 12 empty cans from T-Metal and MF; [item=ye_buechse_gelb] canned corn and [item=ye_buechse_white] Assorti — in the fluid handling machine.\n\n[font=default-bold][color=255,215,80]Export[/color][/font]\n• 4 canned corn → 400 merchant signs + 1 UC-A2;  • 2 Assorti → 800 + 4 UC-A2.\n• 4 raw meat packages → 4 UC-A2 + DNA;  • 20 steak packages → 1 [item=y-quantrinum] quantrinum.\n• Trinit-Om → signs and reputation;  • V-R-T-N → transmuted UC-A2;  • 10 barrels of blood → reputation (barrels come back).
yuoki-defense=[font=default-large-bold][color=255,90,90]F12+ defense[/color][/font]\nYuoki turrets are [font=default-bold]improved versions of the build's best turrets[/font]: each [color=255,90,90]consumes[/color] the turret it supersedes, plus a Yuoki machine frame.\n• [item=bob-gun-turret-5] → [item=y_turret_gun2f12] [font=default-bold]Maudlin[/font] and [item=y_turret_gun1f12] [font=default-bold]BruteMan[/font].\n• [item=bob-laser-turret-5] → [item=y_turret_laser22f12] [font=default-bold]Eisenwulf[/font]; two laser turrets 5 → [item=y-weapon-ztt] [font=default-bold]the D-ZTT fortress[/font].\n• [item=bob-plasma-turret-2] → [item=y_turret_plasma] T-PLASMA;  [item=flamethrower-turret] → [item=y_turret_flame] T-CHEMIC (own ammo).\n• [item=bob-reinforced-wall] → [item=y-wall-forcefield] the Vitduo force field.\n\n[font=default-bold][color=130,230,130]Strength[/color][/font]\nAbout [color=130,230,130]twice the damage[/color] and health, range +2…+6 tiles. The turrets earn HeroTurrets ranks like the other turrets of the build.
yuoki-repair=[font=default-large-bold][color=130,230,130]Yuoki repair tools[/color][/font]\nA chain of repair tools above [item=bob-repair-pack-5] Bob's repair pack 5 (picture: speed and durability):\n• [item=y-repair-durotal] [font=default-bold]Durotal[/font] — speed [color=130,230,130]12[/color], durability [color=130,230,130]8000[/color]. It also repairs drill and tool heads.\n• [item=y-repair-krakon] [font=default-bold]Airat9000[/font] — [color=255,170,60]16[/color] / [color=255,170,60]15 000[/color].\n• [item=y_repair_quantrinum] [font=default-bold]Quantrinum-R directive[/font] — [color=200,150,255]30[/color] / [color=200,150,255]30 000[/color].\nEach one is built from the previous one.
yuoki-armor=[font=default-large-bold][color=255,215,80]YI suits and walkers[/color][/font]\nYI armor is an [font=default-bold]improved version of the build's power armor[/font]: each suit is built from the armor of its tier and is one step above it.\n• [item=power-armor-mk2] MK2 → [item=yi_armor_gray] [font=default-bold]YI working suit[/font] (grid 9×9).\n• [item=bob-power-armor-mk3] Bob MK3 → [item=yi_armor_red] [font=default-bold]master technician suit[/font] (10×10).\n• [item=bob-power-armor-mk4] Bob MK4 → [item=yi_armor_gold] [font=default-bold]YI master suit[/font] (11×11).\n• [item=bob-power-armor-mk5] Bob MK5 → [item=yi_walker_a] [font=default-bold]Walker T.R.[/font] (12×12) → [item=yi_walker_c] [font=default-bold]I am a walking death[/font] (13×13).\n\n[font=default-bold][color=130,230,130]What a step gives[/color][/font]\nAn equipment grid one size larger, [color=130,230,130]the base armor's resistances +5 % and +2[/color], 5 more inventory slots, durability ×1.25.\n\n[font=default-bold][color=255,215,80]Cost[/color][/font]\nTechanic signs (400…6000), reputation, transmuted quantrinum, Yuoki parts; the higher ones also need a compensator, an AQE and a quantrinum accumulator. Each step unlocks after Bob's armor of its tier.
yuoki-ultimates=[font=default-large-bold][color=255,215,80]Mighty Domination Symbols[/color][/font]\nCult trophies — the top of the Yuoki economy and the main currency sink (picture):\n• [item=y_trade_ultimate] [font=default-bold]Cult of profit[/font] — 50 000 merchant signs. The building makes a merchant sign every 30 s.\n• [item=ye_science_ultimate] [font=default-bold]Cult of science[/font] — 30 000 science signs. A radar symbol.\n• [item=ye_green_ultimate] [font=default-bold]Cult of nature[/font] — 60 000 nature signs. Makes a nature sign every 30 s or wood every 5 s.\n[color=170,170,170]A goal for those who have built the whole Yuoki economy.[/color]
