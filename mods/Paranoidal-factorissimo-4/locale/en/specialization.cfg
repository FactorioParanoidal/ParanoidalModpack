[technology-description]
factory-specialization-optimization=Standardize the machinery in a factory. If at least 90% of its production machines are the same model and use the same recipe, the factory gains crafting speed. If at least 90% are the same model, the factory uses less energy during operation. Thresholds of 10, 20 and 40 matching machines grant 5%, 10% and 15% respectively. Both bonuses can apply together.

