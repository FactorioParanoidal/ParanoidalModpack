[technology-description]
factory-specialization-optimization=Стандартизируйте оборудование фабрик. Если не менее 90% производственных машин одной модели делают один рецепт, цех получает бонус скорости. Если не менее 90% машин одной модели, цех снижает расход энергии при работе. Пороги 10, 20 и 40 подходящих машин дают 5%, 10% и 15% соответственно. Оба бонуса могут действовать одновременно.

