[mod-setting-description]
runames-set-classic=12 543 названия из Russian Station Names. Станции — весь список. Дронстанции — «Ежевичная», «Радиотехническая». Лаборатории — «Академика Вавилова». Радары — «Адмирала Нахимова». Локомотивы — «Сергея Есенина».\n\nCtrl+N — случайное название, Ctrl+R — переименовать.
runames-set-geo=Станции — города России и их прежние названия («Дирижаблестрой», «Голый Карамыш»). Локомотивы — реки. Радары — вершины, сопки и мысы. Дронстанции — озёра, острова и бухты. Лаборатории — наукограды и закрытые города («Арзамас-16»).
runames-set-science=Лаборатории — учёные, изобретатели и номерные НИИ. Радары — звёзды и созвездия. Локомотивы — частицы и единицы измерения. Дронстанции — химические элементы. Станции — научные термины («Кот Шрёдингера»).
runames-set-space=Радары — спутники и станции слежения. Локомотивы — ракеты и самолёты. Лаборатории — межпланетные зонды. Дронстанции — орбитальные станции и грузовики «Прогресс». Станции — космодромы, моря и кратеры Луны.
runames-set-rail=Настоящие железнодорожные обозначения. Станции — «Платформа 47 км», разъезды, парки. Локомотивы — серии с номерами («ВЛ80с-1234») и фирменные поезда. Радары — посты и светофоры. Дронстанции — «ПЧ-12», «ТЧ-7». Лаборатории — вагоны-лаборатории.
runames-set-nature=Локомотивы — сильные и быстрые звери, птицы и рыбы. Радары — чуткие ночные сторожа. Дронстанции — ульи, гнёзда и насекомые. Лаборатории — травы и грибы. Станции — рощи, болота и урочища.
runames-set-folk=Локомотивы — богатыри и волшебный транспорт. Радары — вещие птицы и всевидящие предметы. Дронстанции — волшебные помощники и жители теремка. Лаборатории — чародеи и мастера. Станции — сказочные места.
runames-set-books=Герои и места русских, советских и переводных книг. Лаборатории — учёные из книг. Радары — сыщики. Локомотивы — путешественники. Дронстанции — маленькие помощники. Станции — книжные места.
runames-set-ussr=Радары — радиоприёмники и телевизоры. Локомотивы — автомобили, мотоциклы и велосипеды. Лаборатории — ЭВМ и калькуляторы. Дронстанции — бытовая техника. Станции — конфеты, газировка и гастроном.
runames-set-bnl=Пародия на корпорацию Buy n Large из сюжета сборки. Дронстанции — роботы. Станции — палубы и кассы «Аксиомы-7». Лаборатории — отделы BnL. Радары — голоэкраны и колл-центры. Локомотивы — транспорт BnL.
runames-set-fire=Самые безумные, ироничные и абсурдные названия — для каждого типа построек свои. Половина подобрана вручную, половина собирается из слов с согласованной грамматикой, поэтому повторы редки.
runames-set-backer=Встроенные имена спонсоров Factorio.

