[mod-name]
RuNames-reforged=RuNames Reforged (Русские имена)

[mod-description]
RuNames-reforged=Русские имена для станций, локомотивов, лабораторий, радаров и дронстанций. Заменяет моды Name Lists, Russian Station Names и Renamer.\n\nНовые постройки получают случайное имя из 11 наборов: станции и улицы России, карта Родины, наука, космос, депо и разъезды, природа, сказки, книги, «Сделано в СССР», Buy n Large и «Огонь» — самые безумные названия. Имена спонсоров Factorio — отдельный набор, по умолчанию выключен. Наборы включаются в настройках карты.\n\nCtrl+N — новое случайное имя для постройки под курсором.\nCtrl+R — окно переименования: своё название, значки, случайное имя и сброс.

[controls]
runames-random-name=Случайное название
runames-rename=Сменить название объекта

[controls-description]
runames-random-name=Наведите курсор на станцию, локомотив, лабораторию, радар или дронстанцию и нажмите клавишу — объект получит новое случайное название из включённых наборов.
runames-rename=Наведите курсор на станцию, локомотив, лабораторию, радар или дронстанцию и нажмите клавишу — откроется окно переименования: можно ввести название, вставить значки, выбрать случайное название или сбросить ввод.

