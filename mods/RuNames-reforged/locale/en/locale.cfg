[mod-name]
RuNames-reforged=RuNames Reforged

[mod-description]
RuNames-reforged=Russian names for train stops, locomotives, labs, radars and roboports. Replaces Name Lists, Russian Station Names and Renamer.\n\nNew buildings get a random name from 11 name sets: Russian stations and streets, map of Russia, science, space, depots and sidings, nature, fairy tales, books, "Made in the USSR", Buy n Large and "Fire" — the craziest names. Factorio backer names are a separate set, off by default. Sets are toggled in map settings.\n\nCtrl+N — a new random name for the building under the cursor.\nCtrl+R — rename window: your own name, icons, random name and reset.

[controls]
runames-random-name=Random name
runames-rename=Rename

[controls-description]
runames-random-name=Hover over a train stop, locomotive, lab, radar or roboport and press the key to give it a new random name from the enabled name sets.
runames-rename=Hover over a train stop, locomotive, lab, radar or roboport and press the key to open the rename window: type a name, insert icons, pick a random name or reset the input.

