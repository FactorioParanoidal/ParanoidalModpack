[mod-setting-description]
runames-set-classic=The 12,543 names of Russian Station Names. Train stops: the whole list. Roboports: feminine adjectives. Labs: "Akademika…", "Professora…". Radars: military ranks. Locomotives: "named after…".
runames-set-geo=Train stops: cities of Russia and their former names. Locomotives: rivers. Radars: peaks, volcanoes and capes. Roboports: lakes, islands and bays. Labs: science cities and closed towns.
runames-set-science=Labs: scientists, inventors and numbered research institutes. Radars: stars and constellations. Locomotives: particles and units. Roboports: chemical elements. Train stops: science terms.
runames-set-space=Radars: satellites and tracking stations. Locomotives: rockets and aircraft. Labs: space probes. Roboports: orbital stations and cargo ships. Train stops: cosmodromes, lunar seas and craters.
runames-set-rail=Real railway designations. Train stops: "Platform 47 km", sidings, yards. Locomotives: series with numbers and named trains. Radars: signal posts. Roboports: track and depot service codes. Labs: test cars.
runames-set-nature=Locomotives: strong and fast animals, birds and fish. Radars: keen night watchers. Roboports: hives, nests and insects. Labs: herbs and mushrooms. Train stops: groves, swamps and meadows.
runames-set-folk=Locomotives: bogatyrs and magic transport. Radars: prophetic birds and all-seeing items. Roboports: magic helpers. Labs: sorcerers and master craftsmen. Train stops: fairy-tale places.
runames-set-books=Characters and places of Russian, Soviet and translated books. Labs: scientists from books. Radars: detectives. Locomotives: travellers. Roboports: little helpers. Train stops: places from books.
runames-set-ussr=Radars: radios and TV sets. Locomotives: cars, motorcycles and bicycles. Labs: computers and calculators. Roboports: home appliances. Train stops: sweets, soda and grocery.
runames-set-bnl=Parody of the Buy n Large corporation from the modpack story. Roboports: robots. Train stops: decks and checkouts of the Axiom-7. Labs: BnL departments. Radars: holo-screens and call centres. Locomotives: BnL transport.
runames-set-fire=The craziest, most ironic and absurd names, separate for every building type. Half are hand-picked, half are built from word pools with matching grammar, so repeats are rare.
runames-set-backer=The built-in names of Factorio backers.

[runames-gui]
title=Rename
random=Random name
reset=Reset input
commit=Save new name
cancel=Cancel
