[mod-setting-description]
bobmods-modules-perlevel-bonus-consumption=[item=efficiency-module] Прибавка снижения энергопотребления для модулей эффективности за каждый уровень выше первого. Например, 0,1 добавляет к эффекту 10 процентных пунктов за уровень. 0 отключает только этот рост; начальный бонус сохраняется.\n[color=#9cdcfe]По умолчанию: 0,1. Диапазон: 0,01–1. После перезапуска игры.[/color]
bobmods-modules-perlevel-bonus-pollution=[item=assembling-machine-2] Прибавка снижения загрязнения для модулей очистки за каждый уровень выше первого. Например, 0,1 добавляет к эффекту 10 процентных пунктов за уровень. 0 отключает только этот рост; начальный бонус сохраняется.\n[color=#9cdcfe]По умолчанию: 0,15. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-perlevel-bonus-pollutioncreate=[item=assembling-machine-2] Прибавка увеличения загрязнения для модулей загрязнения за каждый уровень выше первого. Например, 0,1 добавляет к эффекту 10 процентных пунктов за уровень. 0 отключает только этот рост; начальный бонус сохраняется.\n[color=#9cdcfe]По умолчанию: 0,5. Диапазон: 0,01–1. После перезапуска игры.[/color]
bobmods-modules-perlevel-bonus-productivity=[item=productivity-module] Прибавка продуктивности для модулей продуктивности за каждый уровень выше первого. Например, 0,1 добавляет к эффекту 10 процентных пунктов за уровень. 0 отключает только этот рост; начальный бонус сохраняется.\n[color=#9cdcfe]По умолчанию: 0,05. Диапазон: 0,01–1. После перезапуска игры.[/color]
bobmods-modules-perlevel-bonus-quality=[item=quality-module] Прибавка к качеству за каждый уровень модуля выше первого: 0,01 добавляет 1 процентный пункт шанса. Та же прибавка с минусом применяется к качеству у модулей скорости. 0 убирает только рост по уровням, но не начальные значения.\n[color=#9cdcfe]По умолчанию: 0,01. Диапазон: 0,005–1. После перезапуска игры.[/color]
bobmods-modules-perlevel-bonus-speed=[item=speed-module] Прибавка скорости для модулей скорости за каждый уровень выше первого. Например, 0,1 добавляет к эффекту 10 процентных пунктов за уровень. 0 отключает только этот рост; начальный бонус сохраняется.\n[color=#9cdcfe]По умолчанию: 0,2. Диапазон: 0,01–1. После перезапуска игры.[/color]
bobmods-modules-perlevel-penalty-consumption=[item=speed-module] Коэффициент роста энергозатрат модулей. У модулей скорости он умножается на уровень, у продуктивных — на удвоенное число уровней после первого; 0,1 означает 10% до этого умножения. 0 убирает надбавку, но начальный штраф остаётся.\n[color=#9cdcfe]По умолчанию: 0,1. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-perlevel-penalty-pollution=[item=productivity-module] Рост дополнительного загрязнения от модулей продуктивности за каждый уровень выше первого. 0,1 добавляет 10 процентных пунктов выбросов за уровень. 0 убирает только этот рост, оставляя начальную прибавку.\n[color=#9cdcfe]По умолчанию: 0,15. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-perlevel-penalty-speed=[item=productivity-module] Дополнительное замедление модулей продуктивности за каждый уровень выше первого. При 0,1 каждый такой уровень добавляет штраф 10 процентных пунктов к скорости. 0 убирает этот рост, но не начальный штраф.\n[color=#9cdcfe]По умолчанию: 0,05. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-start-bonus-consumption=[item=efficiency-module] Начальный бонус снижения энергопотребления для модулей эффективности. Значения указаны в долях: 0,1 означает 10%. Модули выше первого уровня дополнительно получают прибавку за уровень; 0 убирает только начальный бонус.\n[color=#9cdcfe]По умолчанию: 0. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-start-bonus-pollution=[item=assembling-machine-2] Начальный бонус снижения загрязнения для модулей очистки. Значения указаны в долях: 0,1 означает 10%. Модули выше первого уровня дополнительно получают прибавку за уровень; 0 убирает только начальный бонус.\n[color=#9cdcfe]По умолчанию: 0. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-start-bonus-pollutioncreate=[item=assembling-machine-2] Начальный бонус увеличения загрязнения для модулей загрязнения. Значения указаны в долях: 0,1 означает 10%. Модули выше первого уровня дополнительно получают прибавку за уровень; 0 убирает только начальный бонус.\n[color=#9cdcfe]По умолчанию: 0. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-start-bonus-productivity=[item=productivity-module] Начальный бонус продуктивности для модулей продуктивности. Значения указаны в долях: 0,1 означает 10%. Модули выше первого уровня дополнительно получают прибавку за уровень; 0 убирает только начальный бонус.\n[color=#9cdcfe]По умолчанию: 0. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-start-bonus-quality=[item=quality-module] Начальный эффект модулей качества: 0,01 соответствует 1% шанса повышения качества продукции. У модулей скорости это же значение задаёт штраф к качеству. Старшие уровни добавляют коэффициент за уровень; 0 убирает только начальную часть.\n[color=#9cdcfe]По умолчанию: 0,01. Диапазон: 0,005–1. После перезапуска игры.[/color]
bobmods-modules-start-bonus-speed=[item=speed-module] Начальный бонус скорости для модулей скорости. Значения указаны в долях: 0,1 означает 10%. Модули выше первого уровня дополнительно получают прибавку за уровень; 0 убирает только начальный бонус.\n[color=#9cdcfe]По умолчанию: 0. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-start-penalty-consumption=[item=speed-module] Начальная прибавка к энергопотреблению от модулей скорости и продуктивности. 0,1 означает +10% от базовых энергозатрат. Даже при 0 у модулей может остаться отдельная надбавка по уровню: это не полное отключение расхода энергии.\n[color=#9cdcfe]По умолчанию: 0. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-start-penalty-pollution=[item=productivity-module] Начальная прибавка к загрязнению машин от модулей продуктивности. 0,1 означает +10% к базовому загрязнению. 0 снимает начальную прибавку, но не отдельный штраф за уровень; больший штраф означает больше выбросов, а не лучшее очищение.\n[color=#9cdcfe]По умолчанию: 0. Диапазон: 0–1. После перезапуска игры.[/color]
bobmods-modules-start-penalty-speed=[item=productivity-module] Начальное снижение скорости у модулей продуктивности и качества. Значения в долях: 0,1 означает замедление на 10% от базовой скорости. 0 снимает эту начальную часть штрафа; отдельный рост штрафа по уровням продуктивности остаётся.\n[color=#9cdcfe]По умолчанию: 0,2. Диапазон: 0–1. После перезапуска игры.[/color]
