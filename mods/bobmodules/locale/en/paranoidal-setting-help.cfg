[mod-setting-description]
bobmods-modules-perlevel-bonus-consumption=[item=efficiency-module] Additional energy-use reduction for efficiency modules for each tier above tier 1. For example, 0.1 adds 10 percentage points per tier. A value of 0 stops only this growth; the starting bonus remains.\n[color=#9cdcfe]Default: 0.1. Range: 0.01–1. Requires a game restart.[/color]
bobmods-modules-perlevel-bonus-pollution=[item=assembling-machine-2] Additional pollution reduction for pollution-cleaning modules for each tier above tier 1. For example, 0.1 adds 10 percentage points per tier. A value of 0 stops only this growth; the starting bonus remains.\n[color=#9cdcfe]Default: 0.15. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-perlevel-bonus-pollutioncreate=[item=assembling-machine-2] Additional pollution increase for pollution-producing modules for each tier above tier 1. For example, 0.1 adds 10 percentage points per tier. A value of 0 stops only this growth; the starting bonus remains.\n[color=#9cdcfe]Default: 0.5. Range: 0.01–1. Requires a game restart.[/color]
bobmods-modules-perlevel-bonus-productivity=[item=productivity-module] Additional productivity for productivity modules for each tier above tier 1. For example, 0.1 adds 10 percentage points per tier. A value of 0 stops only this growth; the starting bonus remains.\n[color=#9cdcfe]Default: 0.05. Range: 0.01–1. Requires a game restart.[/color]
bobmods-modules-perlevel-bonus-quality=[item=quality-module] Quality increase for each module tier above tier 1: 0.01 adds 1 percentage point of upgrade chance. Speed modules receive the same per-tier amount as a quality penalty. A value of 0 removes tier growth, not the starting effects.\n[color=#9cdcfe]Default: 0.01. Range: 0.005–1. Requires a game restart.[/color]
bobmods-modules-perlevel-bonus-speed=[item=speed-module] Additional speed for speed modules for each tier above tier 1. For example, 0.1 adds 10 percentage points per tier. A value of 0 stops only this growth; the starting bonus remains.\n[color=#9cdcfe]Default: 0.2. Range: 0.01–1. Requires a game restart.[/color]
bobmods-modules-perlevel-penalty-consumption=[item=speed-module] Module energy-use growth coefficient. Speed modules multiply it by their tier; productivity modules by twice the number of tiers above tier 1. A value of 0.1 means 10% before that multiplication. Zero removes this component, not the starting penalty.\n[color=#9cdcfe]Default: 0.1. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-perlevel-penalty-pollution=[item=productivity-module] Growth in additional pollution from productivity modules for each tier above tier 1. A value of 0.1 adds 10 percentage points of emissions per tier. A value of 0 removes only this growth, leaving the starting increase.\n[color=#9cdcfe]Default: 0.15. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-perlevel-penalty-speed=[item=productivity-module] Additional productivity-module slowdown for each tier above tier 1. With 0.1, each such tier adds a 10-percentage-point speed penalty. A value of 0 removes this growth, not the starting penalty.\n[color=#9cdcfe]Default: 0.05. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-start-bonus-consumption=[item=efficiency-module] Starting energy-use reduction bonus for efficiency modules. Values are fractions: 0.1 means 10%. Higher-tier modules also receive the per-tier addition; 0 removes only the starting bonus.\n[color=#9cdcfe]Default: 0. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-start-bonus-pollution=[item=assembling-machine-2] Starting pollution reduction bonus for pollution-cleaning modules. Values are fractions: 0.1 means 10%. Higher-tier modules also receive the per-tier addition; 0 removes only the starting bonus.\n[color=#9cdcfe]Default: 0. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-start-bonus-pollutioncreate=[item=assembling-machine-2] Starting pollution increase bonus for pollution-producing modules. Values are fractions: 0.1 means 10%. Higher-tier modules also receive the per-tier addition; 0 removes only the starting bonus.\n[color=#9cdcfe]Default: 0. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-start-bonus-productivity=[item=productivity-module] Starting productivity bonus for productivity modules. Values are fractions: 0.1 means 10%. Higher-tier modules also receive the per-tier addition; 0 removes only the starting bonus.\n[color=#9cdcfe]Default: 0. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-start-bonus-quality=[item=quality-module] Starting quality-module effect: 0.01 means a 1% product-quality upgrade chance. The same amount becomes a quality penalty on speed modules. Higher tiers add the per-tier coefficient; 0 removes only the starting component.\n[color=#9cdcfe]Default: 0.01. Range: 0.005–1. Requires a game restart.[/color]
bobmods-modules-start-bonus-speed=[item=speed-module] Starting speed bonus for speed modules. Values are fractions: 0.1 means 10%. Higher-tier modules also receive the per-tier addition; 0 removes only the starting bonus.\n[color=#9cdcfe]Default: 0. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-start-penalty-consumption=[item=speed-module] Starting energy-use increase from speed and productivity modules. A value of 0.1 means +10% of base energy use. Even with 0, modules may retain their separate tier-based increase; this does not remove all energy consumption.\n[color=#9cdcfe]Default: 0. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-start-penalty-pollution=[item=productivity-module] Starting machine-pollution increase from productivity modules. A value of 0.1 means +10% of base pollution. A value of 0 removes the starting increase, not the separate tier penalty; larger penalties mean more emissions, not better cleaning.\n[color=#9cdcfe]Default: 0. Range: 0–1. Requires a game restart.[/color]
bobmods-modules-start-penalty-speed=[item=productivity-module] Starting speed reduction for productivity and quality modules. Values are fractions: 0.1 means a 10% reduction from base speed. A value of 0 removes this starting component; productivity modules may still have a separate per-tier penalty.\n[color=#9cdcfe]Default: 0.2. Range: 0–1. Requires a game restart.[/color]
