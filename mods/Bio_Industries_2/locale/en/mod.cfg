[mod-setting-description]
BI_Bio_Cannon=[img=utility/shoot_cursor_green] Enables the Bio Industries prototype artillery and its ammunition. It targets enemy spawners and worms, not mobile biter groups. This does not give the player a finished gun.
BI_Bio_Fuel=[item=solid-fuel] Enables additional Bio Industries chains for converting biomass into fuels and chemical products, with their machines and technologies. It does not disable tree farming or basic fertilizer production.
# Added for 0.18.32/1.1.2
BI_Easy_Bio_Gardens=[entity=bi-bio-garden] Bio gardens consume ready-made fluid fertilizer, so just one pipeline is enough to supply all ingredients. However, this requires 50% more fertilizer than combining solid fertilizer and water on site.\nBio gardens will transmit electricity to adjacent Bio gardens. Arrange them on a grid, with no more than 1 tile between 2 Bio gardens, and they will be magically connected. :-)\n(Default: off)
# Added for 1.1.8
BI_Bigger_Wooden_Chests=[item=wooden-chest] Adds three larger Bio Industries wooden chests and their recipes. The regular wooden chest is not replaced; the new variants still have to be crafted.
#~ BI_Enable_gvv_support=The "Lua API global Variable Viewer" (gvv) allows you to inspect the global table of other mods. If you want to help debugging "Bio Industries", enable this and type "\gvv" at the chat console to open the GUI of gvv.\n(Default: off)
BI_Enable_gvv_support=The "Lua API global Variable Viewer" (gvv) allows you to inspect the global table of other mods. If you want to help debugging "Bio Industries", enable this and type "\gvv" at the chat console to open the GUI!\n(Default: off)
BI_Game_Tweaks_Bot=[item=construction-robot][item=logistic-robot] Makes construction and logistic robots unmineable and fully resistant to fire damage. They are not invulnerable: other damage can still affect them.
BI_Game_Tweaks_Disassemble=Allow some disassemble recipes. You get about 50% of the resources back.\n(Default: on)
BI_Game_Tweaks_Emissions_Multiplier=[item=coal] Sets fuel-specific pollution multipliers when burned: for example coal 200%, wood 160% and solid fuel 100%. It does not change their energy content; other mods may set the final values.
BI_Game_Tweaks_Player=[img=utility/character_reach_distance_modifier_icon] For the default character and compatible skins, raises building, interaction and item-drop distances to at least 20 tiles; item pickup and resource reach to 6; and loot pickup to 5. Higher existing values are not reduced. Running speed is unchanged.
BI_Game_Tweaks_Production_Science=[item=production-science-pack] In this modpack, this checkbox does not control the alternative production science pack recipe: the Paranoidal integration adds it independently of the setting. Turning it off does not remove that recipe.
#~ BI_Game_Tweaks_Recipe=Recipes Affected: CONCRETE Remove: Iron Ore Add: Iron Stick, STONE-WALL Add: Iron Stick, RAILS Remove: stone Add: crushed-stone and Concrete, STEEL-AXE Remove: Iron-Stick Add: Iron-Axe
BI_Game_Tweaks_Recipe=[item=iron-stick] Changes base recipes: adds iron sticks instead of iron ore to concrete, adds an iron stick to stone walls, and replaces rail stone with crushed stone when that item exists. Later recipe changes by other mods can override the result.
BI_Game_Tweaks_Small_Tree_Collisionbox=[entity=tree-01] Shrinks the collision boxes of growing trees created by Bio Industries, making them easier to pass. When off, the source trees’ collision boxes are copied. This checkbox does not resize every mature tree on the map; other mods may further alter collisions.
BI_Game_Tweaks_Stack_Size=[item=wood] Enables Bio Industries larger-stack rules: wood, stone and concrete at least 400; crushed stone and slag at least 800. These are intermediate rules: the modpack’s general stack settings and other integrations can choose different final sizes.
BI_Game_Tweaks_Tree=[item=wood] For ordinary trees, replaces a fixed yield of 4 wood when mined with a random yield from 1 to 6. Trees on the Bio Industries exclusion list are skipped. This changes harvesting, not forest growth speed.
#~ BI_Hide_musk_floor_in_mapview=In map view, the electric grid overlay will be hidden for Musk floor if this setting is enabled. This shouldn't be changed in a running game as applying the setting to every Musk floor tile may take some time!
BI_Show_musk_floor_in_mapview=[item=copper-cable] Shows the Bio Industries solar-floor electric grid in map view. Changing it requires restarting the game. Loading a large save after a change may take longer because the mod updates hidden poles for every such floor tile.
BI_Solar_Additions=Enables solar items like the __ENTITY__bi-bio-solar-farm__, __ENTITY__bi-solar-boiler__, __ENTITY__bi-bio-accumulator__ and __ENTITY__bi-large-substation__.\n(Default: on)
