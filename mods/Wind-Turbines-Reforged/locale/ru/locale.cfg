[entity-description]
texugo-wind-turbine=Выработка зависит от ветра: от штиля до полной мощности, в среднем около 55% (37 кВт). Сама подключается к турбинам и столбам в пределах 6 клеток. Зимой ветер сильнее (×1,33, выработка может превысить полную мощность), летом слабее (×0,9). Нажмите на турбину, чтобы увидеть скорость ветра.
texugo-wind-turbine2=Выработка зависит от ветра: от штиля до полной мощности, в среднем около 55% (370 кВт). Сама подключается к турбинам и столбам в пределах 11 клеток. Зимой ветер сильнее (×1,33, выработка может превысить полную мощность), летом слабее (×0,9). Нажмите на турбину, чтобы увидеть скорость ветра.
texugo-wind-turbine3=Выработка зависит от ветра: от штиля до полной мощности, в среднем около 55% (3,7 МВт). Сама подключается к турбинам и столбам в пределах 18 клеток. Зимой ветер сильнее (×1,33, выработка может превысить полную мощность), летом слабее (×0,9). Нажмите на турбину, чтобы увидеть скорость ветра.

