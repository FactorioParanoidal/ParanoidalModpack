moshine-briefing=Moshine briefing

[tips-and-tricks-item-description]
moshine-briefing=[planet=moshine] is a hot volcanic planet, abundant in [item=moshine-quartz-sand] (that will unlock [item=silicon] and [item=moshine-glass]) and [item=neodymium] (a good base to make [item=magnet]). It's so hot that it's hard to build an [entity=accumulator], but fortunately, hot [entity=steam-geyser] are found all over. It is advised to bring at least a [entity=foundry] to be able transform [fluid=molten-iron] from iron lakes. Make [fluid=angels-gas-methane] from [item=moshine-quartz-sand], [item=sulfur] and [item=coal].

[description]
equation_to_solved_equation_description=Feed [item=datacell-equation][font=moshine-data][color=#2685e5]equation.data[/color][/font] to a [entity=processing-grid]compute farm surrounded by lots of [tile=webbed_processor_tile]webbed processors to eventually output [item=datacell-solved-equation][font=moshine-data][color=#fbff6b]solved_equation.data[/color][/font].
equation_to_solved_equation_description_nocolor=Feed [item=datacell-equation]equation.data to a [entity=processing-grid]compute farm surrounded by lots of [tile=webbed_processor_tile]webbed processors to eventually output [item=datacell-solved-equation]solved_equation.data.

