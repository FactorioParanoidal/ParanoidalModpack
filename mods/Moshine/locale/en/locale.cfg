[technology-description]
planet-discovery-moshine=A very sunny planet, rich with neodymium, silica and solar power. Some mysterious crashed probes contain plentiful knowledge that we could use to advance the bounds of artificial intelligence.
moshine-concrete-from-molten-iron-and-sand=Make concrete from molten iron and silica.
moshine-petroleum-from-sand-sulfur-steam-carbon=Make petroleum gas with silica, sulfur and coal
moshine-tech-silicon=Allows you to convert silica into crystallite.
moshine-tech-glass=Smelting silica creates obsidian.
moshine-tech-silicon-cell=Silicon cells are an essential parts of computers.
moshine-tech-silicon-carbide=Carborundum is used as a powerful insulator.
moshine-tech-magnet=Process neodymium and iron into powerful magnets. Neodymium is a very rare metal, but it's usually found in very large quantities.
moshine-tech-datacell-empty=Allows data processing and storing data in cells.
moshine-tech-data-processor-building=The data processor transforms data and handles data-related tasks.
moshine-tech-neural_computer=The Neural computer finds new knowledge by processing huge quantities of information.
moshine-tech-data-extractor=Allows you to retrieve and understand data from crashed probes on Moshine.
moshine-tech-3d-data-storage=Holographic cores are the optimal way to host a complex AI model, and later train it.
moshine-tech-data-processor=Allows you to produce complex artificial intelligence, but beware: its first form is explosive.
moshine-tech-ai-trainer=AI models can be optimized by learning from themselves, to then reach unseen levels of research.
moshine-tech-ai-tier=Training of exponentially more potent AI cores.
moshine-tech-processing-grid=Processes extremely complex operations.
tech-space-trains=Magnetic trains with bigger cargo and express speed.
minimalist-rails=More resistant rails that transmit power, made from Moshine's minerals.
minimalist-elevated-rails=Elevated version of neodymium rails.
moshine-tech-cosmicscanner=Scan the far universe. The response from the powerful signal it sends can give us many data about the universe and how it works.
moshine-tech-cosmic-data-outsignal-creation=When you eventually build the [entity=moshine_cosmicscanner], you will need to create a complex signal with precise coordinates to hope to record some useful data.
moshine-tech-cosmicscanner-construction1=Begins the project of the [entity=moshine_cosmicscanner], a gigantic power-hungry space megastructure that sends signal rays in outer space and collects [font=moshine-data][color=#8086ff]cosmos.data[/color][/font].
moshine-tech-cosmicscanner-construction1_nocolor=Begins the project of the [entity=moshine_cosmicscanner], a gigantic power-hungry space megastructure that sends signal rays in outer space and collects cosmos.data.
moshine-tech-opticalfiber-storage-tank=Allows data to be stored in a data server.

