[technology-description]
moshine-tech-silicon=Позволяет превращать кремнезём в кристаллит.
moshine-tech-glass=Плавление кремнезёма даёт обсидиан.
moshine-tech-silicon-cell=Неотъемлимая часть компьютеров.
moshine-tech-silicon-carbide=Карборунд можно использовать в качестве мощного изолятора.
moshine-tech-magnet=Переработка неодима и железа в мощные магниты.
moshine-tech-datacell-empty=Позволяет обрабатывать и хранить данные в ячейках.
moshine-tech-neural_computer=Нейрокомпьютер открывает новые знания, обрабатывая огромные объемы информации.
moshine-tech-data-extractor=Позволяет извлекать данные из разбившихся на Мошайне зондов.
moshine-tech-3d-data-storage=Голографические ядра идеально подходят для хранения сложной ИИ модели и последующего её обучения.
moshine-tech-data-processor=Позволяет производить сложный искусственный интеллект, однако его первая форма взрывоопасна.
moshine-tech-ai-trainer=Можно оптимизировать ИИ модели, тренируя их на самих себе, чтобы достичь ранее недоступные уровни исследований.
moshine-tech-ai-tier=Тренировка всё более мощных ИИ ядер.
moshine-tech-processing-grid=Выполняет чрезвычайно сложные операции.
tech-space-trains=Магнитные поезда с большей грузоподъёмностью и высокой скоростью.
minimalist-rails=Более прочные, передающие электроэнергию рельсы, сделанные из минералов на Мошайне.
minimalist-elevated-rails=Надземная версия неодимовых рельсов.
moshine-concrete-from-molten-iron-and-sand=Бетон из расплавленного железа и кремнезёма.
moshine-petroleum-from-sand-sulfur-steam-carbon=Метан из кремнезёма, серы, угля и пара.
moshine-tech-data-processor-building=Обработчик данных преобразует данные и выполняет связанные с ними задачи.
moshine-tech-cosmicscanner=Сканирует дальний космос. Ответ на его мощный сигнал даёт много данных о Вселенной и её устройстве.
moshine-tech-cosmic-data-outsignal-creation=Когда вы построите [entity=moshine_cosmicscanner], понадобится сложный сигнал с точными координатами, чтобы записать полезные данные.
moshine-tech-cosmicscanner-construction1=Начало проекта [entity=moshine_cosmicscanner] — гигантской энергоёмкой космической мегаструктуры, которая посылает сигнальные лучи в открытый космос и собирает данные космоса.
moshine-tech-cosmicscanner-construction1_nocolor=Начало проекта [entity=moshine_cosmicscanner] — гигантской энергоёмкой космической мегаструктуры, которая посылает сигнальные лучи в открытый космос и собирает данные космоса.
moshine-tech-opticalfiber-storage-tank=Позволяет хранить данные на сервере данных.

