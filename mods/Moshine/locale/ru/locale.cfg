[tips-and-tricks-item-description]
moshine-briefing=[planet=moshine] — жаркая вулканическая планета. Здесь много кремнезёма [item=moshine-quartz-sand] (из него делают кристаллит [item=silicon] и обсидиан [item=moshine-glass]) и неодима [item=neodymium] (из него делают магниты [item=magnet]). Из-за жары аккумуляторы [entity=accumulator] здесь не построить, зато повсюду горячие паровые гейзеры [entity=steam-geyser]. Возьмите с собой хотя бы одну литейную [entity=foundry], чтобы перерабатывать расплавленное железо [fluid=molten-iron] из железных озёр. Метан [fluid=angels-gas-methane] получают из кремнезёма, серы и угля.

