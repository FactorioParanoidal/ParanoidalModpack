[recipe-description]
model-unstable=Эти промежуточные ядра, если не обработаны, взорвутся через 30 секунд.
datacell-equation=Поиск и сохранение вычислений, слишком сложных для базового компьютера.
ai-tier-0=Каждый новый уровень ИИ в разы превосходит предыдущий, значительно ускоряя вычисления. Уровень 10 - предел возможностей небиологических вычислений.
