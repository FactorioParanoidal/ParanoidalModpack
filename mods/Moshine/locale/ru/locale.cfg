[mod-name]
Moshine=Moshine (Мошайн)

[mod-description]
Moshine=Планета Мошайн — жаркая пустыня после Вулкана и Фульгоры, где развивают искусственный интеллект.\n\n— Смешанные руды дают кремнезём, неодим, серу, уголь и медную руду; есть паровые гейзеры и лава, а аккумуляторы от жары не работают.\n— Из разрушенных фульгорских лабораторий добывают данные; ячейки данных — наука нейрокомпьютера.\n— Ядра ИИ ускоряют компьютеры Мошайна и в другие машины не вставляются.\n\nВ Paranoidal открывается только после ракеты и до неё ничего не меняет. Кремнезём, кристаллит, карборунд и обсидиан — свои материалы планеты, а не домашние песок, кремний, карбид кремния и стекло.

