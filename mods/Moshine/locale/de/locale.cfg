[technology-description]
planet-discovery-moshine=Ein sehr sonniger Planet, reich an Neodym, Silizium und Solarenergie. Einige mysteriöse abgestürzte Sonden enthalten umfangreiches Wissen, das wir nutzen könnten, um die Grenzen der künstlichen Intelligenz zu erweitern.
moshine-concrete-from-molten-iron-and-sand=Beton aus geschmolzenem Eisen und Sand herstellen
moshine-petroleum-from-sand-sulfur-steam-carbon=Flüssiggas aus Sand, Schwefel und Kohle herstellen
moshine-tech-silicon=Ermöglicht die Umwandlung von Sand in Silizium.
moshine-tech-glass=Durch das Schmelzen von Sand entsteht Glas.
moshine-tech-silicon-cell=Siliziumzellen sind ein wesentlicher Bestandteil von Computern.
moshine-tech-silicon-carbide=Siliziumkarbid wird als leistungsstarker Isolator verwendet.
moshine-tech-magnet=Verarbeitung von Neodym und Eisen zu leistungsstarken Magneten.
moshine-tech-datacell-empty=Ermöglicht die Datenverarbeitung und -speicherung in Zellen.
moshine-tech-data-processor-building=Der Datenprozessor transformiert Daten und erledigt datenbezogene Aufgaben.
moshine-tech-neural_computer=Der neuronale Computer findet neues Wissen, indem er riesige Mengen an Informationen verarbeitet.
moshine-tech-data-extractor=Ermöglicht es Ihnen, Daten von abgestürzten Sonden auf Moshine abzurufen.
moshine-tech-3d-data-storage=Holografische Speicher sind die optimale Lösung, um ein komplexes KI-Modell zu unterbringen und später zu trainieren.
moshine-tech-data-processor=Ermöglicht die Erzeugung komplexer künstlicher Intelligenz, aber Vorsicht: Die erste Form ist explosiv!
moshine-tech-ai-trainer=KI-Modelle können durch Selbstlernen optimiert werden, um dann bisher ungekannte Forschungsniveaus zu erreichen.
moshine-tech-ai-tier=Training von exponentiell leistungsfähigeren KI-Kernen.
moshine-tech-processing-grid=Verarbeitet extrem komplexe Vorgänge.
tech-space-trains=Magnetzüge mit größerer Ladekapazität und höherer Geschwindigkeit.
minimalist-rails=Widerstandsfähigere Schienen, die Strom übertragen und aus Moshines Mineralien hergestellt werden.
minimalist-elevated-rails=Hochbahnen Version von Neodym-Schienen.
moshine-tech-cosmicscanner=Das ferne Universum scannen. Die Antwort auf das von ihm ausgesendete Signal kann uns zahlreiche Daten über das Universum und seine Funktionsweise liefern.
moshine-tech-cosmic-data-outsignal-creation=Wenn du schließlich den [entity=moshine_cosmicscanner] baust, musst du ein komplexes Signal mit präzisen Koordinaten erzeugen, um hoffentlich nützliche Daten aufzeichnen zu können.
moshine-tech-cosmicscanner-construction1=Startet das Projekt des [entity=moshine_cosmicscanner], einer gigantischen, energieintensiven Weltraum-Megastruktur, die Signalstrahlen in den Weltraum sendet und [font=moshine-data][color=#8086ff]cosmos.data[/color][/font] sammelt.
moshine-tech-cosmicscanner-construction1_nocolor=Startet das Projekt des [entity=moshine_cosmicscanner], einer gigantischen, energieintensiven Weltraum-Megastruktur, die Signalstrahlen in den Weltraum sendet und cosmos.data sammelt.
moshine-tech-opticalfiber-storage-tank=Ermöglicht die Speicherung von Daten auf einem Datenserver.

