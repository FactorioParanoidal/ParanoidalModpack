[tips-and-tricks-item-description]
moshine-briefing=[planet=moshine] ist ein heißer Vulkanplanet, reich an [item=moshine-quartz-sand] (der [item=silicon] und [item=moshine-glass] freischaltet) und [item=neodymium] (eine gute Grundlage für die Herstellung von [item=magnet]). Es ist so heiß, dass es schwierig ist, einen [entity=accumulator] zu bauen, aber glücklicherweise gibt es überall heiße [entity=steam-geyser]. Es wird empfohlen, mindestens eine [entity=foundry] mitzubringen, um [fluid=molten-iron] aus Eisenseen umwandeln zu können. Stellen Sie [fluid=crude-oil] aus der Kohleverflüssigung her.

[description]
