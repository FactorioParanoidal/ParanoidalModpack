[mod-setting-description]
flow-control-new-group=Flow Control creates a separate subgroup for pipes, pumps and pipe fittings. Paranoidal subsequently applies its own recipe-menu layout: fitting and valve recipes receive their assigned row regardless of this checkbox. This setting alone does not determine the modpack's final crafting menu.
flow-control-revert-to-normal-pipe=When picking up T-Junction, elbow or straight pipes, they revert back to normal pipes.
