[mod-setting-description]
research-evolution-factor-ignore-qol=Если включено, исследования технологий с внутренними именами, начинающимися с «qol-» (QoL Research), не повышают эволюцию врагов.
research-evolution-factor-ignore-inf=Если включено, исследования бесконечных технологий не повышают эволюцию врагов. Здесь бесконечными считаются технологии с формулой стоимости и более чем 10 уровнями.

