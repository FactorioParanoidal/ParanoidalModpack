[mod-setting-name]
nearby-ammo-update-per-second=Update frequency
nearby-ammo-display-mode=Display mode
nearby-ammo-color-normal=Normal
nearby-ammo-color-low=Low
nearby-ammo-color-critical=Critical
nearby-ammo-over-altmode=Icons draw over alt-mode
nearby-ammo-only-deficit=Show only turrets short of ammo
nearby-ammo-deficit-percent=Shortage threshold, %

[mod-setting-description]
nearby-ammo-update-per-second=How many times per second each turret counter is refreshed. The work is spread evenly across ticks.
nearby-ammo-display-mode=What to display
nearby-ammo-color-normal=Normal color; set alpha (A) to zero to hide
nearby-ammo-color-low=Low ammo color
nearby-ammo-color-critical=Very low ammo color
nearby-ammo-only-deficit=Hide counters over turrets that inserters have already filled up to their automatic insertion limit. Empty turrets are always shown.
nearby-ammo-deficit-percent=A counter is shown while the turret holds fewer magazines than this percentage of its inserter fill limit. 100% shows it exactly while inserters would still add ammo.


[string-mod-setting]
nearby-ammo-display-mode-shot=Shot count
nearby-ammo-display-mode-magazine=Magazine count
nearby-ammo-display-mode-icon=Icon
nearby-ammo-display-mode-scaled-icon=Icon (scale with urgency)
