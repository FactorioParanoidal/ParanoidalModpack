[entity-name]
flo-long-fire=Огонь
flo-tank-fire=Огонь

[mod-setting-name]
flo-pollution-mult=Загрязнение от сгоревшей жидкости
flo-tank-burn-time=Время перегрева резервуара, с
flo-map-alerts=Оповещения о пожарах

[mod-setting-description]
flo-pollution-mult=Загрязнение, выбрасываемое в чанк на единицу взорвавшейся жидкости: при 1 полный резервуар на 25000 единиц даёт 25000 загрязнения.
flo-tank-burn-time=Сколько горит резервуар с горючей жидкостью до взрыва. Со второй половины срока над ним валит густой чёрный дым. Успейте слить или откачать горючее, чтобы спасти резервуар.
flo-map-alerts=Оповещения на карте и сообщения в чате о пожарах, перегреве резервуаров, детонации боеприпасов и утечках ядовитых газов: что загорелось и от чего.

[achievement-name]
flo-fuse=Бикфордов шнур
flo-catastrophe=Гриб над нефтебазой
flo-tank-saved=Пожарный расчёт
flo-cookoff=Салют
flo-trap=Наследство предков
flo-smog=Не дыши

[achievement-description]
flo-fuse=Увидеть, как огонь пробежал по 100 трубам подряд. Красиво. Дорого. Ваше.
flo-catastrophe=Оказаться рядом, когда перегретый резервуар взлетит на воздух. Вид из первого ряда, билет в один конец.
flo-tank-saved=Слить горящий резервуар до взрыва. Пожарные аплодируют, страховщики выдыхают.
flo-cookoff=Оказаться рядом со складом боеприпасов, сдетонировавшим 50 раз. Новогодний салют, только без Нового года.
flo-trap=Разбудить старую нефтяную ловушку в руинах. Предки оставили вам наследство. Горящее.
flo-smog=Оказаться рядом со взрывом, выбросившим не меньше 20000 загрязнения. Жуки уже собираются на разбор полётов.

[flo-alert]
fire=Загорелось: __1__. Причина: __2__
tank=__1__ горит! Слейте горючее за __2__ с
tank-chat=[color=orange]Загорелся резервуар «__1__» (__2__). Слейте или откачайте горючее за __3__ с, иначе он взорвётся![/color]
tank-smoke=[color=red]Над горящим резервуаром валит чёрный дым: до взрыва __1__ с![/color]
tank-saved=[color=green]__1__: пожар потушен, резервуар спасён.[/color]
catastrophe=[color=red]Взрыв: __1__![/color]
cookoff=Детонируют боеприпасы: __1__!
toxic=Утечка ядовитого газа: __1__!
trap=В руинах тлеет труба...
unknown=Что-то

