[mod-setting-description]
valves-graphics=Внешний вид сбрасывающего, подкачивающего и одностороннего клапанов. Artisanal Reskins — клапаны Angels с цветной меткой, как в прежних версиях Paranoidal (нужен reskins-angels). Классический — анимированные клапаны этого мода.
valves-pump-speed=Объём жидкости, перекачиваемый каждую секунду при открытом клапане. Применяется ко всем клапанам, добавленным этим модом.
valves-default-threshold-top_up=Порог по умолчанию при установке нового клапана. Его можно изменить после размещения.
valves-default-threshold-overflow=Порог по умолчанию при установке нового клапана. Его можно изменить после размещения.

[string-mod-setting]
valves-graphics-reskins=Artisanal Reskins (как у Angels)
valves-graphics-classic=Классический (анимированный)

[valves]
valve-shortcuts=\n\n[font=default-bold]Горячие клавиши:[/font]\n__CONTROL__valves-threshold-plus__ Увеличить порог\n__CONTROL__valves-threshold-minus__ Уменьшить порог
threshold-settings=\n\n[color=0.5,0.8,0.94]Пороги по умолчанию можно задать в настройках запуска.[/color]
more-in-factoriopedia=Дополнительная информация в Факториопедии.
configuration-doesnt-support-thresholds=Односторонний клапан не поддерживает пороговые значения
flying-warning-bad-connection=Невозможно подключить выход клапана ко входу насоса

factoriopedia-bad-connections=\n\n[font=default-bold]Ограничение при подключении к насосам:[/font]\nВыход клапана не может быть подключен ко входу насоса. Из-за ограничения игрового движка насос будет обходить клапан. Вы можете проверить неправильные подключения в любой момент с помощью команды [color=0.5,0.8,0.94]/valves-find-bad-connections[/color].
warn-command-help=Находит и выводит все случаи, когда выход клапана подключен ко входу насоса. Такая конфигурация не поддерживается. Для получения дополнительной информации смотрите Factoriopedia или страницу мода.
warn-all-found-none=Неправильные подключения клапанов не найдены.
warn-all-found=Найдено неправильных подключений: __1__
warn-found-at=__1__ в __2__
warn-all-found-extended=[color=red]Внимание![/color] Найдено __1__ неправильных подключений клапанов с насосами. Подробнее смотрите в Factoriopedia или на странице мода.
warn-show-again=Проверить неправильные подключения клапанов можно в любое время с помощью команды: /valves-find-bad-connections

