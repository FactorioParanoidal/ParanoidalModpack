[mod-name]
valves=Valves (Клапаны)

[mod-description]
valves=Клапаны для трубопроводов.\n\n— Перепускной клапан: пропускает жидкость дальше, только когда до него трубопровод заполнен выше порога (например, чтобы сначала наполнить важного потребителя).\n— Подкачивающий клапан: доливает, пока дальше по трубе меньше порога.\n— Обратный клапан: жидкость течёт только в одну сторону.\n\nПороги меняются горячими клавишами на клапане (по умолчанию Num+ и Num−). Открываются технологией «Управление потоками в трубах».
