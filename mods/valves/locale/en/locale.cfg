[mod-setting-name]
valves-graphics=Valve look
valves-pump-speed=Valve pumping speed
valves-default-threshold-top_up=Default Top up valve threshold
valves-default-threshold-overflow=Default Overflow valve threshold

[mod-setting-description]
valves-graphics=Look of the overflow, top-up and one-way valves. Artisanal Reskins: Angel's valves with a coloured mask, as in earlier Paranoidal versions (needs reskins-angels). Classic: the animated valves of this mod.
valves-pump-speed=The amount of fluid to pump every second when the valve is open. Applies to all valves added by this mod: overflow, top-up and one-way. Will be capped to the maximum fluid flow defined by the utility constant `max_fluid_flow`.
valves-default-threshold-top_up=The default threshold when placing a new valve. It can be adjusted after placement.
valves-default-threshold-overflow=The default threshold when placing a new valve. It can be adjusted after placement.

[string-mod-setting]
valves-graphics-reskins=Artisanal Reskins (Angel's)
valves-graphics-classic=Classic (animated)

[valves]
valve-shortcuts=\n\n[font=default-bold]Shortcuts (configurable):[/font]\n__CONTROL__valves-threshold-plus__ Increase threshold\n__CONTROL__valves-threshold-minus__ Decrease threshold
threshold-settings=\n[color=0.5,0.8,0.94]Default thresholds can be set in startup settings.[/color]
more-in-factoriopedia=More information in Factoriopedia.
configuration-doesnt-support-thresholds=One-way valve doesn't support thresholds
flying-warning-bad-connection=Cannot connect valve output to pump input

factoriopedia-bad-connections=\n\n[font=default-bold]Limitation when connected to pumps:[/font]\nA valve's output cannot be connected to a pump's input. Due to a game engine limitation the pump will bypass the valve. You can check for bad connections at any point using the command [color=0.5,0.8,0.94]/valves-find-bad-connections[/color].
warn-command-help=Find and print all instances of valves with their output connected to a pump input. This configuration is not supported. For more information see Factoriopedia or the modpage.
warn-all-found-none=No bad valve connections found.
warn-all-found=Found __1__ bad connection(s):
warn-found-at=__1__ at __2__
warn-all-found-extended=[color=red]Warning![/color] Detected __1__ bad valve connection(s) with pump(s). See Factoriopedia or modpage for more info.
warn-show-again=Check for bad valve connections anytime with: /valves-find-bad-connections

[controls]
valves-threshold-plus=Increment valve threshold
valves-threshold-minus=Decrement valve threshold

[controls-description]
valves-threshold-plus=Adjusts the threshold used for overflow or topup valves.
valves-threshold-minus=Adjusts the threshold used for overflow or topup valves.
