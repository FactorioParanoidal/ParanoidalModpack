[mod-setting-description]
prain-enabled=Turns the weather and all its effects on or off.
prain-allowed-surfaces=Internal surface or planet names, separated by commas. Space platforms never get rain.
prain-wet-min-minutes=Shortest rain, in real minutes.
prain-wet-max-minutes=Longest rain, in real minutes.
prain-wet-power=1 — every length is equally likely; above 1 — short rains are more common; below 1 — long ones.
prain-dry-mean-minutes=Mean time between rains, in real minutes. Lower means more rain.
prain-first-dry-minutes=A new map (or a save that just got the mod) stays dry at least this long, so the start is not rained off.
prain-seasons=With NightBrightness seasons enabled and surface daytime not frozen: no winter rain; one 10% rain attempt per summer; spring and fall are normal, and fall rain ends before winter. Without usable NightBrightness seasons or with frozen daytime, seasonal restrictions do not apply and rain is possible year-round.
prain-storm-stages=A rain grows from drizzle to heavy rain, thunderstorm or monsoon and calms down again. Off: every rain is a normal one.
prain-monsoon-chance=Chance to choose the monsoon stage sequence for a rain spell. Used only when storm stages are enabled; otherwise this setting has no effect.
prain-intensity=How many drops fall. More drops cost more performance.
prain-max-drops-per-tick=Upper limit of drops per tick for all players together. When it is reached (far zoom, many players) the rain gets thinner instead of slowing the game.
prain-wind-strength=0 — drops fall straight; higher values bring more slanted rain and gusts.
prain-splashes=Splashes on the ground and ripples on water.
prain-post-rain=Ripples in puddles for a minute or two after the rain.
prain-rain-volume=Rain-loop volume from 0 to 1; final volume also depends on rain strength and stage. Also scales wind-gust sounds.
prain-thunder-sound=Thunder sounds.
prain-thunder-volume=From 0 to 1.
prain-thunder-layering=Close thunder rolls on for a while.
prain-lightning-flash=Lightning lights the area up for a moment.
prain-min-thunder-chance=Thunder-activity parameter at the cycle’s calm phases. Event rate also depends on generated chunk count, darkness and weather stage. This is not the lightning-strike probability, which is configured separately.
prain-max-thunder-chance=Thunder-activity parameter at the cycle’s peaks. Event rate also depends on generated chunk count, darkness and weather stage. This is not the lightning-strike probability, which is configured separately.
prain-lightning-strike-chance=Chance of a real strike per thunder event within 120 tiles of a player; farther away, one tenth of this value is checked. Starting protection applies separately. A strike can drain its target, brown out a pole’s network, stop a radar temporarily, destroy robots, harm creatures and ignite combustible objects or fluids. Destructive effects are disabled when the main surface is peaceful or was generated without enemy bases. At 0 there are no real strikes, but ordinary thunder and flashes remain.
prain-lightning-chain=A strike jumps on through nearby robots, creatures and poles.
prain-lightning-protection-minutes=Starting protection period in game minutes from the map’s beginning, not from joining or adding the mod. Until it expires, characters are protected from lightning damage and thunder-strike seed points within 18 tiles of players are rejected. This is not permanent protection for every nearby building.
prain-solar-percent=Share of the usual solar power while it rains.\n-1 — no change.
prain-pollution-cleanup-per-minute=Pollution removed from every chunk per minute of rain. 0 — off.
prain-pollution-chunks-per-tick=Base maximum chunks processed per tick for pollution washout on each raining surface. Lower values reduce load but make cleanup less even on large maps. Surface-specific weather options can override this limit.
prain-fire-quench=Rain slowly puts ordinary fires out from the edges, with steam. Lightning fires and burning flammable fluids are not put out by rain (only fire safety turrets help), they only develop slower.
prain-fire-quench-seconds=How long a big fire lasts in the rain. Smaller fires go out sooner.
prain-enemy-fire-acid-damage=Fire and acid damage of enemies (spit, burning and acid puddles) while it rains, in % of the normal. 0 — harmless.
prain-player-fire-damage=Fire damage of flamethrowers, flamethrower turrets and wagons while it rains, in % of the normal.
prain-hazard-slowdown=How many times slower burning storage tanks count down, fire runs through pipes and ammunition cooks off while it rains (Paranoidal Flammable Fluids).
prain-enemy-day-percent=While it rains, enemy bites and spits deal this many percent more damage by day. Enemy fire and acid have their own setting.
prain-enemy-night-percent=Night bonus to the enemy force’s bite and spit damage modifiers, in percent. A raining surface counts as night at darkness 0.4 or above. With rain on several surfaces, the largest applicable day or night bonus is used and affects the enemy force on every surface. If more frequent attacks are enabled, the same bonus reduces the map-wide pollution cost per attack.
prain-enemy-more-attacks=While a rain-enabled surface is wet, reduces the map-wide pollution cost per attack by dividing it by 1 + B/100, where B is the active day or night enemy bonus. A 25% bonus reduces the cost by 20%, not 25%; attacks may become more frequent. With rain on several surfaces, the largest applicable bonus is used. Changes a map-wide parameter.
prain-screen-flash=The screen briefly whitens from a close lightning. The darker sky of a storm stays.
prain-show-rain=Draw the rain around you. The rain sound and the effects stay.
