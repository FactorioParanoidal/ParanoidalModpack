[mod-name]
paranoidal-rain=Paranoidal Rain

[mod-description]
paranoidal-rain=Weather for Nauvis: rain in stages from drizzle to monsoon, a seamless rain sound, thunder and lightning strikes. Rain dims solar power, washes pollution out, slowly puts fires out, takes the bite out of enemy fire and acid, halves flamethrowers and slows burning fluids and ammunition cook-off down.

[entity-name]
prain-lightning-fire=Lightning fire
prain-pollution-cleaner=Rain
prain-lightning-load=Lightning surge

[entity-description]
prain-pollution-cleaner=Washes pollution out of the air while it rains.
prain-lightning-load=Overloads the electric network for a moment after lightning strikes a pole.

[technology-name]
prain-weather-forecast=Weather forecast

[technology-description]
prain-weather-forecast=The radar network watches the cyclones. At dawn of the first and of the middle day of every season a forecast for the next days arrives. The more working radars and the better they are, the less the forecast lies: 1 radar - 10 %, 10 - 50 %, 100 - 100 % truth. When it is wrong, it promises what will certainly not happen.

