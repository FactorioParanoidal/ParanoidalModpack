[mod-setting-description]
prain-enabled=Turns the weather and all its effects on or off.
prain-allowed-surfaces=Internal surface or planet names, separated by commas. Space platforms never get rain.
prain-wet-min-minutes=Shortest rain, in real minutes.
prain-wet-max-minutes=Longest rain, in real minutes.
prain-wet-power=1 — every length is equally likely; above 1 — short rains are more common; below 1 — long ones.
prain-dry-mean-minutes=Mean time between rains, in real minutes. Lower means more rain.
prain-first-dry-minutes=A new map (or a save that just got the mod) stays dry at least this long, so the start is not rained off.
prain-seasons=NightBrightness seasons: no rain in winter, in summer one rain with a 10 % chance for the whole summer, spring and fall as usual; a fall rain ends before the winter. Without NightBrightness it rains all year.
prain-storm-stages=A rain grows from drizzle to heavy rain, thunderstorm or monsoon and calms down again. Off: every rain is a normal one.
prain-monsoon-chance=Chance that a rain becomes a monsoon.
prain-intensity=How many drops fall. More drops cost more performance.
prain-max-drops-per-tick=Upper limit of drops per tick for all players together. When it is reached (far zoom, many players) the rain gets thinner instead of slowing the game.
prain-wind-strength=0 — drops fall straight; higher values bring more slanted rain and gusts.
prain-splashes=Splashes on the ground and ripples on water.
prain-post-rain=Ripples in puddles for a minute or two after the rain.
prain-rain-volume=From 0 to 1.
prain-thunder-sound=Thunder sounds.
prain-thunder-volume=From 0 to 1.
prain-thunder-layering=Close thunder rolls on for a while.
prain-lightning-flash=Lightning lights the area up for a moment.
prain-min-thunder-chance=Thunder rate at the calmest moment of a storm.
prain-max-thunder-chance=Thunder rate at the peak of a storm.
prain-lightning-strike-chance=Chance that a thunder near a player ends in a real strike (a tenth of it far from players). A strike empties energy buffers, browns out the network of a struck pole, stops a radar, destroys robots, kills or wounds creatures and sets wood, trees and pipes with flammable fluid on fire. 0 — no strikes.
prain-lightning-chain=A strike jumps on through nearby robots, creatures and poles.
prain-lightning-protection-minutes=From the start of the map lightning does not strike players and does not hit within 18 tiles of them.
prain-solar-percent=Share of the usual solar power while it rains.\n-1 — no change.
prain-pollution-cleanup-per-minute=Pollution removed from every chunk per minute of rain. 0 — off.
prain-pollution-chunks-per-tick=Fewer — better performance, but less even washing on big maps.
prain-fire-quench=Rain slowly puts ordinary fires out from the edges, with steam. Lightning fires and burning flammable fluids are not put out by rain (only fire safety turrets help), they only develop slower.
prain-fire-quench-seconds=How long a big fire lasts in the rain. Smaller fires go out sooner.
prain-enemy-fire-acid-damage=Fire and acid damage of enemies (spit, burning and acid puddles) while it rains, in % of the normal. 0 — harmless.
prain-player-fire-damage=Fire damage of flamethrowers, flamethrower turrets and wagons while it rains, in % of the normal.
prain-hazard-slowdown=How many times slower burning storage tanks count down, fire runs through pipes and ammunition cooks off while it rains (Paranoidal Flammable Fluids).
prain-enemy-day-percent=While it rains, enemy bites and spits deal this many percent more damage by day. Enemy fire and acid have their own setting.
prain-enemy-night-percent=The same at night.
prain-enemy-more-attacks=While it rains, enemies need less pollution to attack, so they attack more often (by the same percent as the damage).
prain-screen-flash=The screen briefly whitens from a close lightning. The darker sky of a storm stays.
prain-show-rain=Draw the rain around you. The rain sound and the effects stay.
