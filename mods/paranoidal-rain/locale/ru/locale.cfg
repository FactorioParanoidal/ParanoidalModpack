prain-pollution-cleaner=Вымывает загрязнение из воздуха во время дождя.
prain-lightning-load=Кратковременно перегружает электросеть после удара молнии в опору.

[technology-name]
prain-weather-forecast=Прогноз погоды

[technology-description]
prain-weather-forecast=Сеть радаров следит за циклонами. На рассвете первого и среднего дня каждого сезона приходит прогноз на ближайшие дни. Чем больше работающих радаров и чем они совершеннее, тем реже прогноз врёт: 1 радар — 10 %, 10 — 50 %, 100 — 100 % правды. Ошибаясь, прогноз обещает то, чего точно не будет.

