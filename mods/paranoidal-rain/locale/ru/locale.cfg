[mod-setting-description]
prain-enabled=Включает погоду и все её эффекты.
prain-allowed-surfaces=Внутренние имена поверхностей или планет через запятую. На космических платформах дождя не бывает.
prain-wet-min-minutes=Самый короткий дождь, в реальных минутах.
prain-wet-max-minutes=Самый долгий дождь, в реальных минутах.
prain-wet-power=1 — любая длительность равновероятна; больше 1 — чаще короткие дожди; меньше 1 — чаще долгие.
prain-dry-mean-minutes=Среднее время между дождями, в реальных минутах. Меньше — дожди чаще.
prain-first-dry-minutes=Новая карта (или сохранение, в которое только что добавили мод) остаётся сухой хотя бы столько времени, чтобы дождь не испортил старт.
prain-seasons=Сезоны NightBrightness: зимой дождей нет, летом — один дождь с вероятностью 10 % за всё лето, весной и осенью — как обычно; осенний дождь кончается до зимы. Без NightBrightness дожди круглый год.
prain-storm-stages=Дождь разгорается от мороси до ливня, грозы или муссона и снова стихает. Выключено — каждый дождь обычный.
prain-monsoon-chance=Вероятность, что дождь станет муссоном.
prain-intensity=Сколько капель падает. Больше капель — больше нагрузка.
prain-max-drops-per-tick=Верхний предел капель за тик на всех игроков. Когда он достигнут (сильное отдаление, много игроков), дождь становится реже, а игра не тормозит.
prain-wind-strength=0 — капли падают отвесно; больше — чаще косой дождь и порывы ветра.
prain-splashes=Брызги на земле и круги на воде.
prain-post-rain=Круги в лужах минуту-две после дождя.
prain-rain-volume=От 0 до 1.
prain-thunder-sound=Звуки грома.
prain-thunder-volume=От 0 до 1.
prain-thunder-layering=Близкий гром ещё какое-то время перекатывается.
prain-lightning-flash=Молния на миг освещает местность.
prain-min-thunder-chance=Частота грома в самый спокойный момент грозы.
prain-max-thunder-chance=Частота грома на пике грозы.
prain-lightning-strike-chance=Вероятность, что гром рядом с игроком закончится настоящим ударом (вдали от игроков — в 10 раз реже). Удар гасит энергию в цели, перегружает сеть опоры, отключает радар, уничтожает роботов, убивает или ранит существ и поджигает дерево, деревья и трубы с горючим. 0 — без ударов.
prain-lightning-chain=Разряд перескакивает на ближайших роботов, существ и опоры.
prain-lightning-protection-minutes=С начала карты молния не бьёт в игроков и не попадает ближе 18 клеток от них.
prain-solar-percent=Доля обычной солнечной энергии во время дождя.\n-1 — без изменений.
prain-pollution-cleanup-per-minute=Сколько загрязнения удаляется из каждого чанка за минуту дождя. 0 — выключено.
prain-pollution-chunks-per-tick=Меньше — лучше производительность, но на больших картах вымывание неравномернее.
prain-fire-quench=Дождь постепенно гасит обычный огонь от краёв к центру, с паром. Пожар от молнии и горящие горючие жидкости дождь не тушит (помогают только пожарные турели), а лишь замедляет.
prain-fire-quench-seconds=Сколько горит большой пожар под дождём. Небольшой огонь гаснет быстрее.
prain-enemy-fire-acid-damage=Урон огнём и кислотой от врагов (плевки, горящие и кислотные лужи) во время дождя, в % от обычного. 0 — безвредны.
prain-player-fire-damage=Урон огнём от огнемётов, огнемётных турелей и вагонов во время дождя, в % от обычного.
prain-hazard-slowdown=Во сколько раз медленнее во время дождя идёт отсчёт горящего резервуара, огонь по трубам и детонация боеприпасов (Paranoidal Flammable Fluids).
prain-enemy-day-percent=Пока идёт дождь, урон укусов и плевков врагов днём больше на столько процентов. Огонь и кислота врагов — отдельная настройка.
prain-enemy-night-percent=То же ночью.
prain-enemy-more-attacks=Пока идёт дождь, враги тратят меньше загрязнения на нападение — нападают чаще (на те же проценты, что и урон).
prain-screen-flash=Экран на миг белеет от близкой молнии. Затемнение в грозу остаётся.
prain-show-rain=Рисовать дождь вокруг вас. Звук дождя и эффекты остаются.
