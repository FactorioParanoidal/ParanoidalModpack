[mod-setting-description]
prain-enabled=Включает погоду и все её эффекты.
prain-allowed-surfaces=Внутренние имена поверхностей или планет через запятую. На космических платформах дождя не бывает.
prain-wet-min-minutes=Самый короткий дождь, в реальных минутах.
prain-wet-max-minutes=Самый долгий дождь, в реальных минутах.
prain-wet-power=1 — любая длительность равновероятна; больше 1 — чаще короткие дожди; меньше 1 — чаще долгие.
prain-dry-mean-minutes=Среднее время между дождями, в реальных минутах. Меньше — дожди чаще.
prain-first-dry-minutes=Новая карта (или сохранение, в которое только что добавили мод) остаётся сухой хотя бы столько времени, чтобы дождь не испортил старт.
prain-seasons=При включённых сезонах NightBrightness и незамороженном времени суток: зимой дождей нет; летом делается одна попытка с вероятностью 10% за весь сезон; весной и осенью — как обычно, осенний дождь заканчивается до зимы. Без подходящих сезонов NightBrightness или при замороженном времени суток сезонные ограничения не действуют, и дожди возможны круглый год.
prain-storm-stages=Дождь разгорается от мороси до ливня, грозы или муссона и снова стихает. Выключено — каждый дождь обычный.
prain-monsoon-chance=Вероятность выбрать для дождя последовательность стадий муссона. Используется только при включённых стадиях шторма; без них эта настройка не действует.
prain-intensity=Сколько капель падает. Больше капель — больше нагрузка.
prain-max-drops-per-tick=Верхний предел капель за тик на всех игроков. Когда он достигнут (сильное отдаление, много игроков), дождь становится реже, а игра не тормозит.
prain-wind-strength=0 — капли падают отвесно; больше — чаще косой дождь и порывы ветра.
prain-splashes=Брызги на земле и круги на воде.
prain-post-rain=Круги в лужах минуту-две после дождя.
prain-rain-volume=Громкость фонового дождя от 0 до 1; итоговая громкость зависит также от силы и стадии дождя. Эта настройка регулирует и звук порывов ветра.
prain-thunder-sound=Звуки грома.
prain-thunder-volume=От 0 до 1.
prain-thunder-layering=Близкий гром ещё какое-то время перекатывается.
prain-lightning-flash=Молния на миг освещает местность.
prain-min-thunder-chance=Параметр активности грома на спокойных фазах цикла. Число событий также зависит от количества созданных чанков, темноты и стадии погоды. Это не вероятность попадания молнии: она задаётся отдельно.
prain-max-thunder-chance=Параметр активности грома на пиках цикла. Число событий также зависит от количества созданных чанков, темноты и стадии погоды. Это не вероятность попадания молнии: она задаётся отдельно.
prain-lightning-strike-chance=Вероятность настоящего удара для грозового события в пределах 120 клеток от игрока; вдали проверяется одна десятая этого значения. Стартовая защита действует отдельно. Удар может разрядить цель, перегрузить сеть опоры, временно отключить радар, уничтожить дронов, ранить существ и поджечь горючие объекты или жидкости. На мирной главной поверхности или при её генерации без вражеских баз разрушительные эффекты отключены. 0 — без настоящих ударов, но обычные гром и вспышки остаются.
prain-lightning-chain=Разряд перескакивает на ближайших роботов, существ и опоры.
prain-lightning-protection-minutes=Стартовый период защиты в игровых минутах от начала карты, а не от входа игрока или установки мода. До его окончания персонажи защищены от поражения молнией, а исходные точки грозовых ударов в радиусе 18 клеток от игроков отклоняются. Это не бессрочная защита всех построек рядом.
prain-solar-percent=Доля обычной солнечной энергии во время дождя.\n-1 — без изменений.
prain-pollution-cleanup-per-minute=Сколько загрязнения удаляется из каждого чанка за минуту дождя. 0 — выключено.
prain-pollution-chunks-per-tick=Базовый предел числа чанков, обрабатываемых за тик для вымывания загрязнения на каждой дождевой поверхности. Меньше — ниже нагрузка, но на больших картах очистка менее равномерна. Параметры погоды конкретной поверхности могут переопределить этот предел.
prain-fire-quench=Дождь постепенно гасит обычный огонь от краёв к центру, с паром. Пожар от молнии и горящие горючие жидкости дождь не тушит (помогают только пожарные турели), а лишь замедляет.
prain-fire-quench-seconds=Сколько горит большой пожар под дождём. Небольшой огонь гаснет быстрее.
prain-enemy-fire-acid-damage=Урон огнём и кислотой от врагов (плевки, горящие и кислотные лужи) во время дождя, в % от обычного. 0 — безвредны.
prain-player-fire-damage=Урон огнём от огнемётов, огнемётных турелей и вагонов во время дождя, в % от обычного.
prain-hazard-slowdown=Во сколько раз медленнее во время дождя идёт отсчёт горящего резервуара, огонь по трубам и детонация боеприпасов (Paranoidal Flammable Fluids).
prain-enemy-day-percent=Пока идёт дождь, урон укусов и плевков врагов днём больше на столько процентов. Огонь и кислота врагов — отдельная настройка.
prain-enemy-night-percent=Ночной бонус к модификаторам урона укусов и плевков команды врагов, в процентах. Ночь определяется темнотой дождевой поверхности не ниже 0,4. При дожде на нескольких поверхностях выбирается наибольший подходящий дневной или ночной бонус; он действует на команду врагов на всех поверхностях. Если включены более частые атаки, этот же бонус уменьшает общий расход загрязнения на атаку.
prain-enemy-more-attacks=Пока на одной из дождевых поверхностей идёт дождь, уменьшает общий расход загрязнения на атаку: он делится на 1 + B/100, где B — применённый дневной или ночной бонус врагов. При бонусе 25% расход уменьшается на 20%, а не на 25%; нападения могут участиться. При дожде на нескольких поверхностях выбирается наибольший подходящий бонус. Меняется общий параметр карты.
prain-screen-flash=Экран на миг белеет от близкой молнии. Затемнение в грозу остаётся.
prain-show-rain=Рисовать дождь вокруг вас. Звук дождя и эффекты остаются.
