[mod-name]
paranoidal-rain=Paranoidal Rain (Дождь Параноидал)

[mod-description]
paranoidal-rain=Погода на Наувисе: дожди от мороси до муссона, гром и удары молний.\n\n— Дождь идёт стадиями: морось, дождь, ливень, гроза, муссон; капли в несколько слоёв, ветер, брызги и лужи; непрерывный звук дождя.\n— Гром доходит со скоростью звука, близкие раскаты перекатываются; молнии бьют в высокие постройки, опоры, деревья, роботов и существ.\n— Удар молнии гасит энергию в цели, на 3 с перегружает сеть опоры, на 20 с отключает радар, уничтожает роботов и поджигает дерево и трубы с горючим.\n— В дождь солнечные панели дают 75 % мощности, загрязнение вымывается из воздуха.\n— Дождь постепенно гасит обычный огонь; огонь и кислота врагов не наносят урона, огнемёты слабее вдвое.\n— Пожар от молнии и горящие жидкости дождь не тушит, только замедляет — тушат пожарные турели.\n\nВсё настраивается в параметрах карты; показ дождя можно выключить для себя. Основа — Dynamic Rain (valertron) и Real Rain (Squishy1870).

