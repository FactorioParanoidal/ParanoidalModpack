[mod-setting-description]
nuke-random-fires=With this setting enabled, nuclear weapons light scattered short lived fires around the crater (at most 4000, a tenth of the original mod's amount).
nuke-crater-noise=With this setting enabled some noise is produced at the edge of the larger craters to make them seem more natural.
destroy-resources-in-crater=This setting can be used to make sure that resources aren't destroyed by nuclear weapons at all. No guarentees are made about this looking natural with tile transitions
nukes-cause-pollution=Nukes cause pollution
retain-death-statistics=May cause performance losses for larger nukes due to huge amount of biter death particle effects. (has no effect for 100kt+)
retain-death-statistics-for-trees=May cause substantial performance losses for larger nukes due to huge amount of tree death particle effects. (has no effect for 100kt+)
retain-death-statistics-small=Only applies for nukes < 1kt, may still cause performance problems
retain-death-statistics-for-trees-small=Only applies for nukes < 1kt, may still cause performance problems
large-nuke-fire-scaledown=Since the large nukes are so huge, this setting reduces the number of fires created in the crater. This can significantly improve performance, however the bare crater does not look as devastated. (A value of 2 here results in a halving of the number of fires)
huge-nuke-fire-scaledown=Since the larger nukes are so huge, this setting reduces the number of fires created in the crater. This can significantly improve performance, and few living creatures survive close enough to see the crater anyway, however the bare crater does not look as devastated. (A value of 2 here results in a halving of the number of fires)
general-nuke-range-scaledown=Since all nukes can have large performance impacts, and can do tiny damage across a huge area, this setting reduces the area of effect on weapons. Note that the other scaledowns are applied on top of this one. (A value of 2 here results in a halving of the blast radius)
large-nuke-range-scaledown=Since the large nukes are so huge, this setting reduces simulated range of the blast and thermal damage. This can significantly improve performance, as the further out the wave goes, the more entities are hit. This does not increase the amount of world loaded, so a hard cutoff will still be present in unexplored areas. The default will usually stop at about the point where the blast is not longer destroying many buildings, only damaging them. (A value of 2 here results in a halving of the blast radius)
huge-nuke-range-scaledown=Since the 15kt nukes are so huge, this setting reduces simulated range of the blast and thermal damage. This can significantly improve performance, as the further out the wave goes, the more entities are hit. This does not increase the amount of world loaded, so a hard cutoff will still be present in unexplored areas. The default will usually stop at about the point where the blast is not longer destroying many buildings, only damaging them. (A value of 2 here results in a halving of the blast radius)
really-huge-nuke-range-scaledown=Since the 100kt nukes are so huge, this setting reduces simulated range of the blast and thermal damage. This can significantly improve performance, as the further out the wave goes, the more entities are hit. This does not increase the amount of world loaded, so a hard cutoff will still be present in unexplored areas. The default will usually stop at about the point where the blast is not longer destroying many buildings, only damaging them. (A value of 2 here results in a halving of the blast radius)
TN-mushroom-cloud-style-nuclear-flash=If enabled, nuclear explosions will cause a bright flash in their vincinity.\n\nEPILEPSY WARNING:\nSome persons may experience epileptic seizures if they are exposed to certain light frequencies, flickering lights or geometric forms/patterns. In this case I strongly recommend to disable this option!
optimise-100kt=Always used for charges of 1Mt and more. The damage is applied to the generated chunks a few per tick and to new chunks when they are generated. Much quicker than the normal detonation, but bigger charges in a factory are still slow.
actually-generate-crater=Disabling this removes the crater entirely - this is only here to remove issues around destroying resources, although it presents a very substantial performance improvement.

