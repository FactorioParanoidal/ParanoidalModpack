[mod-name]
paranoidal-true-nukes=Paranoidal True Nukes

[mod-description]
paranoidal-true-nukes=Realistic nuclear and thermobaric weapons: a fireball, crater, heat wave and blast wave instead of a fixed damage circle, radioactive fallout, and craters that slowly fill with water. Warheads from 0.1 t to 15 kt and fusion charges are delivered by cannon shells, rockets, artillery and land mines. The late tiers are unlocked by tests in a test site. Merged from True Nukes and Warheads.
