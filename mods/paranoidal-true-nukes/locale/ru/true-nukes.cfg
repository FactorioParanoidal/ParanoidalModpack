nuclear-deep-shallow-fill=Глубокая воронка с тонким слоем воды.
nuclear-deep-fill=Глубокая воронка, частично залитая водой.
nuclear-high=Непроходимый земляной вал по краю воронки. Его можно разобрать вручную или роботами.

