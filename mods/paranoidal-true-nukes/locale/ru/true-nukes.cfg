test-15kt=Проведите ядерное испытание мощностью 15 кт.
detonate-1Gt=Подорвите термоядерный заряд мощностью 1 Гт.
stop-1Gt=Уничтожьте или иначе остановите заряд 1 Гт после начала обратного отсчёта.
shoot-fusion=Выстрелите в термоядерное оружие.
lose-nuke=Погибните с ядерной боеголовкой или ядерным оружием при себе.
15kt-15hrs=Проведите ядерное испытание мощностью 15 кт за первые 150 часов игры.
destroy-everything=Уничтожьте весь свой завод одним ядерным взрывом.\n(Точнее: только огненным шаром и тепловой волной одного заряда сократите число своих машин с более чем 1000 до меньше 20. Считаются сборочные машины, печи, химические заводы и т. п., но НЕ буры.)

[tn-test]
trigger=Подорвать на полигоне: __1__
