[mod-setting-description]
nuke-random-fires=Разрешает разбросанные недолгие пожары за основной областью огня, не более 4000 на взрыв. Работает только для взрывов, у которых предусмотрены дальние малые пожары и их радиус больше основного. На пожары внутри основной области этот флажок не влияет.
nuke-crater-noise=Если включено, край крупных воронок получается неровным и выглядит естественнее.
destroy-resources-in-crater=Если выключить, ядерные взрывы совсем не уничтожают ресурсы. Как при этом выглядят переходы тайлов, не гарантируется.
nukes-cause-pollution=Ядерные взрывы загрязняют воздух.
retain-death-statistics=Сохраняет обычную обработку гибели других сущностей с предусмотренной заменой трупом вместо ускоренного удаления при ядерном взрыве: учитываются эффекты и статистика гибели. Может повысить нагрузку. Указание «не действует от 100 кт» к текущим обработчикам не относится; отдельный малый флажок используется только когда этот выключен.
retain-death-statistics-for-trees=Сохраняет обычную обработку гибели деревьев вместо ускоренного удаления при ядерном взрыве: учитываются эффекты и статистика гибели. Может повысить нагрузку. Указание «не действует от 100 кт» к текущим обработчикам не относится; отдельный малый флажок используется только когда этот выключен.
retain-death-statistics-small=Дополнительно сохраняет обычную обработку гибели других сущностей с предусмотренной заменой трупом для малых этапов взрыва: огненный шар радиусом меньше 80 клеток либо тепловая/ударная волна радиусом меньше 2000 клеток. При включённом основном флажке ничего не меняет. Это не фиксированный порог мощности в килотоннах; учёт гибели может повысить нагрузку.
retain-death-statistics-for-trees-small=Дополнительно сохраняет обычную обработку гибели деревьев для малых этапов взрыва: огненный шар радиусом меньше 80 клеток либо тепловая/ударная волна радиусом меньше 2000 клеток. При включённом основном флажке ничего не меняет. Это не фиксированный порог мощности в килотоннах; учёт гибели может повысить нагрузку.
large-nuke-fire-scaledown=Крупные заряды огромны, поэтому эта настройка уменьшает число пожаров в воронке. Это заметно разгружает игру, но голая воронка выглядит не так опустошённо. (Значение 2 вдвое уменьшает число пожаров.)
huge-nuke-fire-scaledown=Фактическое действие для заряда 15 кт: значения от 1 до 64 не меняют проверку создания основного пожара; выше 64 она проходит вдвое чаще и может увеличить плотность пожаров. Значение 2 не уменьшает число пожаров вдвое, несмотря на название настройки. Допустимый диапазон — 1–100.
general-nuke-range-scaledown=Любой ядерный заряд сильно нагружает игру и наносит крошечный урон на огромной площади, поэтому эта настройка уменьшает радиус действия. Остальные уменьшения применяются поверх неё. (Значение 2 вдвое уменьшает радиус ударной волны.)
large-nuke-range-scaledown=Крупные заряды огромны, поэтому эта настройка уменьшает рассчитываемый радиус ударной и тепловой волны. Это заметно разгружает игру: чем дальше уходит волна, тем больше объектов она задевает. Карта при этом не догружается, так что в неразведанных областях волна резко обрывается. По умолчанию волна обычно останавливается там, где она уже не разрушает много построек, а только повреждает их. (Значение 2 вдвое уменьшает радиус.)
huge-nuke-range-scaledown=Заряды 15 кт огромны, поэтому эта настройка уменьшает рассчитываемый радиус ударной и тепловой волны. Это заметно разгружает игру: чем дальше уходит волна, тем больше объектов она задевает. Карта при этом не догружается, так что в неразведанных областях волна резко обрывается. По умолчанию волна обычно останавливается там, где она уже не разрушает много построек, а только повреждает их. (Значение 2 вдвое уменьшает радиус.)
really-huge-nuke-range-scaledown=Заряды от 100 кт огромны, поэтому эта настройка уменьшает рассчитываемый радиус ударной и тепловой волны. Это заметно разгружает игру: чем дальше уходит волна, тем больше объектов она задевает. Карта при этом не догружается, так что в неразведанных областях волна резко обрывается. По умолчанию волна обычно останавливается там, где она уже не разрушает много построек, а только повреждает их. (Значение 2 вдвое уменьшает радиус.)
TN-mushroom-cloud-style-nuclear-flash=Если включено, ядерный взрыв даёт яркую вспышку вокруг себя.\n\n[color=orange]ПРЕДУПРЕЖДЕНИЕ ОБ ЭПИЛЕПСИИ:[/color]\nУ некоторых людей вспышки, мерцающий свет и геометрические узоры могут вызвать эпилептический припадок. В этом случае настоятельно рекомендуем выключить эту настройку!
optimise-100kt=Включает порционную обработку взрыва 100 кт: уже созданные чанки обрабатываются по нескольку за тик, новые получают эффект при генерации. Если выключено, для 100 кт используется обычный путь расчёта. Для зарядов от 1 Мт оптимизированный путь используется всегда. Крупный взрыв среди множества построек всё равно может обрабатываться долго.
actually-generate-crater=Если выключить, воронка не создаётся совсем. Настройка нужна на случай проблем с уничтожением ресурсов и заметно разгружает игру.

