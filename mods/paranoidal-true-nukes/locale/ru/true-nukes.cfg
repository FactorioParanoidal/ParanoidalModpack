[warhead-description]
-atomic-0_1t=Боеголовка мощностью 0,1 т.\nНа пределе того, насколько маленьким можно сделать ядерный заряд, но против одиночной цели опустошительна: убивает почти всё, во что попадает, и наносит серьёзный урон в радиусе 5 м.
-atomic-0_5t=Боеголовка мощностью 0,5 т.\nОбщий урон очень ограничен, но против одиночной цели опустошительна: убивает почти всё, во что попадает, и наносит серьёзный урон в радиусе 20 м.
-atomic-2t=Боеголовка мощностью 2 т.\nОбщий урон ограничен, но против скоплений целей опустошительна: убивает почти всё на небольшой площади и наносит серьёзный урон в радиусе 40 м.
-atomic-4t=Боеголовка мощностью 4 т.\nОбщий урон ограничен, но против скоплений целей и небольших гнёзд опустошительна: убивает почти всё на средней площади и наносит серьёзный урон в радиусе 60 м.
-atomic-8t=Боеголовка мощностью 8 т.\nОбщий урон ограничен, но против отдельных гнёзд опустошительна: убивает почти всё на средней площади и наносит серьёзный урон в радиусе 100 м. Безопасное расстояние — около 400 м.
-atomic-20t=Боеголовка мощностью 20 т.\nСравнивает с землёй средние гнёзда и калечит крупные, серьёзный урон в радиусе 150 м. Безопасное расстояние — около 600 м.
-atomic-500t=Боеголовка мощностью 500 т.\nУничтожает несколько соседних гнёзд и калечит всё на огромной площади, серьёзный урон в радиусе 300 м. Безопасное расстояние — около 1,2 км.
-atomic-1kt=Боеголовка мощностью 1 кт.\nУничтожает несколько соседних гнёзд и калечит всё на огромной площади, серьёзный урон в радиусе 600 м. Безопасное расстояние — около 2,5 км.
-atomic-15kt=Боеголовка мощностью 15 кт.\nЦелиться в отдельные гнёзда бессмысленно: она расчищает огромную площадь, серьёзный урон в радиусе 1,5 км. Безопасное расстояние — порядка 6 км.
-atomic-2-stage-15kt=Боеголовка мощностью 15 кт.\nПрименять её в таком виде очень расточительно.\nЦелиться в отдельные гнёзда бессмысленно: она расчищает огромную площадь, серьёзный урон в радиусе 1,5 км. Безопасное расстояние — порядка 6 км.
-atomic-2-stage-100kt=Боеголовка мощностью 100 кт.\nЭто самое большое оружие, которое ещё имеет смысл применять.\nЦелиться в отдельные гнёзда бессмысленно: она расчищает огромную площадь, серьёзный урон в радиусе около 4 км. Безопасное расстояние — порядка 15 км.
-atomic-2-stage-1Mt=Боеголовка мощностью 1 Мт.\nСтирает до травы площадь размером с большинство заводов, серьёзный урон в радиусе около 10 км. Безопасное расстояние — порядка 36 км.
-atomic-2-stage-5Mt=Боеголовка мощностью 5 Мт.\nСтирает до травы площадь размером с большинство заводов, серьёзный урон в радиусе около 20 км. Безопасное расстояние — порядка 72 км.
-atomic-2-stage-10Mt=Боеголовка мощностью 10 Мт.\nВоронка размером с небольшой завод, серьёзный урон в радиусе около 28 км. Безопасное расстояние — порядка 100 км.
-atomic-2-stage-50Mt=Боеголовка мощностью 50 Мт.\nВоронка размером со средний завод, серьёзный урон в радиусе около 50 км. Безопасное расстояние — порядка 180 км.
-atomic-2-stage-100Mt=Боеголовка мощностью 100 Мт.\nВоронка размером с большой завод, серьёзный урон в радиусе около 65 км. Безопасное расстояние — порядка 240 км.
-atomic-2-stage-1Gt=Боеголовка мощностью 1 Гт.\nВоронка сравнима с мегабазой, серьёзный урон в радиусе около 130 км. Безопасное расстояние — порядка 500 км.\nПо сути, это просто необычный способ удалить сохранение.
-thermobaric-1=Термобарическая боеголовка: умеренный урон в радиусе 30 м.
-thermobaric-2=Термобарическая боеголовка: умеренный урон в радиусе 80 м.
-thermobaric-3=Термобарическая боеголовка: умеренный урон в радиусе 120 м.

