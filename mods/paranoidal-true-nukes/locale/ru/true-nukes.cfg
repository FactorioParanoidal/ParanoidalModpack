[technology-description]
californium-processing=Малая критическая масса калифорния позволяет делать невероятно маленькие ядерные заряды и применять их там, где раньше было нельзя.
tritium-processing=Радиоактивный изотоп водорода, который получают только в сильном излучении внутри ядерного реактора. Годится для подсветки часов и прицелов, а ещё для термоядерного оружия.
basic-atomic-weapons=Первая попытка загнать делящееся вещество выше критической массы: заряд громоздкий и едва срабатывает, но результат всё равно впечатляет.
expanded-atomics=Больше делящегося вещества и точная синхронизация дают куда более разрушительный взрыв.
full-fission-atomics=Исследования и опыт позволяют расщепить вещество куда полнее и делать гораздо более крупные боеголовки.
artillery-atomics=Боеголовке особенно трудно пережить выстрел из артиллерийского орудия, зато так применять оружие гораздо удобнее.
californium-weapons=Калифорний открывает целый ряд малых ядерных боеголовок для самого разного опасного оружия.
compact-californium-weapons=Отражатели нейтронов снижают критическую массу делящегося вещества и открывают ещё более безрассудные способы применения.
compact-full-fission-weapons=Отражатели нейтронов и калифорний в крупных зарядах дают ещё более мощное оружие и ещё худшие способы применять уже существующее.
fusion-weapons=Энергия ядерного взрыва заставляет тритий вступать в синтез — с апокалиптическими последствиями. На случай, когда уничтожить всё на [font=default-bold]половине[/font] карты мало.\nПозаботьтесь о быстром поезде для отступления.
compact-fusion-weapons=Уменьшенные термоядерные заряды слабее, зато годятся для куда большего числа ситуаций, многие из которых самоубийственны.
dense-neutron-flux=Отражатели нейтронов позволяют получать экзотические элементы за гораздо меньшее время облучения.
thermobaric-weaponry=В этих зарядах горючего намного больше, чем окислителя: горючее догорает в воздухе и даёт мощную ударную волну. Урон у них невелик, зато по большой площади. Против одиночных прочных целей они слабы, против роя слабых врагов — отличны. Они поджигают всё вокруг и сильно загрязняют воздух.

