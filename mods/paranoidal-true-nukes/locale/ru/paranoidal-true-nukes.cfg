[mod-name]
paranoidal-true-nukes=Paranoidal True Nukes (Настоящие ядерные заряды)

[mod-description]
paranoidal-true-nukes=Реалистичное ядерное и термобарическое оружие: вместо круга с фиксированным уроном — огненный шар, воронка, тепловая и ударная волны, радиоактивные осадки; воронки со временем заполняются водой. Боеголовки от 0,1 т до 15 кт и термоядерные заряды несут пушечные снаряды, ракеты, артиллерия и мины. Поздние ступени открываются испытаниями на полигоне. Объединение модов True Nukes и Warheads.
