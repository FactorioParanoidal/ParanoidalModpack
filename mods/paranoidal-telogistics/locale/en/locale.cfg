[item-description]
ptl-teleporter=Moves its contents to the receivers on another planet every __2__ s. One send is __4__ GJ: it charges at __1__ MW, longer on a weak network. As a receiver it draws __5__ MW all the time and takes no cargo without power. __3__ slots, slot filters and the red bar as in a chest. Does not work on space platforms or inside factory buildings.

