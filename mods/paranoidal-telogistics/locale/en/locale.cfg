[mod-name]
paranoidal-telogistics=Paranoidal Telogistics

[mod-description]
paranoidal-telogistics=Cargo teleporters of the Space Age branch: move contents between planets for electricity.\n\n- Three tiers: cargo, quantum and singularity teleporter. Each next tier recharges twice as fast (20, 10, 5 s), takes twice the power (750, 1500, 3000 MW) and holds more (48, 80, 120 slots).\n- Each tier belongs to a planet: the cargo teleporter is researched on Muluna after the interstellar science pack, the quantum one after the metallurgic science pack of Vulcanus, the singularity one after the electromagnetic science pack of Fulgora. Each is made of the previous tier and its planet's materials.\n- A sender moves its cargo once per recharge into every receiver of the chosen planet with the same channel (any signal) in turn. Send at once, when full or on a circuit condition.\n- A receiver draws 50, 100 or 200 MW (by tier) all the time and takes no cargo without power: a sender fills only powered receivers.\n- Receiver slot filters and the red bar work; quality, spoilage, armor with equipment and blueprints move as they are.\n- Upgrade planner, copy-paste, blueprints and ghosts keep the settings.\n\nAfter Telogistics (S6X, GPLv3), rewritten from scratch.

