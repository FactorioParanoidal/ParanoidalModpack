[mod-name]
paranoidal-telogistics=Paranoidal Telogistics (Грузовые телепорты)

[mod-description]
paranoidal-telogistics=Грузовые телепорты ветки Space Age: переносят содержимое между планетами за электричество.\n\n— Три уровня: грузовой, квантовый и сингулярный телепорт. Каждый следующий заряжается вдвое быстрее (20, 10, 5 с), берёт вдвое больше мощности (750, 1500, 3000 МВт) и вмещает больше (48, 80, 120 ячеек).\n— Каждый уровень — своей планеты: грузовой исследуется на Мулуне после межзвёздного исследовательского пакета, квантовый — после металлургического пакета Вулкана, сингулярный — после электромагнитного пакета Фульгоры. Собирается из предыдущего уровня и материалов своей планеты.\n— Отправитель раз в перезарядку переносит груз во все приёмники выбранной планеты с тем же каналом (любой сигнал) по очереди. Отправлять сразу, когда заполнится или по условию схемы.\n— Приёмник постоянно берёт 50, 100 или 200 МВт (по уровню) и без питания груз не принимает: отправитель кладёт груз только в приёмники с питанием.\n— Фильтры слотов и красная граница приёмника работают, качество, порча, броня с модулями и чертежи переносятся как есть.\n— Улучшение планировщиком, копирование настроек, чертежи и призраки сохраняют настройки.\n\nПо мотивам Telogistics (S6X, GPLv3), полностью переписан.

