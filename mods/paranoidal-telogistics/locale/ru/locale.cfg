[item-description]
ptl-teleporter=Переносит содержимое в приёмники на другой планете раз в __2__ с. Одна отправка — __4__ ГДж: зарядка идёт при __1__ МВт, на слабой сети дольше. В режиме приёма постоянно берёт __5__ МВт, без питания груз не принимает. __3__ ячеек, фильтры слотов и красная граница как у сундука. Не работает на космических платформах и внутри фабрик.

