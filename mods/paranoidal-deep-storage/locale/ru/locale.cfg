[mod-setting-name]
memory-unit-power-usage=Энергопотребление материопамяти

[mod-setting-description]
memory-unit-power-usage=Множитель энергопотребления хранилищ и ёмкостей материопамяти. Формула: [font=default-small](1 МВт + ceil(количество / размер стака) ^ 0,35 × множитель) × коэффициент качества[/font]\nДля жидкостей размер стака равен 1000.\nКоэффициент качества: 1 у обычного качества, по параболе снижается до 0,2 у высшего.\nПо умолчанию в Paranoidal: 480 кВт.

