[technology-description]
memory-unit=Хранит в материопамяти неограниченное количество одного предмета одного качества.
logistic-memory-unit=Хранилища материопамяти, работающие как логистические сундуки: пассивного снабжения, хранения, буферный и запроса.
fluid-memory-storage=После исследования хранилищ материопамяти для предметов остро встал вопрос о таких же бесконечных хранилищах для жидкостей! Ёмкости материопамяти смогут хранить БЕСКОНЕЧНОЕ количество одной жидкости за счёт невероятной упаковки атомов ценой всё возрастающих энергозатрат для поддержания стабильности их структуры. Удалось даже уменьшить размер хранилища!

