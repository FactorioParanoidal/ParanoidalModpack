[entity-description]
memory-unit=Хранит в материопамяти неограниченное количество одного предмета одного качества. При нехватке питания предметы не переносятся между буфером и материопамятью.\nНельзя хранить портящиеся предметы и предметы с содержимым или данными: броню, технику, чертежи, упакованные хранилища.\nПри разрушении всё содержимое теряется.
memory-unit-combinator=Передаёт в логическую сеть количество предметов в хранилище материопамяти. Сигнал не может превышать 2,1 млрд.
logistic-memory-unit-passive-provider=Хранилище материопамяти в логистической сети: неограниченное количество одного предмета одного качества. Держит сундук заполненным на 90 %, чтобы дронам всегда было что забрать.\nНельзя хранить портящиеся предметы и предметы с содержимым или данными. При разрушении всё содержимое теряется.
logistic-memory-unit-storage=Хранилище материопамяти в логистической сети: неограниченное количество одного предмета одного качества. Держит сундук заполненным на 10 %, чтобы дронам всегда было куда положить; фильтр хранения следует за хранимым предметом, а у пустого хранилища назначает ему предмет.\nНельзя хранить портящиеся предметы и предметы с содержимым или данными. При разрушении всё содержимое теряется.
logistic-memory-unit-buffer=Хранилище материопамяти в логистической сети: неограниченное количество одного предмета одного качества. Держит сундук заполненным наполовину из материопамяти; запросы берут из сети, только когда материопамять пуста. Запрос больше уровня сундука непрерывно забирает предмет из сети.\nНельзя хранить портящиеся предметы и предметы с содержимым или данными. При разрушении всё содержимое теряется.
logistic-memory-unit-requester=Хранилище материопамяти в логистической сети: неограниченное количество одного предмета одного качества. Держит четверть сундука заполненной из материопамяти; запросы берут из сети, только когда материопамять пуста, лишнее уходит в материопамять. Запрос больше уровня сундука непрерывно забирает предмет из сети.\nНельзя хранить портящиеся предметы и предметы с содержимым или данными. При разрушении всё содержимое теряется.
fluid-memory-unit=Хранит в материопамяти неограниченное количество одной жидкости. При смешивании жидкости разной температуры сохраняется меньшая температура.\nПри разрушении всё содержимое теряется.
fluid-memory-unit-combinator=Передаёт в логическую сеть количество жидкости в ёмкости материопамяти. Сигнал не может превышать 2,1 млрд.

