[mod-name]
paranoidal-deep-storage=Paranoidal Deep Storage (Хранилища материопамяти)

[mod-description]
paranoidal-deep-storage=Хранилища материопамяти — бездонные склады для предметов и жидкостей.\n\n— Хранилище вмещает неограниченное количество одного вида предметов одного качества, ёмкость — неограниченное количество одной жидкости или газа.\n— Чем больше хранится, тем больше энергии нужно (в сборке базовое потребление — 480 кВт); высокое качество снижает потребление.\n— Логистические варианты хранилища: пассивный поставщик, хранилище, буфер и запросчик — для сети роботов.\n— Жидкость можно выбрать заранее в окне ёмкости; пустое хранилище или ёмкость можно отвязать кнопкой «Сбросить».\n— Комбинатор выдаёт количество в сеть сигналов.\n\nРазобранное хранилище или ёмкость превращается в упакованный предмет с содержимым внутри. При разрушении всё содержимое теряется.

