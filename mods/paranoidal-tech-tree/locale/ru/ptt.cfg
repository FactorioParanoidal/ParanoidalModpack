help-1=Клик по карточке — справа подробности: цена, что даёт, путь к ней.
help-2=Shift+клик по карточке — в очередь. Ctrl+клик — сделать целью: мод сам ставит в очередь всё нужное по порядку.
help-3=«+» у технологий в «Можно ставить сейчас» — добавить их по одной, не уходя с выбранной.
help-4=Поиск ищет по названию и по тому, что открывается: рецептам и предметам. Enter — выбрать первую найденную, __CONTROL__focus-search__ — перейти к поиску.
help-5=«Всё дерево» — все эпохи. «Цепочка» — выбранная технология, её предки и следующие. Булавка закрепляет цепочку.
help-6=Очередь: клик — выбрать, Shift+клик — поднять выше, правый клик или × — убрать.
help-7=Цвет значка: [color=1,0.85,0.35]жёлтый[/color] — можно сейчас, [color=0.5,0.7,1]синий[/color] — в очереди, [color=0.55,0.8,0.55]зелёный[/color] — изучено, [color=1,0.45,0.35]красный[/color] — отключено. [color=1,0.65,0.35]Оранжевое[/color] «осталось N» — на пути к выбранной.
help-8=«осталось N» — сколько исследований нужно до неё, включая её саму.
