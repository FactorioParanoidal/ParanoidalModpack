help-hint=How to use
help-title=How to use
help-step-select=Click the technology you want to get.
help-step-set-goal="Add to queue" queues one. "Set as goal" lets the mod fill the queue.
help-step-done=This technology is already researched — pick another one.
help-step-goal=Goal is set: the queue fills itself.
help-step-paused=Goal is paused: press "Resume" in the goal line.
help-1=Click a card — the details on the right: cost, what it gives, the path to it.
help-2=Shift+click a card to queue it. Ctrl+click sets it as the goal: the mod queues everything needed in order.
help-3="+" next to technologies in "Can be queued now" adds them one by one without leaving the selection.
help-4=Search looks at names and at what is unlocked: recipes and items. Enter selects the first match, __CONTROL__focus-search__ jumps to the search.
help-5="Full tree" shows every era. "Chain" shows the selected technology, its prerequisites and the next ones. The pin keeps the chain.
help-6=Queue: click to select, Shift+click to move up, right click or × to remove.
help-7=Icon colour: [color=1,0.85,0.35]yellow[/color] — available now, [color=0.5,0.7,1]blue[/color] — queued, [color=0.55,0.8,0.55]green[/color] — researched, [color=1,0.45,0.35]red[/color] — disabled. [color=1,0.65,0.35]Orange[/color] "N left" — on the path to the selected one.
help-8="N left" — how many technologies are needed up to it, including itself.
