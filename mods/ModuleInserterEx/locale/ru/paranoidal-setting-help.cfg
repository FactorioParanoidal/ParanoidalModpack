[mod-setting-description]
module-inserter-ex-close-after-load=[item=module-inserter-ex] После загрузки сохранённого пресета закрывает окно установщика модулей. Если выключить, окно остаётся открытым для проверки и правки загруженной схемы. Выбор пресета сам по себе не устанавливает модули во все здания карты.\n[color=#9cdcfe]По умолчанию: флажок снят. Только для вас.[/color]
