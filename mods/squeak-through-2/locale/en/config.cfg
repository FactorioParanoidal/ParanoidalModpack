[sqt-setting-name]
disable-setting=Disable modification of __1__
chests=chests
circuits=circuits
drills=drills
machines=machines
pipes=pipes
solar=solar power
steam=steam power
trees=trees
turrets=turrets
misc=miscellaneous entities

[sqt-setting-description]
chests=Chests, logistic chests, linked and infinity chests.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
circuits=Combinators, lamps, display panels, programmable speakers, and power switches.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
drills=Mining drills.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
machines=Assemblers, furnaces, labs, and rocket silos.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
pipes=Pipes, underground pipes, pumps, valves, storage tanks, offshore pumps, and heat pipes.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
solar=Solar panels and accumulators.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
steam=Boilers, steam engines, reactors, and burner generators.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
trees=Trees. Checked: do not shrink their collision boxes. Unchecked: clamp each edge to within 0.2 tiles of the centre, including large trees, unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
turrets=Gun, laser, flamethrower, and artillery turrets.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.
misc=Beacons, electric poles, inserters, radars, roboports, and train stops.\nChecked: do not shrink collision boxes for this group. Unchecked: shrink them unless separately excluded. Explicit collision removal by name or type can still apply when this box is checked.

[mod-setting-name]
sqt-blacklist-types=Blacklist types
sqt-blacklist-names=Blacklist names
sqt-remove-collision=Use remove collision lists (WARNING: Affects biters!)
sqt-remove-collision-types=Remove collision types
sqt-remove-collision-names=Remove collision names

[mod-setting-description]
sqt-blacklist-types=List entity types to blacklist modification of separated by commas, e.g. "tree, inserter, electric-pole"
sqt-blacklist-names=List entity names to blacklist modification of separated by commas, e.g. "fast-inserter, small-electric-pole"
sqt-remove-collision=Enables removal of player collision from entities in the lists below. The train collision layer is retained. If that retained layer would still block the character, collision removal is skipped for that entity; gates may therefore keep their collision.
sqt-remove-collision-types=List entity types, separated by commas, to remove player collision from when collision removal is enabled, e.g. "tree, inserter, electric-pole". Changes apply to the whole upgrade/downgrade group of each matching entity.
sqt-remove-collision-names=List entity names, separated by commas, to remove player collision from when collision removal is enabled, e.g. "fast-inserter, small-electric-pole".\nNOTICE: Entities with upgrades/downgrades will apply changes to the whole upgrade group.