[mod-name]
paranoidal-vehicle-physics=Paranoidal Vehicle Physics

[mod-description]
paranoidal-vehicle-physics=Vehicle physics, angle snapping and shield hit effects in one mod. Cars and tanks drift and slide in turns, leave tire marks on hard surfaces and raise dust on sand and dirt; airplanes are supported. The driving angle gently snaps to the nearest of fixed angles (16 by default): toggle with the shortcut button or Shift+V, the number of angles is a per-player setting. When a character, car or spidertron shield absorbs damage, a glowing shell flashes around it; an alternate effect is available.

[mod-setting-name]
vehphy-tiremarks-duration=Tire-marks duration
SFX_alternate_effect=Alternate shield effect

[mod-setting-description]
vehphy-tiremarks-duration=The duration in seconds before tire marks are removed
SFX_alternate_effect=Replaces the visual effect of the shield by an alternate, animated version.
