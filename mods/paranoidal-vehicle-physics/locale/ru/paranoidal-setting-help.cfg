[mod-setting-description]
VehicleSnap_amount=[item=car] Задаёт число направлений, к которым плавно выравнивается едущая машина после прекращения поворота. Больше направлений — мельче шаг привязки. Значение 16 особое: восемь основных направлений дополняются углами, удобными для движения вдоль железной дороги.\n[color=#9cdcfe]По умолчанию: 16. Диапазон: от 4. Только для вас.[/color]
