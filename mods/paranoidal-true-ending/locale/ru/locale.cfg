[mod-name]
paranoidal-true-ending=Paranoidal True Ending (Истинный финал)

[mod-description]
paranoidal-true-ending=Истинный финал ветки Space Age: победа не на Границе солнечной системы, а на Разрушенной планете.\n\n— Граница солнечной системы завершает главу 1: сообщение и достижение, экрана победы нет.\n— Путь за Границу — три отрезка, каждый опаснее предыдущего: Граница → Полпути к Разрушенной планете (2 млн км; здесь можно стоять и добывать прометий) → Пояс обломков (1,2 млн км) → Разрушенная планета (0,8 млн км, огромных астероидов на четверть больше).\n— «Прометиевый исследовательский пакет» открывает путь до Полпути, технология «Разрушенная планета» (20 000 единиц, все научные пакеты сборки) — Пояс обломков, саму планету и Ковчег.\n— Ковчег собирается на платформе в криогенном заводе из материалов всех планет: прометий, квантовые процессоры, победит, суперконденсаторы, углеволокно, ледяное серебро, лунитовые и ауритовые плиты, карборунд, триплекс и конструкции малой плотности.\n— Победа засчитывается, когда платформа с Ковчегом в хабе достигает Разрушенной планеты, — один раз, после загрузки сохранения не повторяется.\n\nПо мотивам True Ending Is Shattered Planet (Talandar, MIT).

[space-location-name]
paranoidal-halfway-to-shattered-planet=Полпути к Разрушенной планете
paranoidal-shattered-debris-belt=Пояс обломков

[space-location-description]
paranoidal-halfway-to-shattered-planet=Середина пути от Границы солнечной системы к Разрушенной планете. Здесь можно остановиться и добывать прометиевые астероиды; дальше будет только опаснее.
paranoidal-shattered-debris-belt=Последний и самый опасный участок пути к Разрушенной планете: огромных астероидов здесь больше всего, и большинство из них — прометиевые.

[technology-name]
paranoidal-shattered-planet=Разрушенная планета

[technology-description]
paranoidal-shattered-planet=Открывает путь от Полпути через Пояс обломков к Разрушенной планете и рецепт Ковчега. Доставьте Ковчег к Разрушенной планете в хабе платформы — это истинный финал.

[item-name]
paranoidal-ark=Ковчег

[item-description]
paranoidal-ark=Собирается на космической платформе из материалов всех планет. Доставьте его к Разрушенной планете в хабе платформы — это истинный финал.
promethium-asteroid-chunk=Кусок астероида, который встречается на пути от Границы солнечной системы к Разрушенной планете: чем ближе к ней, тем их больше.

[paranoidal-true-ending]
chapter-one=Глава 1 завершена: платформа «__1__» достигла места «__2__». Истинный финал — у места «__3__»: исследуйте «__4__» и «__5__», соберите на платформе «__6__» и доставьте его туда в хабе платформы.
no-ark=Платформа «__1__» у места «__2__», но в её хабе нет предмета «__3__»: истинный финал засчитывается только с ним.
victory-title=Истинный финал
victory-message=Платформа «__1__» доставила «__2__» к месту «__3__». Все планеты пройдены — это истинный финал Paranoidal.
victory-final=Спасибо за игру! Можно продолжать.
