[mod-name]
paranoidal-true-ending=Paranoidal True Ending

[mod-description]
paranoidal-true-ending=True ending of the Space Age branch: the victory is not at the solar system edge but at the shattered planet.\n\n— The solar system edge ends chapter 1: a message and an achievement, no victory screen.\n— Beyond the edge the route has three legs, each more dangerous: edge → halfway to the shattered planet (2 million km; a platform can wait here and mine promethium) → debris belt (1.2 million km) → shattered planet (0.8 million km, a quarter more huge asteroids).\n— The promethium science pack opens the way to the halfway point, the technology "Shattered planet" (20 000 units, every science pack of the build) the debris belt, the planet itself and the Ark.\n— The Ark is made on a platform in a cryogenic plant from the materials of every planet: promethium, quantum processors, pobedit, supercapacitors, carbon fiber, ice silver, lunite and aurite plates, carborundum, triplex and low density structures.\n— The victory comes when a platform with the Ark in its hub reaches the shattered planet — once, a loaded save does not repeat it.\n\nBased on True Ending Is Shattered Planet (Talandar, MIT).

[space-location-name]
paranoidal-halfway-to-shattered-planet=Halfway to the shattered planet
paranoidal-shattered-debris-belt=Debris belt

[space-location-description]
paranoidal-halfway-to-shattered-planet=The middle of the way from the solar system edge to the shattered planet. A platform can wait here and mine promethium asteroids; further on it only gets more dangerous.
paranoidal-shattered-debris-belt=The last and most dangerous leg of the way to the shattered planet: it has the most huge asteroids, most of them promethium.

[technology-name]
paranoidal-shattered-planet=Shattered planet

[technology-description]
paranoidal-shattered-planet=Opens the way from the halfway point through the debris belt to the shattered planet and the recipe of the Ark. Bring the Ark to the shattered planet in a platform hub: this is the true ending.

[item-name]
paranoidal-ark=Ark

[item-description]
paranoidal-ark=Made on a space platform from the materials of every planet. Bring it to the shattered planet in the platform hub: this is the true ending.
promethium-asteroid-chunk=An asteroid chunk found on the way from the solar system edge to the shattered planet: the closer to it, the more of them.

