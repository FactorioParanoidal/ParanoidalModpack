[mod-name]
Delete-Chunk-Tool-reforged=Chunk Delete Tool Reforged

[mod-description]
Delete-Chunk-Tool-reforged=Administrators delete chunks with a selection tool: the chosen chunks are highlighted and deleted only after confirmation. A normal selection keeps chunks with player buildings, ruins and legendary ruins; Shift deletes them too (never chunks with a character). Map trimming deletes in one go all chunks far from buildings, outside radar range and without pollution, to make the save smaller. A deleted chunk comes back without new ruins and with no more ore than it had; chunks deleted with the tool come back without enemy bases.

[item-name]
chunk-eraser=Chunk eraser

[item-description]
chunk-eraser=Select an area to delete its chunks after a preview and confirmation. A normal selection keeps chunks with player buildings, ruins and legendary ruins; an alternative selection (Shift) deletes them too. Chunks with a character are never deleted. A deleted chunk is generated again without enemy bases, without new ruins and with no more ore than it had.

[shortcut-name]
chunk-eraser=Chunk eraser
chunk-trim=Trim the map

[shortcut-description]
chunk-eraser=Select an area to delete its chunks after a preview and confirmation. A normal selection keeps chunks with player buildings, ruins and legendary ruins; an alternative selection (Shift) deletes them too. Chunks with a character are never deleted. A deleted chunk is generated again without enemy bases, without new ruins and with no more ore than it had.
chunk-trim=Finds the chunks of this surface that are far from player buildings, outside radar range, not visible and without pollution, shows them and deletes them after confirmation: the save becomes smaller. Such chunks are generated again as the map generator makes them, without new ruins and with no more ore than they had. Also the command /chunk-trim [distance].

[mod-setting-name]
dct-trim-distance=Map trimming: distance from buildings

[mod-setting-description]
dct-trim-distance=Map trimming keeps the chunks closer than this many chunks to buildings and characters of players.

