[mod-name]
Delete-Chunk-Tool-reforged=Chunk Delete Tool Reforged (Инструмент удаления чанков)

[mod-description]
Delete-Chunk-Tool-reforged=Инструмент администратора для удаления участков карты (чанков).\n\n«Удаление чанков» (кнопка на панели): выделите область, выбранные чанки подсветятся, и после подтверждения они будут удалены. Обычное выделение не трогает чанки с постройками игроков, руинами и легендарными руинами, с Shift удаляются и они. Чанки с персонажем не удаляются никогда.\n\n«Обрезать карту» (кнопка на панели или команда /chunk-trim): удаляет разом все чанки дальше 5 чанков от построек (настройка карты), вне зоны радаров и без загрязнения, чтобы уменьшить сохранение.\n\nУдалённый чанк при следующем посещении генерируется заново, но без новых руин и не больше руды, чем было. Чанки, удалённые инструментом, возвращаются ещё и без баз врагов. На сервере работает только для администраторов.

[item-name]
chunk-eraser=Удаление чанков

[item-description]
chunk-eraser=Выделите область: чанки подсветятся и после подтверждения будут удалены. Обычное выделение не трогает чанки с постройками игроков, руинами и легендарными руинами, альтернативное (с Shift) удаляет и их. Чанки с персонажем не удаляются никогда. Удалённый чанк генерируется заново без баз врагов, без новых руин и не больше руды, чем было.

[shortcut-name]
chunk-eraser=Удаление чанков
chunk-trim=Обрезать карту

[shortcut-description]
chunk-eraser=Выделите область: чанки подсветятся и после подтверждения будут удалены. Обычное выделение не трогает чанки с постройками игроков, руинами и легендарными руинами, альтернативное (с Shift) удаляет и их. Чанки с персонажем не удаляются никогда. Удалённый чанк генерируется заново без баз врагов, без новых руин и не больше руды, чем было.
chunk-trim=Находит на этой поверхности чанки вдали от построек игроков, вне зоны радаров, вне видимости и без загрязнения, показывает их и после подтверждения удаляет: сохранение становится меньше. Такие чанки потом генерируются заново как обычно, но без новых руин и не больше руды, чем было. То же делает команда /chunk-trim [расстояние].

[mod-setting-name]
dct-trim-distance=Обрезка карты: расстояние от построек

[mod-setting-description]
dct-trim-distance=Обрезка карты оставляет чанки ближе этого числа чанков к постройкам и персонажам игроков.

