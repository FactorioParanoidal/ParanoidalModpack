[mod-name]
more-fonts-ru=More Fonts (RU)

[mod-description]
more-fonts-ru=Fork of More Fonts: startup setting to change the game font, with fallback to the game fonts for missing characters.

[mod-setting-name]
more-fonts-ru-font-family=Game font

[mod-setting-description]
more-fonts-ru-font-family=Changes the main font of the game and mods. Requires restart. Characters missing from the font (for example Cyrillic) are drawn with the standard Noto Sans font.

[string-mod-setting]
more-fonts-ru-font-family-default=[font=more-fonts-ru-preview-default]Default[/font]
