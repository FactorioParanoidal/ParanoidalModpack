[mod-name]
more-fonts-ru=Больше шрифтов (RU)

[mod-description]
more-fonts-ru=Форк More Fonts: стартовая настройка для смены шрифта игры. Недостающие символы берутся из стандартных шрифтов.

[mod-setting-name]
more-fonts-ru-font-family=Шрифт игры

[mod-setting-description]
more-fonts-ru-font-family=Меняет основной шрифт игры и модов. Нужен перезапуск. Символы, которых нет в шрифте (например, кириллица), рисуются стандартным шрифтом Noto Sans.

