[mod-setting-description]
max_night_brightness_percent=Summer night brightness. Beta 8 default: 15%.
min_night_brightness_percent=Winter night brightness. Beta 8 default: 5%.
night_brightness_period_days=Brightness, daylight duration and solar output change together. Paranoidal default: 24 days. Years are counted from the landing; a new length applies from the current year on.
nb_winter_tint=In winter dusk and nights keep a little more blue. Daylight does not change.
nb_season_names=How seasons are named in the chat and in EvoUI: plain, by the length of the day or in the voice of Buy n Large.
nb_debug=Print the calendar day, cycle day, season, minimum brightness and solar multiplier at every midnight.
nb_reset=While enabled, changes to this mod's runtime settings restart the seasons from summer. The calendar and the years go on. Settings of other mods do not reset it.
nb_disabled=Stop seasonal changes on Nauvis; restore fixed dawn/dusk, 15% minimum brightness and solar factor 1 (pollution still applies). Days and years are still counted. Startup LUT darkening remains active: select Normal night and restart to remove it.
nb_black_night_darkness=Color lookup tables from Beta 8. The night tint covers the short summer night; longer nights are darkened by brightness. Changes require a restart and also affect zoomed map view.

