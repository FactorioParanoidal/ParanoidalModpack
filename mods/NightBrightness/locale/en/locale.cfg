[mod-setting-description]
max_night_brightness_percent=Summer night brightness. Beta 8 default: 15%.
min_night_brightness_percent=Winter night brightness. Beta 8 default: 5%.
night_brightness_period_days=Brightness, daylight duration and solar output change together. Paranoidal default: 24 days. Season announcements are shown only for years longer than 31 days, as in Beta 8.
nb_debug=Print the day, season, minimum brightness and planned solar multiplier at the daily update.
nb_reset=While enabled, changes to this mod's runtime settings restart the cycle from summer. Settings of other mods do not reset it.
nb_disabled=Stop seasonal changes on Nauvis; restore fixed dawn/dusk, 15% minimum brightness and solar factor 1 (pollution still applies). Startup LUT darkening remains active: select Normal night and restart to remove it.
nb_black_night_darkness=Color lookup tables from Beta 8. Changes require a restart and also affect zoomed map view.

