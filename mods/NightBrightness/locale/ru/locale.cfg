[mod-name]
NightBrightness=Тёмные ночи и сезоны — Paranoidal

[mod-setting-name]
max_night_brightness_percent=Максимальная яркость ночи (%)
min_night_brightness_percent=Минимальная яркость ночи (%)
night_brightness_period_days=Длительность года (дни)
nb_debug=Диагностика сезонов
nb_reset=Сброс к лету при изменении настроек этого мода
nb_disabled=Отключить сезонный цикл
nb_black_night_darkness=Темнота ночи

[mod-setting-description]
max_night_brightness_percent=Яркость летней ночи. По умолчанию в Beta 8: 15%.
min_night_brightness_percent=Яркость зимней ночи. По умолчанию в Beta 8: 5%.
night_brightness_period_days=Яркость ночи, продолжительность светового дня и солнечная мощность изменяются совместно. В Paranoidal по умолчанию 24 дня. Как в Beta 8, сообщения о сезонах появляются только при длительности года больше 31 дня.
nb_debug=При ежедневном обновлении выводить день, сезон, минимальную яркость и запланированный множитель солнечной мощности.
nb_reset=Пока настройка включена, изменение runtime-настроек этого мода перезапускает цикл с лета. Настройки других модов его не сбрасывают.
nb_disabled=Остановить сезонность на Наувисе: фиксированные рассвет и закат, минимальная яркость 15%, сезонный множитель солнечной мощности 1 (загрязнение продолжает влиять). Затемнение через стартовую настройку сохраняется: для его отмены выберите обычную ночь и перезапустите игру.
nb_black_night_darkness=Таблицы цветов из Beta 8. Изменение требует перезапуска и влияет также на приближённый вид карты.

[string-mod-setting]
nb_black_night_darkness-normal-night=Обычная ночь
nb_black_night_darkness-dark-night=Тёмная ночь
nb_black_night_darkness-very-dark-night=Очень тёмная ночь
nb_black_night_darkness-black-night=Чёрная ночь

[night-brightness]
season-summer=Наступило ЛЕТО
season-fall=Наступила ОСЕНЬ
season-winter=Наступила ЗИМА
season-spring=Наступила ВЕСНА
enabled=Night Brightness: сезонный цикл включён
disabled=Night Brightness: сезонный цикл отключён; стартовое затемнение ночи сохраняется
debug=Night Brightness: день __1__, сезон __2__, минимальная яркость __3__, запланированный множитель солнечной мощности __4__
