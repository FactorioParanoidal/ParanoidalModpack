[mod-name]
NightBrightness=Night Brightness — Paranoidal (Тёмные ночи и сезоны — Параноидал)

[mod-setting-name]
max_night_brightness_percent=Максимальная яркость ночи (%)
min_night_brightness_percent=Минимальная яркость ночи (%)
night_brightness_period_days=Длительность года (дни)
nb_winter_tint=Холодные зимние ночи
nb_season_names=Названия сезонов
nb_debug=Диагностика сезонов
nb_reset=Сброс к лету при изменении настроек этого мода
nb_disabled=Отключить сезонный цикл
nb_black_night_darkness=Темнота ночи

[mod-setting-description]
max_night_brightness_percent=Яркость летней ночи. По умолчанию в Beta 8: 15%.
min_night_brightness_percent=Яркость зимней ночи. По умолчанию в Beta 8: 5%.
night_brightness_period_days=Яркость ночи, продолжительность светового дня и солнечная мощность изменяются совместно. В Paranoidal по умолчанию 24 дня. Годы считаются с высадки; новая длительность действует с текущего года.
nb_winter_tint=Зимой сумерки и ночи чуть синее. Дневной свет не меняется.
nb_season_names=Как называются сезоны в чате и в EvoUI: обычно, по длине дня или голосом Buy n Large.
nb_debug=В каждую полночь выводить день календаря, день цикла, сезон, минимальную яркость и множитель солнечной мощности.
nb_reset=Пока настройка включена, изменение runtime-настроек этого мода перезапускает сезоны с лета. Календарь и годы продолжают идти. Настройки других модов его не сбрасывают.
nb_disabled=Остановить сезонность на Наувисе: фиксированные рассвет и закат, минимальная яркость 15%, сезонный множитель солнечной мощности 1 (загрязнение продолжает влиять). Дни и годы продолжают считаться. Затемнение через стартовую настройку сохраняется: для его отмены выберите обычную ночь и перезапустите игру.
nb_black_night_darkness=Таблицы цветов из Beta 8. Ночной оттенок занимает короткую летнюю ночь, более длинные ночи затемняет яркость. Изменение требует перезапуска и влияет также на приближённый вид карты.

[string-mod-setting]
nb_black_night_darkness-normal-night=Обычная ночь
nb_black_night_darkness-dark-night=Тёмная ночь
nb_black_night_darkness-very-dark-night=Очень тёмная ночь
nb_black_night_darkness-black-night=Чёрная ночь
nb_season_names-plain=Лето, осень, зима, весна
nb_season_names-daylight=Долгий день, убывающий день, долгая ночь, прибывающий день
nb_season_names-bnl=Сезоны Buy n Large™

