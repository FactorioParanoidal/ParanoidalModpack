[mod-setting-description]

ic-more-qualities-mode=Пользовательское имя качества для изменения способа работы качеств. Я не рекомендую менять в текущей игре.
ic-more-qualities-multiplier=Множитель эффекта качества. Диапазон: 0,1 - 1000. Значения ниже 1 означают ухудшение качества.
ic-more-qualities-chance-to-upgrade=Процентный шанс для повышения предмета на более высокий уровень качества. Например, значение 0,1 составит 10%. Диапазон: 0,001 - 1,0
ic-more-qualities-chance-dynamic-bonus=Бонус добавляется или вычитается из текущего шанса на более высокое качество, умноженного на уровень качества. Высокий положительный бонус может пропускать целые уровни качества! Отрицательный динамически снижает шанс более высокого качества. Пример: Легендарный — это уровень 4, поэтому бонус * 4 + процентный шанс. 0 - означает отключение.
ic-more-qualities-early-quality=Исследование качественных модулей и разблокировка качеств будут происходить раньше по ходу игры, и модули не будут требовать нефтепродуктов.
ic-more-qualities-localization-full=Формат: [font=default-bold]quality_code=ваше_название, ...[/font]. Отсутствие значения означает, что будет использоваться имя по умолчанию.
ic-more-qualities-localization-only-expand=Формат: [font=default-bold]quality_code=ваше_название, ...[/font]. Отсутствие значения означает, что будет использоваться имя по умолчанию.
ic-more-qualities-localization-rework=Формат: [font=default-bold]quality_code=ваше_название, ...[/font]. Отсутствие значения означает, что будет использоваться имя по умолчанию.
