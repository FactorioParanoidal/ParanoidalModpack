ic-more-qualities-mode-rework=Новая версия (10)

[string-mod-setting-description]

ic-more-qualities-mode-full=Содержит все 40 шт. качеств (возможно, экстремальные по количеству и эффективности последних градаций). Рекомендуется с другими модами или с высоким шансом на более высокое качество.
ic-more-qualities-mode-only-expand=Просто добавляет несколько новых качеств после Легендарного качества с аналогичным коэффициентом эффективности.
ic-more-qualities-mode-rework=Изменит существующие значки качеств и добавит несколько новых после Легендарного качества.

