[mod-setting-name]
ic-more-qualities-defects-preview=Paranoidal: production defects and losses
ic-more-qualities-loss-exclude-finished=Paranoidal: protect finished products from crafting loss
ic-more-qualities-initial-loss-percent=Paranoidal: initial result loss chance (%)
ic-more-qualities-defects-ingredient-mode=Paranoidal: exclude ingredient products from defects
ic-more-qualities-defects-pole-supply-reduction=Paranoidal: pole supply radius reduction at −5
ic-more-qualities-defects-pole-wire-reduction=Paranoidal: pole wire reach reduction at −5

[mod-setting-description]
ic-more-qualities-initial-loss-percent=Empty-result chance before research: 0 to 100%, default 33%. Each quality-control level removes one tenth of the initial chance: 33 → 29.7 → … → 3.3 → 0%. Applies to supported handcraft, machine, drill, pumpjack and mining handlers. Set to 0 to disable losses, not defective quality. Changes affect subsequent rolls; already assigned losses and consumed resources are not reversed. Finished-product protection and handler limitations still apply.
ic-more-qualities-defects-preview=Experimental: use a separate test game only! Handcrafting, machine, drill, pumpjack and natural-object mining handlers are connected. Defects apply to finished products; resources and intermediates are intended to stay standard. Loss chance is configurable: it defaults to 33% and reaches 0% after ten research levels. Machine cycles lasting two ticks or less are skipped. Productivity, fluids and resource depletion use approximations; item safety and loading of this version are NOT engine-verified. Do not disable in saves containing new qualities: items may be lost.
ic-more-qualities-loss-exclude-finished=Protects finished products from losses, not from defects. Disabled by default. Applies to handcrafting and machine handling when all item products of a recipe are finished goods. Does not protect mining, intermediates or fluid-only output. Initial loss chance is configured separately (default 33%) and decreases linearly to 0% over ten research levels. Handcraft queue prerequisites currently have a separate exemption. Existing stockpiles are not converted.
ic-more-qualities-defects-ingredient-mode=Materials (default): excludes resources, intermediates, pipes, tiles and rails; buildings, belts and inserters can still be defective. IMPORTANT: all item ingredients of a recipe require matching quality. A defective building cannot be combined with white components to craft the next tier. The other modes exempt additional ingredient products. Handlers normalize new intermediate results to standard quality; existing stockpiles are unchanged.
ic-more-qualities-defects-pole-supply-reduction=Radius (not diameter) reduction in tiles at −5 relative to standard. At −4 through −1: 4/5 through 1/5 of this amount. Default: 0.5. All pole bases shrink, with a compensating bonus for standard and positive qualities. Bases smaller than the reduction are clamped to zero: standard technical poles may gain unwanted coverage! For example, zero-radius Factorissimo connectors gain 0.5. Set to 0 to disable this change.
ic-more-qualities-defects-pole-wire-reduction=Wire reach reduction in tiles at −5 relative to standard. At −4 through −1: 4/5 through 1/5 of this amount. Default: 1. All pole bases shrink, with a compensating bonus for standard and positive qualities. Bases smaller than the reduction are clamped: standard technical poles may gain unwanted reach. Clamped poles are listed in the log. Set to 0 to disable this change.

[string-mod-setting]
ic-more-qualities-defects-ingredient-mode-materials=Materials only (buildings and belts can be defective)
ic-more-qualities-defects-ingredient-mode-intermediate-ingredients=Also intermediate/science ingredients (including chains)
ic-more-qualities-defects-ingredient-mode-all-ingredients=All recipe ingredients except recycling

[quality-name]
ic-defect-5=−5: Defective
ic-defect-4=−4: Flawed
ic-defect-3=−3: Poor
ic-defect-2=−2: Unsatisfactory
ic-defect-1=−1: Substandard

[quality-description]
ic-defect=Defective quality with reduced supported statistics. Intended for finished products, not resources or intermediates. Belt speed and underground belt distance are unchanged. Research reduces new defects and losses without repairing existing items. Experimental: actual statistics and quality ordering require engine verification.

[technology-name]
ic-defect-control=Quality control __1__

[technology-description]
ic-defect-control-preview=Improves quality distribution for new finished products and reduces production/mining loss chance by one tenth of its initial value (3.3 percentage points by default). After level ten, handlers no longer assign new defects or losses. Level ten is required by the first positive-quality module technology; its other prerequisites are preserved. Existing stockpiles are unchanged. Fast cycles and handcraft queue prerequisites have limitations; the new automation has not been engine-verified.

[ic-defects]
skipped-result=Defects: left result __1__ unchanged to preserve its data (__2__).
skipped-machine=Defects: skipped machine __1__ (__2__).
machine-unsupported-speed=Defects: __1__ completes a cycle in two ticks or less. This machine/drill is skipped; full handling at these speeds is not implemented.
machine-missed-craft=Defects: __1__ completed a craft between checks before result handling. A speed/state change by another mod may be responsible. Products are not removed retroactively.
machine-missed-cycle=Defects: detected a mining cycle change in __1__ before handling. Loss/slowdown for that cycle is unconfirmed; output items are not removed retroactively.
