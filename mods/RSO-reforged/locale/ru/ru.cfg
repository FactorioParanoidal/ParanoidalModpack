[mod-setting-description]
rso-use-donuts=Включение этой опции добавит пончик в качестве возможной формы для рудных месторождений. Это сделает раскладку руды более разнообразной.
rso-shape-crescent=Месторождения в виде дуги примерно в 220 градусов. Любимая форма дживолита и меди. Вблизи старта необычные формы реже; запас руды от формы не зависит. Выключено: эти месторождения получают другие формы.
rso-shape-seam=Длинные узкие изогнутые ленты, как пласт через местность. Любимая форма угля. Вблизи старта необычные формы реже; запас руды от формы не зависит. Выключено: эти месторождения получают другие формы.
rso-shape-specks=Много мелких пятен в 1–2 клетки, рассыпанных по площади месторождения. Любимая форма рубита и урана. Вблизи старта необычные формы реже; запас руды от формы не зависит. Выключено: эти месторождения получают другие формы.
rso-shape-archipelago=Группы небольших рудных островков. Любимая форма бобмониума, стиратита и камня. Вблизи старта необычные формы реже; запас руды от формы не зависит. Выключено: эти месторождения получают другие формы.
rso-shape-star=Редкие месторождения с 4–6 лучами. Любимая форма сапфирита. Вблизи старта необычные формы реже; запас руды от формы не зависит. Выключено: эти месторождения получают другие формы.
rso-shape-chain=Нефть, газ и трещины могут лежать цепочкой скважин вдоль разлома (трещины в 70 % случаев, остальные в 30 %), а не кустом.
rso-starting-richness-mult=Богатство всех начальных месторождений будет умножено на это значение. Заменяет глобальный множитель для стартовой области.
rso-global-richness-mult=Богатство всех месторождений ресурсов будет умножено на это значение.
rso-resource-chance=Вероятность месторождения в каждом регионе (от 0,01 до 1, где 1 означает всегда).
rso-region-size=Размер региона генерации в чанках. На регион приходится примерно одно месторождение (см. шанс спавна ресурсов) и свой бросок вражеских баз; большие значения делают ресурсы реже.
rso-enemy-chance=Шанс вражеских баз в регионе (от 0,01 до 1, где 1 означает всегда); растёт с удалением от старта. Частота строки «Вражеские базы» генератора карты умножает его.
rso-enemy-base-size=Размер Вражеских Баз умножится на это число (больше гнезд и Плевальщиков на базу, базы большего размера).
rso-global-size-mult=Размер месторождений умножится на это число. Больше, чем позволяет регион, месторождение не станет.
rso-remove-trees=Деревья и камни не появляются на месторождениях руды и вокруг скважин нефти и газа.
rso-infinite-ores-in-start-area=Бесконечные руды Angel's: появляются ли бесконечные участки в стартовой зоне.
rso-infinite-ore-threshold=Бесконечные руды Angel's: чем больше значение, тем меньше бесконечное ядро в самой плотной части месторождения (0 — около половины месторождения, 1 — ядра нет).
rso-reveal-spawned-resources=Если включено, каждый созданный чанк с ресурсами наносится на карту всех сил, чтобы месторождения не появлялись на миникарте частично.
rso-distance-exponent=Расширенная настройка - может нарушить игровой баланс и/или игру. \n Экспонента, используемая для расчета увеличения богатства руды с удалением от точки спавна.
rso-fluid-distance-exponent=Расширенная настройка - может нарушить игровой баланс и/или игру. \n Экспонента, используемая для расчета увеличения богатства нефти с удалением от точки спавна.
rso-size-exponent=Расширенная настройка - может нарушить игровой баланс и/или игру. \n Экспонента, используемая для расчета увеличения богатства с удалением от точки спавна.
rso-multi-resource-active=Если включено, дополнительные ресурсы могут быть сгенерированы волнообразно .\nЭто зависит от конфигурации и используется родным генератором и некоторыми большими модами.
rso-oil-in-start-area=Если включено нефть будет присутствовать в стартовой зоне. Если выключено, то она будет генерироваться только вне ее.
rso-ore-in-start-area=Если включено руда будет присутствовать в стартовой зоне. Если выключено, то они будут генерироваться только за ее пределами.
rso-province-weight=Регионы объединены в провинции 3×3 региона. У большинства провинций есть преобладающий ресурс (рудный пояс, угольный бассейн, нефтяное поле): его шанс в каждом регионе провинции умножается на это значение. 1 — провинции выключены.
rso-distance-composition=Руды стартовой зоны чаще встречаются ближе к ней, остальные ресурсы — дальше. Бесконечные ядра руд Angel's растут с расстоянием.
rso-guaranteed-ring=В первом кольце регионов вокруг стартовой зоны месторождение есть в каждом регионе, и каждый ресурс получает там своё месторождение.
rso-vein-chance=Шанс, что у месторождения руды за стартовой зоной будет узкая богатая жила (богатство ×3–5).
rso-guard-chance=Шанс, что на месторождении с богатой жилой или бесконечным ядром стоит увеличенная вражеская база.
rso-mine-ruin-chance=Шанс, что рядом с дальним месторождением с богатой жилой или бесконечным ядром окажутся руины старого прииска (Abandoned Ruins - Paranoidal).
rso-depletion-vein-chance=Шанс на каждую выработанную клетку руды, что рядом найдётся небольшая новая жила той же руды.

[autoplace-control-names]
rso-fields=Месторождения RSO (все)

[autoplace-control-description]
rso-fields=Все месторождения RSO Reforged сразу, поверх строк отдельных ресурсов.\nЧастота: плотность месторождений (больше и ближе друг к другу или меньше и дальше).\nРазмер: размер каждого месторождения, включая стартовые.\nБогатство: запас каждого месторождения и скважины, включая стартовые.\nВыключено: месторождений RSO нет совсем.

