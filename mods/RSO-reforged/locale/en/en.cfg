[mod-setting-description]
rso-use-donuts=Enabling this settings will add donut as possible shape type for ore patches. It will make ore patch layouts more varied.
rso-starting-richness-mult=Richness of all starting resource patches will be multiplied by this value. Replaces global multiplier for starting area.
rso-global-richness-mult=Richness of all resource patches will be multiplied by this value.
rso-resource-chance=Chance of a resource field per region (0.01 - 1, 1 means always).
rso-region-size=Size of a generation region in chunks. A region holds about one resource field (see the resource chance) and its own roll of enemy bases; bigger values make resources sparser.
rso-enemy-chance=Chance of enemy bases per region (0.01 - 1, 1 means always); it grows with the distance from the start. The frequency of the "Enemy bases" row of the map generator multiplies it.
rso-enemy-base-size=Enemy bases size will be multiplied by this value(more spawners and turrets per base, larger bases).
rso-global-size-mult=Size of resource fields will be multiplied by this value. A field never gets larger than its region allows.
rso-remove-trees=Trees and rocks are not placed on ore fields and around oil and gas wells.
rso-infinite-ores-in-start-area=Angel's infinite ores integration - should infinite patches appear in starting area.
rso-infinite-ore-threshold=Angel's infinite ores: the higher the value, the smaller the infinite core in the densest part of a field (0 - about half of the field, 1 - no core).
rso-reveal-spawned-resources=When enabled every generated chunk with resources is charted for all forces, so fields do not appear half revealed on the minimap.
rso-distance-exponent=Advanced setting - can break game balance and/or game.\n Exponent used to calculate ore richness increase with distance from center.
rso-fluid-distance-exponent=Advanced setting - can break game balance and/or game.\n Exponent used to calculate fluid richness increase with distance from center.
rso-size-exponent=Advanced setting - can break game balance and/or game.\n Exponent used to calculate size increase with distance from center.
rso-multi-resource-active=When enabled additional resources can be generated along the primary rolled resource patch. It depends on configuration and it's used by vanilla and some big mods.
rso-oil-in-start-area=When true oil will be present in starting area. If false then it will be only generated outside of it.
rso-ore-in-start-area=When true ores will be present in starting area. If false then they will be only generated outside of it.
rso-province-weight=Regions are grouped into provinces of 3×3 regions. Most provinces have a dominant resource (an ore belt, a coal basin, an oil field) whose chance in every region of the province is multiplied by this value. 1 turns provinces off.
rso-distance-composition=Ores of the starting area are found more often close to it, the other resources further away. Infinite cores of Angel's ores grow with the distance.
rso-guaranteed-ring=The first ring of regions around the starting area holds a field in every region, and every resource gets a field in it.
rso-vein-chance=Chance that an ore field outside the starting area gets a narrow rich vein (3–5× richness).
rso-guard-chance=Chance that a field with a rich vein or an infinite core gets a bigger enemy base on it.
rso-mine-ruin-chance=Chance that a far field with a rich vein or an infinite core gets the ruin of an old mine next to it (Abandoned Ruins - Paranoidal).
rso-depletion-vein-chance=Chance per depleted ore tile that a small new vein of the same ore is found nearby.

[autoplace-control-names]
rso-fields=RSO fields (all)

[autoplace-control-description]
rso-fields=All resource fields of RSO Reforged at once, on top of the rows of the single resources.\nFrequency: density of fields (more and closer fields, or fewer and further apart).\nSize: size of every field, starting fields included.\nRichness: amount of every field and well, starting fields included.\nOff: no RSO fields at all.

