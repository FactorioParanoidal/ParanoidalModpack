[mod-setting-description]
rso-use-donuts=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Adds ring-shaped ore fields with an empty centre as one possible shape. Other field shapes remain available.
rso-shape-crescent=Fields shaped as an arc of about 220 degrees. Jivolite and copper favour it. Unusual shapes are rarer near the start; every shape holds the same amount of ore. Off: these fields take other shapes.
rso-shape-seam=Long narrow bent bands, like a seam across the land. Coal favours it. Unusual shapes are rarer near the start; every shape holds the same amount of ore. Off: these fields take other shapes.
rso-shape-specks=Many small spots of 1-2 tiles scattered over the field area. Rubyte and uranium favour it. Unusual shapes are rarer near the start; every shape holds the same amount of ore. Off: these fields take other shapes.
rso-shape-archipelago=Groups of small islands of ore. Bobmonium, stiratite and stone favour it. Unusual shapes are rarer near the start; every shape holds the same amount of ore. Off: these fields take other shapes.
rso-shape-star=Rare fields with 4-6 rays. Sapphirite favours it. Unusual shapes are rarer near the start; every shape holds the same amount of ore. Off: these fields take other shapes.
rso-shape-chain=Oil, gas and fissures can lie as a chain of wells along a fault line (fissures 70 %, the others 30 %) instead of a cluster.
rso-starting-richness-mult=Richness of all starting resource patches will be multiplied by this value. Replaces global multiplier for starting area.
rso-global-richness-mult=Richness of all resource patches will be multiplied by this value.
rso-resource-chance=Chance of a resource field per region (0.01 - 1, 1 means always).
rso-experimental=On: generation as in RSO Reforged 9.2.0 (fixed arc of starting fields, partner ore in stripes, frequent stars and specks, big far infinite cores, guard bases on the ore). Off: random starting fields that may lie close to each other, no straight cuts between neighbouring fields, no stripes, rare stars and specks that never appear near the start, smaller far infinite cores, guard bases beside the field. In a started map keep the value it was generated with, else new chunks may cut fields at the border.
rso-region-size=Size of a generation region in chunks. A region holds about one resource field (see the resource chance) and its own roll of enemy bases; bigger values make resources sparser.
rso-enemy-chance=[img=__bobenemies__/graphics/icons/biter-spawner.png] Base frequency of ordinary enemy bases. The map generator's Enemy bases frequency multiplies it; distance from the start adds a multiplier capped at 3. Even 1 does not guarantee a base in every region: this value is used to calculate placement density.
rso-enemy-base-size=Enemy bases size will be multiplied by this value(more spawners and turrets per base, larger bases).
rso-global-size-mult=Size of resource fields will be multiplied by this value. A field never gets larger than its region allows.
rso-remove-trees=Trees and rocks are not placed on ore fields and around oil and gas wells.
rso-infinite-ores-in-start-area=Angel's infinite ores integration - should infinite patches appear in starting area.
rso-infinite-ore-threshold=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] For Angel's infinite ores: higher values make the central infinite-ore area smaller. 0 gives the largest area; 1 removes the core. Actual size also depends on distance and the infinite resource's map-generator size setting.
rso-reveal-spawned-resources=When enabled every generated chunk with resources is charted for all forces, so fields do not appear half revealed on the minimap.
rso-distance-exponent=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Advanced setting — may break game balance and/or the game.\nExponent controlling how ore amounts grow with distance from the nearest starting position. Distance is measured in RSO regions. Higher values increase the growth of reserves in distant fields.
rso-fluid-distance-exponent=[img=__base__/graphics/icons/crude-oil-resource.png] Advanced setting — may break game balance and/or the game.\nExponent controlling how the initial amount of liquid resource in wells grows with distance from the nearest starting position. Distance is measured in RSO regions. Higher values increase the growth of reserves in distant wells.
rso-size-exponent=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Advanced setting — may break game balance and/or the game.\nExponent controlling how ore-field size and the number of wells grow with distance from the nearest starting position, measured in RSO regions. This is not the per-tile or per-well resource-amount multiplier; those have separate settings.
rso-multi-resource-active=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Allows two resources in one field: a primary ore or liquid resource may be accompanied by a partner resource. Resource pairs and the chance of a mixed field depend on their configuration.
rso-oil-in-start-area=When true oil will be present in starting area. If false then it will be only generated outside of it.
rso-ore-in-start-area=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Enables starting ore fields around the initial position. When disabled, RSO does not create these starting fields. Starting liquid resources are not affected; oil has its own switch.
rso-province-weight=Regions are grouped into provinces of 3×3 regions. Most provinces have a dominant resource (an ore belt, a coal basin, an oil field) whose chance in every region of the province is multiplied by this value. 1 turns provinces off.
rso-distance-composition=Resource selection takes distance from the nearest starting position into account: starting-area ores are more common nearby, and other resources farther away.
rso-guaranteed-ring=The first ring of regions around the starting area holds a field in every region, and every resource gets a field in it.
rso-vein-chance=Chance that an ore field outside the starting area gets a narrow rich vein (3–5× richness).
rso-guard-chance=[img=__bobenemies__/graphics/icons/biter-spawner.png] Chance of a larger enemy base at a rich field, from two RSO regions away from the start. Requires a richer ore vein or an infinite core with an estimated area of at least 8 tiles. Range 0–1: 0 disables these guards; 1 selects every eligible field. Experimental mode places the base on the ore; otherwise it is placed beside the field.
rso-mine-ruin-chance=Chance of old-mine ruins beside a rich field, at least four RSO regions from the nearest start. Requires a rich vein or infinite core and a compatible ruins mod. 0 disables it; 1 attempts placement at every eligible field. Placement may be skipped if the site has not yet been generated.
rso-depletion-vein-chance=Chance per depleted ore tile that a small new vein of the same ore is found nearby.

[autoplace-control-names]
rso-fields=RSO fields (all)

[autoplace-control-description]
rso-fields=All resource fields of RSO Reforged at once, on top of the rows of the single resources.\nFrequency: density of fields (more and closer fields, or fewer and further apart).\nSize: size of every field, starting fields included.\nRichness: amount of every field and well, starting fields included.\nOff: no RSO fields at all.

