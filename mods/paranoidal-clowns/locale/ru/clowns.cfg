[mod-name]
paranoidal-clowns=Paranoidal Clowns (Переработка и ядерная часть MadClown01)

[mod-description]
paranoidal-clowns=Моды MadClown01 поверх Angels в одном: переработка (MadClown01's Processing), ядерная часть (Vanilla Nuclear) и ядерное дополнение для связки Angels и Bob's (AngelBob Nuclear).\n\n— Шлюзовой промыватель: отмывка песка и шлама с получением руд.\n— Осмий: руда, гранулы, порошок, пластины и боеприпасы из него.\n— Ртуть, фтор, фосфор, магний, переработка урана через фториды и оксиды.\n— Каталитический электролиз и фильтрация, нейротоксин, генерация и мутация садов для Angels Bioprocessing.\n— Плутоний и торий: топливные элементы, их переработка, смешанное оксидное топливо и плутониевая атомная бомба.\n— Обогащение урана по ступеням (20%, 35%, 45% … 80% урана-235) на центрифугах — вместо процесса Коварекса.\n— Изотопы (цезий-137, стронций-90, полоний-210, кобальт-60 и др.), радиотермальное, гипер- и турбоядерное топливо.\n— Термоядерная бомба, ядерные и термоядерные артиллерийские снаряды — оружие против поздних врагов Bob's.

