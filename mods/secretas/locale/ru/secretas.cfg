[mod-setting-description]
modify-loaders-for-belt-stack-size-limit=Если выбрано, все прототипы погрузчиков будут изменены, увеличив предел вместимости конвейеров, чтобы они могли работать и при увеличении размера стопки.
ignore-dea-dia-compatibility=Если выбрано, мод будет вести себя, как будто мод Dea Dia не установлен, даже если он присутствует. В настоящее время включено по умолчанию, так как совместимость все еще находится в разработке.
restrict-steam-recycler-crafting-to-frozeta=Если выбрано, паровой переработчик будет доступен к созданию только на Фрозете.
condense-level-4-modules-into-one-technology=Если выбрано, все модули 4 уровня будут привязаны к одной технологии. Если же не выбрано, каждый модуль 4 уровня будет иметь свою технологию.
check-this-if-frozeta-start=Должно быть выбрано, если начинаете на Фрозете для ее корректной работы.
automatically-populate-science-pack-productivity-research=Если выбрано, будет произведена попытка добавить все исследовательские пакеты в исследование продуктивности исследовательских пакетов. Отключите при конфликте модов.

