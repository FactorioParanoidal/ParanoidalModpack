[mod-name]
secretas=Secretas&Frozeta (Секрета и Фрозета)

[mod-description]
secretas=Планеты Секрета и Фрозета — дальше Аквило.\n\n— Секрета — газовый гигант в плотном кольце астероидов: на её орбите платформы дробят ауритовые астероиды.\n— Фрозета — ледяная луна Секреты и кладбище разбитых кораблей: их обломки разбирают на детали, машинам нужен обогрев, как на Аквило.\n— Из аурита делают ауритовый исследовательский пакет, гипер-манипулятор, ауритовые тепловые трубы, рельсотронную турель и ауритовые модули.\n\nВ Paranoidal открываются только после ракеты и до неё ничего не меняют. Аурит — свой металл планеты, а не домашнее золото.

[space-location-name]
secretas=Секрета
frozeta=Фрозета

[space-location-description]
secretas=Защитник галактики. Крупные объекты, которые могли бы врезаться в планеты, обычно захватываются Секретой, а планета настолько массивная, что искривляет орбиты большинства внешних небесных тел. Эта газообразная планета окружена плотным кольцом астероидов, из-за чего достижение стабильной орбиты вокруг нее является сложной задачей. Многие отправлялись на эту планету, чтобы собрать редкометалльные астероиды вокруг Секреты, но были уничтожены. Обломки кораблей либо упали на его самую большую луну Фрозету, либо навсегда затерялись в недрах Секреты.
frozeta=Покрытая плотным слоем льда, эта планета изуродована астероидами и заполнена кладбищами кораблей, уничтоженных плотным астероидным полем Секреты. Здесь много обломков космических кораблей, из которых можно извлечь продвинутые технологии. Получает меньше солнечного света, чем Аквило, и точно так же требует наличия отопительной инфраструктуры для работы любых машин.

