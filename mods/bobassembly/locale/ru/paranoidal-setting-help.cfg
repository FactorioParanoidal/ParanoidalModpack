[mod-setting-description]
bobmods-assembly-electronicmachines=[item=electronic-circuit] Добавляет специализированные сборочные машины Bob для проводов и электроники. Им открываются соответствующие категории рецептов; обычные сборочные автоматы не отключаются. Это расширение выбора машин, а не бесплатное изготовление схем.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
bobmods-assembly-furnaces=[item=electric-furnace] Добавляет улучшенные уровни электрических печей Bob. Их нужно исследовать и изготовить; настройка не ускоряет автоматически все существующие печи и не заменяет собой питание или подачу сырья.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
bobmods-assembly-oilfurnaces=[fluid=light-oil] Добавляет печи Bob, использующие жидкое топливо. Для работы требуется подходящая горючая жидкость; это отдельная линейка печей, а не переключение всех электрических печей на нефть.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
