[mod-setting-description]
bobmods-assembly-electronicmachines=[item=electronic-circuit] Adds Bob’s specialized assembly machines for cables and electronics, with the relevant recipe categories. Ordinary assembling machines remain available; this expands machine choices rather than producing circuits for free.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
bobmods-assembly-furnaces=[item=electric-furnace] Adds Bob’s upgraded electric-furnace tiers. Research and craft them separately; the setting does not automatically speed up every existing furnace or replace power and ingredient supply.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
bobmods-assembly-oilfurnaces=[fluid=light-oil] Adds Bob’s fluid-fuel furnaces. Supply a compatible combustible fluid to run them; this is a separate furnace family, not a conversion of all electric furnaces to oil.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
