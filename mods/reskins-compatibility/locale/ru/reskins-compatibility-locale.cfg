[mod-name]
reskins-compatibility=Artisanal Reskins: Compatibility (Артизанал Рескинс: совместимость)

[mod-description]
reskins-compatibility=Artisanal Reskins для других модов: приводит к общему стилю графику модов, которые работают вместе с Bob's и Angels, но не входят в основные пакеты рескинов.\n\nЦвета и метки уровней, обновлённые модели и значки — чтобы вся сборка выглядела единообразно. Только внешний вид.

[mod-setting-name]
reskins-compatibility-extendedangels-warehouse-tiering=мод "Extended Angels": Уровни складов

[mod-setting-description]
reskins-compatibility-extendedangels-warehouse-tiering=Перерисовывает склады и логистические склады для отображения соотв. цвета на здании и значках для обозначения их уровня.

