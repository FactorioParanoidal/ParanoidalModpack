todolist-show-log=Show debug log messages in the chat window.
todolist-window-height=Todo list window height
todolist-auto-assign=Auto-assign tasks
todolist-click-edit-task=Edit task on middle click
todolist-translation-mode=Text style

[mod-setting-description]
todolist-show-button=If enabled will always show a "Todo List" button in the top left.\nIf disabled the todo list can only be accessed by its hotkey (default shift-t).
todolist-show-log=If enabled the mod will print debug messages to the chat window.\nAttention: there are a lot of them :)
todolist-window-height=Task-list scroll-area height in interface pixels at 100% GUI scale. Default: 600; the whole window is taller because of its header and buttons. The export list uses half this value. GUI scale affects the actual screen size.
todolist-auto-assign=Automatically selects the current player as assignee only when the save contains exactly one created player; offline players count too. Applies when adding a task or opening an edit form without an existing assignee, not by automatically reassigning all tasks.
todolist-click-edit-task=Mouse button used on a task title to open its editor: right button (default) or middle button.
todolist-translation-mode=Interface wording style: ordinary task list or quest log. Changes interface labels, not the text of tasks written by players.

