[mod-setting-name]
otsr-slot-weight=Weight of a full cargo slot
otsr-fluid-weight=Weight of one fluid unit
otsr-minimum-acceleration=Minimum acceleration

[mod-setting-description]
otsr-slot-weight=Weight of a completely filled cargo-wagon slot in rolling stock weight units (cargo wagon 1000, locomotive 2000). A partial stack weighs in proportion to its fill. Train acceleration is multiplied by train weight / (train weight + cargo weight), so more locomotives and wagons mean less slowdown from the same cargo. At 150 a full base 20-slot wagon is four times as heavy as an empty one. 0 ignores items.
otsr-fluid-weight=Weight of one unit of fluid in a fluid wagon in the same units. At 0.12 a full base 25 000 fluid wagon is four times as heavy as an empty one. 0 ignores fluids.
otsr-minimum-acceleration=Lower bound of the acceleration multiplier even for a very heavy train. 1 disables the slowdown. Braking and top speed are not changed.

[otsr]
command-help=Shows the load and acceleration multiplier of the train under the cursor or the train you are riding.
no-train=Hover over a locomotive or wagon, or get into a train.
info=Train __1__: rolling stock weight __2__, cargo __3__ full slots and __4__ fluid units, cargo weight __5__. Acceleration multiplier __6__ (__7__).
status-hot=accelerating, checked every tick
status-cold=moving, sampled
status-idle=not tracked: standing or empty
