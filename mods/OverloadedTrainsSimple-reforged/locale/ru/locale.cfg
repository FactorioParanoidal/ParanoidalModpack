[mod-setting-name]
otsr-slot-weight=Вес полной ячейки груза
otsr-fluid-weight=Вес единицы жидкости
otsr-minimum-acceleration=Минимальный разгон

[mod-setting-description]
otsr-slot-weight=Вес полностью заполненной ячейки грузового вагона в единицах веса подвижного состава (грузовой вагон — 1000, локомотив — 2000). Неполная стопка весит пропорционально заполнению. Разгон поезда умножается на вес состава / (вес состава + вес груза), поэтому больше локомотивов и вагонов — меньше замедление от того же груза. При 150 полный обычный вагон на 20 ячеек вчетверо тяжелее пустого. 0 — предметы не учитываются.
otsr-fluid-weight=Вес одной единицы жидкости в цистерне в тех же единицах. При 0,12 полная обычная цистерна на 25 000 вчетверо тяжелее пустой. 0 — жидкость не учитывается.
otsr-minimum-acceleration=Нижняя граница множителя разгона даже для очень тяжёлого состава. 1 — мод не замедляет разгон. Торможение и максимальная скорость не меняются.

[otsr]
command-help=Показывает загрузку и множитель разгона поезда под курсором или поезда, в котором вы едете.
no-train=Наведите курсор на локомотив или вагон либо сядьте в поезд.
info=Поезд __1__: вес состава __2__, груз __3__ полных ячеек и __4__ ед. жидкости, вес груза __5__. Множитель разгона __6__ (__7__).
status-hot=разгоняется, проверка каждый тик
status-cold=в движении, выборочная проверка
status-idle=не отслеживается: стоит или пуст
