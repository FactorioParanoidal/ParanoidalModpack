Repair_Turret=Paranoidal fork: a repair-only turret. Heals damaged friendly buildings, vehicles and characters nearby using repair packs from its own slot.

[entity-name]
repair-turret=Repair turret

[entity-description]
repair-turret=Repairs damaged friendly buildings, vehicles and characters around itself: a 14×14 tile square (range 7 from the centre), 20 HP/s, one target. Range, speed and simultaneous targets grow with research; the area is shown on hover.\nNeeds repair packs in its own slot: one pack repairs as much as by hand.\nPower: 500 kW idle and 1 MW per 20 HP/s of repair (1.5 MW without upgrades).

