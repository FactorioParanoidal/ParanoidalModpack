[technology-description]
repair-turret=A turret that repairs nearby friendly buildings with repair packs.
repair-turret-speed=Repair turrets heal faster. Energy and repair packs per HP stay the same, so consumption grows with speed.
repair-turret-beams=The repair turret heals one more target at the same time. Each beam uses its own energy and repair packs.
repair-turret-range=Repair turrets reach 1 tile further in every direction.

