[mod-description]
Repair_Turret=Форк Paranoidal: турель только для ремонта. Чинит повреждённые дружественные постройки, технику и персонажей рядом, расходуя ремкомплекты из своего слота.

[entity-name]
repair-turret=Ремонтная турель

[entity-description]
repair-turret=Чинит повреждённые дружественные постройки, технику и персонажей вокруг себя: квадрат 14×14 клеток (радиус 7 от центра), 20 ОЗ/с, одна цель. Радиус, скорость и число одновременных целей растут с исследованиями; зона видна при наведении.\nНужны ремкомплекты в собственном слоте: один комплект чинит столько же, сколько вручную.\nЭнергия: 500 кВт в простое и 1 МВт на каждые 20 ОЗ/с ремонта (1,5 МВт без улучшений).

