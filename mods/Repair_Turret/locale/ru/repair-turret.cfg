[technology-description]
repair-turret=Турель, которая чинит ближайшие дружественные постройки ремкомплектами.
repair-turret-speed=Ремонтные турели чинят быстрее. Энергия и ремкомплекты на единицу здоровья тратятся так же, поэтому потребление растёт вместе со скоростью.
repair-turret-beams=Ремонтная турель чинит ещё одну цель одновременно. Каждый луч тратит свою энергию и ремкомплекты.
repair-turret-range=Ремонтные турели чинят на 1 клетку дальше во все стороны.

