[mod-setting-description]
alien-biomes-terrain-scale=Biyomların boyutunu arttırır ya da azaltır. Düşük değerler daha küçük, ama daha sık biyomlar üretir. Varsayılan olarak 100.
alien-biomes-temperature-low=Gezegendeki en düşük sıcaklıklar. Düşürdükçe donmuş kar ve buz miktarı artar. Arttırdıkça donmuş alanlar seyrekleşir, ya da görülmez. Varsayılan olarak -50.
alien-biomes-temperature-high=Gezegendeki en yüksek sıcaklıklar. Arttırdıkça volkanik alanlar artar. Azalttıkça volkanik alanlar seyrekleşir, ya da görülmez. Varsayılan olarak 150.
alien-biomes-humidity-low=Gezegendeki en düşük nem oranları. Düşürdükçe çöl alanlar artar. Arttırdıkça çöl alanlar seyrekleşir, ya da görülmez. Varsayılan olarak 0.
alien-biomes-humidity-high=Gezegendeki en yüksek nem oranları. Arttırdıkça çimenli alan miktarı artar. Azalttıkça çimenli alanlar seyrekleşir, ya da görülmez. Varsayılan olarak 100.
alien-biomes-aux-low=Gezegendeki en düşük renk farklılıkları. Düşürdükçe yeşil / kahverengi / kavruk renk miktarı artar. Arttırdıkça yeşil / kahverengi / kavruk renk miktarı seyrekleşir. Varsayılan olarak 0.
alien-biomes-aux-high=Gezegendeki en yüksek renk farklılıkları. Arttırdıkça mavi / mor / kırmızı renk miktarı artar. Düşürdükçe mavi / mor / kırmızı renk miktarı seyrekleşir. Varsayılan olarak 100.
alien-biomes-disable-vegetation=Etkinleştirildiğinde bütün çimenli araziler, ağaçlar, ve bitki temalı dekoratif grafikler kaldırılır (başka bir mod tarafından eklenmediği sürece). Bu şekilde ortamı ölü bir gezegene, aya, ya da asteroide benzetebilirsiniz.
alien-biomes-remove-obsolete-tiles=Alien Biomes vanilyadan gelen bir sürü karonun yerine yenisini koyar. Bu kullanılmayan karoları kaldırıp 20 karo için yer açabilirsiniz (oyundaki toplam limit 255'tir). Ancak bu karoları kullanan başka modlar etkinse bu ayar sorun yaratabilir.
tile-speed-reduction=Bazı karolar (sıcak volkanik araziler gibi) oyuncunun hızını düşürür. Bu sayıyı azalttıkça arazi oyuncuyu daha az yavaşlatır.
alien-biomes-reduced-tiles=Kısıtlı Karo Çeşitleri
