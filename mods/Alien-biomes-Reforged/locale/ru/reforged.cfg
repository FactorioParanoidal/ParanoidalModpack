[mod-setting-description]
alien-biomes-reforged-atlas=Обычно: полная графика ландшафта.\nЭкономно: для видеокарт с малым объёмом памяти. Одна текстура на семейство почв, без вариантов тайлов 4×4 и с половиной вариантов 2×2, треть форм декалей, похожие виды деревьев с общей графикой, половина вариантов деревьев, без карт нормалей деревьев. Использует только графику мода; переключать можно и на существующей карте — меняется только внешний вид.

