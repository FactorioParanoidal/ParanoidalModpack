[mod-setting-description]
alien-biomes-reforged-atlas=Обычно: полная графика ландшафта.\nЭкономно: для видеокарт с малым объёмом памяти. Одна текстура на семейство почв, без вариантов тайлов 4×4 и с половиной вариантов 2×2, треть форм декалей, похожие виды деревьев с общей графикой, половина вариантов деревьев, без карт нормалей деревьев. Использует только графику мода; переключать можно и на существующей карте — меняется только внешний вид.
alien-biomes-reforged-geology=Руды вдвое чаще встречаются в регионах с почвой подходящего цвета: сапфирит — на синих и фиолетовых, живолит — на кремовых, жёлтых и tan, стиратит — на зелёной, оливковой и бирюзовой траве, кротиний — на серых и белых, рубит — на красных, dusty rose и оранжевых, бобмоний — на коричневых и бежевых, уголь — на чёрных, нефть, газ и разломы — на вулканической земле. Ни одна руда нигде не исчезает; стартовая зона не меняется. Работает с Resource Spawner Overhaul и влияет только на регионы, сгенерированные после изменения.

[string-mod-setting]
alien-biomes-reforged-atlas-normal=Обычно
