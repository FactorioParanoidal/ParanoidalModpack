[mod-setting-name]
alien-biomes-reforged-atlas=Terrain graphics memory

[mod-setting-description]
alien-biomes-reforged-atlas=Normal: full terrain graphics.\nEconomy: for graphics cards with little memory. One texture per terrain family, no 4×4 and half of the 2×2 tile variants, a third of the decal shapes, similar tree species share graphics, half of the tree variants, no tree normal maps. Uses only the graphics already in the mod; safe to switch on an existing map (only the look changes).

