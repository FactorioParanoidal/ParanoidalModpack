[mod-setting-description]
alien-biomes-terrain-scale=星球的生物群系的大小。較低的值會產生較小且更頻繁的生物群系。預設值為 100。
alien-biomes-temperature-low=星球上最低的極端溫度。減少會增加更多的凍雪和冰。增加會使冰凍區域變得不常見或不存在。預設值為 -50。
alien-biomes-temperature-high=星球上更高的極端溫度。增加會產生更多火山區域。減少會產生較少火山地區或不存在。預設值為 150。
alien-biomes-humidity-low=星球的乾燥程度，增加沙漠區域會減少或消失；如果減少沙漠區域則會增加。
alien-biomes-humidity-high=星球的草地面積。增加會更多草地面積。減少會使草地變得不那麼常見或不存在。預設值為 100。
alien-biomes-aux-low=星球顏色變化的最低值。減少會增加更多綠色/棕色/棕褐色。增加會使綠色/棕色/棕褐色不那麼常見。預設值為 0。
alien-biomes-aux-high=星球顏色變化最高值。增加會更多藍色/紫色/紅色。減少會藍色/紫色/紅色不那麼常見。預設值為 100。
alien-biomes-disable-vegetation=如果啟用，所有草地、樹木和植物裝飾物都將被移除（除非由不同的模式增加）。這使你可以模擬一個死亡的行星、衛星或小行星。
alien-biomes-remove-obsolete-tiles=外星生物群取代了許多原始區塊。可以移除過時的區塊以釋放 20 個額外的區塊地區，以便可以使用更多增加出來的模組（區塊數量限制為 255 個）。這樣做可能會導致這些原版的其他模組出現問題。
alien-biomes-reduced-tiles=減少區塊變體
tile-speed-reduction=有些區塊（例如炎熱的火山地形）會降低玩家的速度。減少這個數字意味著地形對玩家的影響較小。
