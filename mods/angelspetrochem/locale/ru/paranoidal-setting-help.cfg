[mod-setting-description]
angels-show-chemical-formula=[fluid=sulfuric-acid] Добавляет химические формулы в описания поддерживаемых веществ Angels, например H2 или CO2. Это справочная подпись: состав рецептов, свойства веществ и расход сырья не меняются.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
