[mod-setting-description]
cen-quick-craft-count=[img=utility/character_crafting_speed_modifier_icon] Target item count for one Cursor Enhancements quick-craft action. Recipe executions round up: a recipe producing two items queues three executions for a target of five. If materials are limited, only the craftable amount is queued.\n[color=#9cdcfe]Default: 5. Range: 1–200. Personal setting.[/color]
