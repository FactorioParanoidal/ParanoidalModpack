[mod-description]
CursorEnhancements=Делает курсор умнее.\n\n— Умная пипетка (Q): берёт предмет из инвентаря, а если его нет — берёт призрак для строительства роботами.\n— Быстрый крафт (Ctrl+Q): создаёт предмет, который сейчас в курсоре или под ним.\n— Возврат последнего предмета в курсор (Shift+Q).\n— Прокрутка связанных предметов (Shift+Alt+колесо): быстро переключает, например, конвейер → подземный → разделитель или манипуляторы разных уровней.\n— Автопризрак: когда предмет в курсоре кончился, курсор переходит в режим призраков.\n\nКоличество для быстрого крафта и автопризрак настраиваются.

[mod-name]
CursorEnhancements=Cursor Enhancements (Улучшения курсора)

[mod-setting-description]
cen-auto-ghost-cursor=Заменяет предмет призраком, когда он кончается у вас в руке. Заменяет призрак на реальный предмет, когда он появляется в инвентаре.

[mod-setting-name]
cen-auto-ghost-cursor=Автоматическое размещение призраков
cen-quick-craft-count=Счётчик быстрого крафта

