[mod-setting-description]
cen-quick-craft-count=[img=utility/character_crafting_speed_modifier_icon] Число готовых предметов, на которое рассчитано одно нажатие быстрого крафта Cursor Enhancements. Число запусков рецепта округляется вверх: если рецепт даёт два предмета, запрос пяти поставит в очередь три запуска. При нехватке материалов заказывается только доступное количество.\n[color=#9cdcfe]По умолчанию: 5. Диапазон: 1–200. Только для вас.[/color]
