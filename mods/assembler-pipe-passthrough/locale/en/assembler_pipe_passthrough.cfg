[mod-setting-name]
app_assembling_machines=Add extra pipes to Assembling Machines?
app_oil_refineries=Add extra pipes to Oil Refineries?
app_chemical_plants=Add extra pipes to Chemical Plants?

[mod-setting-description]
app_assembling_machines=Allows pass-through pipe connections for vanilla assembling machines 1–3, letting fluid travel along a row of machines. Modded machines are checked independently of this switch, but blacklisted machines and those with unsuitable geometry or pipe connections are left unchanged.
app_oil_refineries=Allows pass-through pipe connections for the vanilla oil refinery, letting fluid travel along a row of machines. Modded machines are checked independently of this switch, but blacklisted machines and those with unsuitable geometry or pipe connections are left unchanged.
app_chemical_plants=Allows pass-through pipe connections for the vanilla chemical plant, letting fluid travel along a row of machines. Modded machines are checked independently of this switch, but blacklisted machines and those with unsuitable geometry or pipe connections are left unchanged.
