[achievement-description]
flo-fuse=Увидеть, как огонь пробежал по 100 трубам подряд. Красиво. Дорого. Ваше.
flo-catastrophe=Оказаться рядом, когда перегретый резервуар взлетит на воздух. Вид из первого ряда, билет в один конец.
flo-tank-saved=Слить горящий резервуар до взрыва. Пожарные аплодируют, страховщики выдыхают.
flo-cookoff=Оказаться рядом со складом боеприпасов, сдетонировавшим 50 раз. Новогодний салют, только без Нового года.
flo-trap=Разбудить старую нефтяную ловушку в руинах. Предки оставили вам наследство. Горящее.
flo-smog=Оказаться рядом со взрывом, выбросившим не меньше 20000 загрязнения. Жуки уже собираются на разбор полётов.

