[flo-demo]
start=[color=yellow]Демонстрация Flammable Oils: пять площадок на восток от вас. Следите за значками на карте и чатом. Достижения в этом сохранении консоль уже отключила.[/color]
busy=В тестовой зоне (150 клеток на восток) есть ваши постройки. Встаньте на пустое место и повторите команду:
fuse=1. Через 3 с загорится дальний конец трубопровода: огонь пробежит 40 труб до полного резервуара, рядом ящики с боеприпасами. Резервуар горит 60 с, со второй половины чёрный дым, затем взрыв; боеприпасы детонируют.
saved=2. Через 5 с загорится резервуар с газом; через 40 с его сольют - пожар погаснет.
drained=Резервуар 2 слит.
chem=3. Через 12 с будут уничтожены два химзавода: ядовитый рецепт (ядовитое облако) и горючий (пожар).
no-toxic=Для химзавода не нашёлся рецепт с ядовитым газом.
no-fire=Для химзавода не нашёлся рецепт с горючей жидкостью.
cook=4. Через 8 с начнёт рваться склад боеприпасов: сначала редко, потом всё чаще, гранаты летят на 14 клеток.
trap=5. Ловушка из руин: подойдите сами ближе __1__ клеток к этой точке и бегите - труба тлеет, огонь бежит к резервуару, и он взрывается.
