[mod-name]
paranoidal-flammable-fluids=Paranoidal Flammable Fluids (Горючие жидкости Параноидал)

[mod-description]
paranoidal-flammable-fluids=Горючие жидкости опасны: трубы, резервуары и машины с нефтью, топливом, газами и другими горючими жидкостями загораются и взрываются при разрушении.\n\n— Сила взрыва и пожара зависит от того, сколько энергии содержит жидкость внутри.\n— Огонь распространяется по трубам и соседним резервуарам; перегретый резервуар может взорваться через несколько секунд.\n— Водород и дейтерий особенно летучи: взрываются при любом разрушении, даже одна труба.\n— Сгоревшая жидкость даёт загрязнение. Есть оповещения о пожарах и свои достижения.\n— Пожарные турели на воде тушат огонь, кислоту и облака врагов; в их круге ничего не загорается и не детонирует.\n\nНефтехимию лучше защищать стенами и пожарными турелями и не строить вплотную к заводу. Множители радиуса, урона и загрязнения настраиваются. Авторы исходного мода — Klonan и OwnlyMe.

[entity-name]
pd-fire-safety-turret=Пожарная турель
pd-fire-safety-turret-mk2=Пожарная турель МК-2
flo-long-fire=Огонь
flo-tank-fire=Огонь

[entity-description]
pd-fire-safety-turret=Подключите воду по трубе. Пока в турели есть вода, во всём круге радиусом __1__ клеток ничего не загорается и не детонирует: боеприпасы, турели, ящики, резервуары и трубы с горючим. Струями воды турель тушит огонь и кислоту на земле, рассеивает облака врагов и снимает кислоту, горение и замедление с игрока, техники и построек. Врагов не атакует. Расход воды: __2__ в секунду в дежурном режиме и __3__ в секунду, пока есть что тушить; при нехватке воды струй меньше.
pd-fire-safety-turret-mk2=Подключите воду по трубе. Пока в турели есть вода, во всём круге радиусом __1__ клеток ничего не загорается и не детонирует: боеприпасы, турели, ящики, резервуары и трубы с горючим. Струями воды турель тушит огонь и кислоту на земле, рассеивает облака врагов и снимает кислоту, горение и замедление с игрока, техники и построек. Врагов не атакует. Расход воды: __2__ в секунду в дежурном режиме и __3__ в секунду, пока есть что тушить; при нехватке воды струй меньше.

[mod-setting-name]
flo-pollution-mult=Загрязнение от сгоревшей жидкости
flo-tank-burn-time=Время перегрева резервуара, с
flo-map-alerts=Оповещения о пожарах

[mod-setting-description]
flo-pollution-mult=Загрязнение, выбрасываемое в чанк на единицу взорвавшейся жидкости: при 1 полный резервуар на 25000 единиц даёт 25000 загрязнения.
flo-tank-burn-time=Сколько горит резервуар с горючей жидкостью до взрыва. Со второй половины срока над ним валит густой чёрный дым. Успейте слить или откачать горючее, чтобы спасти резервуар.
flo-map-alerts=Оповещения на карте и сообщения в чате о пожарах, перегреве резервуаров, детонации боеприпасов и утечках ядовитых газов: что загорелось и от чего.

