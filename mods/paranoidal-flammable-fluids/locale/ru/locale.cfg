[flo-thermal]
pipe-description=Деревянная труба: содержимое горячее 200 °C вызывает белый дым, пожар и ускоряющееся термическое разрушение. Слейте горячую жидкость или замените трубу. Пожарные турели тушат наружный огонь, но не предотвращают прогар изнутри. Обычный пар 165 °C безопасен.

plastic-description=Пластиковая труба: содержимое горячее 200 °C вызывает чёрный дым, пожар и ускоряющееся термическое разрушение. Пока содержимое горячее, выбрасывает 50 единиц загрязнения в секунду (3000 в минуту). Слейте горячую жидкость или замените трубу. Вода и пожарные турели сдерживают наружное пламя, но не внутренний нагрев и выделение загрязнения из пластика. Обычный пар 165 °C безопасен.

[entity-description]
pd-fire-safety-turret=Подключите воду по трубе. Пока в турели есть вода, во всём круге радиусом __1__ клеток ничего не загорается и не детонирует: боеприпасы, турели, ящики, резервуары и трубы с горючим. Струями воды турель тушит огонь и кислоту на земле, рассеивает облака врагов и снимает кислоту, горение и замедление с игрока, техники и построек. Врагов не атакует. Расход воды: __2__ в секунду в дежурном режиме и __3__ в секунду, пока есть что тушить; при нехватке воды струй меньше. Не предотвращает прогар деревянных и пластиковых труб изнутри, если их содержимое горячее 200 °C.
pd-fire-safety-turret-mk2=Подключите воду по трубе. Пока в турели есть вода, во всём круге радиусом __1__ клеток ничего не загорается и не детонирует: боеприпасы, турели, ящики, резервуары и трубы с горючим. Струями воды турель тушит огонь и кислоту на земле, рассеивает облака врагов и снимает кислоту, горение и замедление с игрока, техники и построек. Врагов не атакует. Расход воды: __2__ в секунду в дежурном режиме и __3__ в секунду, пока есть что тушить; при нехватке воды струй меньше. Не предотвращает прогар деревянных и пластиковых труб изнутри, если их содержимое горячее 200 °C.

