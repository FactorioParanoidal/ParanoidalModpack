[mod-name]
paranoidal-flammable-fluids=Paranoidal Flammable Fluids

[mod-description]
paranoidal-flammable-fluids=Pipes, storage tanks, machines and wagons with flammable fluids catch fire and explode: fire crawls through pipes, burning tanks overheat and blow up unless drained, ammunition cooks off, chemical plants leak fire or poison, oil ruins hide traps. Fire safety turrets fed with water put out fires and keep everything in their circle from catching fire. Based on Flammable Oils by Klonan and OwnlyMe.

[entity-name]
pd-fire-safety-turret=Fire safety turret
pd-fire-safety-turret-mk2=Fire safety turret MK2
oil-fire-flame=Fire
flo-long-fire=Fire
flo-tank-fire=Fire

[entity-description]
pd-fire-safety-turret=Connect water by pipe. While the turret has water, nothing catches fire or cooks off in the whole circle of __1__ tiles: ammunition, turrets, chests, tanks and pipes with flammable fluids. Its water jets put out fires and acid on the ground, disperse enemy clouds and remove acid, burning and slowdown from players, vehicles and buildings. Does not attack enemies. Water use: __2__ per second on standby and __3__ per second while there is something to put out; with too little water it fires fewer jets.
pd-fire-safety-turret-mk2=Connect water by pipe. While the turret has water, nothing catches fire or cooks off in the whole circle of __1__ tiles: ammunition, turrets, chests, tanks and pipes with flammable fluids. Its water jets put out fires and acid on the ground, disperse enemy clouds and remove acid, burning and slowdown from players, vehicles and buildings. Does not attack enemies. Water use: __2__ per second on standby and __3__ per second while there is something to put out; with too little water it fires fewer jets.

[mod-setting-name]
flo-radius-mult=Explosion radius multiplier
flo-radius-power=Explosion radius scaling
flo-damage-mult=Explosion damage multiplier
flo-damage-power=Explosion damage scaling
flo-pollution-mult=Pollution from burnt fluid
flo-tank-burn-time=Tank overheating time, s
flo-map-alerts=Fire alerts and messages

[mod-setting-description]
flo-radius-mult=Linear explosion radius multiplier, multiplies radius by this value
flo-radius-power=How radius scales with explosion energy. To be precise, the value of the root of energy, i.e. 2 means square root. 
flo-damage-mult=Linear explosion damage multiplier, multiplies damage by this value
flo-damage-power=How damage scales with explosion energy. To be precise, the value of the root of energy, i.e. 2 means square root.
flo-pollution-mult=Pollution put into the chunk per unit of exploded fluid: a full tank of 25000 units gives 25000 pollution at 1.
flo-tank-burn-time=How long a storage tank with flammable fluid burns before it explodes. From the half on it pours thick black smoke. Drain or pump it out in time to save it.
flo-map-alerts=Map alerts and chat messages about fires, overheating tanks, cooking-off ammunition and toxic leaks: what caught fire and why.

