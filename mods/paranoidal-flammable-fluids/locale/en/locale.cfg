[flo-demo]
start=[color=yellow]Flammable Oils demo: five stations to the east. Watch the map alerts and the chat. Achievements are already disabled in this save by the console.[/color]
busy=Your buildings are in the test zone (150 tiles to the east). Stand on empty ground and run the command again:
fuse=1. In 3 s the far end of the pipeline catches fire: the fire runs through 40 pipes to a full tank with ammunition next to it. The tank burns 60 s, smokes black from the half, then explodes; the ammunition cooks off.
saved=2. In 5 s a gas tank catches fire; it will be drained after 40 s - the fire goes out.
drained=Tank 2 drained.
chem=3. In 12 s two chemical plants are destroyed: toxic recipe (poison cloud) and flammable recipe (fire).
no-toxic=No toxic chemistry recipe found for the plant.
no-fire=No flammable chemistry recipe found for the plant.
cook=4. In 8 s an ammunition store starts cooking off: slowly, then faster, grenades fly 14 tiles.
trap=5. Ruin trap: walk within __1__ tiles of this point yourself, then run - the pipe smoulders, the fire runs to the tank and it blows up.
