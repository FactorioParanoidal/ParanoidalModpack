[mod-setting-description]
BI_Easy_Bio_Gardens=Bio gardens consume ready-made fluid fertilizer, so just one pipeline is enough to supply all ingredients. However, this requires 50% more fertilizer than combining solid fertilizer and water on site.\nBio gardens will transmit electricity to adjacent Bio gardens. Arrange them on a grid, with no more than 1 tile between 2 Bio gardens, and they will be magically connected. :-)\n(Default: off)
Factorissimo2-free-recursion=Allows you to build recursive factory setups even without researching any of the Recursion technologies.
Factorissimo2-hide-recursion=Hides the Recursion 1 and 2 technologies, you will not be able to research them.
Factorissimo2-hide-recursion-2=Hides the Recursion 2 technology, you will not be able to research it.
Noxys_Trees-chunks-per-operation=Allows fine grained control over the performance of this mod and the speed at which the trees expand.
Noxys_Trees-deaths-by-lack-of-fertility-minimum=If the fertility of the ground is lower than this value the tree on top of it has a chance to die.
Noxys_Trees-debug=Enables the output of debug messages.
Noxys_Trees-degrade-tiles=Over time slowly degrades floor tiles that block tree growth until the trees can grow there again.
Noxys_Trees-enabled=When enabled trees will spread and die.
Noxys_Trees-expansion-distance=How far in tiles a tree can generate from its originating tree.
Noxys_Trees-kill-trees-near-unwanted=Randomly kills trees that are near biter bases, uranium ore or player entities. This also affects the death of trees by lack of fertility or too much pollution.
Noxys_Trees-minimum-distance-between-tree=Minimum distance between trees for trees to be able to grow.
Noxys_Trees-minimum-distance-to-enemies=Minimum distance to enemy bases or worms for trees to be able to grow.
Noxys_Trees-minimum-distance-to-uranium=Minimum distance to uranium ore for trees to be able to grow.
Noxys_Trees-overpopulation-kills-trees=If a chunk is overpopulated it will slowly kill off trees at random in that chunk.
Noxys_Trees-ticks-between-operations=Allows fine grained control over the performance of this mod and the speed at which the trees expand.
aircraft-hardmode=Generally makes aircraft easier for the biters to destroy, use at your own peril!
bobmods-enemies-enableartifacts=If enabled, enemies can drop alien artifacts.
bobmods-enemies-enablenewartifacts=If enabled, enemies can drop coloured alien artifacts.
bobmods-enemies-enablesmallartifacts=If enabled, enemies can drop small alien artifacts.
bobmods-inserters-show-window=If enabled, the stand-alone configuration window will have a view-port showing the inserter currently being configured.
fitolamps=Turns on fitolamps lighting in greenhouses and biofarms (graphic changes only).
fs-clear-highlights-with-gui=Remove highlight boxes and arrows when the interface is closed.
heroturrets-setting-level-buff-modifier=Alters the buffs applied per rank as a percentage. ( With a value of 1 being a 1% increase, 10 a 10% percent increase etc.)  (Default is 0, Maximum 100)
heroturrets-setting-level-up-modifier=Multiplies the default required kills/damage per rank. Formula is #Needed = #ForRank + (#ForRank * Modifier / 10). Kill / Damage rank values can be found on the mod home page.(Default is 0)
inserter-immunity=Makes all aircraft immune to inserters, except for fuel insertion.
item-drop=Destroyed chest spills contents
newbie_resourse=NOT RECOMMENDED to disable if you are newbie to Paranoidal
non-combat-mode=Disables the Jet, Gunship, and Flying Fortress from the tech tree. (Currently irreversible per-save!)
paranoidal-disable-vanilla-evolution=Standard evolution will be disabled during map creation.
paranoidal-flowfix-min-time=Recipes with a shorter time will be proportionaly increased in time, ingredients and products amount.
res_loc_1=Enables the replacement of standard graphics with graphics from the Yuoki mod (graphics changes only).
res_loc_2=Enables the replacement of standard graphics with graphics from the Yuoki mod (graphics changes only).
res_loc_3=Enables the replacement of standard graphics with graphics from the Yuoki mod (graphics changes only).
res_loc_e=Enables the replacement of standard graphics with graphics from the Yuoki mod (graphics changes only).
robot-attrition-factor=A multiplier on the robot chance to crash. Note: Other mods can modify or override this value for specific surfaces.
stone-path-concrete=When enabled, will replace the default concrete brick cover graphics with a new one.
todolist-auto-assign=If there is only one player in the game, auto-assign the task to this player.
todolist-show-button=If enabled will always show a "Todo List" button in the top left.\nIf disabled the todo list can only be accessed by its hotkey (default shift-t).
todolist-show-log=If enabled the mod will print debug messages to the chat window.\nAttention: there are a lot of them :)
todolist-window-height=The height of the todo list window. Default is 600.

