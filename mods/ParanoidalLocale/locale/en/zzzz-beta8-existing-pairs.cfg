[technology-description]
CW-air-filter-cleaning=Used air filters can be cleaned and reused. Higher tiers waste fewer filters and switch from coal to water/steam washing.
CW-air-filtering=Enables Air Filter Machines that reduce local pollution. Power-hungry, but auto shut off when the surrounding air is clean.
advanced-aerodynamics=Further research into high-speed aerodynamics.
afterburner=Push your aircraft to the speed limit with an afterburner!
aircraft-energy-shield=Lightweight, high-capacity shield modules designed for heavy fire.
artillery-prototype=Stationary artillery gun prototype. Will conduct automatic shooting at the nests. According to the calculated characteristics, it has a short range and rate of fire.
bob-electric-pole=Research for better Electric Poles
bob-gold-processing=Research how to refine gold.
bob-lead-processing=Research how to refine lead.
bob-nickel-processing=Research how to refine nickel.
bob-robo-modular=Research into building Roboports in modules.
bob-silicon-processing=Research how to purify silicon for use in electronics.
factory-connection-type-heat=Transport heat through your factory building using heat pipes.\n__CONTROL__factory-increase__ and __CONTROL__factory-decrease__ to change the update rate.
factory-recursion-t1=Nest factory buildings inside other, larger factory buildings.
factory-recursion-t2=Nest any factory building inside any other factory building.
flying-fortress=The ultimate in aerial superiority, comes with a tank cannon (Yes, you read that right), a high round-per-minute machine gun, a homing missile launcher, and a huge equipment grid!
high-explosive-cannon-shells=10x (theoretically) stronger explosive shells, for when dead isn't good enough.
jets=For when you need to get somewhere FAST, comes with a rapid-fire machine gun, homing missile launcher, and a napalm launcher. Yeah, you betcha that napalm hurts.
napalm=A longer-burning alternative to flamethrower fuel, works especially well when fired from vehicle-mounted launchers!
robot-attrition-explosion-safety=Logistic bots won't damage things when they crash if they are in a logistic network with up to 500 active logistic bots per researched level.

