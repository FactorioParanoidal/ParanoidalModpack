[technology-description]
Fuel-Additive=Octane-boosting fuel additives are substances added in small amounts to motor fuels to raise their octane number. The most effective and cheapest of them are organic lead compounds such as tetraethyllead (TEL). TEL is never used pure: the metallic lead it forms settles on the cylinder walls and ruins the engine. For this reason TEL is mixed with so-called scavengers that form volatile compounds with metallic lead, usually chlorine-containing compounds (chloroethane). However, TEL is highly toxic and carcinogenic.
