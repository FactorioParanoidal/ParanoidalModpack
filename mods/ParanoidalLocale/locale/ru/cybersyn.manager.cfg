item-requesters-tooltip=В том порядке, в каком диспетчер выбирает следующую станцию запроса этого предмета: сначала высший приоритет, затем станция, у которой последняя доставка была раньше всех.\nПримерно: числа для сортировки берутся из снимка диспетчерской (до одного прохода сбора данных назад), станции снабжения, поезда и маски сети не проверяются. У диспетчера своя очередь на каждую сеть; строки одной сети идут в её порядке. При полном равенстве решает порядок опроса, здесь это ID станции.\nДальше идут запросы, пропущенные в этом цикле: упёрлись в лимит поездов, закрыты (лимит 0), сами отдают этот предмет, ниже порога, не считаны; затем остановки, к которым он уже едет, но больше не нужен.
