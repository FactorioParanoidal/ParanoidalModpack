dispatch-why-no-path=Поезд __1__ возвращался в депо (__2__), когда его выбрали. С того места к станции снабжения не ведёт ни один путь, поэтому его расписание не тронули. Он едет дальше, через 5 с его снова можно выбрать, а запрос повторится в следующем цикле.
dispatch-fix-no-path=Ничего, если такое редко. Если повторяется тот же поезд или та же станция снабжения, сделайте её достижимой с путей, по которым поезда возвращаются в депо, или выключите обход у этого депо.
dispatch-why-path-blocked=Поезд __1__ возвращался в депо (__2__). Путь к станции снабжения есть, но в тот момент поезд не смог занять начало пути (красный сигнал или занятый блок впереди), поэтому его расписание не тронули. Он едет дальше, через 5 с попытка повторится.
dispatch-fix-path-blocked=Ничего, если такое редко. Если повторяется тот же поезд, проверьте, что держит его у сигнала; много строк с одной развязки могут значить, что поезда стоят в очереди внутри неё.
dispatch-why-no-path-after-write=Доставку записали в расписание поезда __1__, но игра сообщила, что пути нет (__2__), поэтому доставка не засчитана. Задание остаётся у поезда, пока его снова не отправят.
dispatch-fix-no-path-after-write=Откройте поезд: если там «Нет пути», почините путь к станции снабжения.
