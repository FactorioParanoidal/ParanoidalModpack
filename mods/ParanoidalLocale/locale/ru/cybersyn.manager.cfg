dispatch-why-schedule-rejected=Записано старой версией, которая не сохраняла причину. Обычно поезд __1__ возвращался в депо и не имел пути к станции снабжения, поэтому его расписание не тронули. Изредка задание записывалось и оставалось у поезда.
