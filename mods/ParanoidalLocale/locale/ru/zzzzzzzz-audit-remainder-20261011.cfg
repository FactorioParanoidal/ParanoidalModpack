[item-description]
artillery-jammer-tool=Включает или выключает автоматическое наведение выбранных артиллерийских турелей и вагонов.
chunk-eraser=Обычное выделение удаляет чанки без объектов игрока. Альтернативное выделение (по умолчанию с Shift) удаляет также чанки с объектами игрока.
exploration-data-disk=Диск с данными, полученными разведывательным спутником. Нужен для изготовления карты космоса.
exploration-satellite=Спутник, способный отправиться дальше в космос и составить карту окрестностей. Узнаем, куда стоит лететь и каких мест лучше избегать! [Поместите в ракетную шахту для запуска в космос — возвращает диск с разведданными]
laser-cannon=Лазерная пушка космического корабля защитит вас, если в космосе тоже окажутся злобные кусаки. [Поместите в ракетную шахту для запуска в космос]
picker-tape-measure=Инструмент для быстрого измерения участков.
power-grid-comb=Упорядочивает беспорядочные соединения между электрическими опорами.
sand=Песок
space-ai-robot=Робот с искусственным интеллектом, способный выполнять любую работу на космическом корабле. Ваш новый спутник в долгом путешествии! [Поместите в ракетную шахту для запуска в космос]
space-ai-robot-frame=Каркас вашего личного робота-помощника с искусственным интеллектом. Включает броню, робопорт и средства защиты. Удобно!
space-fuel-tank=Большой топливный бак. Топлива хватит на долгое путешествие по космосу. Возможно, останется и на осмотр достопримечательностей! [Поместите в ракетную шахту для запуска в космос]
space-map=Карта космоса содержит все данные, необходимые для прокладки маршрута к месту назначения. [Поместите в ракетную шахту для запуска в космос]
space-oxygen-barrel=Бочка с кислородом.
space-oxygen-tank=Большой кислородный бак. Кислорода хватит на долгое путешествие по космосу. Дышите свободно! [Поместите в ракетную шахту для запуска в космос]
space-water-tank=Большой бак для воды. Воды хватит на долгое путешествие по космосу. Не забывайте пить достаточно воды! [Поместите в ракетную шахту для запуска в космос]
tree-killer=Помечает природные объекты и лежащие на земле предметы для сноса или сбора.

