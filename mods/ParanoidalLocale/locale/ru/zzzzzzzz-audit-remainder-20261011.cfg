[tips-and-tricks-sub]
angels-algae-blue=Потребляют [fluid=angels-water-yellow-waste] и [fluid=angels-gas-carbon-dioxide]. Производят богатые азотом соединения, например [fluid=angels-gas-ammonia].\n
angels-algae-brown=Потребляют [fluid=angels-water-saline] и производят [item=angels-solid-sodium-carbonate] и [item=angels-solid-alginic-acid]. Последнюю можно соединить с [item=angels-cellulose-fiber], чтобы получить [item=angels-solid-paper].
angels-algae-green=Потребляют [fluid=angels-water-mineralized] и производят [item=angels-cellulose-fiber], которое можно переработать в [fluid=angels-gas-methanol].
angels-algae-red=Потребляют [fluid=angels-thermal-water] и [fluid=angels-gas-ammonia]. Производят богатые кальцием соединения, например [item=angels-solid-calcium-carbonate].\n
angels-crops-special-products=\nВ том числе один из следующих продуктов из наиболее сложных культур ([img=item/angels-swamp-5], [img=item/angels-temperate-5], [img=item/angels-desert-5]):
angels-farm-seeds-to-crops=\nВысаживайте культуры на [img=item/angels-crop-farm] базовой ферме или подходящей улучшенной ферме: [img=item/angels-swamp-farm] болотной, [img=item/angels-temperate-farm] умеренной или [img=item/angels-desert-farm] пустынной.\nУрожай перерабатывается в [img=item/angels-bio-processor] биопроцессоре, а полученные семена можно возвращать в [img=item/angels-seed-extractor] экстрактор семян для воспроизводства.\n\n 
angels-fish-artifacts= Перерабатывайте воду из рыбного хозяйства, чтобы извлекать [img=fluid/angels-alien-spores] споры пришельцев, а из них получать [img=item/angels-alien-artifact] инопланетные артефакты.
angels-fish-artifacts-bob= Перерабатывайте воду из рыбного хозяйства, чтобы извлекать [img=fluid/angels-alien-spores] споры пришельцев, а из них получать [img=item/bob-alien-artifact] инопланетные артефакты.
angels-trees-desert=Пустынные деревья встречаются в сухих областях с предпочтительной влажностью около __1__ (обычно на песке или красном песке).\nОни служат источником древесины или ранним сырьём для производства [img=item/angels-bio-rubber] резины.\n
angels-trees-swamp=Болотные деревья встречаются во влажных областях с предпочтительной влажностью около __1__ (обычно на тёмно-зелёной или синеватой траве).\nОни служат источником древесины или ранним сырьём для производства [img=item/angels-bio-plastic] пластмассы.\n\n
angels-trees-temperate=Деревья умеренной зоны встречаются в областях со средней влажностью, предпочитая влажность около __1__ (обычно на светло-зелёной траве).\nОни служат источником древесины или ранним сырьём для производства [img=item/angels-bio-resin] смолы.\n

