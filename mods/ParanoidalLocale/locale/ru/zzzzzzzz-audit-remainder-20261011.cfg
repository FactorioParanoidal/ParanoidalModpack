combinator-fluid-quantity-mode-desc=Способ расчёта значения сигнала жидкости при создании постоянного комбинатора из списка ингредиентов. «stacks» (стопки): множитель × размер условной стопки жидкости. «amount» (количество): множитель × требуемое количество жидкости в блоке.
