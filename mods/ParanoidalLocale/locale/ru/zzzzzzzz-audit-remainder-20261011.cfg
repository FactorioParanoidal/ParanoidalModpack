Flammable_Oils_QUICKFIX=Трубы, резервуары и другие объекты могут загораться и взрываться. Авторы исходного мода: Klonan и OwnlyMe.
Picks-Inserter=Мод освобождает руку манипулятора, если тот не может положить удерживаемые предметы в место назначения.\n- Предметы возвращаются туда, откуда были взяты.\n- Если это невозможно и соответствующая настройка включена, предметы уничтожаются.\n\n! Уничтоженные предметы восстановить нельзя. !
SchallPickupTower=Добавляет здания, автоматически собирающие предметы с земли.
ZCS-Trash-Landfill-Continued-Update=Добавляет большую свалку, которая уничтожает мусор, создавая загрязнение.
fluid-memory-storage=Альтернатива факельным установкам и уничтожению жидкостей. Цистерна материопамяти вмещает неограниченное количество любой жидкости или газа. Чем больше хранится жидкости, тем больше требуется электроэнергии!
minime=Меняйте размер своего персонажа и его внешность в любое время, если установлены другие моды с дополнительными персонажами!
prismatic-belts=Окрашивает поверхность конвейеров в цвет стрелок, улучшая видимость. Поддерживает моды Bob's и Artisanal Reskins, Krastorio 2, Ultimate Belts, Factorio Extended Plus и Random Factorio Things. Работает совместно с AAI Loaders, Loaders Modernized, Miniloader, Loader Redux, Deadlock Stacking Beltboxes & Loaders и Vanilla Loaders.
reskins-compatibility=Заменяет значки и изображения объектов и технологий в модах, которые не охватывают другие моды Artisanal Reskins. Поддерживаются моды, дополняющие Bob's и Angel's или хорошо совместимые с ними. Высокое разрешение значков и обновлённые спрайты приводят внешний вид к стилю Artisanal Reskins. Игрок может настраивать обозначения уровней, цвета и их соответствия. Подробный список поддерживаемых модов приведён на портале модов. Входит в серию Artisanal Reskins.
reskins-sprite-utils=Набор самостоятельных средств работы со значками и спрайтами для разработки модов Factorio. Изначально созданная для серии Artisanal Reskins, эта библиотека позволяет изменять значки, спрайты и прототипы с полной проверкой типов и подробной проверкой корректности данных.

[mod-gui]
migrated-item=__1__ × __2__ [img=quality.__3__] были преобразованы и удалены при обновлении. Это хранилище материопамяти теперь пусто.

[mod-setting-description]
Factorissimo2-factory-preview-mode=Определяет способ отображения содержимого заводского строения.
Factorissimo2-space-architecture=Добавляет технологии строительства заводских строений в космосе.
Noxys_Trees-collision_multiplier=Множитель размера области столкновения деревьев. Меньшие значения уменьшают эту область.
Noxys_Trees-deaths-by-pollution-bias=Определяет, как быстро деревья погибают от загрязнения.\n\nЗначение 0 отключает гибель деревьев от загрязнения.\n\nЧисло дополнительных попыток уничтожить дерево = math.ceil(pollution / this).
Noxys_Trees-do-not-degrade-reinforced-tiles=Не разрушать некоторые усиленные покрытия. Пока при включении этой настройки защищён только железобетон.
Noxys_Trees-tree_fire_spread_speed_factor=Множитель скорости распространения лесных пожаров.
Noxys_Trees-trees-grow-on-landfill=Позволяет деревьям расти на отсыпке.
PI_clear_inserter=Если манипулятор не может вернуть предметы туда, откуда их взял, предметы уничтожаются и рука манипулятора освобождается.
PI_clear_max=Максимальное число манипуляторов, освобождаемых за один тик.\nМинимальное значение: 1\nМаксимальное значение: 30
PI_extend_length=Расширяет область освобождения манипуляторов вдоль вагона за пределы его длины.
PI_keep_selected=Выбранные манипуляторы остаются под постоянным контролем и автоматически освобождаются, пока вы не снимете выделение.
PI_lines_to_check=Число рядов клеток, проверяемых на манипуляторы для освобождения в направлении поперёк грузового вагона.
PI_set_mark=Отмечает выбранные манипуляторы.
PI_target_selection=Позволяет выбирать манипуляторы для автоматического освобождения.
PI_target_train_stop=Освобождает манипуляторы рядом с грузовыми вагонами, когда поезд покидает станцию. Поезд должен прибыть и уехать в автоматическом режиме; между прибытием и отправлением нельзя переключаться в ручной режим.\nПроверяется область с обеих сторон каждого грузового вагона поезда. Вагоны, расположенные не строго горизонтально или вертикально, пропускаются, даже если их можно загружать или разгружать!
PI_temp_unlock=Если часть слотов сундука заблокирована, на время возврата предметов блокировка снимается.\nЭто позволяет манипуляторам вернуть предметы даже в сундуки, которые при обычной блокировке полностью заполнены.
Schall-PT-range-force-disable=Включите, если отображение радиуса сбора замедляет игру.
Schall-PT-range-show=Показывать радиус сбора, когда выбрана __ENTITY__Schall-pickup-tower__.
SpaceX-classic-mode=Классический режим SpaceX. Отключает этап 4 и ядерное топливо. Устанавливает классическую стоимость исследований сверхсветовых технологий.
SpaceX-ftl-ramp-up=Постепенно добавляет виды исследовательских пакетов по мере изучения сверхсветовых технологий. Если отключено, все виды пакетов требуются на каждом этапе этих исследований.
SpaceX-ignore-tech-multiplier=Стоимость технологий SpaceX не зависит от множителя стоимости исследований базовой игры, используемого в марафонском режиме. По умолчанию этот множитель применяется вместе с множителем стоимости исследований SpaceX. Включите настройку, чтобы регулировать их независимо (упрощает SpaceX в марафонском режиме).
SpaceX-launch-multiplier=Множитель количества компонентов, отправляемых на орбиту. Определяет, сколько предметов нужно доставить для завершения этапа. 0.5 означает 50% (половину) исходного количества. 2 означает, что нужно доставить вдвое больше предметов.
SpaceX-log-days=«2d 1h» вместо «49h»: дни и часы вместо одних часов.
SpaceX-no-chat-msg=Отключает сообщения в чате о завершении этапов. Удобно, если вы собираетесь запускать много межзвёздных кораблей.
SpaceX-no-ir=Отключает совместимость с модами Industrial Revolution в этой игре, даже если они установлены.
SpaceX-no-krastorio=Отключает совместимость с Krastorio2 в этой игре, даже если этот мод установлен.
SpaceX-no-nuclear=Заменяет ядерное топливо на ракетное во всех рецептах SpaceX. Ядерный реактор в рецептах также заменяется ракетным топливом (упрощает игру).
SpaceX-no-pyanodons=Отключает совместимость с модами Pyanodons в этой игре, даже если они установлены.
SpaceX-no-space-sci=По умолчанию поздние технологии SpaceX требуют космические исследовательские пакеты. Включите настройку, чтобы убрать их из требований технологий SpaceX (упрощает игру).
SpaceX-production=Множитель количества ингредиентов в рецептах. Определяет, сколько ингредиентов нужно для изготовления предмета. 0.5 означает 50% (половину) исходного количества. 2 означает вдвое больше ингредиентов.
SpaceX-research=Множитель стоимости исследований. Определяет, сколько исследовательских пакетов нужно для изучения технологии. 0.5 означает 50% (половину) исходной стоимости. 2 означает удвоенную стоимость исследования.
SpaceX-split-combinator=Разделяет комбинатор SpaceX на два: один выдаёт только сигналы требуемых предметов, а второй — сигнал S с номером текущего этапа.
Use-Mod-Color-for-heat-pipes=Заменяет обычный цвет тепловых труб на карте цветом, заданным этим модом.
Use-Mod-Color-for-pipes=Заменяет обычный цвет труб на карте цветом, заданным этим модом.
Use-Mod-Color-for-roboports=Заменяет обычный цвет дронстанций на карте цветом, заданным этим модом.
Use-Mod-Color-for-steam-generators=Заменяет обычный цвет паровых генераторов на карте цветом, заданным этим модом.
__RITEG__autodeconstruct-health-threshold=Порог прочности в процентах для автоматического демонтажа. Когда прочность РИТЭГ падает ниже этого значения, он помечается для демонтажа строительными роботами. Допустимые значения: [0,90]; 0 — не помечать никогда.
aai-loaders-belt-stacking-mode=Настройка действует только при установленном моде, добавляющем укладку предметов стопками на конвейерах.
angels-components-block-difficulty=Сложность изготовления функциональных блоков из промежуточных компонентов.\n[img=utility/warning_icon] Влияет на игру только при включённой переработке компонентов.
angels-components-component-difficulty=Сложность изготовления промежуточных компонентов из ресурсов.\n[img=utility/warning_icon] Влияет на игру только при включённой переработке компонентов.
angels-components-stack-size=Размер пачки функциональных блоков.\n[img=utility/warning_icon] Влияет на игру только при включённой переработке компонентов.
angels-enable-components=Стадия разработки: [color=yellow][font=default-semibold]бета[/font][/color]\nДобавляет электронные и строительные компоненты в качестве промежуточных продуктов.\nИзготовление зданий становится сложнее.
angels-enable-tech=Стадия разработки: [color=yellow][font=default-semibold]альфа[/font][/color]\nПерерабатывает процесс исследования технологий.\nРазным типам лабораторий для исследований нужны разные информационные ядра и научные анализаторы.\n[img=utility/warning_icon] Автоматически включает переработку компонентов.
angels-pavement-stack-size=Предметы для покрытий — это камень, бетон, отсыпка и другие предметы, которые можно использовать для укладки покрытий и дорожек.
angels-return-ingredients=При демонтаже здания возвращаются ингредиенты, из которых оно изготовлено. Если отключено, возвращается само здание, как в обычной игре.\n[img=utility/warning_icon] Автоматически отключается, если переработка компонентов выключена.
app_assembling_machines=Добавляет дополнительные подключения труб к сборочным автоматам.
app_chemical_plants=Добавляет дополнительные подключения труб к химическим заводам.
app_oil_refineries=Добавляет дополнительные подключения труб к нефтеперерабатывающим заводам.
artillery-toggle=Выберите объекты, на которые действует переключатель.
bet-battery-slots=Число топливных ячеек аккумуляторного электровоза. Баланс мода рассчитан на одну ячейку, и рекомендуется играть именно так. Настройка позволяет обойти ошибку LTN, создающего невыполнимые условия дозаправки для локомотивов, принимающих только один топливный предмет. Если вы используете LTN, установите значение 2, а множитель ёмкости — 0.5. [1 – 5]
bet-capacity-multiplier=Ёмкость четырёх уровней аккумуляторных блоков для поездов соответствует энергии полного запаса угля, твёрдого топлива, ракетного топлива или ядерного топлива в локомотиве. Если этого недостаточно или вы хотите получить большую ёмкость раньше, увеличьте множитель. Время зарядки и количество ингредиентов для изготовления аккумуляторов увеличатся пропорционально. [0.1 – 100]
bet-charging-efficiency=1.0 означает идеальную эффективность зарядки. Значения ниже 1 усложняют игру, а значения выше 1 дают бесплатную дополнительную энергию. [0.1 – 1000]
bet-cheatsy-braking=Умножает тормозную силу и мощность вагонов, а также аккумуляторных электровозов, если соответствующая настройка включена. 1 — без изменений. [0.1 – 100000]
bet-equipment-gridtype=Выберите тип сетки оборудования из других модов для аккумуляторных электровозов.
bet-recycling=В реальности около 90% аккумуляторного блока можно переработать. Эта настройка добавляет открываемые исследованиями рецепты переработки аккумуляторных блоков. Возможны конфликты с другими модами переработки.
bet-return-partial-batteries=При добыче или демонтаже аккумуляторного электровоза с частично разряженным блоком внутри возвращает разряженный блок вместо его потери. Можно отключить для небольшого повышения UPS.
bm-big-enemy-hp-variant=0.2–4.0 (по умолчанию: 1)
bm-spawn_near_nests=По возможности большинство атак врагов начинается рядом с их гнёздами.
bm-swarm-max_evo=Если эволюция выше этого значения, событие больше не происходит.
bm-tree-events-chance=Вероятность неприятного события при вырубке дерева игроком.
bm-volcano-max_evo=Если эволюция выше этого значения, событие больше не происходит.
bobmods-enemies-factionlist=Список всех появляющихся фракций в порядке их открытия до случайного перемешивания; порядок можно свободно менять. Разделяйте названия одной запятой без пробелов. Удаление более одной фракции может затруднить сбор артефактов всех типов. Если убрать фракции этого мода во время игры, они останутся на карте, но новые базы этих фракций появляться не будут.
bobmods-enemies-factionsappear=Уровень эволюции, при котором на карте начинают появляться новые фракции врагов. Значение 0 делает начало игры очень сложным.
bobmods-enemies-originalcolors=Гнёзда врагов отображаются на карте обычным красным цветом вместо цветов фракций, позволяющих легче их различать.
bobmods-enemies-qualityenemies=Постройки новых баз врагов могут появляться с повышенным качеством. Они будут порождать существ более высокого качества, с которых выпадает добыча более высокого качества.
bobmods-enemies-radarscanlimit=Ограничивает количество лежащих на земле предметов, которые наземный радар помечает для сбора за один цикл. Это может немного повлиять на производительность, но прежде всего позволяет не занимать строительных роботов сбором предметов надолго. Значение 0 снимает ограничение.
bobmods-enemies-randomizeenemies=Новые фракции врагов открываются в случайном порядке. Применяется только при начале игры или первом добавлении этого мода.
bobmods-inserters-button-enable=Размещает кнопку в левом верхнем углу экрана для настройки манипуляторов.\nЕсли кнопка отключена, а положение окна задано как «Выкл.», открыть окно настройки можно только с помощью [font=default-semibold][color=128, 206, 240]__CONTROL__bob-inserter-open-gui__[/color][/font].
bobmods-inserters-gui-position=Выберите, с какой стороны окно настройки манипулятора будет примыкать к его обычному окну при открытии.\nЕсли выбрано «Выкл.» и кнопка настройки отключена, открыть окно настройки можно только с помощью [font=default-semibold][color=128, 206, 240]__CONTROL__bob-inserter-open-gui__[/color][/font].
bobmods-logistics-beltrequireprevious=Для изготовления конвейеров и связанных с ними объектов нужны их версии предыдущего уровня.
bobmods-logistics-drainlessinserters=Убирает расход энергии в режиме ожидания у всех манипуляторов.
bobmods-logistics-flyingrobotframes=Добавляет каркасы дронов в качестве промежуточных компонентов для рецептов.
bobmods-logistics-inserterrequireprevious=Для изготовления манипуляторов нужны их версии предыдущего уровня.
bobmods-logistics-robotparts=Добавляет модули управления дронов, инструменты строительных дронов и захваты транспортных дронов в качестве промежуточных компонентов для рецептов.
bobmods-logistics-robotrequireprevious=Для изготовления логистических и строительных роботов нужны их версии предыдущего уровня.
bobmods-logistics-trains=Добавляет новые локомотивы и вагоны.
bobmods-ores-enablewaterores=Добавляет грунтовые воды и литиевую воду.
bobmods-ores-startinggroundwater=Добавляет источник грунтовых вод в стартовую область.
bpsb-allow-all-technology=Применяется только при полной изоляции.
bpsb-isolation-level=Степень отделения песочниц от основной игры, насколько это возможно. Полное объяснение приведено в разделе «Советы и подсказки» и на странице мода.
bv-container-passthrough=Определяет, продолжается ли подсветка пути погрузчиков через контейнеры.
carbon-fiber-aircraft=Добавляет самолёты из углеволокна: их масса и запас здоровья вдвое меньше, чем у стандартных моделей.
cybersyn-enable-analytics=Включает аналитику загрузки поездов и доставок. Добавляет вкладки «Загрузка» и «Разбивка доставок» в диспетчер Cybersyn. Может влиять на производительность очень больших фабрик. По умолчанию отключено.
disable-tank-controls=Отключает танковое управление, делая поведение самолётов более реалистичным: им требуется радиус для разворота.
dolly-biter-move=Разрешает перемещать кусак и их гнёзда, в том числе захваченные гнёзда.
dolly-ghost-move=Разрешает перемещать призраки объектов.
dolly-item-destroy=При перемещении объекта предметы на земле под ним собираются в инвентарь. Если инвентарь заполнен, предметы уничтожаются, а объект всё равно перемещается.
dolly-remote-move=Разрешает перемещать объекты через удалённый просмотр, когда игрок не находится рядом с ними.
enable-pretargeting=Турели начинают наводиться на врагов немного за пределами максимальной дальности, что ускоряет их реакцию. Отключите, если турели застревают, пытаясь навестись на недоступное гнездо или червя.
extangels-warehouses-require-previous=Для изготовления склада нужен склад предыдущего уровня. Для первого уровня требуется базовый склад.
fh-add-fuel-items=Добавляет подходящее топливо и продукты его сгорания, даже если их нет среди входов и выходов.
fh-default-item-on-splitter=Имя предмета, который всегда будет показываться в списке фильтров разделителей, например deconstruction-planner. Оставьте поле пустым, чтобы отключить.
fh-set-filter-on-inserter=При назначении фильтра манипулятору включает флажок «Использовать фильтры».
fh-show-only-unlocked-qualities=Если в сборочном автомате установлены модули качества, в фильтрах продукции показываются только уже исследованные уровни качества.
flo-damage-mult=Линейный множитель урона взрыва: умножает урон на это значение.
flo-damage-power=Зависимость урона от энергии взрыва. Значение задаёт степень корня из энергии: например, 2 означает квадратный корень.
flo-radius-mult=Линейный множитель радиуса взрыва: умножает радиус на это значение.
flo-radius-power=Зависимость радиуса от энергии взрыва. Значение задаёт степень корня из энергии: например, 2 означает квадратный корень.
gu_button_style_setting=Определяет цвет и форму кнопок в левом верхнем углу.
gu_enable_logging=Включает запись отладочных сообщений мода GUI Unifier в журнал.
gu_frame_style_setting=Определяет стиль рамки с кнопками в левом верхнем углу.
gu_log_level=Задаёт минимальный уровень сообщений в журнале: DEBUG — все сообщения, ERROR — только ошибки.
gu_todolist_style_setting=Можно выбрать обычную текстовую кнопку мода.
heroturrets-allow-blueprint-rank=Если отключено, турели с рангами в чертежах и при копировании заменяются базовыми турелями. Если включено, ранги турелей сохраняются в чертежах. (По умолчанию: отключено)
heroturrets-allow-ghost-rank=Для уничтоженной турели создаётся призрак турели того же ранга. Если отключено, создаётся призрак базовой турели.
heroturrets-csv-attack-speed-buff=Позволяет задать индивидуальные процентные бонусы к скорости анимации атаки для каждого ранга. Влияет на скорость анимаций атаки и подготовки к атаке. Указывайте числовые значения через запятую, например 100. Не используйте разделители разрядов или знак «%» в самих числах. Если число значений отличается от числа рангов, последнее указанное значение используется для распределения бонусов между всеми рангами. (Рекомендуется не превышать 80% для наибольшего бонуса. Более высокие значения могут чрезмерно упростить игру, нарушить работу турелей или игры. Вы можете настроить их по своему усмотрению, но риск остаётся за вами. Максимальное значение: 999.)
heroturrets-csv-buff=Позволяет задать индивидуальные процентные бонусы для каждого ранга. Указывайте числовые значения через запятую, например 100. Не используйте разделители разрядов или знак «%» в самих числах. Если число значений отличается от числа рангов, последнее указанное значение используется для распределения бонусов между всеми рангами. (Рекомендуется не превышать 80% для наибольшего бонуса. Более высокие значения могут чрезмерно упростить игру, нарушить работу турелей или игры. Вы можете настроить их по своему усмотрению, но риск остаётся за вами. Максимальное значение: 999.)
heroturrets-csv-damage=Позволяет задать индивидуальные пороги нанесённого урона для получения рангов. Используется только при включённой настройке «Повышать ранг за нанесённый урон». Указывайте числовые значения через запятую, например 10000, без разделителей разрядов. Число значений должно совпадать с числом рангов: по умолчанию их шесть, а при использовании индивидуальных названий рангов — столько, сколько задано названий. Если число значений отличается от числа рангов, первое и последнее указанные значения используются для распределения порогов между всеми рангами.
heroturrets-csv-firerate-buff=Позволяет задать индивидуальные процентные бонусы к скорострельности для каждого ранга, изменяя задержку между выстрелами. Указывайте числовые значения через запятую, например 100. Не используйте разделители разрядов или знак «%» в самих числах. Если число значений отличается от числа рангов, последнее указанное значение используется для распределения бонусов между всеми рангами. (Рекомендуется не превышать 80% для наибольшего бонуса. Более высокие значения могут чрезмерно упростить игру, нарушить работу турелей или игры. Вы можете настроить их по своему усмотрению, но риск остаётся за вами. Максимальное значение: 999.)
heroturrets-csv-health-buff=Позволяет задать индивидуальные процентные бонусы к максимальному здоровью для каждого ранга. Указывайте числовые значения через запятую, например 100. Не используйте разделители разрядов или знак «%» в самих числах. Если число значений отличается от числа рангов, последнее указанное значение используется для распределения бонусов между всеми рангами. (Рекомендуется не превышать 80% для наибольшего бонуса. Более высокие значения могут чрезмерно упростить игру, нарушить работу турелей или игры. Вы можете настроить их по своему усмотрению, но риск остаётся за вами. Максимальное значение: 999.)
heroturrets-csv-kill=Позволяет задать индивидуальные пороги убийств для получения рангов. Указывайте числовые значения через запятую, например 10000, без разделителей разрядов. Максимальное значение: 4000000 (4 миллиона). Число значений должно совпадать с числом рангов: по умолчанию их шесть, а при использовании индивидуальных названий рангов — столько, сколько задано названий. Если число значений отличается от числа рангов, первое и последнее указанные значения используются для распределения порогов между всеми рангами.
heroturrets-csv-range-buff=Позволяет задать индивидуальные процентные бонусы к дальности для каждого ранга. Указывайте числовые значения через запятую, например 100. Не используйте разделители разрядов или знак «%» в самих числах. Если число значений отличается от числа рангов, последнее указанное значение используется для распределения бонусов между всеми рангами. (Рекомендуется не превышать 80% для наибольшего бонуса. Более высокие значения могут чрезмерно упростить игру, нарушить работу турелей или игры. Вы можете настроить их по своему усмотрению, но риск остаётся за вами. Максимальное значение: 999.)
heroturrets-csv-turret-rotation-buff=Позволяет задать индивидуальные процентные бонусы к скорости поворота для каждого ранга. Влияет на скорость наведения турели на новую цель перед атакой. Указывайте числовые значения через запятую, например 100. Не используйте разделители разрядов или знак «%» в самих числах. Если число значений отличается от числа рангов, последнее указанное значение используется для распределения бонусов между всеми рангами. (Рекомендуется не превышать 80% для наибольшего бонуса. Более высокие значения могут чрезмерно упростить игру, нарушить работу турелей или игры. Вы можете настроить их по своему усмотрению, но риск остаётся за вами. Максимальное значение: 999.)
heroturrets-hide-ranked-from-ghost-cursor=Скрывает турели с рангами в списке выбора призраков при удалённом просмотре через радар. Турели по-прежнему автоматически повышают ранг за убийства или нанесённый урон. (По умолчанию: включено)
heroturrets-max-health-on-rank=Полностью восстанавливает здоровье при повышении ранга.
heroturrets-setting-run-in-updates=По умолчанию турели создаются на заключительном этапе загрузки данных (data-final-fixes). Эта настройка переносит их создание на этап data-updates. Рекомендуется для мода SearchLightAssault.
heroturrets-update-ammo-ranges=Устанавливает максимальную дальность боеприпасов равной максимальной дальности использующих их турелей. Может устранить преждевременные взрывы ракет и других снарядов, выпущенных турелями высоких рангов. НАСТРОЙКА В РАЗРАБОТКЕ. ВКЛЮЧАЙТЕ НА СВОЙ РИСК.
heroturrets-use-csv-attack-speed-buff=Включает индивидуальные процентные бонусы к скорости анимации атаки для каждого ранга. По умолчанию используется общий бонус ранга.
heroturrets-use-csv-buff=Включает индивидуальные процентные бонусы для каждого ранга.
heroturrets-use-csv-damage=Включает индивидуальные пороги нанесённого урона для получения рангов. Используется только при включённой настройке «Повышать ранг за нанесённый урон».
heroturrets-use-csv-firerate-buff=Включает индивидуальные процентные бонусы к скорострельности для каждого ранга. По умолчанию используется общий бонус ранга.
heroturrets-use-csv-health-buff=Включает индивидуальные процентные бонусы к максимальному здоровью для каждого ранга. По умолчанию используется общий бонус ранга.
heroturrets-use-csv-kills=Включает или отключает индивидуальные пороги убийств для получения рангов.
heroturrets-use-csv-range-buff=Включает индивидуальные процентные бонусы к дальности для каждого ранга. По умолчанию используется общий бонус ранга.
heroturrets-use-csv-turret-rotation-buff=Включает индивидуальные процентные бонусы к скорости поворота для каждого ранга. По умолчанию используется общий бонус ранга.
ick-compatibility-mode=Включите, если мод, перерабатывающий игру, делает некоторые кнопки быстрого доступа недоступными.
ick-tags=Выберите, что отображать перед названиями кнопок быстрого доступа этого мода: метки, иконки или ничего.\n\nВ меню настроек метки отображаются всегда.
inserter-throughput-enabled=Показывать ли пропускную способность манипуляторов.
inserter-throughput-rounding-precision=Максимальное количество знаков после десятичного разделителя. Значение 0 отключает округление.
inserter-throughput-show-toggle=Показывает кнопку в левом верхнем углу экрана. Она отображает состояние настройки «Включено» и позволяет менять его, не открывая настройки мода.
inventory-repair-interval=Интервал ремонта в тиках. Объём ремонта за один интервал изменяется так, чтобы общая скорость оставалась прежней. Меньшие значения могут влиять на производительность.\n\n[color=blue]По умолчанию:[/color] __1__\n[color=blue]Минимум:[/color] __2__
inventory-repair-order=Выбор самых быстрых или самых медленных ремонтных комплектов. Комплекты с неограниченной прочностью и наибольшей скоростью всегда используются первыми, независимо от настройки.
klient-vehicle-brake-on-cancel=При отмене команды автопилота слегка притормаживает транспорт, если вы находитесь внутри. Работает, только если клавиша отмены отличается от клавиши выхода из транспорта.
laserfix-b=Интенсивность синей составляющей (0–255).
laserfix-doubletint=Делает цвет луча насыщеннее.
laserfix-g=Интенсивность зелёной составляющей (0–255).
laserfix-glow-b=Цвет свечения на земле (0–255).\nМалые значения делают свечение менее заметным.\n(Рекомендуемое максимальное значение: 128.)
laserfix-glow-g=Цвет свечения на земле (0–255).\nМалые значения делают свечение менее заметным.\n(Рекомендуемое максимальное значение: 128.)
laserfix-glow-r=Цвет свечения на земле (0–255).\nМалые значения делают свечение менее заметным.\n(Рекомендуемое максимальное значение: 128.)
laserfix-r=Интенсивность красной составляющей (0–255).
lepp_light_max_size=Значения > 75 могут вызывать графические ошибки.
lepp_light_size_factor=Множитель, применяемый дополнительно к масштабированию по дальности проводов.\nПри значении 0 каждый столб освещает область как маленькая лампа.
lepp_pole_blacklist=Список идентификаторов электрических столбов через запятую, для которых LEP+ не должен создавать версии с подсветкой.
lepp_pole_whitelist=Список идентификаторов электрических столбов через запятую, для которых LEP+ должен создавать версии с подсветкой.
lepp_tech_blacklist=Список идентификаторов технологий через запятую, к которым LEP+ не должен добавлять открытие рецептов.
lepp_tech_fallback=Технология для открытия рецептов столбов с подсветкой, если исходные столбы доступны без исследования, например маленький электрический столб.
lepp_tech_pole_weight=[font=default-bold]Стандартный вес[/font]: столбы с подсветкой весят столько же, сколько исходные столбы (20 кг).\n[font=default-bold]Реалистичный вес[/font]: маленькая лампа (20 кг) + столб (20 кг) = 40 кг.
lock-surfaces-space-age=Ограничивает использование самолётов в зависимости от условий поверхности. Имеет значение только для Space Age.
minime_character-selector=Меняйте внешность прямо во время игры или переходите в режим редактора либо бога!\nВнимание: потребуется хотя бы один другой мод, добавляющий облик персонажа. Если нужного персонажа нет в списке, попросите автора мода, который его добавляет, обеспечить совместимость с «minime»!
minime_character-size=25: крошечный\n100: обычный\n250: ОГРОМНЫЙ\n(По умолчанию: 70)
minime_debug_to_log=Если игра аварийно завершилась, включите эту настройку, попробуйте повторить сбой и приложите файл журнала к сообщению об ошибке!\nВнимание: подробный журнал будет очень большим, поэтому отключайте запись, когда она не нужна.
minime_followmode=При выходе из режима редактора или бога вы снова получаете управление последним использованным персонажем. Здесь можно выбрать, переместить ли игрока к оставленному персонажу или перенести персонажа туда, где сейчас находится игрок.
minime_icon-scheme=Выберите набор значков для кнопки переключения и кнопок быстрого доступа! Эта настройка меняет только внешний вид и не влияет на работу мода.
minime_remove-armor-animations=Удаляет анимации брони у всех персонажей. Бронёй по-прежнему можно пользоваться, но она не будет менять внешность персонажа.
minime_show-character-removal-buttons=Кнопки перехода в режим бога или редактора доступны только администраторам! В одиночной игре вы всегда администратор; в сетевой игре — обычно нет.
minime_small-character-collision-box=Уменьшение области столкновения персонажа позволяет протискиваться между деревьями и легче проходить между сборочными автоматами и другими объектами.
module-inserter-ex-slots-before-alt-ui=Максимальное число слотов модулей, при котором для каждого слота показывается отдельная кнопка.\nПри большем числе слотов используется другой вариант интерфейса.
multiple-unit-train-control-blacklist=Дополнительные внутренние имена сущностей через запятую, для которых не следует создавать локомотивы СМЕ. Используйте, если создание вариантов MUTC нарушает работу другого мода.
multiple-unit-train-control-debug=Ошибка: сообщение только при неудачной замене.\nИнформация: сообщение при каждой замене локомотива.\nОтладка: внутренние имена сущностей вместо локализованных названий.
multiple-unit-train-control-on_nth_tick=Число тиков между перераспределениями топлива между локомотивами каждой группы, работающей по системе многих единиц. Значение 0 отключает перераспределение топлива.
nanobots-auto-speed=Базовая задержка между запусками наноботов в автоматическом режиме, в тиках.
nanobots-manual-speed=Базовая задержка между запусками наноботов в ручном режиме, в тиках.
nanobots-mute-launcher=Отключает у нано-пушки звуки «Всё готово» и «Закончились материалы».
nearby-ammo-color-critical=Цвет при критически малом запасе боеприпасов.
nearby-ammo-color-low=Цвет при малом запасе боеприпасов.
nearby-ammo-color-normal=Цвет при нормальном запасе боеприпасов. Установите прозрачность (A) в 0, чтобы скрыть отображение.
nearby-ammo-display-mode=Что отображать.
nearby-ammo-update-per-second=Число обновлений за секунду.
orphan-finder-search-range=Ищет непарные подземные трубы и конвейеры на указанном расстоянии в клетках в каждом направлении.
orphan-finder-underground-mode=Как определять непарные подземные трубы.
picker-alt-mode-default=Включает Alt-режим при первом запуске и при подключении к сетевой игре.
picker-auto-circuit-bots=Роботы автоматически подключают сигнальные провода.
picker-auto-sort-inventory=Включает автоматическую сортировку содержимого контейнеров. Отключите при игре с особо вместительными контейнерами.
picker-character-color=Цвет персонажа этого игрока при первом запуске и при подключении к сетевой игре.
picker-chat-color=Цвет сообщений этого игрока в чате при первом запуске и при подключении к сетевой игре.
picker-copy-between-surfaces=Позволяет переносить содержимое сундуков между поверхностями с помощью копирования и вставки. В Space Age это даёт серьёзное преимущество в обход правил игры. Если отключено, исходный и целевой сундуки должны находиться на одной поверхности с игроком.
picker-planner-height=Максимальная высота меню инструментов Picker до появления полосы прокрутки, в пикселях. Исходное значение по умолчанию — 110 пикселей, примерно два ряда кнопок.
picker-planner-sorter=Включает сортировку дополнительных чертежей и планов сноса, добавленных другими модами.
picker-planner-width=Ширина меню инструментов Picker в столбцах по 64 пикселя. Исходное значение по умолчанию — 6 столбцов. Если меню выходит за пределы экрана, внизу появляется полоса прокрутки.
picker-remember-planner=Запоминает последний выбранный инструмент при переключении инструментов.
picker-revive-ignore-quality=Игнорирует качество призраков объектов, покрытий и намеченных улучшений при постройке. ВНИМАНИЕ: качество теряется только при укладке покрытий.
picker-revive-selected-ghosts-entity=Строит призрак под курсором, если в руке есть подходящий предмет.
picker-revive-selected-ghosts-tile=Укладывает покрытие под курсором вместо призрака, если в руке есть подходящий предмет.
picker-revive-selected-ghosts-upgrade=Выполняет намеченное улучшение под курсором, если в руке есть подходящий предмет.
picker-search-light=Направляет фонарик персонажа на объект под курсором.
picker-tape-measure-clamp=Количество значащих цифр в измерениях рулетки. По умолчанию — 4; значение 10 снимает ограничение.
picker-tool-tape-measure=Включает инструмент «Рулетка».
picker-use-bar-limit=Включает ограничение вместимости сундуков.
picker-zapper=Включает уничтожение инструментов планирования при выбрасывании на землю.
qol-custom-config=Введите пользовательскую конфигурацию, которую можно создать на https://qol-research.aidiakapi.com/.
qol-modpack-compatibility-enabled=Если включено, QoL Research определяет установленные сборки модов и использует соответствующую конфигурацию. Список сборок со встроенной конфигурацией приведён в config.lua и журнале изменений мода.
qtfl_queue_limit=Число рецептов в очереди, после которого добавление в начало очереди блокируется.
rampantFixed--aiDifficulty=Hard — стандартная сложность. Lite — более комфортная игра: враги слабее реагируют на действия игрока и реже атакуют.
rampantFixed--aiPointsPrintGainsToChat=Выводит сообщение в чат каждый раз, когда Rampant получает очки. Пассивное накопление очков не показывается. Для самой сложной игры с Rampant оставьте эту настройку отключённой. Внимание: во время ожесточённых боёв сообщения могут быстро заполнить чат!
rampantFixed--aiPointsPrintSpendingToChat=Выводит сообщение в чат каждый раз, когда Rampant тратит очки, с GPS-координатами. Для самой сложной игры с Rampant оставьте эту настройку отключённой. Внимание: во время ожесточённых боёв сообщения могут быстро заполнить чат!
rampantFixed--allowOtherEnemies=Только для новой игры или карты, на которой ещё не было Rampant. Ограничивает размещение новых врагов, оставляя место для врагов других модов. Если отключено, гнёзда других модов будут изредка появляться в случайных местах, а обычные гнёзда будут заменяться гнёздами новых врагов.
rampantFixed--buildingsImmuneToElectic=Гнёзда и черви не получают электрический урон.
rampantFixed--debugTemperament=Выводит в чат сведения о темпераменте ИИ, который определяет вероятности выбора его состояний. Используется для отладки.
rampantFixed--enableSwarm=Уменьшает область столкновения врагов, чтобы они реже мешали друг другу при поиске пути и плавнее двигались во время атак.
rampantFixed--flamethrowerTurretsRebalance=Снижает частоту атак огнемётных турелей, сохраняя суммарный урон. Для огнемёта из Rampant Arsenal это устраняет очень сильные задержки игры.
rampantFixed--permanentNocturnal=Включает появление волн атак Rampant по ночам. Лучше работает с модом Clockwork или другим модом, удлиняющим ночь.
rampantFixed--printAIStateChanges=Выводит в игровой чат сведения о состоянии ИИ Rampant для каждой поверхности. Для самой сложной игры с Rampant отключите эту настройку.
rampantFixed--spawnerEnemy=Фракция породителей: из гнёзд появляются только плеваки, которые откладывают яйца; из яиц вылупляются кусаки. Иммунитет к атакам с расстояния 30 и более.
ritnmods-bl-01=0 = как в обычной игре / 5 = максимум
ritnmods-bl-03=0 = как в обычной игре / 5 = максимум
ritnmods-bl-04=0 = как в обычной игре / 5 = максимум
ritnmods-bl-05=0 = как в обычной игре / 3 = максимум
rsc-st-cost-mp=От 0.5 до 100
rsc-st-power-mp=От 0.25 до 3
ruins-enable-debug-log=Включает множество отладочных сообщений. Включите, если хотите помочь с отладкой мода.
ruins-enable-debug-on-tick=Включает крайне большое число отладочных сообщений для события on_tick. Используется лишь в особых случаях; обычно оставляйте выключенным.
ruins-enable-debug-utils=Включает большое число отладочных сообщений библиотеки utilities. Используется лишь в особых случаях; обычно оставляйте выключенным.
ruins-enable-spawn-ruins-all-planets=Настройка применяется к сохранению только один раз. После сохранения игры её изменение больше не влияет на это сохранение. Если включено, руины появляются на любой планете согласно настройкам мода. Если выключено — только на Наувисе и стандартных планетах Space Age.
ruins-expensive-sanity-checks=Дополнительные проверки при размещении руин выявляют некорректные наборы руин, планеты и поверхности. Рекомендуется для небольших игр или игр с большим числом модов. Отключайте, только если нужна дополнительная производительность. При включённом отладочном журнале проверки работают всегда.
ruins-spawn-tick-seconds=Число секунд между попытками разместить руины на новом участке карты. Слишком малые значения снижают производительность, слишком большие задерживают появление руин.
show-max-underground-distance-on-hover=Показывать максимальную дальность при наведении на размещённый подземный конвейер или трубу.
tms-alt-mode=Всегда переводит поезда в автоматический режим. Ручной режим задаётся только при альтернативном выделении (с удержанием Shift).
unpollock-fake-rocks=Декоративные камни, не являющиеся физическими объектами, которые нужно исключить из генерации карты.\n\nРекомендуется выбирать по строке сортировки: она объединяет камни в редакторе, но может не охватывать камни из модов.\n\nВ Factorio 2.0 выбор по параметру генерации планеты действует только на камни типа Наувиса и может затронуть другие декоративные объекты, предназначенные для размещения рядом с камнями.
use-old-stats=Использует прежние характеристики самолётов из версии 2.0.2 вместо новых, балансировка которых ещё продолжается.
vibPaint-paintActives=Принудительно окрашивает подвижные части турелей.\nМожет вызвать мерцание окраски и чрезмерную насыщенность цвета.
visible-pollutants-add-to-planets=Список идентификаторов планет, на которые нужно добавить загрязнение, через запятую. Например: fulgora,vulcanus.
visible-pollutants-blend-in=Доля нового значения загрязнения, подмешиваемая к существующему облаку. Влияет на плавность изменений.
visible-pollutants-enable-solar-occlusion=Загрязнение снижает эффективность солнечных панелей в зависимости от их качества и степени покрытия загрязнением. Это поощряет размещение панелей за пределами загрязнённых областей. Изменение соответствующих настроек и размещение большого числа панелей немного увеличивают нагрузку на игру.
visible-pollutants-exponent=Значения выше 1 делают облако менее плотным при низком загрязнении. Значения ниже 1 делают его более плотным при низком загрязнении.
visible-pollutants-layer=Всё ниже этого слоя скрывается облаком загрязнения. Фактически задаёт «высоту» облака.
visible-pollutants-max=Уровень загрязнения выше этого значения считается максимальным.
visible-pollutants-min=Уровень загрязнения ниже этого значения игнорируется. Может повысить производительность игры.
visible-pollutants-opacity=Максимальная непрозрачность облака. При больших значениях облако скрывает большую часть базы.
visible-pollutants-see-through-max-opacity=Предельная непрозрачность облака в важных областях, например возле персонажа или объектов, с которыми вы взаимодействуете.
visible-pollutants-solar-occlusion-reduction=Эффективность каждой панели может снижаться на указанную долю в зависимости от загрязнения над ней. Например, обычная панель на Наувисе имеет эффективность 100%. При значении 0.5 и полном покрытии загрязнением её эффективность снизится до 50%. Легендарная панель в тех же условиях имеет исходную эффективность 250%, поэтому она снизится до 200%.
visible-pollutants-solar-occlusion-update-limit=Число чанков с солнечными панелями, которые можно обновить за один тик. Напрямую влияет на производительность игры.
visible-pollutants-ttl-minutes=Облака загрязнения, которые не видны, можно удалять. Незначительно влияет на производительность игры.
visible-pollutants-update-chart-colors=Меняет цвета загрязнения на карте, приближая их к цветам видимых облаков загрязнения.
visible-pollutants-update-limit=Число отдельных элементов облака, которые можно обновить за один тик. Напрямую влияет на производительность игры.
zcs_trash_period_seconds=Время между циклами уничтожения мусора на свалке, в секундах.
zcs_trash_pollution_cap=Максимальное загрязнение при уничтожении содержимого одной ячейки. 0 — без ограничения.
zcs_trash_pollution_exponent=При значении > 1 загрязнение растёт быстрее с увеличением размера стопки. При 1.0 рост линейный.
zcs_trash_pollution_per_item=Загрязнение, создаваемое каждым уничтоженным предметом.

