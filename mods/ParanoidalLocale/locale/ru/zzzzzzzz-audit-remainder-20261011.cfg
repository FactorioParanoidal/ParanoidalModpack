[factoriopedia-description]
bob-acid-enemy-1=[font=default-semibold][color=255,230,192]При гибели выпадает [item=bob-alien-artifact-purple]. [/color][/font]
bob-acid-enemy-2=[font=default-semibold][color=200,60,60]Периодический урон. [/color][color=40,200,200]Реакция на урон от столкновения. [/color][color=70,130,220]Атака после смерти.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивы к кислоте и яду.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимы к электричеству.[/color][/font]\n\nСостав кислотной желчи этих врагов изменился: она стала гораздо более едкой и стойкой, но утратила способность замедлять. Желчь прилипает к любому противнику, который пройдёт или проедет по ней, [font=default-semibold][color=255,230,192]нанося урон как сразу, так и в течение некоторого времени[/color][/font]. Кроме того, она наносит [font=default-semibold][color=255,230,192]больше урона постройкам[/color][/font], чем другие похожие виды кислоты. [font=default-semibold][color=255,230,192]При гибели эти враги могут взорваться брызгами кислоты, а при столкновении с крупным объектом — выпустить кислоту[/color][/font].
bob-basic-enemy-1=[font=default-semibold][color=255,230,192]При гибели выпадает [item=bob-alien-artifact]. [/color][/font]
bob-basic-enemy-2=[font=default-semibold][color=240,180,20]Создают препятствия. [/color][color=230,230,20]Замедляющая кислота.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивы к взрывам.[/color][/font]\n\nЭти существа — господствующая форма жизни на Наувисе. Они встречаются в нескольких разных формах, но все принадлежат к одному виду.\n\n[font=default-semibold][color=255,230,192]Плеваки и черви[/color][/font] атакуют липкой едкой желчью, чтобы замедлить цель и переварить её на месте. [font=default-semibold][color=255,230,192]Кусаки[/color][/font] тем временем пытаются окружить цель и разорвать её мощными передними конечностями и челюстями, заодно давая желчи время подействовать.\n\nДля хорошо бронированной цели [font=default-semibold][color=255,230,192]главную угрозу представляет именно желчь этих существ.[/color][/font] Её состав у червей и плевак этой разновидности немного различается в зависимости от размера. Разные составы могут действовать одновременно, [font=default-semibold][color=255,230,192]усиливая замедление[/color][/font]. Если транспорт под их воздействием остановится, тронуться снова может оказаться почти невозможно.
bob-electric-enemy-1=[font=default-semibold][color=255,230,192]При гибели выпадает [item=bob-alien-artifact-orange]. [/color][/font]
bob-electric-enemy-2=[font=default-semibold][color=255,120,40]Угроза воздушным целям. [/color][color=230,230,20]Замедляющая кислота. [/color][color=40,200,200]Реакция на электрический урон. [/color][color=180,60,230]Огонь по своим.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивы к электричеству и лазерам.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимы к кислоте, огню и яду.[/color][/font]\n\nЭлектрические разряды позволяют кусакам этой разновидности [font=default-semibold][color=255,230,192]поражать цели сразу за стеной[/color][/font]. Желчь электрических плевак и червей также использует электричество, вызывая кратковременный паралич. [font=default-semibold][color=255,230,192]Враги других разновидностей тоже подвержены этому воздействию[/color][/font], как и летающие объекты, которые обычно не реагируют на лужи кислоты на земле.\n\nЭлектрический урон заставляет кусак и плевак этой разновидности [font=default-semibold][color=255,230,192]значительно ускоряться[/color][/font], причём [font=default-semibold][color=255,230,192]даже их собственные лужи наэлектризованной желчи могут вызвать эту ярость[/color][/font].
bob-explosive-enemy-1=[font=default-semibold][color=255,230,192]При гибели выпадает [item=bob-alien-artifact-yellow]. [/color][/font]
bob-explosive-enemy-2=[font=default-semibold][color=255,120,40]Угроза воздушным целям. [/color][color=70,130,220]Атака после смерти.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивы к кислоте и взрывам.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимы к электричеству, огню и лазерам.[/color][/font]\n\nВзрывная разновидность наносит мгновенный урон по большой площади вместо медленного воздействия вроде пищеварительной желчи. Однако её атаки не так беспорядочны, как кажутся: их действие направлено так, чтобы не поражать союзников. К счастью, [font=default-semibold][color=255,230,192]внешняя область поражения взрыва, судя по всему, также не задевает небоевую инфраструктуру[/color][/font].\n\nХотя лужи, остающиеся после этих атак, не переваривают и не замедляют, их всё равно следует избегать. Они извлекают органические соединения из земли под собой и перерабатывают их во взрывчатку. Поэтому [font=default-semibold][color=255,230,192]через некоторое время лужа может взорваться снова, иногда несколько раз[/color][/font]. Кусаки и плеваки этой разновидности также могут взрываться при гибели.
bob-fire-enemy-1=[font=default-semibold][color=255,230,192]При гибели выпадает [item=bob-alien-artifact-red]. [/color][/font]
bob-fire-enemy-2=[font=default-semibold][color=200,60,60]Периодический урон. [/color][color=255,120,40]Угроза воздушным целям. [/color][color=180,60,230]Огонь по своим.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивы к взрывам, огню и лазерам.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимы к урону от столкновений, физическому и бронебойному урону.[/color][/font]\n\nАтаки всех существ этой разновидности вызывают пожары. Их подпитывают вещества, которые одновременно горючи и обладают высокой кислотностью, поэтому [font=default-semibold][color=255,230,192]даже полностью огнеупорные постройки не защищены от их действия[/color][/font]. Поначалу слабый огонь [font=default-semibold][color=255,230,192]разгорается по мере того, как повторные атаки добавляют горючее[/color][/font], и в итоге становится самой разрушительной атакой против оборонительных сооружений среди всех враждебных существ Наувиса. Пламя может также [font=default-semibold][color=255,230,192]распространиться на небольшое расстояние[/color][/font] от места возникновения.
bob-piercing-enemy-1=[font=default-semibold][color=255,230,192]При гибели выпадает [item=bob-alien-artifact-blue]. [/color][/font]
bob-piercing-enemy-2=[font=default-semibold][color=40,200,200]Реакция на урон, кроме электрического и кислотного.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивы к взрывам, огню, физическому и бронебойному урону.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимы к кислоте, электричеству, лазерам и яду.[/color][/font]\n\nЭта разновидность врагов не использует пищеварительную желчь для дальних атак, а выстреливает [font=default-semibold][color=255,230,192]бронебойными шипами[/color][/font] с высокой скоростью. Хотя шипы не наносят периодический урон, как атаки некоторых других разновидностей, для уклонения от них нужна хорошая подвижность. Однако [font=default-semibold][color=255,230,192]их снаряды не могут пролетать над стенами[/color][/font].\n\nЭти враги особенно [font=default-semibold][color=255,230,192]устойчивы к любым кинетическим воздействиям[/color][/font], быстро восстанавливают здоровье и, помимо высокой обычной скорости, [font=default-semibold][color=255,230,192]резко ускоряются, когда их атакуют[/color][/font]. Поэтому их [font=default-semibold][color=255,230,192]кусаки гораздо опаснее[/color][/font], чем у других разновидностей. [font=default-semibold][color=255,230,192]Электричество не вызывает их ярость[/color][/font].
bob-poison-enemy-1=[font=default-semibold][color=255,230,192]При гибели выпадает [item=bob-alien-artifact-green]. [/color][/font]
bob-poison-enemy-2=[font=default-semibold][color=200,60,60]Периодический урон. [/color][color=255,120,40]Угроза воздушным целям. [/color][color=60,200,60]Лечение. [/color][color=40,200,200]Реакция на урон.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Устойчивы к кислоте и яду.[/color][/font]\n[font=default-semibold][color=60,200,60]Уязвимы к огню.[/color][/font]\n\nВместо обычных химических токсинов яд этой разновидности содержит смесь ферментов, вырабатываемых свободно плавающими клетками. Ферменты приспособлены разрушать любой материал, с которым соприкасаются. Клетки распространяются со слюной существ или в газовых облаках вокруг их тел и также способны [font=default-semibold][color=255,230,192]залечивать раны союзных существ[/color][/font].\n\nЭти враги наносят [font=default-semibold][color=255,230,192]умеренный периодический урон по большой площади[/color][/font], но главная их опасность — способность лечить, особенно в сочетании с другими разновидностями врагов.

