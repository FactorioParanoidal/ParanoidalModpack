PI_inserter_selector_ui=Включает планировщик автоматического освобождения манипуляторов.\nМанипуляторы в выбранной области освобождаются полностью автоматически.\nВыделение области с зажатой клавишей Shift отключает автоматическое освобождение манипуляторов в ней.\nМанипуляторы продолжают работать как обычно: брать и перекладывать предметы.
pi-orphan-mark-del-key=Удаляет оставшиеся метки уничтоженных манипуляторов.\n\nОбычно метка автоматически удаляется вместе с манипулятором. Если этого не произошло, этой командой можно убрать оставшиеся метки.

