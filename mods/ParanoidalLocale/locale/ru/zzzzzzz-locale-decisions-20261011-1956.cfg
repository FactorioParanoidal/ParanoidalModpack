settings_checkbox_tooltip=Выберите, чтобы удалить этот этап или добавить новый этап под ним.\n__CONTROL_STYLE_BEGIN__Ctrl + щелчок__CONTROL_STYLE_END__, чтобы выбрать несколько значений, __CONTROL_STYLE_BEGIN__Shift + щелчок__CONTROL_STYLE_END__ для выбора диапазона.

[mod-description]
RampantFixed= Сделано на основе Rampant 1.1.1. \n \n1. ИИ переписан, геймплей отличается. Может атаковать издалека. Улучшен поиск прохода в обороне. По умолчанию не заселяет всю карту\n2. +2 Фракции. Могут мутировать существующие гнезда. Смешанные атаки от разных фракций. Возможно сочетание с гнездами прочих врагов\n Детали на мод-портале
reskins-angels=Перерисовывает предметы, объекты и технологии из модов Angel's, добавляя цвета уровней и маркировку иконок. Содержит иконки высокого разрешения, обновлённые модели, освещение и изображения. Позволяет настраивать маркировку, цвета и соответствие уровней. Часть серии Artisanal Reskins.
reskins-bobs=Перерисовывает предметы, объекты и технологии из модов Bob's, добавляя цвета уровней и маркировку иконок. Содержит иконки высокого разрешения и обновлённые изображения в стиле базовой Factorio. Позволяет настраивать маркировку, цвета и соответствие уровней. Часть серии Artisanal Reskins.
reskins-compatibility=Заменяет изображения предметов, зданий и технологий в модах, которые не подпадают под охват имеющихся модов Artisanal Reskin, и ограничиваясь модами, дополняющими или хорошо совместимыми с модами Bob и Angel. Содержит высококачественные изображения и обновленные модели зданий из иных модов для унификации с модами Artisanal Reskins, а также поддерживает широкую настройку отображения уровней, цветов и картинок. Подробный список поддерживаемых модов можно посмотреть на портале модов. Часть серии модов Artisanal Reskins.
reskins-library=Содержит функциональные библиотеки, графику и иконки, требуемые всеми модами Reskins. Часть серии модов Reskins.

