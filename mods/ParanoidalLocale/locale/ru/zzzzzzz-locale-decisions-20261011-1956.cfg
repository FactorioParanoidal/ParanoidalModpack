[entity-description]
factory-1=Полезная площадь: 30x30\nПортов: 16\n\nНажмите __CONTROL__factory-rotate__, чтобы показать или скрыть маркеры портов (Alt-режим должен быть включён).\n__CONTROL__factory-open-outside-surface-to-remote-view__ — открыть заводской этаж в удалённом просмотре.\n__CONTROL__cut__ — перенести заводское строение из удалённого просмотра.\n[font=default-semibold][color=255,230,192]Размер: [/color][/font]8x8
factory-2=Полезная площадь: 46x46\nПортов: 24\n\nНажмите __CONTROL__factory-rotate__, чтобы показать или скрыть маркеры портов (Alt-режим должен быть включён).\n__CONTROL__factory-open-outside-surface-to-remote-view__ — открыть заводской этаж в удалённом просмотре.\n__CONTROL__cut__ — перенести заводское строение из удалённого просмотра.\n[font=default-semibold][color=255,230,192]Размер: [/color][/font]12x12
factory-3=Полезная площадь: 60x60\nПортов: 32\n\nНажмите __CONTROL__factory-rotate__, чтобы показать или скрыть маркеры портов (Alt-режим должен быть включён).\n__CONTROL__factory-open-outside-surface-to-remote-view__ — открыть заводской этаж в удалённом просмотре.\n__CONTROL__cut__ — перенести заводское строение из удалённого просмотра.\n[font=default-semibold][color=255,230,192]Размер: [/color][/font]16x16
minime_generic_corpse=Заменяет объекты «__ENTITY__character-corpse__» из неактивных модов.

