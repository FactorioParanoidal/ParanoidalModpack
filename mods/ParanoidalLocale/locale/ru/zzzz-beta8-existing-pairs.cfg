[mod-setting-description]
BI_Easy_Bio_Gardens=Bio gardens consume ready-made fluid fertilizer, so just one pipeline is enough to supply all ingredients. However, this requires 50% more fertilizer than combining solid fertilizer and water on site.\nBio gardens will transmit electricity to adjacent Bio gardens. Arrange them on a grid, with no more than 1 tile between 2 Bio gardens, and they will be magically connected. :-)\n(Default: off)
Factorissimo2-free-recursion=Позволяет создавать рекурсивные заводские строения даже без исследования каких-либо технологий рекурсии.
Factorissimo2-hide-recursion=Скрывает технологии Рекурсия 1 и 2, чтобы вы не смогли их исследовать.
Factorissimo2-hide-recursion-2=Скрывает технологию Рекурсия 2, чтобы вы не смогли её исследовать.
Noxys_Trees-chunks-per-operation=Позволяет точно контролировать производительность этого мода и скорость, с которой количество деревьев увеличивается.
Noxys_Trees-deaths-by-lack-of-fertility-minimum=Если плодородие земли ниже этого значения, у дерева есть шанс погибнуть.
Noxys_Trees-debug=Включает вывод отладочных сообщений.
Noxys_Trees-degrade-tiles=Со временем медленно разрушается плитка для пола, которая блокирует рост деревьев, пока деревья не смогут вырасти снова.
Noxys_Trees-enabled=Позволяет деревьям умирать и распространятся.
Noxys_Trees-expansion-distance=На каком расстоянии исходное дерево может сгенерировать дерево.
Noxys_Trees-kill-trees-near-unwanted=Случайная гибель деревьев, которые находятся около ульев кусак, залежами урановой руды или объектами игрока. Это также влияет на смерть деревьев из-за отсутствия плодородия или чрезмерного загрязнения.
Noxys_Trees-minimum-distance-between-tree=Минимальное расстояние между деревьями, на котором могут расти деревья.
Noxys_Trees-minimum-distance-to-enemies=Минимальное расстояние от ульев кусак или червей, на котором могут расти деревья.
Noxys_Trees-minimum-distance-to-uranium=Минимальное расстояние от залежей урановой руды, на котором могут расти деревья.
Noxys_Trees-overpopulation-kills-trees=Если участок будет перенаселен, то деревья будут медленно погибать.
Noxys_Trees-ticks-between-operations=Позволяет точно контролировать производительность этого мода и скорость, с которой количество деревьев увеличивается.
aircraft-hardmode=Делает авиацию более уязвимой для жуков, используйте на свой страх и риск!
bobmods-enemies-enableartifacts=Если включено, то при смерти кусак будут выпадать инопланетные материалы
bobmods-enemies-enablenewartifacts=Если включено, то при смерти кусак будут выпадать разноцветные инопланетные материалы
bobmods-enemies-enablesmallartifacts=Если включено, то при смерти кусак будут выпадать малые инопланетные материалы
bobmods-inserters-show-window=Если включено, то в отдельном окне конфигурации будут отображаться текущие настройки манипулятора.
fitolamps=Включает освещение фитолампами в теплицах и биофермах (только графические изменения).
fs-clear-highlights-with-gui=Удалить прямоугольники выделения и стрелки при закрытии интерфейса.
heroturrets-setting-level-buff-modifier=Изменяет баффы, применяемые к рангу
heroturrets-setting-level-up-modifier=Изменяет модификатор убийства для ранга
inserter-immunity=Делает все самолеты невосприимчивыми к манипуляторам, кроме загрузки топлива.
item-drop=Разрушенные сундуки высыпают содержимое
newbie_resourse=НЕ РЕКОМЕНДУЕТСЯ отключать если вы новичок в Paranoidal
non-combat-mode=Убирает реактивный самолет, боевой самолет и летающую крепость из дерева технологий.
paranoidal-disable-vanilla-evolution=Принудительно выключает стандартную эволюцию жуков при создании карты. Будет действовать только эволюция по исследованиям.
paranoidal-flowfix-min-time=Рецепты с меньшим временем будут пропорционально увелечены по времени,входным ресурсам и продукции
res_loc_1=Включает замену стандартной графики на графику из мода Yuoki (только графические изменения).
res_loc_2=Включает замену стандартной графики на графику из мода Yuoki (только графические изменения).
res_loc_3=Включает замену стандартной графики на графику из мода Yuoki (только графические изменения).
res_loc_e=Включает замену стандартной графики на графику из мода Yuoki (только графические изменения).
robot-attrition-factor=Множитель шанса крушения дрона. Примечание: другие моды могут изменять или переопределять это значение для нужных поверхностей.
stone-path-concrete=Включает замену стандартной графики на графику из мода Concretexture
todolist-auto-assign=Если есть только один игрок в игре, то автоматически назначать задачи для игрока.
todolist-show-button=Если настройка включена, то в левом верхнем углу всегда будет кнопка "Задачи".\nЕсли отключить настройку, то в "Задачи" можно добраться только горячими клавишами (Shift-T по умолчанию).
todolist-show-log=Если включена настройка, то мод будет выводить отладочные сообщения в окно чата.\nВнимание: там их очень много:)
todolist-window-height=Высота окна списка задач. По умолчанию - 600.

