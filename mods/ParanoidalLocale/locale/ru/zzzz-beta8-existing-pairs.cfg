[technology-description]
CW-air-filter-cleaning=Техническое обслуживание загрязнённых воздушных фильтров для их повторного использования, заключающееся в восстановлении фильтрующего агента (угля) различными способами. В зависимости от технологического уровня количество фильтров, которые изнашивается и разрушается в процессе обслуживания, будет уменьшаться. 2-й уровень технологии позволит использовать меньшее количества фильтрующего агента (угля). 3-й уровень позволяет тщательно промывать использованные воздушные фильтры водой, отказаться от замены фильтрующего агента (угля) и дополнительно поднять процент выхода годных фильтров. 4-й, наиболее технологически совершенный уровень позволит производить регенерацию воздушных фильтров с использованием пара и максимальным процентом выхода годных фильтров.
CW-air-filtering=Технология очистки загрязнения воздуха, которая позволяет создавать специализированный воздухоочиститель, работающий на заменяемых воздушных фильтрах. Система оборудована умными датчиками, которые включают оборудование, лишь если воздух вокруг требует очистки, чем значительно сохраняется ресурс очистных фильтров.
advanced-aerodynamics=Дальнейшие исследования высокоскоростной аэродинамики.
afterburner=Разгони свой самолет с помощью форсажной камеры!
aircraft-energy-shield=Легкий, мощный модуль щита, разработанный против тяжелого огня.
artillery-prototype=Прототип стационарного артиллерийского орудия. Будет вести автоматическую стрельбу по гнездам. По рассчётным характеристикам обладает небольшой дальностью и скорострельностью.
bob-electric-pole=Исследование улучшенных линий электропередач.
bob-gold-processing=Исследование способов получения чистого золота из руды.
bob-lead-processing=Исследование способов получения чистого свинца из руды.
bob-nickel-processing=Исследование способов получения чистого никеля.
bob-robo-modular=Исследование возможности разбиения дронстанций на модули.
bob-silicon-processing=Исследование способов получения чистого кремния.
factory-connection-type-heat=Позволяет передавать тепло в заводское строение с помощью тепловых труб.\n__CONTROL__factory-increase__ и __CONTROL__factory-decrease__, чтобы изменить частоту передачи.
factory-recursion-t1=Позволяет размещать заводские строения внутри других, более крупных заводских строений.
factory-recursion-t2=Позволяет размещать заводские строения внутри других заводских строений того же размера.
flying-fortress=Подавляющее превосходство в воздухе, вооружен танковым орудием (да, вы правильно прочитали), высокоскорострельным пулеметом, установкой самонаводящихся ракет и огромной сеткой оборудования!
high-explosive-cannon-shells=В 10 раз (теоретически) более сильные разрывные снаряды.
jets=Когда вам нужно добраться куда-то БЫСТРО, имеет на борту скорострельный пулемет, самонаводящиеся ракеты и возможность распыления напалма. Держу пари, напалм сделает жукам больно.
napalm=Долго горящая альтернатива топлива для огнемета, работает особенно хорошо, когда огонь открывается с пусковых установок смонтированых на технике!
robot-attrition-explosion-safety=Логистические дроны не повреждают объекты при крушении, если они находятся в логистической сети с не более 500 дронов на 1 уровень исследования.

