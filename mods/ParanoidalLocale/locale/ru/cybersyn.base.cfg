wagon-manifest=Управление вагоном
mode-description-station=Делает соседнюю ж/д станцию станцией диспетчерской сети. Подключите к нему запасы станции: положительные сигналы она отдаёт, отрицательные запрашивает. Виртуальные сигналы задают маску сети, приоритет и пороги.
mode-description-depot=Делает соседнюю ж/д станцию депо. Свободные поезда стоят здесь и ждут, пока диспетчер не даст им доставку.
mode-description-refueler=Делает соседнюю ж/д станцию заправкой. Поезда с малым запасом топлива заезжают сюда между доставками, если совпадает сеть.
mode-description-station-control=Добавляет станции на той же остановке настройки по предметам: сигнал предмета на входе задаёт его порог запроса. На выходе грузы в пути на станцию и со станции, а если включено, ещё и число поездов.
mode-description-secondary-inventory=Добавляет станции на той же остановке второй, отдельный склад. Его предметы отдаются и запрашиваются со своей маской сети, приоритетом и порогами, так что одна остановка может возить разные грузы в разных сетях. Подчиняется переключателю снабжения и запроса станции.
mode-description-wagon-manifest=Ставится у вагона на станции. Выдаёт, что этот вагон должен взять на станции снабжения или что он везёт на станцию запроса, чтобы манипуляторы работали ровно с его долей груза.
switch-provide=Только снабжение
switch-request=Только запрос
switch-provide-tooltip=Разрешить этой станции только предоставление в сеть поездов своих предметов. По умолчанию станции работают в режиме снабжения и запроса.
switch-request-tooltip=Разрешить этой станции только запрашивание предметов из сети поездов. По умолчанию станции работают в режиме снабжения и запроса.
network=Сеть
network-tooltip=Сигнал, по которому определяется сеть этого контроллера. Поезда из депо едут на станции снабжения и запроса, только если у всех них один и тот же сигнал сети.
allow-list-description=Авто-список разрешенных поездов
allow-list-tooltip=Если параметр включен, сеть проверит, что каждый вагон поезда может быть загружен или разгружен на станции, и автоматически добавит в список разрешенных поездов этой станции. Если параметр отключен, список разрешенных поездов не используется, и всем поездам разрешается останавливаться здесь.
allow-list-refresh-description=Обновить список разрешенных поездов
allow-list-refresh-tooltip=Список разрешённых поездов составляется при установке контроллера по объектам вокруг него. Это затратно, поэтому в другое время почти не делается. Кнопка сразу пересчитает список этого контроллера.
allow-list-preview=Предпросмотр списка разрешенных поездов
allow-list-preview-tooltip=Каким поездам разрешено останавливаться на этой станции.\n[img=item/locomotive] = локомотив\n[img=item/cargo-wagon] = предметы\n[img=item/fluid-wagon] = жидкости\n[img=cybersyn-both-wagon] = и то и другое\n[img=utility/rail_path_not_possible] = станции нет\n[img=entity/entity-ghost] = контроллер ещё призрак
allow-list-no-station=Не привязано к железнодорожной станции
is-stack-description=Порог в ячейках
is-stack-tooltip=При включении параметра все пороговые значения запросов для этой станции интерпретируются как количество полных ячеек, а не общее количество предметов. Не влияет на интерпретацию порогового значения для жидкостей.
enable-inactive-description=Условие бездействия
enable-inactive-tooltip=Если включено, поезд на этой станции не только выполняет заказ, но и ждёт бездействия. Полезно, когда перед отъездом что-то должно закончиться, например манипуляторы должны выгрузить предметы из захвата.
use-same-depot-description=Прикреплять поезд к депо
use-same-depot-tooltip=Если параметр включен, поезда всегда возвращаются в то же депо, что и покинули, независимо от названия. Если параметр отключен, поезду разрешается вернуться в любое депо с таким же названием.\n\n[color=yellow]Несовместимо с прерываниями, которые должны происходить до возврата поезда в депо.[/color]
depot-bypass-description=Обход депо
depot-bypass-tooltip=Если параметр включен, поезда из этого депо не обязательно должны быть припаркованы в этом депо для назначения новых доставок, у них просто не должно быть текущих активных доставок. Впоследствии они все равно вернутся в это депо, если у них будет заканчиваться топливо и не будет доступных станций заправки.
enable-slot-barring-description=Исключать нефильтрованные слоты
enable-slot-barring-tooltip=Если параметр включен, все нефильтрованные ячейки управляемого вагона будут заблокированы, чтобы ни один предмет не мог загрузиться в него.
enable-circuit-condition-description=Логическое условие
enable-circuit-condition-tooltip=Если включено, поезд уезжает с этой станции только при логическом условии [virtual-signal=signal-check]>0. Этот сигнал нужно подать на ж/д станцию, и станция должна передавать сигналы поезду. Полезно, когда перед отъездом нужно что-то сложнее, чем умеет условие бездействия.
enable-train-count-description=Подсчёт поездов
enable-train-count-tooltip=Если включено, на выходе контроллера управления станцией есть сигнал [virtual-signal=signal-T]: число поездов, которые везут груз на эту станцию или с неё.
enable-manual-inventory-description=Ручное управление инвентарём
enable-manual-inventory-tooltip=[color=yellow]Расширенная функция[/color], полезная при управлении несколькими станциями с общими запасами. Если она отключена, диспетчерская сеть сама учитывает в запасах станции поезда, которые к ней едут. Если включена, это нужно делать вручную, добавляя выход этого контроллера к сигналу груза.
disable-manifest-description=Не использовать условие погрузки
disable-manifest-tooltip=Если флажок установлен, поездам не нужно будет проверять условие о погрузке, чтобы они могли уехать. Например, это полезно, если запрошенные предметы могут быть недоступны из-за их порчи.\n\n[color=cyan]Необходимо включить по крайней мере еще одно условие ожидания.[/color]
source-station=Контроллер станции
source-inventory=Склад __1__
network-inherited=Как у станции. Маску этого склада задаёт сигнал сети на его входе.
relative-networks=Сети
section-advertised=Объявлено
section-provided=Отдаёт
section-requested=Запрашивает
section-none=Ничего
section-below-threshold=Оранжевые ниже порога запроса, поэтому пока не отправляются.
section-not-advertised=Не объявлено:
section-starved=В этой сети это никто не поставляет.
section-provide-only=у станции «Только снабжение»
section-request-only=у станции «Только запрос»
section-switch=переключатель снабжения и запроса станции
section-priority=приоритет __1__
section-paused=__1__ не считывается: контроллер станции выключен, и её склады на паузе.
section-paused-no-signals=__1__ не считывается: на контроллер станции не приходят сигналы, и её склады на паузе.
