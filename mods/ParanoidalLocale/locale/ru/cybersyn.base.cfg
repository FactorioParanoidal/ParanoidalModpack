[mod-setting-description]
cybersyn-enable-planner=Включает или отключает алгоритм централизованного планирования. Если этот параметр отключен, новые поезда отправляться не будут.
cybersyn-ticks-per-second=Сколько раз в секунду центральный планировщик должен обновлять состояние сети и планировать доставки. Это значение будет округлено до делителя 60. Установка этого значения [color=orange]в 0 остановит все отправки[/color].
cybersyn-update-rate=Сколько станций за тик может быть опрошено или запланировано на доставку одновременно. Большее число позволяет центральному планировщику быстрее актуализировать состояния сети, но за счёт снижения производительности.
cybersyn-request-threshold=[virtual-signal=cybersyn-request-threshold] Порог запроса по умолчанию, когда на станцию не подается сигнал порога запроса. Если станция получает отрицательный сигнал предмета, превышающий ее порог запроса, а также существует какая-либо станция с положительным сигналом этого же предмета, превышающим тот же порог, тогда будет запланирована доставка этого предмета между этими двумя станциями.
cybersyn-fluid-request-threshold=[virtual-signal=cybersyn-fluid-request-threshold] Порог запроса по умолчанию для жидкостей, когда на станцию не подается сигнал порога запроса жидкости. Заменяет пороговое значение запроса для жидкости. Установите значение 0 для отключения.
cybersyn-priority=[virtual-signal=cybersyn-priority] Приоритет по умолчанию, когда сигнал приоритета не подается на станцию, депо или заправку. Станции с более высоким приоритетом будут получать доставки раньше станций с более низким приоритетом.
cybersyn-locked-slots=Количество заблокированных ячеек на грузовой вагон по умолчанию, когда на станцию не подается сигнал [virtual-signal=cybersyn-locked-slots] "заблокированные ячейки на грузовой вагон". Когда станция снабжения настроена на X заблокированных ячеек для каждого грузового вагона, любой поезд, пытающийся осуществить доставку с нее, изменит свои запросы таким образом, чтобы в каждом грузовом вагоне всегда оставались пустыми по крайней мере X ячеек. Это необходимо для правильной работы станций, снабжающих несколькими разными предметами одновременно.
cybersyn-locked-slots-per-item=Как считаются заблокированные ячейки станции снабжения, если одна доставка везёт несколько типов предметов. Выключено: ячейки резервируются один раз на грузовой вагон, сколько бы ни было предметов. Включено: отдельно на каждый тип предмета в доставке. Например, при 2 заблокированных ячейках и 3 предметах в каждом вагоне останется 6 свободных ячеек, и излишкам каждого предмета хватит места. Жидкости не учитываются.
cybersyn-reserved-fluid-capacity=Зарезервированная вместимость по умолчанию для [item=fluid-wagon] одного жидкостного вагона, когда соответствующий сигнал не подаётся на станцию. Когда станция резервирует вместимость, любой поезд, выполняющий доставку с неё, изменит свои заказы так, чтобы в каждом жидкостном вагоне оставался как минимум заданный объём свободного места. Это необходимо при неточной загрузке, например из-за подключённых труб.
cybersyn-network-flag=Набор подсетей по умолчанию, которые станция будет обслуживать, когда на станцию не подается сетевой сигнал. Это целое число интерпретируется побитово, чтобы дать 32 возможных подсети на выбор.
cybersyn-fuel-threshold=Какой процент [img=utility/fuel_icon] запасов топлива в поезде должен быть, чтобы пропустить дозаправку. Если это значение равно 1, поезда всегда будут посещать заправочную станцию после завершения доставки.
cybersyn-warmup-time=Сколько секунд станционный контроллер ждёт, прежде чем подключиться к диспетчерской сети. Это время, чтобы успеть изменить или исправить логическую сеть до того, как поезда начнут ездить на новую станцию, построенную по чертежу.
cybersyn-stuck-train-time=По истечении этого количества секунд с момента отправки поезда будет отправлено оповещение, сообщающее вам, что поезд, вероятно, застрял и не завершил свою доставку. Игроку, скорее всего, придется отлаживать свою сеть, чтобы освободить поезд.
cybersyn-allow-cargo-in-depot=Если этот параметр включен, поездам разрешается иметь груз в депо: предупреждения не создаются, и поезд не будет задержан. Кроме того, поезда, направляющиеся к станциям запроса с включённым параметром «Условие бездействия», будут ожидать бездействия вместо ожидания полной выгрузки. Полезно для железнодорожных систем, где депо обрабатывают избыточный груз. Только для продвинутых пользователей.
cybersyn-alert-unexpected-cargo=Если включено, тревога появляется, когда поезд грузит предмет, которого нет в его накладной. Перебор заказанных предметов тревогу не вызывает, только новые типы предметов.
cybersyn-diagnostics=Выкл.: ничего не записывается, вкладки «Журнал» нет.\nБазовая: журнал на 4096 строк. В нём причины, по которым ждёт каждый неисполненный запрос, сбои, тревоги и изменения станций.\nПолная: ещё и второй журнал на 16 384 строки с каждой отправкой, прибытием, отъездом и сменой состояния поезда. На большой базе его хватает примерно на 15 минут.
cybersyn-manager-updates-per-second=Сколько раз в секунду обновляется открытое окно диспетчерской. 0 останавливает обновление. Чем больше значение, тем выше нагрузка на UPS.
cybersyn-manager-actions=Кто может выполнять команды и действия диспетчерской, которые меняют игру: /cybersyn-fix-priorities, /cybersyn-abolish-same-depot, /cybersyn-recalculate-train-size, /cybersyn-refresh-allow-lists, а в окне кнопки «В депо» и «Пересчитать доставки». В одиночной игре можно всегда. О каждом действии узнаёт вся команда, и оно пишется в журнал.
cybersyn-manager-hud=Небольшое табло в две строки, которое можно перетащить: число неисполненных запросов, свободные поезда (наименьшее их число в одной сети) и самая частая причина ожидания. Обновляется раз в 5 секунд. Щелчок открывает диспетчерскую.
cybersyn-manager-panels=Панель диспетчерской сети рядом с окном её ж/д станции, локомотива или грузового вагона: роль, сеть, статус, запросы, доставки, проблемы настройки и последние события.

