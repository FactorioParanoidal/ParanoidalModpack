[item-description]
cybersyn-combinator=Ставится рядом с железнодорожной станцией и подключает её к диспетчерской сети поездов. Тогда станция может запрашивать или отдавать предметы, о которых контроллеру сообщают через логическую сеть.
cybersyn-provider-id=Однозначно определяет эту остановку в диспетчерской сети.
cybersyn-requester-id=Однозначно определяет эту остановку в диспетчерской сети.
cybersyn-refueler-id=Однозначно определяет эту остановку в диспетчерской сети.

[entity-name]
cybersyn-combinator=Станционный контроллер
cybersyn-combinator-output=Выход станционного контроллера

[entity-description]
cybersyn-combinator=Имеет 6 режимов. Для простой сети достаточно режимов станции и депо.

[technology-name]
