[sqt-setting-name]
disable-setting=Не модифицировать __1__
chests=[item=steel-chest] сундуки
circuits=[item=constant-combinator] логические схемы
drills=[item=electric-mining-drill] буры
machines=[item=assembling-machine-1] [item=stone-furnace] машины
pipes=[item=pipe] трубы
solar=[item=solar-panel] [item=accumulator] солнечную энергию
steam=[item=boiler] [item=steam-engine] паровую энергию
trees=[entity=tree-01] деревья
turrets=[item=gun-turret] [item=laser-turret] турели
misc=различные объекты

[sqt-setting-description]
chests=[item=steel-chest] Сундуки, логистические, связанные и бесконечные сундуки.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
drills=[item=electric-mining-drill] Буры.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
trees=Деревья. Включено — мод не уменьшает их области столкновения. Выключено — ограничивает область столкновения 0,2 клетки в каждую сторону от центра, в том числе у крупных деревьев, если нет отдельного исключения. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
turrets=[item=gun-turret] Пулемётные, [item=laser-turret] лазерные, огнемётные и артиллерийские турели.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
circuits=[item=constant-combinator] Комбинаторы, лампы, дисплеи, программируемые динамики, переключатели.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
machines=[item=assembling-machine-1] Сборочные автоматы, [item=stone-furnace] печи, лаборатории, ракетные шахты.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
pipes=[item=pipe] Трубы, подземные трубы, помпы, клапаны, резервуары, прибрежные насосы, тепловые трубы.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
solar=[item=solar-panel] Солнечные панели и [item=accumulator] аккумуляторы.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
steam=[item=boiler] Бойлеры, [item=steam-engine] паровые двигатели, реакторы, твердотопливные генераторы.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.
misc=Маяки, опоры ЛЭП, манипуляторы, радары, дронстанции, ж/д-станции.\nВключено — мод не уменьшает области столкновения объектов этой группы. Выключено — уменьшает их, если нет отдельных исключений. Явное удаление столкновений по спискам имён или типов может применяться и при включённом флажке.

[mod-setting-name]
sqt-blacklist-types=Чёрный список типов
sqt-blacklist-names=Чёрный список названий
sqt-remove-collision=Использовать списки отключения столкновений (ВНИМАНИЕ: Влияет на кусак!)
sqt-remove-collision-types=Отключить столкновение для типов
sqt-remove-collision-names=Отключить столкновение для названий

[mod-setting-description]
sqt-blacklist-types=Список типов объектов, разделённых запятыми, которые не модифицировать, например, "tree, inserter, electric-pole".
sqt-blacklist-names=Список названий объектов, разделённых запятыми, которые не модифицировать, например, "fast-inserter, small-electric-pole".
sqt-remove-collision=Отключить столкновение игрока с перечисленными объектами.
sqt-remove-collision-types=Список типов объектов через запятую, для которых отключить столкновение игрока, если включено отключение столкновений. Например: "tree, inserter, electric-pole". Изменение распространяется на всю группу улучшений и понижений каждого подходящего объекта.
sqt-remove-collision-names=Список имён объектов через запятую, для которых отключить столкновение игрока, если включено отключение столкновений. Например: "fast-inserter, small-electric-pole". Изменение распространяется на всю группу улучшений и понижений объекта.

