[sqt-setting-name]
disable-setting=Не модифицировать __1__
chests=[item=steel-chest] сундуки
circuits=[item=constant-combinator] логические схемы
drills=[item=electric-mining-drill] буры
machines=[item=assembling-machine-1] [item=stone-furnace] машины
pipes=[item=pipe] трубы
solar=[item=solar-panel] [item=accumulator] солнечную энергию
steam=[item=boiler] [item=steam-engine] паровую энергию
trees=[entity=tree-01] деревья
turrets=[item=gun-turret] [item=laser-turret] турели
misc=различные объекты

[sqt-setting-description]
chests=[item=steel-chest] Сундуки, логистические, связанные и бесконечные сундуки.
drills=[item=electric-mining-drill] Буры.
trees=Деревья: коллизия ограничивается 0,2 клетки от центра, включая крупные деревья.
turrets=[item=gun-turret] Пулемётные, [item=laser-turret] лазерные, огнемётные и артиллерийские турели.
circuits=[item=constant-combinator] Комбинаторы, лампы, дисплеи, программируемые динамики, переключатели.
machines=[item=assembling-machine-1] Сборочные автоматы, [item=stone-furnace] печи, лаборатории, ракетные шахты.
pipes=[item=pipe] Трубы, подземные трубы, помпы, клапаны, резервуары, прибрежные насосы, тепловые трубы.
solar=[item=solar-panel] Солнечные панели и [item=accumulator] аккумуляторы.
steam=[item=boiler] Бойлеры, [item=steam-engine] паровые двигатели, реакторы, твердотопливные генераторы.
misc=Маяки, опоры ЛЭП, манипуляторы, радары, дронстанции, ж/д-станции.

[mod-setting-name]
sqt-blacklist-types=Чёрный список типов
sqt-blacklist-names=Чёрный список названий
sqt-remove-collision=Использовать списки отключения столкновений (ВНИМАНИЕ: Влияет на кусак!)
sqt-remove-collision-types=Отключить столкновение для типов
sqt-remove-collision-names=Отключить столкновение для названий

[mod-setting-description]
sqt-blacklist-types=Список типов объектов, разделённых запятыми, которые не модифицировать, например, "tree, inserter, electric-pole".
sqt-blacklist-names=Список названий объектов, разделённых запятыми, которые не модифицировать, например, "fast-inserter, small-electric-pole".
sqt-remove-collision=Отключить столкновение игрока с перечисленными объектами.
sqt-remove-collision-types=Список типов объектов, разделённых запятыми, для которых отключить столкновение, например, "tree, inserter, electric-pole".
sqt-remove-collision-names=Список названий объектов, разделённых запятыми, для которых отключить столкновение, например, "fast-inserter, small-electric-pole".

