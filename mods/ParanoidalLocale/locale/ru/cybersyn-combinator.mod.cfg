[mod-setting-description]
cybersyn-combinator-loglevel=Какие сообщения мод пишет в журнал. Обычно менять не нужно, только если об этом попросит разработчик.
cybersyn-combinator-loglevel-chat=Какие сообщения журнала показываются в чате игры.
cybersyn-combinator-slotcount-wagon=Число ячеек самого большого грузового вагона; от него зависит, сколько ячеек можно заблокировать.\nЗначение по умолчанию 1000 — просто запас на случай вагонов из модов.
cybersyn-combinator-upgradeable=Комбинатор заявок считается улучшенной версией постоянного комбинатора: обычный планировщик улучшений будет помечать постоянные комбинаторы для замены на комбинаторы заявок.\n\nНа быструю замену это не влияет.
cybersyn-combinator-use-stacks=Когда это возможно, вводить сигналы в пачках, а не в штуках.
cybersyn-combinator-expressions-enable=Если включено, в полях количества и пачек можно писать математические выражения, например «5 + 5» превратится в «10». Поддерживаются сложение (+), вычитание (-), умножение (*), деление (/), остаток от деления (%), степень (^) и скобки.
cybersyn-combinator-disable-built=Только что построенные комбинаторы заявок будут выключены.
cybersyn-combinator-disable-built-nonplayer=Комбинаторы заявок, у которых нельзя определить строителя (например, поставленные некоторыми роботами), будут выключены.\n\n[font=default-bold]Комбинаторы, у которых строитель известен, не выключаются.[/font]
cybersyn-combinator-negative-signals=Все сигналы предметов и жидкостей, введённые в область выходных сигналов комбинатора, станут отрицательными.\n\n[font=default-bold]Сетевые маски и особые сигналы диспетчерской сети не меняются.[/font]
cybersyn-combinator-network-mask-parse-mode=Как разбирать сетевые маски (подсетей), введённые в комбинатор.
cybersyn-combinator-network-mask-display-mode=Как показывать сетевые маски (подсетей).\n\n[font=default-bold]Десятичная:[/font] маски показываются как есть (например, «128»).\n[font=default-bold]Шестнадцатеричная:[/font] например, «80» вместо «128».\n[font=default-bold]Двоичная:[/font] полное двоичное значение, например «10000000» вместо «128».\n[font=default-bold]Восьмеричная:[/font] например, «200» вместо «128».
cybersyn-combinator-network-mask-display-prefix=Если включено, перед сетевыми масками показывается приставка, по которой видно их систему счисления.\n\nНапример:\n[font=default-bold]десятичное[/font] число — «0d12345»;\n[font=default-bold]шестнадцатеричное[/font] — «0xDEADBEEF»;\n[font=default-bold]двоичное[/font] — «0b101010»;\n[font=default-bold]восьмеричное[/font] — «0o644».
cybersyn-combinator-network-mask-use-cs-default=Если включено, новая сетевая маска в комбинаторе сразу заполняется значением настройки «Маска сети по умолчанию» диспетчерской сети. Если выключено, подставляется последняя введённая маска (если она была).
cybersyn-combinator-encoder-zero-index=Если включено, кнопки кодировщика нумеруются с нуля (от 0 до 31), а не с единицы (от 1 до 32).
cybersyn-combinator-emit-default-request-threshold=Если включено, порог запроса, равный порогу диспетчерской сети по умолчанию, не удаляется из комбинатора.
cybersyn-combinator-emit-default-fluid-request-threshold=Если включено, порог запроса жидкости, равный порогу диспетчерской сети по умолчанию, не удаляется из комбинатора.
cybersyn-combinator-emit-default-priority=Если включено, приоритет, равный приоритету диспетчерской сети по умолчанию, не удаляется из комбинатора.
cybersyn-combinator-emit-default-locked-slots=Если включено, число заблокированных слотов, равное значению диспетчерской сети по умолчанию, не удаляется из комбинатора.
cybersyn-combinator-emit-default-reserved-fluid-capacity=Если включено, запас места под жидкость, равный значению диспетчерской сети по умолчанию, не удаляется из комбинатора.

