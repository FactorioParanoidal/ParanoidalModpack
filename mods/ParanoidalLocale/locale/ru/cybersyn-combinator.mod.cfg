[string-mod-setting-description]
cybersyn-combinator-loglevel-DEBUG=В журнал пишутся все сообщения.
cybersyn-combinator-loglevel-INFO=В журнал пишутся сведения, предупреждения и ошибки.
cybersyn-combinator-loglevel-WARN=В журнал пишутся предупреждения и ошибки.
cybersyn-combinator-loglevel-ERROR=В журнал пишутся только ошибки.
cybersyn-combinator-loglevel-DISABLED=В журнал ничего не пишется.
cybersyn-combinator-loglevel-chat-DEBUG=В чат выводятся все сообщения.
cybersyn-combinator-loglevel-chat-INFO=В чат выводятся сведения, предупреждения и ошибки.
cybersyn-combinator-loglevel-chat-WARN=В чат выводятся предупреждения и ошибки.
cybersyn-combinator-loglevel-chat-ERROR=В чат выводятся только ошибки.
cybersyn-combinator-loglevel-chat-DISABLED=В чат ничего не выводится.
cybersyn-combinator-network-mask-parse-mode-DECIMAL=По умолчанию ввод десятичный, приставкой можно выбрать другую систему счисления.\nПри редактировании мод подставляет значение в том виде, в каком оно показано, и при необходимости добавляет приставку.\n\n[font=default-bold]Десятичная:[/font] приставка «0d», «0d128» — маска 128.\n[font=default-bold]Шестнадцатеричная:[/font] приставка «0x», «0x80» — маска 128.\n[font=default-bold]Двоичная:[/font] приставка «0b», «0b10000000» — маска 128.\n[font=default-bold]Восьмеричная:[/font] приставка «0o», «0o200» — маска 128.
cybersyn-combinator-network-mask-parse-mode-HEX=По умолчанию ввод шестнадцатеричный, приставки в этом режиме [font=default-bold]не работают[/font]. Вводить можно [font=default-bold]только[/font] шестнадцатеричные числа, зато не нужно писать «0x».
cybersyn-combinator-network-mask-display-mode-DECIMAL=Маски показываются как есть, в десятичном виде (например, «128»).
cybersyn-combinator-network-mask-display-mode-HEX=Маски показываются в шестнадцатеричном виде (например, «80» вместо «128»).
cybersyn-combinator-network-mask-display-mode-BINARY=Маски показываются полным двоичным значением (например, «10000000» вместо «128»).
cybersyn-combinator-network-mask-display-mode-OCTAL=Маски показываются в восьмеричном виде (например, «200» вместо «128»).

[cybersyn-combinator-commands]
remote-open=Наведите курсор на объект, чтобы открыть ближайший к нему комбинатор заявок.
remote-close=Закрывает открытое окно комбинатора заявок.
sort=Сортирует сигналы в комбинаторе заявок под курсором.
sort-all=Сортирует сигналы во всех комбинаторах заявок на всех поверхностях.

[cybersyn-combinator-window]
title=Комбинатор заявок
cs-signal-reset=Сбросить к значению по умолчанию
stacks=Пачки
items=Предметы
network-list-title=Сетевые маски
network-list-tooltip=Выберите сигнал левой кнопкой, введите маску сети в текстовое поле и нажмите зелёную кнопку подтверждения, чтобы добавить её.\n__CONTROL_LEFT_CLICK__ по строке списка — изменить маску, __CONTROL_RIGHT_CLICK__ — удалить.\n__CONTROL_KEY_CTRL____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ по сигналу открывает его в кодировщике масок.\n(Если добавить уже существующий сигнал с новым значением, он обновится.)
network-list-item-tooltip=Маска:\nДесятичная: __1__\nШестнадцатеричная: __2__\nДвоичная: __3__\nВосьмеричная: __4__\n\n__CONTROL_LEFT_CLICK__: изменить\n__CONTROL_RIGHT_CLICK__: удалить\n__CONTROL_KEY_CTRL____CONTROL_STYLE_BEGIN__ + __CONTROL_STYLE_END____CONTROL_LEFT_CLICK__: открыть в кодировщике масок
invalid-signal=Виртуальные сигналы [virtual-signal=signal-everything], [virtual-signal=signal-anything] и [virtual-signal=signal-each], а также пустые и неизвестные сигналы нельзя использовать как выходные.\nПодробнее: [color=blue]https://forums.factorio.com/viewtopic.php?p=554711[/color]
max-network-signals=Достигнуто наибольшее число сигналов сети: __1__. Больше в этот комбинатор добавить нельзя.
non-virtual-network-mask=[__1__=__2__] не подходит для сетевой маски: разрешены только виртуальные сигналы.
item-total=Всего предметов
item-total-description=Сколько всего предметов запрашивает этот комбинатор. Учитываются только отрицательные значения сигналов.
item-stacks=Всего пачек
item-stacks-description=Сколько всего пачек запрашивает этот комбинатор. Учитываются только отрицательные значения сигналов.
fluid-total=Всего жидкостей
fluid-total-description=Сколько всего жидкостей запрашивает этот комбинатор. Учитываются только отрицательные значения сигналов.

[cybersyn-combinator-encoder]
title=Кодировщик масок
tooltip=Каждая пронумерованная кнопка — один бит сетевой маски (одна подсеть). __CONTROL_LEFT_CLICK__ по кнопке включает или выключает этот бит.\nНомер — позиция бита в маске: первый (младший, крайний справа) бит — верхняя левая кнопка, последний (старший, крайний слева) — нижняя правая.\n\nКаждая включённая кнопка добавляет к итоговой маске степень двойки: первая — 2^0 (1), последняя — 2^31 (2 147 483 648).
all=Все
none=Ничего
decimal=Десятичная
hexadecimal=Шестнадцатеричная
binary=Двоичная
octal=Восьмеричная
