[tips-and-tricks-description]
angels-animals-notes-biters=\n\n[font=default-bold]КУСАКИ[/font]: Поэкспериментируйте с фугу — возможно, вам удастся вывести ручных кусак. Изучайте их, чтобы получать кристаллы, которые помогут повысить продуктивность или скорость работы фабрики.\nРазведение кусак с помощью королев даёт все три размера необработанных кристаллов: [img=item/angels-crystal-splinter-raw] малые, [img=item/angels-crystal-shard-raw] средние и [img=item/angels-crystal-full-raw] большие — от малых, средних и больших кусак соответственно.\n[font=default-bold]ПРИМЕЧАНИЕ:[/font] Кусаки едят много [img=item/angels-bio-alien-processed-meat] переработанного инопланетного мяса. К этому этапу обеспечьте достаточную разделку фугу и рыбы на [img=item/angels-bio-butchery] бойнях.
angels-animals-notes-fish=\n[font=default-bold]РЫБА[/font]: Ловите рыбу (4 разновидности: [img=item/raw-fish] [img=item/angels-alien-fish-1-raw] [img=item/angels-alien-fish-2-raw] [img=item/angels-alien-fish-3-raw]) и разводите её как возобновляемый источник восстановления здоровья или [img=item/angels-bio-raw-meat] корм для животных на следующих этапах. Рыбу также можно перерабатывать в жир и [img=item/angels-fish-pulp] рыбное филе для процессов, похожих на переработку урожая. Из [img=fluid/angels-liquid-polluted-fish-atmosphere] загрязнённой воды для рыб можно извлекать [img=item/angels-crystal-splinter-raw] малые необработанные кристаллы для дальнейшей обработки.
angels-animals-notes-puffers=\n\n[font=default-bold]ФУГУ[/font]: Исследуйте планету и находите [img=entity/angels-puffer-nest] гнёзда фугу, чтобы получить их яйца. В природе встречаются только [img=item/angels-bio-puffer-1] газообразующие фугу; гнёзда отмечены на карте [font=default-bold]жёлтым квадратом[/font]. Разводите этих пахучих существ, чтобы открыть новые способы переработки газов. При вылуплении фугу из яиц остаётся [img=item/angels-bio-puffer-egg-shell] скорлупа. Её можно измельчить и смешать с загрязнённой водой для рыб для получения [img=item/angels-crystal-shard-raw] средних необработанных кристаллов.\n[font=default-bold]ПРИМЕЧАНИЕ:[/font] Учитывайте вероятность мутаций фугу.
angels-bioprocessing-animals=[font=default-bold]ЛОВИТЕ, ИССЛЕДУЙТЕ, ЭКСПЕРИМЕНТИРУЙТЕ С ЯЙЦАМИ[/font]:\n\nЭта часть мода посвящена животному миру Наувиса: рыбоводству, разведению и выращиванию фугу, а также разведению кусак ради сложных материалов для ракетного топлива, модулей и усовершенствованного оружия.\n
angels-bioprocessing-intro=Исследуйте чужую планету, находите её флору и фауну и используйте их себе на пользу. Мод добавляет альтернативы нефтехимическим процессам и поощряет исследование окрестностей.\n
angels-bioprocessing-intro-animals=\n[font=default-bold]Переработка животных[/font]:\n - [img=item/angels-bio-refugium-fish] Некоторые местные рыбы служат источником пищи и продуктов на основе жиров.\n - [img=item/angels-bio-refugium-puffer] Некоторые мелкие местные летающие существа способны перерабатывать опасные газы в полезные продукты.
angels-bioprocessing-intro-nauvis=[font=default-bold]Биоресурсы Наувиса[/font]:\n - [img=item/angels-algae-farm] Выращивание водорослей — ранний способ получения растительного сырья.\n - [img=item/angels-bio-arboretum-1] Выращивание местных деревьев для получения древесины, смолы, пластмассы и резины.\n
angels-bioprocessing-intro-vegetables=\n[font=default-bold]Переработка растений[/font]:\n - [img=item/angels-desert-garden] Некоторые местные растения содержат семена полезных сельскохозяйственных культур.\n - [img=item/angels-crop-farm] Сажайте и выращивайте эти культуры для получения полезных продуктов.\n
angels-bioprocessing-nauvis=Самый ранний этап этой части мода — поиск и использование быстрорастущих водорослей. Находя особые деревья в разных биомах, вы сможете выращивать их как возобновляемый ресурс. Фермы водорослей выращивают простые растения, потребляющие много воды, и дают полезные на ранних этапах материалы, например целлюлозу и метанол.\nЭто небольшой экскурс в использование растений для производства непродовольственных товаров до промышленной революции.\n\nЭта часть мода посвящена выращиванию водорослей и деревьев с использованием отходов и воды.
angels-bioprocessing-vegetables=Исследуя планету, вы найдёте [img=item/angels-desert-garden][img=item/angels-swamp-garden][img=item/angels-temperate-garden] сады. Их можно изучать и перерабатывать в семена, чтобы затем самостоятельно выращивать растения. Перерабатывайте урожай в питательные вещества, топливо и масла. Из садов также можно получать [img=item/angels-token-bio] образцы растительности для исследования улучшенных ферм, более эффективного получения древесины и других усовершенствованных процессов.\n\nСады отмечены на мини-карте [font=default-bold]светло-зелёным квадратом[/font] и встречаются в разных биомах в зависимости от влажности.\n
angels-crushing=Первый шаг после добычи — дробление руды, чтобы подготовить её к дальнейшей переработке. Дробление разбивает добытую руду и отделяет твёрдую каменную породу от полезных материалов.\n\nОбычный рецепт превращает [img=item/angels-ore4] комплексную руду в [img=item/angels-ore4-crushed] дроблёную руду и [item=angels-stone-crushed].\nВ середине игры [item=angels-stone-crushed] можно перерабатывать в другие материалы, а на ранних этапах — в [item=stone], [item=stone-brick] и [item=stone-wall]. В некоторых случаях [img=item/angels-ore4-crushed] дроблёную руду можно плавить сразу, либо продолжить её обогащение и затем отсортировать.
angels-crushing-notes=\n\n[font=default-bold]ПРИМЕЧАНИЕ[/font]: В реальности руду дробят в шаровых, щёковых, пневматических и ударных дробилках. Это уменьшает размер кусков и увеличивает площадь поверхности для химической обработки, особенно на следующем этапе — флотации.
angels-floatation=Флотация — второй этап обогащения, на котором дроблёную руду промывают для удаления дополнительных примесей. Это первый химический этап обработки; для него нужна очищенная вода. Рядом стоит разместить систему очистки воды и очистки сточных вод, а также организовать переработку побочных продуктов, например жеод. Жеоды — кристаллические образования, часто встречающиеся в почве и камнях.\n\nОбычный рецепт превращает дроблёную руду с добавлением [fluid=angels-water-purified] в рудные куски и сточную воду; с некоторой вероятностью также получается жеода.\nЖеоды можно перерабатывать в разные материалы в зависимости от установленных модов.\nРудные куски можно отсортировать или продолжить их очистку на следующем этапе — выщелачивании.
angels-floatation-notes=\n\n[font=default-bold]ПРИМЕЧАНИЕ[/font]: В реальности флотация руды широко распространена. Обычно в ней используют мылоподобный реагент и кислую или щелочную водную смесь. Материалы разделяются благодаря различиям в их физических и химических свойствах. Подробнее об этом процессе можно прочитать по запросу «пенная флотация» (английский термин — froth flotation; слово flotation пишется без дополнительной «a»).
angels-leaching=Третий этап обогащения — кислотное выщелачивание. Рудные куски с предыдущего этапа растворяют в сильной кислоте, оставляя немного шлака (предполагается, что на этом этапе его утилизация уже не вызывает затруднений). Из смеси руды и кислоты получают относительно однородные кристаллы высокой чистоты. Процесс снова использует химические свойства руды.\n\nОбычный рецепт превращает рудные куски с добавлением 10 единиц кислоты в 2 рудных кристалла.\nБольшую часть кислоты можно получать на предыдущем этапе — флотации, но иногда требуется дополнительный источник. Это первый этап без образования отходов.
angels-leaching-notes=\n\n[font=default-bold]ПРИМЕЧАНИЕ[/font]: В реальности кислотное выщелачивание часто применяют к отвалам. Щебень и другие твёрдые отходы обогащения помещают в большую яму с герметичным бетонным основанием, похожую на бассейн, и орошают кислотой. Она просачивается через отходы и растворяет полезные вещества, пропущенные при предыдущей обработке. Собранный на дне раствор богат минералами; обычно их выделяют кристаллизацией и возвращают в плавильное производство.
angels-nauvis-algae=Поиск и использование быстрорастущих водорослей для получения полезных продуктов.\n\n
angels-nauvis-arbor=Особые деревья можно превратить в генераторы семян. Они производят семена из доступных материалов ([item=angels-solid-mud], [item=angels-solid-soil], [item=angels-solid-sand]) с добавлением жидкости ([img=fluid/water] воды, [img=fluid/angels-water-light-mud] грязной воды или [img=fluid/angels-water-saline] солёной воды).\nСемена можно выращивать в [img=item/angels-bio-arboretum-1] дендрарии и получать [img=item/angels-solid-tree] деревья для производства древесины либо деревья и сок — в зависимости от вида дерева (см. предыдущий совет).
angels-nauvis-arbor-compost=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]: Для получения почвы или удобрения, необходимых дендрариям, потребуется компост. Некоторые рецепты обходятся без почвы и удобрения.\n  - [img=item/angels-solid-compost] Компост можно получить из большинства продуктов биопереработки — водорослей, древесины, целлюлозы, семян и урожая — в [img=item/angels-composter] компостере.\nПолный список подходящих материалов смотрите в слоте ингредиента компостера. Не все материалы перерабатываются в компост в соотношении 1:1, поэтому ищите более эффективные варианты.\nПоздние технологии позволят размножать особые деревья, но сначала их придётся найти в природе.
angels-nauvis-notes-algae=\n[font=default-bold]ПРИМЕЧАНИЕ[/font]: Переработка водорослей обычно служит ранним способом получения сложных материалов, пока не появятся другие способы. Биопереработка сравнительно медленная, и её трудно расширять для удовлетворения поздних потребностей.
angels-nauvis-notes-algae-brown=[font=default-bold]ПРИМЕЧАНИЯ[/font]: До промышленной революции карбонат натрия традиционно получали высушиванием и сжиганием морских водорослей. Затем появились другие, более устойчивые способы производства.\n              Альгиновая кислота содержится в клеточных стенках растений; особенно много её в растительных камедях. Она довольно липкая, поэтому может служить связующим веществом при изготовлении бумаги.\n\n
angels-nauvis-notes-algae-brown-lithia= - Бурые водоросли также можно перерабатывать в [item=angels-solid-lithium] вместо использования [fluid=angels-thermal-water].\n
angels-nauvis-notes-algae-green=[font=default-bold]ПРИМЕЧАНИЕ[/font]: Метанол также называют древесным спиртом: раньше его обычно получали сжиганием древесины и перегонкой выделяющихся паров.\n\n
angels-nauvis-notes-trees=[font=default-bold]ПРИМЕЧАНИЕ[/font]: Особые деревья размещаются в зависимости от влажности, а не конкретного биома, поэтому моды вроде Alien Biomes не мешают их появлению. Однако встречаются такие деревья довольно редко.
angels-nauvis-trees=Исследуя планету, вы найдёте разные виды лиственных деревьев в дополнение к хвойным деревьям базовой игры.\nИзвлекайте из них семена и выращивайте собственные деревья как возобновляемый источник [item=wood]. Усовершенствованные способы переработки открывают новые способы выращивания и позволяют получать из особых деревьев смолу, пластмассу и резину.\n\nЭти деревья отмечены на мини-карте [font=default-bold]светло-голубым квадратом[/font] и встречаются в разных биомах в зависимости от влажности.\n
angels-ore-generation=Мод [tooltip=Обогащение руды Ангела,tips-and-tricks-description.angelsrefining] заменяет все рудные месторождения новыми, руду из которых нужно обогащать перед плавкой. Все руды для плавки из базовой игры, модов Боба и Yuoki Industries заменяются новыми комплексными рудами:\n\n__1__\nТакже добавляется новая скважина: __2__
angels-ore-refining=Добытые комплексные руды нужно обогатить, прежде чем плавить их и отливать пластины. Более совершенные способы обогащения повышают выход готовой руды и могут открыть доступ к новым её видам.\n\nСейчас доступны 3 режима:\n    - Базовая игра: обогащение повышает выход железной и медной руды.\n    - Только моды Ангела: обогащение даёт различные материалы.\n    - Моды Боба и Ангела (BA или AB): обогащение даёт множество руд из модов.\n\nМод хорошо сочетается с модами Боба и поддерживает другие моды, например Yuoki Industries, а также более не поддерживаемые Uranium Power и Nuclear.\nОн добавляет углублённую переработку руд: дробление, флотацию, кислотное выщелачивание и кристаллизацию, повышающие выход полезной руды и эффективность. Также добавляются системы очистки сточных вод для этих и других производственных цепочек.\nЦепочки обработки воды и обогащения постепенно открываются в дереве технологий.
angels-ore-sorting=Сортировочная установка объединяет большой гравитационный сепаратор, центрифугу и решётчатый сепаратор. Она разделяет обогащённую руду на отдельные составляющие — металлические руды для выплавки высококачественных металлов.
angels-ore-sorting-bobs=\n\nСортировочная установка перерабатывает 6 основных комплексных руд разной степени обогащения в различные металлические руды:\n4×[img=item/angels-ore4-crushed] дроблёной руды дают 2 единицы основной руды, 1 единицу вторичной и 1 [item=angels-slag].\n6×[img=item/angels-ore4-chunk] рудных кусков дают 2 единицы основной руды, 1 единицу вторичной, 2 единицы дополнительных руд и 1 [item=angels-slag].\n8×[img=item/angels-ore4-crystal] рудных кристаллов дают 3 единицы основной руды, 1 единицу вторичной, 3 единицы дополнительных руд и 1 [item=angels-slag].\n9×[img=item/angels-ore4-pure] очищенной руды дают 3 единицы основной руды, 2 единицы вторичной и 4 единицы дополнительных руд.\n\nЧтобы узнать, что получится из конкретной руды, наведите курсор на её месторождение.\nОсновные и вторичные руды перечислены ниже:\n- [item=angels-ore1] и [item=angels-ore2]: основная — [item=iron-ore], вторичная — [item=copper-ore]\n- [item=angels-ore3] и [item=angels-ore4]: основная — [item=copper-ore], вторичная — [item=iron-ore]\n- [item=angels-ore6]: основная — [item=angels-tin-ore], вторичная — [item=angels-quartz]\n- [item=angels-ore5]: основная — [item=angels-lead-ore], вторичная — [item=angels-nickel-ore]
angels-ore-sorting-overhaul=\n\nСортировочная установка перерабатывает 6 основных комплексных руд разной степени обогащения в различные металлические руды:\n4×[img=item/angels-ore4-crushed] дроблёной руды дают 2 единицы основной руды, 1 единицу вторичной и 1 [item=angels-slag].\n6×[img=item/angels-ore4-chunk] рудных кусков дают 2 единицы основной руды, 1 единицу вторичной, 2 единицы дополнительных руд и 1 [item=angels-slag].\n8×[img=item/angels-ore4-crystal] рудных кристаллов дают 3 единицы основной руды, 1 единицу вторичной, 3 единицы дополнительных руд и 1 [item=angels-slag].\n9×[img=item/angels-ore4-pure] очищенной руды дают 3 единицы основной руды, 2 единицы вторичной и 4 единицы дополнительных руд.\n\nЧтобы узнать, что получится из конкретной руды, наведите курсор на её месторождение.\nОсновные и вторичные руды перечислены ниже:\n- [item=angels-ore1] и [item=angels-ore2]: основная — [item=iron-ore], вторичная — [item=copper-ore]\n- [item=angels-ore3] и [item=angels-ore4]: основная — [item=copper-ore], вторичная — [item=iron-ore]\n- [item=angels-ore6]: основная — [item=angels-tin-ore], вторичная — [item=angels-quartz]\n- [item=angels-ore5]: основная — [item=angels-lead-ore], вторичная — [item=angels-nickel-ore]
angels-ore-sorting-vanilla=\n\nСортировочная установка перерабатывает 4 комплексные руды разной степени обогащения в разные смеси руды для плавки, самородков и рудного гравия. Самородки и гравий можно дополнительно переработать в металлическую руду. Очищенная руда более высокого качества даёт больше руды для плавки. Из очищенной руды также получается металлический шлак.
angels-purification=Последний этап обработки руды обеспечивает наивысшую степень очистки: удаляются последние примеси, и получается самая чистая руда. Сочетание рекуперации тепла, химической обработки и электролиза позволяет обойтись без дополнительных твёрдых или жидких материалов и без образования отходов.\n\nОбычный рецепт превращает рудные кристаллы в очищенную руду.\nТакую окончательную очистку применяют редко: высокое качество оправдывает её перед плавкой лишь для самых экзотических и редких веществ.
angels-vegetables-crops=Переработка урожая в [img=item/angels-bio-processor] биопроцессоре даёт продукты, зависящие от выбранного рецепта. Среди них могут быть:\n
angels-vegetables-farming=После переработки садов в [img=item/angels-seed-extractor] экстракторе семян вы получите семена сельскохозяйственных культур. Теперь их можно сажать и выращивать для получения полезных продуктов.\n\n
angels-vegetables-notes-crops=\n\n[font=default-bold]ПРИМЕЧАНИЯ[/font]:\nТолько [img=item/angels-solid-corn] кукурузу и [img=item/angels-solid-fruit] фрукты можно переработать в [img=fluid/angels-liquid-fermentation-raw] основу для ферментации, из которой получают [img=fluid/angels-gas-ethanol] этанол или [img=fluid/angels-liquid-acetic-acid] уксусную кислоту.\nВсе простые продукты можно переработать в [img=fluid/angels-liquid-nutrient-pulp] питательную целлюлозу, а из неё — в очень полезный [img=fluid/angels-gas-acetone] ацетон и другие нефтехимические продукты, от масел до синтез-газа.
angels-vegetables-notes-gardens=\n\n[font=default-bold]ПРИМЕЧАНИЕ[/font]: Как и деревья, сады размещаются в зависимости от влажности, а не конкретного биома, поэтому моды вроде Alien Biomes не мешают их появлению. Однако встречаются сады довольно редко.
angels-wastewaters=Примеры сточных вод:\n[fluid=angels-water-yellow-waste] Отработанная серная вода\n[fluid=angels-water-greenyellow-waste] Отработанная фтористая вода\n[fluid=angels-water-green-waste] Отработанная хлорная вода\n[fluid=angels-water-red-waste] Отработанная азотная вода
angels-water-processing=Перерабатывайте морскую и сточную воду в очищенную воду и извлекайте полезные твёрдые вещества в [entity=angels-hydro-plant].
angels-water-processing-overhaul=\nПревращайте воду в [fluid=angels-water-saline] для получения солей и в [fluid=angels-water-purified] для обработки руды, например флотации.\n\n
angels-water-processing-vanilla=\nПревращайте воду в [fluid=angels-water-saline] для получения солей и в [fluid=angels-water-purified] для обработки руды, например флотации.\nИзвлекайте [item=sulfur] из [fluid=angels-water-yellow-waste] и возвращайте её в производственный цикл.
angels-water-processing-voiding=\nС помощью [entity=angels-clarifier] можно удалять из игры избыток [tooltip=различных видов воды,tips-and-tricks-description.angels-watertype] и [tooltip=сточных вод,tips-and-tricks-description.angels-wastewaters].\n\n[font=default-bold]ПРИМЕЧАНИЕ[/font]: Полный список утилизируемых жидкостей можно посмотреть в слоте входной жидкости рецепта отстойника.\n
angels-watertype=Примеры различных видов воды:\n[fluid=angels-water-saline] Солёная вода\n[fluid=angels-water-purified] Очищенная вода\n[fluid=angels-water-mineralized] Минерализованная вода
angelsrefining=Мод добавляет комплексные руды, которые нужно обогатить перед плавкой и отливкой пластин.

[tips-and-tricks-item-description]
bpsb-intro-isolation=Настройка «Уровень изоляции» определяет, насколько песочницы связаны с основной игрой. У каждого варианта есть существенные преимущества и недостатки. Подробности приведены на странице мода.\n\n«Полная» — исходный вариант по умолчанию. Он максимально отделяет песочницы от основной игры. Для возврата некоторых полезных возможностей, потерянных из-за такого разделения, нужны скрипты. Использование отдельных команд игроков и режимов управления определяет, какие возможности доступны при этой настройке.\n\n«Отсутствует» — более новый вариант, появившийся благодаря удалённому просмотру в Factorio 2.0. Он лишь предотвращает явные способы получить в песочнице преимущество, влияющее на основную игру.\n\nГлавные различия:\n\nБезопасность:\n- Полная: есть различные риски\n- Отсутствует: полностью безопасно\n\nПростота:\n- Полная: сложное устройство\n- Отсутствует: простое устройство\n\nДоступность:\n- Полная: с ограничениями\n- Отсутствует: всегда\n\nВидимость:\n- Полная: личная или для команды\n- Отсутствует: для команды\n\nУдалённый просмотр:\n- Полная: невозможен\n- Отсутствует: полностью поддерживается\n\nТехнологии:\n- Полная: частичная синхронизация через Lua\n- Отсутствует: синхронизированы\n\nИсследования:\n- Полная: отключены\n- Отсутствует: отключены\n\nНастройка доступа ко всем технологиям:\n- Полная: доступна\n- Отсутствует: недоступна\n\nОповещения:\n- Полная: отдельные\n- Отсутствует: синхронизированы\n\nЧат:\n- Полная: сообщения передаются через Lua\n- Отсутствует: синхронизирован\n\nПерсонаж:\n- Полная: заменяется режимом бога\n- Отсутствует: остаётся вашим\n\nДостижения:\n- Полная: могут засчитываться\n- Отсутствует: засчитываются\n\nЭтапы развития:\n- Полная: отдельные\n- Отсутствует: синхронизированы\n\nСтатистика:\n- Полная: отдельная\n- Отсутствует: входит в общую\n\nЛогистические группы и группы поездов:\n- Полная: отдельные\n- Отсутствует: синхронизированы\n\nБесконечные контейнеры и загрузчики:\n- Полная: видны только в песочнице\n- Отсутствует: видны всем игрокам команды\n\nОтмена и повтор действий:\n- Полная: история сбрасывается при входе и выходе\n- Отсутствует: работают как обычно
quality-probabilities=Шанс изготовить предмет более высокого качества составляет 1% с одним [item=quality-module,quality=normal] и может достигать 75% с шестью [item=bob-quality-module-5,quality=legendary].\nЕсть также небольшой шанс пропустить промежуточные уровни и сразу получить предмет более высокого качества, как показано в таблице.

