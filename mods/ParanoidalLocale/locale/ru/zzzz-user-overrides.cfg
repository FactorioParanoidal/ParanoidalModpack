stopwatch-command-description=- Запускает секундомер для измерения пропускной способности манипулятора за определённое время.
stopwatch-finished=Измерение завершено для __1__
stopwatch-help=При выполнении команды наведите курсор на манипулятор, пропускную способность которого нужно измерить.
stopwatch-interrupted=Не удалось завершить измерение для __1__: манипулятор больше не существует.
stopwatch-result=Измеренная пропускная способность: __1____2__ (__3__ предметов за __4__ тиков)
