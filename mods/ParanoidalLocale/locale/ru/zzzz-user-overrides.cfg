rampantFixed--EnemySettings1_1_10=Rampant Fixed: с версии 1.1.10 можно заменить гнёзда новых врагов на обычные. Это позволяет продолжить игру без новых врагов или удалить мод, сохранив гнёзда (настройка игрока «Показать диалог отключения новых врагов»). Доступно только в одиночной игре или игрокам с правами администратора.
rampantFixed--K2_SE_CMO_incompatibilityWarning=Обнаружено сочетание модов K2 + SE + combat-mechanics-overhaul. В этом сочетании настройка «Блокируемые плевки плевак и червей» мода combat-mechanics-overhaul [font=heading-1][color=red]некорректно преобразует атаки[/color][/font] огненной и инфернальной фракций. Если эти фракции включены, включите альтернативную атаку (настройка Rampant Fixed «Снаряды: заменить струйные атаки на блокируемые снаряды»).
