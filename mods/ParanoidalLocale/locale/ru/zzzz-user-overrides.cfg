angels-components-block-difficulty-easy=Каждый рецепт функциональных блоков даёт вдвое больше блоков за прежнее время изготовления. Это снижает затраты ресурсов и ускоряет производство.
angels-components-block-difficulty-hard=Базовый вариант без дополнительных изменений.
angels-components-block-difficulty-normal=Каждый рецепт функциональных блоков даёт вдвое больше блоков, но и время изготовления удваивается. Это снижает затраты ресурсов.
angels-components-component-difficulty-easy=Каждый рецепт промежуточных компонентов даёт вдвое больше компонентов за прежнее время изготовления. Это снижает затраты ресурсов и ускоряет производство.
angels-components-component-difficulty-hard=Базовый вариант без дополнительных изменений.
angels-components-component-difficulty-normal=Каждый рецепт промежуточных компонентов даёт вдвое больше компонентов, но и время изготовления удваивается. Это снижает затраты ресурсов.
angels-enable-auto-barreling-Disabled=Наполнение бочек по правилам базовой игры.
angels-enable-auto-barreling-Enabled+Hidden=Автоматическое наполнение и опорожнение бочек в установке, работающей как печь. Рецепты скрыты в меню изготовления игрока.
angels-enable-auto-barreling-Enabled+Shown=Автоматическое наполнение и опорожнение бочек в установке, работающей как печь. Рецепты видны в меню изготовления игрока.
bpsb-isolation-level-full=Песочница использует отдельную команду игроков, что имеет свои преимущества и недостатки. В ней доступно больше возможностей, ими можно управлять напрямую, а статистика ведётся отдельно. Однако пребывание в такой песочнице почти равносильно игре в другой мир — при этом время в основном мире тоже продолжает идти.
bpsb-isolation-level-none=В песочницы можно войти только через удалённый просмотр. Всё происходящее в них потенциально может влиять на основную игру. Это может быть неудобно в сетевой игре.
minime_followmode-character_follows_player=Внимание: боевые роботы перестанут следовать за персонажем при его переносе на другую поверхность!
orphan-finder-underground-mode-none=Не проверять подземные трубы на отсутствие пары.
orphan-finder-underground-mode-standard=Подземная труба считается непарной, если хотя бы одно её подземное соединение не используется.
orphan-finder-underground-mode-strict=Подземная труба считается непарной, только если у неё нет ни одного подземного соединения.

