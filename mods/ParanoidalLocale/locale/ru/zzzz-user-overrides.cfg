combinator-default-item-value-desc=Множитель для каждого твёрдого предмета. В режиме «stacks» (стопки) задаёт число стопок, а в режиме «amount» (количество) умножается на требуемое количество предмета. Отрицательное значение означает запрос, например логистический или железнодорожный.
combinator-fluid-quantity-mode=Расчёт количества жидкостей для комбинатора
combinator-fluid-quantity-mode-desc=Способ расчёта значения сигнала жидкости при создании постоянного комбинатора из списка ингредиентов. «stacks» (стопки): множитель × размер условной стопки жидкости. «amount» (количество): множитель × требуемое количество жидкости в блоке.
combinator-item-quantity-mode=Расчёт количества предметов для комбинатора
combinator-item-quantity-mode-desc=Способ расчёта значения сигнала твёрдого предмета при создании постоянного комбинатора из списка ингредиентов. «stacks» (стопки): множитель × размер стопки предмета. «amount» (количество): множитель × требуемое количество предмета в блоке.
display-hidden-products=Сворачивать малые количества продуктов
display-hidden-products-desc=Объединяет продукты в одной ячейке. Значение 0 отключает эту функцию.
display-hidden-products-mode=Режим сворачивания продуктов
display-hidden-products-mode-desc=Использовать абсолютное или относительное значение для сворачивания продуктов.
ui-production-lines-menu=Меню производственных линий
ui-production-lines-menu-desc=Число видимых строк. При значении 0 отображаются все строки.

