spacex-completion-caption=Спасибо! Пора улетать!
spacex-completion-msg=SpaceX завершён!
spacex-completion-text=Поздравления. После нескольких месяцев и нескольких запусков вы наконец завершили свою конечную цель, построив ракету, которая выведет вас с этого камня! Потому что, очевидно, никто больше не собирался спасать вас!
spacex-completion-text1=Во-первых, вы не рухнули на корабль, верно? Это был ваш надежный строительный робот. Он был тем, кто летал на последнем корабле. Он и его надежный ИИ, который вы запрограммировали. Это была его вина!
spacex-completion-text2=Ну, он не прошел через своё первое крушение, так что теперь это полностью зависит от вас. Вы обращали внимание во время тренировки «Как летать на большой консервной банке»?
spacex-completion-text3=Удачи Инженер!
spacex-completion-tooltip=Завершает игру! После этого вы сможете продолжить играть.
spacex-continue-caption=Да, начнём снова!
spacex-continue-text1=Время решить: запустить ещё один межзвёздный корабль (начать SpaceX заново) или закончить (закрыть SpaceX)?
spacex-continue-text2=Подсказка: если продолжить, сюжетные окна больше не появятся, а после следующего завершения SpaceX новый цикл начнётся автоматически. Это можно отключить в настройках мода для карты.
spacex-continue-title=Продолжить SpaceX
spacex-continue-tooltip=Обновляет счётчик SpaceX и сбрасывает количество всех отправленных компонентов SpaceX до нуля, чтобы вы могли построить новые космические корабли!
spacex-finish-caption=Нет, я закончил!
spacex-finish-tooltip=Количество отправленных компонентов SpaceX не будет сброшено. Чтобы начать снова, введите /SpaceX_reset в консоли.
spacex-launch-title=Запущен межзвездный космический корабль!
spacex-log-caption=Журнал
spacex-log-launch=Запуск
spacex-log-notes=Примечания
spacex-log-time=Время
spacex-log-tooltip=Показывать журнал времени запуска
spacex-notadmin-caption=Решает администратор!
spacex-notadmin-tooltip=Только администраторы могут принять это решение. Эта кнопка закроет ваше диалоговое окно.
stage-1-completion-caption=Отлично!
stage-1-completion-msg=Спутниковая сеть создана. Теперь постройте космическую док-станцию.
stage-1-completion-text=После нескольких запусков спутников вы наконец понимаете, как решить свою главную задачу. Пора построить собственный корабль, чтобы выбраться отсюда! За дело...
stage-1-completion-title=Спутниковая сеть завершена
stage-1-completion-tooltip=Закрывает это диалоговое окно.
stage-1-progress-stage=Этап 1 из __1__
stage-1-progress-title=Спутниковая сеть
stage-2-completion-caption=Великолепно!
stage-2-completion-msg=Док-станция готова к работе. Можно приступать к строительству космического корабля!
stage-2-completion-text=Поздравляем [похлопайте себя по плечу]! Док-станция готова! Теперь нужно построить корабль. Всё больше похоже на фабрику, которая строит фабрику.
stage-2-completion-title=Док-станция завершена
stage-2-completion-tooltip=Закрывает это диалоговое окно.
stage-2-progress-stage=Этап 2 из __1__
stage-2-progress-title=Строительство док-станции
stage-3-completion-caption=Поехали!
stage-3-completion-msg=Космический корабль построен. Подготовьтесь к путешествию!
stage-3-completion-text=Поздравляем! Строительство космического корабля завершено. Наконец можно начать планировать путешествие. Соберите достаточно припасов и проложите маршрут к ближайшей обитаемой планете. Для этого сначала понадобится полноценная карта космоса.
stage-3-completion-title=Космический корабль завершён
stage-3-completion-tooltip=Закрывает это диалоговое окно.
