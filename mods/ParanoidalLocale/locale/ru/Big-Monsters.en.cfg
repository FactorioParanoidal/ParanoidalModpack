[mod-setting-description]
bm-event-days=How often the attacks will happen (1 game day = 7 minutes). Values 0-20 (Zero = disable all)
bm-enable-silo-attack=If enabled, you will be seriously attacked after the Rocket-Silo is built
bm-big-enemy-hp-multiplier=[img=utility/character_health_bonus_modifier_icon] Множитель здоровья крупных монстров Big Monsters. Используется также для создаваемых модом диверсантов и червей-боссов, а не только гигантов. 1 не меняет расчётное здоровье, 2 удваивает его.
bm-worm-enemy-hp-multiplier=Старый параметр здоровья червей (0,2–10; исходное значение 1). В текущем коде Big Monsters и mferrari_lib он не подключён к расчёту здоровья. Генераторы используют отдельный множитель здоровья больших врагов; изменение этого старого поля не заменяет его.
bm-enemy-hp-multiplier=Старый параметр здоровья малых врагов (0,2–10; исходное значение 1). В текущем коде Big Monsters и mferrari_lib он не подключён к расчёту здоровья. Генераторы используют отдельный множитель здоровья больших врагов; изменение этого старого поля не заменяет его.
bm-enemy-damage-multiplier=[img=utility/shoot_cursor_green] Умножает урон монстров и вооружённых врагов Big Monsters на этот коэффициент. 1 не меняет урон, 2 удваивает. Это не общий множитель урона всех кусак и модов сборки.
bm-swarm-chance=[entity=small-biter] Вероятность выбора события роя, в процентах. Проверяется после более опасных событий и с учётом порогов эволюции; это не доля в общем весе событий. 0 исключает событие из этого случайного выбора.
bm-invasion-chance=[entity=small-biter] Вероятность выбора события подземного вторжения, в процентах. Проверяется после более опасных событий и с учётом порогов эволюции; это не доля в общем весе событий. 0 исключает событие из этого случайного выбора.
bm-worms-chance=[entity=behemoth-worm-turret] Вероятность выбора события крупных червей, в процентах. Проверяется после более опасных событий и с учётом порогов эволюции; это не доля в общем весе событий. 0 исключает событие из этого случайного выбора.
bm-soldiers-chance=[img=utility/shoot_cursor_green] Вероятность выбора события вооружённых диверсантов, в процентах. Проверяется после более опасных событий и с учётом порогов эволюции; это не доля в общем весе событий. 0 исключает событие из этого случайного выбора.
bm-biterzilla-chance=[entity=behemoth-biter] Вероятность выбора события левиафана, в процентах. Проверяется после более опасных событий и с учётом порогов эволюции; это не доля в общем весе событий. 0 исключает событие из этого случайного выбора.
bm-volcano-chance=[img=utility/danger_icon] Вероятность выбора события извержения вулкана, в процентах. Проверяется после более опасных событий и с учётом порогов эволюции; это не доля в общем весе событий. 0 исключает событие из этого случайного выбора.
bm-spidertron-chance=[item=spidertron] Вероятность выбора события вражеского паукотрона, в процентах. Проверяется после более опасных событий и с учётом порогов эволюции; это не доля в общем весе событий. 0 исключает событие из этого случайного выбора.
bm-allow-nuker=Part of the humam soldiers group. Equiped with small atomic bomb  missile
bm-difficulty-level=[entity=behemoth-biter] Увеличивает численность врагов, число волн и длительность некоторых событий Big Monsters. Это уровень сложности 1–10, а не единый множитель здоровья или урона всех врагов.
bm-events-when-peaceful=Разрешает события в мирном режиме, при нулевом размере баз врагов и во время перемирия Rampant. Не отменяет встроенный режим Factorio «Без врагов».

