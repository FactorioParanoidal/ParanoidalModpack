[mod-setting-description]
Noxys_Trees-tree_dying_factor=[entity=tree-01] Задаёт коэффициент гибели деревьев от огня в диапазоне 0–1. 0 оставляет исходный параметр огня без изменения, а не отменяет лесные пожары. Не относится к гибели от загрязнения или перенаселения.
Noxys_Trees-enabled=Позволяет деревьям умирать и распространятся.
Noxys_Trees-debug=Включает вывод отладочных сообщений.
Noxys_Trees-debug-interval=[img=utility/clock] Минимальная пауза между отладочными отчётами, в игровых тиках: 60 тиков = 1 секунда. Отчёты появляются только при включённых работе мода и отладке.
Noxys_Trees-degrade-tiles=Со временем медленно разрушается плитка для пола, которая блокирует рост деревьев, пока деревья не смогут вырасти снова.
Noxys_Trees-overpopulation-kills-trees=Если участок будет перенаселен, то деревья будут медленно погибать.
Noxys_Trees-kill-trees-near-unwanted=Случайная гибель деревьев, которые находятся около ульев кусак, залежами урановой руды или объектами игрока. Это также влияет на смерть деревьев из-за отсутствия плодородия или чрезмерного загрязнения.
Noxys_Trees-ticks-between-operations=Позволяет точно контролировать производительность этого мода и скорость, с которой количество деревьев увеличивается.
Noxys_Trees-chunks-per-operation=Позволяет точно контролировать производительность этого мода и скорость, с которой количество деревьев увеличивается.
Noxys_Trees-minimum-distance-between-tree=Минимальное расстояние между деревьями, на котором могут расти деревья.
Noxys_Trees-minimum-distance-to-enemies=Минимальное расстояние от ульев кусак или червей, на котором могут расти деревья.
Noxys_Trees-minimum-distance-to-uranium=Минимальное расстояние от залежей урановой руды, на котором могут расти деревья.
Noxys_Trees-minimum-distance-to-player-entities=[entity=tree-01] Зазор в клетках между новым деревом и объектами команд, в которых есть игроки. 0 отключает эту проверку. При включённых проверках гибели тот же радиус защищает постройки от уже существующих деревьев.
Noxys_Trees-minimum-distance-to-degradeable-tiles=[item=concrete] Зазор в клетках от покрытий, которые Noxys Trees считает разрушаемыми. Проверяется даже при выключенном разрушении покрытий; 0 отключает проверку. Большие значения заметно увеличивают нагрузку и могут вызывать периодические задержки.
Noxys_Trees-deaths-by-lack-of-fertility-minimum=Если плодородие земли ниже этого значения, у дерева есть шанс погибнуть.
Noxys_Trees-deaths-by-pollution-bias=Как быстро деревья погибают от загрязнения.\nУстановите это в 0, чтобы отключить смертельные случаи из-за загрязнения.\nПроцент смерти деревьев = math.ceil (загрязнение/значение).
Noxys_Trees-trees-to-grow-per-chunk-percentage=[entity=tree-01] Доля числа деревьев в чанке, задающая число попыток роста: 1 + округлённое вверх произведение числа деревьев на эту долю. Например, при 200 деревьях и 0,01 будет 3 попытки, не 3 гарантированных новых дерева. Влияет и на число проверок гибели рядом с нежелательными объектами.
Noxys_Trees-maximum-trees-per-chunk=[entity=tree-01] При таком числе деревьев или большем Noxys Trees пропускает рост в чанке 32×32 клетки. Учитываются и сухие деревья. Удаление лишних деревьев требует отдельного флажка гибели от перенаселения; это не жёсткий мгновенный лимит леса.
Noxys_Trees-expansion-distance=На каком расстоянии исходное дерево может сгенерировать дерево.
Noxys_Trees-surfaces=[entity=tree-01] Имена или номера поверхностей через запятую или точку с запятой, без лишних пробелов. Только на них Noxys Trees обрабатывает лес и покрытия. Если ни одна запись не найдена, используется поверхность №1; эта настройка не создаёт новые поверхности.

