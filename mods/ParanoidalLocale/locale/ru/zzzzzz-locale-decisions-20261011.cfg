[qol-internal-tech]
description=После обновления Factorio эти технологии больше нельзя скрыть. Это внутренние служебные технологии мода улучшений персонажа, необходимые для его работы. Игнорируйте их.

[recipe-description]
bi-basic-gas-processing=Неэффективное получение газа из ингредиентов: __ITEM__coal__ и __ITEM__resin__.
bi-battery=Если задуматься, источник материала для «__ITEM__battery__» — __ITEM__wood__!
bi-cellulose-1=Соедините «__ITEM__bi-woodpulp__» с серной кислотой и получите __ITEM__bi-cellulose__.
bi-cellulose-2=Немного нагрева увеличит выпуск продукта «__ITEM__bi-cellulose__» в четыре раза!
bi-pellet-coke-2=Переработка углерода в продукт: __ITEM__pellet-coke__.
bi-plastic-1=__ITEM__plastic-bar__ из материала: __ITEM__wood__
