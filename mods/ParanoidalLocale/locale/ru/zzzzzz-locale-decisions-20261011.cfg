Schall-pickup-tower=Автоматически собирает лежащие на земле предметы вокруг башни.
bi-bio-accumulator=Аккумулятор огромной емкости может хранить очень большое количество энергии. Иногда размер действительно имеет значение…\n[font=default-semibold][color=255,230,192]Размер: [/color][/font]4x4
bi-bio-garden-huge=Биосад очищает воздух от загрязнения (5760 единиц в минуту).\n[font=default-semibold][color=255,230,192]Размер: [/color][/font]27x27
bi-bio-garden-large=Биосад очищает воздух от загрязнения (720 единиц в минуту).\n[font=default-semibold][color=255,230,192]Размер: [/color][/font]9x9
bi-dart-turret=Эти турели доступны с самого начала и защищают от врагов с минимальными затратами. Дротики наносят меньше урона, чем пули, зато «__ENTITY__bi-dart-turret__» превосходит обычную турель «__ENTITY__gun-turret__» по дальности и скорострельности.
bi-stone-crusher-sand=Эти машины производят __ITEM__stone-crushed__ из материалов «__ITEM__stone__» и «__ITEM__concrete__» в любом виде. Также они могут перерабатывать __ITEM__stone-crushed__ в продукт: __ITEM__sand__.
offshore-mk2-pump=Качает жидкость с прибрежной зоны.\n[font=default-bold][color=#f5cb48][img=tooltip-category-electricity]Потребляет электричество[/color][/font]\n[font=default-semibold][color=#e4cead]Макс. потребление:[/color][/font] 2.07 МВт\n[font=default-semibold][color=255,230,192]Размер: [/color][/font]2x2

