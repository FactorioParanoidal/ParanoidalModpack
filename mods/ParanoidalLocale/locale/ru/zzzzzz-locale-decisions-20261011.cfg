[mod-setting-description]
BI_Easy_Bio_Gardens=Биосады потребляют готовое жидкое удобрение: для подачи всех ингредиентов достаточно одного трубопровода. Однако удобрения требуется на 50% больше, чем при смешивании твёрдого удобрения с водой на месте.\nБиосады передают электричество соседним биосадам. Размещайте их сеткой, оставляя не более одной клетки между ними, и они соединятся сами. :-)\n(По умолчанию: выключено)
BI_Game_Tweaks_Production_Science=Включает альтернативный рецепт: __ITEM__production-science-pack__.\n(По умолчанию: включено)
bm-allow-nuker=Боец из группы вооружённых диверсантов, оснащённый небольшой ядерной ракетой.
bm-enable-silo-attack=После постройки ракетной шахты начнутся серьёзные атаки.
bm-event-days=Как часто происходят атаки (1 игровой день = 7 минут). Диапазон: 0–20. Значение 0 отключает все события.
bobmods-burnerphase=Для использования технологий, работающих без сжигания топлива, потребуется провести исследования.
bobmods-mining-areadrills=Добавляет большие буры с увеличенной областью добычи и возможностью улучшения.
bobmods-mining-miningaxes=Добавляет улучшенные кирки.
bobmods-mining-miningdrills=Добавляет новые буры с возможностью улучшения.
bobmods-mining-pumpjacks=Добавляет новые нефтяные вышки с возможностью улучшения.
bobmods-mining-waterminers=Добавляет насосные вышки для добычи воды.
bobmods-modules-enablegodmodules=Добавляет божественные модули и технологии для их исследования.
bobmods-vehicleequipment-enablevehiclegrids=Добавляет сетки оборудования технике из базовой игры.
bobmods-warfare-robotupdate=Если включено, боевые дроны будут иметь обновленные рецепты и дронов нового уровня. Некоторые настройки унаследованы от мода Logistics
flow-control-new-group=Перемещает трубы, насосы и клапаны в отдельную строку меню изготовления.
flow-control-revert-to-normal-pipe=При подборе Т-образные, коленчатые и прямые трубы превращаются в обычные.
heroturrets-damage-counter=Сохраняет статистику нанесённого урона. Работает только при точном подсчёте убийств.
ick-prepare-uninstall=[img=utility.danger_icon] Внимание! Эта настройка включит всё отключённое оборудование в сохранении. Введите один из четырёх вариантов:\n\n- [color=yellow]uninstall[/color] — позволяет безопасно удалить мод.\n- [color=yellow]active-defense-equipment[/color] — включает всю персональную лазерную защиту, чтобы можно было безопасно отключить настройку «__1__».\n- [color=yellow]belt-immunity-equipment[/color] — включает всё оборудование для игнорирования конвейеров, чтобы можно было безопасно отключить настройку «__2__».\n- [color=yellow]night-vision-equipment[/color] — включает все приборы ночного видения, чтобы можно было безопасно отключить настройку «__3__».\n\nЕсли удалить мод или отключить эти настройки без предварительного использования этой настройки, всё отключённое оборудование будет потеряно.
memory-unit-power-usage=Множитель энергопотребления блока памяти. Формула: [font=default-small]1MW + (ceil(item count / stack size) ^ 0.35) * multiplier[/font]\nДля жидкостей размер стопки принимается равным 1000.\nЗначение по умолчанию: 300 кВт.
qol-crafting-speed-flat-bonus=Постоянный бонус к скорости изготовления, доступный без исследований.
qol-crafting-speed-multiplier=Множитель бонусов к скорости изготовления, полученных от исследований.
qol-crafting-speed-research-enabled=Включает технологии, повышающие скорость изготовления персонажа.
qol-infinite-research-enabled=Включает бесконечные исследования. При отключении бесконечные исследования недоступны.
qol-inventory-size-flat-bonus=Постоянный бонус к размеру инвентаря, доступный без исследований.
qol-inventory-size-multiplier=Множитель бонусов к размеру инвентаря, полученных от исследований.
qol-inventory-size-research-enabled=Включает технологии, увеличивающие инвентарь персонажа.
qol-mining-speed-flat-bonus=Постоянный бонус к скорости добычи, доступный без исследований.
qol-mining-speed-multiplier=Множитель бонусов к скорости добычи, полученных от исследований.
qol-mining-speed-research-enabled=Включает технологии, повышающие скорость добычи персонажа.
qol-movement-speed-flat-bonus=Постоянный бонус к скорости передвижения, доступный без исследований.
qol-movement-speed-multiplier=Множитель бонусов к скорости передвижения, полученных от исследований.
qol-movement-speed-research-enabled=Включает технологии, повышающие скорость передвижения персонажа.
qol-player-reach-field-item-drop-distance=Улучшения досягаемости также увеличивают расстояние, на которое можно бросать предметы (по умолчанию — клавиша Z).
qol-player-reach-field-resource-reach-distance=Улучшения досягаемости также увеличивают расстояние добычи ресурсов: деревьев, руды и других объектов.
qol-player-reach-flat-bonus=Постоянный бонус к досягаемости, доступный без исследований.
qol-player-reach-multiplier=Множитель бонусов к досягаемости, полученных от исследований.
qol-player-reach-research-enabled=Включает технологии, увеличивающие досягаемость персонажа.
reskins-bobs-do-basic-belts-separately=Включает настройку цветов базовых конвейеров с помощью расположенного ниже выбора цвета.\n\n[color=#9cdcfe]По умолчанию:[/color] [color=green]Включено[/color]
reskins-bobs-do-bobplates=Перерисовывает металлические слитки, шестерёнки, подшипники и другие промежуточные продукты, рецепты и технологии, а также малые резервуары и насосы, добавляемые модом Bob's Metals, Chemicals, and Intermediates.\n\n[color=#9cdcfe]По умолчанию:[/color] [color=green]Включено[/color]
reskins-bobs-do-custom-furnace-variants=Включает настройку цветов различных типов печей с помощью расположенных ниже элементов выбора цвета.\n\n[color=#9cdcfe]По умолчанию:[/color] [color=red]Выключено[/color]
reskins-bobs-do-inserter-tier-labeling=Если маркировка уровней включена, то маркировка также будет отображаться на манипуляторах и фильтрующих манипуляторах, добавляемых модом "Bob's Logistics".\n\n[color=#9cdcfe]По умолчанию:[/color] [color=green]Включено[/color]
rso-infinite-ore-threshold=Интеграция с бесконечными рудами Angel's: порог, выше которого руда становится бесконечной. Диапазон: 0–1. При 0 всё месторождение бесконечное, при 1 бесконечных участков почти нет.
rso-infinite-ores-in-start-area=Определяет, могут ли бесконечные месторождения Angel's появляться в начальной области.

