; GlowingLaserBeams
laserfix-color=Красный = стандартный цвет\nДиско = случайный цвет (дважды в секунду)\nНастраиваемый = выберите собственный цвет с помощью значений ниже
; ParanoidalLocale
BI_Enable_gvv_support=Инструмент «Просмотр глобальных переменных Lua API» (gvv) позволяет просматривать глобальную таблицу других модов. Если вы хотите помочь с отладкой «Bio Industries», включите эту настройку и введите «\gvv» в консоли чата, чтобы открыть графический интерфейс gvv.\n(По умолчанию: выключено)
; RampantFixed
rampantFixed--safeBuildings-trainStops=Обезопасить остановки поездов от кусак
; Shortcuts-ick
autogen-color=Выбрать цвет
; Subterranean
subterrain-belt-cost-multiplier=Определяет, сколько конвейеров требуется на каждую клетку, которую охватывают подземные конвейеры.
subterrain-belt-refund-multiplier=Определяет процент возвращаемых материалов. 1 — 100%, 0.50 — 50%.\nИгнорируется, если параметр «Возвращать конвейеры при добыче?» отключён.
subterrain-pipe-cost-multiplier=Определяет, сколько труб требуется на каждую клетку, которую охватывают подземные трубы.
subterrain-pipe-refund-multiplier=Определяет процент возвращаемых материалов. 1 — 100%, 0.50 — 50%.\nИгнорируется, если параметр «Возвращать трубы при добыче?» отключён.
subterrain-should-refund-belts=Если включено: \nпри добыче одного из элементов пары возвращается всё количество конвейеров, использованных при размещении, или его часть.
subterrain-should-refund-pipes=Если включено: \nпри добыче одного из элементов пары возвращается всё количество труб, использованных при размещении, или его часть.
