[helmod_map_settings]
debug-solver=Включить отладку решателя
debug-solver-desc=Добавляет кнопку для просмотра этапов вычислений решателя
user-cache-step=Шаг пользовательского кэша
user-cache-step-desc=Число позиций в одной порции подготовки пользовательского списка и в пакете запросов перевода Helmod. Большее значение уменьшает число порций, но может увеличить кратковременную нагрузку; меньшее растягивает подготовку на больше шагов.
display-all-sheet=Показывать все листы
display-all-sheet-desc=Администратор может видеть все листы
filter-translated-string-active=[img=utility/search] Фильтровать по переведённым названиям
filter-translated-string-active-desc=Разрешает поиск по переведённым названиям в окнах выбора Helmod и переключение языка фильтра. Для этого мод запрашивает переводы и создаёт пользовательский кэш; первая подготовка списка может занять время.
filter-on-text-changed=Автофильтр при изменении текста
filter-on-text-changed-desc=Включено — список в окнах выбора фильтруется по мере ввода текста. Выключено — фильтр применяется кнопкой «Применить».
model-filter-factory=[item=assembling-machine-1] Фильтр по фабрике
model-filter-beacon=[item=beacon] Фильтр по маяку
model-filter-factory-module=Ограничения модулей в фабриках
model-filter-beacon-module=Ограничения модулей в маяках
hidden_panels=Показывать специальные панели
hidden_panels-desc=Скрытые панели используются для просмотра значений объектов Factorio или для проверки фильтров (режим отладки)
display-hidden-column=Показывать скрытые колонки
display-hidden-column-desc=Индекс, ID, Тип, Название - скрытые колонки (режим отладки)

[helmod_user_settings]
display-ratio-horizontal=Фактор ширины окна
display-ratio-horizontal-desc=Доля ширины экрана для окна Helmod: например, 0,85 — 85%. Меняет ширину окна, а не масштаб мира или текста.
display-ratio-vertical=Фактор высоты окна
display-ratio-vertical-desc=Доля высоты экрана для окна Helmod: например, 0,8 — 80%. Меняет высоту окна, а не масштаб мира или текста.
display-main-icon=Показывать значок мода
display-main-icon-desc=Если вы используете "горячую клавишу", вы можете скрыть кнопку-значок мода
display-cell-mod=Режим отображения ячейки
row-move-step=Шаг перемещения ряда
row-move-step-desc=На сколько строк перемещать строку рецепта или блока вверх/вниз при Shift + щелчок. Это число строк, а не расстояние в пикселях; обычный щелчок перемещает на одну строку.

[helmod_pref_settings]
default-factory-level=Уровень фабрики по умолчанию
default-factory-level-desc=Выберите уровень фабрики, назначаемой в новом рецепте. 1 - самая медленная, последняя - самая быстрая.
format-number-factory=Числовой формат фабрик
format-number-factory-desc=Формат числа используемой фабрики
format-number-element=Числовой формат элементов
format-number-element-desc=Формат числа продукции или ингредиентов
preference-number-line=Количество строк для настроек
preference-number-line-desc=Количество строк в списках для появления полосы прокрутки
preference-number-column=Количество колонок для настроек
preference-number-column-desc=Количество колонок в списках для появления полосы прокрутки
display-product-order=Порядок продукции
display-product-order-desc=Показывать порядок продукции или ингредиентов в строке рецепта
display-product-cols=Количество колонок продукции
display-product-cols-desc=Количество колонок продукции, показываемое в одной строке. Если их будет больше, они перенесутся на новую строку.
display-ingredient-cols=Количество колонок ингредиентов
display-ingredient-cols-desc=Количество колонок ингредиентов, показываемое в одной строке. Если их будет больше, они перенесутся на новую строку.
display-fuel-compact=Компактный список топлива
display-fuel-compact-desc=Включить или выключить компактный выпадающий список топлива
display-spoilage=Показывать испорченность
display-spoilage-desc=Включить или выключить отображение испорченности
display-pollution=Показывать загрязнение
display-pollution-desc=Включить или выключить отображение загрязнения
display-building=Показывать здания
display-building-desc=Включить или выключить отображение зданий
ui-menu-lines=Линии меню
ui-menu-lines-desc=Главное меню будет состоять из одной или двух линий
ui-summary-mode=Режим итогов
ui-summary-mode-desc=Используется для пипетки и отображения: «Глобальный» - для всех зданий и модулей блока и дочерних, «Локальный» - только для зданий и модулей рецептов блока.
ui-auto-close=Авто-закрытие панелей
ui-auto-close-desc=Автоматически закрывать панель, когда открывается другая
ui-close-after-selection=Закрыть панель после выбора
ui-close-after-selection-desc=Закрывает панель выбора после выбора предмета
ui-glue=Доп. панели
ui-glue-desc=Прицепить некоторые панели рядом с главной панелью
ui-glue-offset=Смещение доп. панелей
ui-glue-offset-desc=Промежуток между главной панелью и прицепленной
range-value=Значение должно быть в этом промежутке
display-tips=Отображать советы
display-tips-desc=Включить или выключить отображение советов
beacon-affecting-one=Количество маяков, действующих на единицу
beacon-affecting-one-desc=Количество маяков, действующих на один сборщик.
beacon-by-factory=Маяков на фабрику
beacon-by-factory-desc=Количество маяков на фабрику.
beacon-constant=Постоянные маяки
beacon-constant-desc=Постоянное число маяков.

