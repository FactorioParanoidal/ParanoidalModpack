[mod-setting-description]
rso-use-donuts=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Добавляет кольцевые месторождения руды: руда образует кольцо с пустой серединой. Они становятся одной из возможных форм, а не заменяют все остальные месторождения.
rso-starting-richness-mult=Богатство всех начальных месторождений будет умножено на это значение. Заменяет глобальный множитель для стартовой области.
rso-global-richness-mult=Богатство всех месторождений ресурсов будет умножено на это значение.
rso-resource-chance=Вероятность месторождения в каждом регионе (от 0,01 до 1, где 1 означает всегда).
rso-region-size=Размер региона генерации в чанках. На регион приходится примерно одно месторождение (см. шанс спавна ресурсов) и свой бросок вражеских баз; большие значения делают ресурсы реже.
rso-enemy-chance=[img=__bobenemies__/graphics/icons/biter-spawner.png] Базовая частота обычных вражеских баз. Частота «Вражеские базы» в генераторе карты умножает её; с удалением от старта применяется дополнительный множитель, не превышающий 3. Даже 1 не гарантирует базу в каждом регионе: значение используется при расчёте плотности размещения.
rso-enemy-base-size=Размер Вражеских Баз умножится на это число (больше гнезд и Плевальщиков на базу, базы большего размера).
rso-global-size-mult=Размер месторождений умножится на это число. Больше, чем позволяет регион, месторождение не станет.
rso-remove-trees=Деревья и камни не появляются на месторождениях руды и вокруг скважин нефти и газа.
rso-infinite-ores-in-start-area=Бесконечные руды Angel's: появляются ли бесконечные участки в стартовой зоне.
rso-infinite-ore-threshold=Бесконечные руды Angel's: чем больше значение, тем меньше бесконечное ядро в самой плотной части месторождения (0 — около половины месторождения, 1 — ядра нет).
rso-reveal-spawned-resources=Если включено, каждый созданный чанк с ресурсами наносится на карту всех сил, чтобы месторождения не появлялись на миникарте частично.
rso-distance-exponent=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Расширенная настройка — может нарушить игровой баланс и/или игру.\nПоказатель степени, от которого зависит рост запаса руды с удалением от ближайшей стартовой позиции. Расстояние измеряется в регионах RSO. Более высокое значение усиливает рост запасов в далёких месторождениях.
rso-fluid-distance-exponent=[img=__base__/graphics/icons/crude-oil-resource.png] Расширенная настройка — может нарушить игровой баланс и/или игру.\nПоказатель степени, от которого зависит рост начального запаса жидкого ресурса в скважинах с удалением от ближайшей стартовой позиции. Расстояние измеряется в регионах RSO. Более высокое значение увеличивает запас в далёких скважинах сильнее.
rso-size-exponent=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Расширенная настройка — может нарушить игровой баланс и/или игру.\nПоказатель степени, от которого зависит рост размеров рудных месторождений и числа скважин с удалением от ближайшей стартовой позиции. Расстояние измеряется в регионах RSO. Это не множитель запаса в каждой клетке или скважине: за него отвечают отдельные настройки.
rso-multi-resource-active=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Позволяет двум ресурсам находиться в одном месторождении: рядом с основной рудой или жидким ресурсом может появиться дополнительный. Пары ресурсов и шанс смешанного месторождения зависят от их конфигурации.
rso-oil-in-start-area=Если включено нефть будет присутствовать в стартовой зоне. Если выключено, то она будет генерироваться только вне ее.
rso-ore-in-start-area=[img=__angelsrefininggraphics__/graphics/icons/angels-ore1/angels-ore1-HR.png] Включает стартовые месторождения руды около начальной позиции. Если выключено, RSO не создаёт эти стартовые месторождения. На стартовые жидкие ресурсы настройка не влияет; для нефти есть отдельный переключатель.

