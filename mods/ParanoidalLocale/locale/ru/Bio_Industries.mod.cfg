[mod-setting-description]
BI_Bio_Cannon=[img=utility/shoot_cursor_green] Включает прототип артиллерии Bio Industries и его боеприпасы. Он нацеливается на вражеские гнёзда и червей, а не на подвижные отряды кусак. Это не выдача готового орудия игроку.
BI_Bio_Fuel=[item=solid-fuel] Включает дополнительные цепочки Bio Industries для переработки биомассы в топливо и химическую продукцию, вместе с нужными установками и исследованиями. Не отключает выращивание деревьев и базовое производство удобрений.
BI_Easy_Bio_Gardens=Bio gardens consume ready-made fluid fertilizer, so just one pipeline is enough to supply all ingredients. However, this requires 50% more fertilizer than combining solid fertilizer and water on site.\nBio gardens will transmit electricity to adjacent Bio gardens. Arrange them on a grid, with no more than 1 tile between 2 Bio gardens, and they will be magically connected. :-)\n(Default: off)
BI_Enable_gvv_support=The "Lua API global Variable Viewer" (gvv) allows you to inspect the global table of other mods. If you want to help debugging "Bio Industries", enable this and type "\gvv" at the chat console to open the GUI of gvv.\n(Default: off)
BI_Game_Tweaks_Bot=[item=construction-robot][item=logistic-robot] Запрещает подбирать строительных и логистических роботов добычей и даёт им полную защиту от огненного урона. Это не бессмертие: другой урон по-прежнему возможен.
BI_Game_Tweaks_Disassemble=Добавить некоторые рецепты для разборки. Вы получите около 50% ресурсов обратно
BI_Game_Tweaks_Emissions_Multiplier=[item=coal] Задаёт отдельным видам топлива множители загрязнения при сжигании: например, уголь — 200%, древесина — 160%, твёрдое топливо — 100%. Не меняет их запас энергии; другие моды могут задавать свои окончательные значения.
BI_Game_Tweaks_Player=[img=utility/character_reach_distance_modifier_icon] Для обычного персонажа и совместимых скинов повышает дальность строительства, взаимодействия и выбрасывания предметов минимум до 20 клеток; подбора предметов и добычи ресурсов — до 6, автоподбора трофеев — до 5. Более высокие исходные значения не снижает. Скорость бега не меняется.
BI_Game_Tweaks_Production_Science=If this is enabled, an alternative recipe for Production science packs will be available.\n(Default: on)
BI_Game_Tweaks_Recipe=[item=iron-stick] Меняет базовые рецепты: в бетон добавляет железные прутья вместо железной руды, в каменную стену — железный прут; для рельсов заменяет камень щебнем, если щебень есть в сборке. Поздние изменения рецептов другими модами могут переопределить результат.
BI_Game_Tweaks_Small_Tree_Collisionbox=[entity=tree-01] Уменьшает область столкновения растущих деревьев, которые создаёт Bio Industries, чтобы рядом с ними было легче пройти. При выключении копируются размеры исходных деревьев. Не меняет этим флажком все взрослые деревья карты; другие моды могут дополнительно менять столкновения.
BI_Game_Tweaks_Stack_Size=[item=wood] Включает правила Bio Industries для увеличенных стопок: древесина, камень и бетон — минимум 400; щебень и шлак — минимум 800. Это промежуточные правила: общая настройка стопок сборки и другие интеграции могут задать итоговые значения иначе.
BI_Game_Tweaks_Tree=[item=wood] Для обычных деревьев заменяет выход 4 единиц древесины при рубке случайным количеством от 1 до 6. Деревья из списка исключений Bio Industries не затрагиваются. Это изменение добычи, а не скорости роста леса.
BI_Show_musk_floor_in_mapview=Show the electric grid overlay for __ENTITY__bi-solar-mat__ in map view. This shouldn't be changed in a running game as applying the setting to every __ENTITY__bi-solar-mat__ tile may take some time!
BI_Solar_Additions=Включает такие предметы как Солнечная ферма, Солнечная электростанция, Биоаккумулятор и Гигантскую подстанцию.

