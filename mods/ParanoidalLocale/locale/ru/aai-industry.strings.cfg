[mod-setting-description]
start-with-basic-logistics=Отмечает раннюю базовую логистику и механику горения изученными у всех сил (команд), если эти технологии присутствуют. Проверка выполняется при первом запуске мода, изменении конфигурации модов или создании новой силы. Отключение не отменяет уже изученное; простое изменение флажка во время игры не запускает исследование немедленно.
quick-start-science=[item=automation-science-pack] Сколько пакетов автоматизации AAI добавит в сундук разбившегося корабля на Наувисе на первом тике карты, если корабль найден. 0 — не добавлять пакеты. Изменение настройки в уже начатой игре не выдаёт дополнительные пакеты задним числом.
aai-fast-motor-crafting=В Paranoidal ускорение AAI перекрыто балансом сборки. Базовое время рецептов независимо от этого флажка: __ITEM__motor__ — 1 с, __ITEM__electric-motor__ — 1,5 с, __ITEM__iron-gear-wheel__ — 1,5 с, __ITEM__copper-cable__ — 2 с. Настройка не меняет итоговое время этих четырёх рецептов в сборке.
aai-wide-drill=В Paranoidal площадной бур AAI, его рецепт и технология скрыты независимо от этого флажка. Настройка не возвращает доступ к буру, но всё ещё определяет создание его прототипов. Не выключайте её на сохранении с уже существующими бурами AAI: при выключении их прототипы не создаются.
aai-burner-turbine-efficiency=[img=__aai-industry__/graphics/icons/burner-turbine.png] Доля энергии топлива, превращаемая твердотопливной турбиной-генератором в электричество, в процентах. Например, 85 означает эффективность 85%.
aai-fuel-processor=Добавляет обработчик топлива для преобразования химического топлива в универсальное обработанное топливо с добавочной энергией (% добавки меняется отдельно). Если отключено, технология будет скрыта в начале игры.
aai-fuel-processor-efficiency=Процент бонусной энергии, которую вы получите в процессе. Более высокие значения уменьшают энергопотребление обработчика топлива.
aai-stone-path=Добавляет грубые плитки каменных дорожек, которые можно выложить из камня.
wide-flashlight=AAI заменяет фонарь персонажа на более широкий, но в Paranoidal последующая настройка сборки заменяет свет всех персонажей независимо от этого флажка. Итоговый фонарь в этой сборке от него не зависит.
enhanced-nightvision=Использовать цветокоррекцию (LUT) [item=night-vision-equipment] ночного видения, которая не обесцвечивает экран, а добавляет небольшой зелёный блик в некоторые тени.
night-lut-set=В AAI выбирает тёмный или светлый ночной фильтр; Vanilla оставляет исходный. В Paranoidal эти фильтры затем заменяет NightBrightness. Итоговый цвет ночи в сборке задаётся стартовой настройкой темноты ночи NightBrightness, а не этим переключателем.

[string-mod-setting]
Dark=Тёмный
Bright=Светлый
Vanilla=Ваниль

