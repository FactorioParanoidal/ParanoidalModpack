industrial-furnace=Больше, быстрее и с большим количеством ячеек для модулей, чем электрическая печь. Требуется выбрать рецепт для работы, зато может работать с продвинутыми рецептами с несколькими ингредиентами и жидкостями.
area-mining-drill=Большой электрический бур с увеличенной площадью охвата, большей скоростью и дополнительными слотами для модулей.
offshore-pump=Качает жидкость с прибрежной зоны.\n[font=default-bold][color=#f5cb48][img=tooltip-category-electricity]Потребляет электричество[/color][/font]\n[font=default-semibold][color=#e4cead]Макс. потребление:[/color][/font] 50.0 кВт
