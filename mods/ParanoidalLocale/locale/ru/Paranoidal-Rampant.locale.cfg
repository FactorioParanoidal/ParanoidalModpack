rampantFixed--oldRedEnemyMapColor=Возвращает цвет врагов на карте к цвету в оригинальной игре
rampantFixed--unitSpawnerBreath=Теперь гнезда дышат воздухом, так что на них влияют вещи типа ядовитых капсул
rampantFixed--attackWaveGenerationThresholdMax=Общее количество очков, которое должен набрать чанк, чтобы возникла волна атаки. НЕ влияет на обычные волны кусак. Линейно масштабируется с коэффициентом эволюции (начальный порог при эволюции 0,0)
rampantFixed--attackWaveGenerationThresholdMin=Общее количество очков, которое должен набрать чанк, чтобы возникла волна атаки. НЕ влияет на обычные волны кусак. Линейно масштабируется с коэффициентом эволюции (конечный порог при эволюции 100,0)
rampantFixed--attackWaveMaxSize=Задаёт максимум эволюционной части расчёта размера волн Rampant. Итоговый расчёт дополнительно учитывает рейдовые гнёзда и возмездие, имеет минимум 2 и может быть переопределён внешним управлением; это не безусловный предел каждого отряда. Настройка эволюции достижения максимума находится отдельно. На ванильные волны не влияет.
rampantFixed--attackWaveMaxSizeEvoPercent=Процент расчётной эволюции ИИ, при котором эволюционная часть размера волны достигает заданного максимума. Меньшее значение позволяет достичь его раньше. «Агрессивный старт» может повысить расчётную эволюцию выше настоящей; итоговый размер также учитывает рейдовые гнёзда и возмездие.
rampantFixed--agressiveStart=Устанавливает для планирования ИИ Rampant нижнюю границу расчётной эволюции: от 10% в начале карты до 30% через 1 игровой час. Если настоящая эволюция выше, берётся она. Влияет на расчёты ИИ, включая размер волн и очки действий, но не повышает саму эволюцию команды врагов.
rampantFixed--safeBuildings=Главный переключатель правил безопасных построек ниже. Защиту получают только подходящие выбранные объекты, а не вся база. Старые подходящие объекты могут сначала разрушиться; в предусмотренном обработчике Rampant пытается создать их заново неразрушаемыми. Рельсы, сигналы и остановки набора scrap исключены. Для больших столбов есть отдельный список; соседние столбы и лампы, образующие преграду, защиту не получают.
rampantFixed--safeBuildings-straightRail=Обезопасить [item=rail] ж/д, [item=rail-signal] светофоры и станции от кусак. Деревянные рельсы, примитивные светофоры и станции всегда уязвимы.
rampantFixed--safeBuildings-bigElectricPoles=Какие [item=big-electric-pole] большие опоры ЛЭП (тиры 1–4, также с лампами) неуязвимы для врагов. Действует на построенные после изменения настройки. Деревянные и другие опоры всегда уязвимы. Опора, стоящая вплотную к другой большой опоре или лампе, не защищается: такой ряд был бы стеной, которую враги не могут ни обойти, ни сломать.
rampantFixed--safeBuildings-lamps=Обезопасить лампы от кусак. Лампа, стоящая вплотную к другой лампе или большой опоре, не защищается.
rampantFixed--permanentNocturnal=Переключение этого параметра вызовет появление волн атак мода Rampant ночью. Работает лучше с модом Clockwork или другими модами, расширяющими ночь.
rampantFixed--allowDaytimePlayerHunting=Разрешает кусакам охотиться на игрока всегда
rampantFixed--allowDaytimeNonRampantActions=Не даёт Rampant отменять сбор обычных, не управляемых скриптом групп врагов в состоянии перемирия ИИ или днём при ночном режиме ИИ. При отключении такие группы в этих условиях удаляются. Это не отменяет остальные условия появления и атак врагов.
rampantFixed--aiPointsScaler=Множитель периодического начисления очков действий ИИ Rampant (0–100). Начисление зависит также от прошедшего времени, гнёзд, расчётной эволюции и состояния ИИ, а не является фиксированной суммой за цикл. 1 — обычный коэффициент; больше — ИИ получает больше очков. 0 отключает это начисление, но не обнуляет накопленные очки и не выключает ИИ.
rampantFixed--aiDifficulty=Hard - по умолчанию. Lite - для более комфортной игры: ответ на действия игрока слабее, атаки - реже
rampantFixed--addWallResistanceAcid=У стен и ворот с уже положительным процентным сопротивлением кислоте поднимает кислотное сопротивление минимум до 60%, ядовитое — до 75%. Фиксированное снижение взрывного урона повышает минимум до 30 у стен и 40 у ворот. Объекты без исходного положительного кислотного сопротивления эта правка не затрагивает; более сильную защиту не снижает.
rampantFixed--removeBloodParticles=Брызги крови, которые появляются при убийстве кусак, вызывают падение UPS.
rampantFixed--fireSafety-flamethrower=В ручном огнемёте добавляет прямой огненный урон и убирает штатное прямое создание наземного пламени потоком. Сохраняет изменённый поджигающий эффект; связанный с ним огонь на деревьях имеет нулевой урон. Это не полный запрет возгораний и не иммунитет к огню.
rampantFixed--flamethrowerTurretsRebalance=Сниженние скорости атаки при сохранении дпс огнеметов (в т.ч. из Rampant Arsenal). Значительно уменьшает лаги от их использования
rampantFixed--rampantArsenalRebalance=Урон от стикеров будет наноситься реже, но сильнее. Значительно снижает лаги в поздней игре при использовании яда и кислоты
rampantFixed--enableSwarm=Этот параметр уменьшает размер элемента collision_mask, что позволяет кусакам уменьшить количество столкновений и двигаться более плавной волной
rampantFixed--attack-warning=Показывать сообщение, предупреждающее игроков о надвигающейся волне атаки
rampantFixed--newEnemies=Добавляет новых врагов, которые будут распространены по миру. Это увеличивает потребление ОЗУ. По 1 варианту на кусак, червей, гнёзд и 5 уровней их развития это увеличит потребление ОЗУ на 2 ГБ. По 20 вариантов и 10 уровней развития  - до 9 ГБ потребления ОЗУ. Варианты добавляют случайности каждому уровню кусак, червей и гнёзд.
rampantFixed--allowOtherEnemies=Только в новой игре или при первом запуске Rampant Fixed. Ограничивает размещение <новых врагов> указанным направлением, оставляя место для врагов остальных модов. Если отключено, то гнезда прочих модов будут встречаться изредка в случайных местах, а стандартные будут заменены на <новых врагов>
rampantFixed--newEnemiesSide=Выбирает сторону от центра карты, где допускаются новые фракции Rampant, если разрешены прочие враги. В смешанном режиме места выбираются случайно, без ограничения одной стороной. Выбор запоминается при первой инициализации размещения новых фракций в сохранении; последующие изменения этой настройки игнорируются.
rampantFixed--newEnemyVariations=Только для совместимости со стандартным Рампантом. Все новые объекты будут из варианта №1
rampantFixed--tierStart=Начальная точка шкалы силы новых врагов (1–10), а не число создаваемых уровней. Всегда создаётся 10 ступеней с параметрами между начальной и конечной точкой. Здоровье также зависит от фракции и отдельных множителей настроек.
rampantFixed--tierEnd=Конечная точка шкалы силы новых врагов (1–10), а не число создаваемых уровней. Всегда создаётся 10 ступеней с параметрами между начальной и конечной точкой. Здоровье также зависит от фракции и отдельных множителей настроек.
rampantFixed--allowLongRangeImmunity=Некоторые фракции невозможно убить издалека, что компенсируется пониженным здоровьем. Огонь и кислота игнорируют эту защиту. Отключение этой настройки может сделать эти виды слишком слабыми.
rampantFixed--longRangeImmunity_efficiency=100% - иммунитет к дальнему урону. 10% - пройдет 90% урона
rampantFixed--allowOneshotProtection=Включает защиту поддерживающих её юнитов Rampant от чрезмерного урона за одно попадание; эффективность задаётся отдельно. Для обычных юнитов огонь и кислота обычно исключены, но события с исходным уроном больше 200 всё же проходят фильтр обработки. Это не общая неуязвимость и не гарантия фиксированного числа попаданий до гибели. У вожаков и боссов отдельная обработка урона.
rampantFixed--oneshotProtection_efficiency=100% - урон не может превысить заданный порог (после чего еще применится процентное сопротивление). 10% - снижение сверхурона составит только 10%
rampantFixed--enableMigration=Разрешает режим миграции ИИ Rampant и расширение вражеской территории. Работает только при включённом расселении врагов в настройках карты. [color=orange]Предупреждение![/color] Это усложняет игру: враги могут занимать новые участки и приближаться к базе; фиксированного срока начала осады настройка не задаёт.
rampantFixed--max-evo-dist=Чем выше значение, тем дальше от центра появляются сильные фракции (при недостаточной эволюции)
rampantFixed--enableShrinkNestsAndWorms=Уменьшает размер границ столкновения у гнёзд и червей на 50% (для лучшего прохождения между ними). Могут возникнуть взаимные перекрытия из-за того, что размер границ столкновения будет меньше, чем размер самого объекта.
rampantFixed--attackWaveGenerationUsePlayerProximity=Позволяет близости игрока повышать активность гнёзд Rampant, когда феромоны игрока в их чанке превышают отдельный порог. Это дополнительное условие активности, а не добавка к размеру волны. На ванильные волны атак не влияет.
rampantFixed--attackPlayerThreshold=Порог феромонов игрока в чанке с гнёздами. Если учёт близости игрока включён и значение строго выше порога, активность гнёзд повышается. Больший порог уменьшает влияние близости игрока; само превышение не является немедленным приказом атаковать.
rampantFixed--unkillableLogisticRobots=Это делает транспортных дронов невосприимчивыми к повреждениям
rampantFixed--unkillableConstructionRobots=Это делает строительных дронов невосприимчивыми к повреждениям
rampantFixed--unitBiterHealthScaler=[entity=small-biter] Множитель максимального здоровья кусак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitBiterSpeedScaler=[entity=small-biter] Множитель скорости передвижения кусак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitBiterDamageScaler=[entity=small-biter] Множитель урона кусак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitBiterRangeScaler=[entity=small-biter] Множитель дальности атаки кусак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitBiterHealingScaler=[entity=small-biter] Множитель скорости самостоятельного восстановления здоровья кусак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitSpitterHealthScaler=[entity=small-spitter] Множитель максимального здоровья плевак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitSpitterSpeedScaler=[entity=small-spitter] Множитель скорости передвижения плевак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitSpitterDamageScaler=[entity=small-spitter] Множитель урона плевак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitSpitterRangeScaler=[entity=small-spitter] Множитель дальности атаки плевак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitSpitterHealingScaler=[entity=small-spitter] Множитель скорости самостоятельного восстановления здоровья плевак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitDroneHealthScaler=Множитель максимального здоровья вражеских дронов Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент. Речь о боевых дронах фракций «Породитель» и «Оса», не о роботах игрока.
rampantFixed--unitDroneSpeedScaler=Множитель скорости передвижения вражеских дронов Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент. Речь о боевых дронах фракций «Породитель» и «Оса», не о роботах игрока.
rampantFixed--unitDroneDamageScaler=Множитель урона вражеских дронов Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент. Речь о боевых дронах фракций «Породитель» и «Оса», не о роботах игрока.
rampantFixed--unitDroneRangeScaler=Множитель дальности атаки вражеских дронов Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент. Речь о боевых дронах фракций «Породитель» и «Оса», не о роботах игрока.
rampantFixed--unitDroneHealingScaler=Множитель скорости самостоятельного восстановления здоровья вражеских дронов Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент. Речь о боевых дронах фракций «Породитель» и «Оса», не о роботах игрока.
rampantFixed--unitWormHealthScaler=[entity=small-worm-turret] Множитель максимального здоровья червей Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitWormDamageScaler=[entity=small-worm-turret] Множитель урона червей Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitWormRangeScaler=[entity=small-worm-turret] Множитель дальности атаки червей Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitWormHealingScaler=[entity=small-worm-turret] Множитель скорости самостоятельного восстановления здоровья червей Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitSpawnerHealthScaler=[entity=biter-spawner] Множитель максимального здоровья гнёзд кусак и плевак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitSpawnerOwnedScaler=[entity=biter-spawner] Умножает лимит живых юнитов, которых может поддерживать одно гнездо Rampant. 1 оставляет исходный лимит. Это не общее число юнитов, которое гнездо может породить за всё время.
rampantFixed--unitSpawnerSpawnScaler=[entity=biter-spawner] Умножает порог числа дружественных юнитов вокруг гнезда Rampant, при котором оно приостанавливает появление новых. 1 сохраняет исходный порог. Это не количество юнитов за одну порцию.
rampantFixed--unitSpawnerRespawnScaler=[entity=biter-spawner] Множитель паузы между появлением новых юнитов из гнёзд кусак и плевак Rampant. 1 не меняет паузу; больше 1 — юниты появляются реже, меньше 1 — чаще. Это не прямой множитель скорости размножения.
rampantFixed--unitSpawnerHealingScaler=[entity=biter-spawner] Множитель скорости самостоятельного восстановления здоровья гнёзд кусак и плевак Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitHiveHealthScaler=[entity=biter-spawner] Множитель максимального здоровья ульев и суперульев Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitHiveHealingScaler=[entity=biter-spawner] Множитель скорости самостоятельного восстановления здоровья ульев и суперульев Rampant. 1 оставляет исходное значение, 2 удваивает, 0,5 уменьшает вдвое; это коэффициент, а не процент.
rampantFixed--unitHiveRespawnScaler=[entity=biter-spawner] Множитель паузы между появлением новых юнитов из ульев и суперульев Rampant. 1 не меняет паузу; больше 1 — юниты появляются реже, меньше 1 — чаще. Это не прямой множитель скорости размножения.
rampantFixed--raidAIToggle=Включает рейды ИИ из-за дальних гнезд
rampantFixed--siegeAIToggle=Разрешает осадный вариант отрядов расселения Rampant: вне состояния осады он может выбираться с шансом 10%. Если ИИ уже находится в состоянии осады, этот вариант выбирается и без флажка. Успех формирования и расселения зависит от остальных условий ИИ; поселение прямо под стеной не гарантируется.
rampantFixed--siegeMinDistance=Осады селятся не ближе, чем за указанное количество чанков от военных построек
rampantFixed--undergroundAttack=Разрешает подходящим наземным отрядам Rampant уходить под землю при включённом тяжёлом ИИ; обычный маршрут зависит от отдельной вероятности и условий проходимости. Отдельно, гибель бойца от артиллерии или достаточно дальнего обстрела может заставить выживший отряд зарыться, независимо от этой вероятности. Летящие, бешеные отряды и отряды с пауками не используют этот ответный путь.
rampantFixed--undergroundAttackProbability=Базовая вероятность обычного подземного маршрута при эволюции 80% и выше; значение — доля (0,1 = 10%). До 40% расчёт равен нулю, между 40% и 80% растёт линейно; в этом промежутке результаты меньше 0,001 обнуляются. После первого ненулевого шанса код сохраняет минимум 0,0001 (0,01%), даже если расчёт позже снизится до нуля. Нужны подземные атаки и тяжёлый ИИ на подходящей поверхности. Ответное закапывание после дальнего или артиллерийского обстрела эту вероятность не использует.
rampantFixed--demolisherAttack_AdditionalTime=Эти минуты будут добавлены к расчитанному стандартному интервалу
rampantFixed--laserEnemy=Фракция лазерных кусак и плевак: иммунитет к лазеру, большое сопротивление электричеству, небольшое — огню и кислоте, небольшая уязвимость к физическому урону. Задача фракции — проверять оборону на наличие физического урона. Защита от чрезмерного урона за попадание зависит от общих настроек Rampant, а не гарантирует постоянный процент максимального здоровья.
rampantFixed--waspEnemy=Фракция ос, юниты - только плеваки, плюющиеся мелкими дронами. Фракция поддержки, отвлекает огонь на дронов
rampantFixed--spawnerEnemy=Фракция породителей, юниты - плеваки, появляющиеся из породителей, плеваки откладывают яйца, из которых вылупляются кусаки. Задача фракции - проверка обороны на наличие aoe урона или скорострельного оружия. Иммунитет к урону издалека (30+).
rampantFixed--trollEnemy=Фракция регенерирующих кусак: мощная регенерация и большое здоровье, иммунитет к яду, большое сопротивление взрывному урону и небольшое — физическому. Уязвимы к огню и медленно передвигаются. Защита от сильных попаданий зависит от общих настроек Rampant; безусловного ограничения урона в 20% здоровья нет.
rampantFixed--fastEnemy=Фракция быстрых кусак и плевак: высокая скорость, небольшое сопротивление взрывному и кислотному урону. Пороги дальней защиты — больше 20 клеток у кусак и больше 25 у плевак; её действие зависит от общих настроек защиты Rampant. Для огнемётных и артиллерийских установок действует отдельная обработка. Задача фракции — уничтожение неприкрытых систем дальнего огня.
rampantFixed--infernoEnemy=Фракция адских кусак, юниты - только плеваки, которые плюются зажигательной кислотой, сжигающей всё. Экстремальное сопротивление кислоте и огню, небольшая уязвимость к яду и большая - к лазеру. Задача - дойти и хотя бы раз плюнуть. Этого хватит для уничтожения большинства объектов и любителей их починить
rampantFixed--nuclearEnemy=Фракция ядерных кусак: быстрые кусаки с малым здоровьем, взрывающиеся при атаке подобно атомной бомбе. Большое сопротивление огню и кислоте, большая уязвимость к взрывному урону. Защита от чрезмерного урона за попадание зависит от общих настроек Rampant и не гарантирует, что для гибели всегда потребуется не меньше пяти ударов.
rampantFixed--electricEnemy=Фракция электрических кусак, юниты - только кусаки, на небольшом расстоянии поражающие электричеством несколько целей на линии удара. Большое сопротивление электричеству, небольшое сопротивление лазеру.
rampantFixed--fireEnemy=Фракция огненных кусак и плевак, большое сопротивление кислоте, небольшое - физическому урону. Иммунитет к огню. Повышенная дальность. Уязвимость к лазерам. Плеваки атакуют струей кислотного огня, так что иммунитет стен и огнеметов не поможет. Задача фракции - намекнуть игроку, что пора бы подумать о лазерах, до того как пришли джаггернауты.
rampantFixed--ArachnidsEnemy=Имеют вид пауков (если установлен мод Arachnids). Уязвимы к физическому урону (x2). При смерти оставляют яйца, из которых через 5 секунд вылупится новая кусака. Яйца уязвимы к физическому урону. Задача фракции - заставить игрока тратить патроны.
rampantFixed--suicideEnemy=Фракция кусак-самоубийц: быстрые кусаки с очень малым здоровьем, взрывающиеся при атаке и не вредящие союзникам своим взрывом. Небольшое сопротивление яду, большое — огню и кислоте; большая уязвимость к взрывному урону. Дальняя защита с порогом больше 18 клеток и защита от сильных попаданий зависят от общих настроек Rampant; для огнемётных и артиллерийских установок отдельная обработка.
rampantFixed--physicalEnemy=Фракция бронированных кусак, юниты - только кусаки. Большое сопротивление физическим атакам и взрывчатке, небольшое - к огню и кислоте. Не менее 2 ударов до гибели. Уязвимость к лазеру. Если к их приходу в наличии только физический урон, то патронов скоро не будет.
rampantFixed--acidEnemy=Фракция кислотных кусак, иммунитет к кислоте и яду.
rampantFixed--energyThiefEnemy=Фракция кусак-энергокрадов, большое сопротивление электричеству и лазеру, небольшое сопротивление взрыву. При разрушении подходящих электропостроек создают энергопоглощающие кристаллы. Из-за них, оставшись без энергии, можно проиграть игру
rampantFixed--poisonEnemy=Фракция ядовитых кусак, юниты - только кусаки. При смерти создаёт облако, которое лечит кусак и повреждает объекты игрока. Большое сопротивление яду, небольшое сопротивление к огню. Уязвимость к лазеру.
rampantFixed--JuggernautEnemy=Только кусаки. Облако "целебного" яда при смерти и атаке. Танк, способный в одиночку уничтожить линию обороны, которую позабыли оснастить чем-то, кроме патронов, кислоты и огнеметов. Взрывчатка и яд тоже работают плохо. Относительно безопасны для персонажа из-за пониженной скорости.
rampantFixed--disableCollidingProjectiles=Снаряды (плевки) кусак не сталкиваются с другими кусаками, червями или гнёздами. Всё остальное может с ними сталкиваться.
rampantFixed--enableFullMapScan=Этот параметр заставляет карту игры медленно сканироваться на предмет сущностей, созданных или уничтоженных вне системы событий factorio. (Если в моде не используется script_raised_built или script_raised_destroyed, это приведет к тому, что Rampant в конечном итоге будет соответствовать карте игры).
rampantFixed--enableFadeTime=Применяет отдельную настройку времени исчезновения к трупам кусак, плевак, червей, гнёзд и ульев. Для служебных эффектов появления spawner-spawn устанавливается 1 секунда. При отключении эта правка не меняет исходное время существования трупов.
rampantFixed--maxNumberOfBuilders=Больше формирующихся групп требуют больше UPS.
rampantFixed--maxNumberOfSquads=Больше отрядов требуют больше UPS.
rampantFixed--settlementsProbability=Значение по умолчанию = 0.4 (40% расселение, 60% атака). Не влияет на обычное расселение, только на отряды в режимах осады/миграции
rampantFixed--vengenceProbabilityPercent=Масштабирует шанс сбора отрядов возмездия после подходящих потерь врагов. Значение 0,04 даёт обычный коэффициент 1; 0 обнуляет этот порог. Это не фиксированный шанс 4% после каждой смерти: итог зависит от расчётной эволюции, цепочки возмездия, таймера чанка и состояния поверхности.
rampantFixed--chainVengenceCoefficient=Ослабляет шанс следующих отрядов возмездия: порог сбора умножается на коэффициент в степени счётчика возмездия. При 0,6 полный шаг счётчика оставляет 60% прежнего шанса. Уничтожение вражеских строений и дальние обстрелы могут сбросить ослабление; обычные атаки ИИ постепенно уменьшают его. На сложности Hard при достаточном запасе очков счётчик растёт половинными шагами, и ослабление мягче.
rampantFixed--showAdminMenu=Показывает вверху экрана кнопку административного меню Rampant для администратора или допущенного отладчика. В одиночной игре игрок обычно имеет права администратора. Меню позволяет заменить врагов стандартными и выбрать поверхности/планеты, которые Rampant должен игнорировать.
rampantFixed--showSquadAlert=Показывать предупреждение при обнаружении отряда ИИ Рампанта (дебаг)

[description]
rampantFixed--EnemySettings1_1_9=Rampant Fixed: с версии 1.1.9 доступно смешанное расселение врагов рампанта и прочих (смотрите настройки запуска). Только в новой игре
rampantFixed--EnemySettings1_1_10=Rampant Fixed: с версии 1.1.10 возможна замена гнезд новых врагов на стандартные. Это может быть полезно, если вы желаете продолжить игру без новых врагов или удалить мод без потери гнезд (настройки игрока-"показать диалог отключения новых врагов"). Только в одиночной игре или игроков с правами администратора
rampantFixed--enableShootingAlerts=Rampant Fixed: рекомендуется найти способ включить уведомления о стрельбе турелей. Без этого вы рискуете пропустить атаки.
rampantFixed--disableNewEnemies_text=Гнезда заменяются на всех планетах. Вернуть их будет нельзя
rampantFixed--msg-ask-disableNewEnemies=Замена гнезд врагов Рампанта на стандартных. Может занять время на больших картах. Начать замену?
rampantFixed--button_disableNewEnemies_disable=Да (может занять некоторое время)
rampantFixed--button_disableNewEnemies_cancel=Отмена
rampantFixed--msg_replaceNewEnemiesNests=Замена гнезд завершена. Обработано гнезд: __1__ . При желании мод можно удалить без последствий.
rampantFixed--K2_SE_CMO_incompatibilityWarning=Обнаружено сочетание модов К2+SE+переработка боевой механики. В этом сочетании, настройки мода <переработка боевой механики>: блокируемые снаряды плевак/червей "[font=heading-1][color=red]некорректно преобразует атаки [/color][/font] огненных и инфернальных фракций. Если они включены, то включите альтернативную атаку (настройка Rampant Fixed: Снаряды: заменить струйные атаки на блокируемые снаряды)
rampantFixed--undergroundAttackWarning=__1__:предупреждение: кусаки научились подземным атакам! Твердое покрытие (скорость перемещения 150+) задержит процесс выкапывания на минуту,
rampantFixed--undergroundAttackWarning2=замедлит скорость кусак, уведомит о попытке выкопаться или пройти мимо (если в зоне засвета радара).
rampantFixed--firstUndergroundAttackWarning=Обнаружена первая подземная атака (следующие атаки будут идти без предупреждения)
rampantFixed--undergroundAttackDigoutWarning=Предупреждение: обнаружена попытка выкопаться. Твердое покрытие задержит ее на 1 минуту
rampantFixed--undergroundAttackDetectedWarning=Обнаружена подземная активность!
rampantFixed--squadDetectedWarning=Обнаружен отряд ИИ Рампанта. Размер отряда: __1__
rampantFixed--demolisherAttackDetectedWarning=Обнаружен Разрушитель!
rampantFixed--JuggernautAlert=Земля под гнёздами стала твёрже. Что-то там отращивает панцирь, который не берёт ни пуля, ни пламя.
rampantFixed--demolisherNote1=[color=red]__1__:Атака разрушителя. Однажды атаковав и уйдя живым, он будет приходить снова и снова.[/color]Уничтожив его, вы отдаляете момент атаки другого разрушителя.
rampantFixed--demolisherNote2=При начале атак, в 20% случаев атакует полная копия существующего разрушителя. В остальных случаях идет мутация. Мутируют только Space Age разрушители.
rampantFixed--demolisherNote3=С __1__% эволюции возможна мутация в среднего разрушителя. С __2__% - в большого. Если не можете убить - покормите его
rampantFixed--demolisherNotFeeded=__1__: Разрушитель сыт и не реагирует на еду
rampantFixed--demolisherFeeded_Hunger=Разрушитель, похоже, насытился и пока не интересуется вашими постройками. Просьба не считать это дипломатической победой.
rampantFixed--demolisherFeeded_noHunger=Разрушитель, похоже, насытился и пока не интересуется вашими постройками. Просьба не считать это дипломатической победой.
rampantFixed--demolisherFeared=__1__: Разрушители напуганы и не захотят есть еще __2__ минут.
rampantFixed--NEW_ENEMIES_SIDE_ignored=Rampant Fixed: Изменилась настройка расположения врагов. Её изменение доступно только при начале игры и оно будет проигнорировано
rampantFixed--AdminMenu=Рампант фиксед. Меню администратора
rampantFixed--showDisableNewEnemies=Показать диалог отключения врагов Рампанта
