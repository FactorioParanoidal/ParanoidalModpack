[entity-description]
biterSupressor1-rampant=Предназначен для снижения угрозы временно покинутым планетам[color=green]\nСнижает частоту атак от ИИ Рампанта в 3 раза. Предотвращает массовые атаки в случае прорыва обороны[/color]\nНе влияет на разрушителей, атаки от загрязнения и ответ на разрушение гнезд[color=red]\nПри установке 2 и более, положительный эффект не складывается\nПоложительный эффект не накладывается при физическом присутствии игроков на планете[/color]
biterSupressor2-rampant=Предназначен для снижения угрозы временно покинутым планетам\nСодержит функционал предыдущей версии, кроме того:[color=green]\nУвеличивает интервал между атаками разрушителей в 1.5 раза, в т.ч. от еды\nСнижает максимальный размер атакующего отряда под управлением ИИ Рампанта в 2 раза[/color]
biterSupressor3-rampant=Предназначен для снижения угрозы временно покинутым планетам\nСодержит функционал предыдущей версии, кроме того:[color=green]\nПри непрерывном 100% питании эволюция на планете не будет расти[/color]

