[technology-description]
factory-upgrade-borehole-pump=Позволяет выкачивать жидкости из скважин с использованием скважинного насоса. Тип жидкости зависит от планеты. Должен быть установлен внутри фабрики.
factory-connection-type-fluid=Позволяет перекачивать жидкости в фабрику с использованием труб и подземных трубопроводов.\nНаведите указатель мыши на стрелку подключения и нажмите __CONTROL__factory-rotate__ чтобы выбрать режим приема или передачи. __CONTROL__factory-increase__ и __CONTROL__factory-decrease__ чтобы изменить частоту передачи.
factory-connection-type-chest=Позволяет транспортировать предметы в фабрику с помощью сундуков.\nНаведите указатель мыши на стрелку подключения и нажмите __CONTROL__factory-rotate__ чтобы выбрать режим приема, передачи или [font=default-semibold][color=255,230,192]балансировки[/color][/font]. __CONTROL__factory-increase__ и __CONTROL__factory-decrease__ чтобы изменить частоту передачи.
factory-connection-type-circuit=Позволяет подключать фабрику к логической сети с помощью коннектора логической сети фабрики.
factory-interior-upgrade-lights=Добавляет потолочные светильники во все ваши фабрики.\nСолнечные панели по-прежнему не будут производить электроэнергию внутри фабрик.
factory-interior-upgrade-display=Добавляет условные обозначения на фабрики для Alt-режима. Настройте сигнал предмета на демонстрационном стенде внутри фабрики, чтобы они отображались снаружи.
factory-recursion-t1=Позволяет размещать фабрики внутри других, более крупных фабрик.
factory-recursion-t2=Позволяет размещать фабрики внутри других фабрик того же размера.
factory-connection-type-heat=Позволяет передавать тепло в фабрику с помощью тепловых труб.\n__CONTROL__factory-increase__ и __CONTROL__factory-decrease__, чтобы изменить частоту передачи.
factory-interior-upgrade-roboport=Позволяет отправлять запросы на строительство наружу. Строительные дроны доставят запрошенные предметы в строительный сундук внутри фабрики.

