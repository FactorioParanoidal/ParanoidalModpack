Factorissimo2-hide-recursion=Спрятать технологию Рекурсия
Factorissimo2-hide-recursion-2=Спрятать технологию Рекурсия 2
Factorissimo2-cheap-research=Дешевые исследования

[mod-setting-description]
Factorissimo2-disable-new-tile-effects=Отключает новые эффекты клеточек добавленные в 2.0, возвращает более чистый вид краёв как в 1.1.
Factorissimo2-free-recursion=Позволяет ставить фабрики друг в друга даже без исследования технологий рекурсии.
Factorissimo2-hide-recursion=Скрывает технологии Рекурсия 1 и 2, чтобы вы не смогли их исследовать.
Factorissimo2-hide-recursion-2=Скрывает технологию Рекурсия 2, чтобы вы не смогли её исследовать.
Factorissimo2-cheap-research=Уменьшает стоимость исследований до ванильных значений без Space Age. Большинство технологий станут дешевле.

[surface-property-name]
solar-power=Солнечная энергия

[command-help-message]
give-lost-factory-buildings=Выдаёт вам все подобранные фабрики в виде предметов, кроме тех, что уже лежат в инвентаре игрока. Если предметы фабрик на самом деле не пропали, после этой команды несколько предметов в мире могут ссылаться на одну и ту же фабрику. Такие лишние предметы исчезнут с сообщением «Неверные данные фабрики!» при попытке их поставить.

