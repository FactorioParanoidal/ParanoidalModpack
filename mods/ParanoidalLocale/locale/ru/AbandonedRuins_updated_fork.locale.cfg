[mod-setting-description]
ruins-enable-spawn-ruins-all-planets=Если выключено, руины появляются только на Нависе и планетах Space Age (Глеба, Фульгора, Вулканус, Аквило), но не на планетах других модов. Без Space Age есть только Навис, поэтому в Paranoidal настройка обычно ни на что не влияет.
ruins-expensive-sanity-checks=Дополнительно проверяет наборы руин, планеты и поверхности при спавне. Ошибка в наборе руин останавливает игру с сообщением, а не проходит незаметно. Немного снижает производительность; при включённом журнале отладки работает всегда.
ruins-enemy-not-cease-fire=Если выключено, сила руин держит перемирие с игроками: турели и черви руин не атакуют. Действует сразу, в том числе на уже появившиеся руины.
ruins-enable-debug-log=Пишет в factorio-current.log много диагностических сообщений мода руин. Включайте только для поиска ошибки.
ruins-enable-debug-utils=Пишет в журнал диагностику библиотеки utilities. Очень много сообщений, держите выключенным.
ruins-enable-debug-on-tick=Пишет в журнал сообщения при каждом запуске обработчика спавна. Очень много сообщений, держите выключенным.
ruins-avoid-repeats=Каждая руина своего размера появляется один раз, прежде чем любая из них сможет появиться снова (счёт ведётся отдельно для набора и размера; руины, недопустимые в данном месте, пропускаются и остаются на потом). Выключите для полностью случайного выбора.
current-ruin-set=Какие руины появляются на карте. «Paranoidal» содержит все руины: собственные и набор «base». «Нет» выключает руины.
ruins-min-distance-from-spawn=Ближе этого числа клеток к центру карты (0, 0) по любой из осей руины не появляются (квадратная зона). Только при включённой зависимости от расстояния средним руинам нужно ×2,5, а большим ×5 этого расстояния.
ruins-ignore-distance=Включено (по умолчанию): любая руина любого размера, в том числе редкая и опасная, может появиться сразу за зоной без руин вокруг центра карты. Что попадётся — дело везения.\nВыключено: средние руины появляются только дальше ×2,5, большие — дальше ×5 зоны без руин, а отдельные ценные и опасные руины — только дальше своей дистанции (400–2500 клеток).
ruins-spawn-tick-seconds=Раз в столько тиков (60 тиков = 1 секунда) появляются руины, поставленные в очередь новыми чанками. Меньше — руины появляются быстрее после генерации чанка, больше — работа распределяется реже. Изменение действует сразу.
ruins-small-ruin-chance=Вероятность, что в новом сгенерированном чанке появится малая руина (8×8), от 0 до 1: 0,02 = 2%. В чанке появляется не больше одной руины; если сумма трёх шансов больше 1, они пропорционально уменьшаются. Руина не ставится, если на её месте есть вода или другие непроходимые плитки.
ruins-medium-ruin-chance=Вероятность, что в новом сгенерированном чанке появится средняя руина (16×16), от 0 до 1: 0,01 = 1%. В чанке появляется не больше одной руины; если сумма трёх шансов больше 1, они пропорционально уменьшаются. Руина не ставится, если на её месте есть вода или другие непроходимые плитки.
ruins-large-ruin-chance=Вероятность, что в новом сгенерированном чанке появится большая руина (32×32), от 0 до 1: 0,002 = 0,2%. В чанке появляется не больше одной руины; если сумма трёх шансов больше 1, они пропорционально уменьшаются. Руина не ставится, если на её месте есть вода или другие непроходимые плитки.

[string-mod-setting]
current-ruin-set-__none__=Нет (руины выключены)
current-ruin-set-base=Только руины base

[item-name]
ruins-claim-tool=Инструмент захвата руин

[item-description]
ruins-claim-tool=Выделите область, чтобы забрать нейтральные постройки руин своей команде. Альтернативное выделение (Shift) также убирает обломки и остатки рельсов в области.

[shortcut-name]
ruins-claim-tool=Захватить руины

[controls]
ruins-claim-tool=Захватить руины
