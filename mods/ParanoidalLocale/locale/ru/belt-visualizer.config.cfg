[mod-setting-name]
bv-highlight-maximum=Максимальное количество подсветок за тик

[mod-setting-description]
bv-highlight-maximum=Бюджет подсветки объектов конвейерного пути за игровой тик, общий для активных поисков. Он делится между ними; из-за округления фактическое число объектов может немного превысить значение. Меньшее значение растягивает подготовку подсветки; очистка старых изображений обрабатывается отдельно.

[controls]
bv-highlight-belt=Подсветка конвейеров
bv-highlight-ghost=Подсветка призрачных конвейеров
bv-toggle-hover=Переключить режим наведения курсора

[shortcut]
bv-toggle-hover=Переключить режим наведения курсора

