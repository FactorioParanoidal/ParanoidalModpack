[item-description]
PI_inserter_selector=Планировщик автоматической очистки манипуляторов: \n Манипуляторы в выделенной области очищаются полностью автоматически. \nПри выделении с зажатым Shift автоматическая очистка манипуляторов в выделении отключается. \nМанипуляторы продолжают работать как обычно (то есть могут как обычно брать и класть предметы).
angels-alien-fish-1-raw=Наименее смертоносная рыба этой чужой планеты.
angels-alien-fish-2-raw=Не замечают ничего вокруг, очень неприхотливые существа.
angels-alien-fish-3-raw=На первый взгляд милые рыбки, но лучше их не злить.
angels-bio-raw-meat=На вкус как курица...
angels-bio-tile=Усиливает естественное поглощение загрязнения почвой, уменьшая облако загрязнения на базе. Слегка повышает скорость бега и отлично подходит для покрытия территории вокруг базы.\n[font=default-semibold][color=1,0.9,0.75]Поглощение загрязнения:[/color][/font] __1__ /с
angels-crop-farm-processed=Сельскохозяйственный продукт, получаемый из:
angels-desert-1=Сладкое. Согревает душу.
angels-desert-2=Организованное. Растёт ровными рядами.
angels-desert-3=Продуктивное. Всегда выстраивается ровными рядами.
angels-desert-4=Рьяное. Всегда в движении.
angels-desert-5=Солёное. Обращаться осторожно.
angels-sea-pump=Береговой насос с приводом, повышающий производительность откачки жидкости из водоёма.
angels-solid-saw=«Он пилил, он резал, он крушил».
angels-swamp-1=Ореховое. Слегка сводит с ума.
angels-swamp-2=Живучее. Растёт вопреки любым условиям.
angels-swamp-3=Властное. Не переусердствуйте.
angels-swamp-4=Двоичное. Растёт или нет — третьего не дано.
angels-swamp-5=Острое. Кажется, кричит на вас.
angels-temperate-1=Дикое. Растение оттуда, где не ступала нога человека.
angels-temperate-2=Пушистое. Так и тянет в постель.
angels-temperate-3=Кислое. Лучше всего в остром соусе.
angels-temperate-4=Приспособляемое. Годится для самых разных целей.
angels-temperate-5=Вкусное. Богатая палитра вкусов.
assembly-robot=Сборочный робот, рассчитанный на суровые условия космоса. Используется в сборочном компоненте сухого дока.
astrometrics=Астрометрическая лаборатория выполняет расчёты небесных тел, необходимые для безопасной навигации на сверхсветовых скоростях. [Поместите в ракетную шахту для запуска в космос]
bi-dart-rifle=Дешёвое оружие с легко производимыми боеприпасами, хорошо подходит против слабых противников.
big-burner-generator=Сжигает топливо для выработки электроэнергии.
burner-generator=Топливный генератор для выработки электроэнергии без воды
clowns-sluicer=Сюда можно совать пальцы. Отделяет руду от песка
clowns-sluicer-2=Сюда можно совать пальцы. Отделяет руду от песка
coal=Он вам понадобится!
command=Центр управления космическим кораблём, обычно называемый мостиком. [Поместите в ракетную шахту для запуска в космос]
drydock-assembly=Командный модуль, отвечающий за сборку компонентов космического корабля. [Поместите в ракетную шахту для запуска в космос]
drydock-structural=Каркас сухого дока, удерживающий космический корабль во время сборки. [Поместите в ракетную шахту для запуска в космос]
electric-steel-furnace=Электрическая версия стальной печи. Медленнее, но не требует топлива.
equipment-bot-chip-feeder=Аварийная аптечка: автоматически использует лечебные предметы при низком здоровье, у каждого чипа перезарядка 2 минуты. Требует персональную дронстанцию.
equipment-bot-chip-items=Настраивает персональные дронстанции на автоматическую пометку предметов на земле для подбора. Нужна сеть со свободными дронами. Предметы не помечаются, если рядом враги.
equipment-bot-chip-launcher=Настраивает персональные дронстанции на автоматический запуск боевых единиц из инвентаря, когда враги в зоне досягаемости. Требует персональную дронстанцию.
equipment-bot-chip-trees=Настраивает персональные дронстанции на автоматическую пометку деревьев в радиусе на снос. Нужна сеть со свободными дронами. Деревья не помечаются, если рядом враги.
ftl-drive=Высокотехнологичное волшебство, делающее возможными путешествия к звёздам. [Поместите в ракетную шахту для запуска в космос]
fuel-cell=Топливный элемент для двигателей космического корабля. [Поместите в ракетную шахту для запуска в космос]
fusion-reactor=Основной источник энергии космического корабля. [Поместите в ракетную шахту для запуска в космос]
habitation=Жилые помещения космического корабля. [Поместите в ракетную шахту для запуска в космос]
hull-component=Секция корпуса космического корабля. [Поместите в ракетную шахту для запуска в космос]
life-support=Система жизнеобеспечения, включая переработку кислорода, воды, пищи и т. д. [Поместите в ракетную шахту для запуска в космос]
ln-flare-capsule=Расходуемый источник света, бросается для освещения.
offshore-mk0-pump=Качает жидкость с прибрежной зоны.\n[font=default-bold][color=#f5cb48][img=tooltip-category-electricity]Потребляет горючее топливо[/color][/font]\n[font=default-semibold][color=#e4cead]Макс. потребление:[/color][/font] 900 КВт
offshore-mk3-pump=Качает жидкость с прибрежной зоны.\n[font=default-bold][color=#f5cb48][img=tooltip-category-electricity]Потребляет электричество[/color][/font]\n[font=default-semibold][color=#e4cead]Макс. потребление:[/color][/font] 2.89 МВт
offshore-mk4-pump=Качает жидкость с прибрежной зоны.\n[font=default-bold][color=#f5cb48][img=tooltip-category-electricity]Потребляет электричество[/color][/font]\n[font=default-semibold][color=#e4cead]Макс. потребление:[/color][/font] 3.72 МВт
offshore-pump=Качает жидкость с прибрежной зоны.\n[font=default-bold][color=#f5cb48][img=tooltip-category-electricity]Потребляет электричество[/color][/font]\n[font=default-semibold][color=#e4cead]Макс. потребление:[/color][/font] 1.2 МВт
protection-field=Силовое поле, создаваемое космическим кораблём. [Поместите в ракетную шахту для запуска в космос]
space-thruster=Маневровые двигатели обеспечивают кораблю базовое досветовое маневрирование. [Поместите в ракетную шахту для запуска в космос]
spacex-combinator=Комбинатор, выдающий сигнал с компонентами, нужными для завершения текущего этапа SpaceX, и сигнал номера этапа.
spacex-combinator-stage=Комбинатор, выдающий только сигнал номера этапа.
w93-modular-turret-base=Фронтовые лафеты устойчивы к урону, а установленное оружие сосредотачивает огонь на целях прямо перед турелью.\n\nЗащита — высокая\nСектор обстрела — узкий\nДальность — стандартная\nПоле поражения — длинное\nСкорость наведения — низкая
w93-modular-turret2-base=Тыловые лафеты имеют широкий сектор обстрела и быстрее наводятся на цели.\n\nЗащита — низкая\nСектор обстрела — широкий\nДальность — увеличенная\nПоле поражения — короткое\nСкорость наведения — высокая
w93-plaser-turret=Сектор обстрела: 60°\nСкорость наведения: 43.2 °/с
w93-plaser-turret2=Сектор обстрела: 120°\nСкорость наведения: 64.8 °/с
w93-scattergun-turret=Требуется прямая видимость цели.\n\nСектор обстрела: 120°\nСкорость наведения: 162 °/с
wood=Стройте энергетику на этом возобновляемом ресурсе!\nОбратите внимание: его можно использовать не только как топливо!
zcs-trash-landfill=Большая свалка. Помещённые внутрь предметы периодически уничтожаются с выделением загрязнения.

