[mod-name]
Fluid-level-indicator=Fluid Level Indicator (Индикатор уровня жидкости)

[mod-description]
Fluid-level-indicator=Индикатор уровня жидкости — цифровое табло, встраиваемое в трубопровод.\n\nСтавится на трубу вместо её участка и прямо на карте показывает числом, сколько жидкости или газа в этом месте системы, а в режиме потока — сколько проходит в секунду. Есть обычный и прямой вариант (соединяется только с двух сторон), а также стальная версия. Удобно, чтобы с первого взгляда видеть, где пустеет нефтепровод или кончается вода, не открывая каждую трубу.