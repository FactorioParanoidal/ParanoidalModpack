[mod-setting-description]
rcalc-default-timescale=[img=utility/clock] Выбирает исходные единицы нового окна Rate Calculator: в секунду, минуту, час либо в количестве конвейеров или манипуляторов, необходимых для такого потока предметов. Единицы можно затем сменить в самом окне; скорость реальных машин не меняется.\n[color=#9cdcfe]По умолчанию: В секунду. Только для вас.[/color]
rcalc-show-completion-checkboxes=[img=utility/check_mark] Добавляет к строкам расчёта флажки для ваших собственных отметок о готовности. Они помогают вести список работ, но не выключают машины и не исключают помеченные строки из расчёта.\n[color=#9cdcfe]По умолчанию: флажок снят. Только для вас.[/color]
rcalc-show-intermediate-breakdowns=[item=assembling-machine-2] Показывает для промежуточных продуктов отдельные значения производства и потребления рядом с итоговым балансом. Так видно, откуда берётся нехватка или избыток; отключение скрывает только подробности, не меняя расчёт.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
rcalc-show-pollution=[item=chemical-plant] Добавляет загрязнение к результатам Rate Calculator для выбранных машин. Это расчётный поток выбросов, а не показ всего облака загрязнения на карте; сама настройка выбросы не меняет.\n[color=#9cdcfe]По умолчанию: флажок снят. Только для вас.[/color]
