[mod-setting-description]
rcalc-default-timescale=[img=utility/clock] Chooses the initial units for a new Rate Calculator window: per second, minute, hour, or the equivalent belts or inserters needed for that item flow. You can change units in the window afterward; actual machine speed is unchanged.\n[color=#9cdcfe]Default: Per second. Personal setting.[/color]
rcalc-show-completion-checkboxes=[img=utility/check_mark] Adds checkboxes beside calculated rows for your own completion notes. They help track work but do not turn off machines or exclude checked rows from the calculation.\n[color=#9cdcfe]Default: checkbox unchecked. Personal setting.[/color]
rcalc-show-intermediate-breakdowns=[item=assembling-machine-2] Shows separate production and consumption values for intermediate products alongside their net balance. This helps explain shortages or surpluses; disabling hides the breakdown without changing calculations.\n[color=#9cdcfe]Default: checkbox checked. Personal setting.[/color]
rcalc-show-pollution=[item=chemical-plant] Includes pollution in Rate Calculator results for the selected machines. This is a calculated emission rate, not a measurement of the map’s entire pollution cloud; the setting does not change emissions.\n[color=#9cdcfe]Default: checkbox unchecked. Personal setting.[/color]
