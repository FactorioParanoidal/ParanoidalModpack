[mod-setting-description]
WideChests_mergeable-chest-iron-chest=[item=iron-chest] Selects allowed merged shapes for iron chests: chest allows long rows, warehouse rectangular warehouses, and trashdump larger alternate-style storage. Combined choices allow several shapes; none disables merging for this material. Merger size limits still apply.\n[color=#9cdcfe]Default: None. Requires a game restart.[/color]
WideChests_mergeable-chest-steel-chest=[item=steel-chest] Selects allowed merged shapes for steel chests: chest allows long rows, warehouse rectangular warehouses, and trashdump larger alternate-style storage. Combined choices allow several shapes; none disables merging for this material. Merger size limits still apply.\n[color=#9cdcfe]Default: All. Requires a game restart.[/color]
WideChests_mergeable-chest-wooden-chest=[item=wooden-chest] Selects allowed merged shapes for wooden chests: chest allows long rows, warehouse rectangular warehouses, and trashdump larger alternate-style storage. Combined choices allow several shapes; none disables merging for this material. Merger size limits still apply.\n[color=#9cdcfe]Default: None. Requires a game restart.[/color]
