[mod-setting-description]
WideChests_mergeable-chest-iron-chest=[item=iron-chest] Выбирает допустимые формы объединения железных сундуков: chest — длинные ряды, warehouse — прямоугольные склады, trashdump — крупные хранилища другого вида. Составные варианты разрешают несколько форм, none отключает объединение этого материала. Фактические размеры ограничены настройками объединителя.\n[color=#9cdcfe]По умолчанию: Нет. После перезапуска игры.[/color]
WideChests_mergeable-chest-steel-chest=[item=steel-chest] Выбирает допустимые формы объединения стальных сундуков: chest — длинные ряды, warehouse — прямоугольные склады, trashdump — крупные хранилища другого вида. Составные варианты разрешают несколько форм, none отключает объединение этого материала. Фактические размеры ограничены настройками объединителя.\n[color=#9cdcfe]По умолчанию: Все. После перезапуска игры.[/color]
WideChests_mergeable-chest-wooden-chest=[item=wooden-chest] Выбирает допустимые формы объединения деревянных сундуков: chest — длинные ряды, warehouse — прямоугольные склады, trashdump — крупные хранилища другого вида. Составные варианты разрешают несколько форм, none отключает объединение этого материала. Фактические размеры ограничены настройками объединителя.\n[color=#9cdcfe]По умолчанию: Нет. После перезапуска игры.[/color]
