[mod-name]
fluid-memory-storage=Fluid Memory Storage (Ёмкость материопамяти)

[mod-description]
fluid-memory-storage=Ёмкость материопамяти — бездонный резервуар для одной жидкости или газа.\n\n— Вмещает неограниченное количество одной жидкости: альтернатива факельным установкам и уничтожению излишков.\n— Чем больше хранится, тем больше энергии требует ёмкость (в сборке базовое потребление — 480 кВт); высокое качество снижает потребление.\n— Жидкость можно выбрать заранее в окне ёмкости, пустую — сбросить.\n— Комбинатор выдаёт количество в сеть сигналов.\n\nРазобранная ёмкость превращается в упакованный предмет с содержимым.

[entity-name]
fluid-memory-unit=Ёмкость материопамяти
fluid-memory-unit-combinator=Комбинатор ёмкости материопамяти

[entity-description]
fluid-memory-unit=Хранит в материопамяти неограниченное количество одной жидкости. При смешивании жидкости разной температуры сохраняется меньшая температура.\nПри разрушении всё содержимое теряется.
fluid-memory-unit-combinator=Передаёт в логическую сеть количество жидкости в ёмкости материопамяти. Сигнал не может превышать 2,1 млрд.

[technology-name]
fluid-memory-storage=Ёмкость материопамяти

[technology-description]
fluid-memory-storage=После исследования хранилищ материопамяти для предметов остро встал вопрос о таких же бесконечных хранилищах для жидкостей! Ёмкости материопамяти смогут хранить БЕСКОНЕЧНОЕ количество одной жидкости за счёт невероятной упаковки атомов ценой всё возрастающих энергозатрат для поддержания стабильности их структуры. Удалось даже уменьшить размер хранилища!

[item-name]
fluid-memory-unit-with-tags=Ёмкость материопамяти (упакованная)

[item-description]
fluid-memory-unit-with-tags=Ёмкость материопамяти с содержимым.\nСодержит __1__ [fluid=__2__] при __3__ °C.

[mod-setting-name]
memory-unit-power-usage=Энергопотребление материопамяти

[mod-setting-description]
memory-unit-power-usage=Множитель энергопотребления хранилищ и ёмкостей материопамяти. Формула: [font=default-small](1 МВт + ceil(количество / размер стака) ^ 0,35 × множитель) × коэффициент качества[/font]\nДля жидкостей размер стака равен 1000.\nКоэффициент качества: 1 у обычного качества, по параболе снижается до 0,2 у высшего.\nПо умолчанию в Paranoidal: 480 кВт.

[mod-gui]
fluid-temperature=[font=default-semibold][color=255,230,192]Температура:[/color][/font] __1__ °C
select-fluid=Выбрать жидкость заранее, до её поступления
reset-fluid=[font=default-semibold][color=255,230,192]Сбросить[/color][/font]\nОтвязать пустую ёмкость материопамяти от жидкости, чтобы хранить в ней другую.
migrated-fluid=__1__ × __2__: жидкость удалена при обновлении. Ёмкость материопамяти теперь пуста.
exact-amount=Точно: __1__
quality-power-discount=Качество снижает энергопотребление на __1__%

[big-numbers]
1=__1__
2=__1__ тыс.
3=__1__ млн
4=__1__ млрд
5=__1__ трлн
6=__1__ квадрлн
7=__1__ квинтлн
infinity=Бесконечность
