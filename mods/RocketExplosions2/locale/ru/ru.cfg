[technology-name]
rocket-failure-revision=Усовершенствование конструкции ракеты

[technology-description]
rocket-failure-revision=Дополнительные исследования в ракетостроении: каждый уровень снижает риск аварии при всех последующих запусках из любой шахты. Шесть уровней уменьшают исследовательскую часть риска в 10 раз; с 7-го уровня исследование бесконечное.

[re2-effect]
revision=Исследовательская часть риска запуска ×«Фактор исследований» за уровень (по умолчанию ×0,68)

[mod-setting-name]
re-default-failure-chance=Изначальный риск взрыва, %
re-research-factor=Фактор исследований, %
re-launch-factor=Фактор запусков, %
re-failure-experience=Опыт от неудачного запуска, %
re-silo-bonus=Опыт шахты за успешный запуск, %
re-quality-bonus=Надёжность за ступень качества шахты, %
re-label-alt-mode=Надёжность над шахтами только в альт-режиме

[mod-setting-description]
re-default-failure-chance=Риск самого первого запуска: ни исследований, ни запусков.
re-research-factor=Каждый изученный уровень «Усовершенствования конструкции ракеты» умножает исследовательскую часть риска на это значение. По умолчанию шесть уровней уменьшают её в 10 раз.
re-launch-factor=Каждое очко опыта силы умножает часть риска от запусков на это значение. По умолчанию 20 очков уменьшают её в 10 раз.
re-failure-experience=Неудачный запуск засчитывается в опыт силы как такая доля успешного.
re-silo-bonus=Каждый успешный запуск с места умножает шанс успеха запусков оттуда на 1 + это значение. Сохраняется, когда шахта откатывается на этап стройки и достраивается на том же месте.
re-quality-bonus=Процентные пункты шанса успеха за каждую ступень качества шахты выше обычного. Шанс успеха может дойти до 100%.
re-label-alt-mode=Показывать надёжность запуска над ракетными шахтами только в альт-режиме.

[re2-label]
reliability=Надёжность запуска: __1__

