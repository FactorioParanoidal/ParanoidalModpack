success=Шанс успеха
failure=Риск аварии
outcomes=Если авария
outcomes-value=☢ __1__, взрыв __2__, крушение __3__
outcomes-tooltip=Ядерный или большой взрыв откатывает шахту на 4-й этап стройки и выбрасывает её модули на землю; при крушении ракеты шахта остаётся. В любом случае у шахты или стройки остаётся 2–15% прочности; она неуязвима, пока в 16 клетках горит огонь (не дольше 10 минут), а пожары вокруг нужно тушить. Первая авария силы всегда ядерная; с каждой аварией тяжёлые исходы реже.
footer=Гарантия запуска BnL™: остаточный риск покрывает полис «BnL Life & Crash», дело №A113-7 (пункт 12.7: не покрывается).
footer-perfect=Брак этой шахты устранён. Заслуга целиком принадлежит BnL.

