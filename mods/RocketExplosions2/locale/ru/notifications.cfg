[mod-setting-name]
re-success-messages=Сообщения об обычных успешных запусках

[mod-setting-description]
re-success-messages=Показывать обычные успешные запуски, пока надёжность шахты ниже 100%. По умолчанию выключено. Аварии, первый успешный запуск колонии и достижение шахтой 100% надёжности объявляются всегда. Меняет только ваши сообщения, а не исходы запусков или надёжность.
