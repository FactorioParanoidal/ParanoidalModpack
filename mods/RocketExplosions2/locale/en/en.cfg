[technology-name]
rocket-failure-revision=Rocket failure revision

[technology-description]
rocket-failure-revision=Additional research in rocketry: every level lowers the risk of a launch failure for all later launches of every silo. Six levels cut the research part of the risk tenfold; level 7 and above can be researched endlessly.

[re2-effect]
revision=Research part of the launch risk ×Research factor per level (×0.68 by default)

[mod-setting-name]
re-default-failure-chance=Default failure chance, %
re-research-factor=Research factor, %
re-launch-factor=Launch factor, %
re-failure-experience=Experience from a failed launch, %
re-silo-bonus=Silo experience per successful launch, %
re-quality-bonus=Success per quality step of the silo, %
re-label-alt-mode=Launch reliability over silos only in alt mode

[mod-setting-description]
re-default-failure-chance=Risk of the very first launch: no research, no launches yet.
re-research-factor=Each researched level of Rocket failure revision multiplies the research part of the risk by this value. Default: six levels make it ten times smaller.
re-launch-factor=Each point of experience of the force multiplies the launch part of the risk by this value. Default: 20 points make it ten times smaller.
re-failure-experience=A failed launch counts as this share of a successful one in the experience of the force.
re-silo-bonus=Each successful launch from a place multiplies the success chance of launches there by 1 + this value. Kept when the silo is thrown back to a construction site and rebuilt in the same place.
re-quality-bonus=Percentage points added to the success chance for each quality step of the silo above normal. The success chance can reach 100%.
re-label-alt-mode=Show the launch reliability label over rocket silos only in alt mode.

[re2-label]
reliability=Launch reliability: __1__

