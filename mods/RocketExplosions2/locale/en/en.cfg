outcomes-tooltip=A nuclear or big explosion throws the silo back to stage 4 of construction and its modules out on the ground; an accident leaves it standing. In every case the silo or site keeps 2-15% of its health and cannot be damaged until the fires within 16 tiles are out (at most 10 minutes); the fires around have to be put out. The first failure of a force is always nuclear; every failure makes the heavy outcomes rarer.
