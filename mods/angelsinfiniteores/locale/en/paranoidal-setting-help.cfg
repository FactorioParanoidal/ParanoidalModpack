[mod-setting-description]
angels-enablefluidreq=[img=utility/fluid_icon] Enables Angels’ defined fluid requirements for infinite-resource mining. Affected ores need the specified fluid supplied to drills; not every ore gains a fluid requirement. Uranium acid requirements also have a separate control.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
angels-infinite-yield=[item=electric-mining-drill] Sets the minimum remaining yield of infinite ore as a percentage of its normal yield. For example, 10 means a 10% yield floor, not ten items per mining cycle. Higher values improve depleted-deposit output; result probability is controlled separately.\n[color=#9cdcfe]Default: 1. Range: 1–100. Requires a game restart.[/color]
angels-keepuranacid=[fluid=sulfuric-acid] Keeps acid required for ordinary and infinite uranium ore even when the general fluid switch is off. Turning this off removes that separate override; other enabled mining-fluid rules may still require acid.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
angels-lower-infinite-yield=[item=electric-mining-drill] Sets the probability of receiving an ore item from a mining result: 1 means 100%, 0.1 means 10%. Lowering it reduces average output even at the same deposit yield. It is separate from the minimum remaining-yield setting.\n[color=#9cdcfe]Default: 1. Range: 0.1–1. Requires a game restart.[/color]
