[mod-setting-description]
angels-enablefluidreq=[img=utility/fluid_icon] Включает предусмотренные Angels требования к жидкости при добыче бесконечных ресурсов. Для таких руд придётся подвести нужную жидкость к бурам; не каждая руда получает это требование. Кислота для урана регулируется также отдельной настройкой.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
angels-infinite-yield=[item=electric-mining-drill] Задаёт минимальную остаточную отдачу бесконечной руды, в процентах от её нормальной отдачи. Например, 10 означает нижний предел 10%, а не десять предметов за цикл. Выше значение — быстрее добыча после истощения богатой части; вероятность результата регулируется отдельно.\n[color=#9cdcfe]По умолчанию: 1. Диапазон: 1–100. После перезапуска игры.[/color]
angels-keepuranacid=[fluid=sulfuric-acid] Сохраняет требование кислоты для обычной и бесконечной урановой руды, даже если общий переключатель жидкостей выключен. Выключение снимает это отдельное принудительное требование; другие включённые правила добычи с жидкостью всё ещё могут требовать её.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
angels-lower-infinite-yield=[item=electric-mining-drill] Задаёт вероятность получить единицу руды за один результат добычи: 1 — 100%, 0,1 — 10%. Уменьшение снижает средний выход даже при том же проценте отдачи месторождения. Это отдельный множитель результата, а не новый минимум остаточной отдачи.\n[color=#9cdcfe]По умолчанию: 1. Диапазон: 0,1–1. После перезапуска игры.[/color]
