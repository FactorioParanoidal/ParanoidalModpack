[entity-description]
ic-refine-workshop=Improves defective products. Needs repair packs and electricity.\nOne attempt: 90% better quality (never above standard), 10% unchanged. The item always leaves.\nDoes not accept armor with equipment slots or vehicles. Accepts armor without equipment slots.
ic-control-post=Raises the quality of products. Choose a product and the quality you need, then feed it standard products: the post merges 5 alike into 1 better one until it reaches the ordered quality. Finished products come out at the green arrow. Runs on small alien artifacts.

