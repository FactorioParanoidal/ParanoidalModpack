[item-description]
ic-refine-workshop-drive=Internal item: the workshop runs on electricity, repair packs are consumed while refining.

[entity-description]
ic-refine-workshop=Refines defective products up to standard quality. Insert an item and repair packs: the workshop recognises the item by itself and drains the packs gradually, like a lab drains science. One attempt: 90% one grade better (plus 10% for every further grade), 10% unchanged. The item stays inside until it is standard, as long as there are packs.
ic-control-post=Accepts a batch for an order and sorts products to three outputs: forward - accepted, left - to refinement, right - everything else. The rotate key turns the output arrows; the building itself does not change.

