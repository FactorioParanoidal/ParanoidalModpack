[mod-setting-name]

ic-more-qualities-mode=Quality Mode
ic-more-qualities-multiplier=Quality effect multiplier
ic-more-qualities-chance-to-upgrade=Chance for higher quality
ic-more-qualities-chance-dynamic-bonus=Dynamic bonus for better chances
ic-more-qualities-early-quality=Early unlocking of first qualities
ic-more-qualities-localization-full=Custom quality name for: All
ic-more-qualities-localization-only-expand=Custom quality name for: Old style
ic-more-qualities-localization-rework=Custom quality name for: New style

[mod-setting-description]

ic-more-qualities-mode=Change the way qualities work. I do not recommend changing on a played map.
ic-more-qualities-multiplier=Quality effect multiplier. Range: 0.1 - 1000. Where a value lower than 1 is a degradation of quality.
ic-more-qualities-chance-to-upgrade=Percentage chance for a higher quality level. For example, a value of 0.1 is 10%. Range: 0.001 - 1.0
ic-more-qualities-chance-dynamic-bonus=Bonus is added or subtracted from the current chance of a higher quality multiplied by the quality tier. A high positive bonus can skip qualities! A negative one dynamically reduces the chance of a higher quality. Example: Legendary is tier 4, so bonus * 4 + percentage chance. 0 is disabled.
ic-more-qualities-early-quality=Researching quality modules and unlocking qualities will be earlier, and the modules will not require oil.
ic-more-qualities-localization-full=Format is: [font=default-bold]quality_code=custom_name, ...[/font]. A nil value means that the default name is used.
ic-more-qualities-localization-only-expand=Format is: [font=default-bold]quality_code=custom_name, ...[/font]. A nil value means that the default name is used.
ic-more-qualities-localization-rework=Format is: [font=default-bold]quality_code=custom_name, ...[/font]. A nil value means that the default name is used.

[string-mod-setting]

ic-more-qualities-mode-full=All (40 Q)
ic-more-qualities-mode-only-expand=Old style (9 Q)
ic-more-qualities-mode-rework=New style (10 Q)

[string-mod-setting-description]

ic-more-qualities-mode-full=Contains all qualities (possibly extreme in quantity and effectiveness of the last qualities). Recommended with other mods or high chance of higher quality.
ic-more-qualities-mode-only-expand=Only add a few new qualities after the legendary quality with a similar efficiency ratio.
ic-more-qualities-mode-rework=Modify the existing quality icons and add several new ones after the legendary quality.

