[mod-setting-name]

ic-more-qualities-multiplier=Quality effect multiplier
ic-more-qualities-chance-to-upgrade=Chance for higher quality
ic-more-qualities-chance-dynamic-bonus=Dynamic bonus for better chances

[mod-setting-description]

ic-more-qualities-multiplier=Quality effect multiplier. Range: 0.1 - 1000. Where a value lower than 1 is a degradation of quality.
ic-more-qualities-chance-to-upgrade=Percentage chance for a higher quality level. For example, a value of 0.1 is 10%. Range: 0.001 - 1.0
ic-more-qualities-chance-dynamic-bonus=Bonus is added or subtracted from the current chance of a higher quality multiplied by the quality tier. A high positive bonus can skip qualities! A negative one dynamically reduces the chance of a higher quality. Example: Legendary is tier 4, so bonus * 4 + percentage chance. 0 is disabled.

