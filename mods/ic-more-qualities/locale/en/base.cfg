[mod-setting-name]

ic-more-qualities-multiplier=Quality effect multiplier
ic-more-qualities-chance-to-upgrade=Chance for higher quality
ic-more-qualities-chance-dynamic-bonus=Dynamic bonus for better chances

[mod-setting-description]

ic-more-qualities-multiplier=Multiplier for positive qualities' internal numeric level, range 0.01–1000. The product is rounded down. Values below 1 reduce that level and its linked bonuses, but do not turn an item into a defect. Several modpack bonuses have separate caps, so this is not a direct multiplier for every property.
ic-more-qualities-chance-to-upgrade=Percentage chance for a higher quality level. For example, a value of 0.1 is 10%. Range: 0.001 - 1.0
ic-more-qualities-chance-dynamic-bonus=Change in transition chance for each successive positive tier when the quality set is created. For example, base 0.2 and step −0.004 give the first tiers 20%, 19.6%, 19.2%, and so on; normal gets 20.4%. This does not accumulate after each craft or multiply by the engine's numeric quality level. Capped above at 100%; a large positive step makes multi-tier jumps easier, while an excessive negative step can produce out-of-range chances. 0 disables the step, not quality itself.

