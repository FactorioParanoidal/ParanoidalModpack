[mod-setting-description]
ic-more-qualities-quality=Off: a game without quality and without defects, as if this mod were disabled. No new qualities, quality modules and their research are hidden, recipes that needed a quality module no longer use it. New game only: switching it in a started game may lose items of removed qualities.
ic-more-qualities-defects-weapons=On: weapons, ammo and turrets (including artillery) get defects like other finished products. Off (default): they are never below standard quality; positive quality from modules is kept.
ic-more-qualities-quality-everywhere=Quality modules work in every assembler, furnace and drill with module slots. Raw resources, ores, components and intermediates can get positive quality. Defects still apply to finished products only. Off: raw resources and components are always standard.
ic-more-qualities-defects-preview=Needs "Paranoidal: quality". Off: no defects, quality-control research, workshop, control post or production modes; quality modules stay. Experimental: use a separate test game only! Handcrafting, machines and drills/pumpjacks are connected. Defects apply to finished products, not raw resources or intermediates. Their positive quality depends on the separate quality-for-all-production switch. Machine cycles lasting two ticks or less are skipped. Productivity and resource depletion use approximations; item safety and loading of this version are NOT engine-verified. Do not disable in saves containing new qualities: items may be lost.
ic-more-qualities-defects-ingredient-mode=Materials (default): raw resources, intermediates, pipes, tiles and rails receive no new defects. Buildings and inserters may be defective unless separately exempt; Paranoidal separately exempts belts, underground belts, splitters and loaders. IMPORTANT: all item ingredients of a recipe require matching quality—a defective building cannot be mixed with normal components. The other two modes exempt additional finished ingredient products. New intermediate results are normalized; with quality for all production enabled, positive quality is retained. Existing stockpiles are not recreated en masse.
ic-more-qualities-defects-pole-supply-reduction=Radius (not diameter) reduction in tiles at −5 relative to standard. At −4 through −1: 4/5 through 1/5 of this amount. Default: 0.5. All pole bases shrink, with a compensating bonus for standard and positive qualities. Bases smaller than the reduction are clamped to zero: standard technical poles may gain unwanted coverage! For example, zero-radius Factorissimo connectors gain 0.5. Set to 0 to disable this change.
ic-more-qualities-defects-pole-wire-reduction=Wire reach reduction in tiles at −5 relative to standard. At −4 through −1: 4/5 through 1/5 of this amount. Default: 1. All pole bases shrink, with a compensating bonus for standard and positive qualities. Bases smaller than the reduction are clamped: standard technical poles may gain unwanted reach. Clamped poles are listed in the log. Set to 0 to disable this change.
ic-more-qualities-post-operations-per-material=Number of post-processing operations (5 products → 1) paid for by one small alien artifact. Default: 4. An artifact is consumed when prepaid operations run out; without one the post waits. If the artifact item itself is absent from the mod set, artifact payment is disabled. This setting does not change the 5:1 product ratio.
ic-more-qualities-defects-look-layer=Where the darkening is drawn. Building layer (default): together with the buildings. Above buildings: if the darkening is not visible with the default; it may then also darken the parts of a neighbouring building in front of it. Temporary setting for the check.

