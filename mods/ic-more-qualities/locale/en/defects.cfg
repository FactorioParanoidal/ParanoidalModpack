[mod-setting-name]
ic-more-qualities-quality=Paranoidal: quality
ic-more-qualities-defects-weapons=Paranoidal: defects for weapons and ammo
ic-more-qualities-quality-everywhere=Paranoidal: quality for all production
ic-more-qualities-defects-preview=Paranoidal: production defects
ic-more-qualities-defects-ingredient-mode=Paranoidal: exclude ingredient products from defects
ic-more-qualities-defects-pole-supply-reduction=Paranoidal: pole supply radius reduction at −5
ic-more-qualities-defects-pole-wire-reduction=Paranoidal: pole wire reach reduction at −5

[mod-setting-description]
ic-more-qualities-quality=Off: a game without quality and without defects, as if this mod were disabled. No new qualities, quality modules and their research are hidden, recipes that needed a quality module no longer use it. New game only: switching it in a started game may lose items of removed qualities.
ic-more-qualities-defects-weapons=On: weapons, ammo and turrets (including artillery) get defects like other finished products. Off (default): they are never below standard quality; positive quality from modules is kept.
ic-more-qualities-quality-everywhere=Quality modules work in every assembler, furnace and drill with module slots. Raw resources, ores, components and intermediates can get positive quality. Defects still apply to finished products only. Off: raw resources and components are always standard.
ic-more-qualities-defects-preview=Needs "Paranoidal: quality". Off: no defects, quality-control research, workshop, control post or production modes; quality modules stay. Experimental: use a separate test game only! Handcrafting, machines and drills/pumpjacks are connected. Defects apply to finished products; resources and intermediates are intended to stay standard. Machine cycles lasting two ticks or less are skipped. Productivity and resource depletion use approximations; item safety and loading of this version are NOT engine-verified. Do not disable in saves containing new qualities: items may be lost.
ic-more-qualities-defects-ingredient-mode=Materials (default): excludes resources, intermediates, pipes, tiles and rails; buildings, belts and inserters can still be defective. IMPORTANT: all item ingredients of a recipe require matching quality. A defective building cannot be combined with white components to craft the next tier. The other modes exempt additional ingredient products. Handlers normalize new intermediate results to standard quality; existing stockpiles are unchanged.
ic-more-qualities-defects-pole-supply-reduction=Radius (not diameter) reduction in tiles at −5 relative to standard. At −4 through −1: 4/5 through 1/5 of this amount. Default: 0.5. All pole bases shrink, with a compensating bonus for standard and positive qualities. Bases smaller than the reduction are clamped to zero: standard technical poles may gain unwanted coverage! For example, zero-radius Factorissimo connectors gain 0.5. Set to 0 to disable this change.
ic-more-qualities-defects-pole-wire-reduction=Wire reach reduction in tiles at −5 relative to standard. At −4 through −1: 4/5 through 1/5 of this amount. Default: 1. All pole bases shrink, with a compensating bonus for standard and positive qualities. Bases smaller than the reduction are clamped: standard technical poles may gain unwanted reach. Clamped poles are listed in the log. Set to 0 to disable this change.

[string-mod-setting]
ic-more-qualities-defects-ingredient-mode-materials=Materials only (buildings and belts can be defective)
ic-more-qualities-defects-ingredient-mode-intermediate-ingredients=Also intermediate/science ingredients (including chains)
ic-more-qualities-defects-ingredient-mode-all-ingredients=All recipe ingredients except recycling

[quality-name]
ic-defect-5=−5: Defective
ic-defect-4=−4: Flawed
ic-defect-3=−3: Poor
ic-defect-2=−2: Unsatisfactory
ic-defect-1=−1: Substandard

[quality-description]
ic-defect=Defective quality with reduced supported statistics. Intended for finished products, not resources or intermediates. Belt speed and underground belt distance are unchanged. Research reduces new defects without repairing existing items. Experimental: actual statistics and quality ordering require engine verification.

[technology-name]
ic-defect-control=Quality control __1__

[technology-description]
ic-defect-control-preview=Each level lowers the chance of defects for new products. At level 10 there are no more defects, and quality modules and the logistic science pack unlock. Items already made are not repaired.

[ic-defects]
drill-speed=Defective items are less effective.
drill-drain=Deposit drain (by quality)
drill-drain-quality=Defects deplete resources faster (×2 to ×6), higher qualities slower.
control-effect=Fewer defects (level __1__ of 10)
skipped-result=Defects: left result __1__ unchanged to preserve its data (__2__).
skipped-machine=Defects: skipped machine __1__ (__2__).
machine-unsupported-speed=Defects: __1__ completes a cycle in two ticks or less. This machine/drill is skipped; full handling at these speeds is not implemented.
machine-missed-cycle=Defects: detected a mining cycle change in __1__ before handling. The slowdown of that cycle is unconfirmed; output items are not removed retroactively.
