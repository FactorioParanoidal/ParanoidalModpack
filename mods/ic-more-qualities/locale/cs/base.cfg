[mod-setting-description]

ic-more-qualities-multiplier=Násobič efektu kvality. Rozmezí: 0.1 - 1000. Kde nižsí hodnota než 1 je degradace kvality.
ic-more-qualities-chance-to-upgrade=Procentuální šance na vyšší úroveň kvality. Například hodnota 0.1 je 10%. Rozmezí: 0.001 - 1.0
ic-more-qualities-chance-dynamic-bonus=Bonus se přičte nebo odečte k aktuální šanci na vyšší kvalitu vynásobený o tier kvality. Vysoký kladný bonus může preskakovat kvality! Záporný naopak dynamicky snižuje šanci na vyšší další kvality. Příklad: Legendární je tier 4, takže bonus * 4 + procentuální šance. 0 je vypnuto.

