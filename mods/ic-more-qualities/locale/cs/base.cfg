[string-mod-setting-description]

ic-more-qualities-mode-full=Obsahuje všechny kvality (možná extrém v množství i efektivitě posledních kvalit). Doporučeno s jinými módy nebo vysokou šancí na vyšší kvalitu.
ic-more-qualities-mode-only-expand=Pouze přidá pár nových kvalit po legendární kvalitě s podobným poměrem efektivity.
ic-more-qualities-mode-rework=Upraví stávající ikonky kvalit a přidá několik nových po legendární kvalitě.

