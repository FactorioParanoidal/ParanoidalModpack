[item-description]
ic-refine-workshop-drive=Служебный предмет: мастерская работает от электросети, а ремонтные наборы расходуются по мере доводки.

[entity-description]
ic-refine-workshop=Доводит бракованные изделия до обычного качества. Вставьте изделие и ремонтные наборы — мастерская сама распознаёт предмет и расходует ресурс наборов постепенно, как лаборатория науку. Одна попытка: 90% — на ступень лучше (и по 10% на каждую следующую), 10% — без изменений. Предмет остаётся внутри до обычного качества, пока есть наборы.
ic-control-post=Принимает партию по заказу и раскладывает изделия по трём выходам: вперёд — годные, влево — на доводку, вправо — прочее. Стрелки выходов поворачиваются клавишей поворота, само здание не меняется.

