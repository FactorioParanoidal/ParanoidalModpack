[entity-description]
ic-refine-workshop=Улучшает бракованные изделия. Нужны ремонтные наборы и электричество.\nОдна попытка: 90% — качество выше (не выше обычного), 10% — без изменений. Изделие всегда выходит наружу.\nНе принимает броню со слотами оборудования и технику. Броню без слотов принимает.
