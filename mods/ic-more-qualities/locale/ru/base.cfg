[mod-setting-name]

ic-more-qualities-multiplier=Множитель эффекта качества
ic-more-qualities-chance-to-upgrade=Шанс на повышение качества
ic-more-qualities-chance-dynamic-bonus=Динамический бонус на шанс повышения

[mod-setting-description]

ic-more-qualities-multiplier=Множитель внутреннего числового уровня положительных качеств, диапазон 0,01–1000. Произведение округляется вниз. Значение ниже 1 уменьшает этот уровень и связанные с ним бонусы, но не превращает изделие в брак. У ряда бонусов сборки есть отдельные пределы, поэтому это не прямой множитель всех характеристик.
ic-more-qualities-chance-to-upgrade=Процентный шанс для повышения предмета на более высокий уровень качества. Например, значение 0,1 составит 10%. Диапазон: 0,001 - 1,0
ic-more-qualities-chance-dynamic-bonus=Шаг изменения шанса перехода для каждой следующей положительной ступени при создании набора качеств. Например, при базовом шансе 0,2 и шаге −0,004 первые ступени получают 20%, 19,6%, 19,2% и так далее; обычное качество — 20,4%. Это не накопление после каждого крафта и не умножение на внутренний уровень качества. Верхняя граница — 100%; большой положительный шаг облегчает перескакивание ступеней, слишком отрицательный может вывести шансы за допустимые границы. 0 отключает шаг, но не само качество.
