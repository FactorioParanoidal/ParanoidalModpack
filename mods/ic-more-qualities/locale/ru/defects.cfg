[mod-setting-description]
ic-more-qualities-defects-weapons=Включено — оружие, боеприпасы и турели (включая артиллерию) получают брак, как другие готовые изделия. Выключено (по умолчанию) — они всегда выходят не хуже обычного качества; положительное качество от модулей сохраняется.
ic-more-qualities-quality-everywhere=Модули качества работают во всех автоматах, печах и бурах со слотами модулей. Сырьё, руда, детали и промежуточные продукты могут получать положительное качество. Брак по-прежнему только у готовых изделий. Выключено — сырьё и детали всегда обычные.
ic-more-qualities-initial-loss-percent=Шанс пустого результата до исследований: от 0 до 100%, по умолчанию 0% (потери выключены). Каждый уровень контроля качества убирает одну десятую исходного шанса, например 33 → 29.7 → … → 3.3 → 0%. Применяется к поддерживаемым обработчикам ручного крафта, машин, буров, качалок и добычи. Значение 0 отключает потери, но не отрицательное качество. Изменение действует при следующих бросках; уже назначенные потери и израсходованные ресурсы не отменяются. Настройка защиты готовых изделий и ограничения обработчиков сохраняются.
ic-more-qualities-defects-preview=Эксперимент для отдельной тестовой игры! Подключены ручной крафт, обработчики машин, буров, качалок и добычи природных объектов. Брак применяется к готовым изделиям; ресурсы и промежуточные продукты должны оставаться стандартными. Потери настраиваются: по умолчанию выключены (0%); при включении снижаются до 0% за десять исследований. Машинные циклы длительностью не более двух тиков пропускаются. Продуктивность, жидкости и расход залежей обработаны приближённо; сохранность и загрузка новой версии в движке НЕ подтверждены. Не выключайте в сохранении с новыми качествами: возможна потеря предметов.
ic-more-qualities-loss-exclude-finished=Защищает готовые изделия от потерь, но не от брака. По умолчанию включено. Действует при ручном крафте и в обработчике машин, если все предметные результаты рецепта — готовые изделия. Не защищает добычу, промежуточные и чисто жидкостные результаты. Начальный шанс потери задаётся отдельной настройкой (по умолчанию 0%) и линейно снижается до 0% за десять исследований. Промежуточные звенья ручной очереди сейчас защищаются отдельно. Старые запасы не конвертируются.
ic-more-qualities-defects-ingredient-mode=Материалы (по умолчанию): исключены ресурсы, промежуточные детали, трубы, покрытия и рельсы; здания, ленты и манипуляторы остаются с браком. ВАЖНО: рецепт требует одинакового качества всех предметных ингредиентов. Бракованное здание нельзя соединить с белыми деталями в рецепте следующего тира. Два более широких режима исключают дополнительные изделия-ингредиенты из брака. Новые промежуточные результаты обработчики нормализуют до стандартного качества; старые запасы не меняются.
ic-more-qualities-defects-pole-supply-reduction=Снижение радиуса (не диаметра) в клетках у −5 относительно стандарта. У −4…−1: 4/5…1/5 этого значения. По умолчанию 0.5. Базы всех столбов уменьшаются, стандарту и положительным качествам добавляется компенсация. Если исходный радиус меньше заданного снижения, он ограничивается нулём: стандартный технический столб может получить лишнее покрытие! Например, коннекторы Factorissimo с нулевым радиусом получат 0.5. Значение 0 отключает это изменение.
ic-more-qualities-defects-pole-wire-reduction=Снижение дальности сцепки в клетках у −5 относительно стандарта. У −4…−1: 4/5…1/5 этого значения. По умолчанию 1. Базы всех столбов уменьшаются, стандарту и положительным качествам добавляется компенсация. Если исходная дальность меньше заданного снижения, стандартный технический столб может получить лишнюю дальность. Ограниченные столбы перечисляются в логе. Значение 0 отключает это изменение.

[string-mod-setting]
ic-more-qualities-defects-ingredient-mode-materials=Только материалы (здания и ленты остаются с браком)
ic-more-qualities-defects-ingredient-mode-intermediate-ingredients=Также ингредиенты деталей и науки (включая цепочки)
ic-more-qualities-defects-ingredient-mode-all-ingredients=Все ингредиенты рецептов, кроме переработки

[quality-name]
ic-defect-5=−5: Бракованное
ic-defect-4=−4: Дефектное
ic-defect-3=−3: Низкокачественное
ic-defect-2=−2: Неудовлетворительное
ic-defect-1=−1: Нестандартное

[quality-description]
ic-defect=Брак с пониженными поддерживаемыми характеристиками. Предназначен для готовых изделий, не для ресурсов и промежуточных деталей. Скорость конвейеров и дальность подземных лент не меняются. Исследования уменьшают новый брак и потери, но не исправляют старые предметы. Эксперимент: реальные характеристики и порядок качеств требуют проверки в игре.

[technology-name]
ic-defect-control=Контроль качества __1__

[technology-description]
ic-defect-control-preview=Каждый уровень уменьшает шанс брака и потерь у новых изделий. На 10-м уровне брака и потерь больше нет, и открываются модули качества. Уже сделанные предметы не исправляются.

[ic-defects]
drill-speed=Бракованные вещи менее эффективны.
drill-drain=Расход месторождения (от качества)
drill-drain-quality=Брак истощает ресурсы быстрее (от ×2 до ×6), высокое качество — медленнее.
control-effect=Меньше брака и потерь (уровень __1__ из 10)
skipped-result=Брак: результат __1__ оставлен без изменения для сохранности данных (__2__).
skipped-machine=Брак: машинная обработка __1__ пропущена (__2__).
machine-unsupported-speed=Брак: __1__ завершает цикл не более чем за два тика. Обработка этой машины/бура пропущена; полная механика для таких скоростей пока не реализована.
machine-missed-craft=Брак: __1__ завершил крафт между проверками до обработки результата. Возможная причина — изменение скорости или состояния другим модом. Продукция задним числом не удаляется.
machine-missed-cycle=Брак: у __1__ обнаружена смена цикла добычи до обработки. Потери и замедление этого цикла не подтверждены; выданные предметы задним числом не удаляются.
