[mod-setting-name]
ruins-enemy-not-cease-fire=Hostile ruin defenses
ruins-avoid-repeats=Avoid repeating ruins
current-ruin-set=Ruin set
ruins-min-distance-from-spawn=Ruin-free zone around the map center
ruins-ignore-distance=Disable distance dependence of ruins
ruins-spawn-tick-seconds=Ruin spawn interval, ticks
ruins-small-ruin-chance=Small ruin chance per new chunk
ruins-medium-ruin-chance=Medium ruin chance per new chunk
ruins-large-ruin-chance=Large ruin chance per new chunk

[mod-setting-description]
ruins-enemy-not-cease-fire=If disabled, the ruins force keeps a cease-fire with players: turrets and worms of ruins do not attack. Applies immediately, also to ruins that already exist.
ruins-avoid-repeats=Every ruin of a size appears once before any of them can appear again (counted separately for each ruin set and size; ruins that are not allowed at a place are skipped and stay for later). Disable for a fully random choice.
current-ruin-set=Which collection of ruins appears on the map. "Paranoidal" contains all ruins: its own and, unless disabled, the "base" set. "None" disables ruins.
ruins-min-distance-from-spawn=No ruins appear closer to the map center (0, 0) than this many tiles along either axis (a square zone). Only when the distance dependence is enabled, medium ruins need ×2.5 and large ruins ×5 of this distance.
ruins-ignore-distance=Enabled (default): every ruin of every size, including rare and dangerous ones, can appear right outside the ruin-free zone around the map center. What you find is a matter of luck.\nDisabled: medium ruins appear only beyond ×2.5 and large ruins beyond ×5 of the ruin-free zone, and some valuable or dangerous ruins only beyond their own distance (400–2500 tiles).
ruins-spawn-tick-seconds=Every this many ticks (60 ticks = 1 second) the ruins queued from newly generated chunks are spawned. Lower values make ruins appear sooner after a chunk is generated, higher values spread the work. A change applies immediately.
ruins-small-ruin-chance=Chance that a newly generated chunk gets a small ruin (8×8), from 0 to 1: 0.02 = 2%. A chunk gets at most one ruin; if the three chances add up to more than 1, they are scaled down proportionally. A ruin is not placed when its area contains water or other impassable tiles.
ruins-medium-ruin-chance=Chance that a newly generated chunk gets a medium ruin (16×16), from 0 to 1: 0.01 = 1%. A chunk gets at most one ruin; if the three chances add up to more than 1, they are scaled down proportionally. A ruin is not placed when its area contains water or other impassable tiles.
ruins-large-ruin-chance=Chance that a newly generated chunk gets a large ruin (32×32), from 0 to 1: 0.002 = 0.2%. A chunk gets at most one ruin; if the three chances add up to more than 1, they are scaled down proportionally. A ruin is not placed when its area contains water or other impassable tiles.

[string-mod-setting]
current-ruin-set-__none__=None (no ruins)

