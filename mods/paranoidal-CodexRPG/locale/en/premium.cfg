silkor-title=Calendar and alarm clock
silkor-quote=Last night I sat down to play at 22:00 and got up at 11:30 today… Please add an alarm clock, a calendar and time with notifications, so I can set a timer and when the time comes it beeps annoyingly, so it's clear it's time to do what I planned!!! … Honestly, the way the time of year is shown is awful, please make a normal calendar. Make it like ours, 365–366 days a year. It'll be more convenient, honestly
silkor-text=A calendar of 365 days, 366 in leap years: the first of January is the landing day, and the dates show base milestones and BnL holidays. An alarm for minutes of game time rings with the programmable speaker sounds until you press "I'm up". There is also a playing time counter, a reminder to get up and a small window with the date that you can pin over the game.
coolzet-title=Codex and base statistics
coolzet-quote=How about adding something like our own informatron (not the tutorial section above the minimap)? For example, like in Pyanodon, the important parts of the modpack could go into a separate encyclopedia (defects, the ruin system, extra quality and so on), plus map statistics: biters killed, % of research, buildings built in total and so on.
coolzet-text=The Codex bookmark with notes on defects, quality, ruins, experience and how the statistics are counted, and the base statistics on the Base passport, Base, World, War, Quality and Milestones bookmarks. In seven centuries the BnL help desk wrote one article, "Buy more", so we write the codex ourselves.

