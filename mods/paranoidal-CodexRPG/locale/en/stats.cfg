card-contents=Contents
codex-intro=Short notes on how Paranoidal differs from the regular game.
codex-defects-title=Defects and quality control
codex-defects-text=Until "Quality control 10" is researched, finished products can come out defective, from −1 "Substandard" to −5 "Defective". Only red science era items get defects: buildings, armor, repair packs, science packs. Raw materials, parts, belts, weapons, ammo, modules and equipment are always made without defects, and so is everything that can only be made after green science.\n\nA defective item has weaker useful stats: at −5 a third of normal is left. Defective machines also use more energy, and defective drills deplete deposits faster.\n\nThe "Quality control 1–10" researches cost red science only. Each level lowers the defect chance; from level 10 no new defects appear. Green science cannot be researched without level 10.\n\nResearch does not fix old defects. The refining workshop does: one attempt raises an item by a grade with a 90% chance and uses up repair pack durability. It does not raise items above normal.\n\nA recipe needs all ingredients of the same quality, so a defective building cannot be mixed with normal parts.
codex-quality-title=Quality
codex-quality-text=Besides the five defect grades there are about forty positive qualities, from "Uncommon I" up to "Extreme". All of them are available from the start; quality module researches only unlock the modules.\n\nThe upgrade chance depends on the quality of the ingredients. Going up from normal is the easiest, each next tier is a little harder. Sometimes the result skips several tiers at once.\n\nBy default quality modules work in every machine and drill with module slots, so even ore can get positive quality.\n\nDefective ingredients never give a result better than their grade: neither modules nor research remove that defect. Only the refining workshop helps.
codex-ruins-title=Ruins
codex-ruins-text=Abandoned buildings of three sizes are scattered over the map: small 8×8, medium 16×16 and large 32×32. They hold useful things, junk and defective items, and sometimes worms, turrets and mines.\n\nA ruin counts as found when a player with a character comes close to it. The whole team learns about a new kind of ruin, and a map tag appears: a skull for a dangerous ruin, a star for a rare one. The /ruins command shows how many kinds you have found.\n\nFar beyond the starting area stand 22 legendary ruins: huge challenges with guardians and rewards of quality 4–10. Until such a ruin is beaten, its walls cannot be destroyed and nothing can be built inside.\n\nRuins only appear in new chunks. The map you have already explored does not change.
codex-rpg-title=Experience and levels
codex-rpg-text=You get experience for killing enemies, cutting trees and breaking rocks. Research and rocket launches give experience to every team member who is in the game at the time. The higher the evolution, the more experience each kill gives.\n\nEvery level gives a skill point. Points go into health, crafting, mining and running speed, inventory, trash slots, the number of following robots and reach. A skill has at most 50 levels.\n\nDying takes away 30% of the experience gained on the current level. The level itself does not drop.\n\nThe RPG commands are listed on the character page.
codex-stats-title=How the statistics are counted
codex-stats-text=The base statistics are counted only while the base passport or a statistics page is open, and at most once a minute. The count is spread over several ticks so the game does not take the whole load at once. The rest of the time the journal counts nothing.\n\nThe engine keeps production, kills, buildings and pollution since the start of the game, so they show up on old saves too. Milestones, causes of death, "Killed with", hand crafting, distance travelled and depleted deposits are counted by the modpack itself. On saves started earlier they begin at the update; such rows are marked with a clock.\n\nMilestones reached before the update are in the journal too. Their time is recovered from the statistics graphs and marked with ≈. When the graphs do not tell, the journal says "by" and the time of the update.\n\nDistance is counted by the character's steps, each time it moves onto another tile. The map camera and remote view add nothing.\n\nBuildings come from the building statistics: placed minus removed and lost. Ruin buildings and buildings created by mod scripts are not included, so these numbers are approximate.\n\nI opens the journal on the character, Alt+I on the last statistics page.
