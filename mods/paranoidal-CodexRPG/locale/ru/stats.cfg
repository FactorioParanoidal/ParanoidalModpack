card-contents=Содержание
codex-intro=Здесь коротко о том, чем Paranoidal отличается от обычной игры.
codex-defects-title=Брак и контроль качества
codex-defects-text=Пока не изучен «Контроль качества 10», готовые изделия могут выходить с браком: от −1 «Нестандартное» до −5 «Бракованное». Брак бывает только у вещей эпохи красной науки: у зданий, брони, ремонтных наборов, научных пакетов. Сырьё, детали, ленты, оружие, боеприпасы, модули и оборудование выходят без брака, как и всё, что делается только после зелёной науки.\n\nУ бракованной вещи хуже полезные характеристики: у −5 остаётся треть от обычного. Бракованные машины к тому же тратят больше энергии, а бракованные буры быстрее истощают месторождение.\n\nИсследования «Контроль качества 1–10» стоят только красную науку. Каждый уровень снижает шанс брака, на десятом новый брак больше не появляется. Без десятого уровня не открыть зелёную науку.\n\nСтарый брак исследования не исправляют. Для этого есть мастерская доводки: одна попытка поднимает изделие на ступень с шансом 90% и расходует прочность ремонтных наборов. Выше обычного качества мастерская не поднимает.\n\nРецепт требует одинакового качества всех ингредиентов, поэтому бракованное здание не смешать с обычными деталями.
codex-quality-title=Качество
codex-quality-text=Кроме пяти ступеней брака в сборке около сорока положительных качеств, от «Хорошего» до «Божественного». Все они доступны с начала игры, исследования модулей качества открывают только сами модули.\n\nШанс повышения зависит от качества ингредиентов. Из обычных проще всего получить «Хорошее», каждая следующая ступень даётся немного труднее. Иногда результат перескакивает сразу через несколько ступеней.\n\nПо умолчанию модули качества работают во всех машинах и бурах со слотами, так что положительное качество может получить даже руда.\n\nИз бракованных ингредиентов не выйдет вещь лучше их ступени: ни модули, ни исследования этот брак не убирают. Помогает только мастерская доводки.
codex-ruins-title=Руины
codex-ruins-text=По карте разбросаны заброшенные постройки трёх размеров: малые 8×8, средние 16×16 и большие 32×32. В них бывают полезные вещи, мусор и брак, а иногда черви, турели и мины.\n\nРуина считается найденной, когда к ней подходит игрок с персонажем. О новом виде руин узнаёт вся команда, на карте появляется метка: череп у опасной руины, звезда у редкой. Команда /ruins показывает, сколько видов уже найдено.\n\nДалеко за стартовой зоной стоят 22 легендарные руины: огромные испытания со стражами и наградой качества 4–10. Пока такая руина не пройдена, её стены не разрушить, а строить внутри нельзя.\n\nРуины появляются только в новых чанках. Уже открытая карта не меняется.
codex-rpg-title=Опыт и уровни
codex-rpg-text=Опыт дают убийства врагов, рубка деревьев и разбитые камни. За исследования и запуск ракет опыт получают все игроки команды, которые в это время в игре. Чем выше эволюция, тем больше опыта за каждое убийство.\n\nКаждый уровень даёт очко навыка. Очки вкладываются в здоровье, скорость крафта, добычи и бега, инвентарь, слоты для мусора, число роботов-спутников и дальность действия. У навыка не больше 50 уровней.\n\nСмерть отнимает 30% опыта, набранного на текущем уровне. Сам уровень не падает.\n\nКоманды RPG перечислены на странице персонажа.
codex-stats-title=Как считается статистика
codex-stats-text=Статистика базы собирается, только пока открыт паспорт базы или страница со статистикой, и не чаще раза в минуту. Подсчёт растянут на несколько тиков, чтобы не нагружать игру разом. В остальное время журнал ничего не считает.\n\nПроизводство, убийства, постройки и загрязнение движок хранит с начала игры, поэтому они видны и на старых сохранениях. Вехи, причины смертей, «Чем убивали», крафт руками, пройденный путь и иссякшие месторождения считает сама сборка. На сохранениях, начатых раньше, они идут с момента обновления, такие строки отмечены часами.\n\nВехи, пройденные до обновления, тоже есть в журнале. Их время восстановлено по графикам статистики и помечено знаком ≈. Если по графикам время не понять, написано «до» и время обновления.\n\nПуть считается по шагам персонажа: каждый раз, когда он переходит на соседнюю клетку. Камера карты и удалённый просмотр путь не добавляют.\n\nЗдания считаются по статистике построек: поставлено минус разобрано и потеряно. Постройки руин и здания, созданные скриптами модов, не учитываются, так что эти цифры примерные.\n\nКлавиша I открывает журнал на персонаже, Alt+I — на последней странице статистики.
