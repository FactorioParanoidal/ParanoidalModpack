[mod-setting-description]
charxpmod_hide_xp_panel=[img=utility/character_health_bonus_modifier_icon] Скрывает верхний индикатор опыта RPG-системы. Опыт продолжает начисляться: настройка убирает только панель, а не развитие персонажа или окно его характеристик.\n[color=#9cdcfe]По умолчанию: флажок установлен. Только для вас.[/color]
