silkor-title=Календарь и будильник
silkor-quote=Вот я сел играть вчера в 22:00, в итоге сегодня вылез в 11:30… Прошу, поставьте будильник, календарь и время с оповещением, чтоб можно было поставить таймер и как приходит время, он пищит противно, чтоб было понятно, что пора сделать то, что планировал!!! … А отображение времени года ужасное, честно, сделайте норм календарь. Сделайте как у нас: 365–366 дней в году. Удобнее будет, честно
silkor-text=Календарь на 365 дней, в високосный год 366: первое января — день высадки, на датах отмечены вехи базы и праздники BnL. Будильник на минуты игры звенит звуками программируемого динамика, пока вы не нажмёте «Встал». Ещё есть счётчик времени в игре, напоминание встать и окошко с датой, которое можно закрепить поверх игры.
coolzet-title=Кодекс и статистика базы
coolzet-quote=Как вам идея добавить что-то вроде своего информатрона (не раздел обучения над мини-картой)? Например, как в Пианодоне, можно вынести в отдельную энциклопедию важные разделы сборки (брак, система руин, доп. качество и т. д.), а также статистику карты: убито жуков, % исследований, всего построено зданий и т. д.
coolzet-text=Закладка «Кодекс» с заметками о браке, качестве, руинах, опыте и о том, как считается статистика, и статистика базы на закладках «Паспорт базы», «База», «Мир», «Война», «Качество» и «Вехи». Справочная BnL за семь веков написала одну статью, «Купите ещё», поэтому кодекс пишем сами.

