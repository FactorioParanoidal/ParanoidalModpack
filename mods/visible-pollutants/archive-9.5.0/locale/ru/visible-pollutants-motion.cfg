[mod-setting-name]
visible-pollutants-motion=Движение облаков

[mod-setting-description]
visible-pollutants-motion=Медленная внутренняя анимация мягкой пелены и небольшое смещение всех четырёх форм по ветру. По умолчанию выключено: облака неподвижны, но их плотность продолжает отражать загрязнение. Режим меняется постепенно; при смене пелены её плотность может кратковременно снизиться. Не влияет на реальное загрязнение и солнечный штраф. Выключение движения не выгружает текстуру анимации из памяти.
