[vp-explanation]
layer=Everything below this render layer is obscured. Appearance only: does not change pollution, personal exposure or solar production.
opacity=Maximum visual opacity of the cloud. Appearance only: lowering it does not clean the air or remove the solar penalty.
see-through=Maximum visual opacity near important objects and the player. Appearance only: does not change pollution, personal exposure or solar production.
min=At or below this pollution value the smog density is zero. Together with the maximum threshold and exponent, this curve controls both cloud density and solar occlusion when enabled. This is not the character's tolerance. Hiding a cloud does not remove pollution.
max=At or above this pollution value the smog density is maximal. Together with the minimum threshold and exponent, this curve also controls solar occlusion when enabled; it is not a personal danger limit.
exponent=Values above 1 lower density at intermediate pollution; values below 1 increase it. The same curve controls cloud density and solar occlusion when enabled. Use Opacity for a purely visual change.
solar=Applies one pollution-dependent solar multiplier to the entire surface, based on pollution in chunks with tracked panels and their quality. This is not independent shading for each panel or electric network. Uses the shared minimum/maximum/exponent curve. Seasons and rain remain separate factors. /toxic air reports this component when Toxic Pollution is installed.
