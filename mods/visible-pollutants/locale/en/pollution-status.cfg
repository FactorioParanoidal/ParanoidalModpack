[vp-explanation]
layer=Selects the world drawing layer used for the cloud. Higher layers can place smog over labels, icons and wires; how much they are obscured depends on opacity. Appearance only: does not change pollution, personal exposure or solar production.
opacity=Maximum visual opacity of the cloud. Appearance only: lowering it does not clean the air or remove the solar penalty.
see-through=Target opacity cap in 32×32-tile grid cells at a player's current controller/camera position and selected entity. For example, 0.25 targets at most 25% opacity. Updates approach this target using blending, not instantly. Neighbouring cells that are not themselves important use a softer cap: this value raised to 0.6. Connected players outside normal chart view are considered. Appearance only: pollution, personal exposure and solar production are unchanged.
min=At or below this pollution value the smog density is zero. Together with the maximum threshold and exponent, this curve controls both cloud density and solar occlusion when enabled. This is not the character's tolerance. Hiding a cloud does not remove pollution.
max=For pollution above the minimum threshold and at or above this value, the smog density is maximal. Together with the minimum threshold and exponent, this curve also controls solar occlusion when enabled; it is not a personal danger limit.
exponent=Values above 1 lower density at intermediate pollution; values below 1 increase it. The same curve controls cloud density and solar occlusion when enabled. Use Opacity for a purely visual change.
solar=Applies one pollution-dependent solar multiplier to the entire surface, based on pollution in chunks with tracked panels and their quality. This is not independent shading for each panel or electric network. Uses the shared minimum/maximum/exponent curve. Seasons and rain remain separate factors. /toxic air reports this component when Toxic Pollution is installed.
