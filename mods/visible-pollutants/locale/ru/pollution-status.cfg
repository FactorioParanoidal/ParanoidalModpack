[vp-explanation]
layer=Облако закрывает изображение ниже этого слоя. Только отображение: не меняет загрязнение, воздействие на персонажа или солнечную выработку.
opacity=Максимальная видимая непрозрачность облака. Только отображение: её уменьшение не очищает воздух и не снимает солнечный штраф.
see-through=Предел видимой непрозрачности возле важных объектов и игрока. Только отображение: не меняет загрязнение, воздействие на персонажа или солнечную выработку.
min=При загрязнении не выше этого значения плотность смога равна нулю. Вместе с верхним порогом и показателем эта кривая управляет и плотностью облака, и солнечным затенением, если оно включено. Это не переносимость персонажа. Скрытое облако не означает удалённое загрязнение.
max=При загрязнении не ниже этого значения плотность смога максимальна. Вместе с нижним порогом и показателем эта кривая управляет и солнечным затенением, если оно включено; это не личный предел опасности.
exponent=Значения выше 1 уменьшают плотность при промежуточном загрязнении, ниже 1 — увеличивают. Одна кривая управляет плотностью облака и солнечным затенением, если оно включено. Для чисто визуального изменения используй «Непрозрачность».
solar=Применяет один солнечный коэффициент загрязнения ко всей поверхности по загрязнению в чанках с учтёнными панелями и их качеству. Это не отдельное затенение каждой панели или электросети. Использует общую кривую нижнего/верхнего порога и показателя. Сезон и дождь — отдельные множители. /toxic air показывает этот компонент при наличии Toxic Pollution.
