[mod-setting-description]
PlanetsLib-enable-entity-replacements=Включает замены объектов, не привязанные к другой настройке запуска. Запасной вариант на случай удаления модов, если авторы не привязали свои замены к настройке.
PlanetsLib-disable-all-entity-replacements=Принудительно отключает все замены объектов во всех модах. Нужно, только если мод настроен совсем неправильно.
PlanetsLib-enable-runtime-rocket-silo-replacements=Если планеты меняют грузоподъёмность ракеты или число ракетных деталей, ракетные шахты заменяются во время игры. Отключите, чтобы безопасно выключить это и вернуть замены в сохранениях.
PlanetsLib-enable-lab-science-pack-preview-size-change=Меняет размер значков научных пакетов на лабораториях в режиме Alt по числу пакетов, которые принимает лаборатория.
