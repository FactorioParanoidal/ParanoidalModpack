[mod-setting-description]
PlanetsLib-warn-on-hidden-prerequisites=Při načtení hry se zobrazí varování pokud existují skryté podmínky nebo požadavky vazeb technologií.
PlanetsLib-update-vanilla-recipe-productivity-techs=Přidávat k receptům vanilla technologií produktivity všechny odpovídající upravované recepty. Doporučeno ponechat aktivní, ale mohou nastat potíže s kompatibilitou u starších modifikací.“
PlanetsLib-unlink-hidden-prerequisites=Pokud je technologie skrytá a je zároveň podmínkou zkoumání následující technologie, je tato vazba odstraněna, aby nedocházelo k blokování navazujících technologií.
PlanetsLib-enhanced-tooltips=Doplní obsah tooltipů s dříve skrytými informace.
PlanetsLib-enable-entity-replacements=Umožní náhrady entit pokud nejsou vázané na jiné startovní nastavení. Nastavení pomáhá při odinstalaci, pokud to tvůrci módů neřešili.
PlanetsLib-disable-all-entity-replacements=Vynucené zakázání všech náhrad entit ve všech modech. Nemělo by být potřeba, pokud není některý mod vážně chybně nakonfigurován.
PlanetsLib-enable-runtime-rocket-silo-replacements=Pokud planeta obsahuje multiplikátor hmotnosti a množství raketových dílů, bude při běhu hry použita náhrada raketového sila. Pokud některý mod tuto funkci použil nebezpečným způsobem a chcete‑li toto chování bezpečně deaktivovat a vrátit provedenou náhradu v uložených hrách, vypněte toto nastavení.
PlanetsLib-enable-lab-science-pack-preview-size-change=Upravuje velikost ikon vědeckých balíčků v laboratořích v alt‑módu podle počtu vědeckých balíčků, které laboratoř dokáže přijmout.
