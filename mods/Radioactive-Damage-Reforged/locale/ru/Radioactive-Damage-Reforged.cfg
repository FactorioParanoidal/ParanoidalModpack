rdr-geiger-sound=Звук счётчика Гейгера

[mod-setting-description]
rdr-geiger-sound=Счётчик Гейгера трещит, пока персонаж получает радиацию (уран в инвентаре, излучающее здание рядом), — тем чаще, чем выше доза. Рядом с излучающим зданием он слабо потрескивает ещё до начала урона.
