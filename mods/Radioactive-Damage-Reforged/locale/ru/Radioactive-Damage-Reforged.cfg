[mod-name]
Radioactive-Damage-Reforged=Radioactive Damage Reforged (Радиоактивное поражение — переработанное)

[mod-description]
Radioactive-Damage-Reforged=Радиация: урановая руда, уран-235, уран-238 и урановые топливные элементы (в том числе отработанные) в инвентаре облучают персонажа.\n\n— Урон идёт постоянно, пока радиоактивные предметы у вас при себе; каждый вид предмета добавляет урон. Ядерное топливо не радиоактивно.\n— Противорадиационный костюм почти полностью защищает от радиации, но у него нет сетки оборудования.\n— Счётчик Гейгера щёлкает, когда вы облучаетесь (звук отключается в настройках).\n\nВозите уран в транспорте и сундуках, а не в кармане. Порт Radioactive Damage (DellAquila) из Paranoidal Beta 8.

[damage-type-name]
uranium-damage=Радиоактивное поражение

[item-name]
hazmat-suit=Противорадиационный костюм

[item-description]
hazmat-suit=Техника безопасности! Наденьте этот костюм, чтобы работать с радиоактивными материалами!

[mod-setting-name]
rdr-geiger-sound=Звук счётчика Гейгера

[mod-setting-description]
rdr-geiger-sound=Счётчик Гейгера трещит, пока персонаж получает радиацию (уран в инвентаре, излучающее здание рядом), — тем чаще, чем выше доза. Рядом с излучающим зданием он слабо потрескивает ещё до начала урона.
