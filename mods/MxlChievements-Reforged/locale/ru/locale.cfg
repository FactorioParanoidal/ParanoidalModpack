[mxlr-description]
robinson=Разберите первый обломок разбившегося корабля. Страховая компания ничего не узнает.
handcraft=Создайте вручную __1__ предметов. Мозоли прилагаются бесплатно.
jack-of-all-trades=Создайте вручную __1__ разных предметов. Мастер на все руки, профессионал ни в чём.
chemist=Получите хотя бы немного каждого газа Angels, который можно произвести. Нюхать не обязательно, но кто ж тебя остановит.
restorer=Исправьте в ремонтных мастерских __1__ предметов. Брак был не ваш, честное слово.
don-quixote=Держите одновременно __1__ ветрогенераторов. Мельницы пока не сдаются.
dead-calm=Дождитесь полного штиля, имея __1__ ветрогенераторов. Самое время вспомнить про уголь.
hurricane=Ветер дует на полную мощность __1__ секунд подряд. Шапку держите сами.
resistance=Держите одновременно __1__ опор ЛЭП. Каждая что-то да потребляет. Ом гордится вами.
christmas-tree=Держите одновременно __1__ опор ЛЭП со светильниками. Новый год круглый год, счёт за свет — тоже.
push-pull=Соберите состав, в котором локомотивы тянут в обе стороны. Лебедь, рак и щука шлют привет.
overload=Отправьте в путь поезд из __1__ гружёных вагонов. Рельсы просили передать: «За что?»
tardis=Зайдите внутрь фабрики. Запомните, где выход.
factory-in-factory=Постройте фабрику внутри другой фабрики. Мы поставили фабрику в твою фабрику, чтобы ты строил, пока строишь.
no-emissions=Пусть фабрика с работающими машинами __1__ часов подряд не выпускает наружу ни грамма загрязнения. Кусаки в недоумении: пахнет только озоном.
factory-24-7=Пусть фабрика с работающими машинами __1__ часов подряд работает без единого перебоя в питании. Ночные смены, выходные и праздники — тоже рабочие.
jumper=Телепортируйтесь __1__ раз. С каждым прыжком вы немножко не тот, что раньше, но кто считает атомы.
hoarder=Держите одновременно __1__ складов и хранилищ. Выбрасывать — не наш метод.
crane-operator=Держите одновременно __1__ кранов-манипуляторов. Майна, вира, обед.
modesty=Держите одновременно __1__ мини-сундуков. Размер не главное. Главное — количество.
vacuum=Держите одновременно __1__ башен-подборщиков. Ни одна шестерёнка не останется на земле. И ни одна гильза.
centipede=Объедините сундуки в один площадью не меньше 20 клеток. Ноги к нему не прилагаются.
plane-crash=Логистические роботы потерпели __1__ крушений в пробках. Диспетчер уволен, роботы — нет.
entomologist=Уничтожьте __1__ врагов фракции «__2__». Коллекцию оформите в рамочку.
evolution-peak=Уничтожьте врага Rampant 10-го уровня. Дарвин был прав, а вы — злее.
hive-raider=Уничтожьте __1__ ульев Rampant. Мёда не будет.
fight-fire=Уничтожьте огнём __1__ огненных и инфернальных врагов. Да, так тоже можно.
short-circuit=Уничтожьте электричеством __1__ электрических врагов. Пробки выбило у них.
face-to-face=Лично уничтожьте тролля 10-го уровня. Главное правило интернета работает и здесь.
godzilla=Уничтожьте битерзиллу высшего уровня. Токио может спать спокойно.
dragon-mother=Уничтожьте мать битерзилл высшего уровня. Дракарис не сработал.
volcanologist=Уничтожьте вулкан. Да, вулкан. Да, уничтожьте.
overgrown-worm=Уничтожьте червя-босса. Наживка из него так себе.
evil-twin=Уничтожьте фальшивого человека-босса. Убедитесь, что это было не зеркало.
popular-place=Переживите __1__ атак на базу. Отзывы соседей: одна звезда.
veteran=Уничтожьте __1__ врагов турелями высшего, 11-го ранга. Турели уже травят байки о былом.
modular-defense=Уничтожьте __1__ врагов модульными турелями. Собрано из того, что было.
scattershot=Уничтожьте __1__ врагов дробовыми турелями. Целиться — для слабаков.
sniper=Уничтожьте __1__ врагов снайперскими турелями. Тихо, точно, без лишних вопросов.
plasma-shower=Уничтожьте __1__ врагов плазменными турелями 5-го уровня. Горячую воду отключили, плазму — нет.
darts=Уничтожьте __1__ врагов турелями с дротиками. Паб «У жука» гордится своими завсегдатаями.
bio-artillery=Уничтожьте __1__ врагов биопушками. Природа против природы, и природа побеждает.
tank-platoon=Уничтожьте __1__ врагов из танка: __2__. Танки грязи не боятся, жуков — тем более.
ace=Сбейте из самолёта __1__ летающих врагов Rampant. Небо ваше. Пока.
flying-fortress=Уничтожьте __1__ врагов из летающей крепости. Сверху виднее.
steamroller=Задавите техникой __1__ врагов. ПДД для жуков не писаны.
sapper=Уничтожьте минами __1__ врагов. Карту минного поля храните сами и не теряйте.
terminator=Получите удар силой __1__ урона и выживите. I'll be back.
splattered=Получите удар силой __1__ урона. Выживать не обязательно: собирать вас всё равно будут совочком.
train-survivor=Попадите под поезд и выживите. Машинист до сих пор заикается.
bounty-hunter=Уничтожьте по боссу каждого вида: битерзиллу, мать битерзилл, вулкан, червя-босса и фальшивого человека. Головы на стену — за свой счёт.
evolution=Эволюция врагов достигла __1__%. Вы им очень помогли.
first-winter=Переживите первую зиму. Валенки — тоже технология.
all-seasons=Проживите все четыре времени года. Отпуск так и не наступил.
owl=Встретьте __1__ полночей. Режим сна объявлен в розыск.
houston=Потеряйте ракетную шахту. Нет, это не баг. Это вы.
liftoff=Отправьте в ракете автомобиль. Илон, это ты?
orbital-tank=Отправьте в ракете танк. Вдруг на орбите тоже жуки.
porthole=Отправьте в ракете спутник наблюдения. И снится нам не рокот космодрома…
space-miner=Отправьте в ракете автономный космический дрон-шахтёр. Теперь плачут астероиды.
eye-in-the-sky=Отправьте в ракете космический телескоп. Большой брат смотрит на звёзды.
rocket-in-rocket=Отправьте в ракете ракетную шахту. Чтобы запускать ракеты, пока запускаете ракеты.
spaceport=Запустите __1__ ракет. Сметы не разворованы, сроки не сорваны — подозрительно.
rocket-conveyor=Запустите __1__ ракет за один час. Орбита засорена, зато красиво.
immortal=Запустите ракету, ни разу не умерев с начала игры. Кладбище простаивает без работы.
speedrun=Запустите ракету не позже чем через __1__ ч игры. Сон для слабых.
pedestrian=Запустите ракету, не построив ни машины, ни танка, ни самолёта. До космоса пешком — уважаем.
luddite=Запустите ракету, не построив ни одного робопорта. Роботы — от лукавого.
all-in-sight=Запустите ракету, не построив ни одной фабрики. Все грехи на виду.
no-portals=Запустите ракету, не построив ни одного телепорта. Ногами, только ногами.
old-school=Запустите ракету, не построив ни одного комбинатора Cybersyn. Расписание поездов — в голове и на салфетке.
no-bottomless=Запустите ракету, не построив ни одного бездонного хранилища. У каждого склада есть дно, и вы его видели.
almost-lazy=Запустите ракету, создав вручную не больше __1__ предметов. Руководить — тоже работа.
archaeologist=Найдите __1__ разных руин. Шляпа и хлыст в комплект не входят.
archaeologist-all=Найдите руины всех видов. Музей оплатит экскурсию. Нет.
phoenix=Умрите __1__ раз. Перья отрастут.
deja-vu=Умрите дважды на одном и том же месте. Учиться на ошибках — это не про вас.
own-goal=Погибните от собственного оружия. Самый меткий выстрел в вашей карьере.
road-accident=Попадите под машину. Посмотрите по сторонам. Хотя уже поздно.
marathon=Пройдите пешком __1__ м. Кроссовки стёрлись, жуки отстали.
pilot=Пролетите на самолёте __1__ м. Ваш багаж, к сожалению, улетел в другой чанк.
schumacher=Разгонитесь на машине до __1__ км/ч. Камера всё видела.
infinity=Изучите бесконечную технологию до __1__-го уровня. «Бесконечная» — не метафора, вы проверили.
rpg-level=Достигните __1__-го уровня персонажа. Работать за вас уровень всё равно не станет.
specialist=Вложите __1__ очков в один навык персонажа. Специалист подобен флюсу: полнота его односторонняя.
godfather=Переименуйте __1__ станций, локомотивов или других объектов. Им сделали предложение, от которого нельзя отказаться.
malevich=Перекрасьте поезда __1__ раз. Чёрный квадрат — тоже цвет.
reverse-gear=Разверните ленту целиком __1__ раз. Конвейер так и не понял, чего вы от него хотите.
world-eraser=Удалите __1__ чанков. Карта стала легче, совесть — нет.
oops=Буры __1__ раз отправлены на разборку после выработки месторождения. Шахтёрам — пенсия, роботам — переработка.
night-shift=Постройте __1__ объектов глубокой ночью. Профсоюз в ярости.
stuck=Воспользуйтесь кнопкой «Застрял». Стыдно, но быстрее, чем звать на помощь.

