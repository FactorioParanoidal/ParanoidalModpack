[mxlr-flavor]
gear-production-3=\nКаждый атом этой планеты хоть раз побывал шестерёнкой.
Inserter-Madness-3=\nЕсли они объединятся в профсоюз — вам конец.
iron-bar-3=\nРуда кончилась на трёх соседних планетах. Они не жалуются: их больше нет.
car-production-3=\nДаже пешеходы стоят в пробке.
tank-production-1=\nЖуки уже пишут жалобу в ООН.
locomotive-production-3=\nРельсов, разумеется, не хватит.
steam-production=\nВся планета — одна большая парилка. С лёгким паром!
red-science-3=\nШестерёнки и медь просят политического убежища.
blue-science-3=\nЧистота, о которой мечтал один скромный учитель химии.
black-science-3=\nЛаборанты приходят на работу в бронежилетах.
concrete-3=\nПланета официально переименована в «Парковку».
plastic-3=\nЧерез тысячу лет археологи решат, что здесь жил бог пакетов.
uranium-ore-3=\nСчётчик Гейгера подал в отставку.
nuclear-reactor-3=\nНочью вашу базу видно из соседней галактики.
stone-wall-3=\nЖуки осваивают производство лестниц.
explosives-3=\nКурить строго за пределами планеты.
artillery-shell-3=\nПрогноз на завтра: осадки в виде фугасов, ветер умеренный.
gun-turret-3=\nЖуки всерьёз рассматривают эмиграцию.
stone-furnace-3=\nСреднегодовая температура планеты выросла на четыре градуса. Спасибо.
steel-furnace-3=\nГринпис прислал белый флаг и счёт за психотерапевта.
pumpjack-3=\nПод базой больше нет нефти. И, кажется, мантии.
speed-module-3-3=\nВремя на базе идёт быстрее, чем снаружи. Эйнштейн доволен.
productivity-module-3-3=\nИз одной шестерёнки выходят две и немного угрызений совести.
copper-madness-10=\nМедные трубы теперь тянутся до Луны.
train-madness-5=\nЗа один рейс машинист успел жениться, развестись и выйти на пенсию.
mxlr-salvaged-assembler=\nСобрано из обломков корабля и честного слова. Гарантия — до первого жука.
mxlr-salvaged-generator=\nТарахтит, дымит, работает. Прямо как вы по утрам.
mxlr-salvaged-lab=\nНаука держится на изоленте. Как и вся цивилизация.
mxlr-assembler-6=\nПять предыдущих сборщиков смотрят с завистью из ящика.
mxlr-assembler-9=\nДевятый! Айвазовский не успевал так быстро рисовать.
mxlr-deep-drilling=\nЕщё немного — и услышите, как ругаются черти.
mxlr-area-drilling=\nРуда, деревья, камни, совесть — всё под корень.
mxlr-big-lab=\nБольше лаборатория — больше пакетов пропадает в никуда.
mxlr-hyper-lab=\nНаука на кофеине.
mxlr-armoured-train=\nЖуки, вы серьёзно собирались его укусить?
mxlr-quality-control=\nТеперь брак хотя бы с печатью.
mxlr-repair-shop=\nИзолента, молоток и святая вера в чудо.
mxlr-recycler-1=\nМусор на входе — чуть меньше мусора на выходе.
mxlr-recycler-2=\nПеребрали переработанное. Опять.
mxlr-recycler-3=\nИсчезают только премии за план.
mxlr-recycler-4=\nМасса сохраняется. Нервы — нет.
mxlr-winds-of-change=\nКрутится, гудит, иногда даже даёт энергию.
mxlr-riteg=\nПальцы не держать, ладони не греть, туристам не показывать.
mxlr-bio-boiler=\nПахнет так, что жуки обходят базу стороной.
mxlr-fire-engine=\nВместо сердца — уголь.
mxlr-electric-train=\nДальше Петушков не ходит.
mxlr-high-voltage=\nА ты всё равно влез.
mxlr-buried-cable=\nТысяча распределительных щитов под землёй — и ни один не найти без чертежа.
mxlr-rusty-engine=\nСкрипит, ржавеет и переживёт вас всех.
mxlr-cyber-dispatcher-1=\nПоезда теперь умнее вас. Они это знают.
mxlr-cyber-dispatcher-2=\nВы больше не диспетчер. Вы декорация.
mxlr-metro=\nСтанция «Шестерёнковская», осторожно, двери закрываются.
mxlr-underground-plumbing=\nТо, что течёт под землёй, остаётся под землёй.
mxlr-bigger-inside=\nДоктор, у меня внутри фабрики ещё одна жизнь.
mxlr-portal-1=\nТорт обещали. Торта не будет.
mxlr-portal-2=\nДумай порталами.
mxlr-portal-3=\nНоги атрофировались за ненадобностью.
mxlr-bottomless-barrel=\nСколько ни лей — всё мало. Как зарплата.
mxlr-black-hole=\nВсё, что туда попало, обратно не вернётся. Как носки в стиралке.
mxlr-agroholding=\nКолхоз «Светлый путь» гордился бы.
mxlr-landfill=\nКуда-то же всё это надо девать.
mxlr-excavation=\nРоем котлован под светлое будущее. Будущее не торопится.
mxlr-electrolysis=\nВода разложена, учитель химии отомщён.
mxlr-silo-sprint=\nСто часов — и уже яма. Прогресс налицо.
mxlr-geologist=\nКарта рудных полей готова. Залежи совести не обнаружены.
mxlr-holo=\nРеклама добралась и до вашего завода.
mxlr-let-there-be-light=\nИ стал свет. И стало видно, сколько тут спагетти.
mxlr-city-lights=\nАстрономы соседней планеты подали жалобу на световое загрязнение.
mxlr-six-sigma=\n99,99966% без брака. Оставшиеся 0,00034% — вы.
mxlr-matryoshka=\nВнутри — фабрика, внутри неё — ещё фабрика, а внутри той — кредит.
mxlr-stargazer=\nЗвёзды смотрят в ответ. С подозрением.
mxlr-oil-tycoon=\nТеперь можно жечь нефть и называть это энергетикой.
mxlr-stone-age-1=\nМиллион камней. Цивилизация на подходе.
mxlr-stone-age-2=\nМиллиард камней. Сизиф просит отпуск.
mxlr-stone-age-3=\nТриллион камней. От планеты остался один гравий.
mxlr-lumberjack-1=\nЛеса всё ещё стоят. Пока.
mxlr-lumberjack-2=\nДятлы переквалифицировались в шахтёров.
mxlr-lumberjack-3=\nПоследнее дерево планеты просит не рубить его. Поздно.
mxlr-slag-1=\nОтходы производства — тоже производство.
mxlr-slag-2=\nИз этого шлака можно построить второй завод. Не стройте.
mxlr-slag-3=\nПланета покрыта шлаком в три слоя. Ангел доволен.
mxlr-coke=\nСугубо промышленный. Сугубо.
mxlr-platinum=\nКарта лояльности металлурга, высшая категория.
mxlr-solder=\nМиллион катушек припоя. Вы в шаге от вопроса «а это что за провод?».
mxlr-silicon-valley-1=\nСтартапы уже стоят в очереди за вашими пластинами.
mxlr-silicon-valley-2=\nПо капитализации вы обогнали всю долину. По зарплате — нет.
mxlr-god-module-1=\nНа слоте модуля появился нимб.
mxlr-god-module-2=\nПантеон переполнен.
mxlr-god-module-3=\nДесять тысяч богов — и ни одной молитвы о мощности сети.
mxlr-quality-squared=\nКачество качества. Что дальше, качество качества качества?
mxlr-sound-barrier=\nПредметы на этой ленте прибывают раньше, чем вы о них подумали.
mxlr-butterfingers=\nТысяча кривых шестерёнок. Это не брак, это авторский стиль.
mxlr-defect-plan=\nПлан по браку перевыполнен на 300%. Премию выдадут тоже бракованную.
mxlr-thorium-cycle=\nТорий мирный, в отличие от вас.
mxlr-plutonium=\nЦветёт и светится.
mxlr-heavy-water=\nПить не рекомендуется. Даже если очень хочется.
mxlr-fe-c=\nТяжёлая, ржавая и всё равно заряжается.
mxlr-charged=\nСто тысяч батарей. Где-то в мире плачет один зайчик.
mxlr-nano-constructor=\nНаноботы строят быстрее, чем подрядчики крадут.
mxlr-nano-leveler=\nМикроскопические бульдозеры в каждом кармане.
mxlr-atomic-artillery=\nДипломатия большого калибра.
mxlr-tsar-bomba=\nВсего одна. Больше и не нужно.
mxlr-filter-it=\nВоздух чище, совесть — нет.
mxlr-captain-planet=\nСила — в твоих руках! И в сотне модулей.
mxlr-captain-smog=\nЗлодеи тоже заслуживают достижений.
mxlr-pet=\nЕго зовут Пушистик. Он съел трёх инженеров.
mxlr-puffer=\nЧто было раньше? Отвечаем: курица пятого поколения селекции.
mxlr-egg=\nА вот и яйцо. Философы снова в тупике.
mxlr-meat-plant=\nМиллион порций мясного продукта. Ингредиенты засекречены.
mxlr-cellulose=\nМиллион волокон. Хватит на все отчёты.
mxlr-shuttle=\nНаконец-то он полетит. В отличие от некоторых.
mxlr-build-together-1=\nРоботы построили больше, чем вы за всю жизнь. Не обижайтесь.
mxlr-build-together-2=\nВы больше не строитель. Вы менеджер роботов.
mxlr-spring-cleaning-1=\nПорядок — это когда мусор не видно.
mxlr-spring-cleaning-2=\nМиллион объектов разобрано. Спагетти никуда не делись.
mxlr-postman-1=\nПосылку можно забрать в любом робопорте.
mxlr-postman-2=\nА документы у вас есть?
mxlr-postman-3=\nВаш велосипед, кстати, тоже доставили.
mxlr-stoker-1=\nЦой бы оценил.
mxlr-stoker-2=\nЧёрное золото течёт рекой.
mxlr-stoker-3=\nДесять миллионов в час. Шахтёрские лёгкие уже вне закона.
mxlr-gold-science=\nНаука, которая стоит дороже вас.
mxlr-alien-science=\nНаучный подход к пришельцам: сначала стреляем, потом изучаем.
mxlr-iron-man=\nГений, миллиардер, плейбой, крафтер.
mxlr-heavyweight=\nДвери уже не открываются, жуки уже не прокусывают.
mxlr-haute-couture=\nПоследняя коллекция сезона: божественный бронированный стиль.
mxlr-breathe=\nДышите глубже — вы взволнованы. И отравлены.
mxlr-fancy-fish=\nРыба экстремального качества. Вкус экстремальный.
mxlr-mirv=\nДарить — так всем.
mxlr-nerve-agent=\nЖуки нервничают. Совсем.
mxlr-firestorm=\nПочувствуйте себя драконом.
mxlr-laser-show=\nБилеты распроданы. Зрители испарились.
mxlr-fish-day=\nТысяча рыб съедено. Котики плачут.
mxlr-poisoner=\nКогда простой свинец недостаточно грубо.
mxlr-swarm-1=\nРоботы поют «Мы — рой!». Не по-доброму.
mxlr-swarm-2=\nПятьсот дронов в воздухе — и ни одного разрешения на полёты.
