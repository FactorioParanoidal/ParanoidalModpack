[mod-name]
underground-energy-distribution=Underground Energy Distribution (Подземное распределение электроэнергии)

[mod-description]
underground-energy-distribution=Подземная прокладка электросети: прячьте провода под землю и освобождайте место на заводе.\n\nПодземные электрощиты (средний, опорный и огромный) передают энергию под землёй, как подземный конвейер: ставьте их в нужных местах, а пространство между ними остаётся свободным для построек. Опорный щит перекрывает большие расстояния, огромный открывается отдельной технологией. Локальный порт сборки Paranoidal на Factorio 2.0.

