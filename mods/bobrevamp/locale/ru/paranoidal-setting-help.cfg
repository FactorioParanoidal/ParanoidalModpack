[mod-setting-description]
bobmods-revamp-rtg=[item=satellite] Добавляет цепочку производства РИТЭГ Bob и связанные материалы и исследования. РИТЭГ используется как компонент спутников и продвинутой робототехники: сам этот предмет не ставится на карту как электростанция.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
