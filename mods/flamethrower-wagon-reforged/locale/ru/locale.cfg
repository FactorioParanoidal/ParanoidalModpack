flamethrower-wagon-reforged=Flamethrower Wagon Reforged (Огнемётный вагон — переработанный)

[mod-description]
flamethrower-wagon-reforged=Огнемётный вагон: вагон-цистерна с двумя огнемётными турелями, которые берут топливо из собственной цистерны.\n\nПоезд сам выжигает врагов вдоль путей — удобно для защиты длинных железных дорог и рейдов по гнёздам. Залейте в цистерну вагона горючую жидкость, подходящую для огнемётных турелей. Форк Flamethrower Wagon (fgardt) для сборки Paranoidal с низкой нагрузкой скрипта.

