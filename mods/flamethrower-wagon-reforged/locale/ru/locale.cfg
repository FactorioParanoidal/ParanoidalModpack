[entity-description]
flamethrower-wagon=Вагон-цистерна с двумя огнемётными турелями. Турели берут топливо для огнемёта из цистерны вагона.
flamethrower-wagon-turret=Огнемётная турель на огнемётном вагоне. Если её уничтожить, вагон погибнет вместе с ней.

