[mod-setting-description]
bobmods-power-accumulators=[item=accumulator] Adds Bob’s upgraded accumulators with different storage, charge and discharge characteristics. Disabling excludes this additional equipment family. Enabling does not grant free devices; craft and connect them to use them.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
bobmods-power-burnergenerator=[item=coal] Adds Bob’s burner generators that convert chemical fuel directly into electricity. Disabling excludes this additional equipment family. Enabling does not grant free devices; craft and connect them to use them.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
bobmods-power-fluidgenerator=[fluid=light-oil] Adds Bob’s generators that burn compatible liquid fuel to produce electricity. Disabling excludes this additional equipment family. Enabling does not grant free devices; craft and connect them to use them.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
bobmods-power-heatsources=[item=heat-pipe] Adds Bob’s fuel-burning heat sources, which heat a thermal network for power production through heat exchangers. Disabling excludes this additional equipment family. Enabling does not grant free devices; craft and connect them to use them.\n[color=#9cdcfe]Default: checkbox unchecked. Requires a game restart.[/color]
bobmods-power-nuclear=[item=nuclear-reactor] Adds Bob’s additional nuclear reactors and their recipes and research. Disabling excludes this additional equipment family. Enabling does not grant free devices; craft and connect them to use them.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
bobmods-power-poles=[item=big-electric-pole] Adds Bob’s extra tiers of electric poles and substations for transmitting and distributing power. Disabling excludes this additional equipment family. Enabling does not grant free devices; craft and connect them to use them.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
bobmods-power-solar=[item=solar-panel] Adds Bob’s extra solar-panel tiers for daytime power generation. Disabling excludes this additional equipment family. Enabling does not grant free devices; craft and connect them to use them.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
bobmods-power-steam=[item=steam-engine] Adds Bob’s upgraded steam equipment: boilers, steam engines, heat exchangers and turbines. Disabling excludes this additional equipment family. Enabling does not grant free devices; craft and connect them to use them.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
