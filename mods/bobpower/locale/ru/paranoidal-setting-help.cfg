[mod-setting-description]
bobmods-power-accumulators=[item=accumulator] Добавляет улучшенные аккумуляторы Bob: разные варианты ёмкости, зарядки и отдачи энергии. Отключение исключает эту дополнительную линейку из набора оборудования. Включение не выдаёт её бесплатно: устройства нужно изготовить и подключить.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
bobmods-power-burnergenerator=[item=coal] Добавляет топливные генераторы Bob, превращающие химическое топливо непосредственно в электричество. Отключение исключает эту дополнительную линейку из набора оборудования. Включение не выдаёт её бесплатно: устройства нужно изготовить и подключить.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
bobmods-power-fluidgenerator=[fluid=light-oil] Добавляет генераторы Bob, сжигающие подходящее жидкое топливо для выработки электричества. Отключение исключает эту дополнительную линейку из набора оборудования. Включение не выдаёт её бесплатно: устройства нужно изготовить и подключить.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
bobmods-power-heatsources=[item=heat-pipe] Добавляет топливные источники тепла Bob: они нагревают тепловую сеть для дальнейшего получения энергии через теплообменники. Отключение исключает эту дополнительную линейку из набора оборудования. Включение не выдаёт её бесплатно: устройства нужно изготовить и подключить.\n[color=#9cdcfe]По умолчанию: флажок снят. После перезапуска игры.[/color]
bobmods-power-nuclear=[item=nuclear-reactor] Добавляет дополнительные ядерные реакторы Bob и связанные с ними рецепты и исследования. Отключение исключает эту дополнительную линейку из набора оборудования. Включение не выдаёт её бесплатно: устройства нужно изготовить и подключить.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
bobmods-power-poles=[item=big-electric-pole] Добавляет дополнительные уровни опор ЛЭП и подстанций Bob для передачи и распределения электричества. Отключение исключает эту дополнительную линейку из набора оборудования. Включение не выдаёт её бесплатно: устройства нужно изготовить и подключить.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
bobmods-power-solar=[item=solar-panel] Добавляет дополнительные уровни солнечных панелей Bob для дневной выработки электричества. Отключение исключает эту дополнительную линейку из набора оборудования. Включение не выдаёт её бесплатно: устройства нужно изготовить и подключить.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
bobmods-power-steam=[item=steam-engine] Добавляет улучшенное паровое оборудование Bob: котлы, паровые машины, теплообменники и турбины. Отключение исключает эту дополнительную линейку из набора оборудования. Включение не выдаёт её бесплатно: устройства нужно изготовить и подключить.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
