[mod-name]
PipeVisualizer-Updated-reforged=Pipe Visualizer Reforged

[mod-description]
PipeVisualizer-Updated-reforged=A clear diagram of pipe networks over the map.\n\n— Y — highlight the fluid systems of the selected building.\n— Shift+Y — show every fluid system on the screen.\n— Alt+Y — highlight automatically under the mouse cursor.\n— Ctrl+Shift+Y — colour by fluid or by separate system.\n\nYou see at once where a network is broken and where every pipe goes, underground ones included. The diagram follows building, removal and rotation. It also works on the map; this can be turned off in the settings.

[controls]
pv-color-by-fluid-system=Color by fluid system
pv-toggle-mouseover=Toggle mouse-over pipe visualizer
pv-toggle-overlay=Toggle pipe visualizer overlay
pv-visualize-selected=Visualize selected pipe system

[message]
pv-color-by-fluid=Color by fluid
pv-color-by-system=Color by system
pv-mouseover-disabled=Disabled mouse-over pipe visualizer
pv-mouseover-enabled=Enabled mouse-over pipe visualizer

[mod-setting-name]
pv-entities-per-tick=Entities per tick
pv-overlay-opacity=Overlay opacity
pv-overlay-scale=Overlay range scale
pv-allow-ultrawide=Ultrawide support
pv-show-on-map=Show on the map
pv-color-pumps=Color pumps

[mod-setting-description]
pv-entities-per-tick=How many buildings are drawn per tick, shared by all players. Higher numbers draw faster and cost more UPS while drawing.
pv-overlay-opacity=Darkening of the overlay (Shift+Y) background: 0 is transparent, 1 is black.
pv-overlay-scale=Multiplies the overlay (Shift+Y) range, from 1 to 8. Useful on the map.
pv-allow-ultrawide=Doubles the overlay range for ultrawide screens.
pv-show-on-map=Also draw the diagram on the map. Without it there are half as many render objects.
pv-color-pumps=Color pumps and other buildings without a fluid segment of their own by the networks they connect. Off: grey.

[shortcut-name]
pv-toggle-mouseover=Toggle mouse-over pipe visualizer
pv-toggle-overlay=Toggle pipe visualizer overlay
