[mod-name]
PipeVisualizer-Updated-reforged=Pipe Visualizer Reforged (Визуализатор труб)

[mod-description]
PipeVisualizer-Updated-reforged=Наглядная схема трубопроводов поверх карты.\n\n— Y — подсветить системы жидкостей выбранной постройки.\n— Shift+Y — показать все жидкостные системы на экране.\n— Alt+Y — подсвечивать автоматически при наведении курсора.\n— Ctrl+Shift+Y — раскрашивать по жидкости или по отдельным системам.\n\nСразу видно, где смешались жидкости, где разрыв и куда идёт каждая труба, в том числе подземная. Схема обновляется при постройке, сносе и повороте. Работает и на карте, это можно отключить в настройках.

[controls]
pv-color-by-fluid-system=Цвет по системе жидкости
pv-toggle-mouseover=Вкл/выкл визуализатор труб при наведении мыши
pv-toggle-overlay=Вкл/выкл визуализатор труб
pv-visualize-selected=Визуализация выбранной системы труб

[message]
pv-color-by-fluid=Цвет по жидкости
pv-color-by-system=Цвет по системе
pv-mouseover-disabled=Визуализатор труб при наведении мыши отключён
pv-mouseover-enabled=Визуализатор труб при наведении мыши включен

[mod-setting-name]
pv-entities-per-tick=Сущностей за тик
pv-overlay-opacity=Непрозрачность оверлея
pv-overlay-scale=Масштаб области отображения схемы (полезен при просмотре карты)
pv-allow-ultrawide=Поддержка сверхширокого экрана
pv-show-on-map=Показывать схему на карте
pv-color-pumps=Окрашивать насосы на схеме

[mod-setting-description]
pv-entities-per-tick=Сколько построек рисуется за тик, на всех игроков вместе. Чем больше, тем быстрее появляется схема и тем сильнее нагрузка на игру, пока она рисуется.
pv-overlay-opacity=Затемнение фона оверлея (Shift+Y): 0 — прозрачный, 1 — чёрный.
pv-overlay-scale=Во сколько раз увеличить область оверлея (Shift+Y), от 1 до 8. Полезно при просмотре карты.
pv-allow-ultrawide=Удваивает область оверлея для сверхшироких экранов.
pv-show-on-map=Рисовать схему и на карте. Без неё объектов отрисовки вдвое меньше.
pv-color-pumps=Окрашивать насосы и другие постройки без собственного сегмента жидкости в цвет сетей, к которым они подключены. Если выключено — серые.

[shortcut-name]
pv-toggle-mouseover=Вкл/выкл визуализатор труб при наведении мыши
pv-toggle-overlay=Вкл/выкл визуализатор труб
