[entity-description]
beast-lair-core=Centre of the outbreak. Analyses samples, heals its creatures, runs its research on its own and stolen power and clones what it has analysed. Destroying it ends the outbreak: everything it took or made is set down and given to you, with a random defect from -5 to -1 where the refining workshop can repair it. No resistance to fire.

[the-beast]
arrived=Protomolecule impact at a mining outpost.
infected=Infected
assimilated=Assimilated
no-outpost=No mining outpost meets the landing conditions.
arrive-command-help=Drops the protomolecule on a mining outpost now, whatever the time, research and evolution: the furthest one away from the replicators. The outpost still has to meet the outpost settings. Not while an outbreak is going on.
already=An outbreak is already going on, so there is no new landing.
tier=Observation protocol. Stage __1__ of __2__: __3__ Movement speed: __4__%.
tier-1=Machines assimilated: assembling machines and furnaces can now be taken.
tier-2=Aggression: on raids it no longer avoids turrets and fights back.
tier-3=Armour: 15% of damage to its creatures and core is absorbed.
tier-4=Turrets assimilated: gun and laser turrets can now be taken. Its artillery fires at your turrets and radars in range.
tier-5=Transmission through fluids: pipes, tanks, pumps and flamethrower turrets can now be taken.
tier-6=Regeneration doubled at the lair. Armour: 30%.
tier-7=Mimicry: with a sample of a train stop, it puts a stop at the end of its track under the name of one of yours. Every train that stops there is infected.
tier-8=Transmission along copper wires: an infected electric pole passes it to the poles it is wired to.
tier-9=Roboports assimilated: an infected roboport launches corrupted robots.
tier-10=Armour: 45%. Raid parties are larger. Its artillery fires spore shells: where they land, the infection spreads.
rails-junction=Unidentified rail junction on your network.
ride-arrived=Unscheduled train at __1__.
core-destroyed=Protomolecule core destroyed. Its structures are breaking down. Seized and replicated buildings are returned with defects.
extinct=The protomolecule did not take hold: every carrier was destroyed before a core formed. Seized buildings are returned with defects.
unknown-technology=Paranoidal-Protomolecule-Beast: there is no technology "__1__" from the map settings, so the arrival doesn't wait for it.

