[mod-setting-description]
the-beast-health-multiplier=Maximum health of every Beast creature and corrupted robot. 1 is the original value.
the-beast-damage-multiplier=Damage of every Beast attack: strikes, drills, guns, thrown rocks, stomps, the corruption beam and the electric beam. 1 is the original value.
the-beast-infection-health=Health of the infection on a building. Shooting it off cures the building. The original value is 100, with 80% physical resistance.
the-beast-auto-arrival=Off: the Beast lands only by the /beast-arrive command or by another mod's script.
the-beast-first-arrival-minutes=Counted from the start of the game, or from when the mod was added to a game. When this time has passed, it also waits for the technology and the evolution below.
the-beast-arrival-technology=Internal name of a technology the player force must have researched first, for example military-2. Empty: it does not wait for research. If no technology has this name, a message is shown and the arrival doesn't wait for it.
the-beast-arrival-min-evolution=It lands once enemy evolution on the outpost's surface reaches a value picked at random between the lowest and the highest, once per map. 0 and 0: it does not wait for evolution.
the-beast-arrival-max-evolution=See the lowest. If the lowest is higher, the two are swapped.
the-beast-avoid-replicators=With Robot Army: Replicator Citadel, it lands on the side of the base away from the citadel: of the outposts there, the furthest out. If there are none there, the outpost most nearly on that side. Its lair is put on that side too. While the citadel is being sited it waits.
the-beast-retry-minutes=How often it looks for an outpost once it is allowed to arrive and has not found one.
the-beast-min-outpost-distance=Only mining drills at least this far from the player force's spawn count as an outpost. 0: any distance.
the-beast-min-outpost-drills=How many mining drills, including the one it lands on, there must be within the outpost radius.
the-beast-outpost-radius=Radius around the mining drill in which the other drills of the outpost are counted.
the-beast-first-infected-drills=How many mining drills nearest the landing point are infected right away.
the-beast-spread-speed=Every infection delay and the time until an infected inserter comes alive are divided by this. 2 is twice as fast, 0.5 is half as fast.
the-beast-infect-walls=Off: walls are never infected, and creatures don't climb onto them either. Already infected walls stay infected.
the-beast-infect-pipes=Off: they are never infected. Already infected ones stay infected.
the-beast-infect-poles=Off: they are never infected. Already infected ones stay infected.
the-beast-infect-turrets=Off: they are never infected. Already infected ones stay infected.
the-beast-infect-roboports=Off: they are never infected, so corrupted robots never appear. Already infected ones keep launching them.
the-beast-infect-trains=Off: locomotives and wagons are never infected, and there are no raids by train. Already infected trains keep driving.
the-beast-infect-energy=Steam engines and turbines, boilers and heat exchangers, burner generators, reactors, accumulators, solar panels and wind turbines. In an outbreak they are what it carries home first, as they are its power. Off: they are never infected. Already infected ones stay infected.
the-beast-infect-artillery=Artillery turrets and artillery wagons. In an outbreak they are carried home before anything but power. Off: they are never infected. Already infected ones stay infected.
the-beast-infect-vehicles=An infected car, tank or spidertron throws out whoever is inside. Inserters lift cars and tanks; a spidertron walks off by itself and joins its raids. Off: they are never infected. Already infected ones stay infected.
the-beast-inserters-awaken=Off: an infected inserter stays where it is and only passes the infection on. Applies to inserters infected after the change.
the-beast-compounds=Off: walking inserters don't gather around infected machines, chests, turrets, poles and trains to carry them off.
the-beast-wall-climbing=Off: creatures don't infect and climb onto walls to stand on stilts.
the-beast-landing-minutes=How long the infection spreads at the landing site. Then everything withdraws to the lair.
the-beast-lair-min-distance=The lair is this much further out from the base than the landing site, on dry land clear of your buildings, on ore if there is any. It is not shown on the map until that area is charted.
the-beast-lair-max-distance=See the nearest.
the-beast-buildup-min-minutes=From the founding of the core to the first raid, picked at random between the shortest and the longest.
the-beast-buildup-max-minutes=See the shortest.
the-beast-research-minutes=Each of its 10 research stages takes this long on the core's own power (1 MW). Power buildings carried to its lair add their full rated power without fuel and speed it up: about twice as fast at 5 MW more, at most 6 times. They also fill its energy store, which cloning and its electric turrets draw on.
the-beast-raid-interval-minutes=From the end of one raid to the start of the next, give or take 30%.
the-beast-raid-duration-minutes=How long the infection spreads at a raid's target once the party has got there. Then the party goes home.
the-beast-raid-radius=Around a raid's target the infection spreads while the raid lasts. Outside the landing site and a raid's target the infection does not spread. What is left infected there lies dormant until a zone covers it again.
the-beast-start-speed=Every creature's speed, as a share of its own pace, before any research. It rises evenly with each stage.
the-beast-end-speed=Every creature's speed after the last research stage.
the-beast-capture-ruins=Buildings of ruins that nobody has claimed with the claim tool, and what is left of partly taken apart ones, can be raided and infected like yours. Ruins near the lair are what it goes for before it will fight. Legendary ruins never.
the-beast-lair-clones=From analysed samples, for mass and energy: turrets around the core first, then any of them. Its turrets get ammunition for mass and power from its energy store. At most 60 turrets and 8 artillery turrets. When the core dies they are given to you, with defects.
the-beast-raid-clones=At a raid on your base, if it has analysed a turret. They break down when the raid goes home.
the-beast-lair-max-buildings=It clones nothing more once the lair has this many buildings, stolen or cloned. Not a limit on creatures.
the-beast-lair-artillery=From research stage 4, every artillery turret it holds, in its lair or infected where it stands, fires the base game's shell at your turrets and radars in range, for one unit of mass each. It needs no ammunition.
the-beast-spore-artillery=At the last research stage its artillery fires spore shells at any of your buildings in range instead: where one lands, a zone of the infection opens and the nearest few buildings are infected.
the-beast-lair-rails=Once it has taken a sample of rail (rails in the landing zone or at a raid) and analysed it, it works out a track from your rail nearest its lair, away from your signals and stops, and lays it from its own end, one piece every few seconds for energy, ending in a straight platform. The piece that joins your line goes in last, when nobody sees that spot, or after 15 minutes. The track is yours; whatever of it you take up it lays again. Trains it infects go home along it and are taken into the lair with what is in them.
the-beast-lure-station=From research stage 7, once it has a sample of a train stop (from a zone with one), it puts a stop at the end of its platform under the name of your stop nearest the lair. Every train that stops at it is infected and taken into the lair. When the core dies the stop is renamed.
the-beast-rail-raids=With its track joined and a locomotive taken, a raid may go by train: a train grown from what it took (a locomotive at each end if it has two) carries the party to one of your stops that it can reach and leave again, the one with the most it wants around it. What they lift there is carried home aboard. When the core dies the trains it holds are set down on its platform for you.
the-beast-junction-warning=A message and an alert when its track joins your line. Off: it joins quietly.
