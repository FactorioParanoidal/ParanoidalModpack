[mod-name]
Paranoidal-Protomolecule-Beast=Paranoidal-Protomolecule-Beast

[mod-description]
Paranoidal-Protomolecule-Beast=An alien protomolecule lands on your far mining outpost. It takes what it can without a fight and withdraws to a lair further out. There it takes apart what it carried off, researches on stolen power and builds up, quietly joins its own track to your railway, then raids your base and unclaimed ruins for more, on foot and by train: power first, then artillery, vehicles and trains. It can only make what it has taken apart. Destroying its core ends the outbreak and returns what it took or made, with defects.

