[entity-description]
beast-lair-core=Центр вспышки. Анализирует образцы, лечит существ, ведёт исследования на своей и украденной энергии и клонирует проанализированное. Уничтожение ядра прекращает вспышку: всё захваченное и сделанное ею ставится на землю и отдаётся вам со случайным браком от −5 до −1 там, где мастерская доводки может его исправить. Защиты от огня нет.

[the-beast]
arrived=Падение протомолекулы на добывающем аванпосте.
infected=Заражено
assimilated=Ассимилировано
no-outpost=Нет добывающего аванпоста, подходящего для падения.
arrive-command-help=Сразу сбрасывает протомолекулу на добывающий аванпост, без учёта времени, исследования и эволюции: на самый дальний в стороне от Репликаторов. Аванпост по-прежнему должен подходить под настройки аванпоста. Не действует, пока идёт вспышка.
already=Вспышка уже идёт, нового падения нет.
tier=Протокол наблюдения. Стадия __1__ из __2__: __3__ Скорость перемещения: __4__ %.
tier-1=Освоены машины: теперь захватываются сборочные автоматы и печи.
tier-2=Агрессия: на вылазках больше не обходит турели и вступает в бой.
tier-3=Броня: 15 % урона по существам и ядру гасится.
tier-4=Освоены турели: теперь захватываются пулемётные и лазерные турели. Её артиллерия обстреливает ваши турели и радары в радиусе досягаемости.
tier-5=Передача через жидкости: теперь захватываются трубы, резервуары, насосы и огнемётные турели.
tier-6=Регенерация в логове удвоена. Броня: 30 %.
tier-7=Мимикрия: имея образец станции, она ставит станцию в конце своего пути под именем одной из ваших. Каждый поезд, остановившийся там, заражается.
tier-8=Передача по медным проводам: заражённая опора ЛЭП передаёт заражение соединённым с ней опорам.
tier-9=Освоены дронстанции: заражённая дронстанция выпускает испорченных дронов.
tier-10=Броня: 45 %. Отряды вылазок крупнее. Её артиллерия стреляет споровыми снарядами: там, где они падают, распространяется заражение.
rails-junction=Неопознанное ответвление на вашей железной дороге.
ride-arrived=Внеплановый поезд на станции __1__.
core-destroyed=Ядро протомолекулы уничтожено. Её структуры распадаются. Захваченные и воспроизведённые постройки возвращены с браком.
extinct=Протомолекула не закрепилась: все носители уничтожены до образования ядра. Захваченные постройки возвращены с браком.
repelled=Падение протомолекулы отбито: всё заражение на аванпосте уничтожено. Вспышка окончена.
unknown-technology=Paranoidal-Protomolecule-Beast: технологии «__1__» из настроек карты нет, поэтому прилёт её не ждёт.

