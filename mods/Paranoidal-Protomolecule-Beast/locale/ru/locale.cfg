[mod-setting-description]
the-beast-health-multiplier=Максимальное здоровье всех существ Зверя и испорченных дронов. 1 — исходное значение.
the-beast-damage-multiplier=Урон всех атак Зверя: удары, буры, пулемёты, брошенные камни, топот, луч порчи и электрический луч. 1 — исходное значение.
the-beast-infection-health=Здоровье заражения на постройке. Если сбить его, постройка вылечена. Исходное значение — 100, при 80% защиты от физического урона.
the-beast-auto-arrival=Выкл.: Зверь высаживается только по команде /beast-arrive или по скрипту другого мода.
the-beast-first-arrival-minutes=Отсчёт от начала игры или от момента, когда мод добавлен в игру. По истечении этого времени прилёт ещё ждёт технологию и эволюцию, если они заданы ниже.
the-beast-arrival-technology=Внутреннее имя технологии, которую сила игрока должна изучить заранее, например military-2. Пусто — исследование не ждёт. Если технологии с таким именем нет, появится сообщение, и прилёт её ждать не будет.
the-beast-arrival-min-evolution=Падает, когда эволюция врагов на поверхности аванпоста достигнет значения, выбранного случайно между «от» и «до», один раз на карту. 0 и 0 — эволюцию не ждёт.
the-beast-arrival-max-evolution=См. «от». Если «от» больше, значения меняются местами.
the-beast-avoid-replicators=С модом «Цитадель Репликаторов» падает на стороне базы, противоположной цитадели: из аванпостов там — на самый дальний. Если там аванпостов нет — на аванпост, ближе всех к этой стороне. Логово тоже ставится на этой стороне. Пока цитадель выбирает место, падение ждёт.
the-beast-retry-minutes=Как часто искать аванпост, когда прилёт уже разрешён, а подходящий аванпост не найден.
the-beast-min-outpost-distance=Аванпостом считаются только буры не ближе этого расстояния к точке появления силы игрока. 0 — любое расстояние.
the-beast-min-outpost-drills=Сколько буров, включая тот, на который падает Зверь, должно быть в радиусе аванпоста.
the-beast-outpost-radius=Радиус вокруг бура, в котором считаются остальные буры аванпоста.
the-beast-first-infected-drills=Сколько ближайших к месту падения буров заражается сразу.
the-beast-spread-speed=На это число делятся все задержки распространения и время до оживления заражённого манипулятора. 2 — вдвое быстрее, 0,5 — вдвое медленнее.
the-beast-infect-walls=Выкл.: стены не заражаются, и существа на них не забираются. Уже заражённые стены остаются заражёнными.
the-beast-infect-pipes=Выкл.: не заражаются. Уже заражённые остаются заражёнными.
the-beast-infect-poles=Выкл.: не заражаются. Уже заражённые остаются заражёнными.
the-beast-infect-turrets=Выкл.: не заражаются. Уже заражённые остаются заражёнными.
the-beast-infect-roboports=Выкл.: дронстанции не заражаются, поэтому испорченные дроны не появляются. Уже заражённые продолжают их выпускать.
the-beast-infect-trains=Выкл.: локомотивы и вагоны не заражаются, и вылазок на поездах нет. Уже заражённые поезда продолжают ездить.
the-beast-infect-energy=Паровые машины и турбины, бойлеры и теплообменники, твердотопливные генераторы, реакторы, аккумуляторы, солнечные панели и ветряки. Во вспышке их уносят в логово в первую очередь: это её энергия. Выкл.: не заражаются. Уже заражённые остаются заражёнными.
the-beast-infect-artillery=Артиллерийские турели и артиллерийские вагоны. Во вспышке их уносят в логово сразу после энергии. Выкл.: не заражаются. Уже заражённые остаются заражёнными.
the-beast-infect-vehicles=Заражённый автомобиль, танк или паукотрон выбрасывает тех, кто внутри. Автомобили и танки поднимают манипуляторы; паукотрон уходит сам и участвует в её вылазках. Выкл.: не заражаются. Уже заражённые остаются заражёнными.
the-beast-inserters-awaken=Выкл.: заражённый манипулятор остаётся на месте и только передаёт заражение дальше. Действует на манипуляторы, заражённые после изменения.
the-beast-compounds=Выкл.: ходячие манипуляторы не собираются у заражённых машин, сундуков, турелей, опор и поездов, чтобы унести их.
the-beast-wall-climbing=Выкл.: существа не заражают стены и не встают на них, как на ходули.
the-beast-landing-minutes=Сколько времени заражение распространяется на месте падения. Затем всё отходит в логово.
the-beast-seed-minutes=Если при падении не образовался ни один носитель или все носители погибли до образования ядра, протомолекула не исчезает, а остаётся в заражённых постройках как очаг. Очаг затаивается, высасывает руду из-под своих буров, расширяет свою зону, ползёт по лентам и медным проводам к манипуляторам, энергетическим постройкам или к базе, при нехватке массы поглощает постройки аванпоста и наконец сам поднимает одну из своих построек как носителя. Это время созревания до носителя на собственной энергии очага; энергия из вашей сети ускоряет его: примерно вдвое при 5 МВт, не больше чем в 6 раз. Очаг гибнет, только когда вы вылечите или уничтожите всё заражённое.
the-beast-lair-min-distance=Логово на столько дальше от базы, чем место падения: на суше, в стороне от ваших построек, на руде, если она есть. На карте его не видно, пока эта местность не разведана.
the-beast-lair-max-distance=См. «от».
the-beast-buildup-min-minutes=От образования ядра до первой вылазки, случайно между «от» и «до».
the-beast-buildup-max-minutes=См. «от».
the-beast-research-minutes=Столько длится каждая из 10 стадий её исследований на собственной энергии ядра (1 МВт). Энергетические постройки, унесённые в логово, дают свою полную номинальную мощность без топлива и ускоряют исследования: примерно вдвое при 5 МВт сверху, не больше чем в 6 раз. Они же наполняют её запас энергии, из которого идут клонирование и её электрические турели.
the-beast-raid-interval-minutes=От конца одной вылазки до начала следующей, ±30 %.
the-beast-raid-duration-minutes=Сколько времени заражение распространяется у цели вылазки после прихода отряда. Затем отряд уходит домой.
the-beast-raid-radius=Вокруг цели вылазки заражение распространяется, пока идёт вылазка. Вне места падения и цели вылазки заражение не распространяется. Оставшееся там заражение спит, пока зона снова его не накроет.
the-beast-start-speed=Скорость каждого существа в долях его собственного темпа до исследований. Растёт равномерно с каждой стадией.
the-beast-end-speed=Скорость каждого существа после последней стадии исследований.
the-beast-capture-ruins=Постройки руин, которые никто не забрал инструментом захвата, и остатки частично разобранных руин можно заразить и унести, как ваши. Пока протомолекула избегает боя, она идёт в первую очередь к руинам у логова. Легендарные руины — никогда.
the-beast-lair-clones=Из проанализированных образцов, за массу и энергию: сначала турели вокруг ядра, затем любые. Её турели получают патроны за массу и энергию из её запаса. Не больше 60 турелей и 8 артиллерийских турелей. Когда гибнет ядро, они достаются вам — с браком.
the-beast-raid-clones=У цели вылазки на вашу базу, если она уже проанализировала турель. Распадаются, когда отряд уходит домой.
the-beast-lair-max-buildings=Когда в логове столько построек, украденных или клонированных, она больше ничего не клонирует. Это не предел числа существ.
the-beast-lair-artillery=С 4-й стадии исследований каждая её артиллерийская турель, в логове или заражённая на месте, стреляет обычным снарядом по вашим турелям и радарам в радиусе досягаемости, по единице массы за выстрел. Боеприпасы ей не нужны.
the-beast-spore-artillery=На последней стадии исследований её артиллерия вместо этого стреляет споровыми снарядами по любым вашим постройкам в радиусе: там, где снаряд падает, открывается зона заражения, и несколько ближайших построек заражаются сразу.
the-beast-lair-rails=Взяв образец рельсов (рельсы в зоне падения или вылазки) и проанализировав его, она намечает путь от вашего ближайшего к логову рельса, подальше от ваших сигналов и станций, и прокладывает его от своего конца, по куску в несколько секунд за энергию, с прямой платформой в конце. Кусок, врезающийся в вашу линию, она кладёт последним — когда это место никто не видит или через 15 минут. Путь ваш; что вы с него снимете, она кладёт снова. Заражённые ею поезда уходят по нему домой и забираются в логово вместе с содержимым.
the-beast-lure-station=С 7-й стадии исследований, имея образец станции (из зоны, где она была), она ставит станцию в конце своей платформы под именем вашей станции, ближайшей к логову. Каждый поезд, остановившийся на ней, заражается и забирается в логово. После гибели ядра станция переименовывается.
the-beast-rail-raids=Когда её путь врезан в вашу линию и у неё есть локомотив, вылазка может пойти на поезде: поезд, выращенный из захваченного (с локомотивом на каждом конце, если их два), везёт отряд к той вашей станции, куда он может доехать и откуда уехать, — к той, вокруг которой больше всего нужного ей. Поднятое там увозится домой на поезде. После гибели ядра её поезда ставятся на её платформу для вас.
the-beast-junction-warning=Сообщение и метка на карте, когда её путь врезается в вашу линию. Выкл.: врезка тихая.
the-beast-power-leech=Через заражённую постройку в вашей электросети она отбирает мощность под видом обычного потребителя, каждую секунду чуть больше, пока сети не перестанет хватать и у вас не замигает свет; тогда немного сбавляет и выжидает несколько минут, прежде чем начать снова. Не больше чем из 3 сетей, из каждой отдельно. Эта энергия ускоряет очаг, а после образования ядра — её исследования, и пополняет её запас энергии. Отбор прекращается, когда эту постройку вылечат или она исчезнет. Выкл.: энергию не отбирает.
the-beast-leech-max-mw=Больше этого из одной сети она не отбирает.
