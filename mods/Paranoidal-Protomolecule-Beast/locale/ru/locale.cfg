[mod-name]
Paranoidal-Protomolecule-Beast=Paranoidal-Protomolecule-Beast

[mod-description]
Paranoidal-Protomolecule-Beast=Инопланетная протомолекула падает на ваш дальний добывающий аванпост. Она захватывает то, что можно взять без боя, и отходит в логово дальше от базы. Если носители не образовались, она не гибнет: затаивается в заражённом, кормится рудой и вашей электроэнергией, ползёт по лентам и проводам и выращивает носителя сама. В логове она разбирает унесённое, проводит исследования на украденной энергии и копит силы, тихо врезает свой путь в вашу железную дорогу, а затем совершает вылазки на базу и в незахваченные руины за новым, пешком и на поездах: в первую очередь за энергией, затем за артиллерией, техникой и поездами. Она может сделать только то, что уже разобрала. Уничтожение её ядра прекращает вспышку и отдаёт вам захваченное и сделанное ею — с браком.

