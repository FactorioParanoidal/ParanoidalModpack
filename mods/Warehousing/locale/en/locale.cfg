[mod-setting-name]
Warehousing-copy-logistic-system=Match Logistic System research cost
Warehousing-icon-scaling=Scale inventory icons
Warehousing-sixteen-mode=Use 0.16 inventory sizes

[mod-setting-description]
Warehousing-copy-logistic-system=Copies the Logistic System research unit for Logistics Warehousing 2 and doubles its count, retaining the copied unit time. Paranoidal then sets its science packs separately to automation, logistic, chemical and advanced logistic science. The final pack list therefore is not simply the copied list.
Warehousing-icon-scaling=Enlarges the icons displayed in alt-mode to cover the whole building
Warehousing-sixteen-mode=Uses legacy capacities: warehouse 800 slots, storehouse 150; storage warehouse 2000 and storage storehouse 300. With this mode off, the initial capacities are 1800, 450, 2000 and 500 slots respectively.
