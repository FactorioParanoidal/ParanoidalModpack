[mod-setting-description]
Warehousing-copy-logistic-system=Берёт стоимость исследования «Складская логистика 2» из «Логистической системы» и удваивает число исследовательских единиц; время единицы тоже копируется. В Paranoidal состав научных пакетов затем задаётся отдельно: автоматический, логистический, химический и транспортный. Поэтому весь состав стоимости не копируется окончательно.
Warehousing-icon-scaling=Увеличивает иконки, отображаемые в alt-режиме для покрытия всего здания
Warehousing-sixteen-mode=Использует прежнюю вместимость: склад — 800 слотов, небольшой склад — 150; склад-хранилище — 2000, небольшое хранилище — 300. Без этого режима исходные значения соответственно 1800, 450, 2000 и 500 слотов.

