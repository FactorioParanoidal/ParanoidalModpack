[mod-name]
Warehousing=Warehousing Mod (Склады)

[mod-description]
Warehousing=Склады большой вместимости — когда сундуков уже не хватает.\n\n— Склад (6×6, 800 слотов) и Небольшой склад (3×3, 150 слотов) — против 48 слотов стального сундука.\n— Есть логистические версии обоих: пассивный и активный поставщик, хранилище, запросчик и буфер — для сети роботов.\n\nУдобны как центральное хранилище, буфер у станций и склад готовой продукции.

