[mod-setting-name]
zzzparanoidal-shipwreck-start=Start crash supplies

[mod-setting-description]
zzzparanoidal-shipwreck-start=Supplies in the crashed ship, its debris and the AAI wrecks and their mining loot on a new freeplay map. The player starts with an empty inventory.\nMinimum: half of the supplies; finished items that can be defective and all electric poles get a random defect (1–5).\nMedium: the full supplies, normal quality.\nRich: the full supplies; every finished item gets a random better quality (+1…+5).\nMaterials and intermediate products are always normal; every item type gets one quality per map. Ruins are not affected.

[string-mod-setting]
zzzparanoidal-shipwreck-start-minimum=Minimum (defects)
zzzparanoidal-shipwreck-start-medium=Medium
zzzparanoidal-shipwreck-start-rich=Rich (better quality)
