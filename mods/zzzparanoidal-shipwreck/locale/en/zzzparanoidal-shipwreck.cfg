[mod-setting-name]
zzzparanoidal-shipwreck-start=Start crash supplies

[mod-setting-description]
zzzparanoidal-shipwreck-start=Supplies in the crashed ship, its debris and the AAI wrecks and their mining loot on a new freeplay map. The player starts with an empty inventory.\nMinimum: half of the supplies; finished items that can be defective and all electric poles get a random defect: none 5%, −1 15%, −2 25%, −3 25%, −4 20%, −5 10%.\nMedium: the full supplies, normal quality.\nRich: the full supplies; every finished item gets a random quality: normal 25%, +1 30%, +2 20%, +3 13%, +4 8%, +5 4%.\nMaterials, intermediate products and belts are always normal; half of the repair packs (at least 10) are always normal, without defects; every item type gets one quality per map. Ruins are not affected.

[string-mod-setting]
zzzparanoidal-shipwreck-start-minimum=Minimum (defects)
zzzparanoidal-shipwreck-start-medium=Medium
zzzparanoidal-shipwreck-start-rich=Rich (better quality)
