[mod-setting-name]
zzzparanoidal-shipwreck-start=Припасы стартового крушения

[mod-setting-description]
zzzparanoidal-shipwreck-start=Припасы в разбившемся корабле, его обломках и обломках AAI, а также лут при их разборе в новой свободной игре. Игрок начинает с пустым инвентарём.\nМинимум: половина припасов; готовые предметы, которые могут быть бракованными, и все столбы получают случайный брак (1–5).\nСредний: все припасы, обычное качество.\nБогатый: все припасы; каждый готовый предмет получает случайное лучшее качество (+1…+5).\nМатериалы и промежуточные компоненты всегда обычные; у каждого типа предмета одно качество на карту. На руины не действует.

[string-mod-setting]
zzzparanoidal-shipwreck-start-minimum=Минимум (брак)
zzzparanoidal-shipwreck-start-medium=Средний
zzzparanoidal-shipwreck-start-rich=Богатый (лучшее качество)
