[mod-setting-name]
bv-highlight-maximum=Maximum highlights per tick
bv-container-passthrough=Container passthrough

[mod-setting-description]
bv-highlight-maximum=Per-game-tick highlighting budget shared by active belt-path traversals. It is divided between them; rounding can make the actual entity count slightly exceed this value. Smaller values spread preparation over more ticks. Clearing old drawings is processed separately.
bv-container-passthrough=Controls whether highlighted loaders will continue through containers.

[controls]
bv-highlight-belt=Highlight non-ghost belts
bv-highlight-ghost=Highlight belts
bv-toggle-hover=Toggle hover mode

[shortcut]
bv-toggle-hover=Toggle hover mode