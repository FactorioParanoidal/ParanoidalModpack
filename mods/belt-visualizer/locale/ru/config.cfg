[mod-setting-name]
bv-highlight-maximum=Максимальное количество подсветок за тик
bv-container-passthrough=Проход через контейнеры

[mod-setting-description]
bv-highlight-maximum=Глобальное максимальное количество конвейеров, которые будут подсвечиваться за один тик. Снижение значения приведет к замедлению скорости визуализации и повышению производительности.
bv-container-passthrough=Продолжать ли подсветку от погрузчика через контейнер к погрузчикам на его другой стороне.

[controls]
bv-highlight-belt=Подсветка конвейеров (без призраков)
bv-highlight-ghost=Подсветка конвейеров (включая призраки)
bv-toggle-hover=Переключить режим наведения курсора

[shortcut]
bv-toggle-hover=Переключить режим наведения курсора