[mod-setting-description]
start-with-basic-logistics=Marks the early Basic Logistics and Burner Mechanics technologies researched for every force, if present. The check runs when the mod is initialized, the mod configuration changes, or a new force is created. Turning this off does not undo research; changing the checkbox during play does not apply research immediately.
quick-start-science=[item=automation-science-pack] Number of automation science packs AAI adds to the crashed ship's chest on Nauvis on the map's first tick, if the ship is found. 0 adds none. Changing this setting in an already-running game does not grant additional packs retroactively.
aai-fast-motor-crafting=Paranoidal overrides AAI's faster crafting with its own balance. Base recipe times regardless of this checkbox: __ITEM__motor__ — 1 s, __ITEM__electric-motor__ — 1.5 s, __ITEM__iron-gear-wheel__ — 1.5 s, __ITEM__copper-cable__ — 2 s. This setting does not change the final times of these four recipes in the modpack.
aai-wide-drill=Paranoidal hides AAI's area-mining drill, recipe and technology regardless of this checkbox. It does not restore access to the drill, but still controls whether its prototypes are created. Do not disable it in a save with existing AAI area-mining drills: their prototypes are not created when it is off.
aai-burner-turbine-efficiency=[img=__aai-industry__/graphics/icons/burner-turbine.png] Percentage of fuel energy converted into electricity by the burner turbine generator. For example, 85 means 85% efficiency.
aai-fuel-processor=Adds a fuel processor to convert chemical fuels to a versatile processed fuel and gain energy in the process (energy gain % is a different setting). If disabled the tech is hidden at the start of the game.
aai-fuel-processor-efficiency=The percentage of bonus energy you get from the process. Higher values decrease the energy use of the fuel processor.
aai-stone-path=Adds rough stone path tiles that can be placed from stone.
wide-flashlight=AAI replaces the character flashlight with a wider beam, but Paranoidal subsequently replaces every character's light regardless of this checkbox. This switch does not select the final flashlight in this build.
enhanced-nightvision=Uses a nightvision LUT that does not desaturate the screen, it adds a slight green highlight to some shadows.
night-lut-set=In AAI, selects a dark or bright night filter; Vanilla leaves the original one. Paranoidal subsequently replaces these filters through NightBrightness. The modpack's final night colour is selected by NightBrightness's startup night-darkness setting, not this switch.

