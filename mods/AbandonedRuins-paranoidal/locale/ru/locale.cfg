[entity-description]
pd-legend-wall=Часть легендарной руины. Не разрушается и не разбирается.
pd-legend-lever=Добудьте, чтобы привести механизм в действие.
pd-relic-daedalus-workshop=Реликвия легендарных руин. Сборочный автомат без питания, скорость 2. Не даёт брака.
pd-relic-minelayer=Реликвия легендарных руин. Каждые 10 секунд ставит мину из своего ящика в радиусе до 14 клеток (не больше 24 мин вокруг), раз в минуту делает обычную мину сам.
pd-relic-sun-obelisk=Реликвия легендарных руин. Даёт 1 МВт днём и ночью без топлива.
pd-relic-all-seeing-eye=Реликвия легендарных руин. Радар без питания: видит вживую на 10 чанков вокруг и сканирует на 20.
pd-relic-deep-drill=Реликвия легендарных руин. Бур без питания, добывает с площади 9×9 со скоростью 1.
pd-relic-forerunner-gate=Реликвия легендарных руин. Встаньте на площадку — окажетесь у следующих врат своей команды на этой поверхности (врата образуют кольцо). Без питания.
pd-relic-archive=Реликвия легендарных руин. Лаборатория без питания: исследует вдвое быстрее и тратит вдвое меньше науки.
pd-relic-prism-turret=Реликвия легендарных руин. Лазерная турель без питания.
pd-relic-time-anchor=Реликвия легендарных руин. Когда игрок команды умирает, его снаряжение переносится в якорь (160 ячеек). Перезарядка 20 минут.
pd-relic-themis-scales=Реликвия легендарных руин. Превращает брак в стандарт: k+1 предметов качества −k становятся одним стандартным (6 штук −5 → 1).
pd-relic-hephaestus-forge=Реликвия легендарных руин. Печь без топлива, скорость 5. Не даёт брака.
pd-relic-champion-banner=Реликвия легендарных руин. Всегда горит; каждые 2 секунды чинит турели, стены и ворота своей команды в радиусе 24 клеток на 3% прочности.
pd-relic-xeno-incubator=Реликвия легендарных руин. Без питания выращивает артефакт пришельцев из 10 рыб за 30 секунд.
pd-relic-director-hive=Реликвия легендарных руин. Робопорт без питания.
pd-relic-heart-of-reactor=Реликвия легендарных руин. Даёт 5 МВт без топлива.
pd-relic-eternal-spring=Реликвия легендарных руин. Резервуар сам наполняется сырой нефтью: 20 единиц в секунду.
pd-relic-healing-spring=Реликвия легендарных руин. Лечит персонажей рядом (12 клеток) на 25 единиц здоровья в секунду.
pd-relic-hammer=Реликвия легендарных руин. Артиллерия сама заряжается: один снаряд в 30 секунд, пока внутри меньше пяти.
pd-relic-rescue-beacon=Реликвия легендарных руин. Радар без питания; каждые 30 минут принимает капсулу снабжения с материалами.
pd-relic-star-telescope=Реликвия легендарных руин. Радар без питания с огромной дальностью сканирования. При установке и каждые 10 минут отмечает на карте все легендарные руины этой поверхности.
pd-relic-yggdrasil-sprout=Реликвия легендарных руин. Без питания выращивает 4 древесины за 10 секунд и поглощает 120 единиц загрязнения в минуту.
pd-relic-funeral-bell=Реликвия легендарных руин. Игроки команды возрождаются рядом с колоколом на этой поверхности.

