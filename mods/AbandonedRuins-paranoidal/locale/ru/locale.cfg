[pd-legendary-lore]
labyrinth=Стены здесь не стареют и не поддаются ни кирке, ни взрывчатке. Где-то в глубине бродит тот, кто слышит каждый ваш шаг.
minesweeper=Сапёры прошлой колонии оставили своё последнее поле. Числа на плитах до сих пор говорят правду.
pyramid=Пирамида спит тысячи лет. Идол в погребальной камере — сердце её механизмов.
searchlight=Хранилище до сих пор охраняет автоматика. Прожекторы не устают, сторожа не спят.
dune=Песок здесь живой. Он помнит каждый шаг и слышит каждый мотор.
gates=Озеро без дна и девять платформ. Порталы предтеч работают, но давно сбились.
crypt=Архивариус берёг знания и не доверял памяти. Код от двери записан на табличках во дворе.
mirrors=Луч древнего излучателя всё ещё горит. Кристалл-приёмник ждёт света.
frozen=Здесь застыла одна минута, и она повторяется без конца.
bazaar=Безымянный торговец предтеч всё ещё ждёт покупателей. Он принимает только стандартные товары.
forge=Горн не остывал со дня основания мира. Пол зала дышит огнём в такт мехам.
colosseum=Трибуны пусты, но игры не закончились.
hive=Колония выросла вокруг чудовищной матки. Шесть кладок кормят её.
director=Обезумевший завод всё ещё вооружает собственную оборону.
reactor=Реактор проснётся, как только кто-то войдёт. Насосы охлаждения сломаны.
oilfield=Старые трубопроводы ещё полны газа. Достаточно искры.
quarantine=Станцию запечатали вместе с теми, кто внутри. Споры всё ещё растут.
hammer=Мортиры Молота бьют по всему, что движется на поле смерти.
mothership=Обломки корабля колонии, о котором этот мир не слышал.
observatory=Плато в кольце глубокой воды. Телескоп древних можно настроить ещё раз.
yggdrasil=Живой лабиринт вокруг Мирового древа. Лес не любит огня.
cemetery=Здесь похоронены первые колонисты. Не все из них спят спокойно.

[pd-legendary-hint]
labyrinth=Баллисты в столбах стреляют болтами, которые останавливает стена: красный луч — сигнал уйти за угол. Минотавр идёт на звук шагов: замрите на пару секунд, и он потеряет след. Четыре рычага в дальних тупиках глушат баллисты своего сектора и открывают святилище; убитый Минотавр тоже открывает его. Каждые несколько минут лабиринт перестраивается.
minesweeper=Наступите на клетку — она покажет, сколько мин среди восьми соседних. Ноль открывает соседей сам. Дойдите до дальнего ряда — откроются ворота тайника. Магнитометр у входа подсвечивает три безопасные клетки раз в две минуты.
pyramid=На плитах коридоров срабатывают ловушки: стрелы поперёк коридора, огонь, обрушение потолка. Возьмите идола из алтаря — пирамида начнёт рушиться: 45 секунд, чтобы выбежать с ним наружу. Успеете — откроется сокровищница у входа.
searchlight=Не попадайте в конус прожектора: стены и штабели ящиков закрывают обзор. Заметили — тревога, из караулок выбегает охрана; на третьей тревоге дверь хранилища запирается. Три рубильника в углах выключают по два прожектора.
dune=Шкала вибрации растёт, пока вы двигаетесь (втрое быстрее в машине), и падает, когда стоите. Полная шкала — из-под земли бросается Шай-Хулуд. Идите короткими перебежками. Тамперы отвлекают червя на полминуты. В сердце сиетча — награда, а после победы — бесконечная жила.
gates=На каждой платформе две площадки-портала, каждая переносит на какую-то платформу. Две платформы — ямы с червями. Запоминайте прыжки и найдите путь к сокровищнице на севере. Каждые три минуты две площадки меняются направлениями.
crypt=Каждая табличка называет руну кода: «столько, сколько таких-то предметов стоит в таком-то зале». Посчитайте в залах (там есть и лишние предметы), выставьте четыре диска у двери (добыча диска поворачивает его) и сорвите печать. Ошибка выпускает яд и хранителей склепа.
mirrors=Добыча зеркала поворачивает его. Направьте луч в кристалл-приёмник. Луч обжигает любого, кто его пересечёт.
frozen=Встаньте на песочные часы у входа — начнётся отсчёт. Пять ворот на пути к великим часам открывают рычаги в боковых комнатах. Когда время выйдет, всё вернётся к началу, а вы — к часам у входа. Изучите путь и пройдите его за один цикл. Фиолетовые плиты — густое время, они замедляют.
bazaar=Положите в прилавок указанные материалы стандартного качества — получите товары высокого качества (каждый прилавок торгует трижды). Реликвия в казне: внесите дань полностью или взломайте замок и сразитесь со стражем ярмарки. После ограбления торговец уходит.
forge=Полосы и клетки пола сначала светятся оранжевым, затем жгут — переходите в такт. Наковальня вспыхивает цветами трёх мехов по порядку; качните мехи в том же порядке. Неверный мех плюётся огнём.
colosseum=Выйдите на песок — ворота закроются. Десять волн гладиаторов и зверей. Между волнами в центре поднимается рычаг: забрать награду и уйти — или драться за лучшую (с пятой волны — знамя чемпиона). На песке можно строить турели и стены. Смерть или уход с арены начинают игры заново.
hive=Пока жива хоть одна кладка, Матка почти мгновенно залечивает раны. Кладки выпускают выводки, черви стерегут подходы, Матка плюётся кислотой. Убейте Матку — погибнет весь улей.
director=Турели каждого сектора получают патроны из мастерской по конвейеру; угольные склады держат мастерские в работе. Пока снабжается хоть один сектор, ядро Директора под щитом и выпускает боевых дронов. Ломайте мастерские, режьте конвейеры, уничтожайте склады — когда падёт последняя цепочка, щит исчезнет.
reactor=С вашим входом запускается отсчёт. Принесите по 20 ремкомплектов в люк каждого из трёх насосов и дёрните его рычаг. Радиация растёт к активной зоне, из обломков лезут мутанты. Время выйдет — ядерный взрыв уничтожит награду.
oilfield=Когда вы придёте, загорится дальняя скважина, и огонь пойдёт по трубам от узла к узлу; газовые линии передают его мгновенно. Закрывайте задвижки, чтобы отрезать огонь от склада. Каждый загоревшийся резервуар взрывается и сжигает часть награды; потеряете все четыре — склад погибнет.
quarantine=Внутри растёт шкала заражения (в облаках спор — гораздо быстрее); полная шкала отравляет и замедляет. Души обеззараживания сбрасывают её и перезаряжаются 20 секунд. Возьмите три пробы в заражённых лабораториях — каждая выпускает споры и заражённых, — и центральная лаборатория откроется.
hammer=Перед залпом места падения подсвечиваются красным — уходите. В блиндажах вдоль траншей вас не выберут целью. Доберитесь до каждой мортиры и заклепайте её рычагом; когда все четыре умолкнут, ворота откроются, и гарнизон даст последний бой.
mothership=Восемь отсеков за переборками. Красная, синяя и жёлтая двери открываются только кодами с терминалов других отсеков. Горят пожары, искрящие кабели оглушают, уцелевший экипаж стреляет в чужаков. Мостик в носу хранит последний груз корабля.
observatory=Настройте телескоп рычагом и удержите его три минуты: по дамбам пойдут растущие волны тварей. На плато можно строить что угодно. Падёт телескоп — древние восстановят его через минуту, и ритуал начнётся заново.
yggdrasil=Живые изгороди можно рубить, но через полминуты они отрастают. Корни-душители замедляют и ранят, по коридорам плывут споры, в тупиках затаились плеватели. Огонь запрещён: каждое пламя у древа сжигает часть награды, большой пожар уничтожит её.
cemetery=Каждая могила — лотерея: снаряжение высокого качества, пустота или беспокойные мертвецы. Каждая раскопанная могила растит гнев кладбища; на двадцати поднимется рой мертвецов, а могилы закроются. Основатель спит в склепе: раскопайте его могилу и победите его.

