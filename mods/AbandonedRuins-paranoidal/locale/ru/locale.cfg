[mod-name]
AbandonedRuins-paranoidal=Abandoned Ruins - Paranoidal (Заброшенные руины — Параноидал)

[mod-description]
AbandonedRuins-paranoidal=Набор руин сборки Paranoidal для «Заброшенных руин» — выбран по умолчанию.\n\n— 172 собственные руины трёх размеров (малые 8×8, средние 16×16, большие 32×32) с предметами и зданиями Bob's, Angels, Bio Industries, Clowns и AAI: склады, мастерские, свалки побочных продуктов, бракованные изделия системы качества, стартовые наборы и опасные аванпосты.\n— Плюс все руины набора «base» с рельсами, перестроенными под 2.0.\n— Руины не повторяются, пока не появится каждая руина своего размера, и по умолчанию не зависят от расстояния: хорошая (или опасная) руина может встретиться сразу за стартовой зоной.\n— 22 легендарные руины далеко за стартовой зоной: огромные испытания на несколько чанков — лабиринты, минные поля, пирамиды, крепости — со своими механиками и стражами. Каждая появляется один раз за карту; награда — предметы качества 4–10 и уникальные реликвии-здания.\n— Журнал находок: сообщение и метка на карте для каждой найденной руины, список — командой /ruins.\n\nСообщения, метки и легендарные руины (шанс, удалённость, свирепость стражей) настраиваются.

