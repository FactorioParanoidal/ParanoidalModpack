[mod-name]
AbandonedRuins-paranoidal=Заброшенные руины — Paranoidal

[mod-description]
AbandonedRuins-paranoidal=Набор руин Paranoidal: 168 новых руин и набор «base», без ранних повторов, журнал находок.

[mod-setting-name]
pd-ruins-include-base=Руины Paranoidal: добавить руины «base»
pd-ruins-discovery-messages=Руины Paranoidal: сообщения о находках
pd-ruins-map-tags=Руины Paranoidal: метки найденных руин на карте

[mod-setting-description]
pd-ruins-include-base=Добавляет 150 руин набора «base» (мод AbandonedRuins-base) в набор «Paranoidal», их рельсы из 1.1 перестроены под 2.0. Выключите, чтобы оставить только 168 руин Paranoidal. Действует на новые чанки.
pd-ruins-discovery-messages=Руина считается найденной, когда игрок с персонажем подходит к её краю ближе 20 клеток. О новом типе руин узнаёт вся команда, о повторной находке — только сам игрок. Работает для руин, появившихся после установки мода.
pd-ruins-map-tags=Ставит метку на карте на каждую найденную руину: череп — опасная, звезда — редкая, обычный маркер — остальные.

[string-mod-setting]
current-ruin-set-paranoidal=Paranoidal (все руины)

[pd-ruins]
discovered-new=__1__ нашёл новые руины: [color=yellow]__2__[/color]. Найдено типов руин: __3__ из __4__.
discovered-again=Руины: __1__ (этот тип уже встречался).
danger-hint=[color=red]Осторожно: здесь может быть оборона, черви или мины. Плитки опасности по краю — признак минного поля.[/color]
progress=Журнал руин: найдено типов __1__ из __2__ (малых __3__/__4__, средних __5__/__6__, больших __7__/__8__).
command-help=Показывает журнал найденных руин.
unknown-name=Руины «__1__»

