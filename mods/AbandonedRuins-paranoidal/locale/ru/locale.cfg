[mod-setting-description]
pd-ruins-include-base=Добавляет 150 руин набора «base» (мод AbandonedRuins-base) в набор «Paranoidal», их рельсы из 1.1 перестроены под 2.0. Выключите, чтобы оставить только 170 руин Paranoidal. Действует на новые чанки.
pd-ruins-discovery-messages=Руина считается найденной, когда игрок с персонажем подходит к её краю ближе 20 клеток. О новом типе руин узнаёт вся команда, о повторной находке — только сам игрок. Работает для руин, появившихся после установки мода.
pd-ruins-map-tags=Ставит метку на карте на каждую найденную руину: череп — опасная, звезда — редкая, обычный маркер — остальные.
pd-legendary-ruins=22 огромные руины-испытания со своими механиками, стражами и уникальными реликвиями. Появляются только далеко от старта и только в новых чанках.
pd-legendary-ferocity=Собственная настройка легендарных руин, не зависит от «Враждебной обороны руин». Легендарная — максимальная опасность. Суровая — урон ловушек ×0,55, стражи слабее, таймеры ×1,5. Перемирие — стражи не стреляют, ловушки не ранят, таймеры ×2; загадки остаются.
pd-legendary-chance=Вероятность заложить легендарную руину в новом чанке за пределами разрешённой дистанции.
pd-legendary-distance-chunks=Легендарные руины появляются не ближе этого числа чанков за краем стартовой зоны. Край стартовой зоны — наибольшее из зоны без руин ядра, стартовой области карты и стартового региона RSO. Чем больше стартовая зона, тем дальше легендарные руины.
pd-legendary-spacing-chunks=Наименьшее расстояние между краями двух легендарных руин.
pd-legendary-repeat=Выключено: каждая легендарная руина появляется один раз за карту. Включено: когда появились все 22, начинается новый круг.

