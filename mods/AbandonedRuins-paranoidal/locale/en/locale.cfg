[pd-legendary-lore]
labyrinth=These walls do not age and yield to neither pick nor explosive. Somewhere deep inside walks one who hears every step.
minesweeper=The sappers of an earlier colony left their last field. The numbers on the plates still tell the truth.
pyramid=The pyramid has slept for millennia. The idol in the burial chamber is the heart of its machinery.
searchlight=Automatons still guard the vault. Searchlights never tire, guards never sleep.
dune=The sand here is alive. It remembers every step and hears every engine.
gates=A bottomless lake and nine platforms. The portals of the Forerunners still work, but they have drifted.
crypt=The Archivist kept knowledge and did not trust memory. The door code is written on tablets in the yard.
mirrors=The beam of an ancient emitter still burns. The crystal receiver waits for light.
frozen=One minute froze here, and it repeats forever.
bazaar=A nameless Forerunner merchant still waits for customers. He accepts only standard goods.
forge=The forge has not cooled since the world began. The floor breathes fire in time with the bellows.
colosseum=The stands are empty, but the games are not over.
hive=A colony grew around a monstrous brood mother. Six clutches feed her.
director=A mad factory still arms its own defence.
reactor=The reactor wakes as soon as someone walks in. The coolant pumps are broken.
oilfield=The old pipelines are still full of gas. A spark is enough.
quarantine=The station was sealed with everyone inside. The spores still grow.
hammer=The mortars of the Hammer strike everything that moves on the killing field.
mothership=The wreck of a colony ship this world never heard of.
observatory=A plateau in a ring of deep water. The ancients' telescope can be attuned once more.
yggdrasil=A living maze around the World Tree. The forest hates fire.
cemetery=The first colonists are buried here. Not all of them rest in peace.

[pd-legendary-hint]
labyrinth=Ballistas in the pillars shoot bolts that walls stop: a red beam means get behind a corner. The Minotaur follows the sound of steps: stand still for a couple of seconds and it loses the trail. Four levers in far dead ends silence the ballistas of their sector and open the sanctum; killing the Minotaur opens it too. Every few minutes the maze rebuilds itself.
minesweeper=Step on a cell and it shows how many of its eight neighbours hold mines; a zero opens its neighbours. Reach the far row and the cache gate opens. The magnetometer at the entrance highlights three safe cells every two minutes.
pyramid=Plates in the corridors trigger traps: darts across the corridor, fire, a collapsing ceiling. Take the idol from the altar and the pyramid starts to collapse: 45 seconds to run out with it. Make it and the treasury at the entrance opens.
searchlight=Stay out of the searchlight cones: walls and crate stacks block their view. Spotted - alarm, guards run out of the guardhouses; on the third alarm the vault door locks. Three breakers in the corners switch off two searchlights each.
dune=The vibration meter grows while you move (three times faster in a vehicle) and falls while you stand. When it is full, Shai-Hulud bursts out of the ground. Move in short dashes. Thumpers draw the worm away for half a minute. The reward lies in the heart of the sietch, and after the victory an endless vein.
gates=Every platform has two portal pads, each sends you to some platform. Two platforms are worm pits. Remember the jumps and find the way to the treasury in the north. Every three minutes two pads trade destinations.
crypt=Each tablet names a rune of the code: "as many of these objects as stand in that hall". Count them in the halls (there are decoys), set the four dials at the door (mining a dial turns it) and break the seal. A wrong code releases poison and the crypt's keepers.
mirrors=Mining a mirror turns it. Guide the beam into the crystal receiver. The beam burns anyone who crosses it.
frozen=Step on the hourglass at the entrance and the countdown starts. Five gates on the way to the great clock are opened by levers in side rooms. When time runs out, everything returns to the start, and so do you. Learn the way and run it in one cycle. Purple plates are thick time: they slow you down.
bazaar=Put the listed standard-quality materials into a stall and get quality goods (each stall trades three times). The relic is in the treasury: pay the tribute in full or break the lock and face the bazaar's guardian. After a robbery the merchant leaves.
forge=Stripes and cells of the floor first glow orange, then burn - cross in rhythm. The anvil flashes the colours of the three bellows in order; work the bellows in the same order. A wrong bellows spits fire.
colosseum=Step onto the sand and the gate closes. Ten waves of gladiators and beasts. Between waves a lever rises in the centre: take the reward and leave - or fight on for a better one (the champion's banner from the fifth wave on). Turrets and walls may be built on the sand. Death or leaving the arena restarts the games.
hive=While any clutch lives, the Queen heals almost instantly. The clutches hatch broods, worms guard the approaches, the Queen spits acid. Kill the Queen and the whole hive dies.
director=Each sector's turrets get cartridges from a workshop over a conveyor; coal depots keep the workshops running. While any sector is supplied, the Director's core is shielded and sends gun drones. Break workshops, cut conveyors, destroy depots - when the last chain falls, the shield drops.
reactor=The countdown starts when you enter. Bring 20 repair packs into the hatch of each of the three pumps and pull its lever. Radiation grows towards the core, mutants crawl out of the wreckage. If time runs out, a nuclear blast destroys the reward.
oilfield=When you arrive, the far wellhead catches fire and the flames run along the pipes from junction to junction; gas lines pass them on at once. Close valves to cut the fire off from the depot. Every tank that catches fire explodes and burns part of the reward; lose all four and the depot is gone.
quarantine=An infection meter grows inside (much faster in spore clouds); a full meter poisons and slows. Decontamination showers reset it and recharge in 20 seconds. Take three samples in the infected labs - each releases spores and the infected - and the central lab opens.
hammer=Before a salvo the landing spots glow red - get out of the way. Nobody is targeted inside the bunkers along the trenches. Reach each mortar and spike it with its lever; when all four are silent the gate opens and the garrison makes its last stand.
mothership=Eight compartments behind bulkheads. The red, blue and yellow doors open only with codes from terminals in other compartments. Fires burn, sparking cables stun, the surviving crew shoot strangers. The bridge in the bow holds the ship's last cargo.
observatory=Attune the telescope with its lever and hold it for three minutes: growing waves of creatures come across the causeways. Anything may be built on the plateau. If the telescope falls, the ancients rebuild it a minute later and the ritual starts over.
yggdrasil=Hedges can be cut, but they grow back within half a minute. Strangling roots slow and hurt, spores drift through the corridors, spitters lurk in dead ends. Fire is forbidden: every flame near the tree burns part of the reward, a great fire destroys it.
cemetery=Every grave is a lottery: high-quality gear, nothing, or the restless dead. Each dug grave raises the wrath of the cemetery; at twenty a swarm of the dead rises and the graves close. The Founder sleeps in the crypt: dig his grave and defeat him.

