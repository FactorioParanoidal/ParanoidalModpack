[mod-name]
AbandonedRuins-paranoidal=Abandoned Ruins - Paranoidal

[mod-description]
AbandonedRuins-paranoidal=Paranoidal ruin set: 170 new ruins plus the "base" set, no early repeats, discovery journal. 22 legendary ruins far beyond the starting zone: challenges with their own mechanics, guardians, rewards of quality 4-10 and unique relics.

[mod-setting-name]
pd-ruins-include-base=Paranoidal ruins: include the "base" ruins
pd-ruins-discovery-messages=Paranoidal ruins: messages about found ruins
pd-ruins-map-tags=Paranoidal ruins: map markers on found ruins
pd-legendary-ruins=Legendary ruins
pd-legendary-ferocity=Legendary ruins: ferocity
pd-legendary-chance=Legendary ruins: chance per new chunk
pd-legendary-distance-chunks=Legendary ruins: chunks beyond the starting zone
pd-legendary-spacing-chunks=Legendary ruins: chunks between ruins
pd-legendary-repeat=Legendary ruins: repeat after all

[mod-setting-description]
pd-ruins-include-base=Adds the 150 ruins of the "base" set (mod AbandonedRuins-base) to the "Paranoidal" set, their 1.1 rails are rebuilt for 2.0. Disable to keep only the 170 Paranoidal ruins. Applies to newly generated chunks.
pd-ruins-discovery-messages=A ruin counts as found when a player with a character comes within 20 tiles of its border. A new ruin type is announced to the whole force, a repeated find only to the player. Works for ruins spawned after the mod was added.
pd-ruins-map-tags=Puts a map marker on every found ruin: skull for a dangerous one, star for a rare one, a plain marker for the rest.
pd-legendary-ruins=22 huge challenge ruins with their own mechanics, guardians and unique relics. They appear only far from the start and only in new chunks.
pd-legendary-ferocity=Own setting of the legendary ruins, independent of "hostile ruin defences". Legendary: maximum danger. Harsh: trap damage x0.55, weaker guardians, timers x1.5. Truce: guardians do not shoot, traps do not hurt, timers x2; the puzzles stay.
pd-legendary-chance=Chance to lay out a legendary ruin in a new chunk beyond the allowed distance.
pd-legendary-distance-chunks=Legendary ruins appear no closer than this many chunks beyond the edge of the starting zone. The edge is the largest of the core's ruin-free zone, the map's starting area and the RSO starting region. A bigger starting zone pushes them further out.
pd-legendary-spacing-chunks=Smallest distance between the borders of two legendary ruins.
pd-legendary-repeat=Off: every legendary ruin appears once per map. On: when all 22 have appeared, a new round begins.

