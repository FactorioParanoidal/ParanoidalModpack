[entity-description]
pd-legend-wall=Part of a legendary ruin. Cannot be destroyed or mined.
pd-legend-lever=Mine it to set the mechanism in motion.
pd-relic-daedalus-workshop=Relic of the legendary ruins. Assembling machine without power, speed 2. Adds no defects.
pd-relic-minelayer=Relic of the legendary ruins. Every 10 seconds plants a mine from its chest within 14 tiles (at most 24 mines around), makes an ordinary mine itself once a minute.
pd-relic-sun-obelisk=Relic of the legendary ruins. Gives 1 MW day and night without fuel.
pd-relic-all-seeing-eye=Relic of the legendary ruins. Radar without power: live view 10 chunks around, scans 20.
pd-relic-deep-drill=Relic of the legendary ruins. Drill without power, mines a 9x9 area at speed 1.
pd-relic-forerunner-gate=Relic of the legendary ruins. Step on the pad to arrive at the next gate of your force on this surface (gates form a ring). No power needed.
pd-relic-archive=Relic of the legendary ruins. Lab without power: researches twice as fast and uses half the science.
pd-relic-prism-turret=Relic of the legendary ruins. Laser turret without power.
pd-relic-time-anchor=Relic of the legendary ruins. When a player of the force dies, the gear goes into the anchor (160 slots). Recharge 20 minutes.
pd-relic-themis-scales=Relic of the legendary ruins. Turns defects into standard: k+1 items of grade -k become one standard item (6 of -5 make 1).
pd-relic-hephaestus-forge=Relic of the legendary ruins. Furnace without fuel, speed 5. Adds no defects.
pd-relic-champion-banner=Relic of the legendary ruins. Always lit; every 2 seconds repairs turrets, walls and gates of its force within 24 tiles by 3%.
pd-relic-xeno-incubator=Relic of the legendary ruins. Without power raises an alien artifact from 10 fish in 30 seconds.
pd-relic-director-hive=Relic of the legendary ruins. Roboport without power.
pd-relic-heart-of-reactor=Relic of the legendary ruins. Gives 5 MW without fuel.
pd-relic-eternal-spring=Relic of the legendary ruins. A tank that fills itself with crude oil: 20 per second.
pd-relic-healing-spring=Relic of the legendary ruins. Heals characters nearby (12 tiles) by 25 health per second.
pd-relic-hammer=Relic of the legendary ruins. Artillery that loads itself: one shell every 30 seconds while it holds fewer than five.
pd-relic-rescue-beacon=Relic of the legendary ruins. Radar without power; receives a supply pod with materials every 30 minutes.
pd-relic-star-telescope=Relic of the legendary ruins. Radar without power with a huge scanning range. When built and every 10 minutes it marks all legendary ruins of this surface on the map.
pd-relic-yggdrasil-sprout=Relic of the legendary ruins. Without power grows 4 wood every 10 seconds and absorbs 120 pollution per minute.
pd-relic-funeral-bell=Relic of the legendary ruins. Players of the force respawn next to the bell on this surface.

