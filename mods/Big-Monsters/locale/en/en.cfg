[mod-setting-description]
bm-event-days=[img=utility/clock] Scheduled-event interval in fixed days: here 1 day is 7 game minutes, independent of the day/night cycle. Repeated events wait 5–9 × the value in minutes; silo raids wait 3–5 × the value. A value of 0 pauses both timers, not other event sources. A new nonzero value does not reschedule the already pending event.
bm-enable-silo-attack=If enabled, you will be seriously attacked after the Rocket-Silo is built
bm-big-enemy-hp-multiplier=[img=utility/character_health_bonus_modifier_icon] Health multiplier for Big Monsters large enemies. Also used for the mod’s saboteurs and boss worms, not just giants. A value of 1 leaves calculated health unchanged; 2 doubles it.
bm-big-enemy-hp-variant=Changes the health-versus-level curve of large monsters. Their level is raised to this power, and calculated health is also divided by this value. A larger value therefore does not necessarily make low-tier monsters tougher; it is not a simple health multiplier.
bm-worm-enemy-hp-multiplier=Legacy health setting (0.2–10; original default 1). Current Big Monsters and mferrari_lib code does not connect this field to health calculation. The generators use the separate big-enemy health multiplier; changing this legacy field does not replace it.
bm-enemy-hp-multiplier=Legacy health setting (0.2–10; original default 1). Current Big Monsters and mferrari_lib code does not connect this field to health calculation. The generators use the separate big-enemy health multiplier; changing this legacy field does not replace it.
bm-enemy-damage-multiplier=[img=utility/shoot_cursor_green] Multiplies damage of Big Monsters creatures and armed enemies by this factor. A value of 1 leaves damage unchanged; 2 doubles it. It is not a global damage multiplier for all biters and mods.
bm-swarm-chance=[entity=small-biter] Chance to select an event involving a swarm, in percent. Checked after more dangerous events and subject to evolution limits; it is not a share of a total event weight. A value of 0 excludes it from this random selection.
bm-invasion-chance=[entity=small-biter] Chance to select an event involving an underground invasion, in percent. Checked after more dangerous events and subject to evolution limits; it is not a share of a total event weight. A value of 0 excludes it from this random selection.
bm-worms-chance=[entity=behemoth-worm-turret] Chance to select an event involving large worms, in percent. Checked after more dangerous events and subject to evolution limits; it is not a share of a total event weight. A value of 0 excludes it from this random selection.
bm-soldiers-chance=[img=utility/shoot_cursor_green] Chance to select an event involving armed saboteurs, in percent. Checked after more dangerous events and subject to evolution limits; it is not a share of a total event weight. A value of 0 excludes it from this random selection.
bm-biterzilla-chance=[entity=behemoth-biter] Chance to select an event involving a leviathan, in percent. Checked after more dangerous events and subject to evolution limits; it is not a share of a total event weight. A value of 0 excludes it from this random selection.
bm-volcano-chance=[img=utility/danger_icon] Chance to select an event involving a volcanic eruption, in percent. Checked after more dangerous events and subject to evolution limits; it is not a share of a total event weight. A value of 0 excludes it from this random selection.
bm-spidertron-chance=[item=spidertron] Chance to select an event involving an enemy Spidertron, in percent. Checked after more dangerous events and subject to evolution limits; it is not a share of a total event weight. A value of 0 excludes it from this random selection.
bm-demolisher-chance=Chance to select an event involving a demolisher, in percent. Checked after more dangerous events and subject to evolution limits; it is not a share of a total event weight. A value of 0 excludes it from this random selection. Without Space Age, this event type is disabled regardless of the value.
bm-allow-nuker=[item=atomic-bomb] Allows nuclear-rocket saboteurs when evolution is strictly above 96%. Turning it off excludes that type from future random soldier selection, but does not remove existing ones.
bm-difficulty-level=[entity=behemoth-biter] Increases enemy counts, wave counts and the duration of some Big Monsters events. This is a difficulty level from 1 to 10, not a single health or damage multiplier for all enemies.
bm-invasion-min_evo=[entity=small-biter] Minimum evolution for an event involving an underground invasion, as a fraction: 0.4 means 40%. It cannot be selected below the threshold; reaching it only permits the chance check, not an immediate event.
bm-soldiers-min_evo=[img=utility/shoot_cursor_green] Minimum evolution for an event involving armed saboteurs, as a fraction: 0.4 means 40%. It cannot be selected below the threshold; reaching it only permits the chance check, not an immediate event.
bm-worms-min_evo=[entity=behemoth-worm-turret] Minimum evolution for an event involving large worms, as a fraction: 0.4 means 40%. It cannot be selected below the threshold; reaching it only permits the chance check, not an immediate event.
bm-biterzilla-min_evo=[entity=behemoth-biter] Minimum evolution for an event involving a leviathan, as a fraction: 0.4 means 40%. It cannot be selected below the threshold; reaching it only permits the chance check, not an immediate event.
bm-spidertron-min_evo=[item=spidertron] Minimum evolution for an event involving an enemy Spidertron, as a fraction: 0.4 means 40%. It cannot be selected below the threshold; reaching it only permits the chance check, not an immediate event.
bm-demolisher-min_evo=Minimum evolution for an event involving a demolisher, as a fraction: 0.4 means 40%. It cannot be selected below the threshold; reaching it only permits the chance check, not an immediate event. Without Space Age, this event type is disabled regardless of the value.
bm-volcano-min_evo=[img=utility/danger_icon] Minimum evolution for an event involving a volcanic eruption, as a fraction: 0.4 means 40%. It cannot be selected below the threshold; reaching it only permits the chance check, not an immediate event.
bm-tree-events-chance=If a player mines a tree, this is the chance of something bad happens
bm-swarm-max_evo=If evolution if higher than this value, the event does not happen anymore
bm-volcano-max_evo=If evolution if higher than this value, the event does not happen anymore
bm-spawn_near_nests=Most enemy attacks will be spawned near enemy nests, if possible
bm-events-when-peaceful=Allows events in peaceful mode, with enemy base size set to None, or during the Rampant truce. Does not override Factorio's No Enemies mode.


