[mod-setting-description]
bm-flying-saucer-chance=[entity=maf_flying_saucer_1] Percentage chance of choosing a flying-saucer event at an eligible check. A value of 0 disables these raids. Evolution requirements and earlier event priorities still apply, so a high value still does not guarantee a raid at every check.\n[color=#9cdcfe]Default: 12. Range: 0–80. Shared map setting.[/color]
bm-flying-saucer-min_evo=[entity=maf_flying_saucer_1] Minimum enemy evolution for checking a flying-saucer event: 0.5 means 50%. Reaching the threshold permits a chance check rather than guaranteeing a raid. Event frequency and saucer probability are separate settings.\n[color=#9cdcfe]Default: 0.8. Range: 0–0.95. Shared map setting.[/color]
bm-play-sound-alert=[item=programmable-speaker] Plays Big-Monsters event sounds for the affected player force. Turning it off mutes these sounds without disabling text alerts, cameras, or events.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
bm-show-alerts=[img=utility/notification] Shows event text notices to the affected player force. Turning it off hides those notices without disabling sounds, cameras, or events.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
bm-show-cameras=[img=utility/gps_map_icon] Allows a camera window for events whose handler creates one, shown to the affected player force. Turning it off suppresses those cameras but does not stop events or alerts; not every event creates a camera.\n[color=#9cdcfe]Default: checkbox checked. Shared map setting.[/color]
bm-spidertron-nuke=[item=spidertron] Enables Big-Monsters Spidertron bosses to periodically load five small nuclear rockets when they have fewer than five. It does not affect player Spidertrons or trigger the event itself; switching it off does not unload existing ammunition.\n[color=#9cdcfe]Default: checkbox unchecked. Shared map setting.[/color]
bm_camera_size=[img=utility/gps_map_icon] Width and height of the image in new Big-Monsters camera windows, in interface pixels. A larger value makes a larger window without changing its zoom factor. Camera creation has a separate switch.\n[color=#9cdcfe]Default: 230. Range: 230–700. Personal setting.[/color]
bm_draggable_camera=[img=utility/gps_map_icon] Chooses where new Big-Monsters cameras appear: on gives floating windows draggable by their title bars; off docks them to the left panel. This setting does not itself enable camera creation.\n[color=#9cdcfe]Default: checkbox unchecked. Personal setting.[/color]
