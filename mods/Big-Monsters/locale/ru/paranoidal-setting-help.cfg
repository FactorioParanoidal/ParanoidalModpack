[mod-setting-description]
bm-flying-saucer-chance=[entity=maf_flying_saucer_1] Шанс выбрать событие с летающей тарелкой при подходящей проверке, в процентах. 0 отключает такие налёты. Порог эволюции и приоритет других событий всё равно действуют: высокое значение не гарантирует налёт при каждой проверке.\n[color=#9cdcfe]По умолчанию: 12. Диапазон: 0–80. Общая настройка карты.[/color]
bm-flying-saucer-min_evo=[entity=maf_flying_saucer_1] Минимальная эволюция врагов для проверки события с летающей тарелкой: 0,5 означает 50%. Достижение порога лишь разрешает проверку шанса, а не гарантирует налёт. Частота событий и вероятность тарелки задаются отдельно.\n[color=#9cdcfe]По умолчанию: 0,8. Диапазон: 0–0,95. Общая настройка карты.[/color]
bm-play-sound-alert=[item=programmable-speaker] Включает звуковые сигналы событий Big Monsters для соответствующей команды. Выключение отключает эти звуки, но не текстовые предупреждения, камеры или сами события.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
bm-show-alerts=[img=utility/notification] Показывает текстовые сообщения о событиях игрокам соответствующей команды. Выключение скрывает эти сообщения, но не отключает звуки, камеры или события.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
bm-show-cameras=[img=utility/gps_map_icon] Разрешает показывать игрокам соответствующей команды окна камер для событий, в которых предусмотрена камера. Выключение скрывает такие камеры, но не останавливает события и не отключает предупреждения; камера создаётся не для каждого события.\n[color=#9cdcfe]По умолчанию: флажок установлен. Общая настройка карты.[/color]
bm-spidertron-nuke=[item=spidertron] Включает периодическую загрузку пяти маленьких ядерных ракет в паукотронов-боссов Big Monsters, если у такого босса меньше пяти. Не относится к паукотронам игрока и не вызывает само событие; уже выданные ракеты при выключении не выгружаются.\n[color=#9cdcfe]По умолчанию: флажок снят. Общая настройка карты.[/color]
bm_camera_size=[img=utility/gps_map_icon] Ширина и высота изображения в новых окнах камеры Big Monsters, в пикселях интерфейса. Больший размер показывает более крупное окно, но не меняет коэффициент приближения. Появление камер разрешается отдельно.\n[color=#9cdcfe]По умолчанию: 230. Диапазон: 230–700. Только для вас.[/color]
bm_draggable_camera=[img=utility/gps_map_icon] Выбирает размещение новых камер Big Monsters: включено — свободные окна, которые можно перетаскивать за заголовок; выключено — закреплённая панель слева. Само появление камер эта настройка не включает.\n[color=#9cdcfe]По умолчанию: флажок снят. Только для вас.[/color]
