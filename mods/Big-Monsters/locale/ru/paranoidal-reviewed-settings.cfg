[mod-setting-description]
bm-biterzilla-min_evo=[entity=behemoth-biter] Минимальная эволюция для события левиафана, как доля: 0,4 означает 40%. Ниже порога оно не выбирается; достижение порога лишь разрешает проверку шанса, а не запускает событие сразу.
bm-demolisher-chance=Вероятность выбора события разрушителя, в процентах. Проверяется после более опасных событий и с учётом порогов эволюции; это не доля в общем весе событий. 0 исключает событие из этого случайного выбора. Без Space Age этот тип событий отключён независимо от значения.
bm-demolisher-min_evo=Минимальная эволюция для события разрушителя, как доля: 0,4 означает 40%. Ниже порога оно не выбирается; достижение порога лишь разрешает проверку шанса, а не запускает событие сразу. Без Space Age этот тип событий отключён независимо от значения.
