[mod-name]
defence-tower-reforged=Defence Tower Reforged

[mod-description]
defence-tower-reforged=Defense tower: repairs friendly buildings, vehicles and characters in its square with repair packs from its own slot. After the "Shield generation" research it also protects the turrets in the same square with an energy shield charged by the electric network: a hit that would destroy a turret is absorbed, turret damage is repaired from the shield. Paranoidal mod built from Repair Turret (Klonan) and King's Turret Shields (Kingdud).

[mod-setting-name]
kts-energy-per-hp=Energy per shield point (kJ)
kts-base-shield=Base shield points per turret share
kts-base-recharge=Base regeneration per turret share (points per second)
kts-idle-drain=Shield idle drain (% of shield points, kW)
kts-research=Shields need research
kts-size-steps=Capacity levels per ×10
kts-rate-steps=Regeneration levels per ×10
kts-max-level=Maximum shield research level
kts-tower-share=Turret shares per tower shield
kts-animated-effect=Animated hit effect

[mod-setting-description]
kts-energy-per-hp=Energy that one point of repaired or absorbed damage takes from the shield, and that one point of regeneration takes from the network.
kts-base-shield=Shield points of one turret share before any capacity research. A tower shield holds as many shares as set below.
kts-base-recharge=Regeneration of one turret share before any regeneration research.
kts-idle-drain=Constant draw of every tower shield. 10 means: a shield of 1000 points draws 100 kW.
kts-research=Off: every force except enemies gets tower shields at once, without the shield technologies, with base values. The defense tower itself still needs its research.
kts-size-steps=Number of capacity levels that multiply the shield points by 10.
kts-rate-steps=Number of regeneration levels that multiply the regeneration by 10.
kts-max-level=Highest level of both shield upgrade technologies. Every pair of levels is a separate hidden entity, (N+1)² in total.
kts-tower-share=A tower shield has the points, regeneration and drain of this many turret shares.
kts-animated-effect=Off: a plain flash instead of the animated bubble when a hit is absorbed.

[entity-name]
repair-turret=Defense tower
kts-shield-buffer=Defense tower (shield energy)

[entity-description]
repair-turret=Repairs damaged friendly buildings, vehicles and characters in a square around itself: 14×14 tiles (7 from the centre), 20 HP/s, one target. Range, speed and simultaneous targets grow with research; the area is shown on hover. Needs repair packs in its own slot: one pack repairs as much as by hand.\nAfter "Shield generation" it also protects the turrets of your force in the same square with an energy shield: a hit that would destroy a turret is absorbed, turret damage is repaired from the shield without repair packs. It does not protect itself.\nPower: repair 500 kW idle and 1 MW per 20 HP/s; the shield has its own energy buffer.
kts-shield-buffer=Hidden energy buffer of a defense tower shield.

[technology-name]
repair-turret=Defense tower
repair-turret-speed=Defense tower repair speed
repair-turret-beams=Defense tower beams
repair-turret-range=Defense tower range
turret-shields-base=Shield generation
turret-shields-size=Shield capacity
turret-shields-speed=Shield regeneration

[technology-description]
repair-turret=A tower that repairs nearby friendly buildings with repair packs. Later research gives it a shield for the turrets around it.
repair-turret-speed=Defense towers repair faster. Energy and repair packs per HP stay the same, so consumption grows with speed.
repair-turret-beams=The defense tower repairs one more target at the same time. Each beam uses its own energy and repair packs.
repair-turret-range=The square of defense towers grows by 1 tile in every direction, for repair and for the shield.
turret-shields-base=Defense towers protect the turrets of your force in their square with an energy shield charged by the electric network. Unlocks the turret shield toggle in the shortcut bar.
turret-shields-size=Increases the shield points of all defense towers.
turret-shields-speed=Increases the shield regeneration of all defense towers.

[modifier-description]
repair-turret-speed=Defense tower repair speed: +__1__%
repair-turret-beams=Simultaneous repair targets: +__1__
repair-turret-range=Defense tower range: +__1__
turret-shields-base=Defense towers protect turrets with a shield
turret-shields-size=Defense tower shield capacity increased
turret-shields-speed=Defense tower shield regeneration increased

[item-name]
kts-shield-toggle=Turret shield toggle

[item-description]
kts-shield-toggle=Select turrets to take them out of the shield of defense towers (they are repaired by beams then).\nHold Shift to give the shields back to the selected turrets.

[shortcut-name]
kts-shield-toggle=Turret shield toggle

[shortcut-description]
kts-shield-toggle=Select turrets to take them out of the shield of defense towers (they are repaired by beams then).\nHold Shift to give the shields back to the selected turrets.

[kts]
command-stats=Defense tower values of your force: shield points, regeneration, power, square and counts.
command-rebuild=Admin: rebuilds all defense towers (repair zones, shield buffers, protected turrets).
stats-off=Shield generation is not researched for your force. Defense towers: __1__, square ±__2__ tiles.
stats=Tower shield: __1__ points, regeneration __2__ points/s, idle drain __3__ kW, regeneration draw up to __4__ kW, square ±__5__ tiles. Towers with a shield: __6__, protected turrets: __7__, stored __8__ points. Levels: capacity __9__, regeneration __10__. Absorbed hits: __11__, shield repairs: __12__.
admin-only=Only an admin can use this command.
rebuilt=Defense towers rebuilt: __1__ towers, __2__ protected turrets.
