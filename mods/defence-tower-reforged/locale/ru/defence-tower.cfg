[mod-name]
defence-tower-reforged=Defence Tower Reforged (Защитная башня)

[mod-description]
defence-tower-reforged=Защитная башня: чинит дружественные постройки, технику и персонажей в своём квадрате ремкомплектами из собственного слота. После исследования «Генерация щитов» ещё и защищает турели в том же квадрате энергетическим щитом, который заряжается от электросети: удар, который уничтожил бы турель, поглощается, урон турелей чинится за счёт щита. Мод Paranoidal на основе Repair Turret (Klonan) и King's Turret Shields (Kingdud).

[mod-setting-name]
kts-energy-per-hp=Энергия на единицу щита (кДж)
kts-base-shield=Базовая прочность щита на долю турели
kts-base-recharge=Базовая регенерация на долю турели (единиц в секунду)
kts-idle-drain=Потребление щита в покое (% прочности, кВт)
kts-research=Щиты требуют исследования
kts-size-steps=Уровней ёмкости на ×10
kts-rate-steps=Уровней регенерации на ×10
kts-max-level=Максимальный уровень исследований щита
kts-tower-share=Долей турели в щите башни
kts-animated-effect=Анимированный эффект попадания

[mod-setting-description]
kts-energy-per-hp=Сколько энергии щит тратит на одну единицу починенного или поглощённого урона и сколько берёт из сети на одну единицу регенерации.
kts-base-shield=Прочность щита одной доли турели до исследований ёмкости. В щите башни столько долей, сколько задано ниже.
kts-base-recharge=Регенерация одной доли турели до исследований регенерации.
kts-idle-drain=Постоянное потребление щита каждой башни. 10 означает: щит на 1000 единиц потребляет 100 кВт.
kts-research=Выключено: все силы, кроме врагов, сразу получают щиты башен без исследований щита, с базовыми значениями. Сама защитная башня по-прежнему требует своего исследования.
kts-size-steps=Сколько уровней ёмкости увеличивают прочность в 10 раз.
kts-rate-steps=Сколько уровней регенерации увеличивают регенерацию в 10 раз.
kts-max-level=Наивысший уровень обеих технологий улучшения щита. Каждая пара уровней — отдельная скрытая сущность, всего (N+1)².
kts-tower-share=У щита башни прочность, регенерация и потребление стольких долей турели.
kts-animated-effect=Выключено: простая вспышка вместо анимированной сферы, когда удар поглощён.

[entity-name]
repair-turret=Защитная башня
kts-shield-buffer=Защитная башня (энергия щита)

[entity-description]
repair-turret=Чинит союзные постройки, технику и персонажей в квадрате 14×14: 20 ОЗ/с, одна цель. Расходует ремкомплекты из своего слота. Радиус, скорость и число целей растут с исследованиями.\nПосле «Генерации щитов» прикрывает турели в зоне щитом: смертельный удар поглощается, урон чинится без ремкомплектов. Себя не защищает.\nЭнергия: 500 кВт + 1 МВт на каждые 20 ОЗ/с.
kts-shield-buffer=Скрытый энергетический буфер щита защитной башни.

[technology-name]
repair-turret=Защитная башня
repair-turret-speed=Скорость ремонта защитных башен
repair-turret-beams=Лучи защитных башен
repair-turret-range=Радиус защитных башен
turret-shields-base=Генерация щитов
turret-shields-size=Ёмкость щитов
turret-shields-speed=Регенерация щитов

[technology-description]
repair-turret=Башня, которая чинит ближайшие дружественные постройки ремкомплектами. Следующие исследования дают ей щит для турелей вокруг.
repair-turret-speed=Защитные башни чинят быстрее. Энергия и ремкомплекты на единицу здоровья тратятся так же, поэтому потребление растёт вместе со скоростью.
repair-turret-beams=Защитная башня чинит ещё одну цель одновременно. Каждый луч тратит свою энергию и ремкомплекты.
repair-turret-range=Квадрат защитных башен растёт на 1 клетку во все стороны — и для ремонта, и для щита.
turret-shields-base=Защитные башни защищают турели вашей силы в своём квадрате энергетическим щитом, который заряжается от электросети. Открывает выключатель щитов турелей на панели быстрого доступа.
turret-shields-size=Увеличивает прочность щита всех защитных башен.
turret-shields-speed=Ускоряет регенерацию щита всех защитных башен.

[modifier-description]
repair-turret-speed=Скорость ремонта защитных башен: +__1__%
repair-turret-beams=Одновременных целей ремонта: +__1__
repair-turret-range=Радиус защитных башен: +__1__
turret-shields-base=Защитные башни защищают турели щитом
turret-shields-size=Ёмкость щита защитных башен увеличена
turret-shields-speed=Регенерация щита защитных башен ускорена

[item-name]
kts-shield-toggle=Выключатель щитов турелей

[item-description]
kts-shield-toggle=Выделите турели, чтобы снять с них щит защитных башен (тогда их чинят лучи).\nЗажмите Shift, чтобы вернуть щиты выбранным турелям.

[shortcut-name]
kts-shield-toggle=Выключатель щитов турелей

[shortcut-description]
kts-shield-toggle=Выделите турели, чтобы снять с них щит защитных башен (тогда их чинят лучи).\nЗажмите Shift, чтобы вернуть щиты выбранным турелям.

[kts]
command-stats=Параметры защитных башен вашей силы: прочность щита, регенерация, потребление, квадрат и количество.
command-rebuild=Админ: пересобирает все защитные башни (зоны ремонта, буферы щита, защищаемые турели).
stats-off=«Генерация щитов» у вашей силы не исследована. Защитных башен: __1__, квадрат ±__2__ клеток.
stats=Щит башни: __1__ ед., регенерация __2__ ед./с, потребление в покое __3__ кВт, при регенерации до __4__ кВт, квадрат ±__5__ клеток. Башен со щитом: __6__, защищено турелей: __7__, запас __8__ ед. Уровни: ёмкость __9__, регенерация __10__. Поглощено ударов: __11__, починок щитом: __12__.
admin-only=Эту команду может использовать только администратор.
rebuilt=Защитные башни пересобраны: башен __1__, защищаемых турелей __2__.
