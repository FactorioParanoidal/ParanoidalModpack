[replicator-message]
warning=[img=virtual-signal/signal-skull] Из глуши приходит сигнал неизвестного происхождения: там что-то строит само себя.
late-start=[img=virtual-signal/signal-skull] Эволюция уже выше порога: цитадель репликаторов появится через __1__ мин.
appeared=[img=virtual-signal/signal-skull] Появилась цитадель репликаторов: __1__. Она растёт, строит дроидов и отправляет их на вашу базу.
shields=[img=virtual-signal/signal-skull] Цитадель репликаторов разрослась до щитов: её башни теперь под щитами.
acceleration=[img=virtual-signal/signal-skull] Цитадель репликаторов огромна: её цеха ускоряются на __1__ % каждый час.
core-destroyed=[img=virtual-signal/signal-skull] Матка репликаторов разрушена: цитадель не растёт __1__ мин. Уничтожьте все её цеха, чтобы добить её.
new-core=[img=virtual-signal/signal-skull] Репликаторы строят новую матку: __1__.
destroyed=[img=virtual-signal/signal-skull] Цитадель репликаторов уничтожена: пали её матка и все цеха.
command-help=Состояние цитадели репликаторов.
status=Цитадель: __1__; модулей __2__ (разрушено __3__); дроидов __4__, отрядов __5__, цехов __6__; интеллект __7__, броня __8__ (__9__), урон +__10__ %; известных чанков базы __11__.

