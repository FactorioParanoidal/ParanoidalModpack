[mod-name]
robotarmy-citadel=Robot Army: цитадель репликаторов

[mod-description]
robotarmy-citadel=При 50 % эволюции далеко от базы игрока появляется укреплённая цитадель дроидов-репликаторов. Каждые 10 минут она пристраивает новый модуль-чанк за стенами, строит дроидов Robot Army Reforged и отправляет каждый готовый отряд на базу игрока, с новыми модулями становясь умнее, крепче и сильнее.

