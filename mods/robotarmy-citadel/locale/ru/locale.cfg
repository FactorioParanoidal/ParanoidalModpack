[mod-setting-description]
robotarmy-citadel-enabled=Выкл.: цитадель не появляется; существующая перестаёт расти и строить дроидов.
robotarmy-citadel-warning=Эволюция кусак, при которой игроки получают предупреждение.
robotarmy-citadel-evolution=Эволюция кусак, при которой появляется цитадель.
robotarmy-citadel-base-radius=Радиус базы игрока вокруг точки появления.
robotarmy-citadel-distance=На таком расстоянии от края базы появляется цитадель.
robotarmy-citadel-growth-minutes=Каждый интервал пристраивается модуль (или отстраивается разрушенный).
robotarmy-citadel-stun-minutes=Столько цитадель не растёт после гибели матки; затем строится новая, если уцелел цех.
robotarmy-citadel-acceleration-modules=С такого числа модулей цеха ускоряются каждый час.
robotarmy-citadel-acceleration-percent=Прибавка к скорости производства за каждый час после порога.
robotarmy-citadel-shield-modules=С такого числа модулей башни цитадели получают щиты (нужен Defence Tower Reforged).
robotarmy-citadel-unit-limit=Больше этого числа дроидов у цитадели не бывает: дальше она становится сильнее, а не многочисленнее.
robotarmy-citadel-squad-base=Дроидов в отряде; +1 за каждый производственный модуль.
robotarmy-citadel-clear-radius=Так далеко вокруг себя цитадель постепенно уничтожает гнёзда и червей (в остальном перемирие).
robotarmy-citadel-messages=Сообщения о цитадели в чате.
