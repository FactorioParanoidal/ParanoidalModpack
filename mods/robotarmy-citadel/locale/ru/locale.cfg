[entity-description]
replicator-unit=Дроид цитадели репликаторов — копия дроида Robot Army. Разрушенный, роняет детали своего корпуса.
replicator-core=Сердце цитадели: пока она цела, город растёт. Разрушенная, останавливает рост на час; если уцелел хоть один цех, затем строится новая матка.
replicator-foundry-light=Выпускает стрелков, разведчиков и лазерных стрелков.
replicator-foundry-assault=Выпускает боевых и тяжёлых штурмовых дроидов.
replicator-foundry-fire=Выпускает огнемётных, ракетных и химических дроидов.
replicator-foundry-sniper=Выпускает снайперов и разведчиков.
replicator-foundry-energy=Выпускает лазерных стрелков и тесла-дроидов.
replicator-foundry-air=Выпускает звенья защитников, приманок и разрушителей.
replicator-foundry-terminator=Выпускает терминаторов и плазменных терминаторов.
replicator-reactor=Питает башни, радары и щиты цитадели. Уничтожьте электростанции — и башни погаснут.
replicator-radar=Изучает базу игрока: отряды цитадели знают, куда бить.
replicator-depot=Каждый целый склад ускоряет цеха на 8 %.
replicator-repair-bay=Чинит дроидов на своей площади и постройки вокруг.
replicator-recycler=Делает из обломков павших дроидов новых.
replicator-armory=Каждый целый бронецех поднимает марку брони новых дроидов (до III); броня подстраивается под урон, от которого они гибнут.
replicator-arsenal=Каждая целая лаборатория добавляет 10 % урона дроидам и башням цитадели.
replicator-targeting-array=Каждая целая система добавляет 8 % скорострельности.
replicator-ai-core=Каждый целый центр делает отряды умнее: дисциплина, выбор целей, память потерь, марш без отвлечений, удар клещами, удар по энергетике.
replicator-jammer=Прячет цитадель с карт игроков.
replicator-relay=Направляет рост цитадели к базе игрока и расширяет действие глушилок.
replicator-shield-node=Усиливает щиты башен цитадели (ёмкость или восстановление).
replicator-mine-control=Держит минное поле своего модуля.
replicator-pylon=Питает свой модуль и связывает его с соседними.
replicator-mortar-tower=Обстреливает нападающих издалека.

