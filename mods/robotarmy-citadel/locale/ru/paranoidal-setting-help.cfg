[mod-setting-description]
robotarmy-citadel-attack-groups=[entity=replicator-defender-unit] Ограничивает число одновременно отправленных атакующих отрядов одной вражеской цитадели репликаторов. Больший предел позволяет ей вести больше атак параллельно, но не создаёт дроидов бесплатно. Это не общий лимит всех врагов на карте.\n[color=#9cdcfe]По умолчанию: 6. Диапазон: 1–50. Общая настройка карты.[/color]
robotarmy-citadel-squad-max=[entity=replicator-defender-unit] Верхняя граница целевого размера отряда, собираемого вражеской цитаделью. Фактическая цель зависит также от её производственных модулей; ранние и разделённые отряды могут быть меньше. Большое значение не означает, что каждый налёт сразу получит столько дроидов.\n[color=#9cdcfe]По умолчанию: 40. Диапазон: 1–200. Общая настройка карты.[/color]
