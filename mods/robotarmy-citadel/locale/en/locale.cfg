[replicator-message]
warning=[img=virtual-signal/signal-skull] An unknown signal comes from the wilderness: something is building itself out there.
late-start=[img=virtual-signal/signal-skull] The evolution is past the threshold: the replicator citadel will appear in __1__ min.
appeared=[img=virtual-signal/signal-skull] A replicator citadel has appeared at __1__. It grows, builds droids and sends them against your base.
shields=[img=virtual-signal/signal-skull] The replicator citadel has grown to the shield stage: its towers are shielded now.
acceleration=[img=virtual-signal/signal-skull] The replicator citadel is huge: its foundries get faster by __1__ % every hour.
core-destroyed=[img=virtual-signal/signal-skull] The replicator hive is destroyed: the citadel stops growing for __1__ min. Destroy all its foundries to finish it.
new-core=[img=virtual-signal/signal-skull] The replicators build a new hive at __1__.
destroyed=[img=virtual-signal/signal-skull] The replicator citadel is destroyed: its hive and all its foundries have fallen.
command-help=State of the replicator citadel.
status=Citadel: __1__; modules __2__ (ruined __3__); droids __4__, squads __5__, foundries __6__; intelligence __7__, armour __8__ (__9__), damage +__10__ %; known chunks of the base __11__.

