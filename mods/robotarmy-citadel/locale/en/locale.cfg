[replicator-phase]
dormant=waiting
warned=signal detected
siting=choosing a place
active=active
destroyed=destroyed

[replicator-message]
warning=[img=virtual-signal/signal-skull] The airwaves are cluttered: the same short signal repeats from the wilds. Someone — or something — is answering itself.
late-start=[img=virtual-signal/signal-skull] The signal from the wilds grows stronger. In __1__ min. it will stop being just a signal.
appeared=[img=virtual-signal/signal-skull] The source of the signal is found: __1__. Something is growing there. And it seems to know where you are.
shields=[img=virtual-signal/signal-skull] The air shimmers over the source of the signal. It has learned to protect itself.
acceleration=[img=virtual-signal/signal-skull] The signal comes ever more often. Every hour — __1__ % more often.
core-destroyed=[img=virtual-signal/signal-skull] The heart fell silent. For __1__ min. But something inside is still working.
new-core=[img=virtual-signal/signal-skull] The signal beats again — in a new place: __1__.
destroyed=[img=virtual-signal/signal-skull] The replicator citadel is destroyed: its hive and all its foundries have fallen.
command-help=State of the signal source.
status-quiet=Signal source: __1__.
status=Signal source: __1__; modules __2__ (ruined __3__); droids __4__, squads __5__, foundries __6__; intelligence __7__, armour __8__ (__9__), damage +__10__ %; known chunks of the base __11__.

