replicator-core-item=Unknown core

[item-description]
replicator-core-item=Warm to the touch. Something ticks inside. Can be taken apart into valuable parts.

[recipe-name]
replicator-core-decryption=Unknown core decryption

[recipe-description]
replicator-core-decryption=The schematic came with the signal from the wilds. You do not have the core itself yet.

