[entity-description]
replicator-unit=A droid of the replicator citadel, a copy of the Robot Army droid. Drops parts of its body when destroyed.
replicator-core=Heart of the citadel: while it stands the city grows. Destroyed, it stops the growth for an hour; if a foundry still stands, a new hive is then built.
replicator-foundry-light=Makes riflebots, scouts and laser riflemen.
replicator-foundry-assault=Makes battle droids and heavy assault droids.
replicator-foundry-fire=Makes flamebots, rocket droids and chemical droids.
replicator-foundry-sniper=Makes snipers and scouts.
replicator-foundry-energy=Makes laser riflemen and tesla droids.
replicator-foundry-air=Makes defender, distractor and destroyer units.
replicator-foundry-terminator=Makes terminators and plasma terminators.
replicator-reactor=Powers the towers, radars and shields of the citadel. Destroy the power plants and the towers go dark.
replicator-radar=Explores the player base: the squads of the citadel then know where to strike.
replicator-depot=Every standing depot speeds up the foundries by 8 %.
replicator-repair-bay=Repairs the droids on its plaza and the buildings around it.
replicator-recycler=Turns the wrecks of lost droids into new droids.
replicator-armory=Every standing armour works raises the armour mark of the new droids (up to III); the armour adapts to the damage that kills them.
replicator-arsenal=Every standing laboratory adds 10 % damage to the droids and towers of the citadel.
replicator-targeting-array=Every standing array adds 8 % rate of fire.
replicator-ai-core=Every standing centre makes the squads smarter: discipline, target choice, memory of losses, march without distraction, pincer attacks, strikes on the power.
replicator-jammer=Hides the citadel from the player maps.
replicator-relay=Turns the growth of the citadel towards the player base and extends the jammers.
replicator-shield-node=Strengthens the shields of the citadel towers (capacity or regeneration).
replicator-mine-control=Keeps the minefield of its module.
replicator-pylon=Powers its module and connects it to the neighbouring modules.
replicator-mortar-tower=Shells the attackers from far away.

