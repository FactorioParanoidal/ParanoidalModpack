[mod-setting-description]
robotarmy-citadel-enabled=Off: the citadel does not appear; an existing citadel stops growing and building droids.
robotarmy-citadel-warning=Evolution of the biters at which the players get the warning.
robotarmy-citadel-evolution=Evolution of the biters at which the citadel appears.
robotarmy-citadel-base-radius=Radius of the player base around the spawn point.
robotarmy-citadel-distance=The citadel appears this far from the edge of the base.
robotarmy-citadel-growth-minutes=One module is added (or a ruined one rebuilt) every interval.
robotarmy-citadel-stun-minutes=No growth for this long after the hive is destroyed; then a new hive is built if a foundry stands.
robotarmy-citadel-acceleration-modules=From this many modules the foundries get faster every hour.
robotarmy-citadel-acceleration-percent=Added to the production speed for every hour after the threshold.
robotarmy-citadel-shield-modules=From this many modules the citadel towers get shields (needs Defence Tower Reforged).
robotarmy-citadel-unit-limit=The citadel keeps at most this many droids: beyond it it grows stronger, not more numerous.
robotarmy-citadel-squad-base=Droids in a squad; +1 for every foundry module.
robotarmy-citadel-clear-radius=The citadel slowly destroys the biter nests and worms this far around it (truce otherwise).
robotarmy-citadel-messages=Messages about the citadel in the chat.
