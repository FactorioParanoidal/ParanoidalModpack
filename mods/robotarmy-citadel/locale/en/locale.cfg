[mod-name]
robotarmy-citadel=Robot Army: Replicator Citadel

[mod-description]
robotarmy-citadel=At 50 % evolution a fortified citadel of replicator droids appears far from the player base. It grows by one walled module chunk every 10 minutes, builds the droids of Robot Army Reforged and sends every finished squad against the player base, becoming smarter, tougher and stronger with its modules.

