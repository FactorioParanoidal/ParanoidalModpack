[mod-setting-description]
robotarmy-citadel-enabled=Off: the citadel does not appear. An existing citadel pauses construction and stops producing droids. A city already defeated still collapses.
robotarmy-citadel-warning=Evolution of the biters at which the players get the warning.
robotarmy-citadel-evolution=Evolution of the biters at which the citadel appears.
robotarmy-citadel-base-radius=Initial player-building search area around the spawn, in 32×32-tile chunks. Not a hard intel boundary: connected chunks containing buildings let the scan continue farther. Also adds to the citadel's initial placement distance; 0 adds no such distance margin.
robotarmy-citadel-distance=The citadel appears this far from the edge of the base.
robotarmy-citadel-growth-minutes=Game minutes between growth attempts. The citadel takes turns rebuilding ruined modules and restoring missing power hubs. Failed repairs are deferred; if no repair is due, it can add a new module. If no new-module site is found, retries after 10 seconds instead of waiting the full interval.
robotarmy-citadel-stun-minutes=No growth for this long after the hive is destroyed; then a new hive is built if a foundry stands.
robotarmy-citadel-acceleration-modules=Total citadel-module threshold that starts hourly foundry acceleration. Checked after a successful module build, not from foundry count alone. Raising the threshold does not cancel acceleration that has already started.
robotarmy-citadel-acceleration-percent=Linear production-speed multiplier growth after acceleration starts, in percent per game hour. For example, 10 gives ×1.1 after one hour and ×1.2 after two, not compound growth. 0 disables this bonus; elapsed time is counted from the original acceleration start.
robotarmy-citadel-shield-modules=Total citadel-module threshold for enabling shield towers. Checked after a successful module build. Requires an available Defence Tower Reforged tower prototype; without it, shields do not activate.
robotarmy-citadel-unit-limit=Active-droid production cap for the citadel's whole army, not one squad. At or above it, foundries stop creating more droids. Lowering the limit does not remove existing ones, and it does not stop module construction.
robotarmy-citadel-squad-base=Base target size of a forming squad, in droids: +1 per living production module, capped by the squad-size maximum and the total droid limit. The core is not a production module. Already launched squads are not rebuilt to match a changed value.
robotarmy-citadel-clear-radius=Cleanup margin around the rectangle enclosing the citadel modules, in 32×32-tile chunks. 0 adds no outer margin. Each pass checks up to 32 chunks and removes up to 5 truce-force nests or worms by script rather than ordinary death handling; other diplomacy is unchanged.
robotarmy-citadel-messages=Messages about the citadel in the chat.
