[mod-setting-description]
robotarmy-citadel-attack-groups=[entity=replicator-defender-unit] Caps the attacking squads dispatched simultaneously by one hostile replicator citadel. A higher cap allows more parallel attacks but does not create free droids. It is not a global limit on all map enemies.\n[color=#9cdcfe]Default: 6. Range: 1–50. Shared map setting.[/color]
robotarmy-citadel-squad-max=[entity=replicator-defender-unit] Upper bound on the squad size a hostile citadel aims to gather. The target also depends on its production modules; early or split squads may be smaller. Raising it does not instantly give every raid that many droids.\n[color=#9cdcfe]Default: 40. Range: 1–200. Shared map setting.[/color]
