factorissimo-connection-settings=Port settings
factorissimo-recursion=Building in a building
factorissimo-dispatch=Factory dispatcher
factorissimo-hull=Hull and alarm

[tips-and-tricks-item-description]
factorissimo-introduction=A factory building is a separate workshop: small outside, a spacious floor inside. You enter and leave only through the gate at the bottom center of the building.\n\nOutside it only needs electricity: place a pole of the same network nearby and the building connects by itself. Pollution from inside leaves through the center of the building.\n\nAn empty building is picked up as a plain item, a building with contents as a packed one: placed somewhere else, it keeps everything inside.
factorissimo-connections=Along the walls of the building there are ports, places where an entry outside meets an entry inside. Turn on alt mode, hover the building and press __CONTROL__factory-rotate__ to show the port markers.\n\nTo connect a port, place a matching entity both outside at the wall and inside at the opposite wall. Belts, underground belts, loaders and inserters connect right away.
factorissimo-connection-research=Other kinds of connections are unlocked by research:\n[technology=factory-connection-type-fluid]: pipes and pumps;\n[technology=factory-connection-type-chest]: chests;\n[technology=factory-connection-type-heat]: heat pipes;\n[technology=factory-connection-type-circuit]: circuit network through [item=factory-circuit-connector].\n\nWithout the research "Research required" appears over the entities. Connections made before stay.
factorissimo-connection-settings=Every connection has an indicator arrow inside at the wall. Hover it:\n__CONTROL__factory-rotate__ changes the direction (input, output, or balance for chests);\n__CONTROL__factory-increase__ and __CONTROL__factory-decrease__ change the update rate of chests and heat.\n\nFluids pass a port at up to 6000 per second.
factorissimo-recursion=[technology=factory-recursion-t1] lets you place buildings inside larger ones, [technology=factory-recursion-t2] inside buildings of any size. Without the research such a building stays inactive.\n\nPower and pollution of a nested building go through the floor of the outer one.
factorissimo-dispatch=The [img=factorissimo-dispatch-button] button in the top bar or __CONTROL__factory-toggle-dispatch__ open the dispatcher, the list of all your factory buildings.\n\nIt shows the tier of each building, the icons of its overlay controller, its place and its state: low power, idle machines, ports in use. Select a factory to look inside, show it on the map or name it. The name is shown on the building in alt mode, on the map and inside above the gate.
factorissimo-hull=[technology=factory-hull-1], [technology=factory-hull-2] and [technology=factory-hull-3] reinforce the walls of factory buildings: they take less damage.\n\nAfter the first one an attack from outside turns on a red alarm light for 10 seconds and a siren inside the building and inside every building built in it: time to go out and defend the workshop.
