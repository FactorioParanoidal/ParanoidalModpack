factory-1=[font=default-semibold][color=255,230,192]Полезная площадь: [/color][/font]30×30\n[font=default-semibold][color=255,230,192]Портов: [/color][/font]16\n[font=default-semibold][color=255,230,192]Скорость перекачки жидкостей: [/color][/font]6000/s\n__CONTROL__factory-rotate__ чтобы показать/скрыть маркеры портов (Alt-режим должен быть включен)\n__CONTROL__build-ghost__ чтобы открыть фабрику дистанционно.
