factory-power-pole=Обеспечивает электроэнергию для всех машин внутри фабрики.\n__CONTROL__build-ghost__ чтобы открыть внешнюю поверхность дистанционно.
factory-overlay-controller=Позволяет настроить значки для условного обозначения.
factory-circuit-connector=Передаёт сигналы логической сети между фабриками. Для соединения цепи нужны два коннектора логической сети фабрики: на внутреннем и на внешнем порту.
factory-construction-chest=Запрашивает строительные материалы с внешней поверхности, которые доставляются строительными дронами.
factory-construction-roboport=Строительная дронстанция с огромной зоной строительства и небольшой зоной логистики.

