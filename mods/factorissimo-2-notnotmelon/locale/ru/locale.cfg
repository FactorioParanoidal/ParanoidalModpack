[tips-and-tricks-item-description]
factorissimo-introduction=Фабрика — отдельный цех: снаружи здание небольшое, а внутри просторный этаж. Войти и выйти можно только через ворота внизу по центру здания.\n\nСнаружи нужно только электричество: поставьте рядом столб той же сети, и фабрика подключится сама. Загрязнение изнутри выходит наружу из центра здания.\n\nПустая фабрика при разборке становится обычным предметом, а фабрика с содержимым — упакованной: на новом месте всё внутри сохранится.
factorissimo-connections=Вдоль стен фабрики расположены порты — места, где вход снаружи стыкуется со входом изнутри. Включите Alt-режим, наведите курсор на фабрику и нажмите __CONTROL__factory-rotate__, чтобы показать маркеры портов.\n\nЧтобы соединить порт, поставьте подходящий объект и снаружи у стены, и внутри у стены напротив. Конвейеры, подземные конвейеры, погрузчики и манипуляторы соединяются сразу.
factorissimo-connection-research=Другие подключения открываются исследованиями:\n[technology=factory-connection-type-fluid] — трубы и насосы;\n[technology=factory-connection-type-chest] — сундуки;\n[technology=factory-connection-type-heat] — тепловые трубы;\n[technology=factory-connection-type-circuit] — логическая сеть через [item=factory-circuit-connector].\n\nБез исследования над объектами появляется надпись «Необходимо исследование». Уже созданные подключения сохраняются.
factorissimo-connection-settings=У каждого подключения внутри у стены есть стрелка-индикатор. Наведите на неё курсор:\n__CONTROL__factory-rotate__ — направление передачи (приём, отдача или балансировка для сундуков);\n__CONTROL__factory-increase__ и __CONTROL__factory-decrease__ — частота передачи для сундуков и тепла.\n\nЖидкости проходят через порт со скоростью до 6000 в секунду.
factorissimo-recursion=[technology=factory-recursion-t1] позволяет ставить фабрики внутрь более крупных, а [technology=factory-recursion-t2] — внутрь фабрик любого размера. Без исследования такая фабрика остаётся неактивной.\n\nПитание и загрязнение вложенной фабрики идут через этаж внешней.
factorissimo-dispatch=Кнопка [img=factorissimo-dispatch-button] на верхней панели или __CONTROL__factory-toggle-dispatch__ открывают диспетчерскую — список всех ваших фабрик.\n\nВ ней видны уровень фабрики, значки с её демонстрационного стенда, место и состояние: нехватка энергии, простой машин, занятые порты, потребление и выработка энергии. Выберите фабрику, чтобы заглянуть внутрь, показать её на карте или дать ей имя. Имя видно в Alt-режиме на её здании и внутри над воротами.
factorissimo-hull=Исследования [technology=factory-hull-1], [technology=factory-hull-2] и [technology=factory-hull-3] укрепляют стены фабрик: они получают меньше урона.\n\nПосле первого из них при атаке снаружи внутри фабрики и во всех фабриках, построенных в ней, на 10 секунд включается красный тревожный свет и звучит сирена — пора выходить и защищать цех.
