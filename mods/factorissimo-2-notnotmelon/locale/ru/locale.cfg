[mod-description]
factorissimo-2-notnotmelon=Factorissimo — здания-фабрики, внутри которых можно строить.\n\n— Поставьте Фабрику (1–4 уровня), войдите внутрь — там отдельная площадка для производства.\n— Конвейеры, трубы, сундуки, а после исследований тепло и сигналы проходят через стены в местах соединений; скорость и направление соединений настраиваются.\n— Электроэнергия передаётся внутрь фабрики.\n— Разобранная фабрика сохраняет всё, что построено внутри; исследования позволяют вкладывать фабрики одну в другую.\n\nПозволяет уместить большой завод на малой площади и аккуратно спрятать сложные цепочки в один «кирпичик».

