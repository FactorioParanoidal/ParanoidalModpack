[mod-setting-description]
ERPCTbaAB2-give-refining-ores=Должен ли случайный дропшип выдавать руды Angel's вместо ванильных?
ERPCTbaAB2-integrate-spacex=Изменять ли рецепты и технологии SpaceX для лучшей стыковки с Expanded Rocket Payloads?
ERPCTbaAB2-refurbish-not-guaranteed=Снято — шаттл возвращается всегда. Отмечено — используется шанс ниже.
ERPCTbaAB2-refurbish-chance=Насколько высок шанс восстановления. Числа — десятичные доли после нуля.
ERPCTbaAB2-use-bobinserters=Использовать манипуляторы Bob's вместо ванильных. Без Bob's Adjustable Inserters ничего не меняется.
ERPCTbaAB2-use-petrochem-buildings=Использовать машины Angel's Petrochem вместо Bob's. Без Angel's Petrochemical Processing ничего не меняется.
ERPCTbaAB2-use-heat-shield-tile=Использовать теплозащитную плитку вместо каменного кирпича. Без Bob's Revamp ничего не меняется.
ERPCTbaAB2-use-titanium-concrete=Использовать титановый бетон вместо армированного. Без Extended Angels ничего не меняется.
