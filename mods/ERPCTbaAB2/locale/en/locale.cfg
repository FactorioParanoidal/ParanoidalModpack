[mod-setting-description]
ERPCTbaAB2-give-refining-ores=Should the Random Dropship give Angel's ores instead of vanilla ores?
ERPCTbaAB2-integrate-spacex=Should SpaceX recipes and technologies be altered to fit Expanded Rocket Payloads more?
ERPCTbaAB2-refurbish-not-guaranteed=Unchecked means the shuttle is always returned. Checked means the chance below is used.
ERPCTbaAB2-refurbish-chance=How high the refurbish chance should be. Numbers represent decimal places after 0.
ERPCTbaAB2-use-bobinserters=Use Bob's inserters instead of vanilla ones. Nothing changes without Bob's Adjustable Inserters installed.
ERPCTbaAB2-use-petrochem-buildings=Use Angel's Petrochem machines instead of Bob's. Nothing changes without Angel's Petrochemical Processing installed.
ERPCTbaAB2-use-heat-shield-tile=Use Heat Shielding Tile instead of Stone Brick. Nothing changes without Bob's Revamp installed.
ERPCTbaAB2-use-titanium-concrete=Use Titanium Concrete Brick instead of Reinforced Concrete Brick. Nothing changes without Extended Angels installed.
