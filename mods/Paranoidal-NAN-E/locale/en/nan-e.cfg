[mod-setting-description]
nan-e-look=Own: a hovering nanny with a screen for a face. Original: Informatron's tracked robot (by Earendel).
nan-e-chatter=How often she talks on her own: often, every 2–4 minutes; rarely, every 7–12 minutes. Silent leaves only memories, the case and alarms. Everything she says is kept in her window's journal.
nan-e-distance=How many tiles she keeps from you.
nan-e-errands=Now and then she drives off for half a minute: to check an idle machine, rummage in wrecks or ruins (memory cards turn up there) or look round the base. Never when you are far away or enemies are near.
nan-e-spoilers=Very rarely she recalls secrets of the start and the build: codes, places, fine points of the mechanics. Turn it off to find everything out yourself.
nan-e-voice=Her synthesised babble and tunes. The words always come as text.
nan-e-chat-log=Repeat her lines in the chat.
nan-e-button=The button of her window at the top left of the screen.
nan-e-decode-seconds=How many seconds NAN-E reads one memory card. The same for the whole map.

