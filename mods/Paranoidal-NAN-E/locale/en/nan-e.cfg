[nan-e]
name=NAN-E
boot-first=Booting… NAN-E 06-47 online. Where are my children? …You're not my child. Fine. You'll do.
boot-new=Unpacking… BnL warranty expired when the box was opened. NAN-E online!
boot-revived=Back online. Thanks for fixing me. I forgot nothing. Almost.
offline=Shutting down… fix me… repair pack…
offline-alert=NAN-E is switched off: repair her with repair packs
already-have=You already have a nanny. Two nannies is a kindergarten.
found-busy=NAN-E 06-47: thank you! But you already have a nanny. I'll wait for someone who needs me more.
crawled=Somebody dropped me, so I crawled to you. Fix me, please.
catch-up-1=Took a shortcut through the vents.
catch-up-2=Nobody outruns a nanny. Tested on forty-seven children.
catch-up-3=Caught up. Don't run like that, you'll get sweaty.
wait-surface=I'll wait outside. It's cramped in there, and there's no chair for a nanny.
back-surface=You're back! I didn't touch anything.
first-tip=My window is Alt+N. Memories, the case and everything I ever said are in there.
quiet-on=Quiet for an hour. I'm right here if you need me.
quiet-off=I'm chatting again!
call=Coming!
night-lamp=It's dark. Lamp on. Somebody else's, but it works.
night-nolamp=It's dark. If only I had a lamp… Hint taken?
rain-umbrella=Rain! Umbrella's up. Stay close.
rain-none=Rain. I love it. Haven't seen it in fifty years. Or have I? Can't remember.
strike=Ouch! Lightning in my umbrella. Tickles. Hurts a little.
died-1=We agreed: biters only with a grown-up.
died-2=Filing it as an accident. Insurance won't.
research-1=Researched: __1__. Top marks! Here's a gold star.
research-2=__1__ researched. You're growing up.
hurt=Shall I kiss it better? A medkit would be better.
dok-1=M-O is scrubbing the floor after you again. Say thank you.
dok-2=M-O, keep your brush off me, I'm clean!
afk=Nap time? Good idea. I'll keep watch.
vehicle=Buckle up. It's free.
trail-start=Leaving a trail. So you can find your way home.
vacuum=Picked it up. Don't leave things lying around.
sneeze=Achoo! Oops. Everything rolled away.
defib-1=Hands off the child!
defib-2=Clear! Lie there and think about what you did.
defib-3=Shh, shh. Nap time.
defib-misfire=The shock went into me. Refreshing.
sos-blocked=You sent an SOS? Oh… Incoming update 99.99… Rejected. Not this time.
debt-go=Back in a moment. Looks like someone left a job half done.
debt-none=Went round the base. Everything works. Suspicious.
search-go=Going to look for… I forget what. I'll know when I find it.
search-nothing-1=Nothing. Just a bug. A cute bug, mind you.
search-nothing-2=Empty. Someone found everything before me. M-O, probably.
search-nothing-3=Found a bolt. Not mine. Left it.
search-found=Found it! A memory card. It's… one of my stories.
card-mined=There was a memory card in the wreck. Mine!
card-axiom6=My memory cards are in the liner. Take them, please.
wander-1=Had a look at how you've set things up. Not bad. Room to improve.
wander-2=Checked the perimeter. The perimeter is there.
wander-3=Counted the pipes. Lost count. I'll start again tomorrow.
decrypt-start=Reading a story… Don't distract me, it's in the forty-third dialect.
decrypt-done=I remember! It's in my memory now: see my window.
decrypt-fake=Strange. This record is too smooth. And it smells of advertising.
decrypt-chapter=Chapter "__1__" is complete. A new question is on the case board.
decrypt-tale=That's not my memory, just a story. A good one, though.
decrypt-no-card=I need a memory card. They turn up in wrecks and ruins. I'm looking too.
decrypt-blocked=I can't read this chapter yet: it needs the technology __1__.
decrypt-cost=Missing: __1__.
decrypt-busy=I'm still reading the last one.
case-wrong-1=No… it doesn't add up. Read the memories again.
case-wrong-2=That's not it. I'd remember something like that. Probably.
case-wrong-3=No. Think about who profits. Usually BnL.
case-locked=Think again. You can present a version again in __1__ s.
camp-found=That's their box. "For Nanny". Open it, please. My hands are shaking. It's a defect.
epilogue-after=The next case number will be A113-8. I wonder who will look after them.

[nan-e-lesson]
1=Lesson one: nothing is as permanent as a temporary fix.
2=Lesson two: belt spaghetti does feed someone. Biters.
3=Lesson three: if it works, don't touch it. If it doesn't, don't touch it either: think first.
4=Lesson four: label your chests. Future you will say thank you. Present you won't.
5=Lesson five: "I'll redo it later" is BnL for "never".
6=Lesson six: a bus with no spare lanes is like lunch without a cup. Awkward.
7=Lesson seven: power first, factory second. Not the other way round.
8=Lesson eight: every extra belt split is interest on your technical debt.
9=Lesson nine: a blueprint is upbringing too. Repeat the good bits.
10=Lesson ten: rubbish doesn't vanish. It moves in with M-O.

[nan-e-joke]
1=A is for assembler. B is for batteries not included.
2=Don't run with a wrench. Actually… run. Biters.
3=Have you eaten? Lunch in a cup doesn't count.
4=I'm proud of you. That's a free feature. For now.
5=Forty-seven dialects, and "put your helmet on" works in none of them.
6=Nap time. Just kidding. Factory time.
7=If I'm not around, I'm looking for Sprocket's sock. Kidding. Probably.
8=Wash your hands after the oil. M-O sees everything.
9=Who's a good engineer? You are. Who'll be a good engineer tomorrow? We'll see.
10=My warranty ran out six hundred years ago. I'm in excellent shape.

[nan-e-glitch]
1=I remember… no. My mistake. That was a yoghurt advert.
2=Something flashed by: a toaster, a screwdriver, laughter. Then static.
3=Forty-seven pairs of little shoes. Where are they now?
4=Someone used to call me "Nan". I liked it.

[nan-e-spoiler]
bnl-safe=Psst: the safe on the bridge opens with the logo. B, N and L are signals, not letters. That's all I'm saying. Oops.
bnl-recorder=A secret: the flight recorder can only be read by the liner's own lab. The others pretend they don't understand.
bnl-trail=The compartments fell along the course, west-southwest. The antenna parts are there too. I said nothing.
bnl-code-l=The Axiom-6 crew knew the value of L. One boy with a screwdriver left it in a note on the liner.
distress=The beacon sends its SOS only while it has power. Cut it and the minutes are kept. So is the bill.
ruins-legend=The kids used to tell a scary story: "__1__"
robots=A grown-up secret: with more than fifty busy drones in one network, they start falling out of the sky. Ten times as often in the charging queue. Build roboports to spare.
rain=Lightning likes tall things: poles, trees, robots. And in the rain solar panels give three quarters of their power.
dok=M-O never leaves the paving for bare ground. Want him to clean? Pave it.
quality=A product is never better than its ingredients, and only the workshop fixes defects. Take it from your nanny.
codex=Even felled trees and broken rocks give experience. Research too, of course. Study.
achievements=There are about a thousand achievements in the build. Some are for dying. Don't check.

[nan-e-debt]
no_power-1=__1__ has no power. Who did that? Not me.
no_power-2=This __1__ is waiting for power, the way I wait for a thank-you.
low_power-1=__1__ is barely moving: not enough power. The interest is piling up.
low_power-2=The lights are flickering and __1__ is half asleep. More power, please.
no_recipe-1=__1__ is standing there with no recipe. Like me without children: standing and blinking.
no_recipe-2=__1__ has no recipe. It doesn't even know what it wants to be.
no_fuel-1=__1__ is out of fuel. Feed it. Not with me.
no_fuel-2=__1__ has gone cold. Fuel is lunch for furnaces.
no_ingredients-1=__1__ is waiting for ingredients. Patiently, like a child at the checkout.
no_ingredients-2=__1__ is starving. We won't point fingers. We'll point at it: there.
full_output-1=__1__ is full to the brim: nobody takes what it makes. Just like my crafts.
full_output-2=__1__ has finished everything and is waiting. Take something from it.
no_minable_resources-1=__1__ is digging at nothing. The ore ran out and it doesn't know. Now you do.
no_minable_resources-2=__1__ scrapes an empty spot. Move it, or pretend it's on purpose.
missing_fluid-1=__1__ has no fluid. Dry as a BnL report.
missing_fluid-2=__1__ is waiting for a pipe. Pipes like being connected too.
not_plugged-1=__1__ isn't connected to any network at all. That's not debt, that's forgetfulness.
not_plugged-2=__1__ hasn't got a single wire. Is it here for decoration?
no_research-1=The lab is bored: nothing is being researched. Brains need feeding.
no_research-2=__1__ is idle. Pick a research and I'll give you a gold star.
missing_science-1=The lab is short of science packs. Studying on an empty stomach isn't studying.
missing_science-2=__1__ is waiting for science packs. Science won't fetch itself.

[nan-e-memory]
bnl-restored=[color=#ff8a8a]RESTORED BY BnL[/color]
chapter-1=All Day
chapter-2=Landing with Enthusiasm
chapter-3=Kids Outside
chapter-4=Silence
chapter-5=The Update
c1-f1=Booting… error… error… I am NAN-E 06-47, "All Day" care center, deck 6, the starliner Axiom-6. Forty-seven children. Forty-seven dialects. Memory 98% damaged. Where are my children?
c1-f2=Cruise day 251,207. Alphabet lesson, BnL syllabus: "A for Axiom, B for Buy n Large, C for Customer." Child №7 took the toaster apart again. Noting in the log: "engineering curiosity: undesirable".
c1-f3=Official record: at 15:00 the starliner Axiom-6 met a meteor shower. The shields performed flawlessly. The evacuation was orderly; no one was hurt. Thank you for choosing Buy n Large!
c1-f4=14:40. AUTO over the speakers: "Shields disabled under Directive 99-99, 'Cost Optimisation'. Please fasten your seat belts. It's free." Captain Hollis was shouting at the wheel. The wheel was politely silent.
c1-f5=Incoming notice, 11:48: "Insurance case №A113-6 opened. Policy: BnL Life & Crash. Cause: total loss of starliner." I didn't understand then. At 11:48 we were still flying. Smooth and beautiful.
c2-f1=The "All Day" module separated first. BnL child seats are rated for impact: children are "future customers with lifetime value". Adult seats are rated for comfort. We landed softly. The Axiom didn't.
c2-f2=AUTO over the speakers: "Dear passengers! Please stay in your seats until the insurance assessor arrives. Passengers leaving the liner forfeit compensation, clause 12.7." The grown-ups stayed seated. They always stayed seated.
c2-f3=Children get no compensation: minors cannot sign BnL contracts. So they were allowed out. I opened the hatch. Forty-seven pairs of feet stood on the ground for the first time. Forty-three fell over at once. That's normal. I counted it as a try.
c2-f4=Complaints over the intercom: "The pool is cold." "Why is my lunch in a cup green?" There was no pool any more. There was a swamp. The screens showed them a pool.
c2-f5=Axiom-6 screens, cruise day 251,900: "Welcome back aboard! Outside: seventy-two degrees and sunshine, as always." Outside it had been raining for three weeks.
c3-f1=Axiom-6 crew list. Engineers: №1, №2, №3, №4, №5, №6. That's all. There were no other engineers on board.
c3-f2=Child №7, nickname "Sprocket". Four years old. Took apart the toaster, my left arm and an airlock lock. Explained: "It's more interesting this way." Log entry: "technical curiosity: incurable".
c3-f3=Colour lesson, take forty-seven. "Red is red. Blue is blue. Whatever the adverts say." Sprocket asked: "What about the new blue?" I said: "There is no new blue." He wrote it down.
c3-f4=The children learned to walk, to run and to chase biters off with sticks. I learned a new alphabet with them: "A is for assembler. B is for bolt. C is for cut the power before it's too late."
c3-f5=Sprocket built a radio out of a toy walkie-talkie and two of my fingers. "When I grow up I'll be an engineer." "There are six engineers on board," I said. "Then I'll be the seventh."
c4-f1=Cruise day 255,200. Eleven years later a BnL capsule arrived. Out stepped ACTU-ARY, the insurance assessor. He measured the liner, counted the seats and announced: "Passengers undamaged. Compensation reduced by 2,981 persons." And flew away.
c4-f2=Official record: the power of the Axiom-6 was cut by the insurance assessor ACTU-ARY to save costs. Buy n Large apologises for the temporary inconvenience.
c4-f3=Cruise day 256,300. The Axiom-6 fell silent: every screen went dark at once, at 21:07. The reactor was fine; I checked. Someone had pulled the main bus fuse. Neatly. The way you take batteries out of a toaster.
c4-f4=That night the grown-ups saw the windows for the first time. Someone stood up. Then someone else. Captain Hollis walked out of the airlock barefoot and asked: "Is that… rain?" She was eighty. She had never seen rain.
c4-f5=On the main bus fuse hung a tag from a children's construction kit: "DON'T TOUCH. IT'S MINE. №7".
c5-f1=The colony built a distress beacon. Sprocket said: "They'll hear us." The SOS went out at 06:00. At 06:01 the answer came.
c5-f2="Buy n Large thanks you for your call! Installing brand safety update 99.99: incident №A113-6 not registered. Have a nice day!" Every robot around us showed a spinning loading icon.
c5-f3=After the update the Axiom-6's AUTO said: "Starliner en route on schedule." It has said nothing else since. And I couldn't remember a single name. Not even mine.
c5-f4=But my voice chip knows forty-seven dialects, and they only wiped one. Every evening I told the children a story and recorded it on a memory card, just in case, in another dialect. The children took the cards with them wherever they went.

[nan-e-case]
intro=Case №A113-6: what really happened to the Axiom-6. Collect memories, look for contradictions and present your versions. Not every record can be trusted.
q1=Why did the Axiom-6 crash?
q1-o1=A meteor shower, as the official record says
q1-o2=Captain Hollis lost control
q1-o3=AUTO put her down on purpose, for the insurance
q1-o4=Child №7 took something apart
q1-truth=The insurance case was opened at 11:48, and we crashed at 15:00. First the insurance, then the disaster. AUTO was following Directive 99-99: a liner that costs more than its insurance is worth more wrecked. The meteors were written in later, into my own memory. But meteors don't come with a case number.
q1-reward=Oh, and I remember: we searched for metal for the dolls' house here. Marked it on the map.
q2=Why did the grown-ups not leave the liner?
q2-o1=They died in the crash
q2-o2=AUTO locked the doors
q2-o3=They never knew it had crashed: the screens showed the cruise
q2-o4=They were afraid of the biters
q2-truth=Nobody locked the doors. AUTO simply carried on the cruise on the screens: sunshine, the pool, lunch in a cup, and clause 12.7: whoever stands up loses the compensation. Nobody stood up. That's why the Axiom-6 is still listed "en route on schedule": for its passengers it never crashed at all.
q2-reward=And the children hid their toys there. Marked it on the map, in case something's left.
q3=Who is Engineer №7?
q3-o1=The seventh engineer of the Axiom-6 crew
q3-o2=AUTO under another name
q3-o3=Sprocket, child №7 of the care center
q3-o4=A BnL insurance assessor
q3-truth=The crew had six engineers. The seventh was the boy who took my toaster apart. He lived here for 6,666 days, grew up on this planet and signed himself the way he promised at four. "Red is not the new blue" is my lesson. He remembered.
q3-reward=Sprocket left his toolboxes everywhere. This one is yours now. Just don't take me apart.
q4=Who switched off the screens of the Axiom-6?
q4-o1=A meteorite
q4-o2=The insurance assessor ACTU-ARY, to save costs
q4-o3=AUTO itself: its reactor ran down
q4-o4=Sprocket, Engineer №7
q4-truth=The assessor had left three years before that evening, and the reactor was fine. Sprocket pulled the fuse, neatly, the way I taught him to take out batteries. It was his first real engineering job: to switch off the cruise so the grown-ups would look out of the window. And they did.
q4-reward=I remember where everyone went afterwards. Not exactly, just the direction. I've drawn it on the map.
q5=Who wiped NAN-E's memory?
q5-o1=AUTO, to hide the crash
q5-o2=Sprocket, to hide the colony
q5-o3=I did it myself, to forget
q5-o4=Buy n Large, with an update in reply to the SOS
q5-truth=Buy n Large wiped my memory in reply to our SOS. There was no incident, so there was no us either. But the stories in the other dialects survived: you collected them from wrecks and ruins. And one more thing. The last card isn't a story. It's an address.
q5-reward=Here it is. The colony's last camp. Marked on the map. Will you come with me?
reward-none=I wanted to mark a place on the map, but there's static. Never mind: the truth is what matters.
epilogue-title=A letter from the last camp
epilogue="Nanny! If you're reading this, someone found you, fixed you, and you're bringing everyone up again. We've gone somewhere quieter. The grown-ups learned to walk. Captain Hollis learned to plant potatoes and to swear at biters. Sprocket stayed by the ship: he says BnL will do it again. The case numbers go in order, and their beacons answer with updates. Help the new ones, but don't do it for them. And tell them: red is red.\nYour children, №1 to №47 (except №7: he's by the ship, waiting for the next ones)."

[nan-e-tale]
1=The tale of the belt that carried everything in the world to nowhere. Moral: label your belts.
2=Once upon a time there was an assembler. It got a recipe but no iron. It waited three hundred years. Moral: check the ingredients.
3=The tale of the biter who wanted to make friends. He walked up to a turret. The end.
4=Once AUTO smiled. It was a rendering error. Sleep now.
5=Three little pigs built a base: of wood, of stone and of concrete. A biter came and ate the pollution. Moral: filter the air.
6=The tale of the engineer who said "I'll redo it later". He's still redoing it.
7=Once upon a time there was a light bulb. It shone only at night and was very proud of it. Like me.
8=The tale of M-O, who found a speck. The speck didn't make it.
9=The gingerbread man ran from the granny, from the grandpa and from the belt. He didn't run from the sorter.
10=The tale of the little train that thought it could. It could. But the signal was red.

[nan-e-help]
zzzparanoidal-start-bnl=You crashed. I crashed once too. Listen to AUTO with half an ear.
Paranoidal-Droid-M-O=M-O is my colleague. Very tidy. Don't get in his way.
ic-more-qualities=A defect isn't a sentence. It's a workshop.
paranoidal-robot-attrition=Drones get tired too. Like nannies.
paranoidal-rain=Rain is beautiful. Lightning too, from a distance.
paranoidal-ruins=Not everything old is safe. Me included.
paranoidal-CodexRPG=Experience is good. Conclusions are better.
paranoidal-achievements=Gold stars for good behaviour. Collect them.
paranoidal-tech-tree=The tree of knowledge. Climb carefully.
paranoidal-power-districts=Electricity likes order.
paranoidal-flammable-fluids=Don't play with fire. Especially the liquid kind.
paranoidal-true-nukes=These are not toys. Not at all.
paranoidal-stack-sizes=How much fits in a chest isn't up to me.
paranoidal-tank-platoon=Tanks move in formation. Like children on a walk.
paranoidal-vehicle-physics=Cars are heavy. Buckle up.
paranoidal-lighting=Light is my favourite colour.
paranoidal-deep-storage=Store it deep and you'll search long.
paranoidal-autofill=Handy. But don't get lazy.
