[technology-description]
nan-e=Refurbished NAN-E units in BnL boxes. The Repair Ward patched them up with whatever was to hand, so every next part comes from a reject robot.
nan-e-lamp=L-T's lamp: at night it is light around NAN-E. Flickers now and then: a reject part.
nan-e-trail=VN-GO's paint gun: away from the base NAN-E leaves a coloured trail on the ground and on the map to find your way home. Only you see it, and it lasts half an hour.
nan-e-vacuum=VAQ-M's vacuum: NAN-E picks up items off the ground near her and hands them to you. She leaves the paving alone: that is M-O's. Sneezes now and then.
nan-e-umbrella=BRL-A's umbrella: in a thunderstorm a lightning bolt striking within 10 tiles of NAN-E hits her umbrella and goes out. NAN-E takes a little of it herself.
nan-e-defibrillator=D-FIB's defibrillator: when an enemy attacks you or her, NAN-E gives it a shock. It and the enemies next to it stand still for 4 seconds. No damage; recharges in 30 seconds.
nan-e-memory-1=NAN-E can read the memory cards of chapter 2.
nan-e-memory-2=NAN-E can read the memory cards of chapter 3.
nan-e-memory-3=NAN-E can read the memory cards of chapter 4.
nan-e-memory-4=NAN-E can read the memory cards of chapter 5, the last.

