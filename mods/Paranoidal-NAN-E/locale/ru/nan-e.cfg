zzzparanoidal-start-bnl=Вы упали. Я тоже когда-то упала. AUTO слушай вполуха.
Paranoidal-Droid-M-O=Д-ОК — мой коллега. Очень чистоплотный. Не мешай ему.
ic-more-qualities=Брак — это не приговор. Это мастерская.
paranoidal-robot-attrition=Дроны тоже устают. Как няни.
paranoidal-rain=Дождь — это красиво. Молния тоже, но издалека.
paranoidal-ruins=Не всё старое безопасно. Даже я.
paranoidal-CodexRPG=Опыт — это хорошо. Выводы — ещё лучше.
paranoidal-achievements=Звёздочки за поведение. Собирай.
paranoidal-tech-tree=Дерево знаний. Лезь аккуратно.
