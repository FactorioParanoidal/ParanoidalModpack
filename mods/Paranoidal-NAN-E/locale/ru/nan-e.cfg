wander-3=Посчитала трубы. Сбилась. Начну завтра.
decrypt-start=Читаю сказку… Не отвлекай, это на сорок третьем диалекте.
decrypt-done=Вспомнила! Записала в память — посмотри в моём окне.
decrypt-fake=Странно. Эта запись слишком ровная. И пахнет рекламой.
