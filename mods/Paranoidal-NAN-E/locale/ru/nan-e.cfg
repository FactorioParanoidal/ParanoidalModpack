[technology-description]
nan-e=Восстановленные НЯН-И в коробках BnL. В ремонтном отсеке их латали тем, что было под рукой, поэтому каждая следующая деталь — от бракованного робота.
nan-e-lamp=Фонарь от Л-Т: ночью вокруг НЯН-И светло. Иногда мигает — деталь бракованная.
nan-e-trail=Краскопульт от МА-ЛЯРа: вдали от базы НЯН-Я оставляет цветной след на земле и на карте, по нему можно вернуться домой. След видите только вы, он держится полчаса.
nan-e-vacuum=Пылесос от ПЫЛЕБОТа: НЯН-Я подбирает предметы с земли рядом с собой и отдаёт вам. Покрытия не трогает — там убирает Д-ОК. Иногда чихает.
nan-e-umbrella=Зонт от ЗОН-ТТ: в грозу молния, которая бьёт ближе 10 клеток от НЯН-И, попадает в её зонт и гаснет. Самой НЯН-Е при этом достаётся.
nan-e-defibrillator=Дефибриллятор от 03 МЕД: когда на вас или на неё нападает враг, НЯН-Я бьёт его разрядом. Он и враги рядом с ним 4 секунды стоят на месте. Урона нет, перезарядка 30 секунд.
nan-e-memory-1=НЯН-Я сможет читать карты памяти главы 2.
nan-e-memory-2=НЯН-Я сможет читать карты памяти главы 3.
nan-e-memory-3=НЯН-Я сможет читать карты памяти главы 4.
nan-e-memory-4=НЯН-Я сможет читать карты памяти главы 5, последней.

