camp-found=Это их ящик. «Для няни». Открой, пожалуйста. У меня руки дрожат. Это дефект.
epilogue-after=Номер следующего дела будет A113-8. Интересно, кто будет присматривать за ними.

[nan-e-lesson]
1=Урок первый: временное решение — самое постоянное.
2=Урок второй: спагетти из конвейеров тоже кормят. Кусак.
3=Урок третий: работает — не трогай. Не работает — тоже не трогай, сначала подумай.
4=Урок четвёртый: подписывай ящики. Будущий ты скажет спасибо. Нынешний — нет.
5=Урок пятый: «потом переделаю» по-бэнээловски значит «никогда».
6=Урок шестой: шина без запаса — как обед без стакана. Неудобно.
7=Урок седьмой: сначала сеть, потом завод. Не наоборот.
8=Урок восьмой: каждая лишняя развилка конвейера — проценты по техническому долгу.
9=Урок девятый: чертёж — тоже воспитание. Повторяй хорошее.
10=Урок десятый: мусор не исчезает. Он переезжает к Д-ОК.

[nan-e-joke]
1=А — автомат сборочный. Б — батарейки в комплект не входят.
2=Не бегай с гаечным ключом. Хотя… беги. Кусаки.
3=Ты поел? Обед в стакане не считается.
4=Я горжусь тобой. Это бесплатная функция. Пока.
5=Сорок семь диалектов, а «надень шлем» не помогает ни на одном.
6=Время дневного сна. Шучу. Время дневного завода.
7=Если меня нет рядом — я ищу носок Винтика. Шучу. Наверное.
8=Вымой руки после нефти. Д-ОК всё видит.
9=Кто молодец? Ты молодец. Кто будет молодцом дальше? Посмотрим.
10=Мой гарантийный срок истёк шестьсот лет назад. Я в отличной форме.

[nan-e-glitch]
1=Вспомнила… нет. Показалось. Это была реклама йогурта.
2=В памяти мелькнуло: тостер, отвёртка, смех. Дальше помехи.
3=Сорок семь пар маленьких ботинок. Где они теперь?
4=Кто-то когда-то звал меня «Ня». Мне нравилось.

[nan-e-spoiler]
bnl-safe=Шёпотом: сейф на мостике открывается логотипом. B, N и L — это сигналы, а не буквы. Больше ничего не скажу. Ой.
bnl-recorder=Секрет: самописец читает только лаборатория из самого лайнера. Остальные делают вид, что не понимают.
bnl-trail=Отсеки падали по курсу, на запад-юго-запад. Там и детали антенны. Я ничего не говорила.
bnl-code-l=Значение L знал экипаж «Аксиомы-6». Один мальчик с отвёрткой оставил его в записке на лайнере.
distress=Маяк передаёт SOS, только пока есть питание. Отключишь — минуты сохранятся. Счёт тоже.
ruins-legend=Дети рассказывали страшилку: «__1__»
robots=Взрослый секрет: если в одной сети занято больше пятидесяти дронов, они начинают падать. А в очереди на зарядку — в десять раз чаще. Ставь робопорты с запасом.
rain=Молния любит высокое: опоры, деревья, роботов. А солнечные панели в дождь дают три четверти мощности.
dok=Д-ОК не съезжает на грунт, только на покрытия. Хочешь, чтобы убирал, — мости.
quality=Изделие не бывает лучше своих ингредиентов, а брак чинит только мастерская. Это я тебе как няня говорю.
codex=Опыт дают даже срубленные деревья и разбитые камни. И исследования, конечно. Учись.
achievements=В сборке около тысячи достижений. Некоторые — за смерти. Не проверяй.

[nan-e-debt]
