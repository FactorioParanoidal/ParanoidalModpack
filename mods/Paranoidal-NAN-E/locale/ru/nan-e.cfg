paranoidal-decoration-cleanup=Цветочки убирают ради порядка. Мне цветочков жалко.
paranoidal-petrochem=Нефть пахнет. Мой датчик плачет.
paranoidal-clowns=Клоуны в сборке есть. Не бойся, они химики.

