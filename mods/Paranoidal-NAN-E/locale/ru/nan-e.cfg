paranoidal-stack-sizes=Сколько влезает в ящик, решаю не я.
paranoidal-tank-platoon=Танки ходят строем. Как дети на прогулке.
paranoidal-vehicle-physics=Машины тяжёлые. Пристёгивайся.
paranoidal-lighting=Свет — мой любимый цвет.
paranoidal-deep-storage=Глубоко положишь — далеко найдёшь.
paranoidal-autofill=Удобно. Но не ленись.
paranoidal-picker-tools=Инструменты как игрушки: убирай на место.
paranoidal-upgrade-tech=Расти. Это полезно.
