no_power-2=Этот __1__ ждёт тока, как я — благодарности.
low_power-1=__1__ еле шевелится: электричества мало. Проценты по долгу капают.
low_power-2=Свет мигает, __1__ спит на ходу. Добавь мощности.
no_recipe-1=__1__ стоит без рецепта. Как я без детей: стою и моргаю.
no_recipe-2=У __1__ нет рецепта. Он даже не знает, кем хочет стать.
no_fuel-1=__1__ без топлива. Покорми его. Не мной.
no_fuel-2=__1__ остыл. Топливо — это как обед, только для печки.
