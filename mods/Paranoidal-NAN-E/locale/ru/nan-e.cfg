[item-description]
nan-e=Восстановленная НЯН-Я в коробке BnL. Поставьте её — она загрузится и будет ездить за тем, кто её поставил. Одна няня на инженера.
nan-e-memory-card=Сказка на ночь, записанная на одном из 47 диалектов её голосового чипа. НЯН-Я расшифрует её в своём окне (Alt+N) и вспомнит ещё кусочек того, что случилось с «Аксиомой-6».
nan-e-drawing=Няня, сорок шесть человечков и большое красное солнце. Внизу подпись: «Красный — это красный». Ничего не делает. Это рисунок.

