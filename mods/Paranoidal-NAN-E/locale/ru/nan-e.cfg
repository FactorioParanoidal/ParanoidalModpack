[mod-name]
Paranoidal-NAN-E=Paranoidal NAN-E (Няня НЯН-Я)

[mod-description]
Paranoidal-NAN-E=НЯН-Я — робот-няня детского центра лайнера «Аксиома-6»: компаньон, который ездит за вами, шутит, воспитывает в вас нелюбовь к техническому долгу и иногда сама уезжает по делам на базу.\n\n— Где взять: найти выключенной у лайнера «Аксиома-6» (старт BnL) и починить ремкомплектом или собрать после исследования «НЯН-Я». У каждого игрока своя няня.\n— Память стёрта. Карты памяти («сказки на ночь») находятся в обломках, руинах и в её поисках по базе. Расшифровка стоит плат и времени (по умолчанию минута, настройка карты), главы открываются исследованиями «Восстановление памяти».\n— Дело №A113-6: что на самом деле случилось с «Аксиомой-6». Сопоставляйте воспоминания (некоторые подделаны) и предъявляйте версии на доске дела. За раскрытые вопросы она вспоминает места на карте.\n— Своя ветка исследований: фонарь, след краски до базы, пылесос (кроме покрытий — их убирает Д-ОК), зонт от молний в грозу (с Paranoidal Rain) и дефибриллятор, который оглушает напавших без урона.\n— Окно (Alt+N, ярлык или кнопка): её память, доска дела, сводка по базе, журнал её реплик и справка по модам сборки.\n— Сломанная, она не погибает, а отключается: почините её ремкомплектом.\n— В настройках: как часто она говорит (часто, редко, молчит), расстояние, прогулки по базе, спойлеры, голос и облик — свой или исходный облик Informatron.\n\nОснован на Informatron (Earendel, MIT).

