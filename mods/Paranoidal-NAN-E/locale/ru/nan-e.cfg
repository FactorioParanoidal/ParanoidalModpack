[mod-setting-description]
nan-e-look=Свой облик — парящая няня с экраном-лицом. Исходный — гусеничный робот Informatron (Earendel).
nan-e-chatter=Как часто она говорит сама: часто — раз в 2–4 минуты, редко — раз в 7–12 минут. Если молчит, остаются только воспоминания, дело и тревоги. Всё сказанное хранится в журнале её окна.
nan-e-distance=На скольких клетках она держится от вас.
nan-e-errands=Иногда она уезжает на полминуты: проверить простаивающую машину, порыться в обломках или руинах (там бывают карты памяти), осмотреть базу. Если вы далеко или рядом враги — никогда.
nan-e-spoilers=Очень редко она вспоминает секреты старта и сборки: коды, места, тонкости механик. Выключите, если хотите всё узнавать сами.
nan-e-voice=Её синтезированный лепет и мелодии. Слова всегда идут текстом.
nan-e-chat-log=Дублировать её реплики в чат.
nan-e-button=Кнопка её окна в верхнем левом углу экрана.
nan-e-decode-seconds=Сколько секунд НЯН-Я читает одну [item=nan-e-memory-card] карту памяти. Общая для всей карты.

