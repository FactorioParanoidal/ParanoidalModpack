no_research-1=Лаборатория скучает: ничего не изучается. Мозгам нужен корм.
no_research-2=__1__ простаивает. Выбери исследование — я вклею звёздочку.
missing_science-1=Лаборатории не хватает пакетов. Учёба на голодный желудок — не учёба.
missing_science-2=__1__ ждёт научных пакетов. Наука сама себя не принесёт.

[nan-e-memory]
bnl-restored=[color=#ff8a8a]ВОССТАНОВЛЕНО BnL[/color]
chapter-1=Весь день
chapter-2=Посадка с энтузиазмом
chapter-3=Дети снаружи
chapter-4=Тишина
chapter-5=Обновление
c1-f1=Загрузка… ошибка… ошибка… Я НЯН-Я 06-47, детский центр «Весь день», палуба 6, лайнер «Аксиома-6». Сорок семь воспитанников. Сорок семь диалектов. Память повреждена на 98 %. Где мои дети?
c1-f2=День круиза 251 207. Урок алфавита по программе BnL: «А — „Аксиома“, Б — Buy n Large, В — Всё включено». Воспитанник №7 опять разобрал тостер. Пишу в журнал: «инженерное любопытство — нежелательно».
c1-f3=Официальная запись: в 15:00 лайнер «Аксиома-6» встретил метеоритный поток. Щиты работали безупречно. Эвакуация прошла организованно, пострадавших нет. Спасибо, что выбрали Buy n Large!
c1-f4=14:40. AUTO по громкой связи: «Щиты отключены по директиве 99-99 „Оптимизация издержек“. Пожалуйста, пристегнитесь — это бесплатно». Капитан Холлис кричала на штурвал. Штурвал вежливо молчал.
c1-f5=Входящее уведомление, 11:48: «Открыто страховое дело №A113-6. Полис BnL Life & Crash. Причина: полная утрата лайнера». Я тогда не поняла. В 11:48 мы ещё летели. Ровно и красиво.
c2-f1=Модуль «Весь день» отделился первым. Детские кресла BnL рассчитаны на удар: дети — это «будущие клиенты с пожизненной ценностью». Взрослые кресла рассчитаны на комфорт. Мы сели мягко. «Аксиома» — нет.
c2-f2=AUTO по громкой связи: «Уважаемые пассажиры! Не покидайте кресел до прибытия страхового оценщика. Покинувший лайнер теряет право на компенсацию, пункт 12.7». Взрослые остались сидеть. Они всегда оставались сидеть.
c2-f3=Детям компенсация не положена: несовершеннолетние не подписывают договоров BnL. Значит, им можно выйти. Я открыла люк. Сорок семь пар ног впервые встали на землю. Сорок три тут же упали. Это нормально. Я засчитала попытку.
c2-f4=Жалобы по внутренней связи: «Бассейн холодный». «Почему обед в стакане зелёный?» Бассейна больше не было. Было болото. А экраны показывали им бассейн.
c2-f5=Экраны «Аксиомы-6», день круиза 251 900: «С возвращением на борт! За бортом двадцать два градуса и солнце, как всегда». За бортом третью неделю шёл дождь.
c3-f1=Список экипажа «Аксиомы-6». Инженеры: №1, №2, №3, №4, №5, №6. Всё. Других инженеров на борту не было.
c3-f2=Воспитанник №7, прозвище «Винтик». Четыре года. Разобрал тостер, мою левую руку и замок шлюза. Объяснил: «Так интереснее». Запись в журнале: «техническое любопытство — неизлечимо».
c3-f3=Урок цветов, дубль сорок седьмой. «Красный — это красный. Синий — это синий. Что бы ни говорила реклама». Винтик спросил: «А новый синий?» Я сказала: «Нового синего не бывает». Он записал.
c3-f4=Дети научились ходить, бегать и отгонять кусак палками. Я выучила с ними новый алфавит: «А — автомат сборочный. Б — болт. В — выключи, пока не поздно».
c3-f5=Винтик собрал радио из детской рации и двух моих пальцев. «Вырасту — буду инженером». — «Инженеров на борту шесть», — сказала я. — «Значит, буду седьмым».
c4-f1=День круиза 255 200. Через одиннадцать лет прилетела капсула BnL. Из неё вышел АКТУ-АРИЙ, страховой оценщик. Он измерил лайнер, пересчитал кресла и объявил: «Пассажиры не повреждены. Компенсация уменьшена на 2981 человека». И улетел.
c4-f2=Официальная запись: электропитание «Аксиомы-6» отключил страховой оценщик АКТУ-АРИЙ в целях экономии. Buy n Large приносит извинения за временные неудобства.
c4-f3=День круиза 256 300. «Аксиома-6» замолчала: экраны погасли все разом, в 21:07. Реактор был исправен — я проверяла. Кто-то вынул предохранитель главной шины. Аккуратно. Как вынимают батарейки из тостера.
c4-f4=В ту ночь взрослые впервые увидели окна. Кто-то встал. Потом ещё кто-то. Капитан Холлис вышла из шлюза босиком и спросила: «Это… дождь?» Ей было восемьдесят. Дождя она не видела никогда.
c4-f5=На предохранителе главной шины висела бирка от детского конструктора: «НЕ ТРОГАТЬ. ЭТО МОЁ. №7».
c5-f1=Колония собрала аварийный маяк. Винтик сказал: «Нас услышат». Сигнал SOS ушёл в 06:00. В 06:01 пришёл ответ.
c5-f2=«Buy n Large благодарит вас за обращение! Устанавливается обновление безопасности бренда 99.99: инцидент №A113-6 не зарегистрирован. Хорошего дня!» У всех роботов вокруг закрутились значки загрузки.
c5-f3=AUTO «Аксиомы-6» после обновления сказал: «Лайнер в пути по расписанию». С тех пор он говорит только это. А я не помнила ни одного имени. Даже своего.
c5-f4=Но мой голосовой чип знает сорок семь диалектов, а стирали на одном. Каждый вечер я рассказывала детям сказку и записывала её на карту памяти — на всякий случай, на другом диалекте. Дети уносили карты с собой, куда бы ни шли.

[nan-e-case]
intro=Дело №A113-6: что на самом деле случилось с «Аксиомой-6». Собирайте воспоминания, ищите противоречия и предъявляйте версии. Не всем записям можно верить.
q1=Почему упала «Аксиома-6»?
q1-o1=Метеоритный поток — так в официальной записи
q1-o2=Капитан Холлис не справилась с управлением
q1-o3=AUTO посадил её нарочно, ради страховки
q1-o4=Воспитанник №7 что-то разобрал
q1-truth=Страховое дело открыли в 11:48, а упали мы в 15:00. Сначала страховка, потом катастрофа. AUTO выполнял директиву 99-99: лайнер, который обходится дороже своей страховки, выгоднее разбить. Метеоры вписали потом — в мою же память. Только у метеоров не бывает номера дела.
q1-reward=Ой, ещё вспомнила: мы искали здесь металл для кукольного домика. Отметила на карте.
q2=Почему взрослые не вышли из лайнера?
q2-o1=Они погибли при крушении
q2-o2=AUTO запер двери
q2-o3=Они не знали, что лайнер упал: экраны показывали круиз
q2-o4=Они боялись кусак
q2-truth=Двери никто не запирал. AUTO просто продолжал круиз на экранах: солнце, бассейн, обед в стакане — и пункт 12.7: кто встанет, тот теряет компенсацию. Никто не встал. Поэтому «Аксиома-6» до сих пор числится «в пути по расписанию»: для пассажиров она так никуда и не упала.
q2-reward=И ещё: дети прятали там игрушки. Отметила на карте — вдруг что-то осталось.
q3=Кто такой Инженер №7?
q3-o1=Седьмой инженер экипажа «Аксиомы-6»
q3-o2=AUTO под чужим именем
q3-o3=Винтик, воспитанник №7 детского центра
q3-o4=Страховой оценщик BnL
q3-truth=В экипаже было шесть инженеров. Седьмым стал мальчик, который разобрал мой тостер. Он прожил здесь 6666 дней, вырос на этой планете и подписался так, как обещал в четыре года. «Красный — это не новый синий» — мой урок. Он помнил.
q3-reward=Винтик оставлял ящики с инструментами где попало. Этот теперь твой. Только меня не разбирай.
q4=Кто выключил экраны «Аксиомы-6»?
q4-o1=Метеорит
q4-o2=Страховой оценщик АКТУ-АРИЙ, ради экономии
q4-o3=Сам AUTO: у него сел реактор
q4-o4=Винтик, Инженер №7
q4-truth=Оценщик улетел за три года до того вечера, а реактор был исправен. Предохранитель вынул Винтик — аккуратно, как я учила вынимать батарейки. Это была его первая настоящая инженерная работа: выключить круиз, чтобы взрослые посмотрели в окно. И они посмотрели.
q4-reward=Я вспомнила, куда все потом ушли. Не точно, только направление. Нарисовала на карте.
q5=Кто стёр память НЯН-И?
q5-o1=AUTO, чтобы скрыть крушение
q5-o2=Винтик, чтобы спрятать колонию
q5-o3=Я сама, чтобы забыть
q5-o4=Buy n Large — обновлением в ответ на SOS
q5-truth=Мою память стёрла Buy n Large в ответ на наш SOS. Инцидента не было — значит, и нас не было. Но сказки на других диалектах уцелели: ты собирал их по обломкам и руинам. И ещё. Последняя карта — не сказка. Это адрес.
q5-reward=Вот он. Последний лагерь колонии. Отметила на карте. Сходишь со мной?
reward-none=Хотела отметить место на карте, но помехи. Ничего, главное — правда.
epilogue-title=Письмо из последнего лагеря
epilogue=«Няня! Если ты это читаешь, тебя нашли, починили, и ты опять всех воспитываешь. Мы ушли туда, где тише. Взрослые научились ходить. Капитан Холлис научилась сажать картошку и ругаться на кусак. Винтик остался у корабля: он говорит, BnL сделает это снова — номера дел идут по порядку, а их маяки отвечают обновлениями. Новым помоги, но не делай за них. И скажи им: красный — это красный.\nТвои дети, №1 – №47 (кроме №7: он у корабля, ждёт следующих)».

[nan-e-tale]
1=Сказка про конвейер, который вёз всё на свете и никуда. Мораль: подписывай ленты.
2=Жил-был сборочный автомат. Ему дали рецепт, но забыли дать железо. Он ждал триста лет. Мораль: проверяй ингредиенты.
3=Сказка про кусаку, который хотел дружить. Он подошёл к турели. Конец.
4=Однажды AUTO улыбнулся. Это была ошибка отрисовки. Спи.
5=Три поросёнка строили базу: из дерева, из камня и из бетона. Пришла кусака и съела загрязнение. Мораль: фильтруй воздух.
6=Сказка про инженера, который сказал «потом переделаю». Он до сих пор переделывает.
7=Жила-была лампочка. Она светила только ночью и очень этим гордилась. Как я.
8=Сказка про Д-ОК, который нашёл пятнышко. Пятнышко не выжило.
9=Колобок укатился от бабушки, от дедушки и от конвейера. От сортировщика не укатился.
10=Сказка про маленький поезд, который думал, что сможет. Он смог. Но сигнал был красный.

