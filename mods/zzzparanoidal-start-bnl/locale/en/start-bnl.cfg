[technology-description]
bnl-flight-recorder-decoding=Load the Axiom-7 flight recorder into the salvaged lab from the starliner (no other lab reads it) and learn what really happened to the starliner. The BnL licence agreement does not approve.

[modifier-description]
bnl-flight-recorder-decoding=The truth about the crash, a couple of interesting coordinates and a small bonus from the marketing department

