[entity-description]
salvaged-lab=The lab of the starliner, patched up. The only lab that can read the flight recorder - do not lose it before the decoding.
aai-big-ship-wreck-1=May contain surviving cargo. Some resources can be Salvaged.
aai-big-ship-wreck-2=May contain surviving cargo. Some resources can be Salvaged.
aai-big-ship-wreck-3=May contain surviving cargo. Some resources can be Salvaged.
aai-medium-ship-wreck-1=May contain surviving cargo. Some resources can be Salvaged.
aai-medium-ship-wreck-2=May contain surviving cargo. Some resources can be Salvaged.
aai-small-ship-wreck=Some resources can be Salvaged.
bnl-compartment-reactor=BnL "Fusion Lite" module: "almost safe, almost forever". Repair it fully with repair packs and it gives a lot of power. Not for long: the core is holed, and it shows more every minute. Until repaired it gives nothing but radiation; the warranty strongly advises against leaving a holed core unattended. While the core is hot it is radioactive around and taking it apart voids the warranty. A cold compartment can be mined; rumour has it there is something for calling home inside.
bnl-compartment-medbay=The detached medical bay. BnL "Health by Subscription" first aid: everything to last a bit longer, and something for calling home. The subscription expired 700 years ago.
bnl-compartment-armory=The starliner's armory. BnL sold weapons "for self-defence against low prices only". Guarded by the local wildlife that has already moved in and does not accept returns. Somewhere among the barrels lies something for calling home, too.
bnl-compartment-hydroponics=The starliner's hydroponics: seeds, seedlings and what is left of the greenhouse. The only place aboard where anything grew besides credit debt. No antenna parts here: the hydroponics never meant to call home - it likes it here.
bnl-compartment-engineering=The engineering bay fell into the water. Spare parts, and something for calling home. The door sign says: "Staff only. Staff too - everything at BnL runs by itself."
bnl-escape-pod=The pod you landed in apart from the others. Your own kit is inside. The window seat was extra.
bnl-captain-safe=A safe with a BnL code lock. Inside: the captain's sealed personal effects; no inventory list attached, BnL discloses the contents only on opening. Put the signals B, N and L with the right values on the safe - a constant combinator and a wire will do; the lock checks the code by itself. The lock is old: it answers a familiar letter with a click. Yes, the code is literally the logo. BnL Security is very proud of it.
bnl-old-expedition=A BnL starliner of the same series. It came down here long before you, is overgrown by now and is still listed as "on schedule".
bnl-distress-beacon=Sends an SOS to the Buy n Large head office: one minute of work with power. Calls are charged, dropped calls too.
scrap=What is left of the hull that ploughed the ground on landing. BnL accounting calls it "premium recycled material". Mined by any drill, recycled by hand or in a recycler into random parts.
bnl-distress-receiver=A beacon with nothing left to say. It listens instead, like an ordinary radar. BnL calls it "rescue standby mode"; standing by is optional.

