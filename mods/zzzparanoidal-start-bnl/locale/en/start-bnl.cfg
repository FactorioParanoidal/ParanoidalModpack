[item-description]
bnl-flight-recorder=The starliner's "black box" (actually orange: in the 2105 season BnL declared orange the new black). Put it into a lab and research "Flight recorder decoding".
bnl-antenna-part=One of the three parts of the distress antenna. Look in the compartments that broke off the starliner. Sold only as a set, which is not for sale.
bnl-distress-beacon=Built from three antenna parts; give it power to call for help. BnL guarantees you will be heard. Helped is not guaranteed.
bnl-engineer-note=A crumpled, oily sheet - the only document on this planet not written by the marketing department. Use it to read it.
bnl-advertising-flyer="Buy n Large - everything you need to be happy!" Useless to read, burns very well: the most useful BnL product on this planet.
scrap=Recycled into random parts by hand or in a recycler.

