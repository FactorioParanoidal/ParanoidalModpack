[bnl-profession-description]
guard=Guarded the duty-free tills. Twelve years without a single theft (nobody ever got out of their chair).\n\nIn the backpack: [item=submachine-gun] submachine gun, [item=shotgun] shotgun, [item=light-armor] light armor, [item=gun-turret] turret, 3 [item=firearm-magazine] magazines. All the ammo of the wrecks and the starliner is with him at once (shared equally among several guards), none of it cooks off in the fires.\nHalf researched: military, turrets, stone walls.
geologist=Picked stones for the BnL souvenir shop "A stone from a real planet!" (made aboard from recycled cups). Finally, a real planet.\n\nIn the starliner's cargo: [item=ore-radar] geological radar.\nHalf researched: geological radar, ore crushing, electric mining drill.
mechanic=The only one aboard who knew where the wrench was. Everyone else thought M-O had hidden it.\n\nIn the backpack: [item=ic-refine-workshop] refine workshop; twice the repair packs in the starliner.\nResearched: quality control 1-4.\nHalf researched: automation, repair pack II, quality control 5.
biologist=Looked after the only plant aboard. It was plastic, but he tried. EVE never found it.\n\nIn the backpack: [item=bi-seed] 100 seeds, [item=bi-bio-greenhouse] 2 greenhouses; seed and seedling recipes unlocked. 10 minutes after the landing BnL delivers a [item=bi-bio-farm] bio farm.\nHalf researched: bio farming, timber, lamps.
passenger=Spent fifteen years in a hover chair with lunch in a cup. The legs remember how to walk, roughly. Blue is the new red, and you are the new engineer.\n\nNo bonuses: the classic Paranoidal start. Good luck, you will need it.

