[bnl-profession-description]
guard=Guarded the duty-free tills. Twelve years without a single theft (nobody ever got out of their chair).\n\nCarries something that shoots and the habit of shooting first. Smells the crash ammo from afar: the first shots will not burn in a fire. Remembers how to hold a defence line from the service, though only half of it. Runs faster than anyone aboard and is tougher: more health (+3-9 RPG levels).
geologist=Picked stones for the BnL souvenir shop "A stone from a real planet!" (made aboard from recycled cups). Finally, a real planet.\n\nSomewhere in the starliner cargo his work tool is waiting: the one that looks through the ground. Half remembers where to look, what to crush and how to drill, and how radars work. Digs fast, and his pockets are bottomless: +10 inventory slots. Carries an ore radar and three burner drills; the land around is charted at once with the nearest ores marked, the scrap deposit and the rare vein too. Every second handful of ore mined by hand is double.
mechanic=The only one aboard who knew where the wrench was. Everyone else thought M-O had hidden it.\n\nIn the backpack: the thing that turns defects into decent goods. Knows where the repair packs were hidden aboard, so there will be noticeably more of them (twice as many; every further mechanic adds 100). Quality control is in his blood, automation at his fingertips. Quick and long hands: starting crafting speed and reach researched.
biologist=Looked after the only plant aboard. It was plastic, but he tried. EVE never found it.\n\nIn the backpack: something that grows and a place for it to grow. Soon after the landing BnL delivers an order he placed aboard and forgot. Half remembers how to grow, how to cut and where the light switch is. Wears a respirator, his seeds are hand-picked (quality +1-4) and he stocked twice as much water. Cuts trees wisely: every second one gives twice the wood.
passenger=Spent fifteen years in a hover chair with lunch in a cup. The legs remember how to walk, roughly. Blue is the new red, and you are the new engineer.\n\nNo bonuses: the classic Paranoidal start. Good luck, you will need it.

