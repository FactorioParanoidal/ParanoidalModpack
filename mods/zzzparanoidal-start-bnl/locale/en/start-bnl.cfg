[mod-setting-description]
zzzparanoidal-shipwreck-start=Supplies in the crashed ship, its debris and the AAI wrecks and their mining loot on a new freeplay map. The player starts with an empty inventory.\nMinimum: half of the supplies; finished items that can be defective and all electric poles get a random defect: none 5%, −1 15%, −2 25%, −3 25%, −4 20%, −5 10%.\nMedium: the full supplies, normal quality.\nRich: the full supplies; every finished item gets a random quality: normal 25%, +1 30%, +2 20%, +3 13%, +4 8%, +5 4%.\nMaterials, intermediate products and belts are always normal; half of the repair packs (at least 10) are always normal, without defects; every item type gets one quality per map. Ruins are not affected.
bnl-start-professions=After the landing every player chooses a former job: guard, geologist, mechanic, biologist or passenger. Each gives its own kit and half-researched technologies. Applies to new maps only.
bnl-start-pause=In single player the game is paused while the profession choice is open.
bnl-start-intro=Instead of the standard cutscene the camera flies along the debris trail to the starliner. Tab skips it.
bnl-start-falling-debris=For about 10 minutes stragglers of the starliner keep falling around the crash site: the shadow of the piece and the roar of a low pass (up close, the whistle of a shell) warn of the impact, a wreck with cargo stays there. Sometimes a piece falls right onto your buildings.
bnl-start-wreck-fires=Most wrecks carry something that reacts to fire: ammo, fuel barrels, gas cylinders (they fly off), high-tech fuel, explosives, oxygen or batteries; what does not go off is loot. Fires can be steady, smouldering, blazing (throwing embers) or flaring; fuel inside burns as torches. Some wrecks catch fire after the landing, a fire nearby sets others burning, bursts can set your buildings on fire. Water barrels in a wreck slow the fire and put it out. A burning wreck burns down to 2–10% of its health while what it carries goes off; everything inside loses one quality step at 75%, 50% and 25% health and one more when the fire goes out (only items that can be defective go down to defects, −5 at most; materials stop at normal); each time a whole stack may burn away (20%). Take the cargo out or mine the wreck to save it.
bnl-start-debris-trail=A trail of debris 500-800 tiles long stretches west-south-west of the starliner with the compartments that broke off: reactor, medical bay, armory (guarded), hydroponics and engineering (in the water). The starliner of the previous expedition is nearby too.
bnl-start-supply-pods=After the first radar BnL accepts the crash as an insurance case: pods with one kind of cargo fall near the radar, less and less often, until the insurance is cancelled.
bnl-start-anomaly=A feature of the planet reported by the landing scanner. Random picks one of five.
bnl-start-mp-capsules=In multiplayer every next player created in the first 10 minutes lands in an own pod 100-200 tiles from the starliner with a different kit. Find each other first.

