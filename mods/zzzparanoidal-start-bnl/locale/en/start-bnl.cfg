[item-description]
salvaged-lab=The lab of the starliner, patched up. The only lab that can read the flight recorder - do not lose it before the decoding.
bnl-flight-recorder=The starliner's "black box" (actually orange: in the 2105 season BnL declared orange the new black). Only the salvaged lab from the starliner can read it: put it there and research "Flight recorder decoding". Fireproof case: the only thing BnL did not cut costs on.
bnl-antenna-part=A part of the distress antenna. The beacon needs three - look in the compartments that broke off the starliner (marked on the map with this very part). There were spares aboard: BnL always sells one more than you need. Sold only as a set, which is not for sale.
bnl-distress-beacon=Built from three antenna parts: place it and give it power for a minute of transmission. BnL guarantees you will be heard. Helped is not guaranteed.
bnl-engineer-note=A crumpled, oily sheet - the only document on this planet not written by the marketing department. Use it to read it.
bnl-advertising-flyer="Buy n Large - everything you need to be happy!" Useless to read, burns very well: the most useful BnL product on this planet.
scrap=Recycled into random parts by hand or in a recycler.

