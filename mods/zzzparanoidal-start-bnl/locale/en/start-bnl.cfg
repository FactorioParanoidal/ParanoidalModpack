[bnl-journal-text]
flight-log-1=AUTO: Buy n Large star cruise, starliner Axiom-7. Course set for the resort planet New Eden 4. Passengers aboard: 3412. The average passenger weight exceeds the chair load capacity by 18%. A chair upgrade is recommended for only 99.99 credits. Reminder: lunch is served in a cup.
flight-log-2=Captain: Found the word "engine" in the archive. Asked AUTO what it means. AUTO said the question is not included in my plan. I did learn that BnL started out as frozen yogurt. Explains a lot.
flight-log-3=AUTO: Order from the Buy n Large head office received, directive 99-99 "Cost optimisation". Switched off: shields, backup reactor, repair drones, engines 3 and 5. Holographic ads and coffee machines stay on: they make a profit.
flight-log-4=Captain: Are we falling?\nAUTO: We are descending with increased enthusiasm. Please stay in your chairs and rate our service from one to five stars.\nCaptain: Is this A113?!\nAUTO: Directive A113 forbids returning to Earth. It says nothing about other planets. Landing approved.
flight-log-5=AUTO: Unscheduled separation of compartments detected: reactor, medical, armory, hydroponics, engineering. The compartments are now "lost luggage". Claims are accepted within 700 years at: Buy n Large, North™. The emergency beacons of the compartments are marked on the map.
flight-log-6=Captain: If anyone hears this - don't trust AUTO and don't sign anything in small print. The reactor is holed: once repaired it will last about an hour, and only the first minutes at full power. The safe on the bridge opens with the BnL code... The old Axiom-6 came down somewhere here before us; its crew knew the last digit. Marking it on the map. And no: blue is NOT the new red.
flight-log-safe=The captain's safe code is given as signals: B = __1__, N = __2__. The captain did not remember L - the crew of the Axiom-6 knew it. A logo for a password: an initiative of BnL Security.
flight-log-reward=The recorder data contains the course "Engineer from scratch" in the handy format of red science packs: __1__, already in your backpack.\n"Attention, shoppers! Red is the new blue!" © Buy n Large, Recolouring Department.
insurance-start=The radar caught a Buy n Large broadcast: "Dear customer! Your starliner has crashed. This is insurance case #A113-7 under your 'BnL Life & Crash' policy. Compensation will be delivered by pods around your radar on a first come, first served basis, while you are alive. Thank you for choosing BnL!" __1__
insurance-end=BnL: "The compensation limit is used up. Your insurance is cancelled. We offer a new one for only 99,999 credits a month! The first month is also 99,999 credits."
insurance-cancelled=BnL: "Our analysts have detected signs of economic independence. The insurance is cancelled under clause 12.7: the customer is doing too well on their own. Independence is not a licensed Buy n Large product."
profession-guard=__1__ is a former security sergeant. Personal file opened: a submachine gun, a shotgun, light armor and a turret at hand, and the crash ammo comes to him. Half remembers the military, turrets and walls. No gun licence.
profession-geologist=__1__ is a geologist. Personal file opened: a geological radar waits in the starliner cargo; ore crushing and electric drills are half remembered. No more stones for the souvenir shop.
profession-mechanic=__1__ is a mechanic. Personal file opened: a refine workshop in the backpack and more repair packs than usual aboard. Knows quality control well, automation and heavier repairs by half.
profession-biologist=__1__ is a biologist. Personal file opened: seeds and greenhouses at hand, seedling recipes known, and BnL delivers a bio farm soon. Half remembers farming, timber and lighting.
profession-passenger=__1__ is a passenger. No skills, but a great tan from the chair lamps and a BnL gold card with a zero balance.
anomaly-long-night=Landing scanner: the days here are uneven. The first three nights will be twice as long. The sun of this planet is not BnL property, so it works however it likes. Stock up on light and ammo.
anomaly-magnetic-storm=Landing scanner: the magnetosphere is unstable. Every few minutes magnetic storms will blind your radars until "__1__" is researched. North remains a BnL trademark regardless.
anomaly-rich-vein=Landing scanner: the starliner struck a rich vein on impact: __1__ __2__. At least something good came of the crash. BnL will file the mining rights later.
anomaly-quiet-planet=Landing scanner: the local wildlife is hibernating. It will wake up in two hours. All of it. At once. Like shoppers on a BnL Black Friday.
anomaly-dust-storms=Landing scanner: dust storm season. Storms will bring clouds of pollution to your base; AUTO warns a minute ahead. Compared to Earth in 2105 it is practically a resort.
expedition-note=__1__ reads the note:\n"I've been here 6666 days. BnL won't come. I almost fixed the car next to the ship - take it. The BnL safe master code hasn't changed in seven centuries: L = __2__. Don't trust the insurance and don't trust AUTO.\nEngineer #7, Axiom-6.\nP.S. Red is not the new blue."
turret-veteran=The ship turret "__1__" held through the first attacks (kills: __2__) and became a crash veteran. Buy n Large expresses its gratitude and will bill you for the ammo used.
distress-sent=SOS sent from the distress beacon __1__. Please wait for the reply. The average Buy n Large response time is between two minutes and seven centuries.
distress-reply=Buy n Large answering machine, video message from CEO Shelby Forthright (recorded in 2105): "Hi there! If you're hearing this, everything is going according to plan. A rescue mission has been found not cost effective. Due to the loss of the starliner you are fired; your last salary is withheld against its cost. Stay the course! Because with BnL not even space is the limit!©"
letter-logistic-science-pack=BnL: "We have noticed that you produce green science packs. Please be reminded that the colour green is a registered trademark of Buy n Large, as is north. Licence fees will be charged automatically."
letter-chemical-science-pack=BnL: "Congratulations! Your colony has been moved to the 'emerging market' category. Within the next 300 years an advertising drone will reach you and a supercentre will open. Possibly on your base."
letter-rocket-silo=BnL: "We have detected the construction of a rocket silo. Please be reminded of directive A113: no return is provided for. Buy n Large does not service, insure or approve third-party rockets."
letter-space-construction=BnL: "Are you building a ship? This violates clause 113 of your employment contract - which, admittedly, has been terminated. We look forward to seeing you in orbit... to bill you for parking."
letter-rocket=BnL: "Our radars registered a rocket launch from your planet. Your application for reinstatement has been accepted for review. Review time: 700 years. We grew out of frozen yogurt; we will grow out of you too. Thank you for choosing Buy n Large!"\nTime to fly up and tell them everything in person.
recorder-signal=AUTO: the Axiom-7 flight recorder has stopped falling and is sending a signal: __1__. Only the starliner's own equipment can read it - BnL licensed nothing else.
damage-report=AUTO: damage report of the starliner Axiom-7 (short version, 4093 pages omitted).\n• The cargo is on fire. Water barrels are in your inventory: key 1, left-click a burning wreck. Put it out first, take it apart later.\n• The comms antenna is lost together with the compartments that broke off along the course - west-south-west; they are marked on the map. The distress beacon needs three antenna parts.\n• The flight recorder was thrown out at the landing. AUTO will report its bearing once it finally stops falling.\nOverall landing rating: ★★★★★. The rating is not subject to appeal.
insurance-sos=Your SOS has been forwarded to the Buy n Large insurance department: "Dear customer! The crash is recognised as insurance case #A113-7 under your 'BnL Life & Crash' policy. Rescuing you is not cost effective; compensating you is. Pods will be delivered around your beacon on a first come, first served basis, while you are alive." __1__
safe-open-bridge=__1__ picked the BnL code. Inside: "a captain's bridge in a suitcase" - modular armor and everything needed to build without getting up. Aboard, the captain never did anything himself either - robots did it for him. At the bottom: a yellowed postcard "Operation Cleanup: back in 5 years!"
safe-open-quality=__1__ picked the BnL code. It was the safe of the quality director: quality modules and samples of "premium grade" products - the only things aboard that ever passed inspection. At the bottom: a BnL gold card with a zero balance, marked "Quality is our priority #7".
safe-open-personal=__1__ picked the BnL code. Inside: the captain's personal effects - armor, an exoskeleton "for deck walks" (never switched on), night vision and shields. The case of brandy, judging by everything, the captain finished while the starliner was still alive. At the bottom: a yellowed postcard "Operation Cleanup: back in 5 years!"
reminders-retired=AUTO: the free reminder period has expired. What was left undone (__1__) has been archived. Extending the "AUTO Protocol Premium" subscription is 99.99 credits per hour. No matter: everything works without reminders - just like you.
insurance-act=Buy n Large, insurance department. Closing act of insurance case #A113-7 (policy "BnL Life & Crash").\n• Wrecks put out: __1__. Burnt out: __2__. Cargo stacks burnt: __3__.\n• SOS sent: __4__ after the landing.\n• Antenna parts found: __5__ of __6__ required.\n• Flight recorder decoded: __7__.\n• Survivors: __8__.\nEstimated survival rating: __9__. Rounded up by marketing to ★★★★★. The rating is not subject to appeal, the insurance case is closed, and so are you. Thank you for choosing Buy n Large!
