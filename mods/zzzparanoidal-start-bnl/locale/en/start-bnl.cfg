[entity-description]
aai-big-ship-wreck-1=May contain surviving cargo. Some resources can be Salvaged.
aai-big-ship-wreck-2=May contain surviving cargo. Some resources can be Salvaged.
aai-big-ship-wreck-3=May contain surviving cargo. Some resources can be Salvaged.
aai-medium-ship-wreck-1=May contain surviving cargo. Some resources can be Salvaged.
aai-medium-ship-wreck-2=May contain surviving cargo. Some resources can be Salvaged.
aai-small-ship-wreck=Some resources can be Salvaged.
bnl-compartment-reactor=BnL "Fusion Lite" module: "almost safe, almost forever". Repair it fully with repair packs and it feeds 15 MW into the grid, but the core is holed: 5 minutes after the repair only 5 MW are left, then the output slowly fades and is gone after an hour. Until repaired it gives nothing but radiation; the warranty strongly advises against leaving a holed core unattended. While the core is hot it is radioactive around and taking it apart voids the warranty. A cold compartment can be mined.
bnl-compartment-medbay=The detached medical bay. BnL "Health by Subscription" first aid: fish, repair packs, a hazmat suit and one antenna part. The subscription expired 700 years ago.
bnl-compartment-armory=The starliner's armory. BnL sold weapons "for self-defence against low prices only". Guarded by the local wildlife that has already moved in and does not accept returns.
bnl-compartment-hydroponics=The starliner's hydroponics: seeds, seedlings and what is left of the greenhouse. The only place aboard where anything grew besides credit debt.
bnl-compartment-engineering=The engineering bay fell into the water. Metal, gears, circuits and an antenna part. The door sign says: "Staff only. Staff too - everything at BnL runs by itself."
bnl-escape-pod=The pod you landed in apart from the others. Your own kit is inside. The window seat was extra.
bnl-captain-safe=A safe with a BnL code lock. Put the signals B, N and L with the right values on the safe and point at it. Yes, the code is literally the logo. BnL Security is very proud of it.
bnl-old-expedition=A BnL starliner of the same series. It came down here long before you, is overgrown by now and is still listed as "on schedule".
bnl-distress-beacon=Sends an SOS to the Buy n Large head office. Needs electricity. Calls are charged.
scrap=What is left of the hull that ploughed the ground on landing. BnL accounting calls it "premium recycled material". Mined by any drill, recycled by hand or in a recycler into random parts.

