flyer-2=AXIOM - 5-YEAR SPACE CRUISE while we clean up the mess you bought. Return date subject to Directive A113
flyer-3=CRASHED? We've got you covered!* - *coverage ends at the first logistic science pack, claims processed within 700 years
flyer-4=...THING MUST G... ...ding yo... - the flyer is burnt, the message is intact
player-crash-landed=Last message from AUTO, autopilot of the starliner Axiom-7: WARNING, __1__!!! YOUR STARLINER HAS ENTERED THE DENSE ATMOSPHERE OF THE NEAREST PLANET AND MADE AN EMERGENCY LANDING WITH INCREASED ENTHUSIASM! Your flight has been rated ★★★★★ automatically. Thank you for choosing Buy n Large! «Because with BnL not even space is the limit!©»
fallback-player-name=The Engineer
journal-button=BnL journal - the AUTO protocol goals are inside
journal-title=BnL journal - "Everything you need to be happy!"
journal-new=New journal entry: [font=default-bold]__1__[/font] (BnL button top left, command /bnl-journal)
journal-command=Opens the BnL journal.
cargo-burnt=Cargo burnt: −__1__
fire-quenched=Fire out: water
wreck-too-hot=Too hot! Put the fire out first, then mine it
fuel-on-fire=That was NOT water! Your hands are on fire, everything you look at bursts into flame!
cargo-lost=Burnt away: __1__ ×__2__
cargo-burnt-hint=The wrecks are burning: ammo, fuel, gas and explosives inside go off and the cargo loses quality! A burning wreck can be neither opened nor mined: first pour a water barrel on it (take a barrel, key 1, and left click the burning wreck; everyone has 20 barrels in the inventory), then take the cargo or mine it. What was put out does not catch fire again for 5 minutes. BnL reminds you: fire damage is not covered by the warranty. __1__
falling-warning=AUTO: __1__ incoming! Estimated impact point: __2__. Please note: falling debris remains the property of Buy n Large.
falling-size-big=a large starliner section
recorder-signal=Flight recorder beacon: __1__. The recorder can be decoded in the salvaged lab from the starliner - against the licence agreement.
reactor-online=Fusion Lite module online: __1__ MW, and falling. The core is holed: 5 MW in 5 minutes, zero in an hour. Extended warranty: 99.99 credits. __2__
reactor-label=Reactor: __1__ MW
reactor-meltdown-hint=Looks like some uncontrolled nuclear reaction is starting right next to me...
reactor-exploded=The reactor compartment of the Axiom-7 has blown up. Not a warranty case: the core was never repaired. __1__
reactor-label-broken=Reactor damaged: repair it fully
reactor-cold=The core of the reactor compartment has cooled down. No more radiation, no more warranty; the compartment can be taken apart (an antenna part inside). __1__
pod-incoming=BnL insurance pod descending: __1__
pod-incoming-far=BnL insurance pod descending... slightly off course (north is a BnL trademark, the other directions are unlicensed): __1__
pod-biofarm=BnL: your order "Bio farm" is on its way! Free delivery, provided you are alive when it arrives. Delivery point: __1__
profession-title=BnL passenger file
profession-intro=AUTO asks you to confirm who you were aboard the Axiom-7. It decides what you find in your pockets and what you learned between two cocktails. The choice cannot be changed: identities are non-refundable.
profession-pick=That's me
profession-chosen=__1__: formerly a __2__.
guard-ammo=The sergeant collected all the ammo from the wrecks and the starliner: __1__.
profession-command=Opens the profession choice if it has not been made yet.
turret-plate=__1__, crash veteran
turret-fallen=The ship turret "__1__" has fallen. Repairs at a BnL service centre in 700 years. __2__
capsule-landed=__1__ landed in an escape pod __2__ tiles from the starliner. Find each other!
distress-built=Distress beacon set up. Give it power: sending the SOS takes a minute, billed per minute.
distress-again=BnL: your signal has already been received. Repeated requests are charged separately.
anomaly-long-night-end=The long nights are over. Days go as usual from now on - no BnL sunshine subscription required.
anomaly-magnetic-storm-now=Magnetic storm! The radars are blind for a minute.
anomaly-magnetic-storm-end=The radars are shielded: magnetic storms no longer bother them.
anomaly-quiet-planet-end=THE PLANET HAS WOKEN UP. All the local wildlife remembered you at once. Unlike BnL.
anomaly-dust-storm-warning=In a minute a dust storm will cover __1__ with a cloud of pollution. Back home you would call it "BnL fresh air".
anomaly-dust-storms-end=The dust storm season is over.
sos-label=SOS: __1__ of __2__ s
distress-receiver=AUTO: the distress beacon is switched to receive. Transmitting is charged at BnL, receiving is free for now. Look around while it lasts.
insurance-bonus=BnL: your SOS has been added to insurance case #A113-7 - __1__ more pods are due. Customer gratitude is charged separately.
goal-title=[img=bnl-logo-small] [font=default-bold]AUTO protocol[/font]
goal-fires=[virtual-signal=signal-fire] Burning wrecks: __1__
brief-fire-1=AUTO: damage report, page 1 of 4096. The cargo is on fire! Water barrels are in your inventory: take one (key 1) and left-click a burning wreck. Put it out first, take it apart later: BnL takes nothing back hot.
brief-fire-2=AUTO: there is a fire aboard, which is technically impossible: fires are not part of your plan. Water barrels are in your inventory (key 1), left-click a burning wreck. Take apart only what has cooled down.
brief-fire-3=AUTO: the cargo temperature has risen to "on fire". Recommendation: a water barrel (key 1), left-click the fire. Complaints about the fire are accepted after it is over.
brief-antenna-1=AUTO: the comms antenna is lost together with the compartments that broke off along the course - west-south-west. They are marked on the map already. You may call home; not for free.
brief-antenna-2=AUTO: no connection to the head office - the antenna is scattered over the compartments dropped west-south-west. Icons on the map. Collect three parts: BnL really wants to bill you for the call.
brief-antenna-3=AUTO: inventory complete. Antenna: sold separately, in the compartments west-south-west (see map). The distress beacon needs three parts. Pick-up only.
antenna-found-1=Antenna part: __1__ of __2__. AUTO counts the find and starts charging for storage.
antenna-found-2=Antenna part: __1__ of __2__. Its warranty expired 700 years ago, but it looks as good as new. Almost.
antenna-found-3=Antenna part: __1__ of __2__. AUTO reminds you: antenna parts are not subject to exchange, return or understanding.
antenna-found-4=Antenna part: __1__ of __2__. BnL logistics is proud: delivery in just 700 years and one crash.
antenna-all-1=Antenna part: __1__ of __2__ - a full set! The distress beacon can be built. AUTO is already preparing the bill for the call.
antenna-all-2=Antenna part: __1__ of __2__. A full set against every BnL forecast. The beacon awaits assembly, the head office awaits your (paid) call.
antenna-all-3=Antenna part: __1__ of __2__. Congratulations, you have completed the "Call Home" set! Batteries not included, as always - it needs power.
antenna-found-extra-1=Antenna part: __1__ of __2__. BnL does not pay for overfulfilling the plan, but a spare part never hurt anyone.
antenna-found-extra-2=Antenna part: __1__ of __2__. A spare. BnL always sells one more than you need - that is the business model.
antenna-found-extra-3=Antenna part: __1__ of __2__. This one is spare. AUTO filed it under "lost profit".
distress-interrupted-1=SOS transmission interrupted: the beacon lost power __1__. The seconds do not expire - unlike your subscription.
distress-interrupted-2=Connection lost __1__. The subscriber is temporarily unavailable - and so is the power. The minutes are saved, so is the bill.
distress-interrupted-3=SOS on hold __1__: the beacon has no power. AUTO put the head office on hold music. Eight hours, on loop.
falling-warning-medium-1=AUTO: a hazardous object has entered the atmosphere!
falling-warning-medium-2=AUTO: BnL property incoming. Do not catch.
falling-warning-medium-3=AUTO: a hull piece on approach. Helmets were not included in the ticket.
falling-warning-medium-4=AUTO: some more starliner! The landing continues.
safe-no-signal-1=BnL code lock: put the signals B, N and L on the safe
safe-no-signal-2=The lock awaits the signals B, N and L. Knocking does not help, the captain tried
safe-no-signal-3=The safe is silent: not a single signal. Try a wire - it is like a key, only by BnL
safe-wrong-code-1=BnL code lock: wrong code. The attempt has been charged to your account.
safe-wrong-code-2=Wrong. BnL Security has listed you as a suspect. As if there were anyone else
safe-wrong-code-3=Code rejected. A BnL hint: it is our logo. The hint is charged
safe-wrong-code-4=Miss. The lock yawned and went on waiting
safe-solved=Clicked already: __1__.
safe-click=click: __1__
safe-latched-1=The safe lock clicked: __1__ = __2__. BnL Security pretends it heard nothing.
safe-latched-2=Click! The letter __1__ gave in (__2__). The BnL lock is the only employee of the company that admits mistakes.
safe-latched-3=Safe: __1__ = __2__, accepted. The remaining letters hold on with their last strength.
safe-latched-4=The lock recognised __1__ (__2__) and clicked with joy. It has not heard anything familiar for 700 years.
first-quench-1=AUTO: the first fire is out. Congratulations! Your fire safety rating went up from "catastrophe" to "disaster".
first-quench-2=AUTO: fire put out with water. BnL notes: water is the only resource on this planet we have not billed you for yet.
first-quench-3=AUTO: fire eliminated. The steam is on the house.
first-stack-lost-1=AUTO: some cargo burnt to ashes. Do not worry: the insurance does not cover it, so there is nothing to fill in.
first-stack-lost-2=AUTO: cargo converted to "ash". Ash is BnL property too.
first-stack-lost-3=AUTO: cargo lost in the fire. Marketing calls it "a sale with a spark".
water-out-1=AUTO: no water barrels left. Left-click water with an empty barrel: all the empty ones fill at once. Water is free here, luckily. For now.
water-out-2=AUTO: the water ran out, the fires did not. Go to a lake and left-click the water with an empty barrel: BnL calls it "self-service".
water-out-3=AUTO: water supply exhausted. The nearest lake is your new best friend: left-click the water with an empty barrel, and every empty barrel is full.
goal-fires-water=[virtual-signal=signal-fire] Burning wrecks: __1__ · [item=water-barrel] water barrels: __2__
goal-fires-dry=[virtual-signal=signal-fire] Burning wrecks: __1__ · no water: left-click water with an empty barrel
goal-recorder-find-1=[item=bnl-flight-recorder] Find the flight recorder: __1__
goal-recorder-find-2=[item=bnl-flight-recorder] The recorder is sending a signal: __1__. It is orange, you cannot miss it
goal-recorder-find-3=[item=bnl-flight-recorder] Pick up the recorder: __1__. It survived the crash - it will survive you
goal-recorder-decode-1=[item=bnl-flight-recorder] Decode the flight recorder. BnL does not license third-party labs.
goal-recorder-decode-2=[item=bnl-flight-recorder] Decode the recorder - in the starliner's own lab. Other labs are not cleared for the truth.
goal-recorder-decode-3=[item=bnl-flight-recorder] Decode the recorder. It takes the lab from the starliner and some power - like everything good.
goal-recorder-decoding-1=[item=bnl-flight-recorder] Decoding the recorder: __1__%
goal-recorder-decoding-2=[item=bnl-flight-recorder] Decoding: __1__%. AUTO is nervously deleting logs
goal-recorder-decoding-3=[item=bnl-flight-recorder] Reading the recorder: __1__%. The licence agreement is crying
goal-recorder-done-1=Flight recorder decoded. The truth about the crash is in the journal, free of charge (an accounting oversight).
goal-recorder-done-2=Flight recorder decoded. AUTO claims the record was forged. By the recorder.
goal-recorder-done-3=Flight recorder decoded. Everything you wanted to know about the crash but BnL was afraid to tell you is in the journal.
goal-recorder-lost-1=[item=bnl-flight-recorder] Nothing left to read the recorder: the starliner's lab is lost. The safe will have to be opened the engineer's way.
goal-recorder-lost-2=[item=bnl-flight-recorder] The only lab that read the recorder is gone. The truth about the crash went with it. The safe can still be talked into it.
goal-recorder-lost-3=[item=bnl-flight-recorder] The recorder is fine, nothing reads it. BnL offers a new lab for 99,999 credits. Or a lock that likes to click.
goal-antenna-parts-1=[item=bnl-antenna-part] Antenna parts: __1__ of __2__
goal-antenna-parts-2=[item=bnl-antenna-part] Antenna parts: __1__ of __2__. The compartments are west-south-west, on the map
goal-antenna-parts-3=[item=bnl-antenna-part] Antenna in pieces: __1__ of __2__. Assembles like BnL furniture - without instructions
goal-antenna-parts-4=[item=bnl-antenna-part] Antenna parts: __1__ of __2__. Look for the antenna icons on the map
goal-antenna-build-1=[item=bnl-distress-beacon] Build and place the distress beacon
goal-antenna-build-2=[item=bnl-distress-beacon] Build the distress beacon. The parts are here, the excuses are not
goal-antenna-build-3=[item=bnl-distress-beacon] Distress beacon: build, place, call. In that order
goal-antenna-power-1=[item=bnl-distress-beacon] SOS: __1__ of __2__ s. The beacon needs power - and a little faith.
goal-antenna-power-2=[item=bnl-distress-beacon] SOS: __1__ of __2__ s. Keep the power on: dropped calls are charged too
goal-antenna-power-3=[item=bnl-distress-beacon] SOS: __1__ of __2__ s. The head office is already looking for a place to hang up
goal-antenna-waiting-1=[item=bnl-distress-beacon] SOS sent. Please stay on the line: your call is very important to BnL.
goal-antenna-waiting-2=[item=bnl-distress-beacon] SOS sent. You are number 3,412 in the queue. Expected answer time: two minutes to seven centuries
goal-antenna-waiting-3=[item=bnl-distress-beacon] SOS sent. The head office pretends to look for a pen
goal-antenna-waiting-4=[item=bnl-distress-beacon] Waiting for BnL. Meanwhile, rate your waiting from one to five stars
goal-antenna-done-1=BnL answered. It should not have.
goal-antenna-done-2=Answer received. No rescue, but there will be letters.
goal-antenna-done-3=BnL is on the line. Unfortunately, that did not help.
goal-safe-partial-1=[virtual-signal=signal-lock] Captain's safe: B = __1__, N = __2__, L = __3__. The recorder and the crew of the Axiom-6 know the rest.
goal-safe-partial-2=[virtual-signal=signal-lock] Captain's safe: B = __1__, N = __2__, L = __3__. The lock clicks at familiar letters - it has weaknesses too
goal-safe-partial-3=[virtual-signal=signal-lock] Captain's safe: B = __1__, N = __2__, L = __3__. Every "?" is a challenge. Or laziness
goal-safe-code-1=[virtual-signal=signal-lock] Captain's safe: B = __1__, N = __2__, L = __3__. Now say it to the safe in signals.
goal-safe-code-2=[virtual-signal=signal-lock] Captain's safe: B = __1__, N = __2__, L = __3__. The code is known. The safe does not know that yet
goal-safe-code-3=[virtual-signal=signal-lock] Captain's safe: B = __1__, N = __2__, L = __3__. A constant combinator, a wire - and you are richer than the captain
goal-safe-done-1=Captain's safe open. The code was the logo - who would have thought.
goal-safe-done-2=Safe cracked. BnL Security will change the code in another seven centuries.
goal-safe-done-3=Captain's safe open. The captain will not need it any more anyway.
pod-severance-pay=BnL: your severance pay is descending: __1__. Calculated strictly by the BnL labour code - 99% withheld against the cost of the starliner, the remaining 1% packed with love.
pod-severance-kind=BnL: your severance pay is paid in kind - BnL products at residual value: __1__. Defects are included in the delivery.
pod-severance-parachute=BnL: your "golden parachute" has opened: __1__. The gold is withheld, so is the parachute. Something heavy is left.
pod-severance-kit=BnL: the corporate kit of a dismissed employee is on its way: __1__. The "Employee of the Month" mug and certificate did not survive the packing - they were replaced with fish.
