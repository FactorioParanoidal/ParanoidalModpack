[entity-description]
salvaged-lab=Лаборатория лайнера, кое-как подлатанная. Единственная, что может прочесть бортовой самописец, — не потеряйте её до расшифровки.
aai-big-ship-wreck-1=Может содержать уцелевший груз. Из обломков можно извлечь некоторые ресурсы.
aai-big-ship-wreck-2=Может содержать уцелевший груз. Из обломков можно извлечь некоторые ресурсы.
aai-big-ship-wreck-3=Может содержать уцелевший груз. Из обломков можно извлечь некоторые ресурсы.
aai-medium-ship-wreck-1=Может содержать уцелевший груз. Из обломков можно извлечь некоторые ресурсы.
aai-medium-ship-wreck-2=Может содержать уцелевший груз. Из обломков можно извлечь некоторые ресурсы.
aai-small-ship-wreck=Обломки можно разобрать.
bnl-compartment-reactor=Термоядерный модуль BnL «Fusion Lite» — «почти безопасен, почти навсегда». Полностью почините его ремонтными наборами — и он даст много энергии. Ненадолго: ядро пробито, и с каждой минутой это заметнее. До ремонта он ничего не даёт, только фонит; оставлять пробитое ядро без присмотра гарантия настоятельно не рекомендует. Пока ядро горячее, вокруг радиация, а разбирать отсек запрещено гарантийными обязательствами. Остывший отсек можно разобрать — говорят, внутри есть кое-что для звонка домой.
bnl-compartment-medbay=Оторвавшийся медотсек. Аптечка BnL «Здоровье по подписке»: всё, чтобы протянуть ещё немного, и кое-что для звонка домой. Подписка истекла 700 лет назад.
bnl-compartment-armory=Оружейная лайнера. BnL продавала оружие «только для самообороны от низких цен». Охраняется местной фауной, которая успела здесь обжиться и прав на возврат не признаёт. Где-то между стволами лежит и кое-что для звонка домой.
bnl-compartment-hydroponics=Гидропоника лайнера: семена, саженцы и всё, что уцелело от оранжереи. Единственное место на борту, где росло что-то, кроме кредитного долга. Деталей антенны нет: гидропоника звонить домой не собиралась — ей и здесь хорошо.
bnl-compartment-engineering=Инженерный отсек упал в воду. Запчасти — и кое-что для звонка домой. На двери табличка: «Посторонним вход запрещён. Своим тоже — у BnL всё работает само».
bnl-escape-pod=Капсула, в которой вы приземлились отдельно от остальных. Внутри — ваш личный набор. Место у иллюминатора было платным.
bnl-captain-safe=Сейф с кодовым замком BnL. Внутри — опечатанные личные вещи капитана; опись не прилагается, BnL не раскрывает содержимое до вскрытия. Подайте на сейф сигналы B, N и L с правильными значениями — постоянным комбинатором по проводу; замок проверит код сам. Замок старый: на знакомую букву он отзывается щелчком. Да, код — это буквально логотип. Отдел безопасности BnL гордится этим решением.
bnl-old-expedition=Лайнер BnL той же серии. Упал здесь задолго до вас, успел зарасти и до сих пор числится «в пути по расписанию».
bnl-distress-beacon=Передаёт SOS в головной офис Buy n Large: минута работы под питанием. Звонок платный, прерванный — тоже.
scrap=Остатки корпуса, вспахавшего землю при посадке. В отчётности BnL — «премиальное вторсырьё». Добывается любым буром, перерабатывается вручную или в переработчике в случайные детали.
bnl-distress-receiver=Маяк, которому больше нечего сказать. Зато он слушает — как обычный радар. В BnL это называется «режим ожидания спасения»; ждать, впрочем, не обязательно.

