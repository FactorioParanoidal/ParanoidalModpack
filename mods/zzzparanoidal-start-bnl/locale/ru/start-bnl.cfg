[bnl-journal-text]
flight-log-1=AUTO: Звёздный круиз Buy n Large, лайнер «Аксиома-7». Курс на планету-курорт «Новый Эдем-4». Пассажиров на борту: 3412. Средний вес пассажира превышает грузоподъёмность кресел на 18%. Рекомендован апгрейд кресел всего за 99,99 кредита. Напоминаем: обед подаётся в стакане.
flight-log-2=Капитан: Нашёл в архиве слово «двигатель». Спросил у AUTO, что это значит. AUTO ответил, что вопрос не входит в мой тарифный план. Зато узнал, что BnL начиналась с замороженного йогурта. Многое объясняет.
flight-log-3=AUTO: Получено распоряжение головного офиса Buy n Large, директива 99-99 «Оптимизация издержек». Отключены: щиты, резервный реактор, ремонтные дроиды, двигатели №3 и №5. Голографическая реклама и кофемашины оставлены: они приносят прибыль.
flight-log-4=Капитан: Мы падаем?\nAUTO: Мы снижаемся с повышенным энтузиазмом. Пожалуйста, оставайтесь в креслах и оцените наш сервис от одной до пяти звёзд.\nКапитан: Это же A113?!\nAUTO: Директива A113 запрещает возвращаться на Землю. Про другие планеты в ней ничего нет. Посадка разрешена.
flight-log-5=AUTO: Зафиксировано нештатное отделение отсеков: реакторный, медицинский, оружейная, гидропоника, инженерный. Отсеки переведены в статус «утерянный багаж». Претензии принимаются в течение 700 лет по адресу: Buy n Large, Север™. Аварийные маяки отсеков отмечены на карте.
flight-log-6=Капитан: Если кто-то это слышит — не верьте AUTO и не подписывайте ничего мелким шрифтом. Реактор пробит: после ремонта он протянет около часа, и только первые минуты — в полную силу. Сейф на мостике открывается кодом BnL… Старая «Аксиома-6» упала где-то здесь до нас, её экипаж знал последнюю цифру. Отмечаю её на карте. И да: синий — НЕ новый красный.
flight-log-safe=Код сейфа капитана подаётся сигналами: B = __1__, N = __2__. Значение L капитан не помнил — его знал экипаж «Аксиомы-6». Логотип вместо пароля — инициатива отдела безопасности BnL.
flight-log-reward=Среди данных самописца найден курс «Инженер с нуля» в удобном формате красных научных пакетов: __1__ шт., уже у вас в рюкзаке.\n«Внимание, покупатели! Красный — это новый синий!» © Buy n Large, отдел перекрашивания.
insurance-start=Радар поймал передачу Buy n Large: «Уважаемый клиент! Ваш лайнер потерпел крушение. Это страховой случай №A113-7 по полису "BnL Life & Crash". Компенсация будет доставлена капсулами в окрестности вашего радара в порядке живой очереди. Живой — ключевое слово. Спасибо, что выбрали BnL!» __1__
insurance-end=BnL: «Лимит компенсации исчерпан. Ваша страховка аннулирована. Предлагаем оформить новую — всего 99 999 кредитов в месяц! Первый месяц — тоже 99 999 кредитов.»
insurance-cancelled=BnL: «Наши аналитики зафиксировали у вас признаки экономической самостоятельности. Страховка аннулирована по пункту 12.7 договора: клиент слишком хорошо справляется сам. Самостоятельность — не лицензированный продукт Buy n Large.»
profession-guard=__1__ — бывший сержант охраны. Личное дело вскрыто: при нём пистолет-пулемёт, дробовик, лёгкая броня и турель, а патроны с крушения стекаются к нему. Военное дело, турели и стены он помнит наполовину. Лицензии на оружие нет.
profession-geologist=__1__ — геолог. Личное дело вскрыто: геологический радар ждёт в грузе лайнера, а дробление руды и электробуры он помнит наполовину. Камни для сувенирной лавки больше не нужны.
profession-mechanic=__1__ — механик. Личное дело вскрыто: мастерская доводки в рюкзаке, ремкомплектов на лайнере больше обычного. Контроль качества знает отлично, автоматизацию и ремонт посерьёзнее — наполовину.
profession-biologist=__1__ — биолог. Личное дело вскрыто: семена и теплицы при нём, рецепты саженцев известны, а вскоре BnL доставит биоферму. Фермерство, лесоводство и освещение он помнит наполовину.
profession-passenger=__1__ — пассажир. Никаких навыков, зато отличный загар от ламп в кресле и золотая карта BnL с нулевым балансом.
anomaly-long-night=Сканер посадки: сутки здесь неравномерны. Первые три ночи продлятся вдвое дольше обычного. Солнце на этой планете не принадлежит BnL, поэтому работает как попало. Запаситесь светом и патронами.
anomaly-magnetic-storm=Сканер посадки: магнитосфера нестабильна. Каждые несколько минут магнитные бури будут ослеплять ваши радары, пока не будет изучено «__1__». Север при этом остаётся торговой маркой BnL.
anomaly-rich-vein=Сканер посадки: при падении лайнер вскрыл богатую жилу: __1__ __2__. Хоть какая-то польза от крушения. Права на добычу BnL оформит позже.
anomaly-quiet-planet=Сканер посадки: местная фауна в спячке. Через два часа она проснётся. Вся. Одновременно. Как покупатели в Чёрную пятницу BnL.
anomaly-dust-storms=Сканер посадки: сезон пыльных бурь. Бури будут приносить к вашей базе облака загрязнения; AUTO предупредит за минуту. По сравнению с Землёй 2105 года — почти курорт.
safe-open=__1__ подобрал код BnL. Внутри — личные вещи капитана: модульная броня, снаряжение и запас зелёных пакетов «на чёрный день». Ящик бренди, судя по всему, капитан выпил ещё при жизни лайнера. На дне — пожелтевшая открытка «Операция "Уборка": вернёмся через 5 лет!»
expedition-note=__1__ читает записку:\n«Я здесь уже 6666 дней. BnL не прилетит. Машину у корабля я почти починил — бери. Мастер-код сейфов BnL не меняли семь веков: L = __2__. Не верь страховке и не верь AUTO.\nИнженер №7, «Аксиома-6».\nP.S. Красный — это не новый синий.»
turret-veteran=Корабельная турель «__1__» отбила первые атаки (убито: __2__) и получила звание ветерана крушения. Buy n Large выражает благодарность и выставит счёт за израсходованные патроны.
distress-sent=Сигнал SOS отправлен с аварийного маяка __1__. Ожидайте ответа. Среднее время ответа Buy n Large — от двух минут до семи веков.
distress-reply=Автоответчик Buy n Large, видеообращение CEO Шелби Форсрайта (запись 2105 года): «Привет! Если вы это слышите — значит, всё идёт по плану. Спасательная миссия признана нерентабельной. В связи с утратой лайнера вы уволены, последнее жалованье удержано в счёт его стоимости. Оставайтесь на курсе! Потому что с BnL даже космос не предел!©»
letter-logistic-science-pack=BnL: «Мы заметили, что вы производите зелёные научные пакеты. Напоминаем: зелёный цвет — зарегистрированная торговая марка Buy n Large, как и север. Лицензионные отчисления будут начислены автоматически.»
letter-chemical-science-pack=BnL: «Поздравляем! Ваша колония переведена в категорию "перспективный рынок". В ближайшие 300 лет к вам прилетит рекламный дрон и откроется супермаркет. Возможно, на вашей базе.»
letter-rocket-silo=BnL: «Мы засекли постройку ракетной шахты. Напоминаем о директиве A113: возвращение не предусмотрено. Ракеты сторонних производителей Buy n Large не обслуживает, не страхует и не одобряет.»
letter-space-construction=BnL: «Вы строите корабль? Это нарушение пункта 113 трудового договора — который, впрочем, расторгнут. Ждём вас на орбите… чтобы выставить счёт за парковку.»
letter-rocket=BnL: «Радары зафиксировали старт ракеты с вашей планеты. Ваше заявление о восстановлении в должности принято к рассмотрению. Срок рассмотрения — 700 лет. Мы уже выросли из замороженного йогурта, вырастем и из вас. Спасибо, что выбрали Buy n Large!»\nКажется, пора лететь и высказать им всё лично.
