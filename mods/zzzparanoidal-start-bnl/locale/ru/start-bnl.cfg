cargo-burnt-hint=Обломки горят: патроны, топливо, газ и взрывчатка внутри рвутся, груз теряет качество! Заберите груз, разберите обломок или вылейте на него бочку с водой: возьмите бочку (клавиша 1) и кликните ЛКМ по горящему обломку (у каждого есть 20 бочек в инвентаре). BnL напоминает: ущерб от пожара гарантией не покрывается. __1__
falling-warning-medium=AUTO: __1__ на подлёте! Напоминаем: падающие обломки остаются собственностью Buy n Large.
falling-warning=AUTO: __1__ на подлёте! Расчётная точка падения: __2__. Напоминаем: падающие обломки остаются собственностью Buy n Large.
