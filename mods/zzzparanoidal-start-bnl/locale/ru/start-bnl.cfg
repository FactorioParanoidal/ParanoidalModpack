goal-news=Протокол AUTO: __1__
probation-profession=AUTO: ваше личное дело на проверке в отделе кадров BnL. Набор и навыки будут выданы после испытательного срока: __1__ мин в игре. Ожидание пока бесплатное.
probation-done=AUTO: испытательный срок пройден! Набор и навыки выданы. Отдел кадров BnL удивлён, что вы остались.
probation-capsule=AUTO: спасательная капсула опечатана до конца испытательного срока: __1__ мин. Сначала безопасность, щедрость — потом.
probation-capsule-open=AUTO: ваша спасательная капсула распечатана: __1__. Набор внутри теперь ваш (капсула остаётся собственностью BnL).

