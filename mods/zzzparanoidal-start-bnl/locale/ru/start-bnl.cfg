bnl-flight-recorder-decoding=Загрузите самописец «Аксиомы-7» в извлечённую лабораторию из лайнера (другие лаборатории его не читают) и узнайте, что на самом деле случилось с лайнером. Лицензионное соглашение BnL этого не одобряет.

[modifier-description]
