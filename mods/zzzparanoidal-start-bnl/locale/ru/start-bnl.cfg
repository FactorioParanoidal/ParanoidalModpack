recorder-signal=Пеленг бортового самописца: __1__. Самописец можно расшифровать в лаборатории — вопреки лицензионному соглашению.
reactor-online=Модуль «Fusion Lite» запущен: __1__ МВт — и мощность падает. Ядро пробито: через 5 минут останется 5 МВт, через час — ноль. Продление гарантии — 99,99 кредита. __2__
