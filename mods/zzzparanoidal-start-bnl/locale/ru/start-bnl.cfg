reactor-meltdown-hint=Кажется, начинается какая-то бесконтрольная ядерная реакция прямо у меня под боком...
reactor-exploded=Реакторный отсек «Аксиомы-7» взорвался. Гарантийный случай не наступил: ядро не было отремонтировано. __1__
reactor-label-broken=Реактор повреждён: почините полностью
reactor-cold=Ядро реакторного отсека остыло. Радиации больше нет, гарантии тоже; отсек можно разобрать (внутри — деталь антенны). __1__
