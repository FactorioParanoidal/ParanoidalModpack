wreck-too-hot=Слишком горячо! Сначала потушите, потом разбирайте
fuel-on-fire=Это была НЕ вода! Горючее вспыхивает, и огонь расползается по земле вокруг. BnL напоминает: пожар гарантией не покрывается, энтузиазм — тоже.
cargo-lost=Сгорело: __1__ ×__2__
cargo-burnt-hint=Обломки горят: патроны, топливо, газ и взрывчатка внутри рвутся, груз теряет качество! Горящий обломок не открыть и не разобрать: сначала вылейте на него бочку с водой (возьмите бочку, клавиша 1, и кликните ЛКМ по горящему обломку; у каждого есть 20 бочек в инвентаре), потом забирайте груз или разбирайте. Потушенное 5 минут не загорится снова. BnL напоминает: ущерб от пожара гарантией не покрывается. __1__
falling-warning=AUTO: __1__ на подлёте! Расчётная точка падения: __2__. Напоминаем: падающие обломки остаются собственностью Buy n Large.
falling-size-big=крупный фрагмент лайнера
recorder-signal=Пеленг бортового самописца: __1__. Самописец можно расшифровать в извлечённой лаборатории из лайнера — вопреки лицензионному соглашению.
reactor-online=Модуль «Fusion Lite» запущен: __1__ МВт — и мощность падает. Ядро пробито: через 5 минут останется 5 МВт, через час — ноль. Продление гарантии — 99,99 кредита. __2__
reactor-label=Реактор: __1__ МВт
reactor-meltdown-hint=Кажется, начинается какая-то бесконтрольная ядерная реакция прямо у меня под боком...
reactor-exploded=Реакторный отсек «Аксиомы-7» взорвался. Гарантийный случай не наступил: ядро не было отремонтировано. __1__
reactor-label-broken=Реактор повреждён: почините полностью
reactor-cold=Ядро реакторного отсека остыло. Радиации больше нет, гарантии тоже; отсек можно разобрать (внутри — деталь антенны). __1__
pod-incoming=Страховая капсула BnL снижается: __1__
pod-incoming-far=Страховая капсула BnL снижается… с небольшим отклонением от курса (север — торговая марка BnL, остальные стороны света не лицензированы): __1__
pod-biofarm=BnL: ваш заказ «Биоферма» в пути! Доставка бесплатна, если вы не умрёте до её прибытия. Точка доставки: __1__
profession-title=Личное дело пассажира BnL
profession-intro=AUTO просит подтвердить, кем вы были на борту «Аксиомы-7». От этого зависит, что вы найдёте в карманах и что успели выучить между двумя коктейлями. Выбор нельзя изменить: возврат и обмен личности не предусмотрен.
profession-pick=Это я
profession-chosen=__1__: в прошлом — __2__.
guard-ammo=Сержант собрал все патроны из обломков и лайнера: __1__ шт.
profession-command=Открыть выбор профессии, если он ещё не сделан.
turret-plate=__1__ — ветеран крушения
turret-fallen=Корабельная турель «__1__» пала. Ремонт в сервисном центре BnL — через 700 лет. __2__
capsule-landed=__1__ приземлился в спасательной капсуле в __2__ клетках от лайнера. Найдите друг друга!
distress-built=Аварийный маяк установлен. Подайте питание: передача SOS займёт минуту и будет тарифицирована поминутно.
distress-again=BnL: ваш сигнал уже принят. Повторные обращения тарифицируются отдельно.
anomaly-long-night-end=Долгие ночи закончились. Дальше сутки идут как обычно — без подписки BnL на солнце.
anomaly-magnetic-storm-now=Магнитная буря! Радары ослепли на минуту.
anomaly-magnetic-storm-end=Радары экранированы: магнитные бури им больше не страшны.
anomaly-quiet-planet-end=ПЛАНЕТА ПРОСНУЛАСЬ. Вся местная фауна разом вспомнила о вас. В отличие от BnL.
anomaly-dust-storm-warning=Через минуту пыльная буря накроет __1__ облаком загрязнения. Дома вы бы назвали это «свежим воздухом BnL».
anomaly-dust-storms-end=Сезон пыльных бурь закончился.
sos-label=SOS: __1__ из __2__ с
distress-receiver=AUTO: аварийный маяк переведён в режим приёма. Передача у BnL платная, а приём пока бесплатный — смотрите вокруг, пока дают.
insurance-bonus=BnL: ваш SOS приобщён к страховому делу №A113-7 — положено ещё капсул: __1__. Благодарность клиента тарифицируется отдельно.
goal-title=[img=bnl-logo-small] [font=default-bold]Протокол AUTO[/font]
goal-fires=[virtual-signal=signal-fire] Горящих обломков: __1__
brief-fire-1=AUTO: отчёт о повреждениях, страница 1 из 4096. Груз горит! Бочки с водой — у вас в инвентаре: возьмите (клавиша 1) и ЛКМ по горящему обломку. Сначала тушить, потом разбирать: горячее BnL не возвращает.
brief-fire-2=AUTO: на борту пожар, что технически невозможно: пожары не входят в ваш тариф. Бочки с водой — в инвентаре (клавиша 1), ЛКМ по горящему обломку. Разбирать — только остывшее.
brief-fire-3=AUTO: зафиксировано повышение температуры груза до «горит». Рекомендация: бочка с водой (клавиша 1), ЛКМ по огню. Жалобы на пожар принимаются после его окончания.
brief-antenna-1=AUTO: антенна связи потеряна вместе с отсеками, отвалившимися по курсу, — на запад-юго-запад. На карте они уже отмечены. Позвонить домой можно; бесплатно — нельзя.
brief-antenna-2=AUTO: связь с головным офисом недоступна — антенна разлетелась по отсекам, сброшенным на запад-юго-запад. Значки на карте. Соберите три детали: BnL очень хочет выставить вам счёт за звонок.
brief-antenna-3=AUTO: инвентаризация завершена. Антенна: в розницу, по отсекам на запад-юго-запад (см. карту). Для аварийного маяка нужны три детали. Самовывоз.
antenna-found-1=Деталь антенны: __1__ из __2__. AUTO засчитывает находку и начисляет плату за хранение.
antenna-found-2=Деталь антенны: __1__ из __2__. Гарантия на неё истекла 700 лет назад, но выглядит как новая. Почти.
antenna-found-3=Деталь антенны: __1__ из __2__. AUTO напоминает: детали антенны не подлежат обмену, возврату и пониманию.
antenna-found-4=Деталь антенны: __1__ из __2__. Отдел логистики BnL гордится: доставка всего за 700 лет и одно крушение.
antenna-all-1=Деталь антенны: __1__ из __2__ — комплект! Аварийный маяк можно собрать. AUTO уже готовит счёт за звонок.
antenna-all-2=Деталь антенны: __1__ из __2__. Комплект собран вопреки всем прогнозам BnL. Маяк ждёт сборки, головной офис — вашего звонка (платного).
antenna-all-3=Деталь антенны: __1__ из __2__. Поздравляем, вы собрали полный комплект «Позвони домой»! Батарейки, как всегда, не входят — нужно электричество.
antenna-found-extra-1=Деталь антенны: __1__ из __2__. Перевыполнение плана BnL не оплачивает, но запасная деталь ещё никому не мешала.
antenna-found-extra-2=Деталь антенны: __1__ из __2__. Лишняя. BnL всегда продаёт на одну больше, чем нужно, — это и есть бизнес-модель.
antenna-found-extra-3=Деталь антенны: __1__ из __2__. Эта — про запас. AUTO записал её в графу «упущенная выгода».
distress-interrupted-1=Передача SOS прервана: маяк остался без питания __1__. Секунды не сгорают — в отличие от вашей подписки.
distress-interrupted-2=Связь прервана __1__. Абонент временно недоступен — как и электричество. Минуты сохранены, счёт тоже.
distress-interrupted-3=SOS на паузе __1__: маяк обесточен. AUTO включил головному офису музыку ожидания. Восемь часов, по кругу.
falling-warning-medium-1=AUTO: опасный объект вошёл в атмосферу!
falling-warning-medium-2=AUTO: к вам летит собственность BnL. Не ловите.
falling-warning-medium-3=AUTO: обломок корпуса на подлёте. Каски в стоимость билета не входили.
falling-warning-medium-4=AUTO: ещё немного лайнера! Посадка продолжается.
safe-no-signal-1=Кодовый замок BnL: подайте на сейф сигналы B, N и L
safe-no-signal-2=Замок ждёт сигналов B, N и L. Стучать бесполезно, проверено капитаном
safe-no-signal-3=Сейф молчит: ни одного сигнала. Попробуйте провод — это как ключ, только с BnL
safe-wrong-code-1=Кодовый замок BnL: неверный код. Попытка списана с вашего счёта.
safe-wrong-code-2=Неверно. Отдел безопасности BnL записал вас в подозреваемые. Хотя кого ещё
safe-wrong-code-3=Код отклонён. Подсказка BnL: это наш логотип. Подсказка платная
safe-wrong-code-4=Мимо. Замок зевнул и продолжил ждать
safe-solved=Уже щёлкнули: __1__.
safe-click=щёлк: __1__
safe-latched-1=Замок сейфа щёлкнул: __1__ = __2__. Отдел безопасности BnL делает вид, что ничего не слышал.
safe-latched-2=Щёлк! Буква __1__ сдалась (__2__). Замок BnL — единственный сотрудник компании, который признаёт ошибки.
safe-latched-3=Сейф: __1__ = __2__, принято. Оставшиеся буквы держатся из последних сил.
safe-latched-4=Замок узнал __1__ (__2__) и щёлкнул от радости. Он 700 лет не слышал ничего знакомого.
first-quench-1=AUTO: первый пожар потушен. Поздравляем! Ваш рейтинг пожарной безопасности повышен с «катастрофа» до «бедствие».
first-quench-2=AUTO: огонь погашен водой. BnL отмечает: вода — единственный ресурс на планете, за который мы пока не выставили счёт.
first-quench-3=AUTO: возгорание ликвидировано. Пар — за счёт заведения.
first-stack-lost-1=AUTO: часть груза сгорела дотла. Не волнуйтесь: страховка это не покрывает, так что и оформлять ничего не нужно.
first-stack-lost-2=AUTO: груз переведён в состояние «пепел». Пепел — тоже собственность BnL.
first-stack-lost-3=AUTO: зафиксирована утрата груза в огне. Отдел маркетинга называет это «распродажа с огоньком».
water-out-1=AUTO: бочки с водой закончились. Пустой бочкой — ЛКМ по воде: наполнятся все пустые разом. Вода, к счастью, тут бесплатная. Пока.
water-out-2=AUTO: вода кончилась, пожары — нет. Подойдите к озеру и ЛКМ пустой бочкой по воде: BnL называет это «самообслуживание».
water-out-3=AUTO: запас воды исчерпан. Ближайший водоём — ваш новый лучший друг: ЛКМ пустой бочкой по воде, и все пустые бочки полны.
goal-fires-water=[virtual-signal=signal-fire] Горящих обломков: __1__ · [item=water-barrel] бочек с водой: __2__
goal-fires-dry=[virtual-signal=signal-fire] Горящих обломков: __1__ · воды нет: пустой бочкой ЛКМ по воде
goal-recorder-find-1=[item=bnl-flight-recorder] Найти бортовой самописец: __1__
goal-recorder-find-2=[item=bnl-flight-recorder] Самописец подаёт сигнал: __1__. Он оранжевый, мимо не пройдёте
goal-recorder-find-3=[item=bnl-flight-recorder] Забрать самописец: __1__. Он пережил крушение — переживёт и вас
goal-recorder-decode-1=[item=bnl-flight-recorder] Расшифровать самописец. Чужие лаборатории BnL не лицензирует.
goal-recorder-decode-2=[item=bnl-flight-recorder] Расшифровать самописец — в родной лаборатории лайнера. Остальные лаборатории к правде не допущены.
goal-recorder-decode-3=[item=bnl-flight-recorder] Расшифровать самописец. Нужна лаборатория с лайнера и немного электричества — как и всему хорошему.
goal-recorder-decoding-1=[item=bnl-flight-recorder] Расшифровка самописца: __1__%
goal-recorder-decoding-2=[item=bnl-flight-recorder] Расшифровка: __1__%. AUTO нервно стирает логи
goal-recorder-decoding-3=[item=bnl-flight-recorder] Самописец читается: __1__%. Лицензионное соглашение плачет
goal-recorder-done-1=Самописец расшифрован. Правда о крушении — в журнале, бесплатно (недосмотр бухгалтерии).
goal-recorder-done-2=Самописец расшифрован. AUTO утверждает, что запись подделана. Самописцем.
goal-recorder-done-3=Самописец расшифрован. Всё, что вы хотели знать о крушении, но BnL боялась вам сказать, — в журнале.
goal-recorder-lost-1=[item=bnl-flight-recorder] Самописец прочесть нечем: лаборатория лайнера потеряна. Сейф придётся вскрывать по-инженерному.
goal-recorder-lost-2=[item=bnl-flight-recorder] Единственная лаборатория, читавшая самописец, — всё. Правда о крушении унесена в могилу. Сейф всё ещё можно уговорить.
goal-recorder-lost-3=[item=bnl-flight-recorder] Самописец цел, читать нечем. BnL предлагает новую лабораторию за 99 999 кредитов. Или замок, который любит щёлкать.
goal-antenna-parts-1=[item=bnl-antenna-part] Детали антенны: __1__ из __2__
goal-antenna-parts-2=[item=bnl-antenna-part] Детали антенны: __1__ из __2__. Отсеки — на запад-юго-запад, на карте
goal-antenna-parts-3=[item=bnl-antenna-part] Антенна по частям: __1__ из __2__. Собирается как мебель BnL — без инструкции
goal-antenna-parts-4=[item=bnl-antenna-part] Деталей антенны: __1__ из __2__. Ищите значки антенны на карте
goal-antenna-build-1=[item=bnl-distress-beacon] Собрать и поставить аварийный маяк
goal-antenna-build-2=[item=bnl-distress-beacon] Собрать аварийный маяк. Детали есть, отговорок нет
goal-antenna-build-3=[item=bnl-distress-beacon] Аварийный маяк: собрать, поставить, позвонить. Именно в таком порядке
goal-antenna-power-1=[item=bnl-distress-beacon] SOS: __1__ из __2__ с. Маяку нужно питание — и немного веры.
goal-antenna-power-2=[item=bnl-distress-beacon] SOS: __1__ из __2__ с. Держите питание: обрыв связи тоже тарифицируется
goal-antenna-power-3=[item=bnl-distress-beacon] SOS: __1__ из __2__ с. Головной офис уже ищет, куда положить трубку
goal-antenna-waiting-1=[item=bnl-distress-beacon] SOS отправлен. Оставайтесь на линии: ваш звонок очень важен для BnL.
goal-antenna-waiting-2=[item=bnl-distress-beacon] SOS отправлен. Вы 3 412-й в очереди. Ожидаемое время ответа — от двух минут до семи веков
goal-antenna-waiting-3=[item=bnl-distress-beacon] SOS ушёл. Головной офис делает вид, что ищет ручку
goal-antenna-waiting-4=[item=bnl-distress-beacon] Ждём ответа BnL. Пока ждёте — оцените ожидание от одной до пяти звёзд
goal-antenna-done-1=BnL ответила. Лучше бы не отвечала.
goal-antenna-done-2=Ответ получен. Спасения не будет, зато будут письма.
goal-antenna-done-3=BnL на связи. Это, к сожалению, не помогло.
goal-safe-partial-1=[virtual-signal=signal-lock] Сейф капитана: B = __1__, N = __2__, L = __3__. Остальное знают самописец и экипаж «Аксиомы-6».
goal-safe-partial-2=[virtual-signal=signal-lock] Сейф капитана: B = __1__, N = __2__, L = __3__. Замок щёлкает на знакомые буквы — у него тоже есть слабости
goal-safe-partial-3=[virtual-signal=signal-lock] Сейф капитана: B = __1__, N = __2__, L = __3__. Каждый «?» — это вызов. Или лень
goal-safe-code-1=[virtual-signal=signal-lock] Сейф капитана: B = __1__, N = __2__, L = __3__. Осталось сказать это сейфу на языке сигналов.
goal-safe-code-2=[virtual-signal=signal-lock] Сейф капитана: B = __1__, N = __2__, L = __3__. Код известен. Сейф об этом пока не знает
goal-safe-code-3=[virtual-signal=signal-lock] Сейф капитана: B = __1__, N = __2__, L = __3__. Постоянный комбинатор, провод — и вы богаче капитана
goal-safe-done-1=Сейф капитана открыт. Код был логотипом — кто бы мог подумать.
goal-safe-done-2=Сейф вскрыт. Отдел безопасности BnL сменит код через ещё семь веков.
goal-safe-done-3=Сейф капитана открыт. Капитану всё равно уже не понадобится.
pod-severance-pay=BnL: ваше выходное пособие уже снижается: __1__. Расчёт строго по трудовому кодексу BnL — 99% удержано в счёт стоимости лайнера, оставшийся 1% упакован с любовью.
pod-severance-kind=BnL: выходное пособие выплачено натурой — продукцией BnL по остаточной стоимости: __1__. Брак входит в комплект поставки.
pod-severance-parachute=BnL: ваш «золотой парашют» уже раскрылся: __1__. Золото удержано, парашют тоже. Осталось кое-что тяжёлое.
pod-severance-kit=BnL: корпоративный набор уволенного сотрудника уже в пути: __1__. Кружка «Лучший сотрудник месяца» и грамота не уцелели при упаковке — их заменили рыбой.
retired-recorder=расшифровать самописец
retired-antenna=собрать аварийный маяк и позвонить домой
act-no-sos=не отправлен
act-yes=да
