pod-incoming-far=Страховая капсула BnL снижается… с небольшим отклонением от курса (север — торговая марка BnL, остальные стороны света не лицензированы): __1__
pod-biofarm=BnL: ваш заказ «Биоферма» в пути! Доставка бесплатна, если вы не умрёте до её прибытия. Точка доставки: __1__
profession-title=Личное дело пассажира BnL
profession-intro=AUTO просит подтвердить, кем вы были на борту «Аксиомы-7». От этого зависит, что вы найдёте в карманах и что успели выучить между двумя коктейлями. Выбор нельзя изменить: возврат и обмен личности не предусмотрен.
