player-crash-landed=Последнее сообщение AUTO, автопилота лайнера «Аксиома-7»: ВНИМАНИЕ, __1__!!! ВАШ ЛАЙНЕР ВОШЁЛ В ПЛОТНЫЕ СЛОИ АТМОСФЕРЫ БЛИЖАЙШЕЙ ПЛАНЕТЫ И СОВЕРШИЛ ЭКСТРЕННУЮ ПОСАДКУ С ПОВЫШЕННЫМ ЭНТУЗИАЗМОМ! Ваш полёт автоматически оценён на ★★★★★. Спасибо, что выбрали Buy n Large! «Потому что с BnL даже космос не предел!©»
