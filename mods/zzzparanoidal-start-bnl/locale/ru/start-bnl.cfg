[item-description]
salvaged-lab=Лаборатория лайнера, кое-как подлатанная. Единственная, что может прочесть бортовой самописец, — не потеряйте её до расшифровки.
bnl-flight-recorder=«Чёрный ящик» лайнера (на самом деле оранжевый: в сезоне 2105 года BnL объявила оранжевый новым чёрным). Прочесть его может только извлечённая лаборатория из лайнера: поместите самописец в неё и изучите «Расшифровку бортового самописца». Огнеупорный корпус — единственное, на чём BnL не сэкономила.
bnl-antenna-part=Деталь аварийной антенны. Для маяка нужны три — ищите в отсеках, оторвавшихся от лайнера (на карте они отмечены этой же деталью). Деталей на борту было с запасом: BnL всегда продаёт на одну больше, чем нужно. Продаётся только комплектом, который не продаётся.
bnl-distress-beacon=Соберите из трёх деталей антенны, поставьте и дайте питание на минуту передачи. BnL гарантирует, что вас услышат. Помочь не гарантирует.
bnl-engineer-note=Мятый лист в масляных пятнах — единственный документ на планете, написанный не отделом маркетинга. Используйте, чтобы прочитать.
bnl-advertising-flyer=«Buy n Large — всё, что нужно для счастья!» Читать бесполезно, зато горит отлично: самая полезная продукция BnL на этой планете.
scrap=Перерабатывается в случайные детали: вручную или в переработчике.

