[bnl-profession-description]
guard=Охранял кассы магазинов беспошлинной торговли. Двенадцать лет без единой кражи (потому что никто не вставал с кресел).\n\nПри себе — кое-что огнестрельное и привычка стрелять первым. Патроны с крушения чует издалека: первые выстрелы не сгорят в пожаре. По службе помнит, как держать оборону, — правда, только наполовину. Бегает быстрее всех на борту и крепче остальных: здоровье выше (+3…9 уровней RPG).
geologist=Подбирал камни для сувенирной лавки BnL «Камень с настоящей планеты!» (сделано на борту из переработанных стаканчиков). Наконец-то настоящая планета.\n\nГде-то в грузе лайнера ждёт его рабочий инструмент — тот, что смотрит сквозь землю. Наполовину помнит, где искать, чем дробить и как бурить, а заодно как работают радары. Копает быстро, а карманы у него бездонные: +10 слотов инвентаря. С собой георадар и три угольных бура; окрестности сразу на карте с отметками ближайших руд, металлолом и редкая жила — тоже. Каждая вторая горсть руды руками — двойная.
mechanic=Единственный на лайнере, кто знал, где лежит гаечный ключ. Остальные думали, что его спрятал M-O.\n\nВ рюкзаке — то, что превращает брак в годное. Знает, где на лайнере прятали ремкомплекты, поэтому их найдётся заметно больше (вдвое; каждый следующий механик — ещё +100). Контроль качества у него в крови, автоматизация — на кончиках пальцев. Руки быстрые и длинные: начальная скорость крафта и дистанция доступа изучены.
biologist=Ухаживал за единственным растением на борту. Оно было пластиковым, но он старался. EVE так его и не нашла.\n\nВ рюкзаке — то, что растёт, и то, где ему расти. А вскоре после посадки BnL доставит заказ, который он оформил ещё на борту и успел забыть. Наполовину помнит, как растить, как рубить и где включается свет. Ходит в респираторе, семена у него отборные (качество +1…4), а воды припас вдвое больше. Деревья рубит с умом: каждое второе даёт вдвое больше древесины.
passenger=Пятнадцать лет провёл в парящем кресле с «обедом в стакане» в руке. Ноги помнят, как ходить, — примерно. Синий — новый красный, а вы — новый инженер.\n\nНикаких бонусов: классический старт Paranoidal. Удачи, она вам понадобится.

