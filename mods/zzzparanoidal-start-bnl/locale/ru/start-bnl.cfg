[mod-setting-description]
zzzparanoidal-shipwreck-start=Припасы в разбившемся корабле, его обломках и обломках AAI, а также лут при их разборе в новой свободной игре. Игрок начинает с пустым инвентарём.\nМинимум: половина припасов; готовые предметы, которые могут быть бракованными, и все столбы получают случайный брак: без брака 5%, −1 15%, −2 25%, −3 25%, −4 20%, −5 10%.\nСредний: все припасы, обычное качество.\nБогатый: все припасы; каждый готовый предмет получает случайное качество: обычное 25%, +1 30%, +2 20%, +3 13%, +4 8%, +5 4%.\nМатериалы, промежуточные компоненты и конвейеры всегда обычные; половина ремонтных наборов (не меньше 10) всегда обычная, без брака; у каждого типа предмета одно качество на карту. На руины не действует.
bnl-start-professions=После посадки каждый игрок выбирает прошлую профессию: охрана, геолог, механик, биолог или пассажир. Профессия даёт свой набор и наполовину изученные технологии. В сетевой игре все, кроме первого выбравшего, получают их через 5 минут в игре. Действует только при создании новой карты.
bnl-start-pause=В одиночной игре игра стоит на паузе, пока открыт выбор профессии.
bnl-start-intro=Вместо стандартной заставки камера пролетает вдоль следа обломков к лайнеру. Tab — пропустить.
bnl-start-falling-debris=Первые ~10 минут вокруг места крушения падают отставшие части лайнера: тень обломка и рёв низкого пролёта (вблизи — свист снаряда) предупреждают об ударе, на месте падения остаётся обломок с грузом. Иногда обломок падает прямо на ваши постройки.
bnl-start-wreck-fires=Почти в каждом обломке есть что-то, что реагирует на огонь: патроны, бочки с горючим, газовые баллоны (разлетаются), высокотехнологичное топливо, взрывчатка, кислород или аккумуляторы; что не успело сдетонировать — добыча. Пожары бывают ровные, тлеющие, полыхающие (разбрасывают искры) и вспыхивающие; горючее внутри горит факелами. Лайнер и обломки, упавшие в огне, горят с самой посадки; остальные загораются только от огня вплотную рядом; взрывы могут поджечь ваши постройки. Груз начинает портиться через 25 секунд после посадки. Горящий обломок нельзя ни открыть, ни разобрать: сначала потушите, потом разбирайте. Бочка с водой выливается из руки: ЛКМ куда угодно в пределах досягаемости сразу тушит всё в радиусе 4 клеток — и горящие обломки, и обычный огонь. Потушенное 5 минут остаётся мокрым и не загорается снова — только дымит паром. Пустой бочкой ЛКМ по воде — наполняются все пустые бочки в инвентаре. Только не перепутайте бочку с горючим! Вода из руки работает, пока идут пожары старта. Горят и обломки, и сам лайнер. Горящий обломок выгорает до 2–10% прочности, его начинка рвётся и горит; каждые 14–27 секунд пожара все вещи внутри теряют ступень качества (в брак, не ниже −5, уходят только вещи, которым брак допустим; материалы — не ниже обычного); каждый раз с шансом 20% целиком сгорает один стак. Спешите: потушите пожар и спасите груз.
bnl-start-debris-trail=На запад-юго-запад от лайнера тянется след обломков длиной 500–800 клеток с оторвавшимися отсеками: реакторный, медотсек, оружейная (под охраной), гидропоника и инженерный (в воде). Там же — лайнер прошлой экспедиции.
bnl-start-supply-pods=Когда первый радар просканирует сектор, BnL признаёт крушение страховым случаем: капсулы с одним видом груза падают у радара всё реже, пока страховку не аннулируют.
bnl-start-anomaly=Особенность планеты, о которой сообщит сканер посадки. Случайная — одна из пяти.
bnl-start-mp-capsules=В сетевой игре каждый следующий игрок в первые 10 минут приземляется в своей капсуле в 100–200 клетках от лайнера; набор кладётся в неё через 5 минут в игре. Сначала найдите друг друга.
bnl-goals=Цели старта с BnL всегда закреплены наверху журнала BnL (кнопка BnL слева вверху). Эта настройка отключает только строку о новом этапе в чате. AUTO обидится, но молча.

