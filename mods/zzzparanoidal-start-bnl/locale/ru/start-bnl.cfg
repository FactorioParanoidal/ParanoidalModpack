journal-button=Журнал BnL — цели Протокола AUTO внутри
journal-title=Журнал BnL — «Всё, что нужно для счастья!»
journal-new=Новая запись в журнале: [font=default-bold]__1__[/font] (кнопка BnL вверху слева, команда /bnl-journal)
journal-command=Открыть журнал BnL.
cargo-burnt=Груз прогорел: −__1__
