[item-description]
bnl-flight-recorder=«Чёрный ящик» лайнера (на самом деле оранжевый: в сезоне 2105 года BnL объявила оранжевый новым чёрным). Поместите в лабораторию и изучите «Расшифровку бортового самописца».
bnl-antenna-part=Одна из трёх деталей аварийной антенны. Ищите в отсеках, отвалившихся от лайнера. Продаётся только комплектом, который не продаётся.
bnl-distress-beacon=Соберите из трёх деталей антенны и подайте питание, чтобы позвать на помощь. BnL гарантирует, что вас услышат. Помочь не гарантирует.
bnl-engineer-note=Мятый лист в масляных пятнах — единственный документ на планете, написанный не отделом маркетинга. Используйте, чтобы прочитать.
bnl-advertising-flyer=«Buy n Large — всё, что нужно для счастья!» Читать бесполезно, зато горит отлично: самая полезная продукция BnL на этой планете.
scrap=Перерабатывается в случайные детали: вручную или в переработчике.

