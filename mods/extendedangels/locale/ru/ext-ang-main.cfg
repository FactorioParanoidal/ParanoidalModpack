[mod-name]
extendedangels=Extended Angels (Расширения модов Энджела)

[mod-description]
extendedangels=Дополнительные уровни зданий и рецепты для модов Angels.\n\n— Новые уровни зданий обогащения, нефтехимии и биопереработки: фермы, водорослевые фермы, прессы, биопроцессоры, компостеры и многое другое.\n— Новые рецепты: аргон, вольфрамовые соединения, медь-вольфрамовый расплав, натриевые соли, титановобетонный кирпич и др.\n\nПомогает масштабировать производство Angels в поздней игре.

[mod-setting-name]
extangels-adjust-ordering=Настройка сортировки зданий
extangels-legacy-inventory-sizes=Устаревшие размеры инвентаря

[mod-setting-description]
extangels-adjust-ordering=Регулирует порядок иконок для зданий на вкладке Нефтехимическая переработка и в вкладках Биопроцессов.
extangels-legacy-inventory-sizes=Устанавливает размеры складов/логистических складов для использования устаревшего количества слотов:\n\n1: 1728/1900\n2: 3072/3378\n3: 4416/4856\n4: 6035/6336

[extendedangels-notifications]
legacy-inventory-sizes=Изменены значения по умолчанию для количества слотов складов и логистических складов, параметр "__1__" был добавлен для восстановления старых ячеек инвентаря при желании, или в случае рассыпания предметов на земле.

