[entity-name]
ore-radar=Ore Radar

[entity-description]
ore-radar=Reveals random generated chunks containing ore or other resources, at any distance on the same surface, picks up unusual signals or surveys uncharted land, depending on the mode chosen in its window. Needs power to complete a scan.

[item-name]
ore-radar=Ore Radar

[technology-name]
ore-radar=Ore Radar

[technology-description]
ore-radar=Reveals distant ore patches and other resources.

[ore-radar]
unusual-signal=Ore Radar picked up an unusual signal: __1__
mode-caption=Radar mode
mode-resources=Resources
mode-resources-tooltip=Each scan reveals a chunk with ore or other resources.
mode-signals=Unusual signals
mode-signals-tooltip=Each scan marks an undiscovered ruin. When no ruin is left on the surface, the scan reveals ore instead.
mode-signals-unavailable=Unavailable: the ruins mod is not loaded.
mode-survey=Geological survey
mode-survey-tooltip=Each scan marks on the map the nearest field of ore, oil or gas that the force has not charted yet, with its rough size. The mark disappears when the place is charted. When nothing is left, the scan reveals ore.
mode-survey-unavailable=Unavailable: RSO Reforged is not loaded.

[controls]
ore-radar-open=Open Ore Radar mode window
