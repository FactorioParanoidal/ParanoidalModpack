[mod-setting-description]
tankplatoon-tank-t0-grid=[item=tank] Задаёт базовый размер сетки оборудования для танков Paranoidal/Tank Platoon уровня T0; ванильный танк этой настройкой не меняется. У разных классов T0 сетка может отличаться от выбранной: размер корректируется по классу, а предметы в неё автоматически не устанавливаются.\n[color=#9cdcfe]По умолчанию: 5x4. После перезапуска игры.[/color]
tankplatoon-tank-t1-enable=[item=tank] Включает генерацию танков MK1 и их рецептов; при выключении танки MK2 также не генерируются, поскольку требуют MK1. Ванильный танк и пользовательские танки T0 остаются отдельными вариантами; включение не выдаёт танк или оборудование автоматически.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
tankplatoon-tank-t1-grid=[item=tank] Задаёт базовый размер сетки оборудования для танков MK1; ванильный танк и T0 не затрагиваются. Фактический размер может меняться по классу танка, а выбранный размер лишь задаёт место для установки — оборудование в сетку не добавляется.\n[color=#9cdcfe]По умолчанию: 7x7. После перезапуска игры.[/color]
tankplatoon-tank-t2-grid=[item=tank] Задаёт базовый размер сетки оборудования для танков MK2; ванильный танк, T0 и MK1 не затрагиваются. Сетка фактически корректируется по классу, а доступное место не означает, что оборудование уже установлено; MK2 создаются только при включённых MK1 и MK2.\n[color=#9cdcfe]По умолчанию: 10x10. После перезапуска игры.[/color]
tankplatoon-vehicle-battery-enable=[item=battery-equipment] Включает рецепты и разблокировку аккумуляторов для техники: они накапливают электричество для оборудования в сетке. Их нужно изготовить и установить вручную в совместимую сетку с достаточным местом; настройка не устанавливает их в танк.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
tankplatoon-vehicle-energy-shield-enable=[item=energy-shield-equipment] Включает рецепты и разблокировку энергетических щитов для техники: они поглощают урон, расходуя электричество из сетки. Щит нужно изготовить и установить вручную в совместимую сетку с достаточным местом; включение его не устанавливает.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
tankplatoon-vehicle-fuel-cell-enable=[item=solid-fuel] Включает генераторы-топливные ячейки для сетки техники: они сжигают химическое топливо и вырабатывают электричество для оборудования. Их нужно изготовить и установить в совместимую сетку; настройка не добавляет генератор в танк автоматически.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
tankplatoon-vehicle-nuclear-reactor-enable=[item=nuclear-reactor] Включает генератор для сетки техники, который сжигает ядерное топливо и вырабатывает электричество для оборудования. Его нужно изготовить и установить вручную в совместимую сетку с достаточным местом; включение не размещает его в танке.\n[color=#9cdcfe]По умолчанию: флажок установлен. После перезапуска игры.[/color]
