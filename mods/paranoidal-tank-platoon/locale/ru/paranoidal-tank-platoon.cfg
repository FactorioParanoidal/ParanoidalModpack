[technology-description]
Schall-tank=Подвижность, огневая мощь и броня вместе повышают шансы выжить во враждебном мире.
Schall-tank-H=В ответ на растущую угрозу со стороны инопланетной жизни разработан танк с увеличенной огневой мощью и бронёй. Крупнокалиберное орудие пробивает сильнее и уничтожает червей и гнёзда с большей дистанции.
Schall-tank-SH=Вершина танкостроения. Предельная броня даёт лучшие шансы выжить, а огромное орудие уничтожает неподвижные цели на большой дистанции.
Schall-tank-F=Простая установка огнемёта на шасси среднего танка.
Schall-sniper-rifle=Поражает врагов на очень большой дистанции.

