[mod-setting-description]
tankplatoon-tank-to-recipe-keep=Влияет только на рецепт, уже построенные танки остаются.
tankplatoon-tank-t2-enable=Требует танков MK1.
tankplatoon-tank-cannon-force-condition=Для всех снарядов 75, 88 и 128 мм.\n«Все»: (по умолчанию) попадают во всё, в том числе в союзников.\n«Не свои»: пролетают сквозь свои постройки.\n«Не дружественные»: пролетают сквозь союзные постройки.
tankplatoon-tank-autocannon-force-condition=«Все»: попадают во всё, в том числе в союзников.\n«Не свои»: пролетают сквозь свои постройки.\n«Не дружественные»: (по умолчанию) пролетают сквозь союзные постройки.
tankplatoon-personal-laser-defense-equipment-energy-consumption=Энергия на выстрел. Буфер оборудования увеличивается при необходимости.
tankplatoon-discharge-defense-equipment-automatic=Вкл: (по умолчанию) срабатывает автоматически.\nВыкл: как в ванилле, ручной запуск.
tankplatoon-tank-flamethrower-fire-stream-incendiary=Вкл: поджигает землю, как ручной огнемёт.\nВыкл: (по умолчанию) ванильная струя танка.
tankplatoon-vehicle-hide-resistances=Для ванильных автомобиля, танка и паукотрона и всех танков этого мода.\nВыкл: показывать сопротивления во всплывающей подсказке.
tankplatoon-minimap-representation=«Без изменений»: ванильный треугольник.\n«Общий»: ванильный треугольник с масштабом по размеру танка.\n«Танк»: отдельный значок танка с масштабом по размеру.
tankplatoon-vehicle-clone-placement-built-enable=Если строить транспорт, сидя в таком же, новый получит то же оборудование, топливо, боеприпасы и содержимое багажника. Предметы берутся из инвентаря и не заменяют уже имеющиеся.
tankplatoon-vehicle-clone-placement-pasted-enable=При вставке настроек с одного транспорта на другой цель получит то же оборудование, топливо, боеприпасы и содержимое багажника. Предметы берутся из инвентаря и не заменяют уже имеющиеся.

