[mod-setting-description]
tankplatoon-tank-to-recipe-keep=Only affects the recipe, existing tanks remain.
tankplatoon-tank-t2-enable=Requires tanks MK1.
tankplatoon-tank-cannon-force-condition=Applies to all 75, 88 and 128 mm shells.\n"All": (default) can hit everything including friendlies.\n"Not same": can fire over own force.\n"Not friend": can fire over friendlies.
tankplatoon-tank-autocannon-force-condition="All": can hit everything including friendlies.\n"Not same": can fire over own force.\n"Not friend": (default) can fire over friendlies.
tankplatoon-personal-laser-defense-equipment-energy-consumption=Energy per shot. The equipment buffer is enlarged if needed.
tankplatoon-discharge-defense-equipment-automatic=On: (default) triggers automatically.\nOff: vanilla, manual trigger.
tankplatoon-tank-flamethrower-fire-stream-incendiary=On: sets the ground on fire like the handheld flamethrower.\nOff: (default) vanilla tank stream.
tankplatoon-vehicle-hide-resistances=Affects the vanilla car, tank and spidertron and all tanks of this mod.\nOff: show resistances in the tooltip.
tankplatoon-minimap-representation="Unchanged": vanilla triangle.\n"Generic": vanilla triangle scaled with tank size.\n"Tank": dedicated tank icon scaled with tank size.
tankplatoon-vehicle-clone-placement-built-enable=When you build a vehicle while driving the same vehicle type, the new one gets the same equipment, fuel, ammo and trunk contents. Items are taken from your inventory and never replace existing ones.
tankplatoon-vehicle-clone-placement-pasted-enable=When you paste entity settings from one vehicle to another, the target gets the same equipment, fuel, ammo and trunk contents. Items are taken from your inventory and never replace existing ones.

