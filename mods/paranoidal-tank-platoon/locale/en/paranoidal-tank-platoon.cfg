[technology-description]
Schall-tank=Extra mobility, firepower and armor combined, allows a better survival in the hostile world.
Schall-tank-H=In response to growing threats from aliens, a tank with increased firepower and armor is developed. The high caliber cannon gives more penetration power and destroys worms and nests from a further position.
Schall-tank-SH=The ultimate tank, displays the cutting-edge military technology. Extreme armor gives the best chance of survival, and the enormous cannon destroys static targets at a long distance.
Schall-tank-F=Simple adaptation of flamethrower technology on chassis of a medium tank.
Schall-sniper-rifle=Eliminate enemies at very long range.

