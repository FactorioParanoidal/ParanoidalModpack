[mod-setting-description]
tankplatoon-tank-t0-grid=[item=tank] Sets the base equipment-grid size for Paranoidal/Tank Platoon T0 tanks; the vanilla tank is unaffected. Class-specific T0 grids may differ from the selected size because each class applies an adjustment, and equipment is not installed automatically.\n[color=#9cdcfe]Default: 5x4. Requires a game restart.[/color]
tankplatoon-tank-t1-enable=[item=tank] Enables generation of MK1 tanks and their recipes; with it off, MK2 tanks are not generated either because they depend on MK1. The vanilla tank and custom T0 tanks are separate options; enabling this does not grant a tank or equipment automatically.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
tankplatoon-tank-t1-grid=[item=tank] Sets the base equipment-grid size for MK1 tanks; the vanilla tank and T0 are unaffected. The actual size may vary by tank class; this setting provides fitting space but does not add equipment to the grid.\n[color=#9cdcfe]Default: 7x7. Requires a game restart.[/color]
tankplatoon-tank-t2-grid=[item=tank] Sets the base equipment-grid size for MK2 tanks; the vanilla tank, T0, and MK1 are unaffected. Class adjustments change the actual grid, and available space does not mean equipment is installed; MK2 are generated only when both MK1 and MK2 are enabled.\n[color=#9cdcfe]Default: 10x10. Requires a game restart.[/color]
tankplatoon-vehicle-battery-enable=[item=battery-equipment] Enables recipes and technology unlocks for vehicle batteries, which store electricity for grid equipment. Craft and fit them manually into a compatible grid with enough room; this setting does not install them in a tank.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
tankplatoon-vehicle-energy-shield-enable=[item=energy-shield-equipment] Enables recipes and technology unlocks for vehicle energy shields, which absorb damage using electricity from the grid. Craft and fit a shield manually into a compatible grid with enough room; enabling it does not install one.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
tankplatoon-vehicle-fuel-cell-enable=[item=solid-fuel] Enables fuel-cell generators for vehicle grids; they burn chemical fuel to produce electricity for equipment. Craft and fit one into a compatible grid; this setting does not add a generator to a tank automatically.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
tankplatoon-vehicle-nuclear-reactor-enable=[item=nuclear-reactor] Enables a vehicle-grid generator that burns nuclear fuel to provide electricity for equipment. Craft and fit it manually into a compatible grid with enough room; enabling it does not place it in a tank.\n[color=#9cdcfe]Default: checkbox checked. Requires a game restart.[/color]
