[entity-description]
maraxsis-a-breath-of-fresh-air=Generates infinite [fluid=maraxsis-atmosphere] and 5 MW at no cost.\nThis machine no longer functions after visiting [space-location=fulgora].
maraxsis-geothermal-generator=Uses disposable pipelines to inject water deep into the planet's crust and produce [fluid=maraxsis-supercritical-steam]. Must be placed on lava. Does not connect to normal pipes, requires ducts. Does not require electric energy.
maraxsis-diesel-submarine=Versatile vehicle that can explore the depths of the ocean. Can be driven with __CONTROL_MOVE__. Use __CONTROL__maraxsis-trench-submerge__ to descend to the trench.\nCan be automated to follow routes and automatically descend to the trench.
maraxsis-nuclear-submarine=Advanced nuclear submarine with a higher speed and more storage space. Can be driven with __CONTROL_MOVE__. Use __CONTROL__maraxsis-trench-submerge__ to descend to the trench.\nCan be automated to follow routes and automatically descend to the trench.
maraxsis-hydro-plant=Multi-purpose fluid handling unit built to handle extreme pressure. Place this in a deep sea trench or in space for four extra module slots. Can void any fluid.
maraxsis-pressure-dome=Enormous structure that protects your machines from the pressure of the deep sea. Requires constant [fluid=maraxsis-atmosphere] atmosphere to provide positive pressure. This fluid can be created for free inside a [entity=chemical-plant] on any planet except [planet=maraxsis].\nMachines outside a pressurized dome are flooded.
maraxsis-pressure-dome-collision=Enormous structure that protects your machines from the pressure of the deep sea. Requires constant [fluid=maraxsis-atmosphere] atmosphere to provide positive pressure.\nMachines outside a pressurized dome are flooded.
maraxsis-coral=An underwater biome with a high biodiversity of marine life.
maraxsis-fishing-tower=Automated fishery that attracts and catches fish. Requires [item=maraxsis-fish-food]. Must be placed on [tile=lowland-cream-red-underwater] coral reef tiles. Quality fish food yields quality fish.
maraxsis-regulator=Consumes [fluid=maraxsis-atmosphere] to provide positive pressure to the dome. See Factoriopedia for the atmosphere consumption rate. When powered, functions as an underwater [entity=roboport] and [entity=radar].
maraxsis-trench-duct=An extremely long and durable pipe that transfers fluids directly to the trench and back.\nMust be placed on [tile=maraxsis-trench-entrance].\nRequires [item=cliff-explosives] to clear a path.\nThis duct must be placed on the edge of the trench entrance, similar to [entity=offshore-pump].\n[img=utility/warning_icon] In order to get initial electricity in the trench, you must pump down [fluid=maraxsis-atmosphere]. [img=utility/warning_icon]
maraxsis-trench-duct-lower=An extremely long and durable pipe that transfers fluids directly to the trench and back.
maraxsis-conduit=Advanced beacon that can be placed on the seabed or on land. Has a huge coverage distance and can accept quality modules. Each placed conduit contributes only half as much distribution efficiency as the last.
maraxsis-polylplast=A conglomeration of millions of tiny animals.
maraxsis-oversized-steam-turbine=High efficiency regenerative steam turbine. Loses 2/sec [fluid=water]. [fluid=maraxsis-supercritical-steam] cannot be transferred in [entity=pipe], it can only be transferred through [entity=maraxsis-geothermal-generator], [entity=maraxsis-oversized-steam-turbine], and all variants of [entity=duct-small].
maraxsis-chimney=Found in [space-location=maraxsis-trench].

