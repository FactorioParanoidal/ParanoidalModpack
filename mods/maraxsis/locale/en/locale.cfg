maraxsis-saline-water=Water with at least 30 parts per thousand of salt. Place an [entity=offshore-pump] anywhere on [planet=maraxsis] to extract saline water.
maraxsis-brackish-water=Water with at least 1 part per thousand of salt. Can be electrolyzed into fresh water.
maraxsis-atmosphere=A mixture of gaseous oxygen and nitrogen. This fluid can be created for free inside a [entity=chemical-plant] on any planet except [planet=maraxsis].
maraxsis-supercritical-steam=High energy density steam generated in [entity=maraxsis-geothermal-generator] and consumed in [entity=maraxsis-oversized-steam-turbine]. Unlike normal fluids, it cannot be transferred in [entity=pipe]. Instead it can only be transferred through [entity=maraxsis-geothermal-generator], [entity=maraxsis-oversized-steam-turbine], and all variants of [entity=duct-small].
