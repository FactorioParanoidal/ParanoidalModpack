[technology-description]
maraxsis-omega_3=Preserve spoilable science packs with an adequate suppliment of omega-3 fatty acids.
maraxsis-promethium-quality=Increased quality from promethium science packs.
maraxsis-geothermal-energy=Inject water deep into the planet's crust to produce [fluid=maraxsis-supercritical-steam]. Use this steam to run powerful regenerative turbines.\n[img=utility/warning_icon] In order to get initial electricity in the trench, you must pump down [fluid=maraxsis-atmosphere]. [img=utility/warning_icon]
cargo-landing-pad-capacity=Advanced rocket control systems allow for accurate tracking of the cargo landing pad. Each level allows placement of an additional cargo landing pad.
hydraulic-science-pack=Allows research of the most advanced deepsea technologies. This science pack will lose one level of quality when launched from a rocket silo.
maraxsis-nuclear-submarine=Advanced nuclear submarine with a higher speed, bigger grid, and more storage space.
maraxsis-glassworking=Transparent material used to build windows and other structures. Its huge compressive strength allows it to be used in deepsea construction.
maraxsis-wyrm-confinement=Capture and contain the elusive wyrms of [planet=maraxsis]. Use their parts for scientific research.
maraxsis-hydro-plant=Process saline and brackish water into fresh water and salt crystal.
maraxsis-piscary=Create a sustainable fishery in the depths of [planet=maraxsis]. Quality fish food yields quality fish.
maraxsis-depth-charges=Create a new generation of explosive weaponry.
maraxsis-sonar=Uses sound waves to detect objects underwater. Can also be placed on land for a huge coverage distance.
maraxsis-deepsea-research=Experiment with various fluids to create higher quality science packs.
kr-quantum-computer=Highly specialized deepsea research computer designed to create higher quality science packs. Requires a large amount of energy.
maraxsis-project-seadragon=Use buoyancy to your advantage. Allows to build rocket silos underwater on [planet=maraxsis].
maraxsis-abyssal-diving-gear=Become the sub. Invent advanced equipment to generate oxygen and survive the pressure of [planet=maraxsis]. All effects stack with multiple pieces of equipment.
ducts=Design enormous pipeline systems with huge extent length and underground distance. Tungsten ducts can be placed on [tile=water] and [tile=lava]. The [entity=maraxsis-trench-duct] can transfer fluids directly to the [planet=maraxsis-trench].
maraxsis-liquid-atmosphere=Develop cryogenic freezing of [fluid=maraxsis-atmosphere] on [planet=aquilo]. Liquid atmosphere is one hundred times denser than the gaseous counterpart. Barrelling and unbarrelling this fluid must be done inside a [entity=cryogenic-plant].
sp-spidertron-automation=Enables automated vehicle patrols and automatic loading and unloading of submarines or spidertrons at docks. Enables automatic item logistics to [planet=maraxsis-trench] through use of the "Submerge" wait condition.
maraxsis-stone-centrifuging=A centrifugal process to filter trace uranium from stone.
maraxsis-glass-productivity=Increases yield for glassworking recipes.
legendary-quality=Allows to make legendary quality items. Can be researched either with [item=hydraulic-science-pack] or [item=cryogenic-science-pack].
maraxsis-casting=Allows casting of metals from lava. [fluid=lava] can be found in the [planet=maraxsis-trench] by submerging a submarine. Submarines are submerged with __CONTROL__maraxsis-trench-submerge__ while above [tile=maraxsis-trench-entrance].
lubricant-maraxsis-start=Slaughtering and liquefaction of maraxsis fish into lubricant. Used to reduce friction in high-speed machinery such as [entity=foundry].

