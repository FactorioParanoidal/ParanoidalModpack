maraxsis-geothermal-generator=Закачивает воду по одноразовым трубам глубоко в кору планеты и получает [fluid=maraxsis-supercritical-steam]. Ставится на лаву. С обычными трубами не соединяется, нужны трубопроводы. Электричество не потребляет.

