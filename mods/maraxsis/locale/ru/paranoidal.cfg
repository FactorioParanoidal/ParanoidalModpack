maraxsis-geothermal-energy=Закачивайте воду глубоко в кору планеты, чтобы получать [fluid=maraxsis-supercritical-steam]. Этот пар вращает мощные регенеративные турбины.\n[img=utility/warning_icon] Чтобы получить первое электричество в жёлобе, накачайте туда [fluid=maraxsis-atmosphere]. [img=utility/warning_icon]
