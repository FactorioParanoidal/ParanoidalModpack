maraxsis-glass-productivity=Повышает выход рецептов стеклоделия.
legendary-quality=Позволяет делать предметы легендарного качества. Исследуется пакетами [item=hydraulic-science-pack] или [item=cryogenic-science-pack].
maraxsis-casting=Позволяет отливать металлы из лавы. [fluid=lava] есть в [planet=maraxsis-trench]: туда опускается подводная лодка. Лодка погружается клавишей __CONTROL__maraxsis-trench-submerge__ над [tile=maraxsis-trench-entrance].
lubricant-maraxsis-start=Разделка рыбы Мараксиса и её сжижение в смазку. Смазка снижает трение в быстрых машинах, например [entity=foundry].

