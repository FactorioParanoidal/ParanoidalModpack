name: Modpack launchability
on:
  push:
    branches:
      - '**'
      - '!master'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  mod-provenance:
    permissions:
      contents: write
    name: Mod provenance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Check local mods against Mod Portal
        run: ./build.sh CheckModProvenance --maintain-mod-provenance
      - name: Commit updated provenance
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ -z "$(git status --porcelain -- mods-metadata)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- mods-metadata
          git commit -m "Update mod provenance expected state"
          git push origin "HEAD:${HEAD_BRANCH}"
  launchability:
    name: Modpack launchability
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
      - uses: actions/checkout@v4
      - name: Cache .nuke/temp, ~/.nuget/packages
        uses: actions/cache@v4
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}
      - name: Launch Factorio with current set of mods
        run: ./build.sh EnsureLaunchability
